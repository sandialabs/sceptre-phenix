version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current, in one weekly PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: chore
      include: scope
    # The branch-name hook in prek.toml rejects '/', Dependabot's default separator.
    pull-request-branch-name:
      separator: '-'
