name: Set up Go and protoc
description: >-
  Install the Go version from src/go/go.mod and a pinned protoc, and restore
  a Go module and build cache scoped to the calling job.

inputs:
  cache-key:
    description: >-
      Name for this job's Go cache. Jobs that compile different things (race
      tests, lint, release builds) keep separate caches so they don't
      overwrite each other.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: src/go/go.mod
        cache: false

    - name: Restore Go cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-${{ inputs.cache-key }}-${{ runner.os }}-${{ hashFiles('src/go/go.sum', 'examples/go/go.sum') }}
        restore-keys: go-${{ inputs.cache-key }}-${{ runner.os }}-

    - name: Install protoc
      shell: bash
      env:
        PROTOC_VERSION: '21.12'
        PROTOC_SHA256: 3a4c1e5f2516c639d3079b1586e703fc7bcfa2136d58bda24d1d54f949c315e8
      run: |
        zip="$RUNNER_TEMP/protoc.zip"
        curl -fsSLo "$zip" \
          "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
        echo "${PROTOC_SHA256}  ${zip}" | sha256sum -c -
        sudo unzip -q -o "$zip" -d /usr/local bin/protoc 'include/*'
        protoc --version
