name: Frontend

on:
  push:
    branches: ['**']
    paths:
      - 'src/js/**'
      - 'src/go/**'
      - 'docker/**'
      - 'Makefile'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'src/js/**'
      - 'src/go/**'
      - 'docker/**'
      - 'Makefile'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '24'

permissions:
  contents: read

jobs:
  # The e2e build and tests run only for a change that can affect the browser
  # tests (see src/js/e2e/README.md), a manual run or a new branch.
  changes:
    name: Detect browser changes
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.diff.outputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare with the base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          browser_path() {
            case "$1" in
              # A path git quotes (it holds a quote, a backslash or a
              # control character) is not matched below: count it.
              \"*) return 0 ;;
              src/js/test/*) return 1 ;;
              src/js/* | src/go/web/* | src/go/api/* | src/go/store/* | \
                src/go/cmd/* | src/go/types/builder/* | src/go/types/version/* | \
                Makefile | docker/* | .github/workflows/frontend.yml)
                return 0 ;;
              *) return 1 ;;
            esac
          }

          case "$EVENT" in
            pull_request) base=$PR_BASE ;;
            push) base=$BEFORE ;;
            *) base= ;;
          esac

          browser=true
          # The push of a new branch has no commit before it (all zeros).
          if [ -z "$base" ] || [ -z "${base//0/}" ]; then
            echo "No commit to compare with ($EVENT): running the browser tests."
          elif ! files=$(git -c core.quotePath=false diff --name-only --no-renames "$base" "$SHA"); then
            echo "Cannot compare $base with $SHA: running the browser tests."
          else
            browser=false
            while IFS= read -r file; do
              if [ -n "$file" ] && browser_path "$file"; then
                echo "Browser change: $file"
                browser=true
                break
              fi
            done <<< "$files"
            if [ "$browser" = false ]; then
              echo "No browser change between $base and $SHA."
            fi
          fi
          echo "browser=$browser" >> "$GITHUB_OUTPUT"
      # test-e2e runs in the Playwright image, which holds the browsers of one
      # Playwright version. That version must be the one in the e2e lockfile.
      - name: Check the Playwright image version
        run: |
          workflow=.github/workflows/frontend.yml
          lock=src/js/e2e/package-lock.json
          images=$(grep -oE 'mcr\.microsoft\.com/playwright:v[0-9A-Za-z._-]+@sha256:[0-9a-f]{64}' "$workflow" | sort -u)
          if [ -z "$images" ]; then
            echo "::error file=$workflow::No Playwright image pinned by tag and digest."
            exit 1
          fi
          status=0
          for pkg in @playwright/test playwright-core; do
            version=$(jq -r --arg p "node_modules/$pkg" '.packages[$p].version' "$lock")
            want="mcr.microsoft.com/playwright:v$version-noble"
            while IFS= read -r image; do
              if [ "${image%@*}" != "$want" ]; then
                echo "::error file=$workflow::${image%@*} does not match $pkg $version in $lock. Use $want and its digest."
                status=1
              fi
            done <<< "$images"
          done
          if [ "$status" = 0 ]; then
            echo "The Playwright image matches $lock: $images"
          fi
          exit "$status"

  test-js:
    name: Unit Tests (JS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/js/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check for unused code (knip)
        run: npm run knip
      - name: Run unit tests with coverage
        run: npm run test:coverage
      # Contract suites share workers, so they must pass in any order.
      - name: Run contract tests in random order
        run: npm run test:contract -- --sequence.shuffle
      # Coverage below the minimums in .github/coverage-minimums.json warns
      # but does not fail the job.
      - name: Summarize coverage
        if: ${{ !cancelled() && hashFiles('src/js/coverage/coverage-summary.json') != '' }}
        run: |
          node -e '
            const fs = require("node:fs");
            const t = require("./coverage/coverage-summary.json").total;
            const min = require("../../.github/coverage-minimums.json").js;
            const keys = ["lines", "statements", "functions", "branches"];
            const rows = keys.map(
              (k) => `| ${k} | ${t[k].pct}% | ${min[k]}% | ${t[k].covered} of ${t[k].total} |`,
            );
            const head = ["### JS coverage", "", "| Measure | Covered | Minimum | Count |", "|---|---:|---:|---:|"];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [...head, ...rows, ""].join("\n"));
            for (const k of keys.filter((k) => t[k].pct < min[k])) {
              console.log(`::warning title=JS coverage::${k} coverage is ${t[k].pct}%, below the minimum of ${min[k]}% in .github/coverage-minimums.json`);
            }
          '
      - name: Upload coverage
        if: ${{ !cancelled() && hashFiles('src/js/coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-js
          path: src/js/coverage/
          retention-days: 14

  build-e2e:
    # One phenix binary (which embeds the UI) for each auth mode. Without a
    # browser change every step skips, not the job, as in test-e2e.
    name: ${{ matrix.name }}
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: Build phenix (E2E)
            auth: disabled
          - name: Build phenix (E2E, auth enabled)
            auth: enabled
          - name: Build phenix (E2E, auth proxy)
            auth: proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.browser == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.browser == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/js/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.browser == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: src/go/go.sum
      - name: Install system dependencies
        if: needs.changes.outputs.browser == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y protobuf-compiler
      - name: Build UI
        if: needs.changes.outputs.browser == 'true'
        working-directory: src/js
        env:
          VITE_AUTH: ${{ matrix.auth }}
        run: |
          npm ci
          npm run build
      - name: Build phenix
        if: needs.changes.outputs.browser == 'true'
        # SKIP_UI keeps make from rebuilding the UI built above
        run: make bin/phenix SKIP_UI=1
      - name: Upload phenix
        if: needs.changes.outputs.browser == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phenix-e2e-${{ matrix.auth }}
          path: bin/phenix
          if-no-files-found: error
          retention-days: 1

  test-e2e:
    # Each entry starts its own phenix UI from the binary built above and runs one
    # part of the e2e suite, all in parallel.
    # Without a browser change every step skips, not the job, since a skipped
    # matrix job reports only its unexpanded name to required checks.
    name: E2E ${{ matrix.name }}
    needs: [changes, build-e2e]
    # Runs after the build, or after it was skipped, unless something failed.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    # About two times the slowest job seen (19 minutes, with a 15 minute npm ci
    # stall). A normal job takes 4 minutes. The limit stops a hung job.
    timeout-minutes: 40
    # The changes job checks that the image tag is the e2e lockfile's Playwright
    # version. Without a browser change no image is pulled.
    container: >-
      ${{ needs.changes.outputs.browser == 'true'
      && 'mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27'
      || '' }}
    env:
      # The server's base directory, which the tests can write: the Builder
      # file specs put the files a topology names there.
      E2E_BASE_DIR: /tmp/phenix-e2e-base
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Smoke 1/3
            id: smoke-1
            tests: --grep-invert @axe --shard=1/3
          - name: Smoke 2/3
            id: smoke-2
            tests: --grep-invert @axe --shard=2/3
          - name: Smoke 3/3
            id: smoke-3
            tests: --grep-invert @axe --shard=3/3
          - name: Axe scans
            id: axe
            tests: --grep @axe --project=chromium
          - name: Builder multi-user
            id: multi-user
            tests: builder-multi-user --project=chromium
            server: >-
              --jwt-signing-key e2e-multi-user
              --users 'e2e-admin:Testpass1!:Global Admin'
            multi_user: '1'
          - name: Auth enabled
            id: auth-enabled
            auth: enabled
            tests: auth-enabled
            server: >-
              --jwt-signing-key e2e-auth
              --users 'e2e-admin:Testpass1!:Global Admin'
          - name: Auth proxy
            id: auth-proxy
            auth: proxy
            tests: auth-proxy --project=chromium
            server: --jwt-signing-key proxy-jwt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.browser == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.browser == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/js/e2e/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.changes.outputs.browser == 'true'
        with:
          name: phenix-e2e-${{ matrix.auth || 'disabled' }}
          path: bin
      # The container runs steps in sh, so use POSIX redirects. Output left on
      # the step's pipe stops phenix when the step ends.
      - name: Start phenix UI
        if: needs.changes.outputs.browser == 'true'
        run: |
          chmod +x bin/phenix
          mkdir -p "$E2E_BASE_DIR"
          ./bin/phenix ui --store.endpoint bolt:///tmp/phenix-e2e.bdb \
            --base-dir.phenix "$E2E_BASE_DIR" \
            --listen-endpoint 127.0.0.1:3000 \
            ${{ matrix.server }} > /tmp/phenix-ui.log 2>&1 &
          # /version needs no sign-in, so it answers 200 in every auth mode.
          timeout 30 bash -c \
            'until curl -sf -o /dev/null http://127.0.0.1:3000/version; do sleep 1; done'
      - name: Install e2e dependencies
        if: needs.changes.outputs.browser == 'true'
        working-directory: src/js/e2e
        run: npm ci
      - name: Run e2e tests
        if: needs.changes.outputs.browser == 'true'
        working-directory: src/js/e2e
        env:
          # The container runs as root, and Firefox does not start as root
          # when HOME belongs to another user, as the runner's HOME does.
          HOME: /root
          E2E_MULTI_USER: ${{ matrix.multi_user }}
          E2E_AUTH_MODE: ${{ matrix.auth }}
        run: npx playwright test ${{ matrix.tests }}
      - name: Server log
        if: failure()
        run: tail -100 /tmp/phenix-ui.log
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts-${{ matrix.id }}
          path: src/js/e2e/test-results
