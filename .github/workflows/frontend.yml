name: Frontend

on:
  push:
    branches: ['**']
    paths:
      - 'src/js/**'
      - 'src/go/**'
      - 'docker/**'
      - 'Makefile'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'src/js/**'
      - 'src/go/**'
      - 'docker/**'
      - 'Makefile'
      - '.github/workflows/frontend.yml'

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '24'

permissions:
  contents: read

jobs:
  test-js:
    name: Unit Tests (JS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/js/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test

  build-e2e:
    name: Build phenix (E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/js/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: src/go/go.sum
      - name: Install system dependencies
        run: sudo apt-get update -q && sudo apt-get install -y protobuf-compiler
      - name: Build UI
        working-directory: src/js
        run: |
          npm ci
          VITE_AUTH=disabled npm run build
      - name: Build phenix
        # SKIP_UI keeps make from rebuilding the UI already built with VITE_AUTH=disabled
        run: make bin/phenix SKIP_UI=1
      - name: Upload phenix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phenix-e2e
          path: bin/phenix
          if-no-files-found: error
          retention-days: 1

  test-e2e:
    # Each entry starts its own phenix UI from the binary built above and runs
    # one part of the e2e suite, all in parallel. The default set is split
    # into shards, except the full axe scans (@axe), the longest tests, which
    # run on their own.
    name: E2E ${{ matrix.name }}
    needs: build-e2e
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Smoke 1/3
            id: smoke-1
            tests: --grep-invert @axe --shard=1/3
            server: --features builder-v2
          - name: Smoke 2/3
            id: smoke-2
            tests: --grep-invert @axe --shard=2/3
            server: --features builder-v2
          - name: Smoke 3/3
            id: smoke-3
            tests: --grep-invert @axe --shard=3/3
            server: --features builder-v2
          - name: Axe scans
            id: axe
            tests: --grep @axe
            server: --features builder-v2
          - name: Builder v2 feature off
            id: feature-off
            tests: builder-feature-off
            server: ''
            builder-v2: 'off'
          - name: Builder v2 sharing
            id: sharing
            tests: builder-sharing
            server: >-
              --features builder-v2 --jwt-signing-key e2e-sharing
              --users 'e2e-admin:Testpass1!:Global Admin'
            sharing: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/js/e2e/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phenix-e2e
          path: bin
      - name: Start phenix UI
        run: |
          chmod +x bin/phenix
          ./bin/phenix ui --store.endpoint bolt:///tmp/phenix-e2e.bdb \
            --listen-endpoint 127.0.0.1:3000 \
            ${{ matrix.server }} &> /tmp/phenix-ui.log &
          timeout 30 bash -c \
            'until curl -s -o /dev/null http://127.0.0.1:3000/api/v1/experiments; do sleep 1; done'
      - name: Install e2e dependencies
        working-directory: src/js/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox
      - name: Run e2e tests
        working-directory: src/js/e2e
        env:
          E2E_BUILDER_V2: ${{ matrix.builder-v2 }}
          E2E_SHARING: ${{ matrix.sharing }}
        run: npx playwright test ${{ matrix.tests }}
      - name: Server log
        if: failure()
        run: tail -100 /tmp/phenix-ui.log
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts-${{ matrix.id }}
          path: src/js/e2e/test-results
