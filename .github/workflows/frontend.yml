name: Frontend

# Vitest unit tests. e2e.yml runs the browser tests.
on:
  # Branches other than main run through pull_request only, so a push to an
  # open pull request starts one run, not two. workflow_dispatch runs a
  # branch that has no pull request.
  push:
    branches: [main]
    paths: &paths
      - 'src/js/**'
      # Files the unit tests read
      - 'schemas/**'
      - 'src/go/api/config/default/**'
      - 'src/go/types/builder/testdata/**'
      - 'src/go/types/version/schemas/**'
      - 'src/go/web/testdata/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    # closed: only to cancel this PR's runs (see concurrency); jobs skip it
    types: [opened, synchronize, reopened, closed]
    paths: *paths
  workflow_dispatch:

env:
  NODE_VERSION: '24'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  test-js:
    if: github.event.action != 'closed'
    name: Unit Tests (JS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/js/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check for unused code (knip)
        run: npm run knip
      - name: Run unit tests with coverage
        run: npm run test:coverage
      # Contract suites share workers, so they must pass in any order.
      - name: Run contract tests in random order
        run: npm run test:contract -- --sequence.shuffle
      # Coverage below the minimums in .github/coverage-minimums.json only warns.
      - name: Summarize coverage
        if: ${{ !cancelled() && hashFiles('src/js/coverage/coverage-summary.json') != '' }}
        run: |
          # The ${} expressions are JavaScript, so the shell must not expand them.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const t = require("./coverage/coverage-summary.json").total;
            const min = require("../../.github/coverage-minimums.json").js;
            const keys = ["lines", "statements", "functions", "branches"];
            const rows = keys.map(
              (k) => `| ${k} | ${t[k].pct}% | ${min[k]}% | ${t[k].covered} of ${t[k].total} |`,
            );
            const head = ["### JS coverage", "", "| Measure | Covered | Minimum | Count |", "|---|---:|---:|---:|"];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [...head, ...rows, ""].join("\n"));
            for (const k of keys.filter((k) => t[k].pct < min[k])) {
              console.log(`::warning title=JS coverage::${k} coverage is ${t[k].pct}%, below the minimum of ${min[k]}% in .github/coverage-minimums.json`);
            }
          '
      - name: Upload coverage
        if: ${{ !cancelled() && hashFiles('src/js/coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-js
          path: src/js/coverage/
          retention-days: 14
