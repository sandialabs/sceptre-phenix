name: Frontend

on:
  push:
    branches: ['**']
    paths:
      - 'src/js/**'
      - 'src/go/**'
      - 'docker/**'
      - 'Makefile'
      - 'scripts/api-docs.sh'
      - 'scripts/ci-start-phenix-ui.sh'
      - '.github/workflows/frontend.yml'
  pull_request:
    # closed: only to cancel this PR's runs (see concurrency); jobs skip it
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'src/js/**'
      - 'src/go/**'
      - 'docker/**'
      - 'Makefile'
      - 'scripts/api-docs.sh'
      - 'scripts/ci-start-phenix-ui.sh'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '24'
  # read by scripts/ci-start-phenix-ui.sh, Playwright and Lighthouse CI
  E2E_PORT: '3197'
  E2E_BASE_URL: http://127.0.0.1:3197

# each job grants only what it needs
permissions: {}

# a newer commit (or closing the PR) cancels runs still going for this PR or ref
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  # The e2e build and tests and perf run only for a change that can affect the
  # browser (see src/js/e2e/README.md), a manual run or a new branch.
  changes:
    if: github.event.action != 'closed'
    name: Detect browser changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      browser: ${{ steps.diff.outputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare with the base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          browser_path() {
            case "$1" in
              # A path git quotes (it holds a quote, a backslash or a
              # control character) is not matched below: count it.
              \"*) return 0 ;;
              src/js/test/*) return 1 ;;
              src/js/* | src/go/web/* | src/go/api/* | src/go/store/* | \
                src/go/cmd/* | src/go/types/version/* | \
                Makefile | docker/* | scripts/api-docs.sh | \
                scripts/ci-start-phenix-ui.sh | .github/workflows/frontend.yml)
                return 0 ;;
              *) return 1 ;;
            esac
          }

          case "$EVENT" in
            pull_request) base=$PR_BASE ;;
            push) base=$BEFORE ;;
            *) base= ;;
          esac

          browser=true
          # The push of a new branch has no commit before it (all zeros).
          if [ -z "$base" ] || [ -z "${base//0/}" ]; then
            echo "No commit to compare with ($EVENT): running the browser tests."
          elif ! files=$(git -c core.quotePath=false diff --name-only --no-renames "$base" "$SHA"); then
            echo "Cannot compare $base with $SHA: running the browser tests."
          else
            browser=false
            while IFS= read -r file; do
              if [ -n "$file" ] && browser_path "$file"; then
                echo "Browser change: $file"
                browser=true
                break
              fi
            done <<< "$files"
            if [ "$browser" = false ]; then
              echo "No browser change between $base and $SHA."
            fi
          fi
          echo "browser=$browser" >> "$GITHUB_OUTPUT"
      # test-e2e runs in the Playwright image, which holds the browsers of one
      # Playwright version. That version must be the one in the e2e lockfile.
      - name: Check the Playwright image version
        run: |
          workflow=.github/workflows/frontend.yml
          lock=src/js/e2e/package-lock.json
          images=$(grep -oE 'mcr\.microsoft\.com/playwright:v[0-9A-Za-z._-]+@sha256:[0-9a-f]{64}' "$workflow" | sort -u)
          if [ -z "$images" ]; then
            echo "::error file=$workflow::No Playwright image pinned by tag and digest."
            exit 1
          fi
          status=0
          for pkg in @playwright/test playwright-core; do
            version=$(jq -r --arg p "node_modules/$pkg" '.packages[$p].version' "$lock")
            want="mcr.microsoft.com/playwright:v$version-noble"
            while IFS= read -r image; do
              if [ "${image%@*}" != "$want" ]; then
                echo "::error file=$workflow::${image%@*} does not match $pkg $version in $lock. Use $want and its digest."
                status=1
              fi
            done <<< "$images"
          done
          if [ "$status" = 0 ]; then
            echo "The Playwright image matches $lock: $images"
          fi
          exit "$status"

  test-js:
    if: github.event.action != 'closed'
    name: Unit Tests (JS)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/js/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests with coverage
        run: npm run test:coverage
      # Coverage below the minimums in .github/coverage-minimums.json warns
      # but does not fail the job.
      - name: Summarize coverage
        if: ${{ !cancelled() && hashFiles('src/js/coverage/coverage-summary.json') != '' }}
        run: |
          node -e '
            const fs = require("node:fs");
            const t = require("./coverage/coverage-summary.json").total;
            const min = require("../../.github/coverage-minimums.json").js;
            const keys = ["lines", "statements", "functions", "branches"];
            const rows = keys.map(
              (k) => `| ${k} | ${t[k].pct}% | ${min[k]}% | ${t[k].covered} of ${t[k].total} |`,
            );
            const head = ["### JS coverage", "", "| Measure | Covered | Minimum | Count |", "|---|---:|---:|---:|"];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [...head, ...rows, ""].join("\n"));
            for (const k of keys.filter((k) => t[k].pct < min[k])) {
              console.log(`::warning title=JS coverage::${k} coverage is ${t[k].pct}%, below the minimum of ${min[k]}% in .github/coverage-minimums.json`);
            }
          '
      - name: Upload coverage
        if: ${{ !cancelled() && hashFiles('src/js/coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-js
          path: src/js/coverage/
          retention-days: 14

  build-e2e:
    # One phenix binary (which embeds the UI) for each auth mode; perf uses the
    # disabled one. Without a browser change every step skips, not the job.
    if: github.event.action != 'closed'
    name: ${{ matrix.name }}
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          # the API reference is built, as in releases
          - name: Build phenix (E2E)
            auth: disabled
          # the auth specs do not open the API reference, so it is not built
          - name: Build phenix (E2E, auth enabled)
            auth: enabled
            make: SKIP_API_DOCS=1
          - name: Build phenix (E2E, auth proxy)
            auth: proxy
            make: SKIP_API_DOCS=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.browser == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.browser == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/js/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.browser == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: src/go/go.sum
      - name: Install system dependencies
        if: needs.changes.outputs.browser == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y protobuf-compiler
      - name: Build UI
        if: needs.changes.outputs.browser == 'true'
        working-directory: src/js
        env:
          VITE_AUTH: ${{ matrix.auth }}
        run: |
          npm ci
          npm run build
      - name: Build phenix
        if: needs.changes.outputs.browser == 'true'
        # SKIP_UI keeps make from rebuilding the UI built above
        run: make bin/phenix SKIP_UI=1 ${{ matrix.make }}
      - name: Package build
        if: needs.changes.outputs.browser == 'true'
        # tar keeps the executable bit, which upload-artifact drops
        run: tar -cf phenix-build.tar bin/phenix src/js/dist
      - name: Upload build
        if: needs.changes.outputs.browser == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phenix-e2e-${{ matrix.auth }}
          path: phenix-build.tar
          if-no-files-found: error
          retention-days: 1

  test-e2e:
    # Without a browser change every step skips, not the job, since a skipped
    # matrix job reports only its unexpanded name to required checks.
    name: E2E ${{ matrix.name }}
    needs: [changes, build-e2e]
    # Runs after the build, or after it was skipped, unless something failed.
    if: ${{ !cancelled() && !failure() && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The changes job checks that the image tag is the e2e lockfile's Playwright
    # version. Without a browser change no image is pulled.
    container: >-
      ${{ needs.changes.outputs.browser == 'true'
      && 'mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27'
      || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The read-only specs need an empty store, so they get a server of
          # their own and the store specs split over two more.
          - name: Smoke 1/3
            id: smoke-1
            tests: --project=read-only
          - name: Smoke 2/3
            id: smoke-2
            tests: --project=store --project=firefox --no-deps --shard=1/2
          - name: Smoke 3/3
            id: smoke-3
            tests: --project=store --project=firefox --no-deps --shard=2/2
          # With E2E_AUTH_MODE set, playwright.config.js runs only that mode's
          # spec and health.spec.js.
          - name: Auth enabled
            id: auth-enabled
            auth: enabled
            server: >-
              --jwt-signing-key e2e-auth
              --users 'e2e-admin:Testpass1!:Global Admin'
          - name: Auth proxy
            id: auth-proxy
            auth: proxy
            tests: --project=auth-proxy
            server: --jwt-signing-key proxy-jwt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.browser == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.browser == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/js/e2e/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.changes.outputs.browser == 'true'
        with:
          name: phenix-e2e-${{ matrix.auth || 'disabled' }}
      - name: Unpack build
        if: needs.changes.outputs.browser == 'true'
        run: tar -xf phenix-build.tar && rm phenix-build.tar
      # The script sends phenix's output to the log, not the step's pipe,
      # which would stop phenix when the step ends.
      - name: Start phenix UI
        if: needs.changes.outputs.browser == 'true'
        run: ./scripts/ci-start-phenix-ui.sh /tmp/phenix-e2e.bdb /tmp/phenix-ui.log ${{ matrix.server }}
      - name: Install e2e dependencies
        if: needs.changes.outputs.browser == 'true'
        working-directory: src/js/e2e
        run: npm ci
      - name: Run e2e tests
        if: needs.changes.outputs.browser == 'true'
        working-directory: src/js/e2e
        env:
          # The container runs as root, and Firefox does not start as root
          # when HOME belongs to another user, as the runner's HOME does.
          HOME: /root
          E2E_AUTH_MODE: ${{ matrix.auth }}
        run: npx playwright test ${{ matrix.tests }}
      - name: Server log
        if: failure()
        run: tail -100 /tmp/phenix-ui.log
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts-${{ matrix.id }}
          path: src/js/e2e/test-results

  perf:
    if: github.event.action != 'closed' && needs.changes.outputs.browser == 'true'
    name: UI Performance (bundle budgets, Lighthouse)
    needs: [changes, build-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # finds and downloads the default branch's perf-summary artifact
      actions: read
    defaults:
      run:
        working-directory: src/js/perf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/js/perf/package-lock.json
      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phenix-e2e-disabled
      - name: Unpack build
        working-directory: .
        run: tar -xf phenix-build.tar && rm phenix-build.tar
      - name: Install perf tooling
        run: npm ci
      # The size and Lighthouse steps may fail without stopping the job, so
      # both always run and the summary covers both; "Check budgets" fails it.
      - name: Check bundle size budgets
        id: size
        continue-on-error: true
        run: npm run --silent size:json > size-limit.json
      - name: Start phenix UI
        id: server
        working-directory: .
        run: ./scripts/ci-start-phenix-ui.sh /tmp/phenix-perf.bdb /tmp/phenix-ui.log
      - name: Run Lighthouse CI
        id: lighthouse
        if: steps.server.outcome == 'success'
        continue-on-error: true
        run: npm run lighthouse
      - name: Find baseline
        # the newest unexpired perf-summary artifact from a push run on the
        # base branch: push runs are always on this repository's own branches,
        # never a fork's branch of the same name. Listing runs, not the
        # repository's artifacts, keeps other branches' artifacts from pushing
        # the baseline off the first page.
        id: baseline
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          run_id=""
          for id in $(gh api -X GET "repos/$REPO/actions/workflows/frontend.yml/runs" \
              -f branch="$BASE" -f event=push -f status=completed -F per_page=30 \
              --jq '.workflow_runs[].id'); do
            found="$(gh api "repos/$REPO/actions/runs/$id/artifacts?name=perf-summary" \
              --jq '[.artifacts[] | select(.expired | not)] | length')" || found=0
            if [ "$found" -gt 0 ]; then
              run_id="$id"
              break
            fi
          done
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download baseline
        if: always() && steps.baseline.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: perf-summary
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}
          path: src/js/perf/baseline
      - name: Summarize
        if: always()
        env:
          BASE: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          node summary.mjs --size size-limit.json \
            --assert .lighthouseci/assertion-results.json \
            --manifest lighthouse-results/manifest.json \
            --baseline baseline/perf-summary.json --base-ref "$BASE" \
            --out-md perf-summary.md --out-json perf-summary.json
      - name: Upload perf summary
        # kept 90 days: runs on the default branch are the baseline for later runs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-summary
          path: |
            src/js/perf/perf-summary.md
            src/js/perf/perf-summary.json
          retention-days: 90
          if-no-files-found: ignore
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: |
            src/js/perf/lighthouse-results
            src/js/perf/.lighthouseci
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
      - name: Check budgets
        if: always()
        env:
          SIZE_OUTCOME: ${{ steps.size.outcome }}
          LIGHTHOUSE_OUTCOME: ${{ steps.lighthouse.outcome }}
        run: |
          if ! node summary.mjs --check perf-summary.json; then
            exit 1
          fi
          # a fallback in case the summary missed a failed step
          if [ "$SIZE_OUTCOME" != success ] || [ "$LIGHTHOUSE_OUTCOME" != success ]; then
            echo "::error title=Perf budget::size-limit ($SIZE_OUTCOME) or Lighthouse ($LIGHTHOUSE_OUTCOME) failed; see their steps."
            exit 1
          fi
      - name: Server log
        if: failure()
        working-directory: .
        run: tail -100 /tmp/phenix-ui.log
