name: Fuzz

# Runs every native Go fuzz target (`make fuzz` in src/go) for a bounded time
# each, to find inputs the seed corpora and rapid properties miss.
on:
  schedule:
    - cron: '41 6 * * 2'
  workflow_dispatch:
    inputs:
      fuzztime:
        description: How long to fuzz each target (a Go duration, such as 30s or 5m)
        required: false
        default: '2m'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.24'

jobs:
  fuzz:
    name: Fuzz (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: src/go/go.sum
      - name: Install system dependencies
        run: sudo apt-get update -q && sudo apt-get install -y protobuf-compiler
      - name: Generate code
        working-directory: src/go
        run: make generate
      - name: Fuzz
        working-directory: src/go
        env:
          FUZZTIME: ${{ inputs.fuzztime || '2m' }}
        run: make fuzz
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-failures
          path: src/go/**/testdata/fuzz/
          retention-days: 30
