name: Podman

# Builds docker/Dockerfile with Podman and runs the result, so the image keeps
# working for Podman users. It runs on every push to main, but on a pull
# request only when the container files change. Nothing is published.
on:
  push:
    branches: [main]
  pull_request:
    # closed: only to cancel this PR's runs (see concurrency); jobs skip it
    types: [opened, synchronize, reopened, closed]
    paths:
      - '.dockerignore'
      - '.github/workflows/podman.yml'
      - 'docker/Dockerfile'
      - 'docker/build-webshark.sh'
      - 'docker/install-certs.sh'
      - 'podman/**'
      - 'scripts/api-docs.sh'
  schedule:
    - cron: '47 5 * * 1'
  workflow_dispatch:

env:
  MM_REV: latest

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  build-podman:
    if: github.event.action != 'closed'
    name: Build and Smoke Test Podman Image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Get short SHA
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - name: Free disk space
        # The image and its build stages do not fit next to the preinstalled toolchains.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - name: Build Podman image
        # Retry: the final stage downloads filebeat, vmdb2 and the Kali keyring.
        env:
          MM_MIN_REV: ${{ env.MM_REV }}
          PHENIX_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          SHA: ${{ env.sha }}
        run: |
          for attempt in 1 2 3; do
            echo "::group::podman build attempt ${attempt}"
            if podman build \
              -f docker/Dockerfile \
              --build-arg MM_MIN_REV="$MM_MIN_REV" \
              --build-arg PHENIX_COMMIT="$SHA" \
              --build-arg PHENIX_TAG=ci \
              --build-arg PHENIX_REPO="$PHENIX_REPO" \
              -t phenix-podman-ci \
              .; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "podman build attempt ${attempt} failed"
            sleep 30
          done
          echo "podman build failed after 3 attempts"
          exit 1
      - name: Smoke test the image
        run: |
          set -x
          podman run --rm phenix-podman-ci phenix version
          podman run --rm phenix-podman-ci phenix help > /dev/null
          podman run --rm phenix-podman-ci sh -c \
            'command -v phenix && glow --version && command -v filebeat && test -x /usr/bin/vmdb2 && test -f /opt/phenix/webshark/index.html'
          podman run --rm phenix-podman-ci python3 -c 'import minimega, phenix_apps'
      - name: Report image size
        run: podman images phenix-podman-ci
