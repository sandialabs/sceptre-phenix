name: Podman

# Builds docker/Dockerfile with Podman and runs the result, so the image keeps
# working for Podman users. Nothing is published: the image only ever exists
# on the runner.
on:
  push:
    branches: ['**']
    paths:
      - '.dockerignore'
      - '.github/workflows/podman.yml'
      - 'docker/Dockerfile'
      - 'podman/**'
  pull_request:
    paths:
      - '.dockerignore'
      - '.github/workflows/podman.yml'
      - 'docker/Dockerfile'
      - 'podman/**'
  schedule:
    - cron: '47 5 * * 1'
  workflow_dispatch:

env:
  MM_REV: master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-podman:
    name: Build and Smoke Test Podman Image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Get short SHA
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - name: Free disk space
        # The full image plus its build stages do not fit next to the runner's
        # preinstalled Android, .NET, and Haskell toolchains.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - name: Build Podman image
        # The final stage pulls external resources (filebeat, vmdb2, the Kali
        # keyring), so retry before failing the job on a flaky fetch.
        env:
          MM_MIN_REV: ${{ env.MM_REV }}
          PHENIX_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          SHA: ${{ env.sha }}
        run: |
          for attempt in 1 2 3; do
            echo "::group::podman build attempt ${attempt}"
            if podman build \
              -f docker/Dockerfile \
              --build-arg MM_MIN_REV="$MM_MIN_REV" \
              --build-arg PHENIX_COMMIT="$SHA" \
              --build-arg PHENIX_TAG=ci \
              --build-arg PHENIX_REPO="$PHENIX_REPO" \
              -t phenix-podman-ci \
              .; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "podman build attempt ${attempt} failed"
            sleep 30
          done
          echo "podman build failed after 3 attempts"
          exit 1
      - name: Smoke test the image
        run: |
          set -x
          podman run --rm phenix-podman-ci phenix version
          podman run --rm phenix-podman-ci phenix help > /dev/null
          podman run --rm phenix-podman-ci sh -c \
            'command -v phenix && command -v glow && command -v filebeat && test -x /usr/bin/vmdb2'
          podman run --rm phenix-podman-ci python3 -c 'import minimega, phenix_apps'
      - name: Report image size
        run: podman images phenix-podman-ci
