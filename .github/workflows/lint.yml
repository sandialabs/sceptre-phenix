name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '24'

jobs:
  prek:
    name: prek
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: src/go/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/js/package-lock.json
      - name: Install system dependencies
        # protobuf-compiler is needed by the go-generate hook in src/go/prek.toml,
        # which runs `make generate` before golangci-lint so the linter sees
        # generated code (protobuf bindings, RBAC policy, store mocks).
        run: sudo apt-get update -q && sudo apt-get install -y protobuf-compiler
      - name: Install frontend dependencies
        # node_modules is needed by the prettier/eslint hooks in
        # src/js/prek.toml, which run this project's own npm scripts.
        working-directory: src/js
        run: npm ci
      - name: Install prek
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/j178/prek/releases/download/v0.4.14/prek-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate prek config
        run: prek validate-config prek.toml
      - name: Run prek
        # The no-commit-to-branch hook exists to stop contributors from
        # committing straight to main/master locally. It rightfully fails on
        # push/PR branches that violate the naming rules, but it must be
        # skipped here once code has actually landed on main/master upstream,
        # otherwise every push to those branches would fail this check.
        env:
          PREK_SKIP: ${{ (github.ref == 'refs/heads/main') && 'no-commit-to-branch' || '' }}
        run: prek run --all-files --show-diff-on-failure
