name: Lint

on:
  # Branches other than main run through pull_request only, so a push to an
  # open pull request starts one run, not two. workflow_dispatch runs a
  # branch that has no pull request.
  push:
    branches: [main]
  pull_request:
    # closed: only to cancel this PR's runs (see concurrency); jobs skip it
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '24'

jobs:
  prek:
    if: github.event.action != 'closed'
    name: prek
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: src/go/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/js/package-lock.json
      - name: Install system dependencies
        # protoc: the go-generate hook runs `make generate` before golangci-lint
        run: sudo apt-get update -q && sudo apt-get install -y protobuf-compiler
      - name: Install frontend dependencies
        # node_modules: the prettier and eslint hooks run this project's npm scripts
        working-directory: src/js
        run: npm ci
      # Only main saves this cache, so pull requests do not fill the cache quota.
      - name: Restore prek and golangci-lint caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: lint-cache
        with:
          path: |
            ~/.cache/prek
            ~/.cache/golangci-lint
          key: lint-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('prek.toml', 'src/go/prek.toml', 'src/js/prek.toml', 'examples/go/prek.toml', 'src/go/go.sum', 'examples/go/go.sum', 'src/go/.golangci.yml') }}
          restore-keys: lint-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-
      - name: Install prek
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/j178/prek/releases/download/v0.4.14/prek-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate prek config
        run: prek validate-config prek.toml
      - name: Run prek
        env:
          # The hook guards local commits; code on main has already landed.
          PREK_SKIP: ${{ (github.ref == 'refs/heads/main') && 'no-commit-to-branch' || '' }}
        run: prek run --all-files --show-diff-on-failure
      - name: Save prek and golangci-lint caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.lint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/prek
            ~/.cache/golangci-lint
          key: ${{ steps.lint-cache.outputs.cache-primary-key }}
