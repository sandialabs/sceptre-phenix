name: Publish phenix Docker & Debian Packages
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['main']
  repository_dispatch:
    types: [apps-update]
env:
  MM_REV: master
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel an in-progress tag build (release), but do cancel stale
  # in-progress runs for the same branch/PR when new commits supersede them.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build-and-publish:
    name: Build and Publish Docker & Debian Packages
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Get short SHA
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/phenix
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
      - name: Build container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            MM_MIN_REV=${{ env.MM_REV }}
            PHENIX_COMMIT=${{ env.sha }}
            PHENIX_TAG=${{ steps.meta.outputs.version }}
            PHENIX_REPO=${{ github.event.pull_request.head.repo.full_name || github.repository }}
            APPS_REPO=github.com/${{ github.event_name == 'repository_dispatch' && github.event.client_payload.repo || 'sandialabs/sceptre-phenix-apps' }}
            APPS_BRANCH=main
          push: ${{ github.event_name != 'pull_request' }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}

      # Built right after the phenix image (its only dependency) and before
      # the slower Debian package build, so the JIT UI image is available
      # sooner rather than waiting on the .deb build/release steps.
      #
      # NOTE: this and the phenix build above intentionally use the default
      # (non-buildx-container) docker driver instead of
      # docker/setup-buildx-action + GHA layer caching. The JIT build's
      # `FROM $PHENIX_IMG` needs to resolve the phenix image that was just
      # `load: true`-ed into the local Docker engine (PR builds don't push to
      # the registry), and only the default driver shares that local image
      # store; the docker-container driver builds in an isolated BuildKit
      # instance that can't see it and would fail to resolve the image.
      - name: Docker meta for JIT UI
        id: meta-jit
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/phenix-jit-ui
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
      - name: Build JIT container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker/jit
          file: docker/jit/Dockerfile
          build-args: |
            PHENIX_REPO=${{ github.event.pull_request.head.repo.full_name || github.repository }}
            PHENIX_IMG=${{ fromJSON(steps.meta.outputs.json).tags[0] }}
            PHENIX_BRANCH=${{ github.head_ref || github.ref_name }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-jit.outputs.tags }}

      - name: Build Debian Package
        env:
          PHENIX_BUILD_IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: ./scripts/build-deb.sh

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phenix-deb-package
          path: build/deb/*.deb
          retention-days: 3

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" build/deb/*.deb --generate-notes
    outputs:
      image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}

  # Mirrors the Docker build so the Containerfile can't silently drift, then
  # runs the finished image to catch a container that builds but cannot start.
  # Nothing is published: the image only ever exists on the runner.
  build-podman:
    name: Build and Smoke Test Podman Image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Get short SHA
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - name: Free disk space
        # The full image plus its build stages do not fit next to the runner's
        # preinstalled Android, .NET, and Haskell toolchains.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - name: Build Podman image
        # The final stage pulls external resources (filebeat, vmdb2, the Kali
        # keyring), so retry before failing the job on a flaky fetch.
        env:
          MM_MIN_REV: ${{ env.MM_REV }}
          PHENIX_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          SHA: ${{ env.sha }}
        run: |
          for attempt in 1 2 3; do
            echo "::group::podman build attempt ${attempt}"
            if podman build \
              -f podman/Containerfile \
              --build-arg MM_MIN_REV="$MM_MIN_REV" \
              --build-arg PHENIX_COMMIT="$SHA" \
              --build-arg PHENIX_TAG=ci \
              --build-arg PHENIX_REPO="$PHENIX_REPO" \
              -t phenix-podman-ci \
              .; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "podman build attempt ${attempt} failed"
            sleep 30
          done
          echo "podman build failed after 3 attempts"
          exit 1
      - name: Smoke test the image
        run: |
          set -x
          podman run --rm phenix-podman-ci phenix version
          podman run --rm phenix-podman-ci phenix help
          podman run --rm phenix-podman-ci sh -c \
            'command -v phenix && command -v glow && command -v filebeat && test -x /usr/bin/vmdb2'
          podman run --rm phenix-podman-ci python3 -c 'import minimega, phenix_apps'
      - name: Report image size
        run: podman images phenix-podman-ci
