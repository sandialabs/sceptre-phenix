name: Packages

# Builds the phenix container images and Debian package. A push to any branch
# publishes ghcr.io/<owner>/<repo>/phenix:<branch>; pull requests only build
# and test. A v* tag push, or a manual run given a tag, publishes the release
# images and attaches the .deb to the GitHub release.
on:
  # Path filters do not apply to tag pushes, so releases always build.
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!**/prek.toml'
      - '!src/js/e2e/**'
      - '!src/js/test/**'
      - '!CODEOWNERS'
      - '!.github/**'
      - '.github/workflows/packages.yml'
  # Other workflows test pull request code; this one rebuilds only for packaging changes.
  pull_request:
    # closed: only to cancel this PR's runs (see concurrency); jobs skip it
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - '.dockerignore'
      - '.github/workflows/packages.yml'
      - 'Makefile'
      - 'docker/**'
      - 'scripts/**'
      - 'src/go/Makefile'
      - 'src/go/go.mod'
      - 'src/go/go.sum'
      - 'src/js/package.json'
      - 'src/js/package-lock.json'
  # Weekly uncached rebuild of main, for OS security updates the layer cache would keep.
  schedule:
    - cron: '17 5 * * 1'
  repository_dispatch:
    types: [apps-update]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rebuild and attach packages to (blank for the selected branch)
        type: string
        required: false

env:
  MM_REV: latest
  # A pushed v* tag, or the tag given to a manual run. Only a tag push moves `latest`.
  RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

permissions:
  contents: read

concurrency:
  group: packages-${{ inputs.tag || (github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number)) || github.ref }}
  # Never cancel a release build.
  cancel-in-progress: ${{ !(inputs.tag || github.ref_type == 'tag') }}

jobs:
  build:
    if: github.event.action != 'closed'
    name: Build images and Debian package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    outputs:
      image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve source refs
        # The apps head as a build arg rebuilds the cached apps layers when it changes.
        id: refs
        env:
          APPS_REPO: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.repo || 'sandialabs/sceptre-phenix-apps' }}
        run: |
          apps_ref=$(git ls-remote "https://github.com/${APPS_REPO}.git" refs/heads/main | cut -f1)
          if [[ -z "$apps_ref" ]]; then
            echo "::error::could not resolve the main branch of ${APPS_REPO}"
            exit 1
          fi
          {
            echo "sha=$(git rev-parse --short HEAD)"
            echo "apps-repo=${APPS_REPO}"
            echo "apps-ref=${apps_ref}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Docker Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/phenix
          tags: |
            type=ref,event=branch,enable=${{ !env.RELEASE_TAG }}
            type=sha,enable=${{ !env.RELEASE_TAG }}
            type=raw,value=${{ env.RELEASE_TAG }},enable=${{ !!env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref_type == 'tag' }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            MM_MIN_REV=${{ env.MM_REV }}
            PHENIX_COMMIT=${{ steps.refs.outputs.sha }}
            PHENIX_TAG=${{ env.RELEASE_TAG || steps.meta.outputs.version }}
            PHENIX_REPO=${{ github.event.pull_request.head.repo.full_name || github.repository }}
            APPS_REPO=github.com/${{ steps.refs.outputs.apps-repo }}
            APPS_BRANCH=main
            APPS_REF=${{ steps.refs.outputs.apps-ref }}
          tags: ${{ steps.meta.outputs.tags }}
          load: true
          provenance: false
          # Releases and the weekly rebuild start fresh.
          no-cache: ${{ github.event_name == 'schedule' || !!env.RELEASE_TAG }}
          cache-from: type=gha,scope=phenix
          cache-to: type=gha,mode=max,scope=phenix

      - name: Smoke test the image
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          SHA: ${{ steps.refs.outputs.sha }}
        run: |
          set -x
          docker run --rm "$IMAGE" phenix version | grep -F "(commit ${SHA})"
          docker run --rm "$IMAGE" phenix help > /dev/null
          docker run --rm "$IMAGE" sh -c \
            'glow --version && command -v filebeat && test -x /usr/bin/vmdb2 && ls /usr/local/bin/phenix-app-* /opt/phenix/downloads/tunneler/'
          docker run --rm "$IMAGE" python3 -c 'import minimega, phenix_apps'
          docker images "$IMAGE"

      - name: Push container image
        if: env.PUSH == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker push "$tag"
          done

      # Only the default builder sees the phenix image loaded above; this build is not cached.
      - name: Docker meta for JIT UI
        id: meta-jit
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/phenix-jit-ui
          tags: |
            type=ref,event=branch,enable=${{ !env.RELEASE_TAG }}
            type=sha,enable=${{ !env.RELEASE_TAG }}
            type=raw,value=${{ env.RELEASE_TAG }},enable=${{ !!env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref_type == 'tag' }}
      - name: Build JIT container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: default
          context: docker/jit
          file: docker/jit/Dockerfile
          build-args: |
            PHENIX_REPO=${{ github.event.pull_request.head.repo.full_name || github.repository }}
            PHENIX_IMG=${{ fromJSON(steps.meta.outputs.json).tags[0] }}
            PHENIX_BRANCH=${{ env.RELEASE_TAG || github.head_ref || github.ref_name }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta-jit.outputs.tags }}

      - name: Build Debian package
        env:
          PHENIX_BUILD_IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          PHENIX_VERSION: ${{ env.RELEASE_TAG }}
        run: ./scripts/build-deb.sh

      - name: Check Debian package
        run: |
          deb=$(echo build/deb/*.deb)
          version=$(dpkg-deb -f "$deb" Version)
          echo "Built ${deb} (version ${version})"
          if ! dpkg --validate-version "$version"; then
            echo "::error::unexpected Debian package version: ${version}"
            exit 1
          fi
          contents=$(dpkg-deb --contents "$deb")
          for path in ./usr/local/bin/phenix ./usr/local/bin/glow ./opt/phenix/downloads/tunneler/phenix-tunneler-linux-amd64; do
            grep -qE " ${path}\$" <<< "$contents" || { echo "::error::${path} is missing from ${deb}"; exit 1; }
          done

      - name: Upload .deb artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phenix-deb-package
          path: build/deb/*.deb
          retention-days: 3

  release:
    name: Attach Debian package to the release
    needs: build
    if: inputs.tag || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phenix-deb-package
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./*.deb --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" ./*.deb --generate-notes --verify-tag --repo "$GITHUB_REPOSITORY"
          fi
