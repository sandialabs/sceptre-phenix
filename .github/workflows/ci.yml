name: CI

on:
  push:
    branches: ['**']
    paths:
      - 'src/go/**'
      - 'Makefile'
      - 'scripts/api-docs.sh'
      - 'scripts/check-generated.sh'
      - '.github/workflows/ci.yml'
  pull_request:
    # closed: only to cancel this PR's runs (see concurrency); jobs skip it
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'src/go/**'
      - 'Makefile'
      - 'scripts/api-docs.sh'
      - 'scripts/check-generated.sh'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '24'

jobs:
  test-go:
    if: github.event.action != 'closed'
    name: Test (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: src/go/go.sum
      - name: Install system dependencies
        run: sudo apt-get update -q && sudo apt-get install -y protobuf-compiler
      - name: Generate code
        working-directory: src/go
        run: make generate
      - name: Run tests with coverage
        working-directory: src/go
        run: make test

  generated:
    if: github.event.action != 'closed'
    name: Reproducible generated outputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: src/go/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # scripts/api-docs.sh runs the pinned Redocly CLI through npx
          node-version: ${{ env.NODE_VERSION }}
      - name: Install system dependencies
        run: sudo apt-get update -q && sudo apt-get install -y protobuf-compiler
      - name: Check generated outputs
        # generates twice from scratch; fails on missing or non-deterministic
        # outputs and on changes to tracked or unignored files
        run: make check-generated
