name: CI

# Lint, test, and build checks. The `changes` job decides which areas a push
# or pull request touched, and each job runs only for its area; a change to
# this workflow, a push to main, or a manual run checks everything. `CI OK`
# summarizes the run for branch protection.
on:
  push:
    branches: ['**']
  pull_request:
    # closed: only to cancel the PR's in-progress run (see concurrency)
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.12'

jobs:
  changes:
    name: Detect changes
    # A same-repo PR is already checked by its branch's push run.
    if: >-
      github.event_name != 'pull_request'
      || (github.event.action != 'closed'
          && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.scope.outputs.all == 'true' || steps.filter.outputs.go == 'true' }}
      ui: ${{ steps.scope.outputs.all == 'true' || steps.filter.outputs.ui == 'true' }}
      binary: ${{ steps.scope.outputs.all == 'true' || steps.filter.outputs.binary == 'true' }}
      examples: ${{ steps.scope.outputs.all == 'true' || steps.filter.outputs.examples == 'true' }}
      docs: ${{ steps.scope.outputs.all == 'true' || steps.filter.outputs.docs == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            workflows:
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            go:
              - 'src/go/**'
              - 'Makefile'
            ui:
              - 'src/js/**'
            binary:
              - 'src/go/**'
              - 'src/js/**'
              - 'Makefile'
            examples:
              - 'examples/**'
              - 'src/go/**'
            docs:
              - 'docs/**'
              - 'src/go/web/public/docs/openapi.yml'
              - 'src/go/types/version/schemas/v2.yaml'
      - name: Check whether to run everything
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          WORKFLOWS: ${{ steps.filter.outputs.workflows }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || [ "$REF" = refs/heads/main ] || [ "$WORKFLOWS" = true ]; then
            echo "all=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/js/package-lock.json
      - name: Install frontend dependencies
        # node_modules is needed by the prettier/eslint hooks in
        # src/js/prek.toml, which run this project's own npm scripts.
        working-directory: src/js
        run: npm ci
      - uses: ./.github/actions/setup-prek
        with:
          cache-key: lint
      - name: Run prek
        # The Go projects run in the Lint (Go) job. The no-commit-to-branch
        # hook guards local commits to main, so it's skipped once code has
        # landed there.
        run: |
          skip=(--skip src/go/ --skip examples/go/)
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            skip+=(--skip no-commit-to-branch)
          fi
          prek run --all-files --show-diff-on-failure "${skip[@]}"

  lint-go:
    name: Lint (Go)
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.examples == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-key: lint
      - uses: ./.github/actions/setup-prek
        with:
          cache-key: lint-go
      - name: Restore golangci-lint cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('src/go/go.sum', 'src/go/.golangci.yml') }}
          restore-keys: golangci-lint-${{ runner.os }}-
      - name: Run prek
        # go-generate runs first so golangci-lint sees the generated code.
        run: prek run --all-files --show-diff-on-failure src/go/ examples/go/

  go:
    name: Test (Go)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-key: test
      - name: Generate code
        working-directory: src/go
        run: make generate
      - name: Run tests
        working-directory: src/go
        run: make test GOTESTFLAGS=-coverprofile=coverage.out
      - name: Report coverage
        working-directory: src/go
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $NF}')
          echo "Go test coverage: ${total}" >> "$GITHUB_STEP_SUMMARY"

  build:
    # One binary per UI auth mode; the e2e jobs below each test one.
    name: Build (${{ matrix.auth }} auth)
    needs: changes
    if: needs.changes.outputs.binary == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        auth: [disabled, enabled, proxy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/js/package-lock.json
      - uses: ./.github/actions/setup-go
        with:
          cache-key: build
      - name: Build UI
        working-directory: src/js
        env:
          VITE_AUTH: ${{ matrix.auth }}
        run: |
          npm ci
          npm run build
      - name: Build phenix
        # SKIP_UI keeps make from rebuilding the UI built above
        run: make bin/phenix SKIP_UI=1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phenix-${{ matrix.auth }}
          path: bin/phenix
          if-no-files-found: error
          retention-days: 1

  unit-js:
    name: Unit Tests (JS)
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/js/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test

  e2e:
    name: E2E (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            auth: disabled
          - name: auth enabled
            auth: enabled
            jwt-key: e2e
            users: 'e2e-admin:Testpass1!:Global Admin'
            tests: auth-enabled
          - name: auth proxy
            auth: proxy
            jwt-key: proxy-jwt
            tests: auth-proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/js/e2e/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phenix-${{ matrix.auth }}
          path: bin
      - name: Start phenix UI
        env:
          JWT_KEY: ${{ matrix.jwt-key }}
          USERS: ${{ matrix.users }}
        run: |
          chmod +x bin/phenix
          args=(--store.endpoint bolt:///tmp/phenix-e2e.bdb --listen-endpoint 127.0.0.1:3000)
          if [ -n "$JWT_KEY" ]; then args+=(--jwt-signing-key "$JWT_KEY"); fi
          if [ -n "$USERS" ]; then args+=(--users "$USERS"); fi
          ./bin/phenix ui "${args[@]}" &> /tmp/phenix-ui.log &
          # Any HTTP response means it's up; with auth enabled the API answers 401.
          timeout 30 bash -c \
            'until curl -s -o /dev/null http://127.0.0.1:3000/api/v1/experiments; do sleep 1; done'
      - name: Install e2e dependencies
        working-directory: src/js/e2e
        run: npm ci
      - name: Restore Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('src/js/e2e/package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: src/js/e2e
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: src/js/e2e
        run: npx playwright install-deps chromium
      - name: Run e2e tests
        working-directory: src/js/e2e
        env:
          E2E_AUTH_MODE: ${{ matrix.auth }}
          TESTS: ${{ matrix.tests }}
        run: npx playwright test ${TESTS:+"$TESTS"}
      - name: Server log
        if: failure()
        run: tail -100 /tmp/phenix-ui.log
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts-${{ matrix.auth }}
          path: src/js/e2e/test-results

  examples-go:
    name: Examples (Go)
    needs: changes
    if: needs.changes.outputs.examples == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-key: examples
      - name: Build and test the Go example
        run: make example-go

  examples-python:
    name: Examples (Python)
    needs: changes
    if: needs.changes.outputs.examples == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: examples/python/requirements.txt
      - name: Install dependencies
        run: make -C examples install-dev
      - name: Build and test the Python example
        run: make example-python

  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build API documentation
        working-directory: .
        run: |
          npx --yes @redocly/cli@2.53.2 build-docs \
            src/go/web/public/docs/openapi.yml \
            --output="$RUNNER_TEMP/swagger.html" \
            --title='phenix API'
      - name: Build documentation
        run: mkdocs build --strict

  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, lint, lint-go, go, build, unit-js, e2e, examples-go, examples-python, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
