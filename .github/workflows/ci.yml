name: CI

on:
  push:
    branches: ['**']
    paths:
      - 'src/go/**'
      - 'src/js/src/builder/schema/**'
      - 'docs/content/builder/error-codes.md'
      # The Go tests read the Builder examples of the docs.
      - 'docs/content/builder/examples/**'
      - 'Makefile'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/go/**'
      - 'src/js/src/builder/schema/**'
      - 'docs/content/builder/error-codes.md'
      - 'docs/content/builder/examples/**'
      - 'Makefile'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.24'

jobs:
  test-go:
    name: Test (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: src/go/go.sum
      - name: Install system dependencies
        run: sudo apt-get update -q && sudo apt-get install -y protobuf-compiler
      - name: Generate code
        working-directory: src/go
        run: make generate
      - name: Check the Builder schema bundle and codes table are current
        run: |
          generated="src/js/src/builder/schema docs/content/builder/error-codes.md"
          if [ -n "$(git status --porcelain -- $generated)" ]; then
            git diff -- $generated
            echo "::error::$generated differ from the Go builder schema and codes: run make generate in src/go and commit the result"
            exit 1
          fi
      - name: Run tests with coverage
        working-directory: src/go
        run: make test-cover
      - name: Check for dead code
        working-directory: src/go
        run: make deadcode
      # Coverage below the minimum in .github/coverage-minimums.json warns
      # but does not fail the job.
      - name: Summarize coverage
        if: ${{ !cancelled() && hashFiles('src/go/coverage.out') != '' }}
        working-directory: src/go
        run: |
          total=$(go tool cover -func=coverage.out | tail -n 1 | awk '{print $NF}' | tr -d %)
          min=$(jq -r .go ../../.github/coverage-minimums.json)
          {
            echo '### Go coverage'
            echo
            echo "Total statements: ${total}% (minimum ${min}%)"
          } >> "$GITHUB_STEP_SUMMARY"
          if awk -v t="$total" -v m="$min" 'BEGIN { exit !(t < m) }'; then
            echo "::warning title=Go coverage::Statement coverage is ${total}%, below the minimum of ${min}% in .github/coverage-minimums.json"
          fi
      - name: Upload coverage
        if: ${{ !cancelled() && hashFiles('src/go/coverage.out') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-go
          path: src/go/coverage.out
          retention-days: 14
