name: Examples

# ci.yml checks the Go example with the Go tests.
on:
  push:
    branches: ['**']
    paths: &paths
      - 'examples/python/**'
      - 'examples/Makefile'
      - '.github/workflows/examples.yml'
  pull_request:
    # closed: only to cancel this PR's runs (see concurrency); jobs skip it
    types: [opened, synchronize, reopened, closed]
    paths: *paths
  repository_dispatch:
    types: [apps-update]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  check-python-example:
    if: github.event.action != 'closed'
    name: Check the Python example
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: examples/python/requirements.txt
      - name: Install Python dependencies
        run: make -C examples install-dev
      - name: Run Python Example Check
        run: make example-python
