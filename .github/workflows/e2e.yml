name: E2E

# Runs only for a change that can affect the browser tests (see
# src/js/e2e/README.md).
on:
  push:
    branches: ['**', '!dependabot/**']
    paths: &paths
      - 'src/js/**'
      - '!src/js/test/**'
      - 'src/go/web/**'
      - 'src/go/api/**'
      - 'src/go/store/**'
      - 'src/go/cmd/**'
      - 'src/go/types/builder/**'
      - 'src/go/types/version/**'
      - 'src/go/go.mod'
      - 'src/go/go.sum'
      - 'Makefile'
      - 'docker/**'
      - 'scripts/api-docs.sh'
      - 'scripts/ci-start-phenix-ui.sh'
      - '.github/workflows/e2e.yml'
  pull_request:
    # closed: only to cancel this PR's runs (see concurrency); jobs skip it
    types: [opened, synchronize, reopened, closed]
    paths: *paths
  workflow_dispatch:

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '24'
  # read by scripts/ci-start-phenix-ui.sh, Playwright and Lighthouse CI
  E2E_PORT: '3197'
  E2E_BASE_URL: http://127.0.0.1:3197

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.action != 'closed'
    name: Build phenix (E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test jobs run in the Playwright image, which holds the browsers of
      # one Playwright version. That version must be the one in the e2e lockfile.
      - name: Check the Playwright image version
        run: |
          workflow=.github/workflows/e2e.yml
          lock=src/js/e2e/package-lock.json
          images=$(grep -oE 'mcr\.microsoft\.com/playwright:v[0-9A-Za-z._-]+@sha256:[0-9a-f]{64}' "$workflow" | sort -u)
          if [ -z "$images" ]; then
            echo "::error file=$workflow::No Playwright image pinned by tag and digest."
            exit 1
          fi
          status=0
          for pkg in @playwright/test playwright-core; do
            version=$(jq -r --arg p "node_modules/$pkg" '.packages[$p].version' "$lock")
            want="mcr.microsoft.com/playwright:v$version-noble"
            while IFS= read -r image; do
              if [ "${image%@*}" != "$want" ]; then
                echo "::error file=$workflow::${image%@*} does not match $pkg $version in $lock. Use $want and its digest."
                status=1
              fi
            done <<< "$images"
          done
          if [ "$status" = 0 ]; then
            echo "The Playwright image matches $lock: $images"
          fi
          exit "$status"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/js/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: src/go/go.sum
      - name: Install system dependencies
        run: sudo apt-get update -q && sudo apt-get install -y protobuf-compiler
      - name: Install UI dependencies
        working-directory: src/js
        run: npm ci
      # One phenix binary (which embeds the UI) for each auth mode. SKIP_UI
      # keeps make from rebuilding the UI built just before it. Only the
      # disabled build renders the API reference: the auth specs do not open it.
      # It builds last, so src/js/dist holds the UI that perf measures.
      - name: Build phenix for each auth mode
        run: |
          mkdir -p e2e-bin
          for auth in enabled proxy disabled; do
            echo "::group::VITE_AUTH=$auth"
            (cd src/js && VITE_AUTH=$auth npm run build)
            if [ "$auth" = disabled ]; then
              make bin/phenix SKIP_UI=1
            else
              make bin/phenix SKIP_UI=1 SKIP_API_DOCS=1
            fi
            mv bin/phenix "e2e-bin/phenix-$auth"
            echo "::endgroup::"
          done
      - name: Package build
        # tar keeps the executable bit, which upload-artifact drops
        run: tar -cf phenix-e2e.tar e2e-bin src/js/dist
      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phenix-e2e
          path: phenix-e2e.tar
          if-no-files-found: error
          retention-days: 1

  test:
    name: E2E ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    # About two times the slowest job seen (19 minutes, with a 15 minute npm ci stall).
    timeout-minutes: 40
    # The build job checks that this tag is the e2e lockfile's Playwright version.
    container: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    env:
      # The server's base directory, where the Builder file specs put the files a topology names.
      E2E_BASE_DIR: /tmp/phenix-e2e-base
    strategy:
      fail-fast: false
      matrix:
        include:
          # The read-only specs need an empty store, so they get a server of
          # their own and the store specs split over two more.
          - name: Smoke 1/3
            id: smoke-1
            tests: --project=read-only --grep-invert @axe
          - name: Smoke 2/3
            id: smoke-2
            tests: --project=store --project=builder --no-deps --grep-invert @axe --shard=1/2
          - name: Smoke 3/3
            id: smoke-3
            tests: --project=store --project=builder --no-deps --grep-invert @axe --shard=2/2
          # Firefox runs one test at a time, in a job of its own.
          - name: Firefox
            id: firefox
            tests: --project=firefox --no-deps --grep-invert @axe
          # The @axe scans run in Chromium only.
          - name: Axe scans
            id: axe
            tests: --grep @axe --project=read-only --project=store --project=builder --no-deps
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/js/e2e/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phenix-e2e
      - name: Unpack build
        run: tar -xf phenix-e2e.tar && rm phenix-e2e.tar
      # scripts/ci-start-phenix-ui.sh starts bin/phenix. It sends the output to
      # the log, not the step's pipe, which would stop phenix when the step ends.
      - name: Start phenix UI
        run: |
          mkdir -p bin "$E2E_BASE_DIR"
          ln -sf ../e2e-bin/phenix-disabled bin/phenix
          ./scripts/ci-start-phenix-ui.sh /tmp/phenix-e2e.bdb /tmp/phenix-ui.log \
            --base-dir.phenix "$E2E_BASE_DIR"
      - name: Install e2e dependencies
        working-directory: src/js/e2e
        run: npm ci
      - name: Run e2e tests
        working-directory: src/js/e2e
        env:
          # The container runs as root, and Firefox does not start as root
          # when HOME belongs to another user, as the runner's HOME does.
          HOME: /root
        run: npx playwright test ${{ matrix.tests }}
      - name: Server log
        if: failure()
        run: tail -100 /tmp/phenix-ui.log
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts-${{ matrix.id }}
          path: src/js/e2e/test-results

  # Specs that need their own server flags. Each one runs a few seconds, so
  # they share one job and run one after another.
  servers:
    name: E2E Auth and multi-user
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    defaults:
      run:
        working-directory: src/js/e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/js/e2e/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phenix-e2e
      - name: Install e2e dependencies
        id: deps
        run: |
          tar -xf "$GITHUB_WORKSPACE"/phenix-e2e.tar -C "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE"/bin
          npm ci
      # Each step starts its own server, with its own binary, port, socket,
      # store and base directory. bin/phenix links to the binary that
      # scripts/ci-start-phenix-ui.sh starts. With E2E_AUTH_MODE set,
      # playwright.config.js runs only that mode's spec and health.spec.js.
      - name: Run auth-enabled tests
        env:
          HOME: /root
          E2E_AUTH_MODE: enabled
          E2E_PORT: '3197'
          E2E_BASE_URL: http://127.0.0.1:3197
        run: |
          ln -sf ../e2e-bin/phenix-enabled "$GITHUB_WORKSPACE"/bin/phenix
          mkdir -p /tmp/phenix-base-enabled
          "$GITHUB_WORKSPACE"/scripts/ci-start-phenix-ui.sh \
            /tmp/phenix-enabled.bdb /tmp/phenix-ui-enabled.log \
            --base-dir.phenix /tmp/phenix-base-enabled \
            --unix-socket /tmp/phenix-enabled.sock \
            --jwt-signing-key e2e-auth \
            --users 'e2e-admin:Testpass1!:Global Admin'
          npx playwright test --output test-results/auth-enabled
      - name: Run auth-proxy tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          HOME: /root
          E2E_AUTH_MODE: proxy
          E2E_PORT: '3198'
          E2E_BASE_URL: http://127.0.0.1:3198
        run: |
          ln -sf ../e2e-bin/phenix-proxy "$GITHUB_WORKSPACE"/bin/phenix
          mkdir -p /tmp/phenix-base-proxy
          "$GITHUB_WORKSPACE"/scripts/ci-start-phenix-ui.sh \
            /tmp/phenix-proxy.bdb /tmp/phenix-ui-proxy.log \
            --base-dir.phenix /tmp/phenix-base-proxy \
            --unix-socket /tmp/phenix-proxy.sock \
            --jwt-signing-key proxy-jwt
          npx playwright test --project=auth-proxy --output test-results/auth-proxy
      - name: Run Builder multi-user tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          HOME: /root
          E2E_MULTI_USER: '1'
          E2E_PORT: '3199'
          E2E_BASE_URL: http://127.0.0.1:3199
        run: |
          ln -sf ../e2e-bin/phenix-disabled "$GITHUB_WORKSPACE"/bin/phenix
          mkdir -p /tmp/phenix-base-multi-user
          "$GITHUB_WORKSPACE"/scripts/ci-start-phenix-ui.sh \
            /tmp/phenix-multi-user.bdb /tmp/phenix-ui-multi-user.log \
            --base-dir.phenix /tmp/phenix-base-multi-user \
            --unix-socket /tmp/phenix-multi-user.sock \
            --jwt-signing-key e2e-multi-user \
            --users 'e2e-admin:Testpass1!:Global Admin'
          npx playwright test builder-multi-user --project=builder --no-deps --output test-results/multi-user
      - name: Server logs
        if: failure()
        run: |
          for log in /tmp/phenix-ui-*.log; do
            echo "== $log"
            tail -100 "$log"
          done
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts-servers
          path: src/js/e2e/test-results

  perf:
    name: UI Performance (bundle budgets, Lighthouse)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # finds and downloads the default branch's perf-summary artifact
      actions: read
    defaults:
      run:
        working-directory: src/js/perf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/js/perf/package-lock.json
      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phenix-e2e
      - name: Unpack build
        working-directory: .
        run: |
          tar -xf phenix-e2e.tar && rm phenix-e2e.tar
          mkdir -p bin
          ln -sf ../e2e-bin/phenix-disabled bin/phenix
      - name: Install perf tooling
        run: npm ci
      # The size and Lighthouse steps may fail without stopping the job, so
      # both always run and the summary covers both; "Check budgets" fails it.
      - name: Check bundle size budgets
        id: size
        continue-on-error: true
        run: npm run --silent size:json > size-limit.json
      - name: Start phenix UI
        id: server
        working-directory: .
        run: ./scripts/ci-start-phenix-ui.sh /tmp/phenix-perf.bdb /tmp/phenix-ui.log
      - name: Run Lighthouse CI
        id: lighthouse
        if: steps.server.outcome == 'success'
        continue-on-error: true
        run: npm run lighthouse
      - name: Find baseline
        # the newest unexpired perf-summary artifact from a push run of this
        # workflow on the base branch: push runs are always on this repository's
        # own branches, never a fork's branch of the same name. Listing runs, not
        # the repository's artifacts, keeps other branches' artifacts from
        # pushing the baseline off the first page.
        id: baseline
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          run_id=""
          for id in $(gh api -X GET "repos/$REPO/actions/workflows/e2e.yml/runs" \
              -f branch="$BASE" -f event=push -f status=completed -F per_page=30 \
              --jq '.workflow_runs[].id'); do
            found="$(gh api "repos/$REPO/actions/runs/$id/artifacts?name=perf-summary" \
              --jq '[.artifacts[] | select(.expired | not)] | length')" || found=0
            if [ "$found" -gt 0 ]; then
              run_id="$id"
              break
            fi
          done
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download baseline
        if: always() && steps.baseline.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: perf-summary
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}
          path: src/js/perf/baseline
      - name: Summarize
        if: always()
        env:
          BASE: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          node summary.mjs --size size-limit.json \
            --assert .lighthouseci/assertion-results.json \
            --manifest lighthouse-results/manifest.json \
            --baseline baseline/perf-summary.json --base-ref "$BASE" \
            --out-md perf-summary.md --out-json perf-summary.json
      - name: Upload perf summary
        # kept 90 days: runs on the default branch are the baseline for later runs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-summary
          path: |
            src/js/perf/perf-summary.md
            src/js/perf/perf-summary.json
          retention-days: 90
          if-no-files-found: ignore
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: |
            src/js/perf/lighthouse-results
            src/js/perf/.lighthouseci
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
      - name: Check budgets
        if: always()
        env:
          SIZE_OUTCOME: ${{ steps.size.outcome }}
          LIGHTHOUSE_OUTCOME: ${{ steps.lighthouse.outcome }}
        run: |
          if ! node summary.mjs --check perf-summary.json; then
            exit 1
          fi
          # a fallback in case the summary missed a failed step
          if [ "$SIZE_OUTCOME" != success ] || [ "$LIGHTHOUSE_OUTCOME" != success ]; then
            echo "::error title=Perf budget::size-limit ($SIZE_OUTCOME) or Lighthouse ($LIGHTHOUSE_OUTCOME) failed; see their steps."
            exit 1
          fi
      - name: Server log
        if: failure()
        working-directory: .
        run: tail -100 /tmp/phenix-ui.log
