# Shared corporate services for the Riverside Water example lab.
# riverside-water includes this topology (includeTopologies), so in Builder
# v2 its two servers appear as included devices: they can be moved, but not
# changed, deleted or reconnected.
apiVersion: phenix.sandia.gov/v1
kind: Topology
metadata:
  name: corp-services
  annotations:
    maintainer: range-team
spec:
  nodes:
    - type: VirtualMachine
      general:
        hostname: dns-01
        description: Internal DNS server
      hardware:
        os_type: linux
        vcpus: 1
        memory: 1024
        drives:
          - image: ubuntu.qc2
      labels:
        zone: corp
        role: dns
      network:
        interfaces:
          - name: eth0
            type: ethernet
            vlan: CORP
            proto: static
            address: 10.10.20.53
            mask: 24
            gateway: 10.10.20.1
    - type: VirtualMachine
      general:
        hostname: ntp-01
        description: Time server for the corporate and OT networks
      hardware:
        os_type: linux
        vcpus: 1
        memory: 1024
        drives:
          - image: ubuntu.qc2
      labels:
        zone: corp
        role: ntp
      network:
        interfaces:
          - name: eth0
            type: ethernet
            vlan: CORP
            proto: static
            address: 10.10.20.123
            mask: 24
            gateway: 10.10.20.1
