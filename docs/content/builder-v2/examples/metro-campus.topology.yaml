# Metro Campus: a larger example topology (42 devices on 7 networks) for
# trying the Builder v2 layouts and Auto-group.
apiVersion: phenix.sandia.gov/v1
kind: Topology
metadata:
  name: metro-campus
spec:
  nodes:
    - type: Router
      general:
        hostname: wan-rtr
        description: WAN edge router
      hardware:
        os_type: vyos
        drives:
          - image: vyos.qc2
      network:
        interfaces:
          - name: eth0
            type: ethernet
            vlan: WAN
            proto: static
            address: 198.51.100.2
            mask: 24
            gateway: 198.51.100.1
          - name: eth1
            type: ethernet
            vlan: DMZ
            proto: static
            address: 172.16.0.1
            mask: 24
          - name: eth2
            type: ethernet
            vlan: CORE
            proto: static
            address: 10.0.0.1
            mask: 24
    - type: Router
      general:
        hostname: core-rtr
        description: Core router
      hardware:
        os_type: vyos
        drives:
          - image: vyos.qc2
      network:
        interfaces:
          - name: eth0
            type: ethernet
            vlan: CORE
            proto: static
            address: 10.0.0.2
            mask: 24
            gateway: 10.0.0.1
          - name: eth1
            type: ethernet
            vlan: SERVERS
            proto: static
            address: 10.2.0.1
            mask: 24
    - type: Router
      general:
        hostname: dist-a
        description: Building A distribution router
      hardware:
        os_type: minirouter
        drives:
          - image: minirouter.qc2
      network:
        interfaces:
          - name: eth0
            type: ethernet
            vlan: CORE
            proto: static
            address: 10.0.0.11
            mask: 24
            gateway: 10.0.0.1
          - name: eth1
            type: ethernet
            vlan: BLDG-A
            proto: static
            address: 10.1.1.1
            mask: 24
    - type: Router
      general:
        hostname: dist-b
