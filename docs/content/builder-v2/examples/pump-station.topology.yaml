# A remote pump station of the Riverside Water utility. Import it in Builder
# v2 as an uploaded config (Import, then Uploaded config): it does not need
# to be stored in phenix first.
apiVersion: phenix.sandia.gov/v1
kind: Topology
metadata:
  name: pump-station
spec:
  nodes:
    - type: Router
      general:
        hostname: station-rtr
        description: Cellular router at the pump station
      hardware:
        os_type: minirouter
        drives:
          - image: minirouter.qc2
      network:
        interfaces:
          - name: eth0
            type: ethernet
            vlan: WAN
            proto: static
            address: 198.51.100.20
            mask: 24
            gateway: 198.51.100.1
          - name: eth1
            type: ethernet
            vlan: STATION
            proto: static
            address: 10.40.1.1
            mask: 24
    - type: VirtualMachine
      general:
        hostname: rtu-01
        description: Remote terminal unit
      hardware:
        os_type: linux
        drives:
          - image: bennu.qc2
      network:
        interfaces:
          - name: eth0
            type: ethernet
            vlan: STATION
            proto: static
            address: 10.40.1.10
            mask: 24
            gateway: 10.40.1.1
    - type: VirtualMachine
      general:
        hostname: eng-ws-01
        description: Field engineering laptop
      hardware:
        os_type: windows
        drives:
          - image: windows10.qc2
      network:
        interfaces:
          - name: eth0
            type: ethernet
            vlan: STATION
            proto: dhcp
