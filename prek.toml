# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
# Run manually: prek run --all-files
#:schema https://www.schemastore.org/prek.json

auto_update.cooldown_days = 30
minimum_prek_version = "0.4.11"
default_language_version.python = "3.12"
default_language_version.golang = "1.24"

# All hooks at the same priority level will run *concurrently* (in parallel),
# and hooks with a lower priority will run before hooks with a higher priority.
# See: https://prek.j178.dev/proposals/concurrency
#
# Named aliases (introduced in prek 0.4.11) make the run order self-documenting;
# hooks reference them via `priority = "fixers"` etc. instead of bare numbers.
#   fixers:   built-in hooks that modify files (e.g. fix line endings, remove trailing whitespace)
#   format:   language linters/formatters that modify files (go fmt, rumdl fmt)
#   lint:     language linters that don't modify files (codespell, golangci-lint),
#             and should rely on the already-modified files from the fixers/format hooks
[priorities]
fixers = 0
format = 1
lint = 2

# Go linting (golangci-lint) runs as part of the nested prek projects in
# src/go/ and examples/go/ instead of here, because the Go lint step depends
# on generated code produced by `make generate` (protobuf bindings, RBAC
# policy, store mocks), and each project needs its own working directory so
# its `.golangci.yml` config path resolves correctly. See src/go/prek.toml
# and examples/go/prek.toml. The `golangci-lint-config-verify` hook below
# is a fast, generate-free sanity check on the shared config file.

# Linting of GitHub Actions workflows for security issues
# https://docs.zizmor.sh/audits/
[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "v1.26.1"

[[repos.hooks]]
id = "zizmor"
args = [
    "--no-progress",
    "--fix"
]

# Spell checking
[[repos]]
repo = "https://github.com/codespell-project/codespell"
rev = "v2.4.2"

[[repos.hooks]]
id = "codespell"
args = [
  "--ignore-words-list",
  "ue,ot,ues,fo,nd,ist,te,parm,parms,ser,iif,iam,nin,filetest",
  # vendored UI assets and generated/binary content are noisy for codespell
  "--skip",
  "*.svg,*.lock,*.sum,src/js/yarn.lock,src/js/dist/*,src/go/web/public/*,src/go/web/proto/*.pb.go,src/go/store/mock.go,src/go/web/rbac/known_policy.go,**/*.min.js,**/*.min.css"
]
priority = "lint"


# Shell: ShellCheck (checks shell scripts for common issues)
# Unfortunately, ShellCheck's standard pre-commit hook calls into Docker,
#   which doesn't work well in CI, since the CI runs in a container.
# Instead, use this neat hack that uses Python pip to download and
#   install the ShellCheck binary.
[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1"

[[repos.hooks]]
id = "shellcheck"
# src/go/tmpl/templates/ contains embedded init-script/template resources
# rendered onto VMs at runtime, not scripts run from this repo
exclude = '^src/go/tmpl/templates/'
priority = "lint"


# Go: golangci-lint config verify (does not require generated files)
[[repos]]
repo = "https://github.com/golangci/golangci-lint"
# NOTE: intentionally newer than the v2.10.1 pinned in src/go/prek.toml and
# examples/go/prek.toml (which matches main's CI). `config verify`'s schema
# validation in v2.10.1 doesn't yet recognize some linters/settings already
# used in .golangci.yml (godoclint, embeddedstructfieldcheck, funcorder,
# exhaustruct's allow-empty-returns), even though `golangci-lint run` itself
# accepts them fine on that version. v2.12.2 validates cleanly.
rev = "v2.12.2"

[[repos.hooks]]
id = "golangci-lint-config-verify"
entry = "golangci-lint config verify -c src/go/.golangci.yml"
# Pinned to the 1.25 minor version band (v2.12.2 needs Go 1.25+ to build)
# rather than left unconstrained ("default"/go.mod auto-detection): see
# src/go/prek.toml for why an unconstrained request is unsafe (can resolve
# to a much newer Go release that golangci-lint can't be built with reliably).
language_version = "1.25"
priority = "format"


# Python (examples/python): Ruff linting and formatting
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.4"

[[repos.hooks]]
id = "ruff-format"
files = '^examples/python/'
args = [
  "--config",
  "examples/pyproject.toml"
]
priority = "format"

[[repos.hooks]]
id = "ruff-check"
files = '^examples/python/'
args = [
  "--fix",
  "--config",
  "examples/pyproject.toml"
]
priority = "lint"


# Markdown linting
[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "v0.2.58"

[[repos.hooks]]
id = "rumdl"      # Lint only; add args [--fix] to auto-fix
args = [
    "--disable",
    "MD013,MD033,MD041",  # MD013: line length, MD033: inline HTML, MD041: first line heading
]
# vendored UI docs (novnc, xterm.js) are third-party content, not ours to fix
exclude = '^src/go/web/public/'
priority = "format"

[[repos.hooks]]
id = "rumdl-fmt"  # Pure format, always exits 0
exclude = '^src/go/web/public/'
priority = "format"


# Dockerfile: hadolint
# hadolint-py uses python pip to download and install the hadolint binary.
# This is used instead of using Docker like the official hadolint
# pre-commit hook, so it can work in CI without docker-in-docker.
[[repos]]
repo = "https://github.com/AleksaC/hadolint-py"
rev = "v2.14.0"

[[repos.hooks]]
id = "hadolint"
# DL3059 - Ignore consecutive RUN instructions in Dockerfile
# DL3062 - go install ./... builds local source already pinned via git clone --branch; no remote version to pin
# DL3008/DL3015 - pinning every apt/apt-get package version is impractical for base images rebuilt regularly
args = ["--ignore", "DL3059", "--ignore", "DL3062", "--ignore", "DL3008", "--ignore", "DL3015"]
# vendored xterm.js Dockerfile isn't ours to fix
exclude = '^src/go/web/public/'
priority = "format"


# YAML: yamllint
[[repos]]
repo = "https://github.com/adrienverge/yamllint.git"
rev = "v1.29.0"

[[repos.hooks]]
id = "yamllint"
args = [
    "--strict",
    "--config-file=.yamllint.yml"
]
priority = "lint"


# Enforce conventional commit messages
[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"

[[repos.hooks]]
id = "conventional-pre-commit"
stages = ["commit-msg"]
args = [
  "feat",
  "fix",
  "docs",
  "style",
  "refactor",
  "test",
  "chore"
]
priority = "format"


# General checks built into prek
[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "trailing-whitespace"
args = ["--markdown-linebreak-ext=md"]
types_or = [
  "python",
  "go",
  "markdown",
  "yaml",
  "json"
]
exclude = '(^src/js/dist/|^src/go/web/public/|^src/go/web/proto/.*\.pb\.go$|^src/go/store/mock\.go$|^src/go/web/rbac/known_policy\.go$)'
priority = "fixers"

[[repos.hooks]]
id = "check-added-large-files"
priority = "format"

[[repos.hooks]]
id = "check-case-conflict"
priority = "format"

[[repos.hooks]]
id = "check-illegal-windows-names"
priority = "format"

[[repos.hooks]]
id = "end-of-file-fixer"
types_or = [
  "python",
  "go",
  "markdown"
]
exclude = '(^src/js/dist/|^src/go/web/public/|^src/go/web/proto/.*\.pb\.go$|^src/go/store/mock\.go$|^src/go/web/rbac/known_policy\.go$)'
priority = "fixers"

[[repos.hooks]]
id = "fix-byte-order-marker"
priority = "fixers"

[[repos.hooks]]
id = "check-yaml"
priority = "format"

[[repos.hooks]]
id = "check-json"
exclude = "^devcontainer.json$"
priority = "format"

[[repos.hooks]]
id = "check-merge-conflict"
priority = "format"

[[repos.hooks]]
id = "check-executables-have-shebangs"
exclude = { glob = [
    "**/*.desktop",
    "**/*.ps1",
    "**/*.bat",
    "**/*.cmd",
    "src/js/**",
]}
priority = "format"

[[repos.hooks]]
id = "check-shebang-scripts-are-executable"
# .mako templates and src/go/tmpl/templates/ are embedded resources
# rendered elsewhere, not scripts executed from this repo
exclude = '(^.*\.mako$|^src/go/tmpl/templates/)'
priority = "format"

[[repos.hooks]]
id = "check-symlinks"
priority = "format"

[[repos.hooks]]
id = "check-toml"
priority = "format"

[[repos.hooks]]
id = "mixed-line-ending"
args = ["--fix=no"]
# vendored xterm.js test fixtures intentionally contain mixed line endings
exclude = '^src/go/web/public/'
priority = "fixers"

[[repos.hooks]]
id = "check-vcs-permalinks"
description = "Ensures that links to vcs websites are permalinks"
priority = "format"

[[repos.hooks]]
id = "no-commit-to-branch"
name = "branch name validation"
description = "Prevent committing to 'main', 'master', or any branch that aren't kebab-case (only allows letters, numbers, and hyphens)"
args = [
  "--branch",
  "main",
  "--branch",
  "master",
  "--pattern",
  '.*[^\w-].*'
]
priority = "format"
