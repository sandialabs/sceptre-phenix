# Schemas for the config kinds stored at apiVersion phenix.sandia.gov/v2:
# Scenario. Configs are validated against the schema file of their own
# apiVersion, so a kind appears only in the file of the version it is
# stored at (see version.StoredVersion).
# The "--8<--" comments mark the sections docs/content/schema.md shows; the
# last section runs to the end of the file.
openapi: "3.0.0"
info:
  title: phenix config specs
  version: "2.0"
paths: {}
components:
  schemas:
    # --8<-- [start:scenario]
    Scenario:
      type: object
      nullable: true
      required:
      - apps
      properties:
        apps:
          type: array
          nullable: true
          items:
            type: object
            required:
            - name
            properties:
              name:
                type: string
                example: example-app
              assetDir:
                type: string
                example: /phenix/topologies/example-topo/assets
              metadata:
                type: object
                nullable: true
                additionalProperties: true
                example:
                  setting0: true
                  setting1: 42
                  setting2: universe key
              disabled:
                type: boolean
                default: false
                example: false
                nullable: true
              hosts:
                type: array
                items:
                  type: object
                  required:
                  - hostname
                  properties:
                    hostname:
                      type: string
                      example: example-host
                    metadata:
                      type: object
                      nullable: true
                      additionalProperties: true
                      example:
                        setting0: true
                        setting1: 42
                        setting2: universe key
