# Schemas for the config kinds stored at apiVersion phenix.sandia.gov/v2:
# Scenario. Configs are validated against the schema file of their own
# apiVersion, so a kind appears only in the file of the version it is
# stored at (see version.StoredVersion).
# The "--8<--" comments mark the sections docs/content/schema.md shows; the
# last section runs to the end of the file.
openapi: "3.0.0"
info:
  title: phenix config specs
  version: "2.0"
paths: {}
components:
  schemas:
    # --8<-- [start:scenario]
    Scenario:
      title: "Scenario"
      description: "Schema describing the Scenario resource."
      type: object
      nullable: true
      required:
      - apps
      properties:
        apps:
          title: "Apps"
          description: "Applications configured for this scenario."
          type: array
          nullable: true
          items:
            type: object
            required:
            - name
            properties:
              name:
                title: "Name"
                description: "Name used to identify this resource or entry."
                type: string
                example: example-app
              assetDir:
                title: "Asset Directory"
                description: "Directory containing assets made available to the application."
                type: string
                example: /phenix/topologies/example-topo/assets
              metadata:
                title: "Metadata"
                description: "Application-specific settings shared across its hosts."
                type: object
                nullable: true
                additionalProperties: true
                example:
                  setting0: true
                  setting1: 42
                  setting2: universe key
              runPeriodically:
                title: "Run Periodically"
                description: "Interval at which the application running stage repeats."
                type: string
                example: 30s
              disabled:
                title: "Disabled"
                description: "Whether to skip this application."
                type: boolean
                default: false
                example: false
                nullable: true
              fromScenario:
                title: "From Scenario"
                description: "Scenario inherited by this application configuration."
                type: string
                example: base-scenario
              hosts:
                title: "Hosts"
                description: "Host-specific application settings."
                type: array
                items:
                  type: object
                  required:
                  - hostname
                  properties:
                    hostname:
                      title: "Hostname"
                      description: "Hostname used to identify the node."
                      type: string
                      example: example-host
                    metadata:
                      title: "Metadata"
                      description: "Application-specific settings for this host."
                      type: object
                      nullable: true
                      additionalProperties: true
                      example:
                        setting0: true
                        setting1: 42
                        setting2: universe key
