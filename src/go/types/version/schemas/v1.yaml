openapi: "3.0.0"
info:
  title: phenix config specs
  version: "1.0"
paths: {}
components:
  schemas:
    Image:
      type: object
      required:
      - format
      - mirror
      - release
      - size
      - variant
      properties:
        compress:
          type: boolean
          default: false
          example: false
        deb_append:
          type: string
          example: --components=main,restricted
        format:
          type: string
          example: qcow2
        mirror:
          type: string
          example: http://us.archive.ubuntu.com/ubuntu/
        overlays:
          type: array
          nullable: true
          items:
            type: string
          example:
          - /phenix/vmdb/overlays/example-overlay
        packages:
          type: array
          nullable: true
          items:
            type: string
          example:
          - isc-dhcp-client
          - openssh-server
        ramdisk:
          type: boolean
          default: false
          example: false
        release:
          type: string
          example: focal
        script_order:
          type: array
          nullable: true
          items:
            type: string
          example:
          - POSTBUILD_APT_CLEANUP
        scripts:
          type: object
          additionalProperties:
            type: string
          example:
            POSTBUILD_APT_CLEANUP: |
              apt clean || apt-get clean || echo "unable to clean apt cache"
        size:
          type: string
          example: 10G
        variant:
          type: string
          example: minbase
    Role:
      type: object
      required:
      - policies
      - roleName
      properties:
        policies:
          type: array
          items:
            type: object
            properties:
              resources:
                type: array
                items:
                  type: string
              resourceNames:
                type: array
                items:
                  type: string
              verbs:
                type: array
                items:
                  type: string
          example:
          - resources:
            - experiments
            - experiments/*
            resourceNames:
            - '*'
            verbs:
            - list
            - get
        roleName:
          type: string
          example: Example Role
    User:
      type: object
      required:
      - first_name
      - last_name
      - username
      properties:
        first_name:
          type: string
          example: John
        last_name:
          type: string
          example: Doe
        password:
          type: string
          example: '<encrypted password>'
          readOnly: true
        rbac:
          allOf:
          - $ref: "#/components/schemas/Role"
          readOnly: true
        username:
          type: string
          example: johndoe@example.com
    Topology:
      type: object
      anyOf:
      - required:
        - nodes
      - required:
        - includeTopologies
      properties:
        includeTopologies:
          type: array
          items:
            type: string
          example:
          - /phenix/topologies/enterprise/phenix-configs/topology.yml
          - store-topo
        nodes:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/minimega_node'
            - $ref: '#/components/schemas/external_node'
    Scenario:
      type: object
      required:
      - apps
      properties:
        apps:
          type: object
          properties:
            experiment:
              type: array
              items:
                type: object
                required:
                - name
                properties:
                  name:
                    type: string
                    minLength: 1
    Experiment:
      type: object
      required:
      - topology
      properties:
        topology:
          $ref: "#/components/schemas/Topology"
        scenario:
          $ref: "#/components/schemas/Scenario"
        baseDir:
          type: string
          example: /phenix/topologies/example-topo
        experimentName:
          type: string
          example: example-exp
          readOnly: true
        vlans:
          type: object
          properties:
            aliases:
              type: object
              additionalProperties:
                type: integer
              example:
                MGMT: 200
            min:
              type: integer
            max:
              type: integer
        schedule:
          type: object
          additionalProperties:
            type: string
          example:
            ADServer: compute1
    minimega_node:
      type: object
      required:
      - type
      - general
      - hardware
      properties:
        type:
          description: >-
            What the node is. phenix configures Router and Firewall nodes whose OS type is vyatta, vyos or minirouter as
            routers, from their interfaces, routes, OSPF settings and rulesets.
          type: string
          enum:
          - VirtualMachine
          - Firewall
          - Router
          - Switch
          default: VirtualMachine
          example: VirtualMachine
        general:
          type: object
          required:
          - hostname
          properties:
            hostname:
              description: 'Name of the VM in minimega and the host name set in the guest. Unique in the topology.'
              type: string
              minLength: 1
              maxLength: 63
              pattern: '^[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?$'
              example: ADServer
            description:
              description: 'Free-text notes about the node.'
              type: string
              example: Active Directory Server
            vm_type:
              description: >-
                How minimega runs the node: kvm for a QEMU/KVM virtual machine, or container. Empty means kvm.
              type: string
              enum:
              - kvm
              - container
              - ""
              default: kvm
              example: kvm
            snapshot:
              description: >-
                Run the VM on a copy-on-write snapshot of its first drive, which phenix creates for the experiment and
                injects files into, so the image file itself does not change. phenix turns this on when it is not set.
              type: boolean
              default: true
              example: true
              nullable: true
            do_not_boot:
              description: >-
                Leave the node out when the experiment starts: phenix neither creates nor starts its VM. phenix also
                sets this when the first drive's image is missing.
              type: boolean
              default: false
              example: false
              nullable: true
        hardware:
          type: object
          required:
          - os_type
          - drives
          properties:
            cpu:
              description: 'QEMU CPU model for the VM, such as Broadwell or host.'
              type: string
              default: Broadwell
              example: Broadwell
            vcpus:
              description: 'Number of virtual CPUs. phenix uses 1 when it is not set.'
              oneOf:
              - type: integer
              - type: string
              default: 1
              example: 4
            memory:
              description: 'Memory for the VM, in megabytes. phenix uses 512 when it is not set.'
              oneOf:
              - type: integer
              - type: string
              default: 512
              example: 8192
            os_type:
              description: >-
                Operating system in the disk image. phenix and its apps choose startup scripts and router configuration
                by it.
              type: string
              enum:
              - centos
              - linux
              - minirouter
              - rhel
              - vyatta
              - vyos
              - windows
              - other
              default: linux
              example: windows
            drives:
              description: >-
                Disks attached to the VM, in order. The first is the one phenix snapshots and injects files into.
              type: array
              minItems: 1
              items:
                type: object
                required:
                - image
                properties:
                  image:
                    description: >-
                      Disk image file: a name in the phenix image directory, or an absolute path on the host.
                    type: string
                    minLength: 1
                    example: ubuntu.qc2
                  interface:
                    description: >-
                      Bus the disk is attached to, such as ide, scsi or virtio. Empty uses minimega's default.
                    type: string
                    enum:
                    - ahci
                    - ide
                    - scsi
                    - sd
                    - mtd
                    - floppy
                    - pflash
                    - virtio
                    - ""
                    default: ide
                    example: ide
                  cache_mode:
                    description: >-
                      QEMU cache mode for the disk. Empty uses writeback for a snapshot, and QEMU's default otherwise.
                    type: string
                    enum:
                    - none
                    - writeback
                    - unsafe
                    - directsync
                    - writethrough
                    - ""
                    default: writeback
                    example: writeback
                  inject_partition:
                    description: >-
                      Partition of the first drive that phenix injects files into. 0 skips disk injection, and phenix
                      sends its startup scripts through minimega command and control instead. phenix uses 1 when it is
                      not set.
                    type: integer
                    default: 1
                    example: 2
                    nullable: true
        network:
          type: object
          required:
          - interfaces
          properties:
            interfaces:
              description: 'Network interfaces, in the order the guest sees them.'
              type: array
              nullable: true
              items:
                type: object
                oneOf:
                - $ref: '#/components/schemas/static_iface'
                - $ref: '#/components/schemas/dhcp_iface'
                - $ref: '#/components/schemas/serial_iface'
            routes:
              description: 'Static routes phenix configures in the guest.'
              type: array
              nullable: true
              items:
                type: object
                required:
                - destination
                - next
                properties:
                  destination:
                    description: 'Network to reach, in CIDR notation such as 192.168.0.0/24.'
                    type: string
                    minLength: 1
                    example: 192.168.0.0/24
                  next:
                    description: 'Address of the next hop toward the destination.'
                    type: string
                    minLength: 1
                    example: 192.168.1.254
                  cost:
                    description: 'Route cost, set as the administrative distance on Vyatta and VyOS routers.'
                    type: integer
                    default: 1
                    example: 1
                    nullable: true
            ospf:
              type: object
              required:
              - router_id
              - areas
              properties:
                router_id:
                  description: 'OSPF router ID, written like an IPv4 address, such as 0.0.0.1.'
                  type: string
                  minLength: 1
                  example: 0.0.0.1
                areas:
                  description: 'OSPF areas the router takes part in.'
                  type: array
                  items:
                    type: object
                    required:
                    - area_id
                    - area_networks
                    properties:
                      area_id:
                        description: 'OSPF area number. 0 is the backbone area.'
                        type: integer
                        example: 1
                        default: 1
                      area_networks:
                        description: 'Networks the router advertises in the area.'
                        type: array
                        items:
                          type: object
                          required:
                          - network
                          properties:
                            network:
                              description: 'Network in CIDR notation, such as 10.1.25.0/24.'
                              type: string
                              minLength: 1
                              example: 10.1.25.0/24
                dead_interval:
                  description: >-
                    Seconds without a hello from a neighbor before the router considers it down. Applies to interfaces
                    whose protocol is ospf.
                  type: integer
                  nullable: true
                  example: 40
                hello_interval:
                  description: 'Seconds between OSPF hello packets. Applies to interfaces whose protocol is ospf.'
                  type: integer
                  nullable: true
                  example: 10
                retransmission_interval:
                  description: >-
                    Seconds before the router resends a link-state advertisement that was not acknowledged. Applies to
                    interfaces whose protocol is ospf.
                  type: integer
                  nullable: true
                  example: 5
            rulesets:
              description: >-
                Firewall rulesets for Router and Firewall nodes. An interface applies one by naming it as its inbound or
                outbound ruleset.
              type: array
              nullable: true
              items:
                type: object
                required:
                - name
                - default
                - rules
                properties:
                  name:
                    description: 'Name interfaces use to apply the ruleset.'
                    type: string
                    minLength: 1
                    example: OutToDMZ
                  description:
                    description: 'Describes the ruleset in the router configuration.'
                    type: string
                    minLength: 1
                    example: From Corp to the DMZ network
                  default:
                    description: 'What happens to traffic that no rule matches.'
                    type: string
                    enum:
                    - accept
                    - drop
                    - reject
                    example: drop
                  rules:
                    description: 'Rules of the ruleset.'
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - action
                      - protocol
                      properties:
                        id:
                          description: >-
                            Rule number, unique in the ruleset. Vyatta and VyOS routers check rules from the lowest
                            number up.
                          type: integer
                          example: 10
                        description:
                          description: 'Describes the rule in the router configuration.'
                          type: string
                          example: Allow UDP 10.1.26.80 ==> 10.2.25.0/24:123
                        action:
                          description: 'What happens to traffic the rule matches.'
                          type: string
                          enum:
                          - accept
                          - drop
                          - reject
                          example: accept
                        protocol:
                          description: 'Protocol of the traffic the rule matches.'
                          type: string
                          enum:
                          - tcp
                          - udp
                          - tcp_udp
                          - icmp
                          - esp
                          - ah
                          - all
                          default: tcp
                          example: tcp
                        source:
                          type: object
                          required:
                          - address
                          properties:
                            address:
                              description: 'Source address or network the rule matches.'
                              type: string
                              minLength: 1
                              example: 10.1.24.60
                            port:
                              description: 'Source port the rule matches. Empty or 0 matches any port.'
                              type: integer
                              example: 3389
                        destination:
                          type: object
                          required:
                          - address
                          properties:
                            address:
                              description: 'Destination address or network the rule matches.'
                              type: string
                              minLength: 1
                              example: 10.1.24.60
                            port:
                              description: 'Destination port the rule matches. Empty or 0 matches any port.'
                              type: integer
                              example: 3389
        injections:
          description: 'Files phenix copies into the snapshot of the first drive before the VM starts.'
          type: array
          nullable: true
          items:
            type: object
            required:
            - src
            - dst
            properties:
              src:
                description: >-
                  File on the phenix host: an absolute path, or a path relative to the experiment directory.
                type: string
                minLength: 1
                example: foo.xml
              dst:
                description: 'Path the file is written to in the guest.'
                type: string
                minLength: 1
                example: /etc/phenix/foo.xml
              description:
                description: 'Free-text notes about the file.'
                type: string
                example: phenix config file
              permissions:
                description: 'File mode for the copied file, in octal such as 0664.'
                type: string
                example: '0664'
        delay:
          type: object
          nullable: true
          properties:
            timer:
              description: 'Start the VM this long after the experiment starts, as a duration such as 30s or 5m.'
              type: string
              example: 5m
            user:
              description: >-
                Leave the VM stopped until someone starts it from phenix or minimega. Takes precedence over the other
                delays.
              type: boolean
            c2:
              description: 'Start the VM once each of these hosts has checked in with minimega command and control.'
              type: array
              nullable: true
              items:
                type: object
                properties:
                  hostname:
                    description: 'Host to wait for.'
                    type: string
                  useUUID:
                    description: 'Wait for the host''s UUID, rather than its hostname, to check in.'
                    type: boolean
        advanced:
          description: 'Extra minimega vm config settings, each a setting name and its value.'
          type: object
        commands:
          description: 'minimega command and control (cc) commands phenix sends to the VM, such as exec df -h.'
          type: array
          nullable: true
          items:
            type: string
          example:
          - exec df -h
    external_node:
      type: object
      required:
      - external
      - type
      - general
      properties:
        external:
          description: >-
            Marks a device phenix does not deploy, such as hardware in the loop. It stays in the topology for State of
            Health and apps.
          type: boolean
        type:
          description: 'What the device is, such as HIL for hardware in the loop.'
          type: string
          default: HIL
          example: HIL
        general:
          type: object
          required:
          - hostname
          properties:
            hostname:
              description: 'Name of the device in the topology.'
              type: string
              example: ADServer
            description:
              description: 'Free-text notes about the device.'
              type: string
              example: Active Directory Server
            vm_type:
              description: 'Whether the device is a virtual machine or a container.'
              type: string
              enum:
              - vm
              - container
              - ""
              default: vm
              example: vm
        hardware:
          type: object
          nullable: true
          required:
          - os_type
          properties:
            cpu:
              description: 'CPU model of the device.'
              type: string
              default: Broadwell
              example: Broadwell
            vcpus:
              description: 'Number of CPUs of the device.'
              oneOf:
              - type: integer
              - type: string
              default: 1
              example: 4
            memory:
              description: 'Memory of the device, in megabytes.'
              oneOf:
              - type: integer
              - type: string
              default: 512
              example: 8192
            os_type:
              description: 'Operating system of the device.'
              type: string
              enum:
              - centos
              - linux
              - minirouter
              - rhel
              - vyatta
              - vyos
              - windows
              - other
              default: linux
              example: windows
        network:
          type: object
          nullable: true
          required:
          - interfaces
          properties:
            interfaces:
              description: >-
                Network interfaces of the device, for the topology's network diagram and State of Health checks.
              type: array
              items:
                type: object
                required:
                - name
                properties:
                  name:
                    description: 'Interface name, such as eth0.'
                    type: string
                    example: eth0
                  proto:
                    description: 'How the interface gets its address: static, dhcp, or manual for none.'
                    type: string
                    enum:
                    - static
                    - dhcp
                    - manual
                    - ""
                    default: dhcp
                    example: static
                  address:
                    description: 'IPv4 address of the interface.'
                    type: string
                    format: ipv4
                    example: 192.168.1.100
                  mask:
                    description: 'Network prefix length (CIDR bits), from 0 to 32.'
                    type: integer
                    minimum: 0
                    maximum: 32
                    default: 24
                    example: 24
                  gateway:
                    description: 'Default gateway of the interface.'
                    type: string
                    format: ipv4
                    example: 192.168.1.1
                  vlan:
                    description: 'VLAN (network) the interface is on.'
                    type: string
                    example: EXP-1
    iface:
      type: object
      required:
      - name
      - vlan
      properties:
        name:
          description: 'Interface name, such as eth0, which NAT settings and apps use to refer to it.'
          type: string
          minLength: 1
          example: eth0
        vlan:
          description: 'VLAN (network) the interface is on.'
          type: string
          minLength: 1
          example: EXP-1
        autostart:
          description: >-
            Whether the interface should come up when the VM boots. phenix itself does not act on this setting.
          type: boolean
          default: true
        mac:
          description: 'MAC address. minimega generates one when it is empty.'
          type: string
          example: 00:11:22:33:44:55
          pattern: '^([0-9a-fA-F]{2}[:-]){5}([0-9a-fA-F]){2}$'
        mtu:
          description: >-
            Maximum transmission unit, in bytes. Vyatta and VyOS routers apply values from 68 to 16000; other images
            keep their own.
          type: integer
          default: 1500
          example: 1500
        bridge:
          description: >-
            Open vSwitch bridge on the host the interface attaches to. Empty or phenix uses the experiment's default
            bridge.
          type: string
          default: phenix
        driver:
          description: 'Emulated network card, such as e1000 or virtio-net-pci. Empty uses minimega''s default.'
          type: string
          example: e1000
        qinq:
          description: >-
            Carry the guest's own VLAN tags inside the interface's VLAN (QinQ, 802.1ad). The guest brings the interface
            up without an address.
          type: boolean
          default: false
    iface_address:
      type: object
      required:
      - address
      - mask
      properties:
        address:
          description: 'IPv4 address of the interface.'
          type: string
          format: ipv4
          minLength: 7
          example: 192.168.1.100
        mask:
          description: 'Network prefix length (CIDR bits), from 0 to 32.'
          type: integer
          minimum: 0
          maximum: 32
          default: 24
          example: 24
        gateway:
          description: 'Default gateway, reached through this interface.'
          type: string
          format: ipv4
          minLength: 7
          example: 192.168.1.1
        dns:
          description: 'DNS server addresses the guest uses: one address, or a list.'
          nullable: true
          oneOf:
          - type: string
          - type: array
            items:
              type: string
          example:
          - 192.168.1.1
          - 192.168.1.2
    iface_rulesets:
      type: object
      properties:
        ruleset_out:
          description: 'Ruleset for traffic going out of this interface, on Router and Firewall nodes.'
          type: string
          example: OutToInet
          pattern: '^[\w-]+$'
        ruleset_in:
          description: 'Ruleset for traffic coming in on this interface, on Router and Firewall nodes.'
          type: string
          example: InFromInet
          pattern: '^[\w-]+$'
    static_iface:
      allOf:
      - $ref: '#/components/schemas/iface'
      - $ref: '#/components/schemas/iface_address'
      - $ref: '#/components/schemas/iface_rulesets'
      required:
      - type
      - proto
      properties:
        type:
          description: 'Kind of interface: ethernet.'
          type: string
          enum:
          - ethernet
          default: ethernet
          example: ethernet
        proto:
          description: >-
            How the interface is addressed: static for a fixed address, or ospf for a fixed address that also takes part
            in OSPF on a router.
          type: string
          enum:
          - static
          - ospf
          default: static
          example: static
    dhcp_iface:
      allOf:
      - $ref: '#/components/schemas/iface'
      - $ref: '#/components/schemas/iface_rulesets'
      required:
      - type
      - proto
      properties:
        type:
          description: 'Kind of interface: ethernet.'
          type: string
          enum:
          - ethernet
          default: ethernet
          example: ethernet
        proto:
          description: >-
            How the interface is addressed: dhcp to ask a DHCP server, or manual to bring it up with no address.
          type: string
          enum:
          - dhcp
          - manual
          default: dhcp
          example: dhcp
    serial_iface:
      allOf:
      - $ref: '#/components/schemas/iface'
      - $ref: '#/components/schemas/iface_address'
      - $ref: '#/components/schemas/iface_rulesets'
      required:
      - type
      - proto
      - udp_port
      - baud_rate
      - device
      properties:
        type:
          description: 'Kind of interface: a serial link, carried over the network between VMs.'
          type: string
          enum:
          - serial
          default: serial
          example: serial
        proto:
          description: 'Serial interfaces have a static address.'
          type: string
          enum:
          - static
          default: static
          example: static
        udp_port:
          description: 'UDP port that carries the serial traffic between VMs.'
          type: integer
          minimum: 0
          maximum: 65535
          default: 8989
          example: 8989
        baud_rate:
          description: 'Speed of the serial line, in bits per second.'
          type: integer
          enum:
          - 110
          - 300
          - 600
          - 1200
          - 2400
          - 4800
          - 9600
          - 14400
          - 19200
          - 38400
          - 57600
          - 115200
          - 128000
          - 256000
          default: 9600
          example: 9600
        device:
          description: 'Serial device the guest uses, such as /dev/ttyS0.'
          type: string
          minLength: 1
          default: /dev/ttyS0
          example: /dev/ttyS0
