# Nested prek project for the Go backend.
# prek runs a project's hooks with the project's directory as the working
# directory, so paths below (e.g. .golangci.yml) are relative to src/go.
# See the root prek.toml for general notes on this repository's prek setup.

default_language_version.golang = "1.24"

# Named priority aliases must be redeclared per nested project (prek 0.4.11+).
# See the root prek.toml for the full fixers/format/lint ordering rationale.
[priorities]
fixers = 0
format = 1
lint = 2

# Code generation must run before golangci-lint, since golangci-lint
# type-checks the whole package graph and several packages import
# generated protobuf, mock, and RBAC policy code.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "go-generate"
name = "go generate (protobuf, mocks, RBAC policy)"
description = "Regenerates code (protobuf, mocks, RBAC policy) so golangci-lint can type-check the full package graph."
entry = "make generate"
language = "system"
pass_filenames = false
always_run = true
priority = "fixers"


# Go: golangci-lint (format + lint)
[[repos]]
repo = "https://github.com/golangci/golangci-lint"
# NOTE: keep in sync with the golangci-lint version installed by `make install-dev`.
# v2.10.1 requires Go 1.25+ to build (see its go.mod), newer than this
# project's default (Go 1.24, set above), so `language_version = "1.25"`
# overrides that default per-hook to build golangci-lint with a managed Go
# 1.25 toolchain. This is pinned to the 1.25 minor version band rather than
# left unconstrained ("default"/go.mod auto-detection): an unconstrained
# request can resolve to a much newer Go release (e.g. 1.27), and building
# golangci-lint with a toolchain far newer than it was designed for breaks
# its type-checking (incompatible compiled package export-data versions).
# This has no effect on what Go version golangci-lint analyzes: that's
# controlled by this project's own go.mod/.golangci.yml, which still target
# Go 1.24.
rev = "v2.10.1"

[[repos.hooks]]
id = "golangci-lint-fmt"
args = ["-c", ".golangci.yml"]
language_version = "1.25"
priority = "format"

[[repos.hooks]]
id = "golangci-lint-full"
# --allow-parallel-runners avoids lock contention with the concurrently
# running examples/go nested project's own golangci-lint-full invocation.
args = ["-c", ".golangci.yml", "--fix", "--allow-parallel-runners"]
language_version = "1.25"
priority = "lint"

