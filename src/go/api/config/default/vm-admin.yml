apiVersion: phenix.sandia.gov/v1
kind: Role
metadata:
  name: vm-admin
spec:
  roleName: VM Admin
  policies:
    - resources:
        - experiments
        - experiments/*
      verbs:
        - list
        - get
    - resources:
        - vms
        - vms/*
      verbs:
        - '*'
    # Start, cancel, clean up and clear Scorch runs. Typing into Scorch
    # terminals needs scorch/terminals write, which this role does not have.
    - resources:
        - scorch
      verbs:
        - get
        - post
        - delete
