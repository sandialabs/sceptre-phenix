apiVersion: phenix.sandia.gov/v1
kind: Role
metadata:
  name: vm-admin
spec:
  roleName: VM Admin
  policies:
    - resources:
        - experiments
        - experiments/*
      verbs:
        - list
        - get
    - resources:
        - vms
        - vms/*
      verbs:
        - '*'
    # scorch post also allows typing into Scorch break terminals, which are
    # shells on the phenix server.
    - resources:
        - scorch
      verbs:
        - get
        - post
        - delete
    - resources:
        - tunneler
      verbs:
        - get
