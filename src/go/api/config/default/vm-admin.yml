apiVersion: phenix.sandia.gov/v1
kind: Role
metadata:
  name: vm-admin
spec:
  roleName: VM Admin
  policies:
    - resources:
        - experiments
        - experiments/*
      verbs:
        - list
        - get
    - resources:
        - vms
        - vms/*
      verbs:
        - '*'
    # Start and cancel Scorch runs. Typing into Scorch terminals needs the
    # separate scorch/terminals write permission, which this role does not have.
    - resources:
        - scorch
      verbs:
        - get
        - post
        - delete
    - resources:
        - tunneler
      verbs:
        - get
