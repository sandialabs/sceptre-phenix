apiVersion: phenix.sandia.gov/v1
kind: Role
metadata:
  name: experiment-viewer
spec:
  roleName: Experiment Viewer
  policies:
  - resources:
    - experiments
    - "experiments/*"
    - vms
    - "vms/*"
    verbs:
    - list
    - get
  # Keep this before the first policy with resourceNames so assigning the role
  # scopes it to the user's VMs.
  - resources:
    - "vms/mount"
    verbs:
    - post
    - delete
  - resources:
    - hosts
    resourceNames:
    - "*"
    verbs:
    - list
  - resources:
    - builder
    verbs:
    - get
  - resources:
    - scorch
    verbs:
    - get
  - resources:
    - tunneler
    verbs:
    - get
