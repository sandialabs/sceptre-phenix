apiVersion: phenix.sandia.gov/v1
kind: Role
metadata:
  name: experiment-user
spec:
  roleName: Experiment User
  policies:
  - resources:
    - experiments
    - "experiments/*"
    verbs:
    - list
    - get
  - resources:
    - vms
    - "vms/*"
    verbs:
    - list
    - get
    - patch
  - resources:
    - "vms/redeploy"
    verbs:
    - update
  - resources:
    - "vms/captures"
    verbs:
    - create
    - delete
  - resources:
    - "vms/snapshots"
    verbs:
    - list
    - create
    - update
  # Tunneler port forwards. Keep this before the first policy with
  # resourceNames so assigning the role scopes it to the user's VMs.
  - resources:
    - "vms/forwards"
    verbs:
    - create
    - delete
  - resources:
    - "experiments/files"
    verbs:
    - create
  - resources:
    - hosts
    resourceNames:
    - "*"
    verbs:
    - list
  - resources:
    - builder
    verbs:
    - get
    - post
  # scorch post also allows typing into Scorch break terminals, which are
  # shells on the phenix server.
  - resources:
    - scorch
    verbs:
    - get
    - post
    - delete
  - resources:
    - tunneler
    verbs:
    - get
