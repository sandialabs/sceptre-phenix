apiVersion: phenix.sandia.gov/v1
kind: Role
metadata:
  name: scorch-admin
spec:
  roleName: Scorch Admin
  # Everything Scorch Viewer can do, plus start, cancel, clean up and clear
  # Scorch runs, type into and exit Scorch terminals, and watch the VMs Scorch
  # components act on. Assigning the role scopes it to the user's experiments.
  policies:
  - resources:
    - experiments
    verbs:
    - list
    - get
  - resources:
    - "experiments/apps"
    - "experiments/files"
    verbs:
    - list
    - get
  - resources:
    - vms
    verbs:
    - list
    - get
  - resources:
    - "vms/screenshot"
    verbs:
    - get
  - resources:
    - scorch
    verbs:
    - "*"
  # A Scorch terminal, such as the one a break component opens, is a shell
  # running as the phenix server process, usually as root. Anyone who may write
  # to one controls the phenix server and can bypass RBAC, so only assign this
  # role to users trusted with that access.
  - resources:
    - "scorch/terminals"
    verbs:
    - write
