      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credentials"
  "/logout":
    get:
      tags:
        - Users
      summary: Logout a user
      operationId: getLogout
      responses:
        "204":
          description: successful operation
  "/workflow/configs/{branch}":
    post:
      tags:
        - Workflow
      summary: Create or update a phenix config for a workflow branch
      description: >
        Creates the config if it does not exist and updates it otherwise. The
        server sets BRANCH_NAME to the branch before parsing the body, so
        ${BRANCH_NAME} placeholders expand to the branch name. The Content-Type
        header must be exactly application/json or application/x-yaml. A
        Topology is also checked for a node an experiment could not use, such
        as a hostname used twice or a reserved hostname, before it is stored.
        With dryRun=true it runs the same checks, returns what it would do, and
        stores nothing.
      operationId: postWorkflowConfigsBranch
      parameters:
        - name: branch
          in: path
          description: workflow branch name
          required: true
          schema:
            type: string
        - name: dryRun
          in: query
          description: >
            Checks the config as a real request would (placeholder expansion,
            the create or update decision, permissions, schema validation and,
            for a Topology, the node checks an experiment would fail on) and
            returns the result without storing the config or running config
            hooks. For an Experiment config only the schema is checked; the
            experiment checks run when the config is stored. The parameter's
            name is matched exactly, so a request that spells it differently is
            carried out for real.
          required: false
          schema:
            type: boolean
            default: false
      requestBody:
        description: phenix config of a storable kind (e.g. Topology or Scenario)
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Config"
          application/x-yaml:
            schema:
              $ref: "#/components/schemas/Config"
      responses:
        "200":
          description: dry run; nothing was stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowConfigResult"
        "201":
          description: config created or updated (no response body)
          headers:
            Location:
              schema:
                description: location of the created or updated config, under the server's base path
                type: string
                format: uri
        "400":
          description: >
            unsupported Content-Type, unparsable body, a missing or unknown kind
            or a name containing "/", an invalid dryRun value, a schema
            validation failure (explained lines in metadata.validation, original
            validator text in metadata.validation-raw), or, for a Topology, a
            node an experiment could not use, such as a hostname used twice or
            a reserved hostname, or a spec that does not decode; or, on a real
            upsert, a config hook or the store rejects the config, or another
            request created or deleted it in the meantime
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            updating the config is not allowed, or creating one of its
            `Kind/name` is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          description: >-
            a User config changed while the update ran; `metadata.revision`
            holds its current revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/workflow/apply/{branch}":
    post:
      tags:
        - Workflow
      summary: Apply a phenix workflow config to a workflow branch
      description: >
        Validates the workflow config against the Workflow schema, finds the
        experiment mapped to the branch (phenix.workflow/branch annotation),
        plans an action, and checks the default bridge and the topology and
        scenario the action would use, including a stored topology's nodes, as
        creating an experiment would. Only then does it create, update, start,
        or restart the experiment. A failed check leaves a running experiment
        running. With dryRun=true the plan is returned after the same checks,
        and nothing is changed; a dry run before a first deploy names the
        configs the caller will store with pending. The server sets BRANCH_NAME
        to the branch before parsing the body. The Content-Type header must be
        exactly application/json or application/x-yaml.
      operationId: postWorkflowApplyBranch
      parameters:
        - name: branch
          in: path
          description: workflow branch name
          required: true
          schema:
            type: string
        - name: tag
          in: query
          description: >
            key=value tag stored on the experiment, joined with commas into the
            phenix.workflow/tags annotation; repeat the parameter for more tags
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: dryRun
          in: query
          description: >
            Runs every check, a stored topology's node checks included, and
            returns the plan without creating, updating, starting, or stopping
            anything. The parameter's name is matched exactly, so a request
            that spells it differently is treated as a real apply, and refused
            with 400 when it also carries pending.
          required: false
          schema:
            type: boolean
            default: false
        - name: pending
          in: query
          description: >
            A config the caller will create or update before the real apply,
            usually the pending value a dry run of POST /workflow/configs/{branch}
            returned: <Kind>/<name>, such as Topology/helloworld, optionally
            followed by "?" and the config's references, such as
            Scenario/helloworld?from=helloworld-base&topology=helloworld
            (url-encode the value). The kind may be in any case. Repeat the
            parameter for more configs. A pending topology or scenario is not
            looked up, decoded or merged, so a first deploy can be checked
            before its configs are stored; the references listed after "?" are
            checked instead, with the errors the real apply gives (on a create,
            a scenario's topology annotation; each fromScenario, which must be
            pending or stored and annotated for the topology; each included
            topology, which must be pending, stored or a file on the server).
            An include that is neither pending nor stored is looked up as a
            file on the server, as the real apply does, so the answer shows
            whether that path exists on the server; grant workflow:create only
            to roles trusted with that (the default policies give it to Global
            Admin only). Only allowed with dryRun=true; otherwise, or for a
            value that is not a config name, the request is a 400.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: expect
          in: query
          description: >
            The action the caller expects, usually the action a previous dry
            run returned. If the server plans a different action, it returns
            409 and changes nothing. It is checked on dry runs as well as real
            applies. A value that is not an action is a 400 with the message
            invalid expect value "<value>" and the cause
            unknown workflow action "<value>".
          required: false
          schema:
            type: string
            enum:
              - none
              - create
              - createAndStart
              - update
              - updateAndStart
              - restart
      requestBody:
        description: phenix workflow config
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Workflow"
          application/x-yaml:
            schema:
              $ref: "#/components/schemas/Workflow"
      responses:
        "200":
          description: plan carried out, or only returned when dryRun is true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowResult"
        "400":
          description: >
            unsupported Content-Type, unparsable body, invalid dryRun, expect or
            pending value, pending without dryRun=true, Workflow schema failure
            (explained lines in metadata.validation, original validator text in
            metadata.validation-raw), invalid config (e.g. defaultBridge longer
            than 15 characters, a default bridge another experiment uses, or an
            auto.create that is not a valid experiment name), a topology or
            scenario that is missing, cannot be read for any reason, fails to
            decode, or fails to merge, a stored topology whose nodes an
            experiment could not use, or a pending reference that fails its
            check, all of which leave everything unchanged; or a failure to
            stop, reconfigure or start the experiment while the plan is carried
            out, which comes after changes were made
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: applying workflows is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            more than one experiment is mapped to the branch, auto.create names
            an existing experiment that is not mapped to the branch, or the
            planned action differs from expect, with nothing changed; or another
            request is starting or stopping the experiment while the plan is
            carried out, which comes after changes were made when it happens as
            the experiment is started after a create, update or stop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: internal error, or a failure while carrying out the plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/options":
    get:
      tags:
        - Workflow
      summary: Get server-side options
      description: >
        Server-side settings that clients read: every phenix CLI command
        fetches them over the unix socket when it starts, to inherit the
        server's bridge-mode, deploy-mode and use-gre-mesh, and the web UI's
        Experiments page reads them too. workflow-dry-run is true when
        POST /workflow/configs/{branch} and POST /workflow/apply/{branch} both
        support dryRun, and apply supports pending and expect. An older server
        ignores dryRun on /workflow/configs/{branch} and stores the config, so
        phenix workflow apply refuses servers without it.
      operationId: getOptions
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Options"
        "403":
          description: listing options is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/console":
    post:
      tags:
        - Console
      summary: Start a minimega console
      description: >-
        Starts a console owned by the requesting user. It ends if no websocket
        attaches within 15 seconds.
      operationId: postConsole
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Console"
        "403":
          description: the role may not start a console (miniconsole post)
        "405":
          description: the server was started without --minimega-console
        "500":
          description: the console could not be started
  "/console/{pid}":
    parameters:
      - name: pid
        in: path
        description: process ID of the console
        required: true
        schema:
          type: integer
    get:
      tags:
        - Console
      summary: Check that a console is still running
      description: >-
        Lets a client attach to the console it had open, after a reload or from
        another tab, instead of starting another.
      operationId: getConsole
      responses:
        "200":
          description: the console is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Console"
        "403":
          description: the role may not use a console (miniconsole get)
        "404":
          description: no running console with this pid belongs to the user
    delete:
      tags:
        - Console
      summary: End a console
      description: >-
        Kills the console's process and closes its websockets; the UI does this
        when the user logs out. Needs the permission that starts a console.
      operationId: deleteConsole
      responses:
        "204":
          description: the console has ended
        "403":
          description: the role may not start a console (miniconsole post)
        "404":
          description: no running console with this pid belongs to the user
        "500":
          description: the console's process did not end
  "/console/{pid}/ws":
    get:
      tags:
        - Console
      summary: Attach to a console using a WebSocket
      description: >-
        Binary frames carry the console's output: first up to 256 KiB of its
        recent output, then its live output. Frames sent are its input.
        Several websockets can attach at once, and closing one leaves the
        console running. The server closes the websocket normally (1000) once
        the console has ended.
      operationId: getConsoleWs
      parameters:
        - name: pid
          in: path
          description: process ID of the console
          required: true
          schema:
            type: integer
      responses:
        "101":
          description: switching protocols
        "403":
          description: the role may not use a console (miniconsole get)
        "404":
          description: no running console with this pid belongs to the user
  "/console/{pid}/size":
    post:
      tags:
        - Console
      summary: Set a console's terminal size
      description: >-
        Both query parameters are required and must be unsigned integers: a
        request without them, or with a value that is not all digits, does not
        match this route at all.
      operationId: postConsoleSize
      parameters:
        - name: pid
          in: path
          description: process ID of the console
          required: true
          schema:
            type: integer
        - name: cols
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 65535
        - name: rows
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 65535
      responses:
        "200":
          description: successful operation
        "400":
          description: the pid is not a number, or rows or cols is above 65535
        "403":
          description: the role may not start a console (miniconsole post)
        "404":
          description: no running console with this pid belongs to the user
        "500":
          description: the terminal size could not be set
  "/features":
    servers:
      - url: http://localhost:3000
    get:
      tags:
        - Features
      summary: List the server's enabled optional features
      description: >-
        Served from the server root rather than under `/api/v1`, and needs
        neither credentials nor a permission.
      operationId: getFeatures
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Features"
  "/version":
    servers:
      - url: http://localhost:3000
    get:
      tags:
        - Features
      summary: Get the server's build
      description: >-
        Served from the server root rather than under `/api/v1`, and needs
        neither credentials nor a permission.
      operationId: getVersion
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
  "/downloads/tunneler":
    servers:
      - url: http://localhost:3000
    get:
      tags:
        - Tunneler
      summary: List the tunneler builds installed on this server
      description: >-
        Names the phenix-tunneler builds in the server's `downloads/tunneler`
        directory, sorted, so the Tunneler page offers only downloads that
        exist. A build may be a link to a file elsewhere. Subdirectories,
        hidden files (names starting with a dot), broken links and anything
        else that is not a file are left out, and an empty list is returned
        once the directory is gone. Both
        download paths are served from the server root, not under `/api/v1`,
        and need neither credentials nor a permission. They exist only while
        the `tunneler-download` feature is on, which it is when that directory
        exists, relative to the directory the server runs from, at startup;
        without it, the request falls through to the web UI instead.
      operationId: getDownloadsTunneler
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tunnelers"
        "500":
          description: the downloads directory exists but could not be read
  "/downloads/tunneler/{name}":
    servers:
      - url: http://localhost:3000
    get:
      tags:
        - Tunneler
      summary: Download a tunneler build
      description: >-
        Serves one of the builds `GET /downloads/tunneler` lists, as an
        attachment under its own name. Only a file, or a link to one,
        directly in the downloads directory is served: a name that is a path,
        or that starts with a dot, is refused. Downloads resume with `Range`
        and `If-Range`, as other downloads do. Needs neither credentials nor a
        permission.
      operationId: getDownloadsTunnelerName
      parameters:
        - name: name
          in: path
          description: file name of the build, as the list reports it
          required: true
          schema:
            type: string
            example: phenix-tunneler-linux-amd64
        - $ref: "#/components/parameters/RangeHeader"
        - $ref: "#/components/parameters/IfRangeHeader"
        - $ref: "#/components/parameters/IfNoneMatchHeader"
      responses:
        "200":
          description: the build
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/LastModified"
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
            Repr-Digest:
              $ref: "#/components/headers/ReprDigest"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          $ref: "#/components/responses/PartialContent"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: the name is empty, is not a bare file name, or starts with a dot
        "404":
          description: no such build is installed on this server
        "500":
          description: the build could not be read or opened
    head:
      tags:
        - Tunneler
      summary: Check a tunneler build download
      description: >-
        The GET response's headers without the build: its size
        (Content-Length), `ETag` and `Last-Modified`.
      operationId: headDownloadsTunnelerName
      parameters:
        - name: name
          in: path
          description: file name of the build, as the list reports it
          required: true
          schema:
            type: string
            example: phenix-tunneler-linux-amd64
      responses:
        "200":
          description: the build's headers
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/LastModified"
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
            Repr-Digest:
              $ref: "#/components/headers/ReprDigest"
        "400":
          description: the name is empty, is not a bare file name, or starts with a dot
        "404":
          description: no such build is installed on this server
  "/webshark/json":
    servers:
      - url: http://localhost:3000
    get:
      tags:
        - Experiments
      summary: Answer WebShark's capture listing and download requests
      description: >-
        What the bundled WebShark asks of its server, with a capture name that
        `POST /experiments/{exp_name}/webshark` or a capture token gave as
        its only credential (see `GET /webshark/captures/{name}`).
        `method=files` lists no captures, since WebShark opens each one by
        name; `method=download` sends the capture as an attachment, needs a
        name that allows `download`, and resumes as other downloads do.
        Served from the server root, only when WebShark is installed. Errors
        are WebShark's JSON, `{"err": 1, "errstr": "..."}`.
      operationId: getWebsharkJson
      parameters:
        - name: method
          in: query
          description: what WebShark asks for
          required: true
          schema:
            type: string
            enum: [files, download]
        - name: capture
          in: query
          description: the capture name, for `download`
          required: false
          schema:
            type: string
      responses:
        "200":
          description: no captures, or the capture
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    title: Files
                    type: array
                    description: always empty
                    items:
                      type: string
                    example: []
                  pwd:
                    title: Pwd
                    type: string
                    description: always `.`
                    example: .
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: a method other than files or download
        "403":
          description: >-
            the capture name does not allow downloads, or a proxy that names
            its user named another user than the name's
        "404":
          description: >-
            no such capture name, one that has ended, or whose user may no
            longer read the capture, or a capture that is gone
        "503":
          description: the user's access to the capture could not be checked
  "/webshark/captures/{name}":
    servers:
      - url: http://localhost:3000
    get:
      tags:
        - Experiments
      summary: Read a capture for WebShark
      description: >-
        The capture a capture name names, as WebShark reads it to show it:
        the name is the only credential, bound to the user and session it was
        given to, and each use checks that the user may still read the
        capture. A saved capture resumes as other downloads do; a running
        capture sends the bytes captured so far, with no `ETag` or
        `Last-Modified` and `Cache-Control: no-store`. Served from the server
        root, only when WebShark is installed.
      operationId: getWebsharkCapturesName
      parameters:
        - name: name
          in: path
          description: the capture name
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/RangeHeader"
        - $ref: "#/components/parameters/IfRangeHeader"
        - $ref: "#/components/parameters/IfNoneMatchHeader"
      responses:
        "200":
          description: the capture
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          $ref: "#/components/responses/PartialContent"
        "304":
          $ref: "#/components/responses/NotModified"
        "403":
          description: >-
            the capture name does not allow viewing, or a proxy that names its
            user named another user than the name's
        "404":
          description: >-
            no such capture name, one that has ended, or whose user may no
            longer read the capture, or a capture that is gone
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
        "503":
          description: the user's access to the capture could not be checked
    head:
      tags:
        - Experiments
      summary: Check a capture for WebShark
      description: The GET response's headers without the capture.
      operationId: headWebsharkCapturesName
      parameters:
        - name: name
          in: path
          description: the capture name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: the capture's headers
        "403":
          description: the capture name does not allow viewing, or names another proxy user
        "404":
          description: no such capture name, one that has ended, or a capture that is gone
        "503":
          description: the user's access to the capture could not be checked
  "/webshark/streams/{token}":
    servers:
      - url: http://localhost:3000
    get:
      tags:
        - Virtual Machines
      summary: Stream a running VM packet capture with a stream token
      description: >-
        Streams the running capture a `pcs_` stream token from
        `POST /experiments/{exp_name}/capture-tokens` names, as
        `GET /experiments/{exp_name}/vms/{vm_name}/captures/{interface}/stream`
        does, for a command outside the browser, such as `curl -fsSN
        '<origin>/webshark/streams/<token>' | wireshark -k -i -`. Served from
        the server root, under the base path when there is one, rather than
        under `/api/v1`, and the token is its only credential: it needs no
        session token, and each use checks again that the token's user may
        still read the capture. The stream ends when the token does.
      operationId: getWebsharkStreamsToken
      parameters:
        - name: token
          in: path
          description: the stream token
          required: true
          schema:
            type: string
        - name: from
          in: query
          description: "`now` to skip packets captured before the request"
          required: false
          schema:
            type: string
            enum: [now]
      responses:
        "200":
          description: the capture, streamed as it grows
          content:
            application/vnd.tcpdump.pcap:
              schema:
                type: string
                format: binary
        "403":
          description: >-
            a proxy that names its user named another user than the token's
        "404":
          description: >-
            no such token, or one that has ended, been revoked, or whose user
            may no longer read the capture, or the interface is no longer
            being captured
        "503":
          description: the token's user's access could not be checked
  "/webshark/watch":
    servers:
      - url: http://localhost:3000
    get:
      tags:
        - Experiments
      summary: Follow a capture's growth for WebShark
      description: >-
        Server-sent events that tell WebShark when a running capture grows,
        so it reloads the capture: a `capture-changed` event whose `kind` is
        `init`, with the capture's size and modification time, then one of
        kind `append` each time it has grown, at most as often as its size
        allows, and `heartbeat` events between them. A saved capture gets
        only its `init`. The stream ends when the capture name does. Needs a
        capture name that allows `watch`. Served from the server root, only
        when WebShark is installed.
      operationId: getWebsharkWatch
      parameters:
        - name: capture
          in: query
          description: the capture name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >-
            the events, each `event: <name>` and `data: <JSON>`:
            `capture-changed` data is `{"size": <bytes>, "mtime":
            <milliseconds since the epoch>, "kind": "init" | "append"}`, and
            `heartbeat` data is `{"t": <milliseconds since the epoch>}`
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: capture-changed
                data: {"kind":"init","mtime":1767261600000,"size":4096}
        "403":
          description: >-
            the capture name does not allow watching, or a proxy that names its
            user named another user than the name's
        "404":
          description: >-
            no such capture name, one that has ended, or whose user may no
            longer read the capture, or a capture that is gone
        "503":
          description: the user's access to the capture could not be checked
  "/healthz":
    servers:
      - url: http://localhost:3000
    get:
      tags:
        - Health
      summary: Check the server's liveness
      description: >-
        Whether the server is up: its uptime and, for a BoltDB store, how long
        the store takes to list configs. An etcd store is checked only by
        /readyz, since restarting phenix would not fix an etcd outage. Results
        are cached briefly (the store for 2 seconds), and each check has a
        timeout, so probes are cheap. Needs no credentials; `output` fields
        need a token, or auth disabled.
      operationId: getHealthz
      responses:
        "200":
          description: the server is alive (status pass or warn)
          content:
            application/health+json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: the server is not alive (status fail)
          content:
            application/health+json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
    head:
      tags:
        - Health
      summary: Check the server's liveness, without a body
      operationId: headHealthz
      responses:
        "200":
          description: the server is alive (status pass or warn)
        "503":
          description: the server is not alive (status fail)
  "/readyz":
    servers:
      - url: http://localhost:3000
    get:
      tags:
        - Health
      summary: Check the server's readiness
      description: >-
        Whether the server can run experiments: minimega's response time,
        version and namespaces, the mesh size, the store, qemu-img, WebShark
        (when installed), disk use of the minimega files directory and the
        phenix base directory, the websocket broker, uptime and Go runtime
        numbers. Status is the worst of every check's: minimega not answering,
        an unreadable store or a disk at least 98% full fail; a disk at least
        90% full, a slow minimega or store, a missing qemu-img or WebShark, a
        shrunken mesh or a backed-up websocket queue warn. Results are cached
        per check (minimega for 5 seconds), so probes send minimega at most
        three commands every 5 seconds. Needs no credentials; `output` fields
        need a token, or auth disabled.
      operationId: getReadyz
      parameters:
        - name: exclude
          in: query
          description: >-
            checks to leave out, by name (`uptime`, `go`, `store`, `minimega`,
            `qemu-img`, `webshark`, `disk`, `websocket`); repeat it, or
            separate names with commas
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              example: disk
      responses:
        "200":
          description: the server is ready (status pass or warn)
          content:
            application/health+json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: the server is not ready (status fail)
          content:
            application/health+json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
    head:
      tags:
        - Health
      summary: Check the server's readiness, without a body
      operationId: headReadyz
      parameters:
        - name: exclude
          in: query
          description: checks to leave out, by name, as for GET
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: the server is ready (status pass or warn)
        "503":
          description: the server is not ready (status fail)
  "/jobs":
    get:
      tags:
        - Jobs
      summary: List background jobs
      description: >-
        The requesting user's jobs, and those of other users the role may list
        (`jobs` `list` on their experiment), newest first, without their items'
        `result`, which GET /jobs/{id} returns. Also served on the unix socket.
      operationId: getJobs
      parameters:
        - name: experiment
          in: query
          description: only the jobs of this experiment
          required: false
          schema:
            type: string
        - name: kind
          in: query
          description: only jobs of this kind
          required: false
          schema:
            type: string
            enum:
              - vms.action
              - files.archive
              - disk.clone
        - name: active
          in: query
          description: "`true` for only the jobs queued or running"
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: the jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    title: Jobs
                    description: the jobs the caller may see, newest first
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
  "/jobs/{id}":
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      tags:
        - Jobs
      summary: Get a background job
      description: >-
        The job with every item and its result. Needs to be the job's owner,
        or `jobs` `get`. Also served on the unix socket.
      operationId: getJob
      responses:
        "200":
          description: the job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: no such job, or another user's that the role may not get
    delete:
      tags:
        - Jobs
      summary: Dismiss a finished background job
      description: >-
        Forgets the job and deletes its artifact. Needs to be the job's owner,
        or `jobs` `delete`.
      operationId: deleteJob
      responses:
        "204":
          description: the job is dismissed
        "404":
          description: no such job, or another user's that the role may not delete
        "409":
          description: the job is still queued or running
  "/jobs/{id}/cancel":
    post:
      tags:
        - Jobs
      summary: Cancel a background job
      description: >-
        A queued job ends `canceled` at once. A running job ends `canceled`
        when its work notices: a VM action job after the VMs in progress, an
        archive or clone job at once, leaving no file. Needs to be the job's
        owner, or `jobs` `update`. Also served on the unix socket.
      operationId: postJobCancel
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "202":
          description: the job, with `cancelRequested`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: no such job, or another user's that the role may not cancel
        "409":
          description: >-
            the job has finished (`job has finished`), or cannot be canceled
            (`this job cannot be canceled`)
  "/jobs/{id}/artifact":
    get:
      tags:
        - Jobs
      summary: Download a background job's artifact
      description: >-
        The file the job produced, as an attachment. Downloads resume with
        `Range` and `If-Range`, as other downloads do. Needs to be the job's
        owner, or `jobs` `get`. An experiment file archive also needs
        `experiments/files` `get` on its experiment, checked on every
        download. A browser link may pass the token as `?token=`.
      operationId: getJobArtifact
      parameters:
        - $ref: "#/components/parameters/JobID"
        - $ref: "#/components/parameters/RangeHeader"
        - $ref: "#/components/parameters/IfRangeHeader"
        - $ref: "#/components/parameters/IfNoneMatchHeader"
      responses:
        "200":
          description: the artifact
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/LastModified"
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "206":
          $ref: "#/components/responses/PartialContent"
        "304":
          $ref: "#/components/responses/NotModified"
        "403":
          description: the role may no longer get the files the archive holds
        "404":
          description: no such job, another user's, or a job with no artifact
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
    head:
      tags:
        - Jobs
      summary: Check a background job's artifact
      description: The GET response's headers without the file.
      operationId: headJobArtifact
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: the artifact's headers
        "403":
          description: the role may no longer get the files the archive holds
        "404":
          description: no such job, another user's, or a job with no artifact
  "/roles":
    get:
      tags:
        - Users
      summary: List the roles
      description: Needs the `roles` `list` permission.
      operationId: getRoles
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    title: Roles
                    type: array
                    nullable: true
                    description: the roles; null when there are none
                    items:
                      $ref: "#/components/schemas/Role"
        "403":
          description: forbidden
        "500":
          description: the roles could not be read
  "/settings":
    get:
      tags:
        - Settings
      summary: Get the web UI settings
      description: >-
        The password rules, log file rotation and session timeout the web
        UI's Settings page edits, which the store holds. Needs no permission.
      operationId: getSettings
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "500":
          description: the settings could not be read
    post:
      tags:
        - Settings
      summary: Change the web UI settings
      description: >-
        Replaces every setting with the body's, which take effect at once. A
        field the body leaves out is set to its zero value, which
        `min_length` refuses, so send them all, as `GET /settings` returns
        them. Needs the `settings` `update` permission.
      operationId: postSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: the settings were changed
        "400":
          description: >-
            the body is not settings, or its password minimum length is not
            from 8 to 32; no setting is changed
        "403":
          description: forbidden
        "500":
          description: >-
            a setting could not be saved; the settings saved before it keep
            their new values
  "/settings/password":
    get:
      tags:
        - Settings
      summary: Get the password rules
      description: >-
        What a new password must have, which the sign-up and password forms
        check. Needs no permission.
      operationId: getSettingsPassword
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordSettings"
        "500":
          description: the settings could not be read
  "/settings/timeout":
    get:
      tags:
        - Settings
      summary: Get the web UI session timeout
      description: >-
        When the web UI signs an idle user out, and warns before it does.
        Needs no permission.
      operationId: getSettingsTimeout
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeoutSettings"
        "500":
          description: the settings could not be read
  "/logs":
    get:
      tags:
        - Logs
      summary: Get the server's log entries in a time range
      description: >-
        The entries of the server's system log file, rotated files included,
        from `start` to `end`, oldest first. The Logs page then follows new
        entries on the `/ws` websocket (`log` resource). Needs the `logs`
        `get` permission.
      operationId: getLogs
      parameters:
        - name: start
          in: query
          description: the time of the first entry, RFC 3339
          required: true
          schema:
            type: string
            format: date-time
          example: "2026-01-01T10:00:00Z"
        - name: end
          in: query
          description: the time of the last entry, RFC 3339; defaults to 30 seconds from now
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: the entries, an empty list when none match
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogEntry"
        "400":
          description: start is missing, or start or end is not an RFC 3339 time
        "403":
          description: forbidden
        "500":
          description: the log files could not be read
  "/ws":
    get:
      tags:
        - Events
      summary: Receive the server's events over a WebSocket
      description: |
        The web UI's event stream. Each text frame holds one or more JSON
        `WebSocketMessage`s, one per line: a change the server publishes,
        such as an `experiment` that was created, started or deleted, an
        `experiment/vm` that was started, stopped, redeployed or updated, a
        VM `experiment/vm/screenshot`, a `config`, `user`, `job` or `disks`
        change, `apps/<app>` trigger progress, a SCORCH `apps/scorch`
        update, or a `log` entry. A client gets only the messages its role
        may see, each checked against the permission of the route that
        made the change, and `log` entries only once it subscribes and only
        when its role may `get` `logs`.

        A client sends JSON `WebSocketRequest`s, of at most 2 KiB:

        - `{"resource": {"type": "log", "action": "subscribe"}}` (or
          `unsubscribe`) starts or stops the live log entries.
        - `{"resource": {"type": "experiment/vms", "name": "<exp>",
          "action": "list"}, "request": {...}}` asks for a page of the
          experiment's VMs, answered with an `experiment/vms` message, whose
          VMs then get `experiment/vm/screenshot` messages while the
          experiment runs; `request` takes `filter`, `show_dnb`,
          `sort_column`, `sort_asc`, `page_number` and `page_size`. A newer
          list replaces one not yet answered, and `unsubscribe` stops the
          screenshots. Needs `vms` `list`.
        - `{"resource": {"type": "metadata/screenshot"}, "request": {"size":
          "<width>"}}` sets the width of the client's screenshots, in pixels.
        - `{"resource": {"type": "experiment/topology", "name": "<exp>",
          "action": "search"}, "request": {"term": "hostname", "value":
          "<value>"}}` searches the experiment's network graph, as `GET
          /experiments/{name}/topology/search` does, answered with an
          `experiment/topology` message. Needs `experiments/topology` `get`.

        Requests the server cannot read are ignored. The server pings every
        54 seconds and drops a client that has not answered within 60, and
        closes a client that falls 256 messages behind with 1013 (Try Again
        Later) and the reason `client too slow`; the client reconnects and
        reloads what it shows. Every message carries `seq`, as the
        introduction describes. Needs a signed-in user, but no permission of
        its own.
      operationId: getWs
      responses:
        "101":
          description: switching protocols; `WebSocketMessage`s follow
        "400":
          description: not a websocket handshake
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
  - url: http://localhost:3000/api/v1
components:
  schemas:
    Console:
      title: Console
      description: A console started on the server.
      type: object
      properties:
        pid:
          title: PID
          example: 12345
          type: integer
          description: process ID of the console
      required:
        - pid
    Configs:
      title: "Configs"
      description: "Schema describing the Configs resource."
      type: object
      properties:
        configs:
          title: "Configs"
          description: "Configuration resources returned by the API."
          type: array
          items:
            $ref: "#/components/schemas/Config"
    Config:
      title: "Config"
      description: "Schema describing the Config resource."
      type: object
      properties:
        apiVersion:
          title: "API Version"
          description: "API version that identifies the resource representation."
          example: phenix.sandia.gov/v1
          type: string
        kind:
          title: "Kind"
          description: "Kind of configuration resource."
          example: Topology
          type: string
        metadata:
          title: "Metadata"
          description: "Metadata associated with the configuration resource."
          type: object
          properties:
            name:
              title: "Name"
              description: "Name used to identify this resource or entry."
              example: example-name
              type: string
            created:
              title: "Created"
              example: "2026-01-01T00:00:00Z"
              type: string
              readOnly: true
              description: when the config was first stored (RFC 3339); ignored on input
            updated:
              title: "Updated"
              example: "2026-01-02T00:00:00Z"
              type: string
              readOnly: true
              description: when the config was last written (RFC 3339, whole seconds); ignored on input
            revision:
              title: Revision
              example: 42
              type: integer
              format: int64
              readOnly: true
              description: >-
                set by the store on every write and only increasing; opaque, so
                compare it for equality only. Absent for a config not written
                since revisions were added. Ignored on input
            annotations:
              title: "Annotations"
              description: "String-valued annotations associated with the configuration resource."
              type: object
              additionalProperties:
                type: string
          required:
            - name
        spec:
          title: "Spec"
          description: "Configuration specification for the resource."
          type: object
          additionalProperties: true
      required:
        - apiVersion
        - kind
        - metadata
        - spec
    Experiments:
      title: "Experiments"
      description: "Schema describing the Experiments resource."
      type: object
      properties:
        experiments:
          title: "Experiments"
          description: "Experiments returned by the API."
          type: array
          items:
            $ref: "#/components/schemas/Experiment"
    Experiment:
      title: "Experiment"
      description: "Schema describing the Experiment resource."
      type: object
      properties:
        id:
          title: "ID"
          example: ""
          type: string
          description: unused; always empty
        name:
          title: "Name"
          description: "Name used to identify this resource or entry."
          example: example-name
          type: string
        topology:
          title: "Topology"
          description: "Topology configuration embedded in or referenced by this resource."
          example: example-topology
          type: string
        scenario:
          title: "Scenario"
          example: example-scenario
          type: string
          description: the scenario's name; empty when the experiment has none
        status:
          title: "Status"
          example: started
          type: string
          description: >-
            what the server is doing to the experiment (starting, stopping,
            creating, deleting, ...). `GET /experiments` otherwise reports
            started or stopped; other responses otherwise leave it empty.
        apps:
          title: "Apps"
          description: "Applications configured for this scenario."
          type: array
          items:
            type: string
        start_time:
          title: "Start Time"
          description: "Time when the experiment started."
          example: "2026-01-01T00:00:00Z"
          type: string
          format: date-time
        running:
          title: "Running"
          description: "Whether the experiment or VM is currently running."
          example: false
          type: boolean
        percent:
          title: Percent
          example: 0.5
          type: number
          description: >-
            start progress from 0 to 1 while the experiment is starting;
            reported by `GET /experiments` only
        vms_unknown:
          title: VMs Unknown
          example: false
          type: boolean
          description: >-
            minimega did not answer for every VM in `vms` (or was busy), so
            some are listed as configured with an empty state; only set when
            the response lists VMs
        vm_count:
          title: "VM Count"
          description: "Number of VMs associated with the experiment."
          example: 1
          type: integer
        delayed_vms:
          title: "Delayed VMs"
          description: "Number of VMs waiting for a delayed start condition."
          example: 1
          type: integer
        vlan_min:
          title: "VLAN Min"
          description: "Lowest VLAN ID allocated to the experiment."
          example: 1
          type: integer
        vlan_max:
          title: "VLAN Max"
          description: "Highest VLAN ID allocated to the experiment."
          example: 1
          type: integer
        vlan_count:
          title: "VLAN Count"
          description: "Number of VLANs allocated to the experiment."
          example: 1
          type: integer
        vlans:
          title: "VLANs"
          description: "VLAN IDs and aliases allocated to the experiment."
          type: array
          items:
            type: object
            properties:
              vlan:
                title: "VLAN"
                description: "VLAN alias or identifier assigned to the interface."
                example: 1
                type: integer
              alias:
                title: "Alias"
                description: "Alias assigned to this VLAN ID."
                example: EXP-1
                type: string
        vms:
          title: "VMs"
          description: "Virtual machines associated with the experiment."
          type: array
          items:
            $ref: "#/components/schemas/VM"
    VMs:
      title: "VMs"
      description: "Schema describing the VMs resource."
      type: object
      properties:
        vms:
          title: "VMs"
          description: "Virtual machines returned by the API."
          type: array
          items:
            $ref: "#/components/schemas/VM"
        total:
          title: Total
          example: 12
          type: integer
          description: how many VMs there are, before paging
        runtime_unknown:
          title: Runtime Unknown
          example: false
          type: boolean
          description: >-
            minimega did not answer for every VM of a running experiment (or
            was busy): VMs it did not report are listed as configured, with an
            empty state, instead of being left out
        observed_at:
          title: Observed At
          example: "2026-01-01T10:00:00Z"
          type: string
          format: date-time
          description: when minimega was read for the VMs; empty when it was not
    VM:
      title: "VM"
      description: "Schema describing the VM resource."
      type: object
      properties:
        name:
          title: "Name"
          description: "Name used to identify this resource or entry."
          example: example-name
          type: string
        experiment:
          title: "Experiment"
          description: "Name of the experiment containing the VM."
          example: example-experiment
          type: string
        host:
          title: "Host"
          description: "Cluster host assigned to or running the VM."
          example: compute-01
          type: string
        ipv4:
          title: "IPv4"
          description: "IPv4 addresses assigned to the virtual machine."
          type: array
          items:
            type: string
        cpus:
          title: "CPUs"
          description: "Number of virtual CPUs assigned to the VM."
          example: 1
          type: integer
        ram:
          title: "RAM"
          description: "Memory assigned to the VM, in megabytes."
          example: 1
          type: integer
        disk:
          title: "Disk"
          description: "Disk image or disk path used by the VM."
          example: ubuntu.qc2
          type: string
        dnb:
          title: "Do Not Boot"
          description: "Whether the VM should remain powered off."
          example: false
          type: boolean
        networks:
          title: "Networks"
          description: "Networks connected to the VM."
          type: array
          items:
            type: string
        taps:
          title: "Taps"
          description: "Tap interfaces associated with the VM."
          type: array
          items:
            type: string
        captures:
          title: "Captures"
          description: "Packet captures associated with the VM or experiment."
          type: array
          items:
            $ref: "#/components/schemas/Capture"
        running:
          title: "Running"
          description: "Whether the experiment or VM is currently running."
          example: false
          type: boolean
        busy:
          title: "Busy"
          description: "Whether an operation is currently acting on the VM."
          example: false
          type: boolean
        state:
          title: "State"
          description: "Current minimega state of the VM."
          example: running
          type: string
        cdRom:
          title: CD ROM
          description: the image in the VM's CD-ROM drive, if any
          example: tools.iso
          type: string
        tags:
          title: "Tags"
          description: "String tags associated with the VM."
          type: object
          additionalProperties:
            type: string
        ccActive:
          title: CC Active
          description: whether the VM's miniccc agent is connected
          example: false
          type: boolean
        external:
          title: "External"
          description: "Whether the VM represents an external node outside minimega."
          example: false
          type: boolean
        delayed_start:
          title: "Delayed Start"
          description: "Description of the VM start delay, if any."
          example: timer:30s
          type: string
        snapshot:
          title: "Snapshot"
          description: "Whether to take a VM disk snapshot."
          example: false
          type: boolean
        inject_partition:
          title: "Inject Partition"
          description: "Disk partition used for file injection."
          example: 1
          type: integer
        description:
          title: Description
          description: the VM's description from the topology
          example: Web server
          type: string
        uptime:
          title: "Uptime"
          description: "Elapsed time since the host or VM started."
          example: 1
          type: number
          format: float
        screenshot:
          title: "Screenshot"
          description: "Base64-encoded screenshot data URL, when requested."
          example: data:image/png;base64,aGVsbG8=
          type: string
        annotations:
          title: Annotations
          type: object
          additionalProperties: true
          nullable: true
          description: >-
            the node's annotations; only a single VM's GET response, and its
            PATCH response when the role may also get the VM, carry them. VM
            lists, other responses and websocket updates send null.
    Schedule:
      title: "Schedule"
      description: "Schema describing the Schedule resource."
      type: object
      properties:
        schedule:
          title: "Schedule"
          description: "VM-to-host placement assignments."
          type: array
          items:
            type: object
            properties:
              vm:
                title: "VM"
                description: "Name of the VM associated with this result."
                example: node-01
                type: string
              host:
                title: "Host"
                description: "Cluster host assigned to or running the VM."
                example: compute-01
                type: string
              auto_assigned:
                title: "Auto Assigned"
                description: "Whether the scheduler selected this host automatically."
                example: false
                type: boolean
    Captures:
      title: "Captures"
      description: "Schema describing the Captures resource."
      type: object
      properties:
        captures:
          title: "Captures"
          description: "Packet captures associated with the VM or experiment."
          type: array
          items:
            $ref: "#/components/schemas/Capture"
    Capture:
      title: "Capture"
      description: "Schema describing the Capture resource."
      type: object
      properties:
        vm:
          title: "VM"
          description: "Name of the VM associated with this result."
          example: node-01
          type: string
        interface:
          title: "Interface"
          description: "Network interface index used for the packet capture."
          example: 1
          type: integer
        filepath:
          title: "Filepath"
          description: "Path to the packet capture file."
          example: /phenix/captures/capture.pcap
          type: string
    CaptureToken:
      title: Capture Token
      description: A capture token, as the experiment's capture token routes give and list it.
      type: object
      properties:
        id:
          title: ID
          type: string
          description: not secret; names the token in listings, logs and revocation
          example: 3f9a0c51d2e47b86
        token:
          title: Token
          type: string
          description: >-
            the token, only when it is given: `pcs_<random>` for a stream, or
            a WebShark capture name
          example: pcs_k2j4m6n8p1q3r5s7t9v2w4x6y8
        operations:
          title: Operations
          description: what the token may be used for
          type: array
          items:
            type: string
            enum: [stream, view, download, watch]
        expires:
          title: Expires
          example: "2026-01-01T12:00:00Z"
          type: string
          format: date-time
          description: when the token, and anything it opened, ends at the latest
        useBy:
          title: Use By
          example: "2026-01-01T10:05:00Z"
          type: string
          format: date-time
          description: a stream token's last moment to start a stream
        lastUsed:
          title: Last Used
          description: when the token was last used
          example: "2026-01-01T10:05:00Z"
          type: string
          format: date-time
        uses:
          title: Uses
          description: how many times the token has been used
          example: 1
          type: integer
        experiment:
          title: Experiment
          description: the experiment the capture belongs to
          example: exp1
          type: string
        target:
          title: Target
          description: the capture the token reads
          type: object
          properties:
            path:
              title: Path
              example: captures/router_eth0.pcap
              type: string
              description: the experiment file holding the capture, when known
            vm:
              title: VM
              description: the VM whose interface is captured, for a running capture
              example: router
              type: string
            interface:
              title: Interface
              description: the index of the captured VM interface, for a running capture
              example: 0
              type: integer
        urls:
          title: URLs
          type: object
          description: where to use the token, relative to the UI's base path
          properties:
            stream:
              title: Stream
              description: where a stream token streams the capture as pcap
              type: string
              example: webshark/streams/pcs_k2j4m6n8p1q3r5s7t9v2w4x6y8
            view:
              title: View
              description: where WebShark opens the capture
              type: string
              example: webshark/embed?capture=router-k2j4m6n8p1q3r5s7t9v2w4x6y8.pcap
    Snapshots:
      title: "Snapshots"
      description: "Schema describing the Snapshots resource."
      type: object
      properties:
        snapshots:
          title: "Snapshots"
          description: "Snapshot names available for the VM."
          type: array
          items:
            type: string
    Files:
      title: "Files"
      description: "Schema describing the Files resource."
      type: object
      properties:
        files:
          title: "Files"
          type: array
          description: the files on the requested page, or all of them
          items:
            type: object
            properties:
              name:
                title: Name
                description: the file's name
                example: router_eth0.pcap
                type: string
              path:
                title: Path
                example: captures/router_eth0.pcap
                type: string
                description: path relative to the experiment's files directory
              date:
                title: Date
                description: when the file was last modified
                example: "2026-01-01 10:00:00"
                type: string
              size:
                title: Size
                description: the file's size in bytes
                example: 1048576
                type: integer
              categories:
                title: Categories
                description: what the file is, such as `Packet Capture`, `Scorch Artifact` or `Filebeat`
                type: array
                items:
                  type: string
              plainText:
                title: Plain Text
                description: whether the file is plain text the Files tab can show
                example: false
                type: boolean
              isDir:
                title: Is Dir
                description: whether the entry is a directory
                example: false
                type: boolean
        total:
          title: Total
          example: 12
          type: integer
          description: how many files match, before paging
    FilePaths:
      title: File Paths
      description: Experiment files to act on, by their paths as listed.
      type: object
      required:
        - paths
      properties:
        paths:
          title: Paths
          type: array
          description: file paths relative to the experiment's files directory, as listed
          items:
            type: string
    FilesDeleted:
      title: Files Deleted
      description: The outcome of deleting several experiment files.
      type: object
      properties:
        deleted:
          title: Deleted
          description: the paths that were deleted
          type: array
          items:
            type: string
        failed:
          title: Failed
          description: the paths that could not be deleted, with the reason
          type: array
          items:
            type: object
            properties:
              path:
                title: Path
                description: the file's path as the request named it
                example: captures/router_eth0.pcap
                type: string
              error:
                title: Error
                description: why the file could not be deleted
                example: no such file
                type: string
    ScorchPipelines:
      title: Scorch Pipelines
      type: object
      description: >-
        Every Scorch run of an experiment, with the state of the scorch app
        and of the experiment itself.
      properties:
        pipelines:
          title: Pipelines
          type: array
          description: >-
            one pipeline per run in the scorch app metadata, in run order,
            each the run's top-level loop; null when it configures no runs
          nullable: true
          items:
            $ref: "#/components/schemas/ScorchPipeline"
        running:
          title: Running
          type: integer
          description: >-
            the run the scorch app is executing, or -1 when the app is not
            running or has reported no run
          example: -1
        app_running:
          title: App Running
          example: false
          type: boolean
          description: whether the scorch app itself is running
        experiment:
          title: Experiment
          type: object
          description: the experiment's own state, so the Scorch page can show it
          properties:
            status:
              title: Status
              example: started
              type: string
              description: >-
                started, stopped, or what the server is doing to it (starting,
                stopping, ...)
    ScorchPipeline:
      title: Scorch Pipeline
      type: object
      description: >-
        One loop of a run's pipeline: a node per stage (`configure`, `start`, a
        `loop` node when this loop nests another, `stop`, `cleanup` and
        `done`), a node per component the loop names, and the edges that order
        them. A node's index is its position in `pipeline`, which is what an
        edge points at.
      properties:
        name:
          title: Name
          example: baseline
          type: string
          description: the run's name, when the run's metadata names it
        hasCleanup:
          title: Has Cleanup
          example: true
          type: boolean
          description: >-
            whether this loop defines cleanup components. For a run's
            top-level loop (loop 0) those are the run's, which can be run on
            their own; for a nested loop they are that loop's.
        pipeline:
          title: Pipeline
          description: the loop's nodes; an edge names a node by its index here
          type: array
          items:
            $ref: "#/components/schemas/ScorchPipelineNode"
    ScorchPipelineNode:
      title: Scorch Pipeline Node
      description: A stage or component of a Scorch pipeline loop.
      type: object
      properties:
        name:
          title: Name
          example: configure
          type: string
          description: the stage's name, or the component's
        hint:
          title: Hint
          example: ""
          type: string
          description: always sent, always empty at present
        status:
          title: Status
          type: string
          description: the latest status reported for the node
          enum:
            - unknown
            - running
            - background
            - unstable
            - success
            - failure
        stage:
          title: Stage
          example: start
          type: string
          description: the stage a component node belongs to; empty on a stage node
        exp:
          title: Exp
          description: the experiment's name
          example: exp1
          type: string
        run:
          title: Run
          description: the run's index in the scorch app metadata
          example: 0
          type: integer
        loop:
          title: Loop
          description: the loop's nesting depth, 0 for a run's top-level loop
          example: 0
          type: integer
        next:
          title: Next
          type: array
          description: edges to the nodes that follow this one
          items:
            $ref: "#/components/schemas/ScorchPipelineEdge"
    ScorchPipelineEdge:
      title: Scorch Pipeline Edge
      description: An edge of a Scorch pipeline, to the node that follows.
      type: object
      properties:
        index:
          title: Index
          example: 1
          type: integer
          description: position of the node the edge points at in `pipeline`
        weight:
          title: Weight
          example: 0
          type: integer
          description: 0 until the edge has been taken, then 2
    Hosts:
      title: "Hosts"
      description: "Schema describing the Hosts resource."
      type: object
      properties:
        hosts:
          title: "Hosts"
          description: "The cluster hosts the role may list."
          type: array
          items:
            $ref: "#/components/schemas/Host"
    Host:
      title: "Host"
      description: "Schema describing the Host resource."
      type: object
      properties:
        name:
          title: "Name"
          description: "Name used to identify this resource or entry."
          example: example-name
          type: string
        cpus:
          title: "CPUs"
          description: "Number of CPUs available on the cluster host."
          example: 1
          type: integer
        cpucommit:
          title: "CPU Commit"
          description: "Number of CPUs committed to virtual machines on the host."
          example: 2
          type: integer
        load:
          title: "Load"
          example:
            - "0.50"
            - "0.75"
            - "1.00"
          type: array
          description: the 1, 5 and 15 minute load averages
          items:
            example: "0.50"
            type: string
        memused:
          title: "Memused"
          description: "Memory in use on the cluster host, in megabytes."
          example: 1
          type: integer
        memtotal:
          title: "Memtotal"
          description: "Total memory on the cluster host, in megabytes."
          example: 8192
          type: integer
        memcommit:
          title: "Memory Commit"
          description: "Memory committed to virtual machines on the host, in megabytes."
          example: 2048
          type: integer
        tx:
          title: "Transmit"
          description: "Transmit bandwidth value reported for the cluster host."
          example: 0.0
          type: number
        rx:
          title: "Receive"
          description: "Receive bandwidth value reported for the cluster host."
          example: 0.0
          type: number
        bandwidth:
          title: "Bandwidth"
          description: "Network bandwidth reported for the cluster host."
          example: "rx: 0.0 / tx: 0.0"
          type: string
        diskusage:
          title: "Disk Usage"
          type: object
          description: >-
            percent in use of the disks holding the phenix and minimega base
            directories
          properties:
            diskphenix:
              title: "Phenix Disk Usage"
              description: "Percentage of the host filesystem used by phēnix."
              example: 42.5
              type: number
            diskminimega:
              title: "Minimega Disk Usage"
              description: "Percentage of the host filesystem used by minimega."
              example: 35.0
              type: number
        netcommit:
          title: "Network Commit"
          description: "Network capacity committed to virtual machines on the host."
          example: 0
          type: integer
        vms:
          title: "VMs"
          description: "Virtual machines returned by the API."
          example: 1
          type: integer
        uptime:
          title: "Uptime"
          description: "Elapsed time since the host or VM started."
          example: 1
          type: number
          format: float
        schedulable:
          title: "Schedulable"
          description: "Whether the cluster host can run VMs."
          example: false
          type: boolean
        headnode:
          title: "Headnode"
          description: "Whether this host is the cluster headnode."
          example: false
          type: boolean
    Applications:
      title: "Applications"
      description: "Schema describing the Applications resource."
      type: object
      properties:
        applications:
          title: "Applications"
          description: "Application names available to experiments."
          type: array
          items:
            type: string
    BuilderTopology:
      title: "Builder Topology"
      description: "Schema describing the Builder Topology resource."
      type: object
      required:
        - topology
        - builderXML
      properties:
        name:
          title: "Name"
          example: example-name
          type: string
          description: >-
            topology name; required by POST /builder/topologies and ignored by
            PUT /builder/topologies/{name}
        topology:
          title: "Topology"
          type: object
          description: generated topology spec
          properties:
            nodes:
              title: "Nodes"
              description: "Nodes that make up the topology."
              type: array
              items:
                type: object
        builderXML:
          title: "Builder XML"
          example: <mxGraphModel/>
          type: string
          description: mxGraph document for the diagram
        vlans:
          title: "VLANs"
          type: object
          description: VLAN alias to ID, used by the experiment endpoints only
          additionalProperties:
            type: integer
        scenario:
          title: "Scenario"
          example: example-scenario
          type: string
          description: scenario name, used by the experiment endpoints only
    Topologies:
      title: "Topologies"
      description: "Schema describing the Topologies resource."
      type: object
      properties:
        topologies:
          title: "Topologies"
          description: "Topology names returned by the API."
          type: array
          items:
            type: string
    Disks:
      title: "Disks"
      description: "Schema describing the Disks resource."
      type: object
      properties:
        disks:
          title: "Disks"
          type: array
          description: sorted by name, then by full path
          items:
            $ref: "#/components/schemas/Disk"
    Disk:
      title: Disk
      description: A disk image the server found in or under the minimega files directory.
      type: object
      properties:
        kind:
          title: Kind
          description: what the image is for, from its file type
          type: string
          enum: [VM, Container, ISO, Unknown]
        name:
          title: Name
          example: ubuntu.qc2
          type: string
          description: >-
            the image's file name, which `disks` permissions name; images in
            different folders can share it
        fullPath:
          title: Full Path
          example: /phenix/images/ubuntu.qc2
          type: string
          description: >-
            the image's absolute path, without `.` or `..` segments, which
            identifies it
        relativePath:
          title: Relative Path
          example: ubuntu.qc2
          type: string
          description: >-
            the image's path relative to the minimega files directory, or empty
            when the image is outside it
        outsideFilesDir:
          title: Outside Files Dir
          example: false
          type: boolean
          description: whether the image is outside the minimega files directory
        readOnly:
          title: Read Only
          example: false
          type: boolean
          description: >-
            whether the disk actions refuse the image: it is outside the
            minimega files directory, or in a folder the disk list leaves out,
            such as an experiment's files
        size:
          title: Size
          example: 2.1 GiB
          type: string
          description: size of the file, as a readable string
        virtualSize:
          title: Virtual Size
          example: 20 GiB
          type: string
          description: size the guest sees, as a readable string
        experiments:
          title: Experiments
          type: array
          description: >-
            experiments whose topology uses the image, directly or as the
            backing image of an image it uses
          nullable: true
          items:
            type: object
            properties:
              name:
                title: Name
                description: the experiment's name
                example: exp1
                type: string
              running:
                title: Running
                description: whether the experiment is running
                example: false
                type: boolean
        backingImages:
          title: Backing Images
          type: array
          description: >-
            the full paths of the images this one is backed by, nearest first
          items:
            type: string
        inUse:
          title: In Use
          example: false
          type: boolean
          description: whether the image's file is in use, such as by a running VM
    Users:
      title: "Users"
      description: "Schema describing the Users resource."
      type: object
      properties:
        users:
          title: "Users"
          description: "Users returned by the API."
          type: array
          items:
            $ref: "#/components/schemas/User"
    User:
      title: "User"
      description: "Schema describing the User resource."
      type: object
      properties:
        username:
          title: "Username"
          description: "Username used to identify the account."
          example: user@example.org
          type: string
        first_name:
          title: "First Name"
          description: "User given name."
          example: Alex
          type: string
        last_name:
          title: "Last Name"
          description: "User family name."
          example: Example
          type: string
        role:
          title: "Role"
          description: "Role and policies assigned to the user."
          allOf:
            - $ref: "#/components/schemas/Role"
        resource_names:
          title: "Resource Names"
          description: "Resource names assigned to the user."
          type: array
          items:
            type: string
        proxy_token:
          title: "Proxy Token"
          description: "Authentication token supplied by a trusted proxy."
          example: proxy-token-example
          type: string
          readOnly: true
    Credentials:
      title: "Credentials"
      description: "Schema describing the Credentials resource."
      type: object
      properties:
        user:
          title: "User"
          description: "The signed-in user."
          allOf:
            - $ref: "#/components/schemas/User"
        token:
          title: "Token"
          description: "Authentication token returned for subsequent API requests."
          example: eyJhbGciOi...example
          type: string
    Workflow:
      type: object
      title: Workflow
      description: >-
        A phenix workflow config: what applying a workflow branch creates,
        updates or restarts one experiment from.
      additionalProperties: false
      required:
        - apiVersion
        - kind
        - spec
      properties:
        apiVersion:
          example: phenix.sandia.gov/v0
          type: string
          title: API Version
          description: The config API version; a workflow config is phenix.sandia.gov/v0.
          enum:
            - phenix.sandia.gov/v0
        kind:
          example: Workflow
          type: string
          title: Kind
          description: The config kind, which is always Workflow.
          enum:
            - Workflow
        metadata:
          type: object
          title: Metadata
          description: >-
            Not read by the server; it is accepted so a workflow config has the
            same four top-level keys as every other phenix config, and so a later
            version can carry a name or annotations without a breaking change.
          nullable: true
        spec:
          type: object
          title: Workflow Spec
          description: >-
            What an apply may do and the experiment settings it sets; an empty
            spec applies every default.
          additionalProperties: false
          properties:
            auto:
              type: object
              title: Auto
              description: What an apply may do to the experiment mapped to the workflow branch without being asked.
              nullable: true
              additionalProperties: false
              properties:
                create:
                  example: example
                  type: string
                  title: Create
                  description: >-
                    The name of the experiment to create when none is mapped to
                    the branch; unset never creates one.
                  nullable: true
                update:
                  example: false
                  type: boolean
                  title: Update
                  description: >-
                    Whether an apply may update the experiment already mapped to
                    the branch; defaults to true when unset.
                  nullable: true
                restart:
                  example: false
                  type: boolean
                  title: Restart
                  description: >-
                    Whether an apply may start a new or updated experiment and
                    stop and restart a running one; defaults to true when unset.
                  nullable: true
            topology:
              example: example-topology
              type: string
              title: Topology
              description: >-
                The name of the topology config; required to create an
                experiment, and on an update defaults to the experiment's
                current topology.
              nullable: true
            scenario:
              example: example-scenario
              type: string
              title: Scenario
              description: The name of the scenario config; on an update defaults to the experiment's current scenario.
              nullable: true
            vlans:
              type: object
              title: VLANs
              description: >-
                VLAN alias to VLAN ID; every alias used by an interface in the
                topology is set to its ID here, or left for minimega to pick
                when not listed.
              nullable: true
              additionalProperties:
                type: integer
            schedules:
              type: object
              title: Schedules
              description: >-
                VM hostname to cluster host; each listed non-external node of
                the topology is scheduled on that host.
              nullable: true
              additionalProperties:
                type: string
            deployMode:
              example: all
              type: string
              title: Deploy Mode
              description: >-
                Where VMs are deployed, all, no-headnode or only-headnode in any
                letter case; unset or empty uses the server's deploy-mode
                setting.
              nullable: true
              pattern: '^(?i:all|no-headnode|only-headnode)?$'
            useGREMesh:
              example: false
              type: boolean
              title: Use GRE Mesh
              description: >-
                Whether the experiment uses a GRE mesh between cluster hosts; it
                is OR-ed with the server's use-gre-mesh setting, so either turns
                it on.
              nullable: true
            vlanRange:
              type: object
              title: VLAN Range
              description: The range of VLAN IDs the experiment may allocate from; unset leaves both ends unset.
              nullable: true
              additionalProperties: false
              properties:
                min:
                  example: 1
                  type: integer
                  title: Minimum
                  description: The lowest VLAN ID the experiment may use; 0 leaves the minimum unset.
                  nullable: true
                max:
                  example: 1
                  type: integer
                  title: Maximum
                  description: The highest VLAN ID the experiment may use; 0 leaves the maximum unset.
                  nullable: true
            defaultBridge:
              example: phenix
              type: string
              title: Default Bridge
              description: >-
                The bridge the experiment's VMs attach to by default; defaults to
                phenix, is at most 15 characters (the Linux interface name
                limit), and unless it is phenix no other experiment may use it.
              nullable: true
              maxLength: 15
    WorkflowResult:
      title: "Workflow Result"
      description: "Schema describing the Workflow Result resource."
      type: object
      properties:
        action:
          title: "Action"
          description: "Action planned or performed by the workflow."
          example: create
          type: string
          enum:
            - none
            - create
            - createAndStart
            - update
            - updateAndStart
            - restart
        experiment:
          title: "Experiment"
          example: example-experiment
          type: string
          description: experiment the action applies to (empty when no experiment is involved)
        reason:
          title: "Reason"
          example: No changes are needed.
          type: string
          description: why nothing was done, when action is none
        dryRun:
          title: "Dry Run"
          example: false
          type: boolean
          description: true when nothing was changed because dryRun was requested
    WorkflowConfigResult:
      title: "Workflow Config Result"
      type: object
      description: what POST /workflow/configs/{branch}?dryRun=true would do
      properties:
        action:
          title: "Action"
          example: create
          type: string
          enum:
            - create
            - update
          description: whether the request would create the config or update the stored one
        kind:
          title: "Kind"
          example: Topology
          type: string
          description: the config's kind, e.g. Topology
        name:
          title: "Name"
          example: example-name
          type: string
          description: the config's name after the server filled in its placeholders, such as ${BRANCH_NAME}
        dryRun:
          title: "Dry Run"
          example: false
          type: boolean
          description: always true
        pending:
          title: "Pending"
          example: Topology/example-topology
          type: string
          description: >
            the value to pass as pending to a dry run of
            POST /workflow/apply/{branch}: Kind/name, followed for a scenario by
            ?from=...&topology=... (its fromScenario names and topology
            annotation) and for a topology that includes others by ?include=...
    Options:
      title: "Options"
      description: "Schema describing the Options resource."
      type: object
      properties:
        bridge-mode:
          title: "Bridge Mode"
          description: "Bridge mode configured on the server."
          example: native
          type: string
        deploy-mode:
          title: "Deploy Mode"
          description: "Default VM deployment mode configured on the server."
          example: all
          type: string
        use-gre-mesh:
          title: "Use Gre Mesh"
          description: "Whether the server uses a GRE mesh between cluster hosts."
          example: false
          type: boolean
        base-dir.injects:
          title: "Inject Directory"
          example: /phenix/injects
          type: string
          description: directory phenix workflow apply stages injects into
        workflow-dry-run:
          title: "Workflow Dry Run"
          example: false
          type: boolean
          description: >
            true when POST /workflow/configs/{branch} and POST /workflow/apply/{branch}
            support dryRun, and apply supports pending and expect
    Error:
      title: "Error"
      description: "Schema describing the Error resource."
      type: object
      properties:
        message:
          title: "Message"
          example: Request could not be completed.
          type: string
          description: what went wrong; for a config validation failure, the first explained line
        cause:
          title: "Cause"
          example: Resource not found.
          type: string
          description: the underlying error text
        metadata:
          title: "Metadata"
          type: object
          description: extra details, returned for some errors
          properties:
            validation:
              title: "Validation"
              example: example
              type: string
              description: >
                for a schema validation failure, the explained lines separated by
                newlines, each in the form <item> "<hostname|name>" (line N): <what>
                (at <sub-path>), with (line N) left out for single-line sources and
                an extra hint line for a misplaced key; an error that cannot be
                placed in the source (in a templated key, in data a config hook
                added, in a YAML merge key, or a missing or misindented
                metadata.name) keeps the validator's text; for an unparsable body
                sent to POST /configs, the parser error
            validation-raw:
              title: "Validation Raw"
              example: example
              type: string
              description: for a schema validation failure, the original validator text
          additionalProperties:
            type: string
    SoHSummaries:
      title: So HSummaries
      description: The state of health of every experiment the caller may see.
      type: object
      properties:
        experiments:
          title: Experiments
          description: one summary per experiment
          type: array
          items:
            $ref: "#/components/schemas/SoHSummary"
    SoHSummary:
      title: So HSummary
      type: object
      description: >-
        One experiment's state of health. Only `name`, `scenario`, `status`,
        `running`, `configured` and `vms.total` are reported for a stopped
        experiment.
      properties:
        name:
          title: Name
          description: the experiment's name
          example: exp1
          type: string
        scenario:
          title: Scenario
          description: the experiment's scenario
          example: soh-scenario
          type: string
        status:
          title: Status
          example: started
          type: string
          description: started, stopped, or what the server is doing to it (starting, stopping, ...)
        percent:
          title: Percent
          example: 0.5
          type: number
          description: start progress from 0 to 1 while starting
        running:
          title: Running
          description: whether the experiment is running
          example: true
          type: boolean
        configured:
          title: Configured
          example: true
          type: boolean
          description: whether the scenario includes the soh app
        started:
          title: Started
          description: whether the experiment's start has finished
          example: true
          type: boolean
        soh_initialized:
          title: SoH Initialized
          example: true
          type: boolean
          description: whether the soh app has finished a run
        soh_running:
          title: SoH Running
          example: false
          type: boolean
          description: whether the soh app is running now
        vms:
          title: VMs
          description: the experiment's VMs by state
          allOf:
            - $ref: "#/components/schemas/SoHVMCounts"
        down_vms:
          title: Down VMs
          type: array
          description: VMs not running or not deployed (at most 50)
          items:
            type: string
        vms_error:
          title: VMs Error
          example: minimega is busy
          type: string
          description: why minimega could not be asked for VM states
        vms_observed_at:
          title: VMs Observed At
          example: "2026-01-01T10:00:00Z"
          type: string
          format: date-time
          description: when minimega was read for the VM counts
        vms_stale:
          title: VMs Stale
          example: false
          type: boolean
          description: >-
            the VM counts are the states last read, served while minimega is
            busy starting or stopping an experiment
        hosts:
          title: Hosts
          example: 5
          type: integer
          description: hosts with results
        hosts_with_errors:
          title: Hosts With Errors
          description: hosts with a failing check
          example: 1
          type: integer
        checks:
          title: Checks
          description: every check of the latest results, reachability checks included
          allOf:
            - $ref: "#/components/schemas/SoHTally"
        reachability:
          title: Reachability
          description: the reachability checks of the latest results
          allOf:
            - $ref: "#/components/schemas/SoHTally"
        last_run:
          title: Last Run
          example: "2026-01-01T10:00:00Z"
          type: string
          format: date-time
          description: when the last run finished (the newest check for results from older versions)
        last_run_duration:
          title: Last Run Duration
          example: 12.5
          type: number
          description: seconds the last run took
        history:
          title: History
          type: array
          description: the last 20 runs, oldest first
          items:
            $ref: "#/components/schemas/SoHRun"
        failing_checks:
          title: Failing Checks
          type: array
          description: failing checks from the latest results, newest first (at most 50)
          items:
            $ref: "#/components/schemas/SoHFailingCheck"
        error:
          title: Error
          example: reading soh results failed
          type: string
          description: why the experiment's soh results could not be read
    SoHVMCounts:
      title: So HVMCounts
      type: object
      description: >-
        VMs by state. `known` is false when minimega was not or could not be
        asked; only `total` is set then. `failing` counts running VMs with a
        failing check.
      properties:
        known:
          title: Known
          description: whether minimega was asked for the VMs' states
          example: true
          type: boolean
        total:
          title: Total
          description: VMs in the experiment
          example: 5
          type: integer
        running:
          title: Running
          description: running VMs
          example: 5
          type: integer
        failing:
          title: Failing
          description: running VMs with a failing check
          example: 1
          type: integer
        notrunning:
          title: Notrunning
          description: deployed VMs that are not running
          example: 0
          type: integer
        notboot:
          title: Notboot
          description: VMs marked do not boot
          example: 0
          type: integer
        notdeploy:
          title: Notdeploy
          description: VMs configured but not deployed
          example: 0
          type: integer
        external:
          title: External
          description: external VMs, which minimega does not run
          example: 0
          type: integer
        delayed:
          title: Delayed
          description: VMs whose start is delayed
          example: 0
          type: integer
    SoHTally:
      title: So HTally
      description: A count of checks; `passing` plus `failing` is `total`.
      type: object
      properties:
        total:
          title: Total
          description: checks counted
          example: 40
          type: integer
        passing:
          title: Passing
          description: checks that passed
          example: 38
          type: integer
        failing:
          title: Failing
          description: checks that failed
          example: 2
          type: integer
    SoHRun:
      title: So HRun
      description: One completed run of the soh checks.
      type: object
      properties:
        time:
          title: Time
          description: when the run finished
          example: "2026-01-01T10:00:00Z"
          type: string
          format: date-time
        duration:
          title: Duration
          description: seconds the run took
          example: 12.5
          type: number
        total:
          title: Total
          description: checks run
          example: 40
          type: integer
        failing:
          title: Failing
          description: checks that failed
          example: 2
          type: integer
        hosts_failing:
          title: Hosts Failing
          description: VMs with a failing check
          example: 1
          type: integer
        hosts_down:
          title: Hosts Down
          description: VMs whose networking check failed
          example: 0
          type: integer
    SoHFailingCheck:
      title: So HFailing Check
      description: One failing check from the latest soh results.
      type: object
      properties:
        host:
          title: Host
          description: the VM the check ran on
          example: web
          type: string
        check:
          title: Check
          description: the kind of check
          type: string
          enum:
            - network
            - reachability
            - file
            - file absent
            - service
            - process
            - listener
            - container
            - custom test
        target:
          title: Target
          description: what the check looked for, such as an address, file, service or process
          example: 10.0.0.1
          type: string
        error:
          title: Error
          description: why the check failed
          example: no route to host
          type: string
        time:
          title: Time
          description: when the check ran
          example: "2026-01-01T10:00:00Z"
          type: string
          format: date-time
    Version:
      title: Version
      description: The phenix build the server runs.
      type: object
      properties:
        commit:
          title: Commit
          example: 059cd25b
          type: string
          description: the git commit the server was built from
        tag:
          title: Tag
          example: v1.2.0
          type: string
          description: the git tag the server was built from, if any
        buildDate:
          title: Build Date
          example: Tue Oct 13 22:49:41 UTC 2026
          type: string
          description: when the server was built
        repo:
          title: Repo
          example: sandialabs/sceptre-phenix
          type: string
          description: the repository the server was built from
    Features:
      title: Features
      description: The optional features the server has enabled.
      type: object
      properties:
        features:
          title: Features
          type: array
          description: >-
            the enabled features, in no particular order: each one named with
            the `phenix ui --features` flag (such as `vm-mount`), `file-server`
            when a file server endpoint is configured, `tunneler-download` when
            the server's `downloads/tunneler` directory exists at startup, and
            `webshark` when a WebShark build is installed
          items:
            type: string
            example: webshark
    FileChecksum:
      title: File Checksum
      description: The size, modification time, ETag and SHA-256 digest of an experiment file.
      type: object
      properties:
        path:
          title: Path
          example: captures/router_eth0.pcap
          type: string
          description: the file as the request named it
        size:
          title: Size
          description: the file's size in bytes
          example: 1048576
          type: integer
          format: int64
        modified:
          title: Modified
          description: when the file was last modified
          example: "2026-01-01T10:00:00Z"
          type: string
          format: date-time
        etag:
          title: ETag
          example: "\"1a2b3c-65a1f2e0\""
          type: string
          description: the `ETag` downloads of the file carry
        sha256:
          title: SHA-256
          example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
          type: string
          description: hex SHA-256 of the file; absent while it is being computed
    Tunnelers:
      title: Tunnelers
      description: The tunneler builds this server offers for download.
      type: object
      properties:
        files:
          title: Files
          type: array
          description: file names of the builds installed on this server, sorted
          items:
            type: string
            example: phenix-tunneler-linux-amd64
    HealthResponse:
      title: Health Response
      type: object
      description: >-
        A health response in the format of the IETF draft
        draft-inadarei-api-health-check-06
      properties:
        status:
          title: Status
          type: string
          enum: [pass, warn, fail]
          description: the worst status of every check
          example: pass
        version:
          title: Version
          type: string
          description: the phenix build's tag
          example: v1.2.0
        releaseId:
          title: Release ID
          type: string
          description: the phenix build's commit
          example: 059cd25b
        serviceId:
          title: Service ID
          description: the service the response is for
          type: string
          example: phenix
        description:
          title: Description
          description: what the response reports on
          type: string
          example: phēnix readiness
        notes:
          title: Notes
          type: array
          description: present when the request was not authenticated
          items:
            type: string
            example: "output fields omitted: request not authenticated"
        output:
          title: Output
          example: "minimega did not answer: unable to dial"
          type: string
          description: detail, only for authenticated requests
        checks:
          title: Checks
          type: object
          description: >-
            the checks' results, keyed "component:measurement" (such as
            `minimega:responseTime`); most keys have one result, and
            `disk:utilization` has one per filesystem
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/HealthCheckResult"
      required:
        - status
        - serviceId
        - description
        - checks
    HealthCheckResult:
      title: Health Check Result
      description: One check's result in a health response.
      type: object
      properties:
        componentId:
          title: Component ID
          type: string
          description: >-
            the component observed, such as `minimega`, `bolt` or
            `files-dir`; never a path or host name
          example: minimega
        componentType:
          title: Component Type
          description: the kind of component observed
          type: string
          enum: [component, datastore, system]
          example: component
        observedValue:
          title: Observed Value
          description: >-
            the value observed; each key keeps one JSON type across runs, and
            a run that observed nothing leaves it out. Fractional values
            (milliseconds, percentages) always carry a decimal point, even
            when whole (`42.0`)
          example: 1.27
        observedUnit:
          title: Observed Unit
          description: the unit of `observedValue`, when it has one
          type: string
          example: ms
        status:
          title: Status
          description: the check's status
          type: string
          enum: [pass, warn, fail]
          example: pass
        affectedEndpoints:
          title: Affected Endpoints
          type: array
          description: the API routes that do not work while this check warns or fails
          items:
            type: string
            example: /api/v1/vms
        time:
          title: Time
          example: "2026-01-01T10:00:00Z"
          type: string
          format: date-time
          description: when the value was observed
        output:
          title: Output
          type: string
          description: >-
            why the check warns or fails, or other detail (paths, hosts,
            errors); only for authenticated requests
          example: "minimega did not answer: unable to dial"
      required:
        - status
        - time

    Job:
      title: Job
      type: object
      description: A background job and the outcome of each of its items.
      required:
        - id
        - kind
        - owner
        - title
        - status
        - cancelable
        - progress
        - items
        - created
        - updated
        - revision
      properties:
        id:
          title: ID
          type: string
          description: "`j` and 16 hex digits"
          example: j0f3a9c2e81b4d7a6
        kind:
          title: Kind
          description: what the job does
          type: string
          enum:
            - vms.action
            - files.archive
            - disk.clone
        owner:
          title: Owner
          example: admin@example.com
          type: string
          description: the user who started the job
        experiment:
          title: Experiment
          example: exp1
          type: string
          description: the experiment the job acts on, if any
        title:
          title: Title
          description: a readable description of the job
          type: string
          example: Restart 3 VMs
        params:
          title: Params
          type: object
          description: what the job was asked to do, such as its action
          additionalProperties:
            type: string
        status:
          title: Status
          type: string
          description: >-
            `partial` when some items succeeded and others failed or were
            skipped, `failed` when none succeeded or the job itself failed
          enum:
            - queued
            - running
            - succeeded
            - partial
            - failed
            - canceled
        cancelable:
          title: Cancelable
          description: whether the job can still be canceled
          example: true
          type: boolean
        cancelRequested:
          title: Cancel Requested
          description: whether a cancel was asked for and the job is winding down
          example: false
          type: boolean
        progress:
          title: Progress
          description: how far the job has got
          allOf:
            - $ref: "#/components/schemas/JobProgress"
        items:
          title: Items
          description: each item the job acts on, with its outcome
          type: array
          items:
            $ref: "#/components/schemas/JobItem"
        itemsOmitted:
          title: Items Omitted
          example: 0
          type: integer
          description: >-
            items a websocket message left out (it carries at most 500); GET
            the job for them all
        error:
          title: Error
          example: experiment exp1 is not running
          type: string
          description: why the job failed, when no item tells
        artifact:
          title: Artifact
          description: the file the job produced, once it is ready
          allOf:
            - $ref: "#/components/schemas/JobArtifact"
        created:
          title: Created
          description: when the job was created
          example: "2026-01-01T10:00:00Z"
          type: string
          format: date-time
        updated:
          title: Updated
          description: when the job last changed
          example: "2026-01-01T10:00:05Z"
          type: string
          format: date-time
        started:
          title: Started
          description: when the job started running
          example: "2026-01-01T10:00:01Z"
          type: string
          format: date-time
        finished:
          title: Finished
          description: when the job finished
          example: "2026-01-01T10:00:09Z"
          type: string
          format: date-time
        revision:
          title: Revision
          example: 7
          type: integer
          description: increases with every change; keep the update with the highest
    JobItem:
      title: Job Item
      description: One item a job acts on and its outcome.
      type: object
      required:
        - name
        - status
      properties:
        name:
          title: Name
          example: web
          type: string
          description: the VM, file or disk image the item acts on
        status:
          title: Status
          description: the item's outcome so far
          type: string
          enum:
            - pending
            - running
            - succeeded
            - failed
            - skipped
            - canceled
        error:
          title: Error
          type: string
          description: why the item failed or was skipped
          example: you don't have permission
        retryable:
          title: Retryable
          example: false
          type: boolean
          description: >-
            trying the item again later may succeed, such as a VM another
            action holds
        result:
          title: Result
          type: object
          description: >-
            what the item's action returned, such as the VM it left (as GET
            /experiments/{exp}/vms/{name} returns it); not sent over the
            websocket
    JobProgress:
      title: Job Progress
      description: How far a job has got.
      type: object
      required:
        - done
        - total
      properties:
        done:
          title: Done
          example: 2
          type: integer
          description: items with an outcome
        total:
          title: Total
          example: 3
          type: integer
          description: items, or 1 for a job of none
        bytes:
          title: Bytes
          example: 10485760
          type: integer
          format: int64
          description: bytes handled, for file work
        bytesTotal:
          title: Bytes Total
          description: bytes to handle in all, for file work
          example: 52428800
          type: integer
          format: int64
    JobArtifact:
      title: Job Artifact
      type: object
      description: The file a job produced, at GET /jobs/{id}/artifact.
      required:
        - name
        - size
      properties:
        name:
          title: Name
          description: the file name the artifact downloads as
          type: string
          example: exp1-files.zip
        size:
          title: Size
          description: the file's size in bytes
          example: 52428800
          type: integer
          format: int64
        incomplete:
          title: Incomplete
          example: false
          type: boolean
          description: the file lacks some of what was asked for
    NetflowRecord:
      title: Netflow Record
      type: object
      description: One netflow record of an experiment's bridge.
      properties:
        proto:
          title: Protocol
          type: integer
          description: the IP protocol number
          example: 6
        src:
          title: Source
          type: string
          description: the source address
          example: 10.0.0.1
        sport:
          title: Source Port
          type: integer
          description: the source port
          example: 50123
        dst:
          title: Destination
          type: string
          description: the destination address
          example: 10.0.0.2
        dport:
          title: Destination Port
          type: integer
          description: the destination port
          example: 443
        packets:
          title: Packets
          type: integer
          description: packets in the flow
          example: 12
        bytes:
          title: Bytes
          type: integer
          description: bytes in the flow
          example: 4096
    ExperimentGraph:
      title: Experiment Graph
      type: object
      description: An experiment's VMs and VLANs as a graph.
      properties:
        nodes:
          title: Nodes
          type: array
          description: the VMs, then a `Switch` node for each VLAN
          items:
            $ref: "#/components/schemas/GraphNode"
        edges:
          title: Edges
          type: array
          description: one edge for each VM interface
          items:
            $ref: "#/components/schemas/GraphEdge"
        running:
          title: Running
          type: boolean
          description: whether the experiment is running
          example: true
    GraphNode:
      title: Graph Node
      type: object
      description: >-
        A VM, as minimega reports it for a running experiment, or a VLAN's
        `Switch` node, which sets only `id`, `name`, `type` and `networks`.
      properties:
        id:
          title: ID
          type: integer
          description: the node's ID in the graph, which edges and searches name
          example: 0
        name:
          title: Name
          type: string
          description: the VM's hostname, or the VLAN's alias
          example: web
        description:
          title: Description
          type: string
          description: the VM's description from the topology
          example: Web server
        type:
          title: Type
          type: string
          description: the node's type, such as VirtualMachine, or Switch for a VLAN
          example: VirtualMachine
        experiment:
          title: Experiment
          type: string
          description: the experiment's name
          example: exp1
        host:
          title: Host
          type: string
          description: the cluster host running the VM
          example: compute1
        ipv4:
          title: IPv4
          type: array
          description: the VM's IPv4 address on each interface
          items:
            type: string
          example: [10.0.0.1]
        cpus:
          title: CPUs
          type: integer
          description: the VM's virtual CPUs
          example: 1
        ram:
          title: RAM
          type: integer
          description: the VM's memory, in megabytes
          example: 1024
        disk:
          title: Disk
          type: string
          description: the VM's disk image
          example: ubuntu.qc2
        inject_partition:
          title: Inject Partition
          type: integer
          description: the disk partition injections go to
          example: 1
        osType:
          title: OS Type
          type: string
          description: the VM's OS type
          example: linux
        dnb:
          title: Do Not Boot
          type: boolean
          description: whether the VM is marked do not boot
          example: false
        networks:
          title: Networks
          type: array
          description: the VLAN each interface connects to
          items:
            type: string
          example: [EXP_1]
        taps:
          title: Taps
          type: array
          description: the VM's tap interfaces
          items:
            type: string
          example: [mega_tap0]
        captures:
          title: Captures
          type: array
          description: the VM's running packet captures
          items:
            $ref: "#/components/schemas/Capture"
        state:
          title: State
          type: string
          description: minimega's state of the VM
          example: RUNNING
        running:
          title: Running
          type: boolean
          description: whether the VM is running
          example: true
        busy:
          title: Busy
          type: boolean
          description: whether an action holds the VM
          example: false
        ccActive:
          title: Miniccc Active
          type: boolean
          description: whether the VM's miniccc agent is connected
          example: true
        uptime:
          title: Uptime
          type: number
          description: seconds the VM has run
          example: 3600
        cdRom:
          title: CD-ROM
          type: string
          description: the image in the VM's CD-ROM drive, if any
          example: tools.iso
        tags:
          title: Tags
          type: object
          description: the VM's minimega tags
          additionalProperties:
            type: string
        snapshot:
          title: Snapshot
          type: boolean
          description: whether the VM runs from a snapshot of its disk
          example: true
        labels:
          title: Labels
          type: object
          description: the VM's labels from the topology
          additionalProperties:
            type: string
    GraphEdge:
      title: Graph Edge
      type: object
      description: An edge between two graph nodes.
      properties:
        id:
          title: ID
          type: integer
          description: the edge's ID
          example: 0
        source:
          title: Source
          type: integer
          description: the ID of the node the edge starts at
          example: 0
        target:
          title: Target
          type: integer
          description: the ID of the node the edge ends at
          example: 3
        length:
          title: Length
          type: integer
          description: the edge's drawn length
          example: 150
    SoHNetwork:
      title: SoH Network
      type: object
      description: An experiment's network graph with its state of health.
      properties:
        started:
          title: Started
          type: boolean
          description: whether the experiment's start has finished
          example: true
        soh_initialized:
          title: SoH Initialized
          type: boolean
          description: whether the soh app has finished a run
          example: true
        soh_running:
          title: SoH Running
          type: boolean
          description: whether the soh app is running now
          example: false
        nodes:
          title: Nodes
          type: array
          description: the VMs, then a node for each VLAN
          items:
            $ref: "#/components/schemas/SoHNode"
        edges:
          title: Edges
          type: array
          description: one edge for each VM interface
          items:
            $ref: "#/components/schemas/GraphEdge"
        hosts:
          title: Hosts
          type: array
          description: the hosts the soh app recorded flows between
          items:
            type: string
          example: [web, db]
        host_flows:
          title: Host Flows
          type: array
          description: >-
            a matrix of the flows the soh app recorded: the entry at row i,
            column j counts those from host i to host j
          items:
            type: array
            items:
              type: integer
          example: [[0, 3], [2, 0]]
    SoHNode:
      title: SoH Node
      type: object
      description: A graph node with its state of health.
      properties:
        id:
          title: ID
          type: integer
          description: the node's ID in the graph
          example: 0
        label:
          title: Label
          type: string
          description: the VM's hostname, or the VLAN's alias
          example: web
        image:
          title: Image
          type: string
          description: >-
            what the UI draws the node as: the VM's OS type, `Router` or
            `Firewall` for those node types, or `switch` for a VLAN
          example: linux
        tags:
          title: Tags
          type: object
          description: the node's tags
          additionalProperties:
            type: string
        status:
          title: Status
          type: string
          description: the VM's state, or `ignore` for a VLAN
          enum: [running, notrunning, notboot, notdeploy, external, ignore]
        soh:
          title: SoH
          description: the VM's latest soh results, if any
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/SoHHostState"
    SoHHostState:
      title: SoH Host State
      type: object
      description: One VM's latest soh results, each check's kind in its own list.
      properties:
        hostname:
          title: Hostname
          type: string
          description: the VM's hostname
          example: web
        cpuLoad:
          title: CPU Load
          type: string
          description: the VM's CPU load
          example: "0.12"
        networking:
          title: Networking
          type: array
          description: the network checks
          items:
            $ref: "#/components/schemas/SoHState"
        reachability:
          title: Reachability
          type: array
          description: the reachability checks
          items:
            $ref: "#/components/schemas/SoHState"
        files:
          title: Files
          type: array
          description: the checks that files exist
          items:
            $ref: "#/components/schemas/SoHState"
        filesAbsent:
          title: Files Absent
          type: array
          description: the checks that files do not exist
          items:
            $ref: "#/components/schemas/SoHState"
        services:
          title: Services
          type: array
          description: the service checks
          items:
            $ref: "#/components/schemas/SoHState"
        processes:
          title: Processes
          type: array
          description: the process checks
          items:
            $ref: "#/components/schemas/SoHState"
        listeners:
          title: Listeners
          type: array
          description: the listener checks
          items:
            $ref: "#/components/schemas/SoHState"
        containers:
          title: Containers
          type: array
          description: the container checks
          items:
            $ref: "#/components/schemas/SoHState"
    SoHState:
      title: SoH State
      type: object
      description: One soh check's result.
      properties:
        metadata:
          title: Metadata
          type: object
          description: what the check looked at, such as its target
          additionalProperties: true
        timestamp:
          title: Timestamp
          type: string
          description: when the check ran, RFC 3339
          example: "2026-01-01T10:00:00Z"
        success:
          title: Success
          type: string
          description: what passed, when the check passed
          example: 10.0.0.2 reachable
        error:
          title: Error
          type: string
          description: why the check failed, when it failed
          example: no route to host
    CaptureSubnetRequest:
      title: Capture Subnet Request
      type: object
      description: The VMs whose interfaces on a subnet to capture or stop capturing.
      properties:
        subnet:
          title: Subnet
          type: string
          description: the subnet, as a CIDR prefix
          example: 10.0.0.0/24
        vms:
          title: VMs
          type: array
          description: the VMs to act on; empty acts on every VM of the experiment
          items:
            type: string
          example: [web]
    VMUpdate:
      title: VM Update
      type: object
      description: The changes to one VM of a stopped experiment; fields left out keep their value.
      required:
        - name
      properties:
        name:
          title: Name
          type: string
          description: the VM's name
          example: web
        cpus:
          title: CPUs
          type: integer
          description: virtual CPUs; 0 keeps them
          example: 2
        ram:
          title: RAM
          type: integer
          description: memory in megabytes; 0 keeps it
          example: 2048
        disk:
          title: Disk
          type: string
          description: the disk image; empty keeps it
          example: ubuntu.qc2
        dnb:
          title: Do Not Boot
          type: boolean
          description: whether the VM is marked do not boot
          example: true
        interface:
          title: Interface
          type: object
          description: an interface to connect to another VLAN
          properties:
            index:
              title: Index
              type: integer
              description: the interface's index
              example: 0
            vlan:
              title: VLAN
              type: string
              description: the VLAN alias to connect it to
              example: EXP_2
        host:
          title: Host
          type: string
          description: the cluster host to schedule the VM on
          example: compute1
        snapshot:
          title: Snapshot
          type: boolean
          description: whether the VM runs from a snapshot of its disk
          example: true
    ImageFilename:
      title: Image Filename
      type: object
      description: The name of the file to write.
      required:
        - filename
      properties:
        filename:
          title: Filename
          type: string
          description: the file's name, in the minimega files directory unless absolute
          example: web-committed.qc2
    PortForward:
      title: Port Forward
      type: object
      description: A user's port forward to a VM.
      properties:
        exp:
          title: Experiment
          type: string
          description: the experiment's name
          example: exp1
        vm:
          title: VM
          type: string
          description: the VM's name
          example: web
        srcPort:
          title: Src Port
          type: integer
          description: the local port the forward is to be served on
          example: 2222
        dstHost:
          title: Dst Host
          type: string
          description: the destination host, as the VM's cluster host reaches it
          example: 127.0.0.1
        dstPort:
          title: Dst Port
          type: integer
          description: the destination port
          example: 22
        owner:
          title: Owner
          type: string
          description: the user who created the forward
          example: alice@example.com
    File:
      title: File
      type: object
      description: A file or folder.
      properties:
        name:
          title: Name
          type: string
          description: the file's name
          example: hostname
        path:
          title: Path
          type: string
          description: the file's path, relative to the folder listed from
          example: /etc/hostname
        date:
          title: Date
          type: string
          description: when the file was last modified, RFC 3339
          example: "2026-01-01T10:00:00Z"
        size:
          title: Size
          type: integer
          description: the file's size in bytes
          example: 8
        categories:
          title: Categories
          type: array
          description: what the file is, when known
          items:
            type: string
          example: []
        plainText:
          title: Plain Text
          type: boolean
          description: whether the file is plain text
          example: true
        isDir:
          title: Is Dir
          type: boolean
          description: whether the entry is a folder
          example: false
    ScorchTerminal:
      title: Scorch Terminal
      type: object
      description: A terminal a SCORCH break component opened, and a client of it.
      properties:
        exp:
          title: Experiment
          type: string
          description: the experiment's name
          example: exp1
        run:
          title: Run
          type: integer
          description: the run's index
          example: 0
        loop:
          title: Loop
          type: integer
          description: the loop's nesting depth
          example: 0
        stage:
          title: Stage
          type: string
          description: the stage the component runs in
          example: start
        name:
          title: Name
          type: string
          description: the break component's name
          example: pause
        loc:
          title: Location
          type: string
          description: >-
            the websocket the client attaches with, under the UI's base path;
            empty in a listing
          example: /api/v1/experiments/exp1/scorch/terminals/4242/ws/0f7b2a1e-5c1d-4f6e-9d2a-3b4c5d6e7f80
        exit:
          title: Exit
          type: string
          description: >-
            the route that ends the terminal, for its writing client only;
            empty for a read-only client and in a listing
          example: /api/v1/experiments/exp1/scorch/terminals/4242/exit/0f7b2a1e-5c1d-4f6e-9d2a-3b4c5d6e7f80
        readOnly:
          title: Read-Only
          type: boolean
          description: whether the client only watches the terminal
          example: false
    Role:
      title: Role
      type: object
      description: A role and the policies it grants.
      properties:
        name:
          title: Name
          type: string
          description: the role's name
          example: Experiment User
        policies:
          title: Policies
          type: array
          description: the role's policies
          items:
            type: object
            properties:
              resources:
                title: Resources
                type: array
                description: the resource types the policy covers
                items:
                  type: string
                example: [experiments, vms/*]
              resourceNames:
                title: Resource Names
                type: array
                description: the names of the resources the policy covers
                items:
                  type: string
                example: [exp1, exp1/*]
              verbs:
                title: Verbs
                type: array
                description: the actions the policy allows
                items:
                  type: string
                example: [get, list]
    Settings:
      title: Settings
      type: object
      description: The settings of the web UI's Settings page.
      properties:
        password_settings:
          title: Password Settings
          description: the password rules
          allOf:
            - $ref: "#/components/schemas/PasswordSettings"
        logging_settings:
          title: Logging Settings
          description: the system log file's rotation
          allOf:
            - $ref: "#/components/schemas/LoggingSettings"
        timeout_settings:
          title: Timeout Settings
          description: the session timeout
          allOf:
            - $ref: "#/components/schemas/TimeoutSettings"
    PasswordSettings:
      title: Password Settings
      type: object
      description: What a new password must have.
      properties:
        lowercase_req:
          title: Lowercase Req
          type: boolean
          description: whether a password needs a lowercase letter
          example: true
        uppercase_req:
          title: Uppercase Req
          type: boolean
          description: whether a password needs an uppercase letter
          example: true
        number_req:
          title: Number Req
          type: boolean
          description: whether a password needs a number
          example: true
        symbol_req:
          title: Symbol Req
          type: boolean
          description: whether a password needs a symbol
          example: false
        min_length:
          title: Min Length
          type: integer
          description: the shortest password allowed, from 8 to 32
          example: 8
    LoggingSettings:
      title: Logging Settings
      type: object
      description: When the system log file is rotated, and how many old files are kept.
      properties:
        max_file_rotations:
          title: Max File Rotations
          type: integer
          description: old log files to keep
          example: 3
        max_file_size:
          title: Max File Size
          type: integer
          description: size in megabytes at which the log file is rotated
          example: 100
        max_file_age:
          title: Max File Age
          type: integer
          description: days to keep an old log file
          example: 90
    TimeoutSettings:
      title: Timeout Settings
      type: object
      description: When the web UI signs an idle user out.
      properties:
        enabled:
          title: Enabled
          type: boolean
          description: whether idle users are signed out
          example: true
        timeout_min:
          title: Timeout Min
          type: number
          description: minutes of idleness before the user is signed out
          example: 30
        warning_min:
          title: Warning Min
          type: number
          description: minutes before signing out that the user is warned
          example: 3
    LogEntry:
      title: Log Entry
      type: object
      description: One entry of the server's log.
      properties:
        time:
          title: Time
          type: integer
          format: int64
          description: when the entry was logged, in microseconds since the Unix epoch
          example: 1767261600000000
        timestamp:
          title: Timestamp
          type: string
          description: when the entry was logged, readable
          example: "2026-01-01 10:00:00.000"
        level:
          title: Level
          type: string
          description: the entry's level
          example: INFO
        msg:
          title: Message
          type: string
          description: the entry's message, with its other fields appended
          example: "experiment started exp=exp1"
        type:
          title: Type
          type: string
          description: what the entry is about
          enum: [SYSTEM, ACTION, SECURITY, AUDIT, HTTP, MINIMEGA, SOH, SCORCH, PHENIX-APP]
    WebSocketMessage:
      title: Web Socket Message
      type: object
      description: A change the server publishes on the `/ws` websocket, or its answer to a request.
      properties:
        resource:
          title: Resource
          description: what changed
          allOf:
            - $ref: "#/components/schemas/WebSocketResource"
        result:
          title: Result
          description: >-
            the message's data, such as the experiment or VM as the API
            returns it, or null when the action says it all
          example:
            name: web
            running: true
        seq:
          title: Seq
          type: integer
          format: int64
          description: the message's sequence number, comparable with `X-Phenix-Seq`
          example: 1042
    WebSocketRequest:
      title: Web Socket Request
      type: object
      description: A request a client sends on the `/ws` websocket.
      properties:
        resource:
          title: Resource
          description: what the request is about
          allOf:
            - $ref: "#/components/schemas/WebSocketResource"
        request:
          title: Request
          type: object
          description: the request's parameters, which depend on its resource type
          additionalProperties: true
          example:
            term: hostname
            value: web
    WebSocketResource:
      title: Web Socket Resource
      type: object
      description: The resource a `/ws` message or request is about.
      properties:
        type:
          title: Type
          type: string
          description: the kind of resource, such as `experiment`, `experiment/vm` or `log`
          example: experiment/vm
        name:
          title: Name
          type: string
          description: the resource's name, such as `<exp>/<vm>` for a VM
          example: exp1/web
        action:
          title: Action
          type: string
          description: what happened to it, or what the request asks
          example: start

  # Shared by the single-file download routes, which resume interrupted
  # downloads with Range and If-Range.
  parameters:
    ExpName:
      name: exp_name
      in: path
      description: name of phenix experiment
      required: true
      schema:
        type: string
    VMName:
      name: vm_name
      in: path
      description: name of the experiment's VM
      required: true
      schema:
        type: string
    ScorchExp:
      name: name
      in: path
      description: name of phenix experiment
      required: true
      schema:
        type: string
    ScorchRun:
      name: run
      in: path
      description: index of the run in the experiment's scorch app metadata
      required: true
      schema:
        type: integer
    ScorchLoop:
      name: loop
      in: path
      description: nesting depth of the loop, 0 for the run's top-level loop
      required: true
      schema:
        type: integer
    ScorchStage:
      name: stage
      in: path
      description: the stage, such as configure, start, stop or cleanup
      required: true
      schema:
        type: string
    ScorchComponent:
      name: cmp
      in: path
      description: the component's name
      required: true
      schema:
        type: string
    ScorchTerminalPID:
      name: pid
      in: path
      description: the PID of the process the terminal runs
      required: true
      schema:
        type: integer
    JobID:
      name: id
      in: path
      description: the job's ID
      required: true
      schema:
        type: string
    RangeHeader:
      name: Range
      in: header
      description: >-
        the bytes to send, such as `bytes=1048576-` to resume a download after
        its first MiB
      required: false
      schema:
        type: string
    IfRangeHeader:
      name: If-Range
      in: header
      description: >-
        the `ETag` of an earlier response: `Range` is honored only while the
        file still has it, and a changed file is sent whole (200)
      required: false
      schema:
        type: string
    IfNoneMatchHeader:
      name: If-None-Match
      in: header
      description: the `ETag` of an earlier response; 304 while the file still has it
      required: false
      schema:
        type: string
    # Config revisions: conditional reads and writes of one config.
    ConfigIfMatch:
      name: If-Match
      in: header
      description: >-
        optional; the config's `ETag` from an earlier read (`"r<revision>"`),
        or `*`. The write runs only while the config is still at that
        revision, and answers 412 otherwise, so a concurrent change is not
        silently overwritten. Weak tags never match; a malformed value is a
        400.
      required: false
      schema:
        type: string
    ConfigIfNoneMatch:
      name: If-None-Match
      in: header
      description: the config's `ETag` from an earlier read; 304 while the config is still at that revision
      required: false
      schema:
        type: string
  headers:
    # Ordering and freshness, on every API response (see the description).
    Seq:
      description: >-
        this process's sequence number, taken as the request started; orders
        the response against websocket messages and other responses
      schema:
        type: integer
        format: int64
    ObservedAt:
      description: when the oldest runtime data in the response was read from minimega (RFC 3339)
      schema:
        type: string
        format: date-time
    Stale:
      description: "`true` when the response serves runtime data past its normal bound"
      schema:
        type: string
        enum:
          - "true"
    # Config revisions: conditional reads and writes of one config.
    ConfigETag:
      description: >-
        strong validator `"r<revision>"` naming the config's revision (not
        its bytes, so it holds for a gzip-compressed body too); absent for a
        config not written since revisions were added
      schema:
        type: string
    ConfigRevision:
      description: the config's `metadata.revision`, as a plain number; absent when the ETag is
      schema:
        type: integer
        format: int64
    ETag:
      description: >-
        strong validator built from the file's inode, size and modification
        time (not its contents), so it changes whenever the file does
      schema:
        type: string
    LastModified:
      description: the file's modification time
      schema:
        type: string
    AcceptRanges:
      description: "`bytes`: the file can be fetched, and resumed, in ranges"
      schema:
        type: string
    ContentRange:
      description: the range sent and the file's size, such as `bytes 1048576-2097151/4194304`
      schema:
        type: string
    ReprDigest:
      description: >-
        the whole file's SHA-256 (RFC 9530), such as `sha-256=:<base64>:`,
        sent only once the file's checksum route has computed it; it holds
        for a range too, so a resumed download can be verified, and is
        dropped from a gzip-compressed response
      schema:
        type: string
  responses:
    # Config revisions: conditional reads and writes of one config.
    ConfigNotModified:
      description: the config is still at the `If-None-Match` revision
      headers:
        ETag:
          $ref: "#/components/headers/ConfigETag"
    ConfigPreconditionFailed:
      description: >-
        the config is no longer at the `If-Match` revision, or does not exist;
        `metadata.revision` holds its current revision
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PartialContent:
      description: the requested range of the file
      headers:
        Content-Range:
          $ref: "#/components/headers/ContentRange"
        ETag:
          $ref: "#/components/headers/ETag"
        Repr-Digest:
          $ref: "#/components/headers/ReprDigest"
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    NotModified:
      description: the file still has the `If-None-Match` ETag
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
    PreconditionFailed:
      description: the file no longer has the `If-Match` ETag
    RangeNotSatisfiable:
      description: the range starts past the end of the file
      headers:
        Content-Range:
          description: "`bytes */<size>`"
          schema:
            type: string
