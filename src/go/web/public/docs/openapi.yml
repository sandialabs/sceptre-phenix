  "/workflow/configs/{branch}":
    post:
      tags:
        - Workflow
      summary: Create or update a phenix config for a workflow branch
      description: >
        Creates the config if it does not exist and updates it otherwise. The
        server sets BRANCH_NAME to the branch before parsing the body, so
        ${BRANCH_NAME} placeholders expand to the branch name. The server
        stores every other ${NAME} placeholder as written. The Content-Type
        header must be exactly application/json or application/x-yaml. A
        Topology is also checked for a node an experiment could not use, such
        as a hostname used twice or a reserved hostname, before it is stored.
        With dryRun=true it runs the same checks, returns what it would do, and
        stores nothing. Needs `configs` `create` or `update` before the body is
        parsed, then `configs` `create` on a new config or `update` on a
        stored one, by the kind and name the body gives (such as
        `Topology/lab`), dry run or not.
      operationId: postWorkflowConfigsBranch
      parameters:
        - name: branch
          in: path
          description: workflow branch name
          required: true
          schema:
            type: string
        - name: dryRun
          in: query
          description: >
            Checks the config as a real request would (placeholder expansion,
            the create or update decision, permissions, schema validation and,
            for a Topology, the node checks an experiment would fail on) and
            returns the result without storing the config or running config
            hooks. For an Experiment config only the schema is checked; the
            experiment checks run when the config is stored. The parameter's
            name is matched exactly, so a request that spells it differently is
            carried out for real.
          required: false
          schema:
            type: boolean
            default: false
      requestBody:
        description: phenix config of a storable kind (e.g. Topology or Scenario)
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Config"
          application/x-yaml:
            schema:
              $ref: "#/components/schemas/Config"
      responses:
        "200":
          description: dry run; nothing was stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowConfigResult"
        "201":
          description: config created or updated (no response body)
          headers:
            Location:
              schema:
                description: location of the created or updated config
                type: string
                format: uri
        "400":
          description: >
            unsupported Content-Type, unparsable body, a missing or unknown kind
            or a name containing "/", an invalid dryRun value, a schema
            validation failure (explained lines in metadata.validation, original
            validator text in metadata.validation-raw), or, for a Topology, a
            node an experiment could not use, such as a hostname used twice or
            a reserved hostname, or a spec that does not decode; or, on a real
            upsert, a config hook or the store rejects the config, or another
            request created or deleted it in the meantime
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: creating or updating the config is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/workflow/apply/{branch}":
    post:
      tags:
        - Workflow
      summary: Apply a phenix workflow config to a workflow branch
      description: >
        Validates the workflow config against the Workflow schema, finds the
        experiment mapped to the branch (phenix.workflow/branch annotation),
        plans an action, and checks the default bridge and the topology and
        scenario the action would use, including a stored topology's nodes, as
        creating an experiment would. Only then does it create, update, start,
        or restart the experiment. A failed check leaves a running experiment
        running. With dryRun=true the plan is returned after the same checks,
        and nothing is changed; a dry run before a first deploy names the
        configs the caller will store with pending. The server sets BRANCH_NAME
        to the branch before parsing the body, so ${BRANCH_NAME} placeholders
        expand to the branch name. The server keeps every other ${NAME}
        placeholder as written. The Content-Type header must be
        exactly application/json or application/x-yaml.
      operationId: postWorkflowApplyBranch
      parameters:
        - name: branch
          in: path
          description: workflow branch name
          required: true
          schema:
            type: string
        - name: tag
          in: query
          description: >
            key=value tag stored on the experiment, joined with commas into the
            phenix.workflow/tags annotation; repeat the parameter for more tags
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: dryRun
          in: query
          description: >
            Runs every check, a stored topology's node checks included, and
            returns the plan without creating, updating, starting, or stopping
            anything. The parameter's name is matched exactly, so a request
            that spells it differently is treated as a real apply, and refused
            with 400 when it also carries pending.
          required: false
          schema:
            type: boolean
            default: false
        - name: pending
          in: query
          description: >
            A config the caller will create or update before the real apply,
            usually the pending value a dry run of POST /workflow/configs/{branch}
            returned: <Kind>/<name>, such as Topology/helloworld, optionally
            followed by "?" and the config's references, such as
            Scenario/helloworld?from=helloworld-base&topology=helloworld
            (url-encode the value). The kind may be in any case. Repeat the
            parameter for more configs. A pending topology or scenario is not
            looked up, decoded or merged, so a first deploy can be checked
            before its configs are stored; the references listed after "?" are
            checked instead, with the errors the real apply gives (on a create,
            a scenario's topology annotation; each fromScenario, which must be
            pending or stored and annotated for the topology; each included
            topology, which must be pending, stored or a file on the server).
            An include that is neither pending nor stored is looked up as a
            file on the server, as the real apply does, so the answer shows
            whether that path exists on the server; grant workflow:create only
            to roles trusted with that (the default policies give it to Global
            Admin only). Only allowed with dryRun=true; otherwise, or for a
            value that is not a config name, the request is a 400.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: expect
          in: query
          description: >
            The action the caller expects, usually the action a previous dry
            run returned. If the server plans a different action, it returns
            409 and changes nothing. It is checked on dry runs as well as real
            applies. A value that is not an action is a 400 with the message
            invalid expect value "<value>" and the cause
            unknown workflow action "<value>".
          required: false
          schema:
            type: string
            enum:
              - none
              - create
              - createAndStart
              - update
              - updateAndStart
              - restart
      requestBody:
        description: phenix workflow config
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Workflow"
          application/x-yaml:
            schema:
              $ref: "#/components/schemas/Workflow"
      responses:
        "200":
          description: plan carried out, or only returned when dryRun is true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowResult"
        "400":
          description: >
            unsupported Content-Type, unparsable body, invalid dryRun, expect or
            pending value, pending without dryRun=true, Workflow schema failure
            (explained lines in metadata.validation, original validator text in
            metadata.validation-raw), invalid config (e.g. defaultBridge longer
            than 15 characters, a default bridge another experiment uses, or an
            auto.create that is not a valid experiment name), a topology or
            scenario that is missing, cannot be read for any reason, fails to
            decode, or fails to merge, a stored topology whose nodes an
            experiment could not use, or a pending reference that fails its
            check, all of which leave everything unchanged; or a failure to
            stop, reconfigure or start the experiment while the plan is carried
            out, which comes after changes were made
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: applying workflows is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            more than one experiment is mapped to the branch, auto.create names
            an existing experiment that is not mapped to the branch, or the
            planned action differs from expect, with nothing changed; or another
            request is starting or stopping the experiment while the plan is
            carried out, which comes after changes were made when it happens as
            the experiment is started after a create, update or stop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: internal error, or a failure while carrying out the plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/options":
    get:
      tags:
        - Workflow
      summary: Get server-side options
      description: >
        Server-side settings that clients read: every phenix CLI command
        fetches them over the unix socket when it starts, to inherit the
        server's bridge-mode, deploy-mode and use-gre-mesh, and the web UI's
        Experiments page reads them too. workflow-dry-run is true when
        POST /workflow/configs/{branch} and POST /workflow/apply/{branch} both
        support dryRun, and apply supports pending and expect. An older server
        ignores dryRun on /workflow/configs/{branch} and stores the config, so
        phenix workflow apply refuses servers without it.
      operationId: getOptions
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Options"
        "403":
          description: listing options is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/schemas/builder/v1":
    get:
      tags:
        - Builder
        - Schemas
      summary: Get the JSON Schema of Builder documents
      description: >
        Requires `builder` `use`.
      operationId: getBuilderSchema
      responses:
        "200":
          description: >
            The complete JSON Schema (draft 2020-12) of a Builder document
            (the `BuilderDocument` component shows its outline). Each property
            has a title, a description and examples.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
  "/schemas/builder/templates/v1":
    get:
      tags:
        - Builder
        - Schemas
      summary: Get the JSON Schema of Builder template files
      description: >
        Requires `builder` `use`, as the document schema does. A template file
        holds one collection of device templates, in YAML or JSON. The Node
        Templates tab exports and imports this file. At start, phenix reads
        the template files in its template directory
        (`--base-dir.builder-templates`) as read-only server collections.
      operationId: getBuilderTemplateFileSchema
      responses:
        "200":
          description: >
            The complete JSON Schema (draft 2020-12) of a template file
            (`$id` `https://phenix.sandia.gov/schemas/builder/templates/v1`).
            Each property has a title, a description and examples. phenix also
            checks two rules outside the schema: template names are different,
            ignoring case, and icons are PNG images that phenix accepts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403":
          $ref: "#/components/responses/BuilderForbidden"
  "/schemas/builder/layersets/v1":
    get:
      tags:
        - Builder
        - Schemas
      summary: Get the JSON Schema of Builder layer set files
      description: >
        Requires `builder` `use`, as the document schema does. A layer set
        file holds one layer set, in YAML or JSON, with copies of the custom
        icons that it names. The Layers tab of the Drafts page downloads and
        uploads this file.
      operationId: getBuilderLayerSetFileSchema
      responses:
        "200":
          description: >
            The complete JSON Schema (draft 2020-12) of a layer set file
            (`$id` `https://phenix.sandia.gov/schemas/builder/layersets/v1`).
            Each property has a title, a description and examples. phenix also
            checks rules outside the schema. Layer IDs are different. Node
            matcher patterns are regular expressions without nested repeats,
            with at most 3 `*`, `+` or `{n,}` repeats. Icons are PNG images
            that phenix accepts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403":
          $ref: "#/components/responses/BuilderForbidden"
  "/schemas/builder/package/v1":
    get:
      tags:
        - Builder
        - Schemas
      summary: Get the JSON Schema of Builder packages
      description: >
        Requires `builder` `use`, as the document schema does. A Builder
        package is one JSON or YAML file (`POST /builder/package` makes one).
        It holds a Builder document, and the list of what the diagram needs on
        a phenix server. It also holds the Scenario and Topology configs and
        custom icons that the document names, when the request that made the
        package selected them.
      operationId: getBuilderPackageSchema
      responses:
        "200":
          description: >
            The complete JSON Schema (draft 2020-12) of a package (`$id`
            `https://phenix.sandia.gov/schemas/builder/package/v1`). It holds
            the definitions of the document schema. Each property has a title,
            a description and examples. phenix also checks, outside the
            schema, that the requirements name each carried config. It also
            checks what the document schema cannot express.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403":
          $ref: "#/components/responses/BuilderForbidden"
  "/builder/drafts":
    get:
      tags:
        - Builder
      summary: List Builder drafts
      description: >
        Requires `builder` `use`. Returns every draft, the most recently
        changed first, each with the user who created it. Also lists
        separately, as damaged, the drafts whose metadata this server can no
        longer read (for example, drafts that a newer phenix wrote). A caller
        can delete a damaged draft, but cannot open it. No row has
        `experiment`.
        `limits` says how many drafts the server holds at most.
      operationId: getBuilderDrafts
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderDrafts"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
    post:
      tags:
        - Builder
      summary: Create a Builder draft
      description: >
        Requires `builder` `use`. The caller is the creator of the draft. The
        draft holds the document as its first snapshot. The operation
        publishes nothing.

        With `forkOf`, the ID of a draft, that draft must exist. With a
        `sourceToken` that names a published document, the caller must hold
        `configs` `get` for the config that the document was published to.
        With a `sourceToken` that names the Builder file of a topology, the
        server reads the file as GET /builder/topologies/{topology}/document
        reads it, with the same permission. The answers are the same when the
        server cannot use the file. The server refuses the draft with 409 when
        the file no longer holds the document that the token names. It also
        refuses with 409 when the server no longer reads the topology from its
        file.

        The server stamps the `metadata` of the document before it stores it.
        `createdBy` and `createdAt` stay as they are when the document has
        them. Otherwise they are the caller and the current time. `updatedBy`
        and `updatedAt` are always the caller and the current time. The server
        replaces the values sent in these two fields. The server stores one
        document as it is: the document that a `sourceToken` of the
        `builder-doc/` or `builder-file/` form names, returned unchanged.
        Thus the draft holds exactly what the caller opened, with the same
        digest. A
        value that is not valid in one of the four fields refuses the request
        (422). The response has no document. Its `stamp` holds the four values
        of the stored document.

        A draft opened from a published document, or a draft that forks a
        draft, has `experiment` when that publication made an experiment. The
        experiment must still exist, and the caller must hold `experiments`
        `get` for it.

        The server writes the draft and its document in one transaction, so
        a refused request stores nothing.
      operationId: postBuilderDrafts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderDraftCreate"
      responses:
        "201":
          description: draft created
          headers:
            ETag:
              $ref: "#/components/headers/BuilderETag"
            Location:
              schema:
                description: location of the new draft
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderDraft"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "409":
          description: >
            The `sourceToken` names the Builder file of a topology, and the
            document of the file changed after the caller opened it. Or the
            server no longer reads the topology from its file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "413":
          description: >
            The request body or the document is larger than the size limits
            of the server. Or the server holds `limits.drafts` drafts (2000),
            the most it holds, damaged drafts included (`draft.limit`). The
            message then says to delete drafts or to run Clean up in the
            Builder settings (POST /builder/cleanup).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
  "/builder/drafts/{draft}":
    parameters:
      - $ref: "#/components/parameters/BuilderDraftID"
    get:
      tags:
        - Builder
      summary: Get a Builder draft with its current document
      description: >
        Requires `builder` `use`. `experiment` names an experiment that the
        draft published. For a draft opened from a published diagram, it can
        also name an experiment that the diagram published. It is present
        while that experiment exists and
        the caller holds `experiments` `get` for it.
      operationId: getBuilderDraft
      responses:
        "200":
          description: successful operation
          headers:
            ETag:
              $ref: "#/components/headers/BuilderETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderDraft"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
    delete:
      tags:
        - Builder
      summary: Delete a Builder draft
      description: >
        Requires `builder` `use`. Any caller may delete any draft, also a draft
        whose metadata this server can no longer read. The delete does not
        change published configs. A delete of a draft during its publication
        waits until the publication ends. Then it answers 412 with the draft's
        new ETag.
      operationId: deleteBuilderDraft
      parameters:
        - $ref: "#/components/parameters/BuilderIfMatch"
      responses:
        "204":
          description: draft deleted
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "409":
          $ref: "#/components/responses/BuilderConflict"
        "412":
          description: >
            The If-Match header does not name the current revision of the
            draft (`draft.stale`). The response carries its current ETag. The
            listing does the same for a draft whose metadata this server can
            no longer read, because the server cannot read such a draft alone.
          headers:
            ETag:
              $ref: "#/components/headers/BuilderETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
  "/builder/drafts/{draft}/snapshots":
    parameters:
      - $ref: "#/components/parameters/BuilderDraftID"
    get:
      tags:
        - Builder
      summary: List the snapshots of a Builder draft
      description: >
        Requires `builder` `use`. The list starts with the oldest
        snapshot. `cursor` is the index of the current snapshot.
      operationId: getBuilderDraftSnapshots
      responses:
        "200":
          description: successful operation
          headers:
            ETag:
              $ref: "#/components/headers/BuilderETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderSnapshots"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
    post:
      tags:
        - Builder
      summary: Save a Builder draft
      description: >
        Requires `builder` `use`. Appends the
        document as a new snapshot, discards all snapshots after the cursor
        (the redo branch), and moves the cursor to the new snapshot. A draft
        keeps at most 50 snapshots, of at most 50 MiB in total. The server
        removes the oldest snapshots to make room for the new snapshot.

        The server stamps the `metadata` of the document before it stores it.
        `createdBy` and `createdAt` are the values from the draft create.
        `updatedBy` and `updatedAt` are the caller and the current time. The
        server replaces the values sent in the four fields. A value that is
        not valid refuses the request (422). The response has no document. Its
        `stamp` holds the four values written.
      operationId: postBuilderDraftSnapshots
      parameters:
        - $ref: "#/components/parameters/BuilderIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderSnapshotCreate"
      responses:
        "201":
          description: Snapshot appended. The response is the draft without its document.
          headers:
            ETag:
              $ref: "#/components/headers/BuilderETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderDraft"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "409":
          $ref: "#/components/responses/BuilderConflict"
        "412":
          $ref: "#/components/responses/BuilderPreconditionFailed"
        "413":
          $ref: "#/components/responses/BuilderTooLarge"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
  "/builder/drafts/{draft}/snapshots/{snapshot}":
    parameters:
      - $ref: "#/components/parameters/BuilderDraftID"
      - name: snapshot
        in: path
        description: snapshot ID, or `current` for the snapshot that the cursor identifies
        required: true
        schema:
          type: string
    get:
      tags:
        - Builder
      summary: Get one snapshot of a Builder draft with its document
      description: >
        Requires `builder` `use`.
      operationId: getBuilderDraftSnapshot
      responses:
        "200":
          description: successful operation
          headers:
            ETag:
              $ref: "#/components/headers/BuilderETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderSnapshotDocument"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
    delete:
      tags:
        - Builder
      summary: Delete one snapshot of a Builder draft
      description: >
        Requires `builder` `use`. Removes the
        snapshot from the history and deletes its content. A caller cannot
        delete the snapshot that the cursor identifies (the current version).
        The cursor stays on it. When the last publication names the deleted
        snapshot, the publication record stays, and the draft is then
        `dirty`.
      operationId: deleteBuilderDraftSnapshot
      parameters:
        - $ref: "#/components/parameters/BuilderIfMatch"
      responses:
        "200":
          description: Snapshot deleted. The response is the draft without its document.
          headers:
            ETag:
              $ref: "#/components/headers/BuilderETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderDraft"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "409":
          description: >
            The snapshot is the current version (`draft.snapshot.current`), or
            the draft changed during the request (`draft.conflict`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "412":
          $ref: "#/components/responses/BuilderPreconditionFailed"
  "/builder/drafts/{draft}/cursor":
    parameters:
      - $ref: "#/components/parameters/BuilderDraftID"
    patch:
      tags:
        - Builder
      summary: Move the cursor of a Builder draft (undo and redo)
      description: >
        Requires `builder` `use`. The move discards no snapshot.
      operationId: patchBuilderDraftCursor
      parameters:
        - $ref: "#/components/parameters/BuilderIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderCursorMove"
      responses:
        "200":
          description: Cursor moved. The response is the draft without its document.
          headers:
            ETag:
              $ref: "#/components/headers/BuilderETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderDraft"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "409":
          $ref: "#/components/responses/BuilderConflict"
        "412":
          $ref: "#/components/responses/BuilderPreconditionFailed"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
  "/builder/drafts/{draft}/publish":
    parameters:
      - $ref: "#/components/parameters/BuilderDraftID"
    post:
      tags:
        - Builder
      summary: Publish a Builder draft to phenix configs
      description: >
        The only Builder operation that creates or updates configs.
        (DELETE /builder/documents/{document} deletes a published topology.)
        It publishes the current snapshot of the draft. The request carries
        only the intent.

        Requires `builder` `use`. The caller must also have its own
        `configs` `create` or `update` on each target
        config, as the action of the target requires. An experiment target
        also requires `experiments` `create` or `update`. A draft imported
        from a stored Topology or Experiment also needs `configs` `get` on it,
        and `topologies` `get` (or `experiments` `get`) on its name. The
        server uses them to check that the source did not change since the
        import.

        In both modes, a draft whose document lists `scenarios` has a
        `scenario` stage before the experiment stage. Each listed Scenario
        config must exist and be readable (`configs` `get` and `scenarios`
        `list`). Otherwise the answer is 422 and names the scenario. The stage
        adds the topology to the `topology` annotation of each scenario that
        does not name it yet. This needs `configs` `update` on that scenario
        (otherwise 403). The stage does not write a scenario that already
        names the topology. The stage message tells which scenarios it
        changed. A publish never creates or replaces the spec of a scenario.

        A repeat of a publication that completed, with the same If-Match,
        gets 200 with every stage skipped.

        A draft updates an existing topology or experiment only in two cases.
        In the first case, the draft was imported from it. In the second case,
        the draft published it (or was opened from the published diagram that
        did), and nothing else changed it since then. The server refuses all
        other updates with 409.

        Only the draft imported from a topology updates a topology that has a
        legacy Builder diagram (`builder-xml`). A draft imported from an
        experiment built from that topology does not. Also, the diagram must
        be the one that the import read. The server refuses with 409 a
        diagram that someone changed, added or removed since, as for a changed
        spec. The update removes `builder-xml`, writes `builder-doc`, and adds
        a warning to the result. The warning says that the update replaced
        the diagram or, if the import could not read it, removed it.

        The server reads some topologies from the Builder file that their
        `builder-doc` annotation names. Only a draft opened from that file
        updates such a topology. The file must still hold what the draft was
        opened from, and the topology must still be what the file publishes.
        Such a draft updates the topology in no other way. It does not update
        it as a draft imported from the topology, even when the document of
        the file was imported from the topology. A publish never writes the
        file. The topology keeps its `path`, and the result has a warning that
        the file is now behind.

        A published experiment records in its `builder-experiment` annotation
        which draft and published document published it. After the configure
        stage of its apps ran, it also records its digest there. An experiment
        update runs that stage, as an update through `/configs` does. When a
        stage fails after the server wrote earlier stages, the response is 409
        or 500, with a result whose status is `partial`. Unless the draft
        changed meanwhile, the warnings of that result then have
        `publish.retry.available`. The same request, with the same If-Match,
        then finishes the publication. The stages that are already done answer
        `skipped`. When the server stored the published document but could
        not remove the content that it replaces, the publication continues.
        The answer then has a `Warning` header and a warning in the result.

        With `"dryRun": true`, the request is a dry run. A dry run needs the
        same permissions, and makes every check of the publication on the
        current snapshot of the draft. It writes nothing (no published
        document, config, scenario annotation, experiment or draft record),
        and needs no If-Match. It answers 200 with a `BuilderPublishPreview`.
        The preview holds what the publication would change and the warnings
        it would give. Its `errors` hold the refusal that a publication would
        answer with 400, 409 or 422. A 403, a 404, a body that is not a
        publish request (400) and a server failure keep their status. The dry
        run takes no lock. Thus what it reports may change before the caller
        sends the publication. The Publish dialog shows it as What publishing
        changes.
      operationId: postBuilderDraftPublish
      parameters:
        - name: If-Match
          in: header
          description: >
            The ETag of the draft revision that the publication is based on,
            as for every Builder mutation (`BuilderIfMatch`). Every request
            needs it, except a dry run, which writes nothing and ignores it. A
            missing or malformed ETag gets 400 before the server decodes the
            body, unless the body asks for a dry run.
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderPublishRequest"
      responses:
        "200":
          description: >
            publication succeeded, or, for a dry run, what it would change
            (`BuilderPublishPreview`, status `preview`)
          headers:
            ETag:
              $ref: "#/components/headers/BuilderETag"
            Warning:
              $ref: "#/components/headers/BuilderWarning"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BuilderPublishResult"
                  - $ref: "#/components/schemas/BuilderPublishPreview"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "409":
          description: >
            A target config or the draft changed after the server prepared the
            publication. Or an included topology now defines a hostname that the
            published topology also defines. Or a stage failed on such a
            conflict after the server wrote earlier stages (a `partial` result).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WebError"
                  - $ref: "#/components/schemas/BuilderPublishResult"
        "412":
          $ref: "#/components/responses/BuilderPreconditionFailed"
        "422":
          description: >
            The document fails validation, or publishes something that phenix
            refuses. Examples are an interface with no VLAN on a device that is
            not external, and interfaces that share an IP or MAC address. A
            hostname that phenix refuses is also an example: one character
            long, `all`, all digits, or `phenix` on a Windows node. A device
            setting that makes the experiment fail to start is another example
            (`device.drives.none`, `device.ospf.missing` and
            `device.ntp-server.invalid`). The message names them.
            This status also applies to a scenario that the document lists and
            that does not exist or that the caller may not read. It also applies
            to an experiment scenario that the document does not list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "500":
          description: >
            A stage failed after the server wrote earlier stages (a `partial`
            result). Or the server could not read the draft.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WebError"
                  - $ref: "#/components/schemas/BuilderPublishResult"
  "/builder/drafts/{draft}/preflight":
    parameters:
      - $ref: "#/components/parameters/BuilderDraftID"
    post:
      tags:
        - Builder
      summary: Run preflight checks on a Builder draft
      description: >
        Runs the checks that the request names on the current document of the
        draft, in the request order and all at the same time. Reports
        each check as `passed`, `failed` or `unavailable`, with a summary and
        its issues.

        - `capacity` compares the CPUs and memory of the devices that phenix
        starts with the free CPUs and memory of the schedulable cluster hosts.
        These devices are all devices except external devices. A device uses
        `hardware.vcpus` and `hardware.memory`, or 1 and 512 MB when the device
        does not set them. The check also makes sure that each device fits on
        one host. The vCPUs and memory of the device must both fit within the
        CPUs and memory of that host.

        - `network` compares the VLANs that the devices use, and the VLAN
        aliases of the networks, with the VLAN range of the named
        `experiment`. No range applies without an experiment, or when the
        experiment sets no range. The check compares the aliases with the
        VLANs that running experiments hold. It compares the bridges that the
        interfaces name with the Open vSwitch bridges of the schedulable hosts.
        It also compares the default bridge of the experiment, or `phenix` when
        there is no default bridge.
        It lists these bridges with `ovs-vsctl list-br` through the minimega
        `shell` command, which changes nothing.

        - `disks` finds each drive image by file name among the disk
        images of the server. It checks the image kind: a VM or ISO image for
        a kvm device, and a container image for a container.

        - `apps` reads each Scenario config that the document lists. It finds
        each app that the scenario does not disable among the default,
        built-in and user apps. A listed scenario that does not exist is the
        error `preflight.app.scenario-missing`.

        A check fails when one of its issues is an error. A check is
        `unavailable` when nothing failed, but the server could not make the
        check, or a part of it. The causes are:

        - The role of the caller does not have `hosts` `list` (capacity and
        bridges), `disks` `list`, `applications` `list`, or `experiments`
        `list` (VLANs in use).

        - The role does not have read access to the experiment (`configs`
        `get` and `experiments` `get`) or to a scenario (`configs` `get` and
        `scenarios` `list`).

        - The server cannot reach minimega.

        - The server lists no disk images, or does not list them within 10
        seconds.

        - The check took more than 20 seconds.

        An issue tells why (code `preflight.unavailable`, or
        `preflight.app.scenario-unreadable` as a warning for a scenario). One
        check never stops the other checks. Requires `builder` `use` and
        `configs` `get`. The route writes nothing, and starts no VM or
        experiment.
      operationId: postBuilderDraftPreflight
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderPreflightRequest"
      responses:
        "200":
          description: each check named, in the request's order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderPreflightReport"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
  "/builder/sources":
    get:
      tags:
        - Builder
      summary: List the configs Builder can use as sources
      description: >
        Requires `builder` `use` and `configs` `list`. POST /builder/generate
        can import
        topologies and experiments. Scenarios and images are for selection
        only. The server filters each config by `configs` `list` for its name.
        For topologies, experiments and scenarios, it also filters by the
        `list` permission of that resource. A topology also reports how many
        topologies it includes (`includeCount`), to a caller who holds
        `configs` `get` for its name.
      operationId: getBuilderSources
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderSources"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
  "/builder/generate":
    post:
      tags:
        - Builder
      summary: Import a Builder document from a Topology or Experiment config
      description: >
        Converts a stored config (`source`) or an uploaded config (`content`)
        into a document and returns it. The operation writes nothing. Requires
        `builder` `use` and `configs` `get`. A stored source also needs
        `configs` `get` for its name, and the `topologies` or `experiments`
        `list` permission for it. Uploaded content needs `configs` `create`, the
        permission of POST /configs, which also takes a config file. Unlike POST
        /configs, the server keeps each `${NAME}` and `${NAME:default}`
        placeholder in the content as written. It never reads its environment
        for them.

        The server converts a Topology that has the `builder-xml` annotation and
        no `builder-doc` from its legacy Builder diagram, as POST
        /builder/legacy converts one. Its `source` then has `builder`
        `builder-xml`.

        The server reads the topologies that a Topology includes
        (`includeTopologies`) from the config store with the permissions of
        the caller, never from a file. With `includes` `keep` (the default),
        their nodes are in the document, marked `includedFrom` and read only.
        The document lists the includes that the server could not read in its
        `source.unresolvedIncludes`. With `includes` `combine`, their nodes
        are nodes of the document. Only the includes that the server could not
        read stay in its `source.includeTopologies`.

        `copy` asks for the same document as a plain import, not linked to
        the topology. A combined document and a copy name no config. Their
        `source.kind` is `manual`, and the document name is the name of the
        new topology. A draft made from such a document publishes a new
        topology, and never updates the topology it was imported from. Their
        `metadata.notes` end with the note `Copied from <name>`, where
        `<name>` is the name in the metadata of the source config. The new
        name is `name`, or else the source name with `-combined` or `-copy`
        added. The server does not search for a name that no topology has. The
        `source` of the response is still the config that the server read.

        The device nodes keep the order of the config's nodes, then the nodes
        of each included topology in the order phenix merges them. A publish
        writes the nodes in that order.

        From an Experiment, each node spec loses what phenix added to it when it
        created the experiment. The spec loses `bridge_set_in_topo`, and a
        bridge that phenix set to the default bridge of the experiment. It loses
        each field that phenix reads as unset: empty or null, and 0 or false in
        a field that cannot be null. A nullable field such as `snapshot` keeps
        an explicit 0 or false. The spec also loses each value equal to the
        default that phenix gives the field, such as `vm_type` `kvm` or `memory`
        `512`. `os_type`, and the fields the topology schema requires, stay. The
        specs then read like the nodes of a topology.

        The scenario of an Experiment is its `scenario` annotation. It becomes
        the `scenarios` of the document when this server stores a Scenario
        config of that name, and the caller may list it. To list it, the caller
        needs `configs` `list` and `scenarios` `list` for it. Otherwise, the
        document lists no scenario, and a warning says so. The scenario that an
        Experiment holds never goes into the document. For uploaded content, a
        listed scenario also adds a warning. The warning says that the scenario
        is the Scenario config of that name on this server, not the copy in the
        file.

        Errors:

        - 400 when `includes` has a different value, or when the request gives
        `name` without `copy` or `includes` `combine`.

        - 422 when the request asks for `copy` or `includes` `combine` of an
        Experiment. The same status applies when the new name is not a config
        name of 1 to 512 bytes (`import.name.invalid`). It also applies when
        the new name is the name of the stored topology of the import
        (`import.name.source`).

        - 500 when the server cannot read the config store, for example for
        the Scenario config that an Experiment names.
      operationId: postBuilderGenerate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderGenerateRequest"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderGenerateResult"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "413":
          $ref: "#/components/responses/BuilderTooLarge"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
        "500":
          description: >
            The server could not read the config store: the stored source, or
            the Scenario config an imported Experiment names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
  "/builder/legacy":
    post:
      tags:
        - Builder
      summary: Convert a legacy Builder diagram into a Builder document
      description: >
        Converts a diagram of the legacy Builder (the editor that phenix had
        before the Builder) and returns the document. The operation writes
        nothing. The server reads from the store only the topologies that a
        topology includes. `content` is the text of a file. The file is the
        mxGraph XML of the diagram, whose root element is `mxGraphModel` or
        `root`. Or the file is a Topology config, in YAML or JSON, that has the
        `builder-xml` annotation. The server reads no encoded or compressed form
        of the XML.

        For a diagram alone, the node settings in the diagram are the nodes.
        Its `$NAME` placeholders get values from its own variables and the
        legacy defaults. The source of the document is `manual`, so a draft
        made from it publishes a new topology. For a Topology, its spec
        defines every node, and the diagram only places the nodes, matched by
        hostname. The response has its `source`, with `stored` false.

        Requires `builder` `use`, `configs` `get` and `configs` `create`,
        because the content can be a config file, as for POST /configs. The
        server keeps each `${NAME}` placeholder in it as written.
        `content` holds at most 5242880 bytes. Its XML nests at most 32
        elements deep and holds at most 10000 cells. The server refuses a
        DOCTYPE or any other declaration. A refusal repeats nothing of the
        content but the name and kind of a config, or the name of the root
        element of the XML.
      operationId: postBuilderLegacy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderLegacyRequest"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderGenerateResult"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "413":
          $ref: "#/components/responses/BuilderTooLarge"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
  "/builder/export/topology":
    post:
      tags:
        - Builder
      summary: Export a Builder document as the Topology config Publish writes
      description: >
        Projects the document onto the phenix Topology config that a publish of
        it would write, and returns that config as YAML. The operation reads
        nothing and writes nothing. Requires `builder` `use` and `configs`
        `get`. The server checks the document as a draft save checks it, within
        the same size limits. The config has no `builder-doc` annotation. It
        names the included topologies of the document in `includeTopologies`,
        and does not merge them.

        When the phenix config validation refuses the document, the answer
        is 422, as for a publish. A publish names these reasons in this
        order, before any other reason. First, it names interfaces without a
        VLAN, then addresses that interfaces share. Then it names hostnames
        that phenix refuses, then device settings that make the experiment
        fail to start. An export names interfaces
        without a VLAN only when a `vlan` is missing or null. It names
        hostnames only when one is a single character, which the validation
        also refuses. Otherwise it gives the reason of the validation.
        `publishBlockers` reports what only a publish refuses. Examples are an
        interface with a blank VLAN, and interfaces that share an IP or MAC
        address. Another example is a hostname that phenix refuses only when
        it creates an experiment (`all`, all digits, or `phenix` on a Windows
        node). A device setting that makes the experiment fail to start is
        also an example. One such setting is an `ntp-server` label that names
        no interface with an address.
      operationId: postBuilderExportTopology
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTopologyExportRequest"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTopologyExport"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "413":
          $ref: "#/components/responses/BuilderTooLarge"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
  "/builder/package":
    post:
      tags:
        - Builder
      summary: Make a Builder package of a document
      description: >
        Returns the package of the document in the request, with the edits
        not saved yet. The package holds the document, the sections that
        `include` names, and the requirements. The requirements list the
        items that follow, whatever the package carries. They list the
        scenarios of the document, its included topologies, its templates and
        its custom icons. They also list the apps of the scenarios that the
        server could read. They also list the files that the devices of the
        document and the packaged configs name (injection sources, app asset
        directories).

        Requires `builder` `use` and `configs` `get`. The server reads from
        the config store each
        Scenario config that the document names, and, with `topologies`, each
        included topology. It reads them with the permissions of the caller
        (`configs` `get` on it, and `scenarios` or `topologies` `list`). The
        requirements name a config that does not exist, or that the caller
        may not read, but the package does not carry it. A warning says so,
        in the same words for both cases. The server never reads an include
        that is a file path. The `icons` section gives the document a copy of
        each custom icon that it names, from the icon library. Configs go in
        the package without their times and Builder annotations
        (`builder-*`). The package never holds the content of a file, a
        script or an app. The operation writes nothing.

        `POST /builder/package/resolve` always accepts the package in the
        answer. The server omits from the requirements an entry that the
        package format refuses. A warning names that entry. Such an entry is
        blank or longer than 4096 bytes. Or it holds control characters (such
        as a newline in an injection source), or it comes after the first
        1000 entries of its list. Each warning is an issue with its code
        (`package.config.unreadable`, `package.include.file-path`,
        `package.icon.missing`, `package.icons.too-many`,
        `package.requirement.left-out`, `package.requirements.truncated`).
        Anything else that would refuse the package, such as a stored config
        without a spec, gets 422 with the code `package.invalid` and the
        issues. A package larger than 5242880 bytes gets 413 with the code
        `package.too-large`.
      operationId: postBuilderPackage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderPackageRequest"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderPackageResult"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "413":
          $ref: "#/components/responses/BuilderTooLarge"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
  "/builder/package/resolve":
    post:
      tags:
        - Builder
      summary: Check what a Builder package's diagram needs on this server
      description: >
        Reports, for each entry of the requirements of the package, whether
        this server has it. Requires `builder` `use` and `configs` `get`. The
        package is the
        request body, at most 5242880 bytes. A larger body gets 413 with the
        code `package.too-large`. The server decodes the package strictly (it
        refuses unknown fields) and checks it as the package schema
        describes. Otherwise the answer is 422 with the code
        `package.invalid`. For a package that does not validate, `issues` has
        each problem. The server also refuses a carried config with a Builder
        annotation (`builder-*`).

        - A Scenario or Topology config is `present` when the server has one
        of that name with the spec of the package. It is also `present` when
        the package carries no spec. It is `different` when its spec is not the same, and `missing`
        when there is none. It is `unknown` when the caller may not read it
        (`configs` `get` on it, and `scenarios` or `topologies` `list`). Thus
        the answer does not disclose whether it exists.

        - The server compares a custom icon by its bytes the same way, under
        `configs` `list`.

        - The server searches for disk images among the images that `GET /disks`
        lists the caller (`disks` `list`, then by name). Thus an image that the
        caller may not see is `missing`, as an absent image is. A drive matches
        by the name or full path of the image, else by its file name. The
        `detail` then tells this (`Matched by file name pkg.qc2. This server's
        image is /phenix/images/pkg.qc2.`).

        - Apps need `applications` `list`, also for the name.

        - Without `disks` `list` or `applications` `list`, or when the server
        cannot list the disk images, they are `unknown`.

        - Templates travel in the document, so they are `present`.

        - The server never checks files, so they are `unknown`.

        The operation writes nothing. The Builder creates a missing config that
        the user selects through `POST /configs`.
      operationId: postBuilderPackageResolve
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: >
                a Builder package, as `GET /schemas/builder/package/v1`
                describes it
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderPackageDependencies"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "413":
          $ref: "#/components/responses/BuilderTooLarge"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
  "/builder/cleanup":
    post:
      tags:
        - Builder
      summary: Clean up Builder storage
      description: >
        Requires `builder` `use`, as deleting any draft does. Deletes every
        draft that is published and unchanged. For such a draft, its current
        snapshot is the one it last published, and no newer snapshot follows
        it. Also, the topology it published to still references the document
        it published. A draft stays when its topology no longer exists, or
        references another document.
        Each delete names the revision that the cleanup read, so a draft
        changed in the meantime stays. The published configs and documents
        stay. A cleanup waits for a publication in progress, so it never
        deletes a draft while a publication of that draft is in progress.

        Then it removes the orphaned storage that the server also removes
        when it starts and every hour after that. Orphaned storage is
        published documents that no topology references, and stored content
        that no draft or document names. It keeps what the server stored
        within the last hour, because a save
        or a publication may still be about to reference it.

        With `dryRun=true` it removes nothing, and answers with what it would
        remove. The request has no body. A draft or a record that the server
        could not remove, or could not read, does not fail the request. The
        Warning header then says that removing some of it failed.
      operationId: postBuilderCleanup
      parameters:
        - name: dryRun
          in: query
          description: >
            `true` counts what the cleanup would remove and removes nothing.
            The server refuses a value that is not a boolean.
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: what the cleanup removed, or would remove
          headers:
            Warning:
              $ref: "#/components/headers/BuilderWarning"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderCleanup"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
  "/builder/documents":
    get:
      tags:
        - Builder
      summary: List published Builder documents
      description: >
        Requires `builder` `use` and `configs` `list`. Lists the documents
        that configs reference
        now in their `builder-doc` annotation, filtered by `configs` `list`
        for the config that each document was published to. The list shows a
        topology whose annotation names a Builder file (`path`), and no
        current stored document, with `source` `file` and the path only. The
        listing reads no file, so it lists such a row whether or not the
        server can use the file. A row with `source` `store` has `experiment`
        when the publication of the document made an experiment, and the
        caller holds `experiments` `get` for it. That experiment must still
        exist, and its topology must be the topology of the row.
      operationId: getBuilderDocuments
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderPublishedDocuments"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
  "/builder/documents/{document}":
    get:
      tags:
        - Builder
      summary: Get a published Builder document
      description: >
        Requires `builder` `use`, and `configs` `get` for the config that the
        document was published to. A document that the caller may not read, or
        that no config references any more, gets 404.
      operationId: getBuilderDocument
      parameters:
        - name: document
          in: path
          description: published document ID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          headers:
            ETag:
              $ref: "#/components/headers/BuilderDocumentETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderPublishedDocument"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
    delete:
      tags:
        - Builder
      summary: Delete a published Builder topology
      description: >
        Deletes the Topology config that the document is current for, as
        `DELETE /configs/Topology/{name}` does. Then deletes every published
        document of that topology. Drafts and experiments made from it do not
        change. Requires `builder` `use`, and `configs` `delete` for the
        topology. A document that
        the caller may not get, or that is no longer current, gets 404. A
        document is no longer current when the topology changed to reference
        another document, was published again, or was deleted. A published
        experiment gets 422. To delete an experiment, use the Experiments
        page. If-Match must name the `etag` of the document as the caller
        read it. A topology that changed since then, in any way, gets 412
        with the current tag.

        The list does not show a document whose stored metadata this server
        cannot read (for example one a newer phēnix wrote). The server logs
        its ID. Deleting it removes only that record and its content, and
        changes no config. When the record still names its config, the
        caller needs `configs` `get` and `delete` for it. Otherwise the
        caller needs them for every config (`*/*`). If-Match must name
        the tag of the stored record, which a 412 gives in its ETag header.
      operationId: deleteBuilderDocument
      parameters:
        - name: document
          in: path
          description: published document ID
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/BuilderDocumentIfMatch"
      responses:
        "204":
          description: >
            The server deleted the topology, or the damaged document. A
            Warning header says that the server could not remove all of the
            topology's published documents. The list never shows them again,
            and a later server start removes them.
          headers:
            Warning:
              $ref: "#/components/headers/BuilderWarning"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "412":
          $ref: "#/components/responses/BuilderStale"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
  "/builder/topologies/{topology}/document":
    get:
      tags:
        - Builder
      summary: Get the Builder document a topology references
      description: >
        Returns the document that the `builder-doc` annotation of the topology
        names, wherever the server keeps it. The stored published document has
        priority: the document that the `id` or `digest` of the annotation names
        for this topology. Without one, the server reads the Builder file at the
        `path` of the annotation, on every request. The file must:

        - be below the phenix base directory (`--base-dir.phenix`), and
        outside the directory that holds the mounted VM file systems

        - be a regular file of at most 5 MiB

        - be reached through no symbolic link that leaves the base directory
        or has an absolute target

        - hold a valid Builder document as JSON or YAML

        A `digest` beside `path` pins the file. The server refuses a file
        whose document has another digest. Requires `builder` `use`, and
        `configs` `get` for the topology, which says nothing about the file. A
        caller who may create or update any one topology can name in it any
        Builder file below the base directory. That caller can then read the
        file here. Three cases get the same 404. They are a topology that the
        caller may not get, a topology that does not exist, and a topology
        that references no document. When the server cannot use a file, the
        answer is a fixed sentence that names the path, never anything that
        the file holds.
      operationId: getBuilderTopologyDocument
      parameters:
        - name: topology
          in: path
          description: topology name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >
            The document, with `digest`, `size` and `document`. For a file,
            `topologyDiffers` says whether the stored topology differs from
            what the document publishes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderPublishedDocument"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          description: >
            The topology does not exist, the caller may not get it, or it
            references no Builder document. Or the Builder file that it names
            does not exist on this phenix server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "413":
          description: The Builder file is larger than 5 MiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "422":
          description: >
            The Builder file is outside the directory that phenix reads
            Builder files from, or phenix cannot read it. Or it is not a
            regular file, or not a valid Builder document. Or it does not
            match the digest that the topology records for it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
  "/builder/icons":
    get:
      tags:
        - Builder
      summary: List the icons of the Builder icon library
      description: >
        Requires `builder` `use`. Returns every icon of the icon library of
        the server, sorted by name, ignoring case, without its image. Each icon
        has the ID of its image, its uploader, its aliases, its revision and
        its entity tag. The aliases are the earlier names from its renames,
        which still name it. Each icon also tells whether a caller may rename
        or delete it. A caller may not rename or delete an icon of the server
        template files. `GET /builder/icons/{icon}` gives the image of
        one icon. The ID is the hash of the image, so a client needs the image
        of an ID once. The response also tells the most icons that the
        library holds, and the entity tag of the list. A request whose
        `If-None-Match` names that tag (weak comparison) gets 304, with no
        body, while the list is the same. The server sends an image only as
        base64 inside JSON, never as an image. Every response of the icon
        operations also carries
        `Content-Security-Policy: default-src 'none'; frame-ancestors 'none'`.
      operationId: listBuilderIcons
      parameters:
        - name: If-None-Match
          in: header
          description: the entity tag of the list as last read
          required: false
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          headers:
            ETag:
              description: the entity tag of the list
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderIconList"
        "304":
          description: The list is the one that If-None-Match names.
          headers:
            ETag:
              description: the entity tag of the list
              schema:
                type: string
        "403":
          $ref: "#/components/responses/BuilderForbidden"
    post:
      tags:
        - Builder
      summary: Add an icon to the Builder icon library
      description: >
        Requires `builder` `use`. Adds a PNG under a name that the caller
        selects. The name has 1 to 64 letters, digits, `_`, `@`, `.` and `-`.
        It is not `.` or `..`, and no icon or alias has it, ignoring case.
        Takes a PNG of at most 96 by 96 pixels and 65536 bytes, as base64.
        Only the bytes tell what the image is. The server reads no file name,
        extension or declared type, and refuses all images that are not PNG
        (SVG, JPEG, GIF, WebP).

        The server stores a PNG as it is when all these conditions are true. The
        PNG holds only the chunks `IHDR`, `PLTE`, `tRNS`, `IDAT` and `IEND`. It
        has a `PLTE` or `tRNS` only where its color type uses one. It has
        nothing after its pixels, and it is at most 40960 bytes. The server
        encodes all other PNGs again. This keeps the pixels and removes all else
        (text, metadata, color profiles, more frames, an unused palette, data
        after the pixels). Thus use the `data` that the response returns.

        A name that already names an icon with the same bytes gets 200 with
        that icon. A name of another icon, or an alias of another icon, gets
        409. The library holds at most 2000 icons, of all users together.
      operationId: createBuilderIcon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderIconUpload"
      responses:
        "200":
          description: the name already names an icon with the same bytes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderIcon"
        "201":
          description: icon added
          headers:
            ETag:
              $ref: "#/components/headers/BuilderIconETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderIcon"
        "400":
          description: >
            The request is malformed. Its body is not a single JSON value of
            the expected shape (the server refuses unknown fields), or `data`
            is missing or not base64.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "409":
          description: >
            The name, ignoring case, names another icon or is another icon's
            alias. The message names that icon and who uploaded it, for
            example `icon name "plc" belongs to an icon alice uploaded.
            Choose another name`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "413":
          description: >
            The request body is larger than 131072 bytes, or the image is
            larger than 65536 bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "422":
          description: >
            The name is not an icon name, or the image is not a PNG or is more
            than 96 pixels wide or high. Or the share of the caller in the
            library, or the library, is full.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
  "/builder/icons/{icon}":
    parameters:
      - name: icon
        in: path
        description: >
          the name of the icon, or one of its aliases, in any case. A path
          that names no icon gets 404, whatever its form.
        required: true
        schema:
          type: string
    get:
      tags:
        - Builder
      summary: Read an icon of the Builder icon library
      description: >
        Requires `builder` `use`. Returns the icon that the path names, with
        its image. `name` is the current name of the icon. A request whose
        `If-None-Match` names the icon's `etag` gets 304, with no body.
      operationId: getBuilderIcon
      parameters:
        - name: If-None-Match
          in: header
          description: the entity tag of the icon as last read
          required: false
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          headers:
            ETag:
              $ref: "#/components/headers/BuilderIconETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderIcon"
        "304":
          description: The icon is at the revision that If-None-Match names.
          headers:
            ETag:
              $ref: "#/components/headers/BuilderIconETag"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderIconNotFound"
    put:
      tags:
        - Builder
      summary: Rename an icon of the Builder icon library
      description: >
        Requires `builder` `use`. An icon of the server template files gets
        403. Gives the icon that the path names a new name. No other icon, and
        no alias of another icon, may have that name, ignoring case. The old
        name becomes an alias, so diagrams and templates that name it continue
        to show the icon. A change of case renames the icon in place. A rename
        to one of its aliases makes that alias its name again. An icon keeps
        at most 16 old names. A rename that would give it more gets 422, and
        the icon keeps all its old names.
      operationId: renameBuilderIcon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderIconRename"
      responses:
        "200":
          description: the icon as renamed
          headers:
            ETag:
              $ref: "#/components/headers/BuilderIconETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderIcon"
        "400":
          description: >
            The request is malformed. Its body is not a single JSON value of
            the expected shape (the server refuses unknown fields).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderIconNotFound"
        "409":
          description: >
            Another icon or its alias has the new name, or the icon changed
            during the rename. The server renamed nothing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "413":
          description: The request body is larger than 4096 bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "422":
          description: >
            The new name is not an icon name, or the icon already has 16 old
            names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
    delete:
      tags:
        - Builder
      summary: Delete an icon from the Builder icon library
      description: >
        Requires `builder` `use`. An icon of the server template files gets 403.
        Deletes the icon that the path names, by its name or an alias, with all
        its aliases. Diagrams and templates that name it show their built-in
        icon. A downloaded document keeps its own copy. The server also removes
        a record of that name that it cannot read. When the server could not
        remove an alias, the answer is still 204, with a `Warning: 199` header.
        If-Match must name the `etag` of the icon. A rename gives the icon a new
        tag, so a delete with the tag from before the rename gets 412 with the
        current tag. A record that the server cannot read has the tag of its
        record revision, which a 412 gives.
      operationId: deleteBuilderIcon
      parameters:
        - $ref: "#/components/parameters/BuilderIconIfMatch"
      responses:
        "204":
          description: icon deleted
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderIconNotFound"
        "409":
          description: >
            A record that the server cannot read changed during the delete.
            The server deleted nothing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "412":
          $ref: "#/components/responses/BuilderStale"
  "/builder/templates":
    get:
      tags:
        - Builder
      summary: List the device templates
      description: >
        Requires `builder` `use`. Returns the template library of the
        server, the built-in templates and the collections of the template
        files of the server. Every caller gets the same response. A template
        names its custom icon, which the icon library resolves.

        `templates` and `collections` are the template library of the server
        (`source` `library`), in the order that callers added their items.
        Every
        user with Builder access changes the same library: no item has an
        owner. A server whose library never changed has an empty library.
        When this server cannot read the library record, the response has
        `damaged` true and none of its items. The server then refuses every
        change of it with 409.

        `builtins` are the five built-in templates (`server`, `workstation`,
        `router`, `firewall`, `external`, `source` `builtin`, version 1).
        `preloaded` lists the collections that the server read at start from
        the template files of its template directory
        (`--base-dir.builder-templates`). There is one collection per file,
        with its templates (`source` `preloaded`, version 1). Built-in and
        preloaded items are read only. A write route that names one gets 409
        with the code `template.item.read-only`. A caller can change a copy in
        the library.

        A template that a diagram copied names its source in the diagram
        (`templates[].source` of the Builder document: `kind`, `id` and
        `version`). When the `version` of the item with that `source` and
        `id` here is higher, the library holds a newer version.
      operationId: getBuilderTemplates
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplateLibrary"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
  "/builder/templates/items":
    post:
      tags:
        - Builder
      summary: Add device templates to the template library
      description: >
        Requires `builder` `use`. Adds 1 to 200 templates in one write,
        each with a new ID. With `collection`, the same write also makes a
        new collection that holds exactly those templates. The custom icon of
        a template (`device.icon`) is an icon name. The icon library resolves
        it, whether or not it holds that icon now. A template of the library
        has no `source`.
      operationId: createBuilderTemplates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTemplateCreate"
      responses:
        "201":
          description: templates added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplateCreateResult"
        "400":
          description: >
            The request is malformed. Its body is not a single JSON value of
            the expected shape (the server refuses unknown fields), or it names
            no template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "409":
          $ref: "#/components/responses/BuilderTemplateConflict"
        "413":
          $ref: "#/components/responses/BuilderTemplateTooLarge"
        "422":
          $ref: "#/components/responses/BuilderTemplateUnprocessable"
        "503":
          $ref: "#/components/responses/BuilderTemplateBusy"
  "/builder/templates/items/{template}":
    parameters:
      - $ref: "#/components/parameters/BuilderTemplateID"
    put:
      tags:
        - Builder
      summary: Replace a device template of the template library
      description: >
        Requires `builder` `use`. Any user with Builder access may replace
        any template of the library. Replaces the name, the description and
        the device of one template. The template keeps its ID, and its
        version increases by one. Content that is equal to the stored content
        changes nothing and keeps the entity tag. Devices already made from
        the template do not change. A diagram's copy of the template changes
        only when its user updates it.
      operationId: putBuilderTemplate
      parameters:
        - $ref: "#/components/parameters/BuilderTemplateIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTemplateContent"
      responses:
        "200":
          description: the template now stored
          headers:
            ETag:
              $ref: "#/components/headers/BuilderTemplateETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplate"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderTemplateNotFound"
        "409":
          $ref: "#/components/responses/BuilderTemplateConflict"
        "412":
          $ref: "#/components/responses/BuilderTemplatePreconditionFailed"
        "413":
          $ref: "#/components/responses/BuilderTemplateTooLarge"
        "422":
          $ref: "#/components/responses/BuilderTemplateUnprocessable"
        "503":
          $ref: "#/components/responses/BuilderTemplateBusy"
  "/builder/templates/collections":
    post:
      tags:
        - Builder
      summary: Add a collection to the template library
      description: >
        Requires `builder` `use`. A collection is a named group of
        templates of the library. A template can be in more than one
        collection. Every ID in `templateIds` must name a template of the
        library, one time. A built-in template or a template of a template
        file gets 409.
      operationId: createBuilderTemplateCollection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTemplateCollectionContent"
      responses:
        "201":
          description: collection added
          headers:
            ETag:
              $ref: "#/components/headers/BuilderTemplateETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplateCollection"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "409":
          $ref: "#/components/responses/BuilderTemplateConflict"
        "413":
          $ref: "#/components/responses/BuilderTemplateTooLarge"
        "422":
          $ref: "#/components/responses/BuilderTemplateUnprocessable"
        "503":
          $ref: "#/components/responses/BuilderTemplateBusy"
  "/builder/templates/collections/{collection}":
    parameters:
      - $ref: "#/components/parameters/BuilderTemplateCollectionID"
    put:
      tags:
        - Builder
      summary: Replace a collection of the template library
      description: >
        Requires `builder` `use`. Replaces the name, the description and
        the templates of one collection. The collection keeps its ID. To add
        a template to a collection, or to remove one from it, send this
        request with the changed list. Content that is equal to the stored
        content changes nothing and keeps the entity tag.
      operationId: putBuilderTemplateCollection
      parameters:
        - $ref: "#/components/parameters/BuilderTemplateIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTemplateCollectionContent"
      responses:
        "200":
          description: the collection now stored
          headers:
            ETag:
              $ref: "#/components/headers/BuilderTemplateETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplateCollection"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderTemplateNotFound"
        "409":
          $ref: "#/components/responses/BuilderTemplateConflict"
        "412":
          $ref: "#/components/responses/BuilderTemplatePreconditionFailed"
        "413":
          $ref: "#/components/responses/BuilderTemplateTooLarge"
        "422":
          $ref: "#/components/responses/BuilderTemplateUnprocessable"
        "503":
          $ref: "#/components/responses/BuilderTemplateBusy"
  "/builder/templates/delete":
    post:
      tags:
        - Builder
      summary: Delete templates and collections of the template library
      description: >
        Requires `builder` `use`. Deletes the named templates and
        collections in one write. Each item names the `etag` of the content
        that the caller read, as a PUT names it in If-Match. An item without
        a strong, quoted tag gets 400. When the library holds any item at
        another tag, the whole request gets 412 with `template.item.stale`
        and the current tag of that item. The server then deletes nothing. The
        server
        ignores an ID that the library does not hold, so a repeat of the
        request is harmless. A deleted
        template leaves every collection that held it. A deleted collection
        leaves its templates. A built-in template or an item of a template
        file gets 409. Diagrams do not change: a diagram's copy of a deleted
        template stays, and its editor says that the library template was
        deleted.
      operationId: deleteBuilderTemplates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTemplateSelection"
      responses:
        "200":
          description: how many templates and collections the request deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplateDeleteResult"
        "400":
          description: >
            The request is malformed. Its body is not a single JSON value of
            the expected shape (the server refuses unknown fields). Or it
            names no template and no collection, or an item has no strong,
            quoted `etag`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "409":
          $ref: "#/components/responses/BuilderTemplateConflict"
        "412":
          $ref: "#/components/responses/BuilderTemplatePreconditionFailed"
        "413":
          description: The request body is larger than 64 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "503":
          $ref: "#/components/responses/BuilderTemplateBusy"
  "/builder/layersets":
    get:
      tags:
        - Builder
      summary: List the layer sets of the Builder layer set library
      description: >
        Requires `builder` `use`. The layer set library belongs to the
        server, and every user of the Builder sees every set. The built-in
        sets come first (the Purdue Model set, ID `builtin:purdue`). The
        other sets follow by name, ignoring case. `defaultId` is the default
        set of the server for new diagrams, or null. `defaultEtag` is the
        entity tag that a change of that choice names in If-Match. `damaged`
        counts the records that the server cannot read, which the list does
        not show.
      operationId: listBuilderLayerSets
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderLayerSetList"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
    post:
      tags:
        - Builder
      summary: Add a layer set to the Builder layer set library
      description: >
        Requires `builder` `use`. Adds a set under a new ID, at version 1.
        Every user of the Builder sees every set. The library holds at most
        200 sets, apart from the built-in sets. To duplicate a set, read it
        and send its content here.
      operationId: createBuilderLayerSet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderLayerSetContent"
      responses:
        "201":
          description: layer set added
          headers:
            ETag:
              $ref: "#/components/headers/BuilderLayerSetETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderLayerSet"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "413":
          $ref: "#/components/responses/BuilderLayerSetTooLarge"
        "422":
          $ref: "#/components/responses/BuilderLayerSetUnprocessable"
  "/builder/layersets/default":
    get:
      tags:
        - Builder
      summary: Read the default layer set of the server
      description: >
        Requires `builder` `use`. Returns the set that new diagrams of all
        users start with, or null. The server has one default set for all
        users. A selection of a set that no longer exists is null. A new blank
        diagram
        copies the default set and links to it. With no default, a new
        diagram shows the placeholder layers 0 to 6. `etag` is the entity tag
        of the selection, which a change of it names in If-Match.
      operationId: getBuilderDefaultLayerSet
      responses:
        "200":
          description: successful operation
          headers:
            ETag:
              $ref: "#/components/headers/BuilderLayerSetDefaultETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderLayerSetDefaultSelection"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
    put:
      tags:
        - Builder
      summary: Select the default layer set of the server
      description: >
        Requires `builder` `use`. Selects the set that the new diagrams of
        all users copy. Each Builder user can change it. `id` null or empty
        removes the selection. If-Match must name the `etag` of the current
        selection. Another tag gets 412 (`layerset.stale`) with the current
        tag. A set that does not exist gets 422 with the code
        `layerset.default.unknown`.
      operationId: putBuilderDefaultLayerSet
      parameters:
        - $ref: "#/components/parameters/BuilderLayerSetDefaultIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderLayerSetDefault"
      responses:
        "200":
          description: the selection now stored
          headers:
            ETag:
              $ref: "#/components/headers/BuilderLayerSetDefaultETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderLayerSetDefaultSelection"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "412":
          description: >
            The If-Match header does not name the current selection
            (`layerset.stale`). The response carries the current entity tag.
          headers:
            ETag:
              $ref: "#/components/headers/BuilderLayerSetDefaultETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "413":
          description: The request body is larger than 4 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "422":
          description: >
            The set that `id` names does not exist (`layerset.default.unknown`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
  "/builder/layersets/{layerset}":
    parameters:
      - $ref: "#/components/parameters/BuilderLayerSetID"
    get:
      tags:
        - Builder
      summary: Read a layer set of the Builder layer set library
      description: >
        Requires `builder` `use`. Returns the set with its entity tag.
      operationId: getBuilderLayerSet
      responses:
        "200":
          description: successful operation
          headers:
            ETag:
              $ref: "#/components/headers/BuilderLayerSetETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderLayerSet"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderLayerSetNotFound"
        "409":
          $ref: "#/components/responses/BuilderLayerSetDamaged"
    put:
      tags:
        - Builder
      summary: Replace a layer set of the Builder layer set library
      description: >
        Requires `builder` `use`. Any user with this permission may change
        any set, but nobody may change a built-in set (403,
        `layerset.read-only`). Replaces the content of the set. A change
        increases the version by one. Content that is equal to the stored
        content changes nothing and keeps the entity tag. Diagrams that copied
        the set keep their copies, and the editor offers them the update.
      operationId: putBuilderLayerSet
      parameters:
        - $ref: "#/components/parameters/BuilderLayerSetIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderLayerSetContent"
      responses:
        "200":
          description: the layer set now stored
          headers:
            ETag:
              $ref: "#/components/headers/BuilderLayerSetETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderLayerSet"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderLayerSetReadOnly"
        "404":
          $ref: "#/components/responses/BuilderLayerSetNotFound"
        "409":
          $ref: "#/components/responses/BuilderLayerSetDamaged"
        "412":
          $ref: "#/components/responses/BuilderLayerSetPreconditionFailed"
        "413":
          $ref: "#/components/responses/BuilderLayerSetTooLarge"
        "422":
          $ref: "#/components/responses/BuilderLayerSetUnprocessable"
        "503":
          $ref: "#/components/responses/BuilderLayerSetBusy"
    delete:
      tags:
        - Builder
      summary: Delete a layer set from the Builder layer set library
      description: >
        Requires `builder` `use`. Any user with this permission may delete
        any set, but nobody may delete a built-in set (403,
        `layerset.read-only`). Diagrams that copied the set keep their copies.
        A default selection of the set becomes null. If-Match must name the
        `etag` of the current content. A record that the server cannot read
        has the tag of its record revision, `"<revision>"`, which a 412 gives.
      operationId: deleteBuilderLayerSet
      parameters:
        - $ref: "#/components/parameters/BuilderLayerSetIfMatch"
      responses:
        "204":
          description: layer set deleted
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderLayerSetReadOnly"
        "404":
          $ref: "#/components/responses/BuilderLayerSetNotFound"
        "412":
          $ref: "#/components/responses/BuilderLayerSetPreconditionFailed"
        "503":
          $ref: "#/components/responses/BuilderLayerSetBusy"
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
  - url: http://localhost:3000/api/v1
components:
  schemas:
    Configs:
      type: object
      properties:
        configs:
          type: array
          items:
            $ref: "#/components/schemas/Config"
    Config:
      type: object
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          type: object
          properties:
            name:
              type: string
            annotations:
              description: >
                Text values by key. `builder-doc` is the one annotation that
                is a map: the Builder document a topology references.
              type: object
              properties:
                builder-doc:
                  $ref: "#/components/schemas/BuilderDocumentReference"
              additionalProperties:
                type: string
          required:
            - name
        spec:
          type: object
          additionalProperties: true
      required:
        - apiVersion
        - kind
        - metadata
        - spec
    BuilderDocumentReference:
      description: >
        The Builder document that a topology references, in its `builder-doc`
        annotation. It holds at least one sub-key. Publish writes `digest` and
        `id`, and keeps a `path` that the topology already has. The server
        refuses a config whose reference is not valid. A renamed or copied
        topology can have an `id` that is not the one that its `digest` gives
        for the name of the topology. When a caller creates or updates a
        topology with such an `id`, the server removes the `id`. It also
        removes the `digest`, unless the reference has a `path`.
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        digest:
          description: >
            digest of the document's canonical JSON, `sha256:` and 64
            lowercase hex digits. It names the stored published document of
            this topology with that content, and pins the content of the
            file `path` names.
          type: string
        id:
          description: >
            ID of a stored published document (see `/builder/documents`).
            It names a document only when that document was published to
            this topology.
          type: string
        path:
          description: >
            absolute, clean path of a Builder document file on the phenix
            server, at most 1024 bytes, ending in `.json`, `.yaml` or `.yml`.
          type: string
    Experiments:
      type: object
      properties:
        experiments:
          type: array
          items:
            $ref: "#/components/schemas/Experiment"
    Experiment:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        topology:
          type: string
        apps:
          type: array
          items:
            type: string
        start_time:
          type: string
          format: date-time
        running:
          type: boolean
        vm_count:
          type: integer
        vlan_min:
          type: integer
        vlan_max:
          type: integer
        vlan_count:
          type: integer
        vlans:
          type: array
          items:
            type: object
            properties:
              vlan:
                type: integer
              alias:
                type: string
        vms:
          $ref: "#/components/schemas/VMs"
    VMs:
      type: object
      properties:
        vms:
          type: array
          items:
            $ref: "#/components/schemas/VM"
    VM:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        experiment:
          type: string
        host:
          type: string
        ipv4:
          type: array
          items:
            type: string
        cpus:
          type: integer
        ram:
          type: integer
        disk:
          type: string
        dnb:
          type: boolean
        networks:
          type: array
          items:
            type: string
        taps:
          type: array
          items:
            type: string
        captures:
          type: array
          items:
            $ref: "#/components/schemas/Capture"
        running:
          type: boolean
        uptime:
          type: number
          format: float
        screenshot:
          type: string
          format: base64
    Schedule:
      type: object
      properties:
        schedule:
          type: array
          items:
            type: object
            properties:
              vm:
                type: string
              host:
                type: string
              auto_assigned:
                type: boolean
    Captures:
      type: object
      properties:
        captures:
          type: array
          items:
            $ref: "#/components/schemas/Capture"
    Capture:
      type: object
      properties:
        vm:
          type: string
        interface:
          type: integer
        filepath:
          type: string
    Snapshots:
      type: object
      properties:
        snapshots:
          type: array
          items:
            type: string
    Files:
      type: object
      properties:
        files:
          type: array
          items:
            type: string
    Hosts:
      type: object
      properties:
        hosts:
          type: array
          items:
            $ref: "#/components/schemas/Host"
    Host:
      type: object
      properties:
        name:
          type: string
        cpus:
          type: integer
        load:
          type: string
        memused:
          type: integer
        memtotal:
          type: integer
        bandwidth:
          type: string
        vms:
          type: integer
        uptime:
          type: number
          format: float
        schedulable:
          type: boolean
    Applications:
      type: object
      properties:
        applications:
          type: array
          items:
            type: string
    Topologies:
      type: object
      properties:
        topologies:
          type: array
          items:
            type: string
    Disks:
      type: object
      properties:
        disks:
          type: array
          items:
            type: string
    Users:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
    User:
      type: object
      properties:
        username:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: object
          properties:
            name:
              type: string
            resources:
              type: array
              items:
                type: string
            resource_names:
              type: array
              items:
                type: string
            verbs:
              type: array
              items:
                type: string
    Credentials:
      type: object
      properties:
        username:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
        token:
          type: string
    WebError:
      type: object
      properties:
        message:
          type: string
        cause:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        code:
          description: >
            The stable, machine-readable code of the failure. The error of every
            Builder route has one, such as `document.invalid`,
            `publish.blocked`, `publish.topology.exists`, `request.not-found`
            or `request.stale`. The errors of other routes do not have it. The
            answers about a
            draft that a client must tell apart have their own codes:
            `draft.stale` (412), `draft.conflict` and
            `draft.snapshot.current` (409). A method that a Builder route does
            not take gets 405, `request.method-not-allowed`, and the methods
            that the route takes in `Allow`. A refusal about one of the
            scenarios that a draft lists (`publish.scenario.*`) names that
            scenario in `metadata.scenario`. The docs list every code at
            https://phenix.sceptre.dev/latest/builder/error-codes/.
          type: string
          pattern: "^[a-z]+(\\.[a-z0-9-]+)+$"
          example: publish.blocked
        issues:
          description: >
            Each problem of a Builder error, when the error names them one by
            one. These are the issues of a document that does not validate
            (`document.invalid`), or the interfaces, addresses and hostnames
            that only a publish refuses (`publish.blocked`).
          type: array
          items:
            $ref: "#/components/schemas/BuilderIssue"
    BuilderIssue:
      title: Builder Issue
      description: >
        One problem that the Builder found in a document, a publication or a
        request. It has the code of the rule that it breaks, its severity, what
        it says, and its location, by the parts that the Builder knows. The
        validator of the web UI reports the same codes for the same rules. A
        code never changes its meaning after phenix publishes it. A new rule
        gets a new code.
      type: object
      required:
        - code
        - severity
        - message
      properties:
        code:
          title: Code
          description: >
            The rule the issue breaks, as dotted lowercase words whose first
            names what the rule is about. The docs list every code at
            https://phenix.sceptre.dev/latest/builder/error-codes/.
          type: string
          pattern: "^[a-z]+(\\.[a-z0-9-]+)+$"
          example: node.hostname.duplicate
        severity:
          title: Severity
          description: >
            `error` for an issue that refuses the request, `warning` for one
            that does not.
          type: string
          enum: [error, warning]
          example: error
        message:
          title: Message
          description: What the issue says, in words for a person to read.
          type: string
          example: duplicate hostname "web" (also nodes[1])
        path:
          title: Path
          description: >
            Where the issue is in the document, when it is about a part of
            it.
          type: string
          example: nodes[3].device.hostname
        nodeId:
          title: Node ID
          description: The ID of the node the issue is about, when it is about one.
          type: string
          example: 4113dfc0-f4be-57f9-8115-6cecd1f1aea3
        edgeId:
          title: Edge ID
          description: The ID of the connection the issue is about, when it is about one.
          type: string
          example: 7f010dcd-e23d-514c-9206-3609df999026
        networkId:
          title: Network ID
          description: The ID of the network the issue is about, when it is about one.
          type: string
          example: a8af611d-c68f-54e0-94a5-9176cea64e44
        field:
          title: Field
          description: >
            The JSON Forms data path of the device field the issue is about,
            when it is about one.
          type: string
          example: spec.network.interfaces.0.vlan
    BuilderDocument:
      title: Builder Document
      description: >
        A Builder document: the diagram of a topology, with its nodes,
        networks and connections, and how the canvas shows them. Under
        `metadata`, it has what the document says about itself. This
        component lists every property of the document, and gives the
        outline of the nested properties. GET /schemas/builder/v1 serves the
        complete JSON Schema that the server checks every document against.
        Each property in it has a title, a description and examples. A
        document holds no other property. The server refuses a document with
        another property, such as a metadata field at the root. `layout`,
        `iconSize`, `templates` and `icons` are for presentation only. The
        server never writes them to a config.
      type: object
      additionalProperties: false
      required:
        - "$schema"
        - revision
        - metadata
        - nodes
        - networks
        - edges
        - viewport
        - grid
      properties:
        "$schema":
          title: Schema URI
          description: >
            the Builder document schema, which a document must name exactly
          type: string
          enum:
            - https://phenix.sandia.gov/schemas/builder/v1
          example: https://phenix.sandia.gov/schemas/builder/v1
        revision:
          title: Schema Revision
          description: >
            the revision of the Builder document schema the document follows
          type: integer
          enum:
            - 1
          example: 1
        metadata:
          title: Metadata
          description: >
            what the document says of itself: its identifier, name and
            description, who made and last saved it and when, and its notes
          allOf:
            - $ref: "#/components/schemas/BuilderDocumentMetadata"
          example:
            id: 49d876d1-571a-5b5c-91b7-aadf5bb5209c
            name: Pump station
            createdBy: alice
            createdAt: "2026-10-01T15:04:05Z"
            updatedBy: bob
            updatedAt: "2026-10-02T09:30:00Z"
            notes:
              - Snapshot the PLC images before each run.
        nodes:
          title: Nodes
          description: >
            the items on the canvas: devices, switches, notes and groups, and
            the shapes, icons and lines drawn beside them
          type: array
          items:
            title: Node
            description: >
              an item on the canvas. It carries the payload its `kind` names,
              and no other.
            type: object
            required:
              - id
              - kind
              - position
            properties:
              id:
                description: >
                  identifier of the node, unique among the document's nodes
                type: string
              kind:
                description: what the node is, which names its payload
                type: string
                enum:
                  - device
                  - switch
                  - note
                  - group
                  - shape
                  - icon
                  - line
              label:
                description: text shown on the node
                type: string
              position:
                description: >
                  where the node is on the canvas: `x` and `y` in pixels,
                  relative to its parent group when it has one
                type: object
                additionalProperties: true
              size:
                description: >
                  explicit `width` and `height` of the node in pixels. Without
                  them, the editor sets the size of the node
                type: object
                additionalProperties: true
              parentId:
                description: identifier of the group node this node belongs to
                type: string
              device:
                description: >
                  payload of a device node. It has the hostname, the complete
                  phenix node spec, the connection points and the icon. It
                  also has the `iconSize` of the icon in place of the size of
                  the diagram, and the colors. `hideDescription` true hides
                  the description of the node on the canvas. The `layer` is
                  the ID of the layer that the node is in, an integer from 0
                  to 99. The document need not define that layer (see
                  `layers`). A publish never writes the `layer` and
                  `hideDescription`
                type: object
                additionalProperties: true
              switch:
                description: >
                  payload of a switch node. It has the network that it
                  represents, and the colors. It also has the `iconSize` of
                  its icon in place of the size of the diagram, and the
                  `layer` (as for a device). A publish never writes the
                  `layer`.
                type: object
                additionalProperties: true
              note:
                description: payload of a note node, its text and color
                type: object
                additionalProperties: true
              group:
                description: >
                  payload of a group node: its title, description, color,
                  border style and icon. It also has the `iconSize` of the
                  icon in place of the size of the diagram, and whether the
                  group is collapsed. `hideDescription` true hides the
                  description of the group on the canvas
                type: object
                additionalProperties: true
              shape:
                description: >
                  payload of a shape node: `rectangle` or `circle`, its label,
                  fill and outline colors and border style. Never published
                type: object
                additionalProperties: true
              icon:
                description: >
                  payload of an icon node: exactly one of a built-in `iconKey`
                  and a custom `icon`, and its label. Never published
                type: object
                additionalProperties: true
              line:
                description: >
                  payload of a line node: its 2 to 64 `points` (relative to the
                  position of the node), and its label, color and line style.
                  It also has its `startArrow` and `endArrow`. Never published
                type: object
                additionalProperties: true
          example:
            - id: 4113dfc0-f4be-57f9-8115-6cecd1f1aea3
              kind: device
              label: router
              position:
                x: 0
                y: 0
              device:
                hostname: router
                iconKey: router
                spec:
                  type: Router
                  general:
                    hostname: router
                  hardware:
                    os_type: vyos
                    drives:
                      - image: vyos.qc2
                  network:
                    interfaces:
                      - name: eth0
                        type: ethernet
                        proto: static
                        address: 10.0.0.1
                        mask: 24
                        vlan: EXP
                interfaces:
                  - id: 7f010dcd-e23d-514c-9206-3609df999026
                    name: eth0
                    index: 0
            - id: dee6bc70-8103-581e-8b31-6c95cda798a0
              kind: switch
              label: EXP
              position:
                x: 160
                y: 256
              switch:
                networkId: a8af611d-c68f-54e0-94a5-9176cea64e44
        networks:
          title: Networks
          description: >
            the networks (VLANs) the switches and connections of the document
            belong to
          type: array
          items:
            title: Network
            description: a phenix network (VLAN)
            type: object
            required:
              - id
              - name
            properties:
              id:
                description: identifier of the network
                type: string
              name:
                description: >
                  VLAN name, unique in the document and without white space
                  (`\s` in an ECMAScript pattern), which device interfaces
                  name as their `vlan`
                type: string
              alias:
                description: >
                  VLAN number published to an experiment's `vlans.aliases`
                type: integer
                minimum: 1
                maximum: 4094
              description:
                description: free text describing the network
                type: string
              color:
                description: >
                  color of the network's connection lines, as CSS color text
                type: string
              lineStyle:
                description: dash pattern of the network's connection lines
                type: string
              subnet:
                description: >
                  IPv4 network of the network in CIDR form without host bits,
                  which the editor gives interface addresses from. Builder
                  only: a publish does not write it
                type: string
                example: 10.0.0.0/24
              gateway:
                description: >
                  IPv4 address of the network's gateway, a host address of
                  its subnet. The editor sets it as the gateway of an
                  interface that it gives an address. Builder only: a publish
                  does not write it
                type: string
                format: ipv4
          example:
            - id: a8af611d-c68f-54e0-94a5-9176cea64e44
              name: EXP
              alias: 101
              description: Experiment network
              subnet: 10.0.0.0/24
              gateway: 10.0.0.1
        edges:
          title: Connections
          description: >
            the connections, each joining one device interface to one switch,
            and so to its network
          type: array
          items:
            title: Connection
            description: >
              a device connection point attached to a switch. The server checks
              the nodes, connection points and network it names.
            type: object
            required:
              - id
              - sourceNodeId
              - targetNodeId
              - networkId
            properties:
              id:
                description: identifier of the connection
                type: string
              sourceNodeId:
                description: identifier of the node the connection starts at
                type: string
              sourceHandleId:
                description: >
                  connection point of the source node, when it is a device
                type: string
              targetNodeId:
                description: identifier of the node the connection ends at
                type: string
              targetHandleId:
                description: >
                  connection point of the target node, when it is a device
                type: string
              networkId:
                description: >
                  identifier of the network of the switch the connection joins
                type: string
              label:
                description: text shown on the connection
                type: string
              color:
                description: >
                  line color drawn in place of the network's, as CSS color text
                type: string
              lineStyle:
                description: dash pattern drawn in place of the network's
                type: string
              route:
                description: >
                  the path that an automatic layout drew, as canvas positions
                  from the source handle to the target handle. Never published
                type: array
                items:
                  type: object
                  additionalProperties: true
          example:
            - id: 503c4f01-e7e0-5a2e-a07d-26e2776fea8f
              sourceNodeId: 4113dfc0-f4be-57f9-8115-6cecd1f1aea3
              sourceHandleId: 7f010dcd-e23d-514c-9206-3609df999026
              targetNodeId: dee6bc70-8103-581e-8b31-6c95cda798a0
              networkId: a8af611d-c68f-54e0-94a5-9176cea64e44
        viewport:
          title: Viewport
          description: >
            the pan (`x`, `y`, in screen pixels) and `zoom` of the canvas when
            the user saved the document
          type: object
          additionalProperties: true
          example:
            x: 0
            y: 0
            zoom: 1
        grid:
          title: Grid
          description: >
            the grid that the canvas draws. Nodes snap to it while the Snap to
            grid setting of the user is on. It tells whether the canvas shows
            the grid, and gives its `size` in pixels, a whole number from 4 to
            200
          type: object
          additionalProperties: true
          example:
            enabled: true
            size: 16
        scenarios:
          title: Scenarios
          description: >
            the names of the Scenario configs on the server that the diagram
            uses. At most 20. Each is a config name of at most 256
            bytes, and no name occurs twice, ignoring case. The document holds
            no scenario content. A publish adds the topology to the `topology`
            annotation of each scenario. An experiment published with the
            topology uses the scenario that the publish request names.
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 256
            pattern: "^[A-Za-z0-9_@.-]+$"
          example:
            - pump-station-ntp
            - pump-station-attack
        source:
          title: Source
          description: >
            the config that the document was generated from, the time of that
            generation, and the warnings that the generation raised
          type: object
          additionalProperties: true
          example:
            kind: topology
            name: pump-station
            apiVersion: phenix.sandia.gov/v1
            importedAt: "2026-10-01T15:04:05Z"
            digest: sha256:1f7f8940e18192505e3ec1f993db7204b6baa8d6c1d9156917a82c663656a1b4
            updatedAt: "2026-09-30T08:00:00Z"
        layout:
          title: Layout
          description: >
            the automatic layout that last set the positions of the document.
            The editor names it in its layout menu. An empty value, or an id
            that the editor does not know, means that no layout set the
            positions
          type: string
          example: elk
        iconSize:
          title: Icon Size
          description: >
            the size of the icons of devices, switches and groups on the
            canvas: small (16 pixels), medium (24) or large (32). A node that
            names its own size uses that size. Empty is small
          type: string
          enum:
            - ""
            - small
            - medium
            - large
          example: large
        layers:
          title: Layers
          description: >
            the layers of the diagram, at most 32. Each has an `id`, an
            integer from 0 to 99 that no other layer has. Each also has a
            `label` of at most 64 bytes that is not blank and has no control
            characters. A layer can also have an icon (`iconKey` or `icon`), a
            `color` and node `matchers`. The matchers put a device that has no
            layer selected in the layer.
            Devices and switches name a layer by its `id`, and the layered
            layout puts a higher `id` nearer the top. The order of the list
            is free. The editor writes it with the highest `id` first. With no
            layers, the editor offers the placeholder layers 0 to 6, labeled
            "Layer 0" to "Layer 6". Never published
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/BuilderLayer"
          example:
            - id: 3
              label: Operations
            - id: 2
              label: Supervisory control
              iconKey: desktop
              color: "#15803d"
              matchers:
                general.hostname: ^(hmi|scada)-
            - id: 1
              label: Field devices
        layerSet:
          title: Layer Set Options
          description: >
            the options of the layer set that the diagram copied its layers
            from. They are its `name`, the `matchConflict` rule (`lowest` or
            `highest`, empty is `lowest`) and `layerOutlines`. They also
            include the `source` set of the server (`id` and `version`) that
            the layers link to. The diagram keeps a
            full copy of the layers, and a change to them changes only that
            copy. The editor offers an update when the linked set has a later
            version. Never published
          allOf:
            - $ref: "#/components/schemas/BuilderDocumentLayerSet"
          example:
            name: Purdue Model
            matchConflict: lowest
            layerOutlines: true
            source:
              id: builtin:purdue
              version: 1
        templates:
          title: Templates
          description: >
            the device templates saved with the diagram, at most 50, which the
            editor offers beside its own. A template copied from the template
            library, a built-in template or a template file names its origin in
            `source`. `source` has the `kind` (`library`, `builtin` or
            `preloaded`), the `id`, and the `version` that the diagram copied.
            It can also have the `digest` of the copy at that time. The editor
            offers to update the copy when the library holds a later version
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: true
          example:
            - id: 0d5f8f4e-6a57-4b53-9d0a-5c0f4e3b2a11
              name: Edge router
              description: VyOS router with one static interface
              device:
                iconKey: router
                spec:
                  type: Router
                  general:
                    hostname: router
              source:
                kind: library
                id: 6a1f0c2e-3b4d-4e5f-8a7b-9c0d1e2f3a4b
                version: 3
                digest: sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
        icons:
          title: Custom Icons
          description: >
            copies of the custom icons that the nodes and templates name, at
            most 50. Each is its base64 PNG data under its icon name. A draft
            on a server carries none (names resolve through the icon library).
            A downloaded document carries every icon that it uses.
          type: object
          maxProperties: 50
          additionalProperties:
            type: object
            additionalProperties: true
          example:
            plc:
              data: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==
    BuilderDocumentMetadata:
      title: Builder Document Metadata
      description: >
        What a Builder document says of itself: its identifier, name and
        description, who made it and who saved it last and when, and its notes.
        It is part of the document's content and digest, and the server writes
        none of it to a config. The server sets `createdBy`, `createdAt`,
        `updatedBy` and `updatedAt` when it stores a draft snapshot (see POST
        /builder/drafts and POST /builder/drafts/{draft}/snapshots). Each is
        optional: a document that was never saved as a draft, such as a Builder
        file written by hand, may have none. GET /schemas/builder/v1 serves its
        complete JSON Schema.
      type: object
      additionalProperties: false
      required:
        - id
      properties:
        id:
          title: Document ID
          description: identifier of the document
          type: string
          example: 49d876d1-571a-5b5c-91b7-aadf5bb5209c
        name:
          title: Name
          description: >
            name of the diagram, which a draft takes as its title: at most 512
            bytes, without control characters
          type: string
          example: Pump station
        description:
          title: Description
          description: free text describing the diagram
          type: string
          example: Water treatment pump station with two PLCs and an HMI.
        createdBy:
          title: Created By
          description: >
            user who first made the document. The server keeps this value
            from the document of the draft create, or else uses the user who
            created the draft. Every later save writes the same value.
          type: string
          maxLength: 256
          example: alice
        createdAt:
          title: Created At
          description: >
            when the document was first made, in UTC to the second
            (`YYYY-MM-DDTHH:MM:SSZ`). The server sets and keeps it as it does
            `createdBy`.
          type: string
          format: date-time
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
          example: "2026-10-01T15:04:05Z"
        updatedBy:
          title: Updated By
          description: >
            user whose save stored this content. The server sets it on every
            save, and replaces a value that the client sends.
          type: string
          maxLength: 256
          example: bob
        updatedAt:
          title: Updated At
          description: >
            the time of that save, in the form of `createdAt`. The server sets
            it on every save, and replaces a value that the client sends. It is
            not `source.updatedAt`, which is a time of the config that the
            document was imported from.
          type: string
          format: date-time
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
          example: "2026-10-02T09:30:00Z"
        notes:
          title: Notes
          description: >
            free text notes about the full diagram, in the order that the
            editor lists them. At most 100 notes. Each note is not only white
            space, and has at most 4096 bytes in UTF-8. The `maxLength` counts
            characters, so the byte limit is stricter outside ASCII. Notes
            have no control characters except newline and tab
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 4096
          example:
            - Snapshot the PLC images before each run.
            - "VLAN EXP carries the control traffic.\nKeep it isolated."
    BuilderDocumentStamp:
      description: >
        The `createdBy`, `createdAt`, `updatedBy` and `updatedAt` of the
        `metadata` of the document that a request stored. The stamp omits a
        field that the stored document does not have. Thus a draft
        opened unchanged from a document that names nobody has an empty
        stamp.
      type: object
      properties:
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time
    BuilderDraftCreate:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
        summary:
          description: summary of the first snapshot
          type: string
        sourceToken:
          description: >
            where the draft comes from. One of:

            - `<kind>/<name>`: the config that the draft was imported from.

            - `uploaded/<kind>/<name>`: an uploaded config. Or
            `uploaded/legacy-xml`: an uploaded legacy Builder diagram that
            came without a Topology. These two name no stored config, so they
            do not let the draft update a stored Topology or Experiment.

            - `builder-doc/<document id>`: the published document that the
            draft was opened from. The caller must be able to read it (404
            otherwise).

            - `builder-file/<topology name>/<digest>`: the Builder file of a
            topology that the draft was opened from, with the `digest` that
            GET /builder/topologies/{topology}/document returned. The caller
            must be able to read the file, and the file must still have that
            digest (409 otherwise)
          type: string
        sourceFile:
          description: >
            the name of the uploaded file that the document came from, kept
            only for display. It is a file name of at most 255 bytes without
            `/` or `\`, not `.` or `..`, with no control characters (422
            otherwise). The server never opens anything by it.
          type: string
          maxLength: 255
        forkOf:
          description: >
            the ID of a draft that the new draft forks. The draft must exist
            (404 otherwise). The new draft takes
            its source token in place of `sourceToken`. It records the last
            publication of that draft as `forked`. Thus a publish of the new
            draft can update what that draft published or was opened from. It
            records no source file: not the file of that draft, and not a
            `sourceFile` sent with it.
          type: string
        document:
          $ref: "#/components/schemas/BuilderDocument"
      required:
        - document
    BuilderSnapshotCreate:
      type: object
      additionalProperties: false
      properties:
        summary:
          type: string
        document:
          $ref: "#/components/schemas/BuilderDocument"
        opId:
          description: >
            the client's id for this save, kept with the snapshot, so a
            client that never saw the response can tell that the server
            stored it
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
      required:
        - document
    BuilderCursorMove:
      description: exactly one of `index` and `snapshotId`
      type: object
      additionalProperties: false
      properties:
        index:
          description: index of the snapshot to move to, oldest first
          type: integer
          minimum: 0
        snapshotId:
          type: string
    BuilderDraft:
      type: object
      properties:
        id:
          type: string
        createdBy:
          description: the user who created the draft
          type: string
        title:
          type: string
        sourceToken:
          type: string
        sourceFile:
          description: >
            for a draft made from an uploaded file, the name of that file
          type: string
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
        lastModifiedBy:
          type: string
        cursor:
          description: index of the current snapshot
          type: integer
        snapshots:
          description: number of snapshots the draft keeps
          type: integer
        snapshotId:
          description: ID of the current snapshot
          type: string
        digest:
          description: digest of the current snapshot's document
          type: string
        size:
          description: size in bytes of the current snapshot's document
          type: integer
        historyBytes:
          description: total size in bytes of the snapshots the draft keeps
          type: integer
        dirty:
          description: whether the current snapshot differs from the last publication
          type: boolean
        canUndo:
          type: boolean
        canRedo:
          type: boolean
        etag:
          description: the value of the ETag header for this revision
          type: string
        document:
          $ref: "#/components/schemas/BuilderDocument"
        stamp:
          description: >
            what the stored document holds in `metadata.createdBy`,
            `createdAt`, `updatedBy` and `updatedAt` (creating a draft and saving one
            only, whose responses have no document). An editor copies it
            into its own copy of the document.
          allOf:
            - $ref: "#/components/schemas/BuilderDocumentStamp"
        history:
          description: the snapshots, oldest first (GET of one draft only)
          type: array
          items:
            $ref: "#/components/schemas/BuilderSnapshot"
        publication:
          $ref: "#/components/schemas/BuilderPublication"
        forked:
          description: >
            for a draft created with `forkOf`, what that draft had last
            published when this draft forked it, which this draft may update
            too
          type: object
          properties:
            documentId:
              type: string
            topologyTarget:
              type: string
            experimentTarget:
              type: string
        experiment:
          description: >
            name of an experiment that this draft published. For a draft
            opened from a published diagram, it can also name an experiment
            that the diagram published. It is present while the experiment
            exists and the caller holds `experiments` `get` for it. The server
            calculates it for each response. Thus it follows a renamed
            experiment, and it is not present when the experiment no longer
            exists. GET of one draft, POST
            /builder/drafts and the `draft` of a publish answer report it. The
            listing never reports it.
          type: string
    BuilderDrafts:
      type: object
      properties:
        drafts:
          description: every draft, the most recently changed first
          type: array
          items:
            $ref: "#/components/schemas/BuilderDraft"
        damaged:
          description: every draft whose metadata this server can no longer read
          type: array
          items:
            $ref: "#/components/schemas/BuilderDamagedDraft"
        limits:
          type: object
          properties:
            drafts:
              description: >
                the most drafts the server holds, damaged drafts included
                (2000). A new draft past it gets 413 and `draft.limit`.
              type: integer
    BuilderCleanup:
      description: >
        What POST /builder/cleanup removed, or with `dryRun` would remove.
      type: object
      properties:
        dryRun:
          type: boolean
        drafts:
          description: the IDs of the published, unchanged drafts
          type: array
          items:
            type: string
        documents:
          description: the published documents that no topology references
          type: integer
        content:
          description: the stored content records that nothing names
          type: integer
    BuilderDamagedDraft:
      description: >
        What this server can still read of a draft whose metadata it can no
        longer read. A caller cannot open it, but can delete it with its ETag.
      type: object
      properties:
        id:
          type: string
        createdBy:
          description: >
            the user who created the draft, present when the server can still
            read it
          type: string
        title:
          description: present when the server can still read it
          type: string
        updated:
          description: present when the server can still read it
          type: string
          format: date-time
        etag:
          description: the If-Match value that deletes the draft
          type: string
    BuilderSnapshot:
      type: object
      properties:
        id:
          type: string
        digest:
          type: string
        size:
          type: integer
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        summary:
          type: string
        opId:
          description: the client's id for the save that stored the snapshot
          type: string
        current:
          type: boolean
    BuilderSnapshots:
      type: object
      properties:
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/BuilderSnapshot"
        cursor:
          type: integer
    BuilderSnapshotDocument:
      type: object
      properties:
        snapshot:
          $ref: "#/components/schemas/BuilderSnapshot"
        document:
          $ref: "#/components/schemas/BuilderDocument"
    BuilderPublication:
      description: the draft's last publication
      type: object
      properties:
        mode:
          type: string
          enum:
            - topology
            - topology-experiment
        topologyTarget:
          type: string
        topologyAction:
          type: string
        experimentTarget:
          type: string
        scenarioTarget:
          type: string
        snapshotId:
          type: string
        digest:
          type: string
        documentId:
          type: string
        publishedAt:
          type: string
          format: date-time
        publishedBy:
          type: string
    BuilderPublishTarget:
      type: object
      additionalProperties: false
      properties:
        name:
          description: config name
          type: string
        action:
          description: create a new config or update an existing one
          type: string
          enum:
            - create
            - update
      required:
        - name
        - action
    BuilderPublishScenario:
      description: >
        the scenario that a `topology-experiment` publication creates or
        updates the experiment with: one of the scenarios that the draft's
        document lists, by name
      type: object
      additionalProperties: false
      properties:
        name:
          description: Scenario config name
          type: string
      required:
        - name
    BuilderPublishRequest:
      description: >
        `topology` mode publishes only the topology. `topology-experiment`
        mode also requires an experiment target. It may name the scenario of
        the experiment, which must be one of the scenarios that the document
        lists. Without one, the experiment has no scenario. In both modes, the
        publish adds the topology to the `topology` annotation of every
        scenario that the document lists.
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
            - topology
            - topology-experiment
        topology:
          $ref: "#/components/schemas/BuilderPublishTarget"
        scenario:
          $ref: "#/components/schemas/BuilderPublishScenario"
        experiment:
          $ref: "#/components/schemas/BuilderPublishTarget"
        dryRun:
          description: >
            make every check of the publication, write nothing, and answer
            with what it would change (`BuilderPublishPreview`). A dry run
            needs no If-Match.
          type: boolean
          default: false
      required:
        - mode
        - topology
    BuilderPublishPreview:
      description: >
        the answer of a dry run of a publication: what it would change, the
        warnings it would give, and the refusal that it would get. A dry run
        writes nothing.
      type: object
      properties:
        status:
          type: string
          enum:
            - preview
        changes:
          description: >
            what a publish would change, compared with what the server stores
            now. Null when the server would refuse the publication
          nullable: true
          allOf:
            - $ref: "#/components/schemas/BuilderPublishChanges"
        warnings:
          description: >
            what the publication would warn of, each with its code. This
            includes the warnings about how the diagram configures its devices
            and networks (see BuilderPublishResult)
          type: array
          items:
            $ref: "#/components/schemas/BuilderIssue"
        errors:
          description: >
            why the server would refuse the publication, each an error with
            its code.
            These are the refusals that a publish answers with 400 (a target
            name), 409 or 422, such as `publish.topology.exists`,
            `publish.scenario.missing`, or the issues of `publish.blocked`.
            Refusals about who may do what (403, and 404 for a draft that the
            caller may not see) keep their status.
          type: array
          items:
            $ref: "#/components/schemas/BuilderIssue"
    BuilderPublishChanges:
      description: >
        what publishing a draft to a target changes, compared with what the
        server stores now. The server sorts every list by name.
      type: object
      properties:
        topology:
          $ref: "#/components/schemas/BuilderConfigChange"
        includes:
          description: the topologies the Topology config includes (`spec.includeTopologies`)
          type: array
          items:
            $ref: "#/components/schemas/BuilderIncludeChange"
        scenarios:
          description: >
            the Scenario configs the document lists, each of which gets the
            topology in its `topology` annotation unless it names it already
          type: array
          items:
            $ref: "#/components/schemas/BuilderScenarioAnnotation"
        images:
          description: >
            the disk images the devices of the stored topology use, compared
            with those the published topology's devices use
            (`hardware.drives[].image`)
          type: array
          items:
            $ref: "#/components/schemas/BuilderImageChange"
        experiment:
          description: the Experiment config, for a `topology-experiment` publication only
          allOf:
            - $ref: "#/components/schemas/BuilderConfigChange"
        vlanAliases:
          description: >
            the VLAN aliases of the experiment (`spec.vlans.aliases`), each
            added when the publication creates the experiment. For a
            `topology-experiment`
            publication only. Not present when there is none
          type: array
          items:
            $ref: "#/components/schemas/BuilderVLANAliasChange"
        removedHostPins:
          description: >
            the host pins (`spec.schedules`) that an update of the experiment
            removes, because their VMs are no longer in the topology, sorted
            by hostname. The warning `publish.experiment.pins-removed` names
            them too. Not present when there is none, or when the caller may not
            get the experiment's schedule (`experiments/schedule` `get`): the
            warning then gives only their number
          type: array
          items:
            $ref: "#/components/schemas/BuilderHostPin"
    BuilderConfigChange:
      type: object
      properties:
        name:
          type: string
        action:
          description: >
            `create`, `update`, or `unchanged` when the config already holds
            this publication, so the publication writes nothing to it
          type: string
          enum:
            - create
            - update
            - unchanged
    BuilderIncludeChange:
      type: object
      properties:
        name:
          description: included topology
          type: string
        change:
          type: string
          enum:
            - added
            - removed
            - kept
    BuilderScenarioAnnotation:
      type: object
      properties:
        name:
          description: Scenario config name
          type: string
        change:
          description: >
            `annotate` adds the topology to the `topology` annotation of the
            scenario. `unchanged` names a scenario that already names it
          type: string
          enum:
            - annotate
            - unchanged
    BuilderImageChange:
      type: object
      properties:
        name:
          description: the image as the drives name it
          type: string
        change:
          type: string
          enum:
            - added
            - removed
            - kept
        devices:
          description: >
            the hostnames of the devices that use the image once published,
            or, for a removed image, of those that used it
          type: array
          items:
            type: string
        onServer:
          description: >
            whether the server has a disk image of that file name, as GET
            /disks lists them. Null when unknown, for one of these causes. The
            caller may not list disks or that file name (whether or not the
            server has it). Or the listing failed, is empty (as it is without
            minimega) or did not end within 10 seconds
          type: boolean
          nullable: true
    BuilderVLANAliasChange:
      type: object
      properties:
        name:
          description: network name
          type: string
        from:
          description: the experiment's alias now, null for none
          type: integer
          nullable: true
        to:
          description: the alias the publication writes, null for none
          type: integer
          nullable: true
        change:
          type: string
          enum:
            - added
            - removed
            - changed
            - kept
    BuilderHostPin:
      description: >
        the host pin of a VM: an entry of the experiment's `spec.schedules`.
        A pin names a node when its hostname is the node's hostname exactly,
        case included
      type: object
      properties:
        hostname:
          description: the VM's hostname
          type: string
        host:
          description: the cluster host that the pin assigns the VM to
          type: string
        renamedTo:
          description: >
            the device's new hostname, when the diagram renamed the device.
            Not present otherwise
          type: string
    BuilderPublishStage:
      type: object
      properties:
        name:
          description: document, topology, scenario, experiment or draft
          type: string
        status:
          description: created, updated, skipped, ok or failed
          type: string
        message:
          type: string
        config:
          description: >
            the config the stage wrote, as `<Kind>/<name>`. The scenario
            stage, which covers every scenario the document lists, names one
            only when the document lists one, and its message says which it
            changed.
          type: string
    BuilderPublishResult:
      type: object
      properties:
        status:
          type: string
          enum:
            - succeeded
            - partial
        stages:
          type: array
          items:
            $ref: "#/components/schemas/BuilderPublishStage"
        warnings:
          description: >
            what the caller should know of the publication, each with its
            code. Examples are `publish.file.unchanged`,
            `publish.legacy.replaced` and `publish.experiment.pins-removed`
            (see removedHostPins). Another example is
            `publish.retry.available` on a partial publication that the same
            request finishes. They also hold the warnings about how the
            diagram configures its devices and networks, which the editor's
            Diagram checks give too. These are `device.rulesets.ignored`,
            `interface.ruleset.unknown`, `interface.ip.outside-subnet`,
            `network.gateway.unowned` and `network.subnet.overlap`. They also
            include the device settings that phenix's apps do not apply as
            drawn, such as `device.router-os.unsupported` or
            `device.ntp-server.ignored` (see the Builder's error codes)
          type: array
          items:
            $ref: "#/components/schemas/BuilderIssue"
        errors:
          description: >
            why a stage of a partial publication failed, each with its code:
            `publish.stage.failed` or `publish.experiment.running`
          type: array
          items:
            $ref: "#/components/schemas/BuilderIssue"
        topology:
          $ref: "#/components/schemas/BuilderPublishTarget"
        scenario:
          $ref: "#/components/schemas/BuilderPublishScenario"
        experiment:
          $ref: "#/components/schemas/BuilderPublishTarget"
        removedHostPins:
          description: >
            the host pins (`spec.schedules`) that the update of the experiment
            removed, because their VMs are no longer in the topology, sorted
            by hostname. Not present when there is none, or when the caller may
            not get the experiment's schedule (`experiments/schedule` `get`).
            The warning `publish.experiment.pins-removed` names them, or gives
            only their number to such a caller
          type: array
          items:
            $ref: "#/components/schemas/BuilderHostPin"
        draft:
          $ref: "#/components/schemas/BuilderDraft"
    BuilderSource:
      type: object
      properties:
        kind:
          type: string
        name:
          type: string
        fullName:
          type: string
        apiVersion:
          type: string
        created:
          type: string
        updated:
          type: string
        digest:
          description: >
            for a Topology or an Experiment, the digest that a document
            imported from it records as its `source.digest`. The digest covers
            the apiVersion, kind, name and spec of the config, and the
            `builder-xml` diagram of a Topology that has one. Not present for a
            Scenario or an Image
          type: string
        stored:
          description: false for a config generated from uploaded content
          type: boolean
        builder:
          description: >
            the builder annotation the config carries, if any: `builder-doc`
            (Builder) or, on a Topology without it, `builder-xml` (legacy
            Builder diagram)
          type: string
        generatable:
          description: whether POST /builder/generate accepts this config
          type: boolean
        includeCount:
          description: >
            the number of topologies a Topology includes
            (`includeTopologies`). Not present when it includes none, and for
            every other kind. Also not present for a caller without `configs`
            `get` for the config, and in the `source` of a generated document.
          type: integer
          minimum: 1
    BuilderSources:
      type: object
      properties:
        topologies:
          type: array
          items:
            $ref: "#/components/schemas/BuilderSource"
        experiments:
          type: array
          items:
            $ref: "#/components/schemas/BuilderSource"
        scenarios:
          type: array
          items:
            $ref: "#/components/schemas/BuilderSource"
        images:
          type: array
          items:
            $ref: "#/components/schemas/BuilderSource"
    BuilderGenerateRequest:
      description: exactly one of `source` and `content`
      type: object
      additionalProperties: false
      properties:
        source:
          description: a stored Topology or Experiment config, as `<Kind>/<name>`
          type: string
        content:
          description: a Topology or Experiment config as JSON or YAML text
          type: string
        includes:
          description: >
            what happens to the nodes of the topologies that a Topology
            includes. `keep` (the default, also when not present or empty)
            shows them read only. `combine` copies them into the document and
            makes it a new topology. The server refuses `combine` for an
            Experiment.
          type: string
          enum:
            - keep
            - combine
        copy:
          description: >
            make the document a copy that is not linked to the Topology that
            it is generated from. `includes` `combine` implies it. The copy gets
            the diagram note `Copied from <name>` in `metadata.notes`, where
            `<name>` is the name in the metadata of the source config. The
            server refuses it for an Experiment.
          type: boolean
          default: false
        name:
          description: >
            the name of the new topology, and of the document. The server
            accepts it only with `copy` or `includes` `combine`. When empty,
            the source's name with `-combined` (for `combine`) or `-copy`
            added. It must not be the name of the stored Topology that the
            request imports.
          type: string
          maxLength: 512
          pattern: "^[A-Za-z0-9_@.-]*$"
    BuilderGenerateResult:
      type: object
      properties:
        document:
          $ref: "#/components/schemas/BuilderDocument"
        warnings:
          description: what the document omitted or changed
          type: array
          items:
            type: string
        source:
          description: >
            the config the document was made from. POST /builder/legacy
            omits it for a diagram that came without a Topology.
          allOf:
            - $ref: "#/components/schemas/BuilderSource"
    BuilderLegacyRequest:
      type: object
      additionalProperties: false
      required:
        - content
      properties:
        content:
          description: >
            the text of a legacy Builder diagram file: mxGraph XML, or a
            Topology config as YAML or JSON that has the `builder-xml`
            annotation. At most 5242880 bytes
          type: string
        name:
          description: >
            the name of the document of a diagram that comes without a
            Topology (`legacy-diagram` when not present or blank). At most 512
            bytes, without control characters. The server ignores it for a
            Topology, which uses its own name.
          type: string
    BuilderTopologyExportRequest:
      type: object
      additionalProperties: false
      properties:
        document:
          $ref: "#/components/schemas/BuilderDocument"
        name:
          description: >
            the name of the topology. When empty, the server uses the document
            name, as the Publish dialog proposes it. The name then has `-` in
            place of each run of characters that a config name may not hold.
            If that
            leaves no characters, the name is `topology`
          type: string
      required:
        - document
    BuilderTopologyExport:
      type: object
      properties:
        name:
          description: the topology's name
          type: string
        yaml:
          description: >
            the Topology config, as YAML that loads back as the config. The
            server writes a string that the YAML block style would change,
            such as one that starts with a line break, in double quotes
          type: string
        warnings:
          description: >
            what the projection omitted or changed, and the warnings about
            how the diagram configures its devices and networks (see
            BuilderPublishResult), each with its code
          type: array
          items:
            $ref: "#/components/schemas/BuilderIssue"
        publishBlockers:
          description: >
            why the server would refuse a publish of the topology, although
            the phenix config validation accepts it. There is one issue per
            check, in the order that a publish makes the checks. First come
            interfaces without a VLAN, then addresses that interfaces share.
            Then come hostnames that phenix refuses when it creates an
            experiment, then device settings that make the experiment fail to
            start. The 422 message of a publish
            names the first. Each issue says what that message says about its
            check, and has the code of the first problem of the check. When the
            check has one problem, the issue also has its location.
          type: array
          items:
            $ref: "#/components/schemas/BuilderIssue"
    BuilderPackageRequest:
      type: object
      additionalProperties: false
      properties:
        document:
          $ref: "#/components/schemas/BuilderDocument"
        include:
          description: >
            the sections that the package carries, each at most once.
            `scenarios` holds the Scenario configs that the document names.
            `topologies` holds the topologies that it includes. `icons` holds
            a copy of each custom icon that it names. `images` lists in the
            requirements the disk images that the devices use, with the hosts
            that use each image
          type: array
          items:
            type: string
            enum:
              - scenarios
              - topologies
              - icons
              - images
      required:
        - document
    BuilderPackageResult:
      type: object
      properties:
        package:
          description: >
            the package, as `GET /schemas/builder/package/v1` describes it,
            ready for a client to save as a JSON or YAML file
          type: object
          additionalProperties: true
        warnings:
          description: >
            what the package names but does not carry, or omits from its
            requirements, and why, each with its code
          type: array
          items:
            $ref: "#/components/schemas/BuilderIssue"
    BuilderPackageDependencies:
      type: object
      properties:
        dependencies:
          description: >
            one entry per entry of the package's requirements, by kind in the
            order scenario, topology, template, icon, image, app, file
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                  - scenario
                  - topology
                  - template
                  - icon
                  - image
                  - app
                  - file
              name:
                description: the name or path, as the requirements give it
                type: string
              status:
                type: string
                enum:
                  - present
                  - missing
                  - different
                  - unknown
              packaged:
                description: whether the package carries it
                type: boolean
              detail:
                description: >
                  why the status is what it is, such as the devices that use
                  a disk image, when that needs saying
                type: string
    BuilderPreflightCheckName:
      description: a preflight check
      type: string
      enum:
        - capacity
        - network
        - disks
        - apps
    BuilderPreflightRequest:
      type: object
      additionalProperties: false
      properties:
        checks:
          description: the checks to make, in the order of the report. Each at most once
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/BuilderPreflightCheckName"
          example:
            - disks
            - apps
        experiment:
          description: >
            the experiment whose VLAN range and default bridge the network
            check uses. Empty or not present for none
          type: string
          example: lab-exp
      required:
        - checks
    BuilderPreflightResult:
      type: object
      properties:
        name:
          $ref: "#/components/schemas/BuilderPreflightCheckName"
        status:
          description: >
            `failed` when an issue is an error. `unavailable` when nothing
            failed, but the server could not make the check, or a part of it.
            Otherwise `passed`, with any warnings among the issues
          type: string
          enum:
            - passed
            - failed
            - unavailable
        summary:
          description: what the check compared, in one line, and what it could not check
          type: string
          example: "Found: 3 of 3 drive images, among the server's 12 disk images."
        issues:
          description: >
            what the check found, each with its `preflight.` code and, when it
            is about one, the device, network and field
          type: array
          items:
            $ref: "#/components/schemas/BuilderIssue"
    BuilderPreflightReport:
      type: object
      properties:
        checks:
          description: the result of each check asked for, in the request's order
          type: array
          items:
            $ref: "#/components/schemas/BuilderPreflightResult"
        passed:
          description: the checks that passed, in the request's order
          type: array
          items:
            $ref: "#/components/schemas/BuilderPreflightCheckName"
        failed:
          description: the checks that failed, in the request's order
          type: array
          items:
            $ref: "#/components/schemas/BuilderPreflightCheckName"
        unavailable:
          description: the checks that the server could not make, in the request's order
          type: array
          items:
            $ref: "#/components/schemas/BuilderPreflightCheckName"
    BuilderPublishedDocument:
      description: >
        The Builder document that a config references. It is a stored
        published document that Publish stored (`source` `store`). Or it is
        the Builder file that a topology's `builder-doc` annotation names
        (`source` `file`). A file has no `id`,
        `draftId`, `snapshotId`, `createdAt` or `createdBy`. In a listing a
        file also has no `digest` and no `size`, since a listing reads no
        file.
      type: object
      properties:
        source:
          description: where the server keeps the document
          type: string
          enum:
            - store
            - file
        id:
          description: stored documents only
          type: string
        digest:
          description: digest of the document's canonical JSON, not of a file's bytes
          type: string
        size:
          description: size of the document's canonical JSON, in bytes
          type: integer
        target:
          description: name of the config that references the document
          type: string
        kind:
          type: string
        config:
          description: the config that references the document, as `<Kind>/<name>`
          type: string
        path:
          description: files only. The path of the Builder file on the phenix server
          type: string
        draftId:
          description: >
            stored documents only. The draft that first published the
            document.
          type: string
        snapshotId:
          description: >
            stored documents only. The snapshot of that draft. Absent with
            `draftId`.
          type: string
        createdAt:
          description: stored documents only. The time of the first publish of the document
          type: string
          format: date-time
        createdBy:
          description: >
            stored documents only. The user who first published the document.
          type: string
        etag:
          description: >
            stored documents only. The entity tag that DELETE
            /builder/documents/{document} must name in If-Match. It covers the
            document and all that the topology holds, so a publish or any
            other change of the topology gives a new one.
          type: string
        topologyDiffers:
          description: >
            files only, in GET /builder/topologies/{topology}/document. True
            when the stored topology is not what the document publishes. Then
            a draft opened from the file cannot update the topology
          type: boolean
        experiment:
          description: >
            name of an experiment that the publication of this document made,
            when it still exists and the caller holds `experiments` `get` for
            it. Only on rows of GET /builder/documents with `source` `store`.
          type: string
        document:
          $ref: "#/components/schemas/BuilderDocument"
      required:
        - source
        - target
        - kind
        - config
    BuilderPublishedDocuments:
      type: object
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/BuilderPublishedDocument"
    BuilderIconUpload:
      type: object
      additionalProperties: false
      required:
        - name
        - data
      properties:
        name:
          description: >
            the icon's name: 1 to 64 letters, digits, `_`, `@`, `.` and `-`,
            not `.` or `..`. No icon and no alias has it, ignoring case.
            Nodes and templates name the icon by it.
          type: string
          pattern: "^[A-Za-z0-9_@.-]{1,64}$"
        data:
          description: >
            a PNG of at most 96 by 96 pixels and 65536 bytes, in standard
            base64 with padding and without line breaks
          type: string
    BuilderIconRename:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          description: >
            the new name of the icon, by the rules for the name of a new icon.
            The old name becomes an alias
          type: string
          pattern: "^[A-Za-z0-9_@.-]{1,64}$"
    BuilderIconSummary:
      description: >
        an icon of the library without its image, as the list gives it
      type: object
      properties:
        name:
          description: >
            the icon's name now. It is the key of the icon in a Builder
            document's `icons`, and what a node's or template's `icon` names.
          type: string
        id:
          description: >
            `sha256:` and the SHA-256 of the stored PNG, as 64 lowercase hex
            digits: two icons hold the same image exactly when their IDs are
            equal.
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        owner:
          description: >
            the user who uploaded the icon. Empty for an icon that phenix
            added from a template file of its template directory, which no
            user owns, renames or deletes
          type: string
        width:
          description: width in pixels, 1 to 96
          type: integer
        height:
          description: height in pixels, 1 to 96
          type: integer
        bytes:
          description: length of the stored PNG, at most 40960
          type: integer
        created:
          description: when the icon was uploaded
          type: string
          format: date-time
        updated:
          description: when the icon was last renamed, or uploaded
          type: string
          format: date-time
        createdBy:
          description: >
            the user who uploaded the icon. Not present for an icon that phenix
            added from a template file
          type: string
        updatedBy:
          description: >
            the user who last renamed the icon, or uploaded it. Not present for
            an icon that phenix added from a template file
          type: string
        aliases:
          description: >
            the names the icon had before its renames, oldest first, each of
            which still names it
          type: array
          items:
            type: string
        canRename:
          description: >
            whether a caller may rename the icon: false only for an icon that
            phenix
            added from a template file
          type: boolean
        canDelete:
          description: >
            whether a caller may delete the icon: false only for an icon that
            phenix
            added from a template file
          type: boolean
        revision:
          description: >
            the revision of the icon's record. Each rename gives the icon a
            new one
          type: integer
        etag:
          description: >
            the entity tag of the revision, `"<revision>"`, which DELETE
            /builder/icons/{icon} must name in If-Match
          type: string
    BuilderIcon:
      description: an icon of the library with its image
      allOf:
        - $ref: "#/components/schemas/BuilderIconSummary"
        - type: object
          properties:
            data:
              description: >
                the stored PNG in standard base64 with padding, which may
                differ from what the client sent
              type: string
    BuilderIconList:
      type: object
      properties:
        icons:
          description: >
            every icon of the library, sorted by name without regard to case,
            without its image
          type: array
          items:
            $ref: "#/components/schemas/BuilderIconSummary"
        maxIcons:
          description: the most icons the library holds, of all users together
          type: integer
        etag:
          description: >
            the entity tag of the list, as the ETag header gives it. A request
            that names it in If-None-Match gets 304 while the list is the same
          type: string
    BuilderLayer:
      type: object
      description: >
        a layer of a diagram or of a layer set. The rules are those of
        `GET /schemas/builder/v1` (`$defs.layer`)
      additionalProperties: false
      required:
        - id
        - label
      properties:
        id:
          description: an integer from 0 to 99 that no other layer of the list has
          type: integer
          minimum: 0
          maximum: 99
        label:
          description: not blank, at most 64 bytes, with no control characters
          type: string
          minLength: 1
          maxLength: 64
        iconKey:
          description: >
            a built-in icon that the editor shows to the left of the label.
            Empty or not present for none
          type: string
        icon:
          description: >
            a custom icon name that the editor shows in place of `iconKey`.
            Empty or not present for none
          type: string
        color:
          description: >
            the color of the layer, `#rrggbb`. The editor shows the label in
            this color when the contrast is sufficient. It draws node outlines
            in this color when the layer set option `layerOutlines` is true
          type: string
          pattern: "^(#[0-9a-fA-F]{6})?$"
        matchers:
          description: >
            at most 16 node matchers. Each key is a path of keys joined by dots
            into the spec of a device (at most 128 bytes, such as
            `general.hostname` or `network.interfaces.0.vlan`). Each value is a
            regular expression of 1 to 256 bytes. It must compile in Go (RE2)
            and in JavaScript. It must not repeat a group that has a repeat or
            a `|` in it more than once, such as `(a+)+`. It must have at most
            3 `*`, `+` or `{n,}` repeats. The editor
            puts a device that has no layer selected in a layer whose matcher
            matches it
          type: object
          maxProperties: 16
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 256
    BuilderDocumentLayerSet:
      type: object
      description: >
        the options of the layer set that a diagram copied its layers from.
        It also names the layer set of the server that the layers link to
      additionalProperties: false
      properties:
        name:
          description: >
            the name of the layer set, at most 128 bytes. Empty for layers that
            no layer set gave
          type: string
          maxLength: 128
        matchConflict:
          description: >
            the layer that a device gets when the node matchers of more than
            one layer match it. Empty is `lowest`
          type: string
          enum:
            - ""
            - lowest
            - highest
        layerOutlines:
          description: >
            when true, the editor draws the outline of a node in the color of
            its layer, unless the node has its own outline color
          type: boolean
        source:
          description: >
            the layer set and the version that the layers were last copied
            from or saved to. Not present when the layers link to no set
          type: object
          additionalProperties: false
          required:
            - id
            - version
          properties:
            id:
              type: string
              pattern: "^[A-Za-z0-9_.:-]{1,128}$"
            version:
              type: integer
              minimum: 1
    BuilderLayerSetContent:
      type: object
      description: >
        the content of a layer set, as a request adds or replaces one. A
        layer set file holds the same fields, with `$schema` and `icons`
        (`GET /schemas/builder/layersets/v1`). The server refuses unknown
        fields
      additionalProperties: false
      required:
        - name
        - layers
      properties:
        name:
          description: not blank, at most 128 bytes, with no control characters
          type: string
          minLength: 1
          maxLength: 128
          example: Plant levels
        description:
          description: at most 1024 bytes, with no control characters
          type: string
          maxLength: 1024
          example: Levels of the water plant network.
        iconKey:
          description: the built-in icon of the set. Empty for none
          type: string
          example: plc
        icon:
          description: a custom icon name, shown in place of `iconKey`. Empty for none
          type: string
        matchConflict:
          description: >
            the layer that a device gets when the node matchers of more than
            one layer match it: the lowest ID or the highest ID. Empty is
            `lowest`
          type: string
          enum:
            - ""
            - lowest
            - highest
          example: lowest
        layerOutlines:
          description: >
            when true, the editor draws the outline of a node in the color of
            its layer, unless the node has its own outline color
          type: boolean
          example: false
        layers:
          description: 1 to 32 layers, each with an ID that no other layer has
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: "#/components/schemas/BuilderLayer"
          example:
            - id: 2
              label: Supervisory control
              iconKey: desktop
              color: "#15803d"
              matchers:
                general.hostname: ^(hmi|scada)-
            - id: 1
              label: Field devices
    BuilderLayerSet:
      type: object
      properties:
        id:
          description: >
            the ID of the set. A built-in set has an ID that starts with
            `builtin:`. All other IDs come from the server
          type: string
          example: builtin:purdue
        name:
          type: string
        description:
          type: string
        iconKey:
          type: string
        icon:
          type: string
        matchConflict:
          description: "`lowest` or `highest`. Never empty"
          type: string
          enum:
            - lowest
            - highest
        layerOutlines:
          type: boolean
        layers:
          type: array
          items:
            $ref: "#/components/schemas/BuilderLayer"
        builtin:
          description: >
            true for a set that every server has. Nobody can change or delete
            it. Duplicate it to change it
          type: boolean
        version:
          description: >
            starts at 1 and grows by one with every change of the content.
            Always 1 for a built-in set
          type: integer
        etag:
          description: the entity tag of the content, `"<version>"`, for If-Match
          type: string
        created:
          description: not present for a built-in set
          type: string
          format: date-time
        updated:
          description: when the content last changed. Not present for a built-in set
          type: string
          format: date-time
        createdBy:
          description: the user who added the set. Not present for a built-in set
          type: string
        updatedBy:
          description: >
            the user who last changed the content. Not present for a built-in set
          type: string
    BuilderLayerSetList:
      type: object
      properties:
        layerSets:
          type: array
          items:
            $ref: "#/components/schemas/BuilderLayerSet"
        defaultId:
          description: the default set of the server for new diagrams, or null
          type: string
          nullable: true
        defaultEtag:
          description: >
            the entity tag of the default selection, which PUT
            /builder/layersets/default names in If-Match
          type: string
          example: '"0"'
        damaged:
          description: >
            how many records the server cannot read. The list does not show them
          type: integer
        limits:
          $ref: "#/components/schemas/BuilderLayerSetLimits"
    BuilderLayerSetLimits:
      type: object
      description: what the library and one set may hold
      properties:
        layerSets:
          description: the most sets the library holds, apart from the built-in sets
          type: integer
          example: 200
        layers:
          type: integer
          example: 32
        nameBytes:
          type: integer
          example: 128
        descriptionBytes:
          type: integer
          example: 1024
        labelBytes:
          type: integer
          example: 64
        matchers:
          description: the most node matchers of one layer
          type: integer
          example: 16
        matcherPathBytes:
          type: integer
          example: 128
        patternBytes:
          type: integer
          example: 256
    BuilderLayerSetDefault:
      type: object
      additionalProperties: false
      properties:
        id:
          description: the ID of a layer set, or null for none
          type: string
          nullable: true
          example: builtin:purdue
    BuilderLayerSetDefaultSelection:
      type: object
      properties:
        id:
          description: the ID of a layer set, or null for none
          type: string
          nullable: true
          example: builtin:purdue
        etag:
          description: >
            the entity tag of the selection: `"<revision>"` of its record, or
            `"0"` when the server never stored a selection
          type: string
          example: '"0"'
    BuilderTemplateDevice:
      description: >
        What a template sets: every field of a device node except its
        hostname, its connection points and where it was included from. The
        editor names a device made from the template after
        `spec.general.hostname`, and makes that name unique in the diagram.
      type: object
      required:
        - spec
      properties:
        iconKey:
          description: one of the Builder's icon keys
          type: string
        icon:
          description: >
            the name of a custom icon of the icon library, drawn in place of
            `iconKey` while the library has an icon of that name
          type: string
          pattern: "^[A-Za-z0-9_@.-]{1,64}$"
        iconSize:
          description: >
            the size of the icon of a device made from the template, on the
            canvas: small (16 pixels), medium (24) or large (32). Empty uses
            the `iconSize` of the diagram
          type: string
          enum:
            - ""
            - small
            - medium
            - large
        outlineColor:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        fillColor:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        hideDescription:
          description: >
            true hides the description of a device made from the template on
            the canvas
          type: boolean
        layer:
          description: >
            the ID of the layer of a device made from the template, an
            integer from 0 to 99. A diagram need not define the layer.
          type: integer
          minimum: 0
          maximum: 99
        spec:
          description: >
            a complete phenix node spec, as a device node holds it. At most
            16384 bytes as JSON together with the other fields. It must have a
            `general.hostname` with no white space. The
            server does not check it against the phenix node schema.
          type: object
          additionalProperties: true
    BuilderTemplate:
      type: object
      properties:
        id:
          description: >
            unique among the templates of its source. A template of the
            library has a UUID. The built-in templates have short names. A
            template that the server read from a template file has an ID that
            starts with `server-`. The ID comes from the file name and the
            template name, and is the same at every start.
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
        source:
          description: >
            `library` for a template of the template library of the server.
            `builtin` for a built-in template. `preloaded` for a template that
            the server read from a template file. A diagram's copy of the
            template names this value as its `source.kind`
          type: string
          enum:
            - library
            - builtin
            - preloaded
        name:
          type: string
        description:
          description: >
            the text of the template, which the editor shows where it lists
            templates. The editor never writes it into a node
          type: string
        device:
          $ref: "#/components/schemas/BuilderTemplateDevice"
        version:
          description: >
            starts at 1 and grows by one with every change of the name, the
            description or the device. Always 1 for a read-only template
          type: integer
        etag:
          description: the entity tag of the content, `"<version>"`, for If-Match
          type: string
        created:
          description: not present for a read-only template
          type: string
          format: date-time
        updated:
          description: when the content last changed. Not present for a read-only template
          type: string
          format: date-time
        createdBy:
          description: the user who added the template. Not present for a read-only template
          type: string
        updatedBy:
          description: >
            the user who last changed the name, the description or the device.
            Not present for a read-only template
          type: string
        collections:
          description: the IDs of the collections of the same source that hold the template
          type: array
          items:
            type: string
    BuilderTemplateCollection:
      type: object
      properties:
        id:
          description: >
            unique among the collections of the library. For a collection that
            the server read from a template file, `server-` and a digest of
            the file name
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
        source:
          description: >
            `library` for a collection of the template library of the server.
            `preloaded` for a collection that the server read from a template
            file
          type: string
          enum:
            - library
            - preloaded
        name:
          type: string
        description:
          type: string
        templateIds:
          description: the templates of the collection, in the order given
          type: array
          items:
            type: string
        version:
          description: >
            starts at 1. Increases by one with every change of the name, the
            description or the templates, also when a caller deletes a
            template of the collection
          type: integer
        etag:
          description: the entity tag of the content, `"<version>"`, for If-Match
          type: string
        created:
          description: not present for a collection from a template file
          type: string
          format: date-time
        updated:
          description: when the content last changed
          type: string
          format: date-time
        createdBy:
          description: the user who added the collection. Not present for a collection from a template file
          type: string
        updatedBy:
          description: >
            the user who last changed the name, the description or the
            templates. Not present for a collection from a template file
          type: string
    BuilderTemplateLibrary:
      type: object
      properties:
        templates:
          description: the templates of the library, in the order that callers added them
          type: array
          items:
            $ref: "#/components/schemas/BuilderTemplate"
        collections:
          description: >
            the collections of the library, in the order that callers added
            them.
            Every ID in a collection's `templateIds` is in `templates`
          type: array
          items:
            $ref: "#/components/schemas/BuilderTemplateCollection"
        builtins:
          description: the built-in templates, read only, in no collection
          type: array
          items:
            $ref: "#/components/schemas/BuilderTemplate"
        preloaded:
          description: >
            the collections that the server read from its template files at
            start, in the order of the file names, each with its templates.
            Read only
          type: array
          items:
            type: object
            properties:
              collection:
                $ref: "#/components/schemas/BuilderTemplateCollection"
              templates:
                type: array
                items:
                  $ref: "#/components/schemas/BuilderTemplate"
        damaged:
          description: >
            this server cannot read the library record, so the response lists
            none of its items
          type: boolean
        limits:
          type: object
          properties:
            templates:
              description: the most templates the library holds
              type: integer
            collections:
              description: the most collections the library holds
              type: integer
            nameBytes:
              description: the most bytes a template or collection name has
              type: integer
            descriptionBytes:
              description: the most bytes a description has
              type: integer
            deviceBytes:
              description: the most bytes a template's `device` takes as JSON
              type: integer
    BuilderTemplateContent:
      type: object
      additionalProperties: false
      required:
        - name
        - device
      properties:
        name:
          description: 1 to 128 bytes, not blank, without control characters
          type: string
        description:
          description: at most 1024 bytes, without control characters
          type: string
        device:
          $ref: "#/components/schemas/BuilderTemplateDevice"
    BuilderTemplateCreate:
      type: object
      additionalProperties: false
      required:
        - templates
      properties:
        templates:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required:
              - name
              - device
            properties:
              name:
                description: 1 to 128 bytes, not blank, without control characters
                type: string
              description:
                description: at most 1024 bytes, without control characters
                type: string
              device:
                $ref: "#/components/schemas/BuilderTemplateDevice"
        collection:
          description: a new collection to hold exactly the new templates
          type: object
          additionalProperties: false
          required:
            - name
          properties:
            name:
              type: string
            description:
              type: string
    BuilderTemplateCreateResult:
      type: object
      properties:
        created:
          description: the new templates, in the order of the request
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              etag:
                type: string
        collection:
          description: the new collection, when the request asked for one
          type: object
          properties:
            id:
              type: string
            etag:
              type: string
    BuilderTemplateCollectionContent:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          description: 1 to 128 bytes, not blank, without control characters
          type: string
        description:
          description: at most 1024 bytes, without control characters
          type: string
        templateIds:
          description: templates of the library, each named once
          type: array
          maxItems: 200
          items:
            type: string
    BuilderTemplateSelection:
      description: at least one item in all
      type: object
      additionalProperties: false
      properties:
        templates:
          type: array
          items:
            $ref: "#/components/schemas/BuilderTemplateRef"
        collections:
          type: array
          items:
            $ref: "#/components/schemas/BuilderTemplateRef"
    BuilderTemplateRef:
      description: a template or a collection, with the entity tag of its content
      type: object
      additionalProperties: false
      required:
        - id
        - etag
      properties:
        id:
          type: string
        etag:
          description: >
            the `etag` of the item as the caller read it: one strong, quoted
            entity tag, such as `"3"`
          type: string
    BuilderTemplateDeleteResult:
      type: object
      properties:
        deleted:
          type: object
          properties:
            templates:
              type: integer
            collections:
              type: integer
    Workflow:
      type: object
      title: Workflow
      description: >-
        A phenix workflow config: what applying a workflow branch creates,
        updates or restarts one experiment from.
      additionalProperties: false
      required:
        - apiVersion
        - kind
        - spec
      properties:
        apiVersion:
          type: string
          title: API Version
          description: The config API version; a workflow config is phenix.sandia.gov/v0.
          enum:
            - phenix.sandia.gov/v0
        kind:
          type: string
          title: Kind
          description: The config kind, which is always Workflow.
          enum:
            - Workflow
        metadata:
          type: object
          title: Metadata
          description: >-
            Not read by the server; it is accepted so a workflow config has the
            same four top-level keys as every other phenix config, and so a later
            version can carry a name or annotations without a breaking change.
          nullable: true
        spec:
          type: object
          title: Workflow Spec
          description: >-
            What an apply may do and the experiment settings it sets; an empty
            spec applies every default.
          additionalProperties: false
          properties:
            auto:
              type: object
              title: Auto
              description: What an apply may do to the experiment mapped to the workflow branch without being asked.
              nullable: true
              additionalProperties: false
              properties:
                create:
                  type: string
                  title: Create
                  description: >-
                    The name of the experiment to create when none is mapped to
                    the branch; unset never creates one.
                  nullable: true
                update:
                  type: boolean
                  title: Update
                  description: >-
                    Whether an apply may update the experiment already mapped to
                    the branch; defaults to true when unset.
                  nullable: true
                restart:
                  type: boolean
                  title: Restart
                  description: >-
                    Whether an apply may start a new or updated experiment and
                    stop and restart a running one; defaults to true when unset.
                  nullable: true
            topology:
              type: string
              title: Topology
              description: >-
                The name of the topology config; required to create an
                experiment, and on an update defaults to the experiment's
                current topology.
              nullable: true
            scenario:
              type: string
              title: Scenario
              description: The name of the scenario config; on an update defaults to the experiment's current scenario.
              nullable: true
            vlans:
              type: object
              title: VLANs
              description: >-
                VLAN alias to VLAN ID; every alias used by an interface in the
                topology is set to its ID here, or left for minimega to pick
                when not listed.
              nullable: true
              additionalProperties:
                type: integer
            schedules:
              type: object
              title: Schedules
              description: >-
                VM hostname to cluster host; each listed non-external node of
                the topology is scheduled on that host.
              nullable: true
              additionalProperties:
                type: string
            deployMode:
              type: string
              title: Deploy Mode
              description: >-
                Where VMs are deployed, all, no-headnode or only-headnode in any
                letter case; unset or empty uses the server's deploy-mode
                setting.
              nullable: true
              pattern: '^(?i:all|no-headnode|only-headnode)?$'
            useGREMesh:
              type: boolean
              title: Use GRE Mesh
              description: >-
                Whether the experiment uses a GRE mesh between cluster hosts; it
                is OR-ed with the server's use-gre-mesh setting, so either turns
                it on.
              nullable: true
            vlanRange:
              type: object
              title: VLAN Range
              description: The range of VLAN IDs the experiment may allocate from; unset leaves both ends unset.
              nullable: true
              additionalProperties: false
              properties:
                min:
                  type: integer
                  title: Minimum
                  description: The lowest VLAN ID the experiment may use; 0 leaves the minimum unset.
                  nullable: true
                max:
                  type: integer
                  title: Maximum
                  description: The highest VLAN ID the experiment may use; 0 leaves the maximum unset.
                  nullable: true
            defaultBridge:
              type: string
              title: Default Bridge
              description: >-
                The bridge the experiment's VMs attach to by default; defaults to
                phenix, is at most 15 characters (the Linux interface name
                limit), and unless it is phenix no other experiment may use it.
              nullable: true
              maxLength: 15
    WorkflowResult:
      type: object
      properties:
        action:
          type: string
          enum:
            - none
            - create
            - createAndStart
            - update
            - updateAndStart
            - restart
        experiment:
          type: string
          description: experiment the action applies to (empty when no experiment is involved)
        reason:
          type: string
          description: why nothing was done, when action is none
        dryRun:
          type: boolean
          description: true when nothing was changed because dryRun was requested
    WorkflowConfigResult:
      type: object
      description: what POST /workflow/configs/{branch}?dryRun=true would do
      properties:
        action:
          type: string
          enum:
            - create
            - update
          description: whether the request would create the config or update the stored one
        kind:
          type: string
          description: the config's kind, e.g. Topology
        name:
          type: string
          description: the config's name after the server filled in its placeholders, such as ${BRANCH_NAME}
        dryRun:
          type: boolean
          description: always true
        pending:
          type: string
          description: >
            the value to pass as pending to a dry run of
            POST /workflow/apply/{branch}: Kind/name, followed for a scenario by
            ?from=...&topology=... (its fromScenario names and topology
            annotation) and for a topology that includes others by ?include=...
    Options:
      type: object
      properties:
        bridge-mode:
          type: string
        deploy-mode:
          type: string
        use-gre-mesh:
          type: boolean
        base-dir.injects:
          type: string
          description: directory phenix workflow apply stages injects into
        workflow-dry-run:
          type: boolean
          description: >
            true when POST /workflow/configs/{branch} and POST /workflow/apply/{branch}
            support dryRun, and apply supports pending and expect
    Error:
      type: object
      properties:
        message:
          type: string
          description: what went wrong; for a config validation failure, the first explained line
        cause:
          type: string
          description: the underlying error text
        metadata:
          type: object
          description: extra details, returned for some errors
          properties:
            validation:
              type: string
              description: >
                for a schema validation failure, the explained lines separated by
                newlines, each in the form <item> "<hostname|name>" (line N): <what>
                (at <sub-path>), with (line N) left out for single-line sources and
                an extra hint line for a misplaced key; an error that cannot be
                placed in the source (in a templated key, in data a config hook
                added, in a YAML merge key, or a missing or misindented
                metadata.name) keeps the validator's text; for an unparsable body
                sent to POST /configs, the parser error
            validation-raw:
              type: string
              description: for a schema validation failure, the original validator text
          additionalProperties:
            type: string
  parameters:
    BuilderDraftID:
      name: draft
      in: path
      description: draft ID
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    BuilderIfMatch:
      name: If-Match
      in: header
      description: >
        The ETag of the draft revision that the change is based on: exactly
        one strong, quoted entity tag, such as `"3"`. A missing header, a
        wildcard or a weak tag gets 400. A tag that names any other revision
        gets 412.
      required: true
      schema:
        type: string
    BuilderTemplateID:
      name: template
      in: path
      description: template ID
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    BuilderTemplateCollectionID:
      name: collection
      in: path
      description: collection ID
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    BuilderTemplateIfMatch:
      name: If-Match
      in: header
      description: >
        The `etag` of the template or collection that the change is based
        on: exactly one strong, quoted entity tag, such as `"3"`. A missing
        header, a wildcard or a weak tag gets 400. A tag that does not name
        the current content gets 412.
      required: true
      schema:
        type: string
    BuilderLayerSetID:
      name: layerset
      in: path
      description: >
        the ID of the layer set. A path that names no set gets 404, whatever
        its form
      required: true
      schema:
        type: string
    BuilderLayerSetIfMatch:
      name: If-Match
      in: header
      description: >
        The `etag` of the layer set that the change is based on: exactly one
        strong, quoted entity tag, such as `"3"`. A missing header, a
        wildcard or a weak tag gets 400. A tag that does not name the current
        content gets 412 (`layerset.stale`).
      required: true
      schema:
        type: string
    BuilderIconIfMatch:
      name: If-Match
      in: header
      description: >
        The `etag` of the icon, as listed or read: exactly one strong, quoted
        entity tag, such as `"12"`. A missing header, a wildcard or a weak tag
        gets 400. A tag of another revision gets 412.
      required: true
      schema:
        type: string
    BuilderDocumentIfMatch:
      name: If-Match
      in: header
      description: >
        The `etag` of the published document, as listed or read: exactly one
        strong, quoted entity tag. A missing header, a wildcard or a weak tag
        gets 400. A tag of another state of the topology gets 412.
      required: true
      schema:
        type: string
    BuilderLayerSetDefaultIfMatch:
      name: If-Match
      in: header
      description: >
        The `etag` of the default selection, as listed or read, such as
        `"0"`. A missing header, a wildcard or a weak tag gets 400. A tag that
        does not name the current selection gets 412 (`layerset.stale`).
      required: true
      schema:
        type: string
  headers:
    BuilderETag:
      description: the draft's revision as a quoted entity tag, for the next If-Match
      schema:
        type: string
    BuilderTemplateETag:
      description: >
        the entity tag of the template's or collection's content,
        `"<version>"`, for the next If-Match
      schema:
        type: string
    BuilderLayerSetETag:
      description: >
        the entity tag of the layer set's content, `"<version>"`, for the
        next If-Match
      schema:
        type: string
    BuilderIconETag:
      description: >
        the entity tag of the icon's revision, `"<revision>"`, for the If-Match
        of a delete
      schema:
        type: string
    BuilderDocumentETag:
      description: >
        the entity tag of the published document and its topology, for the
        If-Match of a delete
      schema:
        type: string
    BuilderLayerSetDefaultETag:
      description: >
        the entity tag of the default layer set selection, for the next
        If-Match
      schema:
        type: string
    BuilderWarning:
      description: >
        Set when the change succeeded, but the server could not remove the
        content that it replaced. Only the server log has the cause.
      schema:
        type: string
  responses:
    BuilderBadRequest:
      description: >
        The request is malformed. Its body is not a single JSON value of the
        expected shape (the server refuses unknown fields). Or its If-Match
        header is missing or not a single strong entity tag.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderForbidden:
      description: >
        The role of the caller does not have a permission that the operation
        requires: `builder` `use`, or a config permission that the operation
        names.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderNotFound:
      description: >
        The resource does not exist. Or it is a published document or config
        that the caller may not read. The answer is the same as for a
        resource that does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderConflict:
      description: >
        The draft or a target config changed during the request. A draft that
        changed has the code `draft.conflict`. Read the draft again and try
        again.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderPreconditionFailed:
      description: >
        The If-Match header does not name the draft's current revision
        (`draft.stale`). The response carries the draft's current ETag.
      headers:
        ETag:
          $ref: "#/components/headers/BuilderETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderStale:
      description: >
        The If-Match header does not name the current state of the resource
        (`request.stale`): another user changed it after the caller read it.
        The response carries the current entity tag. Read the resource again.
      headers:
        ETag:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderTooLarge:
      description: >
        The request body or the document is larger than the size limits of
        the server. The snapshot history never causes this status. The
        server removes its oldest snapshots instead.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderUnprocessable:
      description: >
        The request is well formed, but the server cannot apply it. Examples
        are a document that fails validation, or a config that the server
        cannot convert.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderIconNotFound:
      description: >
        No icon of the icon library has the name in the path, nor keeps it
        as an alias, ignoring case. The message never repeats the path.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderTemplateNotFound:
      description: >
        The library holds no template or collection with the ID in the path.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderTemplateConflict:
      description: >
        This version of phenix cannot read the library record, so it cannot
        change it. Or the request names a built-in template. Or it names a
        template or a collection that the server read from one of its template
        files (`source` `builtin` or `preloaded`). Nobody can change such an
        item. The code is then `template.item.read-only`, and `message` names
        the item and says to duplicate it into the library instead.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderTemplatePreconditionFailed:
      description: >
        The If-Match header does not name the current content of the
        template or collection: another user changed it after the caller
        read it. The code is `template.item.stale`. The response carries the
        current entity tag. Reload the library and apply the change again.
      headers:
        ETag:
          $ref: "#/components/headers/BuilderTemplateETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderTemplateTooLarge:
      description: >
        The request body is larger than the route allows (6 MiB to add
        templates, 1 MiB to replace one, 64 KiB otherwise). Or the library
        would hold more than 200 templates, 50 collections or 200 templates
        in one collection, or use more than 512 KiB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderTemplateUnprocessable:
      description: >
        The request is well formed, but the server cannot apply it. `message`
        says why. It names a template that is not valid by its place in the
        request and the field. Examples are `templates[0].name: a template needs
        a name` or `templates[0].device.icon: icon name "a b" must be 1 to
        64 letters, digits, "_", "@", "." or "-"`. The server refuses a
        collection for its name, its description, or a template that the
        library does not hold or that the collection names twice.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderTemplateBusy:
      description: >
        The library kept changing during the request. Try again.
      headers:
        Retry-After:
          description: seconds to wait before trying again
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderLayerSetNotFound:
      description: >
        No layer set has the ID in the path.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderLayerSetReadOnly:
      description: >
        The role of the caller does not have a permission that the operation
        requires. Or the path names a built-in layer set, which nobody can
        change or delete (`layerset.read-only`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderLayerSetDamaged:
      description: >
        This version of phenix cannot read the record of the layer set.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderLayerSetPreconditionFailed:
      description: >
        The If-Match header does not name the current content of the layer
        set (`layerset.stale`). The response carries the current entity tag.
      headers:
        ETag:
          $ref: "#/components/headers/BuilderLayerSetETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderLayerSetTooLarge:
      description: >
        The request body is larger than 1 MiB. Or the library holds 200
        layer sets, the most it can hold (`layerset.library.full`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderLayerSetUnprocessable:
      description: >
        The layer set does not validate (`layerset.invalid`). `issues` lists
        each problem with its code and its path in the set, such as
        `layers[0].matchers.general.hostname` with the code
        `layer.matcher-pattern.invalid`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderLayerSetBusy:
      description: >
        The layer set kept changing during the request. Try again.
      headers:
        Retry-After:
          description: seconds to wait before trying again
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
