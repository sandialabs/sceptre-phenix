      operationId: getExperimentsNameVmsNameQos
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of the VM
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMQoS"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the experiment or the VM does not exist, or minimega does not have the VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: the experiment is not running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: minimega could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{exp_name}/vms/{vm_name}/interfaces/{iface}/qos":
    put:
      tags:
        - Virtual Machines
      summary: Set the link quality of a VM interface
      description: >-
        Replaces the link quality of one interface of a VM of a running
        experiment. phenix clears the interface's link quality, then adds each
        setting the body gives. If minimega refuses a setting, phenix puts back
        the interface's previous link quality and answers `400`. Link quality
        applies only to the traffic that the VM receives. Needs the `vms` `patch` permission on `<exp>/<vm>`.
        Sends a websocket `experiment/vm` `update` of the VM.
      operationId: putExperimentsNameVmsNameInterfacesIndexQos
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of the VM
          required: true
          schema:
            type: string
        - name: iface
          in: path
          description: index of the VM's interface, from 0, in the order of the topology node's interfaces
          required: true
          example: 0
          schema:
            type: integer
            minimum: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                loss:
                  title: Loss
                  description: >-
                    the percent of packets to drop at random, a decimal number
                    from 0 up to but not including 100, with no sign or exponent
                  example: "0.5"
                  type: string
                delay:
                  title: Delay
                  description: >-
                    the time to hold each packet, a decimal number and `us`,
                    `ms` or `s`
                  example: 100ms
                  type: string
                rate:
                  title: Rate
                  description: >-
                    the most bandwidth, a whole number from 1 to 999999999 and
                    `kbit`, `mbit` or `gbit`. It cannot go with `loss` or `delay`
                  example: 10mbit
                  type: string
            example:
              loss: "0.5"
              delay: 100ms
      responses:
        "200":
          description: the interface's link quality, as minimega reports it after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterfaceQoS"
        "400":
          description: >-
            a malformed body, no setting, a setting minimega cannot apply, a
            rate with a loss or a delay, or an index that is not an interface
            of the VM. When minimega refuses a setting, the message is
            minimega's and the interface keeps its previous link quality
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the experiment or the VM does not exist, or minimega does not have the VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: the experiment is not running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
