        "500":
          description: the disc could not be ejected
  "/experiments/{exp_name}/vms/{vm_name}/commit":
    post:
      tags:
        - Virtual Machines
      summary: Commit a VM's disk to a new image
      description: >-
        Writes the running VM's disk as it is now, its snapshot's changes
        included, to a new image backed by nothing else, pausing the VM while
        it does, and answers once it is written.
        Progress is published on the `/ws` websocket as
        `experiment/vm/commit` messages (`committing`, `progress` with a
        `percent`, then `commit` with this response, or
        `errorCommitting`). Needs the `vms/commit` `create` permission.
      operationId: postExperimentsNameVmsNameCommit
      parameters:
        - $ref: "#/components/parameters/ExpName"
        - $ref: "#/components/parameters/VMName"
