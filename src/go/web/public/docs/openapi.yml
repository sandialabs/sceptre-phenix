openapi: 3.0.0
info:
  description: |
    phenix API

    ## Ordering and freshness

    Every response of an `/api/v1` route past authentication (not a 401 or
    403 refusal of authentication, nor an `OPTIONS` answer) carries
    `X-Phenix-Seq`, a number from one strictly increasing sequence per phenix
    process, taken as the request started, and `Cache-Control: no-cache,
    private` unless the endpoint says otherwise. Every message on the `/ws` websocket carries the same sequence
    in its `seq` field, taken as the message was published (a reply to a
    client request, such as an `experiment/vms` list, takes it before its data
    is read). Data tagged with seq S reflects every change whose message
    carries a seq of S or less, so a client keeps, per item, the highest seq
    it applied and ignores data tagged lower. Sequence numbers are comparable
    only within one server process: reset them when the websocket reconnects.

    Responses that serve runtime state read from minimega may also carry
    `X-Phenix-Observed-At` (when the oldest data in the response was read,
    RFC 3339; compare it with the `Date` header) and `X-Phenix-Stale: true`
    (the data is older than its normal bound, such as earlier data served
    while minimega was busy).

    ## Errors and authentication

    Requests carry a token in `X-Phenix-Auth-Token: Bearer <token>`, or in a
    `token` query parameter for browser links, unless auth is disabled.
    Without one, an API route answers 403; with a malformed, expired or
    signed-out token, or behind a proxy naming another user than the token's,
    401. A role without the permission a route needs gets 403, except where a
    route says it answers 404 so as not to reveal another user's job, console
    or token. An unknown `/api/v1` path is a 404 and a method a path does not
    take is a 405, both before authentication, and an `OPTIONS` request
    answers 204 (200 with `--allow-cors`) without running the route. With
    `--jwt-signing-key proxy-jwt` the token is read only from the header, and
    a missing or malformed one answers 400; with auth disabled, every request
    acts as global-admin. Behind a proxy serving phenix under a base path
    (`ui.base-path`), the proxy strips it, and the `Location` headers of jobs
    and configs carry it.
  version: 0.0.0
  title: phenix
  termsOfService: http://swagger.io/terms/
  contact:
    url: https://github.com/sandialabs/sceptre-phenix
  license:
    name: GNU General Public License v3.0
tags:
  - name: Configs
    description: Config details and controls
  - name: Schemas
    description: Config spec schemas
  - name: Experiments
    description: Experiments details and controls
  - name: Scorch
    description: >-
      SCORCH pipeline details and controls. A scenario's scorch app metadata
      defines one or more runs, each a pipeline of configure, start, loop,
      stop and cleanup stages built from the components it names. These
      endpoints report those pipelines and their latest statuses, and start,
      cancel, clear and clean up a run.
  - name: Virtual Machines
    description: Experiment VM details and controls
  - name: Hosts
    description: Cluster host details
  - name: Applications
    description: Available phenix user applications
  - name: Topologies
    description: Available phenix topologies
  - name: Builder
    description: Graphical topology Builder diagrams and the topologies built from them
  - name: Disks
    description: Available phenix disk images
  - name: Users
    description: User details and controls
  - name: Workflow
    description: Workflow config upserts and applies, and the server options clients read
  - name: State of Health
    description: State of health across experiments
  - name: Settings
    description: The web UI settings the store holds, and the parts of them every user reads
  - name: Logs
    description: The server's log entries
  - name: Events
    description: >-
      The websocket the web UI follows the server's changes on, and the
      requests it sends there
  - name: Console
    description: >-
      minimega consoles in the web UI (the server must run with
      --minimega-console). A console belongs to the user who started it: only
      that user can check on it, attach to it, resize it, or end it, and
      another user's console is reported as not found. A console keeps running
      while websockets attach and detach, and ends when its process exits, when
      it is deleted, or once no websocket has been attached for 15 seconds.
  - name: Features
    description: >-
      The optional features this server has enabled, which the web UI reads to
      decide what to offer, and the build it runs.
  - name: Tunneler
    description: >-
      phenix-tunneler builds this server offers for download. Like
      /features, and unlike the other endpoints here, these two are served
      from the server root rather than under /api/v1, and need neither
      credentials nor a permission, so each declares its own server.
  - name: Health
    description: >-
      Liveness (/healthz) and readiness (/readyz) of this server, in the
      application/health+json format of the IETF draft
      draft-inadarei-api-health-check-06. Like /features, these are served
      from the server root rather than under /api/v1 and need no credentials:
      every caller sees the statuses, observed values, versions and timings,
      but only an authenticated request (a valid token, or any request when
      auth is disabled) sees the `output` fields, which may name paths, hosts
      and errors.
  - name: Jobs
    description: >-
      Background jobs: long operations (bulk VM actions, experiment file
      archives, disk clones) that run on in the server after the request that
      starts them answers 202. A job belongs to the user who started it; other
      users see, cancel or dismiss it only with the `jobs` permission on its
      experiment, or `jobs/global` for a job of no experiment, and anyone else
      gets 404.
      Jobs live in the server's memory only: a restart loses them. A finished
      job is kept for an hour, at most 200 of them.
paths:
  "/configs":
    get:
      tags:
        - Configs
      summary: Get all phenix configs
      operationId: getConfigs
      parameters:
        - name: kind
          in: query
          description: limit configs to specified kind (defaults to all)
          required: false
          schema:
            type: string
            enum:
              - all
              - topology
              - scenario
              - experiment
              - image
              - user
              - role
            default: all
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Configs"
    post:
      tags:
        - Configs
      summary: Create new phenix config
      operationId: postConfigs
      requestBody:
        description: phenix config creation parameters
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Config"
          application/x-yaml:
            schema:
              $ref: "#/components/schemas/Config"
          multipart/form-data:
            schema:
              type: object
              properties:
                fileupload:
                  title: "Fileupload"
                  description: "Configuration file to create or update."
                  example: example
                  type: string
                  format: binary
      responses:
        "201":
          description: successful config creation
          headers:
            Location:
              schema:
                description: location of newly created config, under the server's base path
                type: string
                format: uri
            ETag:
              $ref: "#/components/headers/ConfigETag"
            X-Phenix-Revision:
              $ref: "#/components/headers/ConfigRevision"
        "400":
          description: >
            unknown content type or file extension, unparsable body (the parser
            error in metadata.validation), unknown kind, a config with the same
            name that already exists, a schema validation failure (explained
            lines in metadata.validation, original validator text in
            metadata.validation-raw), or a config hook or the store rejects the
            config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            the role may not create configs, or may not create one of this
            config's `Kind/name`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the request or the uploaded file cannot be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/configs/download":
    post:
      tags:
        - Configs
      summary: Download configs as YAML
      description: >-
        Sends one config as a YAML attachment named `<Kind>-<name>.yml`, or
        several as a zip attachment, `configs.zip`, of such files. An
        experiment config is sent without its `experimentName`, and a User
        config without its `password` and `tokens`. Needs the
        `configs` `get` permission; in an archive, a config the role may not
        get is left out, while a single config the role may not get is
        refused. Every config of an archive is read before it is sent, which
        is built as it is sent, so it cannot be resumed (`Accept-Ranges:
        none`).
      operationId: postConfigsDownload
      requestBody:
        description: the configs, each as `<Kind>/<name>`
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                example: Topology/demo
      responses:
        "200":
          description: the config, or the archive of configs
          content:
            text/plain:
              schema:
                type: string
                description: one config, as YAML
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          description: >-
            the body is not a list of config names, or a config does not
            exist or cannot be read
        "403":
          description: forbidden
        "500":
          description: a config could not be converted to YAML
  "/configs/{kind}/{name}":
    get:
      tags:
        - Configs
      summary: Get existing phenix config
      description: >-
        An Experiment config is sent without its `experimentName`, and a User
        config without its `password` hash and `tokens`. The ETag still names
        the stored revision, so it changes when only those fields do.
      operationId: getConfigsKindName
      parameters:
        - name: kind
          in: path
          description: kind of phenix config to get
          required: true
          schema:
            type: string
        - name: name
          in: path
          description: name of phenix config to get
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: content format for response
          required: false
          schema:
            type: string
            enum:
              - application/json
              - application/x-yaml
            default: application/json
        - $ref: "#/components/parameters/ConfigIfNoneMatch"
      responses:
        "200":
          description: successful operation
          headers:
            ETag:
              $ref: "#/components/headers/ConfigETag"
            X-Phenix-Revision:
              $ref: "#/components/headers/ConfigRevision"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/Config"
        "304":
          $ref: "#/components/responses/ConfigNotModified"
        "404":
          description: the config does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags:
        - Configs
      summary: Update existing phenix config
      description: >
        Can also be used to rename a config by changing the name in the metadata
        portion of the config header and using the old name in the request path.
        A rename or a change of kind also needs `configs` `create` for the new
        `Kind/name`. A User config keeps its stored `password` and `tokens`,
        whatever the body holds, so a config sent back as GET returned it
        changes neither; the users routes change them.
      operationId: putConfigsKindName
      parameters:
        - name: kind
          in: path
          description: kind of phenix config to get
          required: true
          schema:
            type: string
        - name: name
          in: path
          description: name of phenix config to get
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/ConfigIfMatch"
      requestBody:
        description: phenix config update parameters
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Config"
          application/x-yaml:
            schema:
              $ref: "#/components/schemas/Config"
          multipart/form-data:
            schema:
              type: object
              properties:
                fileupload:
                  title: "Fileupload"
                  description: "Configuration file to create or update."
                  example: example
                  type: string
                  format: binary
      responses:
        "204":
          description: successful config update
          headers:
            Location:
              schema:
                description: location of updated config, under the server's base path
                type: string
                format: uri
            ETag:
              $ref: "#/components/headers/ConfigETag"
            X-Phenix-Revision:
              $ref: "#/components/headers/ConfigRevision"
        "400":
          description: >
            unknown content type or file extension, an unknown kind, a schema
            validation failure (explained lines in metadata.validation, original
            validator text in
            metadata.validation-raw), or a config hook or the store rejects the
            config; for an Experiment config, also a failure to reconfigure the
            experiment after the updated config was stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            updating the config is not allowed, or, for a rename or a change
            of kind, creating a config of the new `Kind/name` is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the config does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          description: >-
            the config is no longer at the `If-Match` revision, or does not
            exist, or, for a User config, it changed while the update ran;
            `metadata.revision` holds its current revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the request or the uploaded file cannot be read or parsed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - Configs
      summary: Delete existing phenix config
      operationId: deleteConfigsKindName
      parameters:
        - name: kind
          in: path
          description: kind of phenix config to delete
          required: true
          schema:
            type: string
        - name: name
          in: path
          description: name of phenix config to delete
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/ConfigIfMatch"
      responses:
        "204":
          description: successful operation
        "400":
          description: a malformed If-Match header, or the config cannot be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the config does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          $ref: "#/components/responses/ConfigPreconditionFailed"
  "/schemas/{version}":
    get:
      tags:
        - Schemas
      summary: Get full schema (all config specs) for specific version
      operationId: getSchemasVersion
      parameters:
        - name: version
          in: path
          description: version of phenix config schema to get
          required: true
          schema:
            type: string
            enum:
              - "v0"
              - "v1"
              - "v2"
        - name: Accept
          in: header
          description: content format for response
          required: false
          schema:
            type: string
            enum:
              - application/json
              - application/x-yaml
            default: application/json
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            application/x-yaml:
              schema:
                type: object
                additionalProperties: true
  "/schemas/{kind}/{version}":
    get:
      tags:
        - Schemas
      summary: Get schema for specific config spec kind/version
      description: the Workflow schema exists only in version v0
      operationId: getSchemasKindVersion
      parameters:
        - name: kind
          in: path
          description: kind of phenix config schema to get
          required: true
          schema:
            type: string
            enum:
              - topology
              - scenario
              - experiment
              - image
              - user
              - role
              - workflow
        - name: version
          in: path
          description: version of phenix config schema to get
          required: true
          schema:
            type: string
            enum:
              - "v0"
              - "v1"
              - "v2"
        - name: Accept
          in: header
          description: content format for response
          required: false
          schema:
            type: string
            enum:
              - application/json
              - application/x-yaml
            default: application/json
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            application/x-yaml:
              schema:
                type: object
                additionalProperties: true
  "/experiments":
    get:
      tags:
        - Experiments
      summary: Get all phenix experiments
      operationId: getExperiments
      parameters:
        - name: screenshot
          in: query
          description: whether or not to include VM screenshots (value is size to grab)
          required: false
          schema:
            type: string
        - name: vms
          in: query
          description: >-
            set to false to leave each experiment's VMs out (`vms` is empty)
            and not ask minimega about them; `vm_count` and `delayed_vms` come
            from the topology. Ignored when screenshot is set.
          required: false
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: >-
            successful operation; `X-Phenix-Stale` is also set when stored
            experiments that could not be read are left out
          headers:
            X-Phenix-Observed-At:
              $ref: "#/components/headers/ObservedAt"
            X-Phenix-Stale:
              $ref: "#/components/headers/Stale"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiments"
        "500":
          description: the store could not be read, so no experiments are known
    post:
      tags:
        - Experiments
      summary: Create new phenix experiment
      operationId: postExperiments
      requestBody:
        description: phenix experiment creation parameters
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - topology
              properties:
                name:
                  title: "Name"
                  description: "Name used to identify this resource or entry."
                  example: example-name
                  type: string
                topology:
                  title: "Topology"
                  description: "Topology configuration embedded in or referenced by this resource."
                  example: example-topology
                  type: string
                scenario:
                  title: "Scenario"
                  description: "Scenario configuration embedded in or referenced by this resource."
                  example: example-scenario
                  type: string
                disabled_apps:
                  title: "Disabled Apps"
                  description: scenario apps to leave out of the experiment
                  type: array
                  items:
                    example: example-app
                    type: string
                vlan_min:
                  title: "VLAN Min"
                  description: "Lowest VLAN ID allocated to the experiment."
                  example: 1
                  type: integer
                vlan_max:
                  title: "VLAN Max"
                  description: "Highest VLAN ID allocated to the experiment."
                  example: 1
                  type: integer
                workflow_branch:
                  title: "Workflow Branch"
                  example: main
                  description: >-
                    stored as the phenix.workflow/branch experiment annotation,
                    so `annotations` may not also set it
                  type: string
                deploy_mode:
                  title: "Deploy Mode"
                  description: "VM deployment mode: all, no-headnode, or only-headnode."
                  example: all
                  type: string
                  enum: ["", no-headnode, only-headnode, all]
                default_bridge:
                  title: "Default Bridge"
                  description: "Minimega bridge assigned to interfaces without an explicit bridge."
                  example: phenix
                  type: string
                use_gre_mesh:
                  title: "Use Gre Mesh"
                  description: "Whether to connect cluster hosts with a GRE mesh."
                  example: false
                  type: boolean
                node_annotations:
                  title: Node Annotations
                  description: >-
                    added to every VM in the experiment's copy of the topology
                    (the topology config is unchanged); a VM's own annotation
                    for the same key wins. Values keep their JSON type, and
                    phenix/default-apps must be a boolean,
                    phenix/startup-autotunnel a list of strings, and
                    vrouter/vyos-password and vrouter/enable-ssh strings.
                  type: object
                  additionalProperties: {}
                annotations:
                  title: Annotations
                  description: >-
                    added to the experiment's metadata annotations; topology
                    and scenario are set by phenix and rejected
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "204":
          description: >-
            experiment created; it is announced to websocket clients as an
            experiment create event
        "400":
          description: invalid request, such as an annotation phenix rejects
        "403":
          description: forbidden
        "409":
          description: phenix is already acting on an experiment with this name
  "/experiments/{name}":
    get:
      tags:
        - Experiments
      summary: Get existing phenix experiment
      operationId: getExperimentsName
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get
          required: true
          schema:
            type: string
        - name: screenshot
          in: query
          description: whether or not to include VM screenshots (value is size to grab)
          required: false
          schema:
            type: string
        - name: vms
          in: query
          description: >-
            set to false to leave the VMs out (`vms` is empty) and not ask
            minimega about them; `vm_count` and `delayed_vms` come from the VMs
            configured in the topology. Ignored when screenshot is set.
          required: false
          schema:
            type: boolean
            default: true
        - name: filter
          in: query
          description: search expression the VMs must match
          required: false
          schema:
            type: string
        - name: show_dnb
          in: query
          description: any value includes the VMs marked do not boot
          required: false
          schema:
            type: string
        - name: sortCol
          in: query
          description: column to sort the VMs by, used with sortDir
          required: false
          schema:
            type: string
            enum: [name, host, uptime, delayed]
        - name: sortDir
          in: query
          description: sort direction, used with sortCol
          required: false
          schema:
            type: string
            enum: [asc, desc]
        - name: pageNum
          in: query
          description: page to return, from 1, used with perPage
          required: false
          schema:
            type: integer
            minimum: 1
        - name: perPage
          in: query
          description: VMs per page, used with pageNum
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: >-
            successful operation; `vms` holds the page asked for and
            `vm_count` how many VMs match, before paging
          headers:
            X-Phenix-Observed-At:
              $ref: "#/components/headers/ObservedAt"
            X-Phenix-Stale:
              $ref: "#/components/headers/Stale"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
        "400":
          description: pageNum or perPage is not a whole number of at least 1
    delete:
      tags:
        - Experiments
      summary: Delete existing phenix experiment
      operationId: deleteExperimentsName
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to delete
          required: true
          schema:
            type: string
      responses:
        "204":
          description: successful operation
    patch:
      tags:
        - Experiments
      summary: Update VLAN assignments for a stopped experiment
      description: >-
        Updates aliases already assigned to VLAN IDs; unknown aliases are
        ignored. Needs the `experiments` `patch` permission.
      operationId: patchExperimentsName
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to update
          required: true
          schema:
            type: string
      requestBody:
        description: VLAN alias to VLAN ID assignments
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: integer
      responses:
        "204":
          description: experiment updated
        "400":
          description: the experiment is running, or the body is not a map of aliases to VLAN IDs
        "403":
          description: forbidden
        "404":
          description: no such experiment
        "500":
          description: the experiment could not be read or written
  "/experiments/{name}/apps":
    get:
      tags:
        - Experiments
      summary: Get whether each of an experiment's apps is running
      description: >-
        Maps each app the experiment's scenario names, and any app its status
        reports, to whether the app's running stage is running now. Needs the
        `experiments/apps` `get` permission.
      operationId: getExperimentsNameApps
      parameters:
        - name: name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean
                example:
                  soh: false
                  scorch: true
        "400":
          description: the experiment could not be read
        "403":
          description: forbidden
  "/experiments/{name}/start":
    post:
      tags:
        - Experiments
      summary: Start existing phenix experiment
      operationId: postExperimentsNameStart
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to start
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
  "/experiments/{name}/stop":
    post:
      tags:
        - Experiments
      summary: Stop existing phenix experiment
      operationId: postExperimentsNameStop
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to stop
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
  "/experiments/{name}/schedule":
    get:
      tags:
        - Experiments
      summary: Get current schedule for existing experiment
      operationId: getExperimentsNameSchedule
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get schedule for
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
    post:
      tags:
        - Experiments
      summary: Update current schedule for existing experiment
      operationId: postExperimentsNameSchedule
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to update schedule for
          required: true
          schema:
            type: string
      requestBody:
        description: scheduling algorithm to use
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                algorithm:
                  title: "Algorithm"
                  description: "Scheduling algorithm used to assign VMs to cluster hosts."
                  example: example
                  type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
  "/experiments/{name}/captures":
    get:
      tags:
        - Experiments
      summary: Get captures for existing experiment
      operationId: getExperimentsNameCaptures
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get captures for
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Captures"
  "/experiments/{exp_name}/webshark":
    post:
      tags:
        - Experiments
      summary: Name a packet capture for WebShark to open
      description: >-
        Returns a random name under which the WebShark viewer (served at
        `/webshark/` when installed) opens a capture: a saved capture file, by
        its path as the experiment's files are listed (needs the
        `experiments/files` `get` permission), or a VM interface's running
        capture (also needs `vms/captures` `list` on `<exp>/<vm>`). A file
        still being captured opens live. WebShark's own requests carry no
        credentials, so the name is a capture grant: it is bound to the
        caller and the session it was given under, and each use checks that
        the caller may still read the capture. It ends 2 hours after its last
        use, 12 hours after it was given, or when the session ends (sign-out
        or token expiry), whichever comes first, and when the experiment or
        the capture file is deleted. Open it at
        `/webshark/embed?capture=<name>&embed=1`.
      operationId: postExperimentsNameWebshark
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  title: Path
                  type: string
                  description: a .pcap, .pcapng or .cap experiment file, optionally gzipped
                  example: captures/router_eth0.pcap
                vm:
                  title: VM
                  example: router
                  type: string
                  description: VM with a running capture (with interface)
                interface:
                  title: Interface
                  example: 0
                  type: integer
                  description: index of the VM interface being captured
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  capture:
                    title: Capture
                    example: router-k2j4m6n8p1q3r5s7t9v2w4x6y8.pcap
                    type: string
                    description: the name WebShark opens the capture by
                  live:
                    title: Live
                    example: false
                    type: boolean
                    description: whether the capture is still running
                  title:
                    title: Title
                    description: how the WebShark page names the capture, the file's path or `<vm> interface <n> (live)`
                    example: router interface 0 (live)
                    type: string
                  id:
                    title: ID
                    type: string
                    description: >-
                      the grant's ID, not secret, which
                      `/experiments/{exp_name}/capture-tokens` lists and
                      revokes it by
                    example: 3f9a0c51d2e47b86
                  expires:
                    title: Expires
                    example: "2026-01-01T12:00:00Z"
                    type: string
                    format: date-time
                    description: when the name stops working at the latest
        "400":
          description: >-
            neither or both of a path and a VM, a VM without an interface
            index, a path that is not clean and relative to the files
            directory, or not a capture file
        "403":
          description: forbidden
        "404":
          description: no such file, or the interface is not being captured
        "501":
          description: WebShark is not installed
  "/experiments/{exp_name}/capture-tokens":
    post:
      tags:
        - Experiments
      summary: Give a capture token
      description: >-
        Gives the caller a capture token for one capture, named as
        `/experiments/{exp_name}/webshark` takes it and with the same
        permissions. With `"operations": ["stream"]` (a running capture
        only), a command outside the browser streams the capture as pcap with
        `GET /webshark/streams/{token}`, which needs no other credentials
        and lives outside `/api/v1`, under the UI's base path, so that
        `curl -fsSN '<origin>/webshark/streams/<token>' | wireshark -k -i -`
        works without the caller's session token. A stream token starts
        streams, from the start of the capture or with `?from=now`, for 5
        minutes, and what it started ends with the caller's session (or 24
        hours after it was given when the server does not sign users in).
        With any of `view`, `download` and `watch`, the token is a WebShark
        capture name. A token is bound to the caller and the session it was
        given under, and each use checks that the caller may still read the
        capture. Signing out, deleting the user, deleting the experiment or
        the capture file, and revoking the token end it; stopping the
        experiment ends its stream tokens. Tokens are kept in the server's
        memory, so a restart ends them all.
      operationId: postExperimentsNameCaptureTokens
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - operations
              properties:
                path:
                  title: Path
                  example: captures/router_eth0.pcap
                  type: string
                  description: a .pcap, .pcapng or .cap experiment file, optionally gzipped
                vm:
                  title: VM
                  example: router
                  type: string
                  description: VM with a running capture (with interface)
                interface:
                  title: Interface
                  example: 0
                  type: integer
                  description: index of the VM interface being captured
                operations:
                  title: Operations
                  type: array
                  description: "`stream` alone, or any of `view`, `download` and `watch`"
                  items:
                    type: string
                    enum: [stream, view, download, watch]
                  example: [stream]
      responses:
        "201":
          description: the token, which no other response shows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureToken"
        "400":
          description: >-
            no or unknown operations, stream with other operations, a stream
            of a capture that is not running, or a capture named as
            `/experiments/{exp_name}/webshark` refuses it
        "403":
          description: forbidden
        "404":
          description: no such file, or the interface is not being captured
        "501":
          description: WebShark is not installed (for view, download and watch)
    get:
      tags:
        - Experiments
      summary: List the caller's capture tokens
      description: >-
        Lists the caller's own capture tokens for the experiment that have
        not ended, WebShark capture names included, without the tokens.
      operationId: getExperimentsNameCaptureTokens
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    title: Tokens
                    description: >-
                      the caller's capture tokens for the experiment that have
                      not ended, without the tokens themselves
                    type: array
                    items:
                      $ref: "#/components/schemas/CaptureToken"
  "/experiments/{exp_name}/capture-tokens/{id}":
    delete:
      tags:
        - Experiments
      summary: Revoke a capture token
      description: >-
        Revokes one of the caller's own capture tokens, ending the streams
        and WebShark watches it opened.
      operationId: deleteExperimentsNameCaptureTokensId
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: id
          in: path
          description: the token's ID
          required: true
          schema:
            type: string
      responses:
        "204":
          description: revoked
        "404":
          description: no such token of the caller's, or it has ended
  "/experiments/{name}/captureSubnet":
    post:
      tags:
        - Experiments
      summary: Capture the interfaces of an experiment's VMs on a subnet
      description: >-
        Starts a packet capture on each interface of the running experiment's
        VMs whose address is in the subnet, or of the listed VMs only. Needs
        the `exp/captureSubnet` `create` permission.
      operationId: postExperimentsNameCaptureSubnet
      parameters:
        - name: name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureSubnetRequest"
      responses:
        "200":
          description: the captures started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Captures"
        "400":
          description: the body is not a capture request
        "403":
          description: forbidden
        "500":
          description: >-
            the experiment is not running, the subnet is not a CIDR prefix, or
            a capture could not be started
  "/experiments/{name}/files":
    get:
      tags:
        - Experiments
      summary: Get list of files for experiment
      description: >-
        Lists the experiment's files on the head node and every mesh node.
        A listing is reused for a few seconds, so a file written just before
        the request may not be in it yet; `X-Phenix-Observed-At` says when it
        was read. Needs the `experiments/files` `list` permission.
      operationId: getExperimentsNameFiles
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get files for
          required: true
          schema:
            type: string
        - name: filter
          in: query
          description: search expression the files must match
          required: false
          schema:
            type: string
        - name: sortCol
          in: query
          description: column to sort by, used with sortDir
          required: false
          schema:
            type: string
            enum: [name, date, size]
        - name: sortDir
          in: query
          description: sort direction, used with sortCol
          required: false
          schema:
            type: string
            enum: [asc, desc]
        - name: pageNum
          in: query
          description: page to return, from 1, used with perPage
          required: false
          schema:
            type: integer
            minimum: 1
        - name: perPage
          in: query
          description: files per page, used with pageNum
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Files"
          headers:
            X-Phenix-Observed-At:
              $ref: "#/components/headers/ObservedAt"
        "400":
          description: pageNum or perPage is not a whole number of at least 1
        "403":
          description: forbidden
        "502":
          description: >-
            minimega could not list the files of every cluster node, so the
            listing would be incomplete
  "/experiments/{name}/files/download":
    post:
      tags:
        - Experiments
      summary: Download several experiment files as a zip archive
      description: >-
        Streams a zip archive (`<name>-files.zip`) of the listed files, each
        stored under its path relative to the experiment's files directory.
        Every path is checked before anything is sent. Needs the
        `experiments/files` `get` permission. At most 500 files totaling
        2 GiB are allowed. The archive is built as it is sent, so it cannot
        be resumed (`Accept-Ranges: none`); download very large files one at
        a time with `GET /experiments/{name}/files/{filename}`.
      operationId: postExperimentsNameFilesDownload
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to download files from
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilePaths"
      responses:
        "200":
          description: zip archive of the files
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          description: >-
            no paths, a path that is not clean and relative to the files
            directory, or a pcap a running capture is still writing
        "403":
          description: forbidden
        "404":
          description: a path is not one of the experiment's files
        "413":
          description: more than 500 files, or more than 2 GiB in total
  "/experiments/{name}/files/archive":
    post:
      tags:
        - Experiments
        - Jobs
      summary: Build a zip archive of several experiment files in a background job
      description: >-
        Checks the files as POST .../files/download does, then builds their
        zip archive in a `files.archive` background job whose items are the
        files and whose progress counts the bytes read. A file that cannot be
        fetched is left out, the job ends `partial`, and the archive, named
        `<name>-files-incomplete.zip` instead of `<name>-files.zip`, lists it
        with the reason in a `MISSING.txt` entry. Download the archive, which
        resumes, from GET /jobs/{id}/artifact; canceling the job leaves no
        archive. Needs the `experiments/files` `get` permission.
      operationId: postExperimentsNameFilesArchive
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to archive files from
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilePaths"
      responses:
        "202":
          description: the job, started
          headers:
            Location:
              description: the job, at /api/v1/jobs/{id} under the server's base path
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          description: >-
            no paths, a path that is not clean and relative to the files
            directory, or a pcap a running capture is still writing
        "403":
          description: forbidden
        "404":
          description: a path is not one of the experiment's files
        "413":
          description: more than 500 files, or more than 2 GiB in total
        "429":
          description: >-
            too many of the user's jobs, or of all jobs, are waiting to run;
            `Retry-After` says when to try again
  "/experiments/{name}/files/delete":
    post:
      tags:
        - Experiments
      summary: Delete several experiment files
      description: >-
        Deletes the listed files from the head node and every mesh node that
        has them. Files that cannot be deleted are listed with the reason and
        the rest are still deleted. Needs the `experiments/files` `delete`
        permission.
      operationId: postExperimentsNameFilesDelete
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to delete files from
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilePaths"
      responses:
        "200":
          description: files deleted, and those that were not
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilesDeleted"
        "400":
          description: an invalid request body, or no paths given
        "403":
          description: forbidden
        "500":
          description: deleting the files failed; any of them may remain
  "/experiments/{name}/files/{filename}":
    get:
      tags:
        - Experiments
      summary: Download experiment file
      description: >-
        Streams the file from disk as an attachment, copying it to the head
        node first if only a mesh node has it. Downloads resume: send `Range`
        with `If-Range` set to the `ETag` of an earlier response, and the rest
        of the file comes back (206) only while it is unchanged; a changed
        file comes back whole (200). Downloads are never gzip-compressed.
        With `Accept: text/plain` the file is instead sent inline as
        `text/plain; charset=utf-8` for the Files tab's viewer, gzip-compressed
        for clients that accept it (with a weak `ETag`), and a file over
        10 MiB is refused with 413. Needs the `experiments/files` `get`
        permission.
      operationId: getExperimentsNameFilesFilename
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get file from
          required: true
          schema:
            type: string
        - name: filename
          in: path
          description: >-
            name the download is saved as (sent in Content-Disposition); the
            file sent is the one `path` names
          required: true
          schema:
            type: string
        - name: path
          in: query
          description: path of the file relative to the experiment's files directory, as listed
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            `text/plain` for the Files tab's viewer: the file is sent inline
            as text rather than as an attachment
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/RangeHeader"
        - $ref: "#/components/parameters/IfRangeHeader"
        - $ref: "#/components/parameters/IfNoneMatchHeader"
      responses:
        "200":
          description: the whole file
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/LastModified"
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
            Repr-Digest:
              $ref: "#/components/headers/ReprDigest"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
        "206":
          $ref: "#/components/responses/PartialContent"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: >-
            the path is not clean and relative to the files directory, or a
            running capture is still writing the pcap
        "403":
          description: forbidden
        "404":
          description: the path is not one of the experiment's files
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "413":
          description: "asked for with `Accept: text/plain`, and the file is over 10 MiB"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
    head:
      tags:
        - Experiments
      summary: Check an experiment file download
      description: >-
        The GET response's headers without the file: its size
        (Content-Length), `ETag` and `Last-Modified`. Needs the
        `experiments/files` `get` permission.
      operationId: headExperimentsNameFilesFilename
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get file from
          required: true
          schema:
            type: string
        - name: filename
          in: path
          description: >-
            name the download is saved as (sent in Content-Disposition); the
            file sent is the one `path` names
          required: true
          schema:
            type: string
        - name: path
          in: query
          description: path of the file relative to the experiment's files directory, as listed
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: >-
            `text/plain` for the Files tab's viewer: the file is sent inline
            as text rather than as an attachment
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/RangeHeader"
        - $ref: "#/components/parameters/IfRangeHeader"
        - $ref: "#/components/parameters/IfNoneMatchHeader"
      responses:
        "200":
          description: the file's headers
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/LastModified"
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
            Repr-Digest:
              $ref: "#/components/headers/ReprDigest"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: >-
            the path is not clean and relative to the files directory, or a
            running capture is still writing the pcap
        "403":
          description: forbidden
        "404":
          description: the path is not one of the experiment's files
    delete:
      tags:
        - Experiments
      summary: Delete experiment file
      description: >-
        Deletes the file from the head node and every mesh node that has it.
        Needs the `experiments/files` `delete` permission.
      operationId: deleteExperimentsNameFilesFilename
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to delete the file from
          required: true
          schema:
            type: string
        - name: filename
          in: path
          description: name of the file to delete
          required: true
          schema:
            type: string
        - name: path
          in: query
          description: path of the file relative to the experiment's files directory, as listed
          required: true
          schema:
            type: string
      responses:
        "204":
          description: file deleted
        "400":
          description: >-
            the path is not clean and relative to the files directory, has
            characters minimega would read as a glob or several arguments, or
            names a pcap a running capture is still writing
        "403":
          description: forbidden
        "404":
          description: the path is not one of the experiment's files
  "/experiments/{name}/files/{filename}/checksum":
    get:
      tags:
        - Experiments
      summary: Get an experiment file's SHA-256 checksum
      description: >-
        Computes the file's SHA-256 in the background, at most two files at
        a time server-wide, and keeps it in memory for as long as the file is
        unchanged: 202 until it is known (a small file's comes back at once),
        then 200. From then on, downloads of the file carry it as
        `Repr-Digest`. Needs the `experiments/files` `get` permission.
      operationId: getExperimentsNameFilesFilenameChecksum
      parameters:
        - name: name
          in: path
          description: name of phenix experiment the file belongs to
          required: true
          schema:
            type: string
        - name: filename
          in: path
          description: the file's name; the file is the one `path` names
          required: true
          schema:
            type: string
        - name: path
          in: query
          description: path of the file relative to the experiment's files directory, as listed
          required: true
          schema:
            type: string
      responses:
        "200":
          description: the file's checksum
          headers:
            Repr-Digest:
              $ref: "#/components/headers/ReprDigest"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileChecksum"
        "202":
          description: the checksum is being computed; ask again later
          headers:
            Retry-After:
              description: seconds to wait before asking again
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileChecksum"
        "400":
          description: >-
            the path is not clean and relative to the files directory, or a
            running capture is still writing the pcap
        "403":
          description: forbidden
        "404":
          description: the path is not one of the experiment's files
        "409":
          description: the file changed while it was hashed; ask again
  "/experiments/{name}/netflow":
    get:
      tags:
        - Experiments
      summary: Check whether an experiment's netflow capture is running
      description: Needs the `experiments/netflow` `get` permission.
      operationId: getExperimentsNameNetflow
      parameters:
        - name: name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
      responses:
        "204":
          description: the netflow capture is running
        "403":
          description: forbidden
        "404":
          description: no netflow capture is running for the experiment
    post:
      tags:
        - Experiments
      summary: Start a netflow capture of an experiment
      description: >-
        Has every cluster node send the netflow records of the experiment's
        bridge to the server, which hands them to the clients of
        `GET /experiments/{name}/netflow/ws`. The experiment must be running
        and have its own default bridge, not `phenix`. Needs the
        `experiments/netflow` `create` permission.
      operationId: postExperimentsNameNetflow
      parameters:
        - name: name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
      responses:
        "204":
          description: the netflow capture has started
        "400":
          description: the capture is already running, or there is no such experiment
        "403":
          description: forbidden
        "409":
          description: the experiment is not running, or its default bridge is `phenix`
        "500":
          description: the capture could not be started
    delete:
      tags:
        - Experiments
      summary: Stop an experiment's netflow capture
      description: >-
        Stops the capture on every cluster node and closes its websocket
        clients normally (1000, `netflow stopped`). Needs the
        `experiments/netflow` `delete` permission.
      operationId: deleteExperimentsNameNetflow
      parameters:
        - name: name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
      responses:
        "204":
          description: the netflow capture has stopped
        "403":
          description: forbidden
        "404":
          description: no netflow capture is running for the experiment
        "500":
          description: a cluster node could not stop the capture
  "/experiments/{name}/netflow/ws":
    get:
      tags:
        - Experiments
      summary: Receive an experiment's netflow records over a WebSocket
      description: >-
        Each text message is one netflow record as a JSON
        `NetflowRecord`. The server pings every 7 seconds and closes a client
        that has not answered within 10; what a client sends is ignored, and
        a message over 1 KiB closes the websocket. Records a client is too
        slow to take are dropped for it. When the capture stops, the server
        closes the websocket normally (1000) with the reason `netflow
        stopped`. Needs the `experiments/netflow` `get` permission.
      operationId: getExperimentsNameNetflowWs
      parameters:
        - name: name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
      responses:
        "101":
          description: switching protocols; netflow records follow as `NetflowRecord` JSON messages
        "403":
          description: forbidden
        "404":
          description: no netflow capture is running for the experiment
  "/experiments/{name}/scorch/components/{run}/{loop}/{stage}/{cmp}":
    get:
      tags:
        - Scorch
      summary: Get a SCORCH component's output
      description: >-
        For a component that has finished, or not run, its output so far
        (`output`). For one that is running, where to follow its output: the
        websocket to stream it from (`stream`), or, for a `break` component,
        the terminal it opened (`terminal`), connected to as
        `GET .../terminals/{pid}` would. Needs the `experiments` `get`
        permission.
      operationId: getExperimentsNameScorchComponentsRunLoopStageCmp
      parameters:
        - $ref: "#/components/parameters/ScorchExp"
        - $ref: "#/components/parameters/ScorchRun"
        - $ref: "#/components/parameters/ScorchLoop"
        - $ref: "#/components/parameters/ScorchStage"
        - $ref: "#/components/parameters/ScorchComponent"
      responses:
        "200":
          description: the output, its stream, or the component's terminal
          content:
            application/json:
              schema:
                type: object
                properties:
                  output:
                    title: Output
                    type: string
                    description: the output of a component that is not running
                    example: "ping: 3 packets transmitted, 3 received"
                  stream:
                    title: Stream
                    type: string
                    description: >-
                      the websocket of a running component's output, under the
                      UI's base path
                    example: /api/v1/experiments/exp1/scorch/components/0/0/start/ping/ws
                  terminal:
                    title: Terminal
                    description: the terminal of a running break component
                    allOf:
                      - $ref: "#/components/schemas/ScorchTerminal"
        "400":
          description: the run or loop is not a number, or the break component's terminal is gone
        "403":
          description: forbidden
        "500":
          description: the output could not be encoded
  "/experiments/{name}/scorch/components/{run}/{loop}/{stage}/{cmp}/ws":
    get:
      tags:
        - Scorch
      summary: Stream a SCORCH component's output over a WebSocket
      description: >-
        Text frames carry the component's output: what it has written so far,
        then what it writes, and `***** COMPONENT FINISHED *****` once it
        finishes, when the server closes the websocket. A component that is
        not running gets its output and the marker at once. A client that
        falls 256 chunks behind is dropped, and reconnecting replays the
        output. The handshake needs an `Origin` header. Needs the
        `experiments` `get` permission.
      operationId: getExperimentsNameScorchComponentsRunLoopStageCmpWs
      parameters:
        - $ref: "#/components/parameters/ScorchExp"
        - $ref: "#/components/parameters/ScorchRun"
        - $ref: "#/components/parameters/ScorchLoop"
        - $ref: "#/components/parameters/ScorchStage"
        - $ref: "#/components/parameters/ScorchComponent"
      responses:
        "101":
          description: switching protocols; the output follows in text frames
        "400":
          description: the run or loop is not a number, or not a websocket handshake
        "403":
          description: forbidden, or a handshake without an `Origin` header
  "/experiments/{name}/scorch/pipelines":
    get:
      tags:
        - Scorch
      summary: Get every Scorch run's pipeline for an experiment
      description: >-
        One pipeline per run in the experiment's scorch app metadata, in run
        order, each the run's own top-level loop. Also reports which run the
        scorch app is executing, whether that app is running at all, and the
        experiment's own state, so the Scorch page needs no separate
        experiment request. Needs the `experiments` `get` permission on the
        experiment.
      operationId: getExperimentsNameScorchPipelines
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get Scorch pipelines for
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScorchPipelines"
        "400":
          description: >-
            the experiment could not be read from the store, or one of its
            pipelines could not be built
        "403":
          description: getting the experiment is not allowed for this user
        "500":
          description: the experiment's scorch metadata could not be decoded
  "/experiments/{name}/scorch/pipelines/{run}":
    post:
      tags:
        - Scorch
      summary: Start a Scorch run
      description: >-
        Executes the run's configure, start, loop, stop and cleanup stages in
        the background and answers as soon as it has started; the pipeline
        endpoints and the `apps/scorch` websocket resource report how it gets
        on. A run that is already executing is refused. Needs the
        `experiments/trigger` `create` and the `experiments` `get` permissions
        on the experiment.
      operationId: postExperimentsNameScorchPipelinesRun
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to start a Scorch run for
          required: true
          schema:
            type: string
        - name: run
          in: path
          description: index of the run in the experiment's scorch app metadata
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: the run has started
        "400":
          description: >-
            the run ID is not a number, the experiment could not be read from
            the store, or the run is already executing
        "403":
          description: starting Scorch runs is not allowed for this user
    delete:
      tags:
        - Scorch
      summary: Cancel a Scorch run
      description: >-
        Cancels the run's context, which ends the stage it is executing and
        the run with it. A run that is not executing is left alone and the
        answer is the same. Needs the `experiments/trigger` `delete`
        permission on the experiment.
      operationId: deleteExperimentsNameScorchPipelinesRun
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to cancel a Scorch run for
          required: true
          schema:
            type: string
        - name: run
          in: path
          description: index of the run in the experiment's scorch app metadata
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: the run has been canceled, or was not executing
        "400":
          description: the run ID is not a number
        "403":
          description: canceling Scorch runs is not allowed for this user
  "/experiments/{name}/scorch/pipelines/{run}/cleanup":
    post:
      tags:
        - Scorch
      summary: Run only a Scorch run's cleanup stage
      description: >-
        Executes the run's top-level cleanup components on their own, without
        its other stages, to tear down what a canceled or failed run left
        behind, and answers as soon as they have started. Only a run whose
        `hasCleanup` is true has any, and a run that is already executing is
        refused. Needs the `experiments/trigger` `create` and the
        `experiments` `get` permissions on the experiment.
      operationId: postExperimentsNameScorchPipelinesRunCleanup
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to clean a Scorch run up for
          required: true
          schema:
            type: string
        - name: run
          in: path
          description: index of the run in the experiment's scorch app metadata
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: the cleanup stage has started
        "400":
          description: >-
            the run ID is not a number, the experiment could not be read from
            the store, the run (or the experiment's scorch app) does not exist
            or has no cleanup components, or the run is already executing
        "403":
          description: starting Scorch runs is not allowed for this user
        "500":
          description: the experiment's scorch metadata could not be decoded
  "/experiments/{name}/scorch/pipelines/{run}/clear":
    post:
      tags:
        - Scorch
      summary: Clear a Scorch run's status
      description: >-
        Forgets the statuses held for every loop of the run, so its pipeline
        shows as never run, and broadcasts each cleared loop over the
        `apps/scorch` websocket resource. A run that is executing is refused,
        so cancel it first. Needs the `experiments/trigger` `create`
        permission on the experiment.
      operationId: postExperimentsNameScorchPipelinesRunClear
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to clear a Scorch run for
          required: true
          schema:
            type: string
        - name: run
          in: path
          description: index of the run in the experiment's scorch app metadata
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: the run's status has been cleared
        "400":
          description: >-
            the run ID is not a number, or the experiment could not be read
            from the store
        "403":
          description: clearing Scorch runs is not allowed for this user
        "404":
          description: >-
            the experiment's scorch app metadata has no such run, or the
            experiment has no scorch app
        "409":
          description: the run is executing
        "500":
          description: the experiment's scorch metadata could not be decoded
  "/experiments/{name}/scorch/pipelines/{run}/{loop}":
    get:
      tags:
        - Scorch
      summary: Get one loop of a Scorch run's pipeline
      description: >-
        The pipeline for a single loop of a run: a node per stage and per
        component, the edges that order them, and each node's latest status.
        Loop 0 is the run itself, and every loop above it is the pipeline
        nested in the loop below. Needs the `experiments` `get` permission on
        the experiment.
      operationId: getExperimentsNameScorchPipelinesRunLoop
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get a Scorch pipeline for
          required: true
          schema:
            type: string
        - name: run
          in: path
          description: index of the run in the experiment's scorch app metadata
          required: true
          schema:
            type: integer
        - name: loop
          in: path
          description: loop to get, 0 for the run itself
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScorchPipeline"
        "400":
          description: >-
            the run ID or the loop number is not a number, the experiment
            could not be read from the store, the experiment has no such run,
            or the run does not configure that loop
        "403":
          description: getting the experiment is not allowed for this user
  "/experiments/{name}/scorch/terminals":
    get:
      tags:
        - Scorch
      summary: List an experiment's SCORCH terminals
      description: >-
        The terminals the experiment's running break components opened,
        without a client to connect as (`loc` and `exit` are empty). Needs
        the `experiments` `get` permission.
      operationId: getExperimentsNameScorchTerminals
      parameters:
        - $ref: "#/components/parameters/ScorchExp"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  terminals:
                    title: Terminals
                    type: array
                    nullable: true
                    description: the terminals; null when there are none
                    items:
                      $ref: "#/components/schemas/ScorchTerminal"
        "403":
          description: forbidden
  "/experiments/{name}/scorch/terminals/{pid}":
    get:
      tags:
        - Scorch
      summary: Connect to a SCORCH terminal
      description: >-
        Gives the caller a client of the terminal running the process, whose
        PID the `loc` and `exit` of an earlier connection name: `loc`, the
        websocket to attach with, and, for the first client whose role has the
        `scorch/terminals` `write` permission, which may write to the
        terminal, `exit`, the route that ends it. Every other client only
        watches (`readOnly`), and a client without that permission never
        takes the writing side, even when no one holds it. A client must
        attach within 5 seconds. Needs the `experiments` `get` permission;
        writing to the terminal also needs `scorch/terminals` `write`.
      operationId: getExperimentsNameScorchTerminalsPid
      parameters:
        - $ref: "#/components/parameters/ScorchExp"
        - $ref: "#/components/parameters/ScorchTerminalPID"
      responses:
        "200":
          description: the terminal, with the caller's client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScorchTerminal"
        "400":
          description: the PID is not a number
        "403":
          description: forbidden
        "404":
          description: the experiment has no terminal running that process
  "/experiments/{name}/scorch/terminals/{run}/{loop}/{stage}/{cmp}":
    get:
      tags:
        - Scorch
      summary: Connect to a SCORCH component's terminal
      description: >-
        As `GET .../terminals/{pid}`, for the terminal the break component
        opened. Needs the `experiments` `get` permission; writing to the
        terminal also needs `scorch/terminals` `write`.
      operationId: getExperimentsNameScorchTerminalsRunLoopStageCmp
      parameters:
        - $ref: "#/components/parameters/ScorchExp"
        - $ref: "#/components/parameters/ScorchRun"
        - $ref: "#/components/parameters/ScorchLoop"
        - $ref: "#/components/parameters/ScorchStage"
        - $ref: "#/components/parameters/ScorchComponent"
      responses:
        "200":
          description: the terminal, with the caller's client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScorchTerminal"
        "400":
          description: the run or loop is not a number, or the component has no terminal
        "403":
          description: forbidden
  "/experiments/{name}/scorch/terminals/{pid}/ws/{id}":
    get:
      tags:
        - Scorch
      summary: Attach to a SCORCH terminal over a WebSocket
      description: >-
        Attaches the client a connect route gave (its `loc`), once. Frames
        carry the terminal's output, and a read-only client first gets what
        the terminal has written so far. What the writing client sends is
        typed into the terminal; read-only clients' frames are ignored. When
        the writing client's process exits, read-only clients get `*****
        BREAK PROCESS EXITED *****` and the websocket closes. The handshake
        needs an `Origin` header. Needs the `experiments` `get` permission;
        attaching as the writing client also needs `scorch/terminals`
        `write`.
      operationId: getExperimentsNameScorchTerminalsPidWsId
      parameters:
        - $ref: "#/components/parameters/ScorchExp"
        - $ref: "#/components/parameters/ScorchTerminalPID"
        - name: id
          in: path
          description: the client ID in the connect route's `loc`
          required: true
          schema:
            type: string
      responses:
        "101":
          description: switching protocols; the terminal follows in frames
        "403":
          description: >-
            forbidden, a handshake without an `Origin` header, or the writing
            client's ID from a role without the `scorch/terminals` `write`
            permission
        "404":
          description: no such terminal for the experiment, or a client ID unknown, used or expired
  "/experiments/{name}/scorch/terminals/{pid}/exit/{id}":
    post:
      tags:
        - Scorch
      summary: End a SCORCH terminal
      description: >-
        Kills the terminal's process, which ends its break component, and
        publishes an `apps/scorch` `terminal-exit` message on the `/ws`
        websocket. Only the writing client, by the `exit` its connect route
        gave, may end it. Needs the `experiments` `get` and the
        `scorch/terminals` `write` permissions.
      operationId: postExperimentsNameScorchTerminalsPidExitId
      parameters:
        - $ref: "#/components/parameters/ScorchExp"
        - $ref: "#/components/parameters/ScorchTerminalPID"
        - name: id
          in: path
          description: the client ID in the connect route's `exit`
          required: true
          schema:
            type: string
      responses:
        "204":
          description: the terminal has ended
        "403":
          description: forbidden, or the client is not the terminal's writing client
        "404":
          description: no such terminal for the experiment, or it could not be ended
  "/experiments/{name}/topology":
    get:
      tags:
        - Experiments
      summary: Get an experiment's network graph
      description: >-
        A node for each VM and one for each VLAN the VMs connect to (type
        `Switch`), and an edge for each VM interface, from the VM to its
        VLAN. Needs the `experiments/topology` `get` permission.
      operationId: getExperimentsNameTopology
      parameters:
        - name: name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: ignore
          in: query
          description: a VLAN to leave out of the graph, such as a management network; may repeat
          required: false
          schema:
            type: array
            items:
              type: string
          example: [MGMT]
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentGraph"
        "400":
          description: the experiment could not be read
        "403":
          description: forbidden
  "/experiments/{name}/topology/search":
    get:
      tags:
        - Experiments
      summary: Search an experiment's network graph
      description: >-
        Finds the graph nodes that match each query parameter given, and
        lists their IDs, in no particular order. Each of
        `hostname`, `disk`, `node-type`, `os-type`, `label`, `annotation`,
        `vlan` and `ip` takes one value; `ip` also takes a CIDR prefix,
        matching every address in it. Other parameters are ignored. Needs the
        `experiments/topology` `get` permission.
      operationId: getExperimentsNameTopologySearch
      parameters:
        - name: name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: hostname
          in: query
          description: a VM's hostname
          schema:
            type: string
        - name: disk
          in: query
          description: a disk image the VMs boot from
          schema:
            type: string
        - name: node-type
          in: query
          description: a node type, such as VirtualMachine
          schema:
            type: string
        - name: os-type
          in: query
          description: an OS type, such as linux
          schema:
            type: string
        - name: label
          in: query
          description: a label, as key=value
          schema:
            type: string
        - name: annotation
          in: query
          description: an annotation key the VMs have
          schema:
            type: string
        - name: vlan
          in: query
          description: a VLAN alias the VMs connect to
          schema:
            type: string
        - name: ip
          in: query
          description: an IPv4 address, or a CIDR prefix
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    title: Nodes
                    type: array
                    nullable: true
                    description: the IDs of the matching graph nodes; null when none match
                    items:
                      type: integer
                    example: [0, 3]
        "400":
          description: the experiment could not be read
        "403":
          description: forbidden
  "/experiments/{name}/trigger":
    post:
      tags:
        - Experiments
      summary: Run the running stage of an experiment's apps
      description: >-
        Answers at once and runs the running stage of each app `apps` names,
        one after another, in the background, stopping at the first that
        fails. Every query parameter is passed to the apps as metadata. Each
        app's progress is published on the `/ws` websocket as an
        `apps/<app>` resource named after the experiment, whose action is
        `start`, then `success` or `error` (with the error as its result).
        Needs the `experiments/trigger` `create` permission.
      operationId: postExperimentsNameTrigger
      parameters:
        - name: name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: apps
          in: query
          description: the apps to trigger, comma-separated
          required: true
          schema:
            type: string
          example: soh,scorch
      responses:
        "204":
          description: the apps are being triggered
        "403":
          description: forbidden
    delete:
      tags:
        - Experiments
      summary: Cancel an experiment's triggered apps
      description: >-
        Answers at once and cancels the running stage of each app `apps`
        names that a trigger started, publishing an `apps/<app>` `success`
        message, with the `delete` permission verb, on the `/ws` websocket.
        Needs the `experiments/trigger` `delete` permission.
      operationId: deleteExperimentsNameTrigger
      parameters:
        - name: name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: apps
          in: query
          description: the apps to cancel, comma-separated
          required: true
          schema:
            type: string
          example: scorch
      responses:
        "204":
          description: the apps are being canceled
        "403":
          description: forbidden
  "/experiments/{name}/soh":
    get:
      tags:
        - State of Health
      summary: Get an experiment's state of health
      description: >-
        The experiment's network graph with each VM's latest soh results, and
        the hosts and flows between them that the soh app recorded. The
        `MGMT` and `MIRROR` VLANs are left out. Needs the `experiments` `get`
        permission.
      operationId: getExperimentsNameSoh
      parameters:
        - name: name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: statusFilter
          in: query
          description: keep only the VMs with this status; empty keeps every VM
          required: false
          schema:
            type: string
            enum: [running, notrunning, notboot, notdeploy, external]
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoHNetwork"
        "403":
          description: forbidden
        "500":
          description: the experiment, or its soh results, could not be read
  "/experiments/{name}/stopCaptureSubnet":
    post:
      tags:
        - Experiments
      summary: Stop the captures of an experiment's VMs on a subnet
      description: >-
        Stops the packet captures of the experiment's VMs with an interface
        in the subnet, or of the listed VMs only. Needs the
        `exp/captureSubnet` `delete` permission.
      operationId: postExperimentsNameStopCaptureSubnet
      parameters:
        - name: name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureSubnetRequest"
      responses:
        "200":
          description: the VMs whose captures stopped
          content:
            application/json:
              schema:
                type: object
                properties:
                  vms:
                    title: VMs
                    type: array
                    description: the VMs whose captures stopped
                    items:
                      type: string
                    example: [web, db]
        "400":
          description: the body is not a capture request
        "403":
          description: forbidden
        "500":
          description: the experiment could not be read, or a capture could not be stopped
  "/experiments/{exp_name}/vms":
    get:
      tags:
        - Virtual Machines
      summary: get all VMs in existing experiment
      operationId: getExperimentsNameVms
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment to get VMs for
          required: true
          schema:
            type: string
        - name: screenshot
          in: query
          description: whether or not to include VM screenshots (value is size to grab)
          required: false
          schema:
            type: string
        - name: sortCol
          in: query
          description: column to sort the VMs by, used with sortDir
          required: false
          schema:
            type: string
            enum: [name, host, uptime, delayed]
        - name: sortDir
          in: query
          description: sort direction, used with sortCol
          required: false
          schema:
            type: string
            enum: [asc, desc]
        - name: pageNum
          in: query
          description: page to return, from 1, used with perPage
          required: false
          schema:
            type: integer
            minimum: 1
        - name: perPage
          in: query
          description: VMs per page, used with pageNum
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: successful operation
          headers:
            X-Phenix-Observed-At:
              $ref: "#/components/headers/ObservedAt"
            X-Phenix-Stale:
              $ref: "#/components/headers/Stale"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMs"
        "400":
          description: pageNum or perPage is not a whole number of at least 1
    patch:
      tags:
        - Virtual Machines
      summary: Update several VMs of a stopped experiment
      description: >-
        Applies each VM's changes as `PATCH
        /experiments/{exp_name}/vms/{vm_name}` would, one VM after another,
        and answers with the VMs it updated. Only `cpus`, `ram`, `disk`,
        `dnb`, `interface`, `host` and `snapshot` are applied; other fields
        are ignored. A VM the role may not `patch` (`vms`, on
        `<exp>/<vm>`) is left out, and every disk is checked before any VM
        changes. A failed update ends the request with the VMs before it
        changed.
      operationId: patchExperimentsNameVms
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vms:
                  title: VMs
                  type: array
                  description: each VM's changes, by name
                  items:
                    $ref: "#/components/schemas/VMUpdate"
                total:
                  title: Total
                  type: integer
                  description: ignored
                  example: 2
            example:
              vms:
                - name: web
                  dnb: true
                - name: db
                  dnb: true
      responses:
        "200":
          description: the VMs updated, and how many
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMs"
        "400":
          description: >-
            a malformed body, a disk minimega cannot use, or an experiment
            that could not be read
        "500":
          description: a VM could not be updated or read back
  "/experiments/{exp_name}/vms/actions":
    post:
      tags:
        - Virtual Machines
        - Jobs
      summary: Take one power action on several VMs in a background job
      description: >-
        Starts a `vms.action` background job that takes the action on each
        VM, four at a time, exactly as the VM's own route does (the same
        permission, lock, websocket messages and logs). A VM the role may not
        act on is skipped with `you don't have permission`; a VM another action
        holds fails with `retryable` set. Each succeeded item's `result` is the
        VM as the single-VM route returns it (none for `kill`). Canceling the
        job starts no more VMs, and the VMs in progress finish. The actions
        and their single-VM routes and permissions are `start` (POST
        .../start, `vms/start` `update`), `pause` (POST .../stop, `vms/stop`
        `update`), `restart` (`vms/restart` `update`), `shutdown`
        (`vms/shutdown` `update`), `resetDisk` (GET .../reset, `vms/reset`
        `update`) and `kill` (DELETE .../{vm_name}, `vms` `delete`).
      operationId: postExperimentsNameVmsActions
      parameters:
        - name: exp_name
          in: path
          description: name of the running phenix experiment
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
                - vms
              properties:
                action:
                  title: Action
                  description: the power action to take on each VM
                  type: string
                  enum:
                    - start
                    - pause
                    - restart
                    - shutdown
                    - kill
                    - resetDisk
                vms:
                  title: VMs
                  type: array
                  description: the VMs' names; repeats count once
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: string
            example:
              action: restart
              vms:
                - web
                - db
      responses:
        "202":
          description: the job, started
          headers:
            Location:
              description: the job, at /api/v1/jobs/{id} under the server's base path
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          description: an unknown action, a malformed body, or no VMs or more than 1000
        "403":
          description: the role may take the action on none of the VMs
        "429":
          description: >-
            too many of the user's jobs, or of all jobs, are waiting to run;
            `Retry-After` says when to try again
  "/experiments/{exp_name}/vms/{vm_name}":
    get:
      tags:
        - Virtual Machines
      summary: get given VM in existing experiment
      description: >-
        Returns the VM with its node's annotations, which VM lists leave out.
        Needs the `vms` `get` permission.
      operationId: getExperimentsNameVmName
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment to get VM from
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix experiment VM to get
          required: true
          schema:
            type: string
        - name: screenshot
          in: query
          description: whether or not to include VM screenshots (value is size to grab)
          required: false
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
    patch:
      tags:
        - Virtual Machines
      summary: Update existing VM settings in existing experiment
      description: >-
        While the experiment runs, only an interface's VLAN, the tags and the
        annotations can change. Needs the `vms` `patch` permission; the
        response carries the annotations when the role may also get the VM.
      operationId: patchExperimentsNameVmsName
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment to modify
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix virtual machine to modify
          required: true
          schema:
            type: string
      requestBody:
        description: phenix virtual machine patch parameters
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                host:
                  title: "Host"
                  description: "Cluster host on which to run the VM."
                  example: compute-01
                  type: string
                cpus:
                  title: "CPUs"
                  description: "Number of virtual CPUs assigned to the VM."
                  example: 1
                  type: integer
                ram:
                  title: "RAM"
                  description: "Memory assigned to the VM, in megabytes."
                  example: 1
                  type: integer
                disk:
                  title: "Disk"
                  example: ubuntu.qc2
                  type: string
                  description: >-
                    the image to boot from, relative to the minimega files
                    directory or absolute; minimega must be able to use its
                    name (see the 400 response)
                dnb:
                  title: "Do Not Boot"
                  description: "Whether the VM should remain powered off."
                  example: false
                  type: boolean
                interface:
                  title: "Interface"
                  description: "Network interface to update on the VM."
                  type: object
                  properties:
                    index:
                      title: "Index"
                      description: "Minimega network interface index to update."
                      example: 1
                      type: integer
                    vlan:
                      title: "VLAN"
                      example: EXP-1
                      type: string
                      description: >-
                        VLAN alias to connect the interface to; empty
                        disconnects it. Applies only while the experiment
                        is running, and is ignored otherwise.
                snapshot:
                  title: "Snapshot"
                  description: "Whether to take a VM disk snapshot."
                  example: false
                  type: boolean
                inject_partition:
                  title: "Inject Partition"
                  description: "Disk partition used for file injection."
                  example: 1
                  type: integer
                tag_update_mode:
                  title: "Tag Update Mode"
                  example: SET
                  type: string
                  enum: [NONE, SET, ADD]
                  default: NONE
                  description: >-
                    how `tags` applies: SET replaces the VM's tags, ADD adds to
                    them (replacing any with the same key), and NONE ignores
                    `tags`
                tags:
                  title: "Tags"
                  description: "String tags associated with the VM."
                  type: object
                  additionalProperties:
                    type: string
                annotations:
                  title: Annotations
                  type: object
                  additionalProperties: true
                  description: >-
                    replaces all of the VM's annotations; `{}` removes them.
                    Apps read most annotations when the experiment starts.
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        "400":
          description: >-
            invalid request, such as an annotation with an empty key, no
            value, or a value of a type the default apps would ignore, or a
            disk whose name minimega cannot use (white space, quotes, a
            backslash, `#`, `$`, `,`, glob characters or a control character)
        "403":
          description: forbidden
    delete:
      tags:
        - Virtual Machines
      summary: Delete phenix experiment VM
      operationId: deleteExperimentsNameVmsName
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix virtual machine to delete
          required: true
          schema:
            type: string
      responses:
        "204":
          description: successful operation
  "/experiments/{exp_name}/vms/{vm_name}/start":
    post:
      tags:
        - Virtual Machines
      summary: start VM in experiment
      operationId: postExperimentsNameVMsNameStart
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM to start
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
  "/experiments/{exp_name}/vms/{vm_name}/stop":
    post:
      tags:
        - Virtual Machines
      summary: stop VM in experiment
      operationId: postExperimentsNameVMsNameStop
      parameters:
        - name: exp_name
