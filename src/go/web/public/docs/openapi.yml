          description: successful operation
  "/experiments/{exp_name}/vms/{vm_name}/captures/{interface}/stream":
    get:
      tags:
        - Virtual Machines
      summary: stream a running VM packet capture
      description: >-
        Streams a running capture as a pcap file: everything captured so far
        (or, with `from=now`, nothing captured before the request), then each
        packet as it is captured, until the capture stops. A plain request
        gets a chunked `application/vnd.tcpdump.pcap` body that Wireshark can
        read from a pipe, for example `curl -sN -H 'X-Phenix-Auth-Token:
        Bearer <token>' <url> | wireshark -k -i -`. A websocket request gets
        the same bytes as binary messages: the first holds the pcap file
        header and each later one whole packets. Needs the `vms/captures`
        `list` permission on `<exp>/<vm>` and `experiments/files` `get` on the
        experiment.
      operationId: getExperimentsNameVmsNameCapturesInterfaceStream
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM being captured
          required: true
          schema:
            type: string
        - name: interface
          in: path
          description: index of the VM interface being captured
          required: true
          schema:
            type: integer
        - name: from
          in: query
          description: "`now` to skip packets captured before the request"
          required: false
          schema:
            type: string
            enum: [now]
      responses:
        "101":
          description: switching protocols (websocket)
        "200":
          description: the capture, streamed as it grows
          content:
            application/vnd.tcpdump.pcap:
              schema:
                type: string
                format: binary
        "400":
          description: the interface is not an index
        "403":
          description: forbidden
        "404":
          description: the interface is not being captured
