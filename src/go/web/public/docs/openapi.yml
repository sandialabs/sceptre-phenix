openapi: 3.0.0
info:
  description: |
    phenix API

    ## Ordering and freshness

    Every response of an `/api/v1` route past authentication carries
    `X-Phenix-Seq`. This excludes a 401 or 403 refusal of authentication, and
    an `OPTIONS` answer. `X-Phenix-Seq` is a number from one strictly
    increasing sequence per phenix process, taken as the request started.
    These responses also carry `Cache-Control: no-cache, private`, unless the
    endpoint says otherwise. Every message on the `/ws` websocket carries the
    same sequence in its `seq` field, taken as the message was published. A
    reply to a client request, such as an `experiment/vms` list, takes it
    before its data is read. Data tagged with seq S reflects every change
    whose message carries a seq of S or less. So a client keeps, per item, the
    highest seq it applied, and ignores data tagged lower. Sequence numbers
    are comparable only within one server process: reset them when the
    websocket reconnects.

    Responses that serve runtime state read from minimega may also carry
    `X-Phenix-Observed-At` and `X-Phenix-Stale: true`. `X-Phenix-Observed-At`
    is when the oldest data in the response was read, in RFC 3339. Compare it
    with the `Date` header. `X-Phenix-Stale: true` means that the data is
    older than its normal bound, such as earlier data served while minimega
    was busy.

    ## Versions

    Every response of an `/api/v1` route past authentication also carries
    `X-Phenix-Version`, the server's build. That is a release's version
    without its `v`, or `0.0.0-dev+<commit>` for any other build. `GET
    /docs/openapi.yml` serves this document with `info.version` set to the
    same value. So a client can tell whether the spec it was built from
    matches the server. The copy in the source tree says `0.0.0`.

    ## Idempotency

    The routes that start a background job take an optional
    `Idempotency-Key` header. These routes are `POST
    /experiments/{name}/files/archive`, `POST
    /experiments/{exp_name}/vms/actions` and `POST /disks/clone/jobs`. With
    the key, a client that lost the `202` answer can retry without starting
    a second job. A retry with the same key, by the same user to the same
    path, with the same body and query, gets the first answer again. That is
    the first request's `202`, `Location` and body, marked
    `Idempotent-Replayed: true`. The server refuses the same key with
    another body or query with 422. It refuses a retry with 409 while the
    server still serves the first request. Only `202` answers are kept, so
    a refused or failed request can be retried with its key. Keys live in
    the server's memory for an hour, at most 1000 of them, and the oldest
    are dropped first. A restart forgets them all.

    ## Errors and authentication

    Requests carry a token in `X-Phenix-Auth-Token: Bearer <token>`, or in a
    `token` query parameter for browser links, unless auth is disabled.
    Without a token, an API route answers 403. With a malformed, expired or
    signed-out token, or behind a proxy naming another user than the token's,
    it answers 401. A role without the permission a route needs gets 403. Some
    routes say that they answer 404 instead, so as not to reveal another
    user's job, console or token. An unknown `/api/v1` path is a 404, and a
    method a path does not take is a 405, both before authentication. The 405
    has an `Allow` header that lists the methods the path takes. An `OPTIONS`
    request answers 204 with the same `Allow` header, also before
    authentication, without running the route. `/login` and `/signup` ignore
    a token sent with them, so an expired token does not stop a new sign-in.
    With `--jwt-signing-key proxy-jwt`, the server reads the token only from
    the header, also on `/login` and `/signup`, and a missing or malformed
    token answers 400. With
    auth disabled, every request acts as global-admin. Behind a proxy serving
    phenix under a base path (`ui.base-path`), the proxy strips it, and the
    `Location` headers of jobs and configs carry it.

    Every error, refusals by authentication, RBAC and routing included,
    answers with the `Error` schema as `application/json`. The schema has a
    `message`, the `cause`, sometimes `metadata`, and a `code` to match on
    rather than the message. There are three exceptions. The `/webshark/`
    routes that WebShark itself calls answer in WebShark's own format. The
    health routes answer in `application/health+json`. A failed handshake on
    the console, VNC, port forward and SCORCH websockets answers in plain
    text.
  version: 0.0.0
  title: phenix
  contact:
    url: https://github.com/sandialabs/sceptre-phenix
  license:
    name: GNU General Public License v3.0
tags:
  - name: Configs
    description: Config details and controls
  - name: Schemas
    description: Config spec schemas
  - name: Experiments
    description: Experiments details and controls
  - name: Scorch
    description: >-
      SCORCH pipeline details and controls. A scenario's scorch app metadata
      defines one or more runs. Each run is a pipeline of configure, start,
      loop,
      stop and cleanup stages built from the components it names. These
      endpoints report those pipelines and their latest statuses, and start,
      cancel, clear and clean up a run.
  - name: Virtual Machines
    description: Experiment VM details and controls
  - name: Hosts
    description: Cluster host details
  - name: Applications
    description: Available phenix user applications
  - name: Topologies
    description: Available phenix topologies
  - name: Disks
    description: Available phenix disk images
  - name: Users
    description: User details and controls
  - name: Workflow
    description: Workflow config upserts and applies, and the server options clients read
  - name: Builder
    description: >
      Builder drafts, snapshots, generation and publication. Every operation
      needs the one Builder permission: the verb `use` on the resource
      `builder`. A role that holds it may read, change and delete every
      draft, template, icon and layer set, whoever made them. No permission
      applies to one draft, template, icon or layer set. Some operations read
      or write phenix configs: publish, import, export, sources, packages,
      preflight checks and published documents. Each of these operations
      also needs the config permissions that its description names.

      The icon library belongs to the server. Each icon has a name that is
      unique, ignoring case. Any caller may rename or delete an uploaded
      icon. No caller may rename or delete an icon of the server template
      files.

      The template library belongs to the server. Built-in templates and the
      items of the server template files are read only.

      Every response of a Builder operation carries
      `X-Content-Type-Options: nosniff` and `Cache-Control: no-store`,
      whatever its status, 304 included.

      `OPTIONS` on the path of any Builder operation answers 204 with the
      `Allow` header of that path. It reads and changes nothing.
  - name: State of Health
    description: State of health across experiments
  - name: Settings
    description: The web UI settings the store holds, and the parts of them every user reads
  - name: Logs
    description: The server's log entries
  - name: Events
    description: >-
      The websocket the web UI follows the server's changes on, and the
      requests it sends there
  - name: Console
    description: >-
      minimega consoles in the web UI (the server must run with
      --minimega-console). A console belongs to the user who started it. Only
      that user can check, attach to, resize or end it. For another user, the
      server reports the console as not found. A console keeps running while
      websockets attach and detach. It ends when its process exits, when
      it is deleted, or once no websocket has been attached for 15 seconds.
  - name: Features
    description: >-
      The optional features this server has enabled, which the web UI reads to
      decide what to offer, and the build it runs.
  - name: Tunneler
    description: >-
      phenix-tunneler builds this server offers for download. Unlike the other
      endpoints here, and like /features, these two are served from the server
      root, not under /api/v1. So each declares its own server. They need
      neither credentials nor a permission.
  - name: Health
    description: >-
      Liveness (/healthz) and readiness (/readyz) of this server, in the
      application/health+json format of the IETF draft
      draft-inadarei-api-health-check-06. Like /features, these are served
      from the server root rather than under /api/v1, and need no credentials.
      Every caller sees the statuses, observed values, versions and timings.
      Only an authenticated request (a valid token, or any request when
      auth is disabled) sees the `output` fields, which may name paths, hosts
      and errors.
  - name: Jobs
    description: >-
      Background jobs: long operations (bulk VM actions, experiment file
      archives, disk clones) that continue in the server after the request that
      starts them answers 202. A job belongs to the user who started it. Other
      users see, cancel or dismiss it only with the `jobs` permission on its
      experiment (`jobs/global` for a job of no experiment). Anyone else
      gets 404.
      Jobs live in the server's memory only: a restart loses them. A finished
      job is kept for an hour, at most 200 of them.
paths:
  "/configs":
    get:
      tags:
        - Configs
      summary: Get all phenix configs
      description: >-
        Lists the configs of the kind that the role may list, without their
        `spec` and `status`. Needs `configs` `list`.
      operationId: getConfigs
      parameters:
        - name: kind
          in: query
          description: limit configs to specified kind (defaults to all)
          required: false
          schema:
            type: string
            enum:
              - all
              - topology
              - scenario
              - experiment
              - image
              - user
              - role
            default: all
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Configs"
        "400":
          description: an unknown kind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: the role may not list configs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the store cannot list the configs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - Configs
      summary: Create new phenix config
      description: >
        Needs `configs` `create` on the config the body names, by its kind
        and name (such as `Topology/lab`). The server replaces each
        `${BRANCH_NAME}` placeholder with a value from its environment. It
        stores every other `${NAME}` placeholder as written.
      operationId: postConfigs
      requestBody:
        description: phenix config creation parameters
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Config"
          application/x-yaml:
            schema:
              $ref: "#/components/schemas/Config"
          multipart/form-data:
            schema:
              type: object
              required:
                - fileupload
              properties:
                fileupload:
                  title: "Fileupload"
                  description: "Configuration file to create or update."
                  example: |
                    apiVersion: phenix.sandia.gov/v1
                    kind: Topology
                    metadata:
                      name: lab
                    spec:
                      nodes: []
                  type: string
                  format: binary
      responses:
        "201":
          description: successful config creation
          headers:
            Location:
              description: location of newly created config, under the server's base path
              schema:
                type: string
                format: uri-reference
            ETag:
              $ref: "#/components/headers/ConfigETag"
            X-Phenix-Revision:
              $ref: "#/components/headers/ConfigRevision"
        "400":
          description: >
            unknown file extension, a multipart body without a `fileupload`
            file, unparsable body (the parser error in metadata.validation),
            unknown kind, a schema validation failure (explained
            lines in metadata.validation, original validator text in
            metadata.validation-raw), or a config hook or the store rejects the
            config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            the role may not create configs, or may not create one of this
            config's `Kind/name`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: a config with the same kind and name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: >-
            a Content-Type other than application/json, application/x-yaml or
            multipart/form-data (parameters such as `charset` are accepted). A
            request without a Content-Type is read as JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the request or the uploaded file cannot be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/configs/download":
    post:
      tags:
        - Configs
      summary: Download configs as YAML
      description: >-
        Sends one config as a YAML attachment named `<Kind>-<name>.yml`, or
        several as a zip attachment, `configs.zip`, of such files. An
        experiment config is sent without its `experimentName`, and a User
        config without its `password` and `tokens`. Needs the
        `configs` `get` permission. An archive leaves out a config the role may
        not get, but the server refuses a single config the role may not get.
        The server reads every config of an archive before it sends the
        archive. It builds the archive while it sends it, so a client cannot
        resume the download (`Accept-Ranges: none`).
      operationId: postConfigsDownload
      requestBody:
        description: the configs, each as `<Kind>/<name>`
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                example: Topology/demo
      responses:
        "200":
          description: the config, or the archive of configs
          content:
            text/plain:
              schema:
                type: string
                description: one config, as YAML
              example: |
                apiVersion: phenix.sandia.gov/v1
                kind: Topology
                metadata:
                  name: lab
                spec:
                  nodes: []
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          description: >-
            the body is not a list of config names, or a config does not
            exist or cannot be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: a config could not be converted to YAML
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/configs/{kind}/{name}":
    get:
      tags:
        - Configs
      summary: Get existing phenix config
      description: >-
        An Experiment config is sent without its `experimentName`, and a User
        config without its `password` hash and `tokens`. The ETag still names
        the stored revision, so it changes when only those fields do. Send
        `Accept: application/x-yaml` to get YAML; the default is JSON.
      operationId: getConfigsKindName
      parameters:
        - name: kind
          in: path
          description: kind of phenix config to get (a stored kind, not case-sensitive)
          required: true
          example: Topology
          schema:
            type: string
        - name: name
          in: path
          description: name of phenix config to get
          required: true
          example: lab
          schema:
            type: string
        - $ref: "#/components/parameters/ConfigIfNoneMatch"
      responses:
        "200":
          description: successful operation
          headers:
            ETag:
              $ref: "#/components/headers/ConfigETag"
            X-Phenix-Revision:
              $ref: "#/components/headers/ConfigRevision"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/Config"
        "304":
          $ref: "#/components/responses/ConfigNotModified"
        "403":
          description: the role may not get the config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the config, or its kind, does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "406":
          description: an Accept header other than application/json, application/x-yaml or `*/*`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags:
        - Configs
      summary: Update existing phenix config
      description: >
        Updates the config. A body that names another kind or `metadata.name`
        renames the config of the path. Needs `configs` `update` on the config
        of the path and, for a rename, `update` and `create` on the new
        `Kind/name`. A User config keeps its stored `password` and `tokens`,
        whatever the body holds; the users routes change them. The server
        replaces each `${BRANCH_NAME}` placeholder from its environment and
        stores every other `${NAME}` placeholder as written.

        A rename or kind change of a Topology removes the Builder documents
        published under its old name, as a delete does. Its `builder-doc`
        annotation loses the `id` and `digest` that Publish wrote, keeps a
        `path` and the `digest` beside it, and is removed when empty (see
        `BuilderDocumentReference`).
      operationId: putConfigsKindName
      parameters:
        - name: kind
          in: path
          description: kind of phenix config to update (a stored kind, not case-sensitive)
          required: true
          example: Topology
          schema:
            type: string
        - name: name
          in: path
          description: name of phenix config to update
          required: true
          example: lab
          schema:
            type: string
        - $ref: "#/components/parameters/ConfigIfMatch"
      requestBody:
        description: phenix config update parameters
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Config"
          application/x-yaml:
            schema:
              $ref: "#/components/schemas/Config"
          multipart/form-data:
            schema:
              type: object
              required:
                - fileupload
              properties:
                fileupload:
                  title: "Fileupload"
                  description: "Configuration file to create or update."
                  example: |
                    apiVersion: phenix.sandia.gov/v1
                    kind: Topology
                    metadata:
                      name: lab
                    spec:
                      nodes: []
                  type: string
                  format: binary
      responses:
        "204":
          description: successful config update
          headers:
            Location:
              description: location of updated config, under the server's base path
              schema:
                type: string
                format: uri-reference
            ETag:
              $ref: "#/components/headers/ConfigETag"
            X-Phenix-Revision:
              $ref: "#/components/headers/ConfigRevision"
        "400":
          description: >
            a malformed `If-Match` header, a body or uploaded file that is not
            valid JSON or YAML, an unknown file extension, a multipart body without a `fileupload` file, an
            unknown kind in the body, a schema
            validation failure (explained lines in metadata.validation, original
            validator text in
            metadata.validation-raw), or a config hook or the store rejects the
            config; for an Experiment config, also a failure to reconfigure the
            experiment after the updated config was stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            updating the config is not allowed, or, for a rename or a change
            of kind, creating a config of the new `Kind/name` is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the config, or the kind in the path, does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          description: >-
            the config is no longer at the `If-Match` revision, or does not
            exist, or, for a User config, it changed while the update ran.
            `metadata.revision` holds its current revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: >-
            a Content-Type other than application/json, application/x-yaml or
            multipart/form-data (parameters such as `charset` are accepted). A
            request without a Content-Type is read as JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the request or the uploaded file cannot be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - Configs
      summary: Delete existing phenix config
      description: >-
        Deletes the config and, for a Topology, the Builder documents published
        under it. Needs `configs` `delete`; `If-Match` makes the delete
        conditional.
      operationId: deleteConfigsKindName
      parameters:
        - name: kind
          in: path
          description: kind of phenix config to delete (a stored kind, not case-sensitive)
          required: true
          example: Topology
          schema:
            type: string
        - name: name
          in: path
          description: name of phenix config to delete
          required: true
          example: lab
          schema:
            type: string
        - $ref: "#/components/parameters/ConfigIfMatch"
      responses:
        "204":
          description: successful operation
        "400":
          description: a malformed If-Match header, or the config cannot be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: the role may not delete the config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the config, or its kind, does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          $ref: "#/components/responses/ConfigPreconditionFailed"
  "/schemas/{version}":
    get:
      tags:
        - Schemas
      summary: Get full schema (all config specs) for specific version
      description: >
        Each version's schema file holds the schemas of the config kinds stored
        at that version, and a config is validated against the file of its own
        apiVersion: v0 holds Workflow; v1 holds Topology, Experiment, Image,
        User and Role; v2 holds Scenario. Send `Accept: application/x-yaml` to
        get YAML; the default is JSON.
      operationId: getSchemasVersion
      parameters:
        - name: version
          in: path
          description: version of phenix config schema to get
          required: true
          schema:
            type: string
            enum:
              - "v0"
              - "v1"
              - "v2"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                openapi: "3.0.0"
                info:
                  title: phenix config specs
                  version: "2.0"
                paths: {}
                components:
                  schemas:
                    Scenario:
                      title: Scenario
                      type: object
                      required: [apps]
            application/x-yaml:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: unknown version or Accept content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: getting schemas is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/schemas/{kind}/{version}":
    get:
      tags:
        - Schemas
      summary: Get schema for specific config spec kind/version
      description: >
        A kind's schema exists only in the version it is stored at, the version
        its configs are validated against: Workflow in v0, Scenario in v2, and
        every other kind in v1. Send `Accept: application/x-yaml` to get YAML;
        the default is JSON.
      operationId: getSchemasKindVersion
      parameters:
        - name: kind
          in: path
          description: kind of phenix config schema to get
          required: true
          schema:
            type: string
            enum:
              - topology
              - scenario
              - experiment
              - image
              - user
              - role
              - workflow
        - name: version
          in: path
          description: version of phenix config schema to get
          required: true
          schema:
            type: string
            enum:
              - "v0"
              - "v1"
              - "v2"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                title: Scenario
                description: Schema describing the Scenario resource.
                type: object
                nullable: true
                required: [apps]
            application/x-yaml:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: unknown Accept content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: getting this schema is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            there is no schema for this kind or version, such as a v1 kind
            requested at v2, or an unknown version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments":
    get:
      tags:
        - Experiments
      summary: Get all phenix experiments
      description: >-
        Lists the experiments the role may list, with their VMs unless
        `vms=false`. Needs `experiments` `list`.
      operationId: getExperiments
      parameters:
        - name: vms
          in: query
          description: >-
            set to false to leave each experiment's VMs out (`vms` is empty)
            and not ask minimega about them. `vm_count` and `delayed_vms` come
            from the topology.
          required: false
          schema:
            type: boolean
            default: true
        - $ref: "#/components/parameters/PageNum"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: >-
            successful operation (`X-Phenix-Stale` is also set when the list
            leaves out stored experiments that could not be read)
          headers:
            X-Phenix-Seq:
              $ref: "#/components/headers/Seq"
            X-Phenix-Observed-At:
              $ref: "#/components/headers/ObservedAt"
            X-Phenix-Stale:
              $ref: "#/components/headers/Stale"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiments"
        "400":
          description: pageNum or perPage is not a whole number from 1 to 2147483647
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: the role may not list experiments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the store could not be read, so no experiments are known
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - Experiments
      summary: Create new phenix experiment
      description: >-
        Creates a stopped experiment from a topology and an optional scenario,
        and announces it to websocket clients. Needs `experiments` `create`.
      operationId: postExperiments
      requestBody:
        description: phenix experiment creation parameters
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - topology
              properties:
                name:
                  title: "Name"
                  description: "Name of the new experiment."
                  example: lab-1
                  type: string
                topology:
                  title: "Topology"
                  description: name of the Topology config to build the experiment from
                  example: lab
                  type: string
                scenario:
                  title: "Scenario"
                  description: name of the Scenario config to use
                  example: lab-scenario
                  type: string
                disabled_apps:
                  title: "Disabled Apps"
                  description: scenario apps to leave out of the experiment
                  type: array
                  items:
                    example: example-app
                    type: string
                vlan_min:
                  title: "VLAN Min"
                  description: "Lowest VLAN ID allocated to the experiment."
                  example: 100
                  type: integer
                  minimum: 0
                vlan_max:
                  title: "VLAN Max"
                  description: "Highest VLAN ID allocated to the experiment."
                  example: 200
                  type: integer
                  minimum: 0
                workflow_branch:
                  title: "Workflow Branch"
                  example: main
                  description: >-
                    stored as the phenix.workflow/branch experiment annotation,
                    so `annotations` may not also set it
                  type: string
                deploy_mode:
                  title: "Deploy Mode"
                  description: >-
                    VM deployment mode: all, no-headnode, or only-headnode. Not
                    case-sensitive. The server replaces an unknown value with
                    its default.
                  example: all
                  type: string
                  enum: ["", no-headnode, only-headnode, all]
                default_bridge:
                  title: "Default Bridge"
                  description: "Minimega bridge assigned to interfaces without an explicit bridge."
                  example: phenix
                  type: string
                use_gre_mesh:
                  title: "Use Gre Mesh"
                  description: "Whether to connect cluster hosts with a GRE mesh."
                  example: false
                  type: boolean
                node_annotations:
                  title: Node Annotations
                  description: >-
                    added to every VM in the experiment's copy of the topology
                    (the topology config is unchanged). A VM's own annotation
                    for the same key has priority. Values keep their JSON type.
                    phenix/default-apps must be a boolean,
                    phenix/startup-autotunnel a list of strings, and
                    vrouter/vyos-password and vrouter/enable-ssh strings.
                    phenix/startup-autotunnel needs the `vms/forwards`
                    `create` permission on `<exp>/<vm>` for every VM.
                  type: object
                  additionalProperties: {}
                annotations:
                  title: Annotations
                  description: >-
                    added to the experiment's metadata annotations. phenix
                    rejects topology and scenario, because it sets them.
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "204":
          description: >-
            experiment created. The server announces it to websocket clients as
            an experiment create event.
        "400":
          description: invalid request, such as an annotation phenix rejects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            forbidden, including a phenix/startup-autotunnel node annotation
            without permission to create port forwards to every VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            an experiment with this name already exists, or phenix is already
            acting on an experiment with this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: >-
            the request body could not be read, the store could not read the
            topology or store the experiment, or the experiment could not be
            read after it was created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{name}":
    get:
      tags:
        - Experiments
      summary: Get existing phenix experiment
      description: >-
        Returns the experiment with a filtered, sorted and paged list of its
        VMs. Needs `experiments` `get`.
      operationId: getExperimentsName
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get
          required: true
          example: exp1
          schema:
            type: string
        - name: screenshot
          in: query
          description: whether or not to include VM screenshots (value is size to grab)
          required: false
          example: "200"
          schema:
            type: string
        - name: vms
          in: query
          description: >-
            set to false to leave the VMs out (`vms` is empty) and not ask
            minimega about them. `vm_count` and `delayed_vms` come from the VMs
            configured in the topology. Ignored when screenshot is set.
          required: false
          schema:
            type: boolean
            default: true
        - name: filter
          in: query
          description: search expression the VMs must match
          required: false
          example: router
          schema:
            type: string
        - name: label
          in: query
          description: >-
            a `key=value` label (split at the first `=`). With labels, only the
            VMs that carry at least one of them are listed. May be repeated.
          required: false
          explode: true
          example: [role=router]
          schema:
            type: array
            items:
              type: string
              pattern: "^[^=]+=.*$"
        - name: host
          in: query
          description: >-
            a cluster host. With hosts, only the VMs running on one of them are
            listed (and with labels too, only those that also carry a label).
            May be repeated. An empty host is a `400`.
          required: false
          explode: true
          example: [compute-01]
          schema:
            type: array
            items:
              type: string
              minLength: 1
        - name: show_dnb
          in: query
          description: any value includes the VMs marked do not boot
          required: false
          example: "true"
          schema:
            type: string
        - name: sortCol
          in: query
          description: >-
            column to sort the VMs by, used with sortDir. `labels` sorts by how
            many labels and notes a VM has. `network` sorts by the VLAN IDs of
            its interfaces as numbers, and `taps` by their tap names. Both sort
            in interface order and put VMs that have none last. Ties sort by
            name A to Z in either direction.
          required: false
          schema:
            type: string
            enum: [name, host, uptime, delayed, labels, network, taps]
        - name: sortDir
          in: query
          description: sort direction, used with sortCol
          required: false
          schema:
            type: string
            enum: [asc, desc]
        - name: pageNum
          in: query
          description: page to return, from 1, used with perPage
          required: false
          example: 1
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: perPage
          in: query
          description: VMs per page, used with pageNum
          required: false
          example: 25
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        "200":
          description: >-
            successful operation. `vms` holds the requested page, and `vm_count`
            holds how many VMs match before paging.
          headers:
            X-Phenix-Seq:
              $ref: "#/components/headers/Seq"
            X-Phenix-Observed-At:
              $ref: "#/components/headers/ObservedAt"
            X-Phenix-Stale:
              $ref: "#/components/headers/Stale"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
        "400":
          description: >-
            pageNum or perPage is not a whole number from 1 to 2147483647, or a
            `label` has no `=` or an empty key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: the role may not get the experiment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the experiment does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the experiment could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - Experiments
      summary: Delete existing phenix experiment
      description: >-
        Deletes a stopped experiment and its files. Needs `experiments`
        `delete`.
      operationId: deleteExperimentsName
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to delete
          required: true
          example: exp1
          schema:
            type: string
      responses:
        "204":
          description: successful operation
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the experiment does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: the experiment is running, starting or stopping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: >-
            the experiment could not be deleted. Or phenix deleted it, but
            could not delete all of its files. Then the server announces the
            delete to websocket clients as it does for a 204.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags:
        - Experiments
      summary: Update VLAN assignments for a stopped experiment
      description: >-
        Updates aliases already assigned to VLAN IDs and ignores unknown
        aliases. Needs the `experiments` `patch` permission.
      operationId: patchExperimentsName
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to update
          required: true
          example: exp1
          schema:
            type: string
      requestBody:
        description: VLAN alias to VLAN ID assignments
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: integer
            example:
              EXP: 101
              MGMT: 102
      responses:
        "204":
          description: experiment updated
        "400":
          description: the experiment is running, or the body is not a map of aliases to VLAN IDs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no such experiment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the experiment could not be read or written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{name}/apps":
    get:
      tags:
        - Experiments
      summary: Get whether each of an experiment's apps is running
      description: >-
        Maps each app the experiment's scenario names, and any app its status
        reports, to whether the app's running stage is running now. Needs the
        `experiments/apps` `get` permission.
      operationId: getExperimentsNameApps
      parameters:
        - name: name
          in: path
          description: name of phenix experiment
          required: true
          example: exp1
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean
                example:
                  soh: false
                  scorch: true
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the experiment does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the experiment could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{name}/start":
    post:
      tags:
        - Experiments
      summary: Start existing phenix experiment
      description: >-
        Starts the experiment. Before minimega launches a VM, phenix checks that
        each disk image and CD-ROM image of the VMs exists. It also checks that
        the backing chain of each disk image is complete, and that qemu can
        open each image of the chain. The `experiment.disk-check` setting
        controls these checks. A missing file or an image that qemu cannot
        open refuses the start with 400, the code `broken_disks`, and each VM,
        disk and problem in `details.disks`.
        Needs the `experiments/start` `update` permission.
      operationId: postExperimentsNameStart
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to start
          required: true
          example: exp1
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
        "400":
          description: >-
            the start failed. For a missing disk image or CD-ROM image, a
            broken backing chain, or an image that qemu cannot open, the code
            is `broken_disks`. Then
            `details.disks`
            lists each one, and the experiment stays stopped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the experiment does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            the experiment is already running, starting or stopping, or another
            phenix process, such as `phenix experiment start`, starts it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the experiment started, but could not be read again or encoded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{name}/stop":
    post:
      tags:
        - Experiments
      summary: Stop existing phenix experiment
      description: >-
        Runs the apps' cleanup stage and kills the experiment's VMs. When
        minimega cannot kill them, the experiment stays running so the stop can
        be tried again, and the 502 error carries `metadata.retry` `force`.
        Needs the `experiments/stop` `update` permission.
      operationId: postExperimentsNameStop
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to stop
          required: true
          example: exp1
          schema:
            type: string
        - name: force
          in: query
          description: >
            Marks the experiment stopped even when minimega cannot kill its VMs,
            as for an unreachable minimega. You must clear VMs left behind in
            minimega by hand. A value that is not a boolean is refused with 400.
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
        "400":
          description: the force value is not a boolean, or stopping it failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the experiment does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: the experiment is not running, or is already starting or stopping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: >-
            minimega could not kill the experiment's VMs, so it is still
            running (`metadata.retry` is `force`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the experiment could not be read after it stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{name}/schedule":
    get:
      tags:
        - Experiments
      summary: Get current schedule for existing experiment
      description: >-
        Returns the host that each VM is placed on. Needs
        `experiments/schedule` `get`.
      operationId: getExperimentsNameSchedule
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get schedule for
          required: true
          example: exp1
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the experiment does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: the experiment is starting, stopping or being changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the experiment could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - Experiments
      summary: Update current schedule for existing experiment
      description: >-
        Places the VMs of a stopped experiment on cluster hosts with the named
        algorithm. Needs `experiments/schedule` `create`.
      operationId: postExperimentsNameSchedule
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to update schedule for
          required: true
          example: exp1
          schema:
            type: string
      requestBody:
        description: scheduling algorithm to use
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                algorithm:
                  title: "Algorithm"
                  description: >-
                    Scheduling algorithm used to assign VMs to cluster hosts:
                    `round-robin`, `subnet-compute` or `isolate-experiment`.
                  example: round-robin
                  type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          description: the body is malformed or names no known scheduling algorithm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the experiment does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            the experiment is running, starting or stopping, or the cluster has
            no host the algorithm can schedule a VM on
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the request body or the experiment could not be read, or scheduling failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{name}/captures":
    get:
      tags:
        - Experiments
      summary: Get captures for existing experiment
      description: >-
        Lists the running captures of the experiment that the role may list.
        Needs `experiments/captures` `list`.
      operationId: getExperimentsNameCaptures
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get captures for
          required: true
          example: exp1
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Captures"
        "403":
          description: the role may not list the experiment's captures
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the captures could not be encoded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{exp_name}/webshark":
    post:
      tags:
        - Experiments
      summary: Name a packet capture for WebShark to open
      description: >-
        Returns a random name under which the WebShark viewer (served at
        `/webshark/` when installed) opens a capture, at
        `/webshark/embed?capture=<name>&embed=1`. The capture is a saved file,
        by its path in the experiment's files, which needs `experiments/files`
        `get`. Or it is a VM interface's running capture, which also needs
        `vms/captures` `list` on `<exp>/<vm>`. A file still being captured
        opens live. WebShark sends no credentials, so the name is a capture
        grant, bound to the caller and its session, and each use checks that
        the caller may still read the capture. The name ends 2 hours after its
        last use or 12 hours after it was given, whichever is first. It also
        ends with the session (sign-out or token expiry), or when the
        experiment or the capture file is deleted.
      operationId: postExperimentsNameWebshark
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          example: exp1
          schema:
            type: string
      requestBody:
        description: the capture to open, a file `path` or a `vm` and `interface`
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  title: Path
                  type: string
                  description: a .pcap, .pcapng or .cap experiment file, optionally gzipped
                  example: captures/router_eth0.pcap
                vm:
                  title: VM
                  example: router
                  type: string
                  description: VM with a running capture (with interface)
                interface:
                  title: Interface
                  example: 0
                  type: integer
                  minimum: 0
                  description: index of the VM interface being captured
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  capture:
                    title: Capture
                    example: router-k2j4m6n8p1q3r5s7t9v2w4x6y8.pcap
                    type: string
                    description: the name WebShark opens the capture by
                  live:
                    title: Live
                    example: false
                    type: boolean
                    description: whether the capture is still running
                  title:
                    title: Title
                    description: how the WebShark page names the capture, the file's path or `<vm> interface <n> (live)`
                    example: captures/router_eth0.pcap
                    type: string
                  id:
                    title: ID
                    type: string
                    description: >-
                      the grant's ID, not secret, which
                      `/experiments/{exp_name}/captureTokens` lists and
                      revokes it by
                    example: 3f9a0c51d2e47b86
                  expires:
                    title: Expires
                    example: "2026-01-01T12:00:00Z"
                    type: string
                    format: date-time
                    description: when the name stops working at the latest
        "400":
          description: >-
            a body that is not valid JSON or is larger than 4 KiB, neither or
            both of a path and a VM, or a VM without an interface index. Also
            a path that is not clean and relative to the files
            directory, or not a capture file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no such file, or the interface is not being captured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: WebShark is not installed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the capture file or the running capture could not be opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{exp_name}/captureTokens":
    post:
      tags:
        - Experiments
      summary: Give a capture token
      description: >-
        Gives the caller a capture token for one capture, named as
        `/experiments/{exp_name}/webshark` takes it and with the same
        permissions. With `"operations": ["stream"]` (a running capture
        only), a command outside the browser streams the capture as pcap with
        `GET /webshark/streams/{token}`. That route needs no other credentials
        and is outside `/api/v1`, under the UI's base path. Because of this,
        `curl -fsSN '<origin>/webshark/streams/<token>' | wireshark -k -i -`
        works without the caller's session token. A stream token starts streams
        for 5 minutes, from the start of the capture or with `?from=now`. A
        stream it started ends with the caller's session, or 24 hours after the
        token was given when the server does not sign users in. With any of
        `view`, `download` and `watch`, the token is a WebShark capture name. A
        token is bound to the caller and the session it was given under. Each
        use checks that the caller may still read the capture. Signing out,
        deleting the user, deleting the experiment or the capture file, and
        revoking the token end it. Stopping the
        experiment ends its stream tokens. Tokens are kept in the server's
        memory, so a restart ends them all.
      operationId: postExperimentsNameCaptureTokens
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          example: exp1
          schema:
            type: string
      requestBody:
        description: the capture and the operations that the token allows
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureTokenRequest"
      responses:
        "201":
          description: the token, which no other response shows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureToken"
        "400":
          description: >-
            a body that is not valid JSON or is larger than 4 KiB, no or
            unknown operations, stream with other operations, a stream
            of a capture that is not running, or a capture named as
            `/experiments/{exp_name}/webshark` refuses it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no such file, or the interface is not being captured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: WebShark is not installed (for view, download and watch)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the capture file or the running capture could not be opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags:
        - Experiments
      summary: List the caller's capture tokens
      description: >-
        Lists the caller's own capture tokens for the experiment that have
        not ended, WebShark capture names included, without the tokens.
      operationId: getExperimentsNameCaptureTokens
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          example: exp1
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureTokenList"
  "/experiments/{exp_name}/captureTokens/{id}":
    delete:
      tags:
        - Experiments
      summary: Revoke a capture token
      description: >-
        Revokes one of the caller's own capture tokens, ending the streams
        and WebShark watches it opened.
      operationId: deleteExperimentsNameCaptureTokensId
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          example: exp1
          schema:
            type: string
        - name: id
          in: path
          description: the token's ID
          required: true
          example: 3f9a0c51d2e47b86
          schema:
            type: string
      responses:
        "204":
          description: revoked
        "404":
          description: no such token of the caller's, or it has ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{name}/captureSubnet":
    post:
      tags:
        - Experiments
      summary: Capture the interfaces of an experiment's VMs on a subnet
      description: >-
        Starts a packet capture on each interface of the running experiment's
        VMs whose address is in the subnet, or of the listed VMs only. Needs
        the `exp/captureSubnet` `create` permission.
      operationId: postExperimentsNameCaptureSubnet
      parameters:
        - name: name
          in: path
          description: name of phenix experiment
          required: true
          example: exp1
          schema:
            type: string
      requestBody:
        description: the subnet and, optionally, the VMs to capture
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureSubnetRequest"
      responses:
        "200":
          description: the captures started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Captures"
        "400":
          description: the body is not a capture request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: >-
            the experiment is not running, the subnet is not a CIDR prefix, or
            a capture could not be started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{name}/captureVlan":
    post:
      tags:
        - Experiments
      summary: Capture the interfaces of an experiment's VMs on a VLAN
      description: >-
        Starts a packet capture on each interface on the VLAN of the running
        experiment's VMs, or of the listed VMs only. It acts only on the VMs
        for which the role has the `vms/captures` `create` permission
        (`<experiment>/<vm>`), and skips the others. Each capture that starts
        is published on the `/ws` websocket as an `experiment/vm/capture`
        resource with the action `start`.
      operationId: postExperimentsNameCaptureVlan
      parameters:
        - name: name
          in: path
          description: name of phenix experiment
          required: true
          example: exp1
          schema:
            type: string
      requestBody:
        description: the VLAN alias and, optionally, the VMs to capture
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureVlanRequest"
      responses:
        "200":
          description: the captures that started, on the VLAN's interfaces only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Captures"
        "400":
          description: the body is not a capture request, or it has no VLAN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            the role may capture none of the experiment's VMs, or none of the
            listed VMs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the experiment does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: >-
            the experiment is not running, it could not be read, or a capture
            could not be started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{name}/files":
    get:
      tags:
        - Experiments
      summary: Get list of files for experiment
      description: >-
        Lists the experiment's files on the head node and every mesh node.
        A listing is reused for a few seconds, so a file written just before
        the request may not be in it yet. `X-Phenix-Observed-At` says when it
        was read. Needs the `experiments/files` `list` permission.
      operationId: getExperimentsNameFiles
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get files for
          required: true
          example: exp1
          schema:
            type: string
        - name: filter
          in: query
          description: search expression the files must match
          required: false
          example: pcap
          schema:
            type: string
        - name: sortCol
          in: query
          description: column to sort by, used with sortDir
          required: false
          schema:
            type: string
            enum: [name, date, size]
        - name: sortDir
          in: query
          description: sort direction, used with sortCol
          required: false
          schema:
            type: string
            enum: [asc, desc]
        - name: pageNum
          in: query
          description: page to return, from 1, used with perPage
          required: false
          example: 1
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: perPage
          in: query
          description: files per page, used with pageNum
          required: false
          example: 25
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Files"
          headers:
            X-Phenix-Seq:
              $ref: "#/components/headers/Seq"
            X-Phenix-Observed-At:
              $ref: "#/components/headers/ObservedAt"
        "400":
          description: pageNum or perPage is not a whole number from 1 to 2147483647
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: >-
            minimega could not list the files of every cluster node, so the
            listing would be incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{name}/files/download":
    post:
      tags:
        - Experiments
      summary: Download several experiment files as a zip archive
      description: >-
        Streams a zip archive (`<name>-files.zip`) of the listed files, each
        stored under its path relative to the experiment's files directory.
        Every path is checked before anything is sent. Needs the
        `experiments/files` `get` permission. At most 500 files totaling
        2 GiB are allowed. The archive is built as it is sent, so it cannot
        be resumed (`Accept-Ranges: none`). Download very large files one at
        a time with `GET /experiments/{name}/files/{filename}`.
      operationId: postExperimentsNameFilesDownload
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to download files from
          required: true
          example: exp1
          schema:
            type: string
      requestBody:
        description: the files to put in the archive
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilePaths"
      responses:
        "200":
          description: zip archive of the files
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          description: >-
            a body that is not valid JSON or is larger than 1 MiB, no paths, a
            path that is not clean and relative to the files directory, or a
            pcap a running capture is still writing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: a path is not one of the experiment's files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: more than 500 files, or more than 2 GiB in total
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: a file could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{name}/files/archive":
    post:
      tags:
        - Experiments
        - Jobs
      summary: Build a zip archive of several experiment files in a background job
      description: >-
        Checks the files as POST .../files/download does. Then it builds their
        zip archive in a `files.archive` background job. The job's items are the
        files, and its progress counts the bytes read. The job leaves out a file
        that it cannot fetch and ends `partial`. The archive is then named
        `<name>-files-incomplete.zip` instead of `<name>-files.zip`, and lists
        the file with the reason in a `MISSING.txt` entry. Download the archive,
        which resumes, from GET /jobs/{id}/artifact. Canceling the job leaves no
        archive. Needs the `experiments/files` `get` permission.
      operationId: postExperimentsNameFilesArchive
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: name
          in: path
          description: name of phenix experiment to archive files from
          required: true
          example: exp1
          schema:
            type: string
      requestBody:
        description: the files to archive
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilePaths"
      responses:
        "202":
          description: the job, started
          headers:
            Location:
              description: the job, at /api/v1/jobs/{id} under the server's base path
              schema:
                type: string
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          description: >-
            a body that is not valid JSON or is larger than 1 MiB, no paths, a
            path that is not clean and relative to the files directory, a pcap
            that a running capture writes, or an invalid `Idempotency-Key`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: a path is not one of the experiment's files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: more than 500 files, or more than 2 GiB in total
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/IdempotencyKeyInFlight"
        "422":
          $ref: "#/components/responses/IdempotencyKeyReused"
        "429":
          description: >-
            too many of the user's jobs, or of all jobs, are waiting to run
            (`Retry-After` says when to try again)
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            the server is shutting down and starts no more jobs (`Retry-After`
            says when to try again)
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: a file could not be read, or the job could not be started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{name}/files/delete":
    post:
      tags:
        - Experiments
      summary: Delete several experiment files
      description: >-
        Deletes the listed files from the head node and every mesh node that
        has them. Files that cannot be deleted are listed with the reason and
        the rest are still deleted. Needs the `experiments/files` `delete`
        permission.
      operationId: postExperimentsNameFilesDelete
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to delete files from
          required: true
          example: exp1
          schema:
            type: string
      requestBody:
        description: the files to delete
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilePaths"
      responses:
        "200":
          description: files deleted, and those that were not
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilesDeleted"
        "400":
          description: an invalid request body, or no paths given
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: deleting the files failed (any of them may remain)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{name}/files/{filename}":
    get:
      tags:
        - Experiments
      summary: Download experiment file
      description: >-
        Streams the file from disk as an attachment, copying it to the head
        node first if only a mesh node has it. Downloads resume: send `Range`
        with `If-Range` set to the `ETag` of an earlier response. The server
        sends the rest of the file (206) only while the file is unchanged. It
        sends a changed file whole (200). Downloads are never gzip-compressed.
        With `Accept: text/plain`, the server instead sends the file inline as
        `text/plain; charset=utf-8` for the Files tab's viewer. It compresses
        the file with gzip for clients that accept it (with a weak `ETag`). It
        refuses a file over 10 MiB with 413. Needs the `experiments/files` `get`
        permission.
      operationId: getExperimentsNameFilesFilename
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get file from
          required: true
          example: exp1
          schema:
            type: string
        - name: filename
          in: path
          description: >-
            name the download is saved as (sent in Content-Disposition). `path`
            names the file that is sent.
          required: true
          example: router_eth0.pcap
          schema:
            type: string
        - name: path
          in: query
          description: path of the file relative to the experiment's files directory, as listed
          required: true
          example: captures/router_eth0.pcap
          schema:
            type: string
        - $ref: "#/components/parameters/RangeHeader"
        - $ref: "#/components/parameters/IfRangeHeader"
        - $ref: "#/components/parameters/IfNoneMatchHeader"
        - $ref: "#/components/parameters/IfMatchHeader"
      responses:
        "200":
          description: the whole file
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/LastModified"
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
            Repr-Digest:
              $ref: "#/components/headers/ReprDigest"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
        "206":
          $ref: "#/components/responses/PartialContent"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: >-
            the path is not clean and relative to the files directory, or a
            running capture is still writing the pcap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the path is not one of the experiment's files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "413":
          description: "asked for with `Accept: text/plain`, and the file is over 10 MiB"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
        "500":
          description: the file could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    head:
      tags:
        - Experiments
      summary: Check an experiment file download
      description: >-
        The GET response's headers without the file: its size
        (Content-Length), `ETag` and `Last-Modified`. `Accept: text/plain`
        checks the inline view, as for GET. Needs the `experiments/files`
        `get` permission.
      operationId: headExperimentsNameFilesFilename
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get file from
          required: true
          example: exp1
          schema:
            type: string
        - name: filename
          in: path
          description: >-
            name the download is saved as (sent in Content-Disposition). `path`
            names the file that is sent.
          required: true
          example: router_eth0.pcap
          schema:
            type: string
        - name: path
          in: query
          description: path of the file relative to the experiment's files directory, as listed
          required: true
          example: captures/router_eth0.pcap
          schema:
            type: string
        - $ref: "#/components/parameters/RangeHeader"
        - $ref: "#/components/parameters/IfRangeHeader"
        - $ref: "#/components/parameters/IfNoneMatchHeader"
        - $ref: "#/components/parameters/IfMatchHeader"
      responses:
        "200":
          description: the file's headers
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/LastModified"
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
            Repr-Digest:
              $ref: "#/components/headers/ReprDigest"
        "206":
          $ref: "#/components/responses/PartialContent"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: >-
            the path is not clean and relative to the files directory, or a
            running capture is still writing the pcap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the path is not one of the experiment's files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "413":
          description: "asked for with `Accept: text/plain`, and the file is over 10 MiB"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
        "500":
          description: the file could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - Experiments
      summary: Delete experiment file
      description: >-
        Deletes the file from the head node and every mesh node that has it.
        Needs the `experiments/files` `delete` permission.
      operationId: deleteExperimentsNameFilesFilename
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to delete the file from
          required: true
          example: exp1
          schema:
            type: string
        - name: filename
          in: path
          description: name of the file. The server ignores it; `path` names the file to delete.
          required: true
          example: router_eth0.pcap
          schema:
            type: string
        - name: path
          in: query
          description: path of the file relative to the experiment's files directory, as listed
          required: true
          example: captures/router_eth0.pcap
          schema:
            type: string
      responses:
        "204":
          description: file deleted
        "400":
          description: >-
            the path is not clean and relative to the files directory, or names
            a pcap that a running capture is still writing. Also a path with
            characters that minimega would read as a glob or several arguments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the path is not one of the experiment's files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the file could not be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{name}/files/{filename}/checksum":
    get:
      tags:
        - Experiments
      summary: Get an experiment file's SHA-256 checksum
      description: >-
        Computes the file's SHA-256 in the background, at most two files at
        a time server-wide. It keeps the checksum in memory for as long as the
        file is unchanged. The answer is 202 until the checksum is known (a
        small file's comes back immediately),
        then 200. From then on, downloads of the file carry it as
        `Repr-Digest`. Needs the `experiments/files` `get` permission.
      operationId: getExperimentsNameFilesFilenameChecksum
      parameters:
        - name: name
          in: path
          description: name of phenix experiment the file belongs to
          required: true
          example: exp1
          schema:
            type: string
        - name: filename
          in: path
          description: the file's name (`path` names the file)
          required: true
          example: router_eth0.pcap
          schema:
            type: string
        - name: path
          in: query
          description: path of the file relative to the experiment's files directory, as listed
          required: true
          example: captures/router_eth0.pcap
          schema:
            type: string
      responses:
        "200":
          description: the file's checksum
          headers:
            Repr-Digest:
              $ref: "#/components/headers/ReprDigest"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileChecksum"
        "202":
          description: the server is computing the checksum. Ask again later.
          headers:
            Retry-After:
              description: seconds to wait before asking again
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileChecksum"
        "400":
          description: >-
            the path is not clean and relative to the files directory, or a
            running capture is still writing the pcap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the path is not one of the experiment's files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: the file changed while the server hashed it. Ask again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the file could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{name}/netflow":
    get:
      tags:
        - Experiments
      summary: Check whether an experiment's netflow capture is running
      description: Needs the `experiments/netflow` `get` permission.
      operationId: getExperimentsNameNetflow
      parameters:
        - name: name
          in: path
          description: name of phenix experiment
          required: true
          example: exp1
          schema:
            type: string
      responses:
        "204":
          description: the netflow capture is running
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no netflow capture is running for the experiment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - Experiments
      summary: Start a netflow capture of an experiment
      description: >-
        Has every cluster node send the netflow records of the experiment's
        bridge to the server. The server sends them to the clients of `GET
        /experiments/{name}/netflow/ws`, and records them up to
        `ui.netflow.max-size` (see `GET /experiments/{name}/netflow/captures`).
        A
        capture that cannot be recorded still starts. The experiment must be running
        and have its own default bridge, not `phenix`. Needs the
        `experiments/netflow` `create` permission.
      operationId: postExperimentsNameNetflow
      parameters:
        - name: name
          in: path
          description: name of phenix experiment
          required: true
          example: exp1
          schema:
            type: string
      responses:
        "204":
          description: the netflow capture has started
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the experiment does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            the capture is already running, the experiment is not running, or
            its default bridge is `phenix`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the experiment could not be read, or the capture could not be started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - Experiments
      summary: Stop an experiment's netflow capture
      description: >-
        Stops the capture on every cluster node and closes its websocket
        clients normally (1000, `netflow stopped`). Needs the
        `experiments/netflow` `delete` permission.
      operationId: deleteExperimentsNameNetflow
      parameters:
        - name: name
          in: path
          description: name of phenix experiment
          required: true
          example: exp1
          schema:
            type: string
      responses:
        "204":
          description: the netflow capture has stopped
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no netflow capture is running for the experiment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: a cluster node could not stop the capture
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{name}/netflow/captures":
    get:
      tags:
        - Experiments
      summary: List an experiment's recorded netflow captures
      description: >-
        Every netflow capture is recorded to the experiment's files, as
        `netflow/<id>.txt`, up to the server's `ui.netflow.max-size`. Lists
        them newest first. A capture that is still running is `recording`, and
        one that stopped is `stopped`. A capture that the server did not finish
        (it stopped or restarted while recording) is `interrupted`, with an
        unknown flow count. Needs the `experiments/netflow` `get` permission.
      operationId: getExperimentsNameNetflowCaptures
      parameters:
        - name: name
          in: path
          description: name of phenix experiment
          required: true
          example: exp1
          schema:
            type: string
      responses:
        "200":
          description: the experiment's captures, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetflowCaptureList"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: there is no such experiment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the captures could not be listed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{name}/netflow/captures/{id}":
    get:
      tags:
        - Experiments
      summary: Download a recorded netflow capture
      description: >-
        Sends the capture as an attachment. `text` is the recorded file, every
        line as minimega sent it, and resumes like an experiment file download
        (`Range` with `If-Range`). `csv` and `jsonl` convert each flow as it is
        sent, skip lines that do not parse, and cannot be resumed
        (`Accept-Ranges: none`). A capture that is still recording is sent as
        it was at the request. Downloads are never gzip-compressed. Needs the
        `experiments/netflow` `get` permission.
      operationId: getExperimentsNameNetflowCapturesId
      parameters:
        - name: name
          in: path
          description: name of phenix experiment
          required: true
          example: exp1
          schema:
            type: string
        - name: id
          in: path
          description: the capture's ID, its UTC start time, as listed
          required: true
          schema:
            type: string
            pattern: '^[0-9]{8}T[0-9]{6}\.[0-9]{3}Z$'
            example: 20261028T153012.345Z
        - name: format
          in: query
          description: >-
            `text` for the lines as minimega sent them, `csv` or `jsonl` for
            the flows converted to Elastic Common Schema fields: `event.start`,
            `event.end`, `event.duration`, `source.ip`, `source.port`,
            `destination.ip`, `destination.port`, `network.transport`,
            `network.iana_number`, `network.packets` and `network.bytes`
          required: false
          schema:
            type: string
            enum: [text, csv, jsonl]
            default: text
        - $ref: "#/components/parameters/RangeHeader"
        - $ref: "#/components/parameters/IfRangeHeader"
        - $ref: "#/components/parameters/IfNoneMatchHeader"
        - $ref: "#/components/parameters/IfMatchHeader"
      responses:
        "200":
          description: the whole capture, in the format asked for
          headers:
            Content-Disposition:
              description: "`attachment`, named `<exp>-netflow-<id>.txt`, `.csv` or `.jsonl`"
              schema:
                type: string
            Accept-Ranges:
              description: "`bytes` for text, and `none` for CSV and JSONL, which are converted as they are sent"
              schema:
                type: string
                enum: [bytes, none]
            ETag:
              description: >-
                strong validator built from the file's inode, size and
                modification time. Sent for `format=text` only.
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
            application/x-ndjson:
              schema:
                type: string
                format: binary
        "206":
          $ref: "#/components/responses/PartialContent"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: >-
            the format is not `text`, `csv` or `jsonl`, or the ID is not a
            capture ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: there is no such experiment, or no capture with the ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
        "500":
          description: the capture could not be opened or read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    head:
      tags:
        - Experiments
      summary: Check a recorded netflow capture download
      description: >-
        The GET response's headers without the capture. CSV and JSONL are
        not converted and ignore `Range`. Needs the `experiments/netflow`
        `get` permission.
      operationId: headExperimentsNameNetflowCapturesId
      parameters:
        - name: name
          in: path
          description: name of phenix experiment
          required: true
          example: exp1
          schema:
            type: string
        - name: id
          in: path
          description: the capture's ID, its UTC start time, as listed
          required: true
          schema:
            type: string
            pattern: '^[0-9]{8}T[0-9]{6}\.[0-9]{3}Z$'
            example: 20261028T153012.345Z
        - name: format
          in: query
          description: >-
            `text` for the lines as minimega sent them, `csv` or `jsonl` for
            the flows converted to Elastic Common Schema fields
          required: false
          schema:
            type: string
            enum: [text, csv, jsonl]
            default: text
        - $ref: "#/components/parameters/RangeHeader"
        - $ref: "#/components/parameters/IfRangeHeader"
        - $ref: "#/components/parameters/IfNoneMatchHeader"
        - $ref: "#/components/parameters/IfMatchHeader"
      responses:
        "200":
          description: the download's headers
          headers:
            Content-Disposition:
              description: "`attachment`, named `<exp>-netflow-<id>.txt`, `.csv` or `.jsonl`"
              schema:
                type: string
            Accept-Ranges:
              description: "`bytes` for text, and `none` for CSV and JSONL, which are converted as they are sent"
              schema:
                type: string
                enum: [bytes, none]
            ETag:
              description: >-
                strong validator built from the file's inode, size and
                modification time. Sent for `format=text` only.
              schema:
                type: string
        "206":
          $ref: "#/components/responses/PartialContent"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: >-
            the format is not `text`, `csv` or `jsonl`, or the ID is not a
            capture ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: there is no such experiment, or no capture with the ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
        "500":
          description: the capture could not be opened or read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{name}/netflow/ws":
    get:
      tags:
        - Experiments
      summary: Receive an experiment's netflow records over a WebSocket
      description: >-
        Each text message is one `NetflowRecord`. The server pings every 7
        seconds and closes a client that does not answer within 10. It ignores
        client messages, but a message over 1 KiB closes the websocket. A
        client that is too slow loses records. When the capture stops, the
        server closes with 1000 and the reason `netflow stopped`. Needs the
        `experiments/netflow` `get` permission.
      operationId: getExperimentsNameNetflowWs
      parameters:
        - name: name
          in: path
          description: name of phenix experiment
          required: true
          example: exp1
          schema:
            type: string
      responses:
        "101":
          description: switching protocols, then netflow records follow as `NetflowRecord` JSON messages
        "400":
          description: the request is not a websocket handshake
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no netflow capture is running for the experiment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            the server is shutting down (`Retry-After` says when to try again)
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{name}/scorch/components/{run}/{loop}/{stage}/{cmp}":
    get:
      tags:
        - Scorch
      summary: Get a SCORCH component's output
      description: >-
        For a component that has finished, or not run, its output so far
        (`output`). For a running component, where to follow its output. That is
        the websocket to stream it from (`stream`), or for a `break` component,
        the terminal it opened (`terminal`). Connect to the terminal as
        `GET .../terminals/{pid}` would. Needs the `experiments` `get`
        permission.
      operationId: getExperimentsNameScorchComponentsRunLoopStageCmp
      parameters:
        - $ref: "#/components/parameters/ScorchExp"
        - $ref: "#/components/parameters/ScorchRun"
        - $ref: "#/components/parameters/ScorchLoop"
        - $ref: "#/components/parameters/ScorchStage"
        - $ref: "#/components/parameters/ScorchComponent"
      responses:
        "200":
          description: the output, its stream, or the component's terminal
          content:
            application/json:
              schema:
                type: object
                properties:
                  output:
                    title: Output
                    type: string
                    description: the output of a component that is not running
                    example: "ping: 3 packets transmitted, 3 received"
                  stream:
                    title: Stream
                    type: string
                    description: >-
                      the websocket of a running component's output, under the
                      UI's base path
                    example: /api/v1/experiments/exp1/scorch/components/0/0/start/ping/ws
                  terminal:
                    title: Terminal
                    description: the terminal of a running break component
                    allOf:
                      - $ref: "#/components/schemas/ScorchTerminal"
        "400":
          description: the run or loop is not a number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the experiment does not exist, or the break component's terminal no longer exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the experiment could not be read from the store, or the output could not be encoded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{name}/scorch/components/{run}/{loop}/{stage}/{cmp}/ws":
    get:
      tags:
        - Scorch
      summary: Stream a SCORCH component's output over a WebSocket
      description: >-
        Text frames carry the component's output: what it has written so far,
        then what it writes. Once the component finishes, a frame carries `*****
        COMPONENT FINISHED *****`, and the server closes the websocket. A
        component that is
        not running gets its output and the marker immediately. The server
        drops a client that is too slow, when 256 chunks wait for it.
        Reconnecting replays the output. The handshake needs an `Origin` header. Needs the
        `experiments` `get` permission.
      operationId: getExperimentsNameScorchComponentsRunLoopStageCmpWs
      parameters:
        - $ref: "#/components/parameters/ScorchExp"
        - $ref: "#/components/parameters/ScorchRun"
        - $ref: "#/components/parameters/ScorchLoop"
        - $ref: "#/components/parameters/ScorchStage"
        - $ref: "#/components/parameters/ScorchComponent"
      responses:
        "101":
          description: switching protocols, then the output follows in text frames
        "400":
          description: >-
            the run or loop is not a number (an `Error`). A request that is not
            a websocket handshake gets a bare 400 with a one-line plain-text
            reason, such as `not websocket protocol`, and no JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            forbidden (an `Error`). A handshake without an `Origin` header gets
            a bare 403 with no body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            the server is shutting down (`Retry-After` says when to try again)
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{name}/scorch/pipelines":
    get:
      tags:
        - Scorch
      summary: Get every Scorch run's pipeline for an experiment
      description: >-
        One pipeline per run in the experiment's scorch app metadata, in run
        order, each the run's own top-level loop. Also reports which run the
        scorch app is executing, whether that app is running at all, and the
        experiment's own state. So the Scorch page needs no separate
        experiment request. Needs the `experiments` `get` permission on the
        experiment.
      operationId: getExperimentsNameScorchPipelines
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get Scorch pipelines for
          required: true
          example: exp1
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScorchPipelines"
        "403":
          description: getting the experiment is not allowed for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the experiment does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: >-
            the experiment could not be read from the store, its scorch
            metadata could not be decoded, or one of its pipelines could not
            be built
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{name}/scorch/pipelines/{run}":
    post:
      tags:
        - Scorch
      summary: Start a Scorch run
      description: >-
        Executes the run's configure, start, loop, stop and cleanup stages in
        the background and answers as soon as it has started. The pipeline
        endpoints and the `apps/scorch` websocket resource report its progress.
        A run that is already executing is refused. Needs the
        `experiments/trigger` `create` and the `experiments` `get` permissions
        on the experiment.
      operationId: postExperimentsNameScorchPipelinesRun
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to start a Scorch run for
          required: true
          example: exp1
          schema:
            type: string
        - name: run
          in: path
          description: index of the run in the experiment's scorch app metadata
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: the run has started
        "400":
          description: the run ID is not a number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: starting Scorch runs is not allowed for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            the experiment does not exist, its scorch app metadata has no such
            run, or the experiment has no scorch app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            the run is already executing, the experiment is not running, or
            the scorch app is already running a run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: >-
            the experiment could not be read from the store, or its scorch
            metadata could not be decoded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - Scorch
      summary: Cancel a Scorch run
      description: >-
        Cancels the run's context, which ends the stage it is executing and
        the run with it. A run that is not executing is left alone and the
        answer is the same. Needs the `experiments/trigger` `delete`
        permission on the experiment.
      operationId: deleteExperimentsNameScorchPipelinesRun
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to cancel a Scorch run for
          required: true
          example: exp1
          schema:
            type: string
        - name: run
          in: path
          description: index of the run in the experiment's scorch app metadata
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: the run has been canceled, or was not executing
        "400":
          description: the run ID is not a number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: canceling Scorch runs is not allowed for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{name}/scorch/pipelines/{run}/cleanup":
    post:
      tags:
        - Scorch
      summary: Run only a Scorch run's cleanup stage
      description: >-
        Executes the run's top-level cleanup components on their own, without
        its other stages, to remove what a canceled or failed run left behind.
        It answers as soon as they have started. Only a run whose
        `hasCleanup` is true has any, and a run that is already executing is
        refused. Needs the `experiments/trigger` `create` and the
        `experiments` `get` permissions on the experiment.
      operationId: postExperimentsNameScorchPipelinesRunCleanup
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to clean a Scorch run up for
          required: true
          example: exp1
          schema:
            type: string
        - name: run
          in: path
          description: index of the run in the experiment's scorch app metadata
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: the cleanup stage has started
        "400":
          description: the run ID is not a number, or the run has no cleanup components
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: starting Scorch runs is not allowed for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            the experiment does not exist, its scorch app metadata has no such
            run, or the experiment has no scorch app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            the run is already executing, the experiment is not running, or
            the scorch app is already running a run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: >-
            the experiment could not be read from the store, or its scorch
            metadata could not be decoded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{name}/scorch/pipelines/{run}/clear":
    post:
      tags:
        - Scorch
      summary: Clear a Scorch run's status
      description: >-
        Forgets the statuses held for every loop of the run, so its pipeline
        shows as never run. It broadcasts each cleared loop over the
        `apps/scorch` websocket resource. A run that is executing is refused,
        so cancel it first. Needs the `experiments/trigger` `create`
        permission on the experiment.
      operationId: postExperimentsNameScorchPipelinesRunClear
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to clear a Scorch run for
          required: true
          example: exp1
          schema:
            type: string
        - name: run
          in: path
          description: index of the run in the experiment's scorch app metadata
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: the run's status has been cleared
        "400":
          description: the run ID is not a number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: clearing Scorch runs is not allowed for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            the experiment does not exist, its scorch app metadata has no such
            run, or the experiment has no scorch app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: the run is executing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: >-
            the experiment could not be read from the store, or its scorch
            metadata could not be decoded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{name}/scorch/pipelines/{run}/{loop}":
    get:
      tags:
        - Scorch
      summary: Get one loop of a Scorch run's pipeline
      description: >-
        The pipeline for one loop of a run. It has a node per stage and per
        component, the edges that order them, and each node's latest status.
        Loop 0 is the run itself, and every loop above it is the pipeline
        nested in the loop below. Needs the `experiments` `get` permission on
        the experiment.
      operationId: getExperimentsNameScorchPipelinesRunLoop
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get a Scorch pipeline for
          required: true
          example: exp1
          schema:
            type: string
        - name: run
          in: path
          description: index of the run in the experiment's scorch app metadata
          required: true
          schema:
            type: integer
        - name: loop
          in: path
          description: loop to get, 0 for the run itself
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScorchPipeline"
        "400":
          description: the run ID or the loop number is not a number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: getting the experiment is not allowed for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            the experiment does not exist, it has no scorch app, its scorch
            app metadata has no such run, or the run does not configure that
            loop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the experiment could not be read from the store, or the pipeline could not be built
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{name}/scorch/terminals":
    get:
      tags:
        - Scorch
      summary: List an experiment's SCORCH terminals
      description: >-
        The terminals the experiment's running break components opened,
        without a client to connect as (`loc` and `exit` are empty). Needs
        the `experiments` `get` permission.
      operationId: getExperimentsNameScorchTerminals
      parameters:
        - $ref: "#/components/parameters/ScorchExp"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  terminals:
                    title: Terminals
                    type: array
                    nullable: true
                    description: the terminals, or null when there are none
                    items:
                      $ref: "#/components/schemas/ScorchTerminal"
              example:
                terminals:
                  - exp: exp1
                    run: 0
                    loop: 0
                    stage: start
                    name: pause
                    loc: ""
                    exit: ""
                    readOnly: false
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{name}/scorch/terminals/{pid}":
    get:
      tags:
        - Scorch
      summary: Connect to a SCORCH terminal
      description: >-
        Gives the caller a client of the terminal that runs the process. The
        `loc` and `exit` of an earlier connection name its PID. The response
        holds `loc`, the websocket to attach with. The first client whose role
        has the `experiments/trigger` `create` permission may write to the
        terminal, and also gets `exit`, the route that ends it. Every other
        client only watches (`readOnly`). A client without that permission never
        takes the writing side, even when no one holds it. A client must attach
        within 5 seconds. Needs the `experiments` `get` permission. Writing to
        the terminal also needs `experiments/trigger` `create`.
      operationId: getExperimentsNameScorchTerminalsPid
      parameters:
        - $ref: "#/components/parameters/ScorchExp"
        - $ref: "#/components/parameters/ScorchTerminalPID"
      responses:
        "200":
          description: the terminal, with the caller's client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScorchTerminal"
        "400":
          description: the PID is not a number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the experiment has no terminal running that process
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{name}/scorch/terminals/{run}/{loop}/{stage}/{cmp}":
    get:
      tags:
        - Scorch
      summary: Connect to a SCORCH component's terminal
      description: >-
        As `GET .../terminals/{pid}`, for the terminal the break component
        opened. Needs the `experiments` `get` permission. Writing to the
        terminal also needs `experiments/trigger` `create`.
      operationId: getExperimentsNameScorchTerminalsRunLoopStageCmp
      parameters:
        - $ref: "#/components/parameters/ScorchExp"
        - $ref: "#/components/parameters/ScorchRun"
        - $ref: "#/components/parameters/ScorchLoop"
        - $ref: "#/components/parameters/ScorchStage"
        - $ref: "#/components/parameters/ScorchComponent"
      responses:
        "200":
          description: the terminal, with the caller's client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScorchTerminal"
        "400":
          description: the run or loop is not a number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the component has no terminal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{name}/scorch/terminals/{pid}/ws/{id}":
    get:
      tags:
        - Scorch
      summary: Attach to a SCORCH terminal over a WebSocket
      description: >-
        Attaches the client a connect route gave (its `loc`), once. Frames
        carry the terminal's output, and a read-only client first gets what
        the terminal has written so far. What the writing client sends is
        typed into the terminal. The server ignores frames from read-only
        clients. When the writing client's process exits, read-only clients get
        `***** BREAK PROCESS EXITED *****` and the websocket closes. The
        handshake needs an `Origin` header. Needs the `experiments` `get`
        permission. Attaching as the writing client also needs
        `experiments/trigger`
        `create`.
      operationId: getExperimentsNameScorchTerminalsPidWsId
      parameters:
        - $ref: "#/components/parameters/ScorchExp"
        - $ref: "#/components/parameters/ScorchTerminalPID"
        - name: id
          in: path
          description: the client ID in the connect route's `loc`
          required: true
          example: 0f7b2a1e-5c1d-4f6e-9d2a-3b4c5d6e7f80
          schema:
            type: string
      responses:
        "101":
          description: switching protocols, then the terminal follows in frames
        "400":
          description: >-
            the request is not a websocket handshake. The answer is a bare 400
            with a one-line plain-text reason, such as `not websocket
            protocol`, and no JSON.
        "403":
          description: >-
            forbidden, or the writing client's ID from a role without the
            `experiments/trigger` `create` permission (an `Error`). A handshake
            without an `Origin` header gets a bare 403 with no body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no such terminal for the experiment, or a client ID unknown, used or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            the server is shutting down (`Retry-After` says when to try again)
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{name}/scorch/terminals/{pid}/exit/{id}":
    post:
      tags:
        - Scorch
      summary: End a SCORCH terminal
      description: >-
        Kills the terminal's process, which ends its break component, and
        publishes an `apps/scorch` `terminal-exit` message on the `/ws`
        websocket. Only the writing client, by the `exit` its connect route
        gave, may end it. Needs the `experiments` `get` and the
        `experiments/trigger` `create` permissions.
      operationId: postExperimentsNameScorchTerminalsPidExitId
      parameters:
        - $ref: "#/components/parameters/ScorchExp"
        - $ref: "#/components/parameters/ScorchTerminalPID"
        - name: id
          in: path
          description: the client ID in the connect route's `exit`
          required: true
          example: 0f7b2a1e-5c1d-4f6e-9d2a-3b4c5d6e7f80
          schema:
            type: string
      responses:
        "204":
          description: the terminal has ended
        "400":
          description: the PID is not a number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden, or the client is not the terminal's writing client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no such terminal for the experiment, or it could not be ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{name}/topology":
    get:
      tags:
        - Experiments
      summary: Get an experiment's network graph
      description: >-
        A node for each VM and one for each VLAN the VMs connect to (type
        `Switch`). An edge for each VM interface, from the VM to its
        VLAN. Needs the `experiments/topology` `get` permission.
      operationId: getExperimentsNameTopology
      parameters:
        - name: name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: ignore
          in: query
          description: a VLAN to leave out of the graph, such as a management network. May be repeated.
          required: false
          schema:
            type: array
            items:
              type: string
          example: [MGMT]
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentGraph"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the experiment does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the experiment or its VMs could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{name}/topology/search":
    get:
      tags:
        - Experiments
      summary: Search an experiment's network graph
      description: >-
        Finds the graph nodes that match each query parameter given, and
        lists their IDs, in no particular order. Each of
        `hostname`, `disk`, `node-type`, `os-type`, `label`, `annotation`,
        `vlan` and `ip` takes one value. `ip` also takes a CIDR prefix,
        matching every address in it. Parameter names are not case-sensitive,
        and other parameters are ignored. A node that matches several
        parameters is listed once for each match. Needs the
        `experiments/topology` `get` permission.
      operationId: getExperimentsNameTopologySearch
      parameters:
        - name: name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: hostname
          in: query
          description: a VM's hostname
          schema:
            type: string
        - name: disk
          in: query
          description: a disk image the VMs boot from
          schema:
            type: string
        - name: node-type
          in: query
          description: a node type, such as VirtualMachine
          example: VirtualMachine
          schema:
            type: string
        - name: os-type
          in: query
          description: an OS type, such as linux
          example: linux
          schema:
            type: string
        - name: label
          in: query
          description: a label, as key=value
          example: role=router
          schema:
            type: string
        - name: annotation
          in: query
          description: an annotation key the VMs have
          schema:
            type: string
        - name: vlan
          in: query
          description: a VLAN alias the VMs connect to
          schema:
            type: string
        - name: ip
          in: query
          description: an IPv4 address, or a CIDR prefix
          example: 10.0.0.0/24
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    title: Nodes
                    type: array
                    nullable: true
                    description: the IDs of the matching graph nodes, or null when none match
                    items:
                      type: integer
                    example: [0, 3]
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the experiment does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the experiment or its VMs could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{name}/trigger":
    post:
      tags:
        - Experiments
      summary: Run a lifecycle stage of an experiment's apps
      description: >-
        Answers immediately and runs the lifecycle stage `stage` (the running
        stage when `stage` is absent) of each app `apps` names, one after
        another, in the background, stopping at the first that fails. Every
        query parameter is passed to the apps as metadata. Each app's progress
        is published on the `/ws` websocket as an `apps/<app>` resource named
        after the experiment. Its action is `start`, then `success` or `error`
        (with the error as its result), or `canceled` when `DELETE` cancels
        it. The result also names the stage in `stage`. When the request
        names a stage, the server first checks that the stage can run: the
        running stage needs a running experiment, and it does not apply to
        the default apps. Without `stage`, these errors come only on the
        websocket. Needs the `experiments/trigger` `create` permission.
      operationId: postExperimentsNameTrigger
      parameters:
        - name: name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: apps
          in: query
          description: the apps to trigger, comma-separated
          required: true
          schema:
            type: string
          example: soh,scorch
        - name: stage
          in: query
          description: the app lifecycle stage to run
          required: false
          schema:
            type: string
            enum: [configure, pre-start, post-start, running, cleanup]
            default: running
          example: configure
      responses:
        "204":
          description: the apps are being triggered
        "400":
          description: >-
            `apps` is missing or names an empty app, `stage` is not a lifecycle
            stage, or, with `stage`, an app is not part of the experiment or
            the stage does not apply to it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the experiment does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`stage` is `running` and the experiment is not running"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the experiment could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - Experiments
      summary: Cancel an experiment's triggered apps
      description: >-
        Answers immediately and cancels the running stage of each app `apps`
        names that a trigger started. It publishes an `apps/<app>` `canceled`
        message, with the `delete` permission verb, on the `/ws` websocket.
        Needs the `experiments/trigger` `delete` permission.
      operationId: deleteExperimentsNameTrigger
      parameters:
        - name: name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: apps
          in: query
          description: the apps to cancel, comma-separated
          required: true
          schema:
            type: string
          example: scorch
      responses:
        "204":
          description: the apps are being canceled
        "400":
          description: "`apps` is missing, or names an empty app"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{name}/soh":
    get:
      tags:
        - State of Health
      summary: Get an experiment's state of health
      description: >-
        The experiment's network graph with each VM's latest soh results, and
        the hosts and flows between them that the soh app recorded. The
        `MGMT` and `MIRROR` VLANs are left out. Needs the `experiments` `get`
        permission and the `vms` `list` permission.
      operationId: getExperimentsNameSoh
      parameters:
        - name: name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: statusFilter
          in: query
          description: keep only the VMs with this status (omit it to keep every VM)
          required: false
          schema:
            type: string
            enum: [running, notrunning, notboot, notdeploy, external]
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoHNetwork"
        "400":
          description: statusFilter is not one of the listed values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the experiment does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the experiment, or its soh results, could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{name}/stopCaptureSubnet":
    post:
      tags:
        - Experiments
      summary: Stop the captures of an experiment's VMs on a subnet
      description: >-
        Stops the packet captures of the experiment's VMs with an interface
        in the subnet, or of the listed VMs only. Needs the
        `exp/captureSubnet` `delete` permission.
      operationId: postExperimentsNameStopCaptureSubnet
      parameters:
        - name: name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureSubnetRequest"
      responses:
        "200":
          description: the VMs whose captures stopped
          content:
            application/json:
              schema:
                type: object
                properties:
                  vms:
                    title: VMs
                    type: array
                    description: the VMs whose captures stopped
                    items:
                      type: string
                    example: [web, db]
        "400":
          description: the body is not a capture request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the experiment could not be read, or a capture could not be stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{name}/stopCaptureVlan":
    post:
      tags:
        - Experiments
      summary: Stop the captures of an experiment's VMs on a VLAN
      description: >-
        Stops the packet capture on each interface on the VLAN of the running
        experiment's VMs, or of the listed VMs only. The captures on other
        interfaces continue. It acts only on the VMs for which the role has
        the `vms/captures` `delete` permission (`<experiment>/<vm>`), and
        skips the others. Each capture that stops is published on the `/ws`
        websocket as an `experiment/vm/capture` resource with the action
        `stop` and the interface as its result.
      operationId: postExperimentsNameStopCaptureVlan
      parameters:
        - name: name
          in: path
          description: name of phenix experiment
          required: true
          example: exp1
          schema:
            type: string
      requestBody:
        description: the VLAN alias and, optionally, the VMs to stop capturing
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureVlanRequest"
      responses:
        "200":
          description: the VMs with a capture on the VLAN that stopped
          content:
            application/json:
              schema:
                type: object
                properties:
                  vms:
                    title: VMs
                    type: array
                    description: the VMs with a capture on the VLAN that stopped
                    items:
                      type: string
                    example: [web, db]
        "400":
          description: the body is not a capture request, or it has no VLAN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            the role may stop the captures of none of the experiment's VMs, or
            of none of the listed VMs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the experiment does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: >-
            the experiment is not running, it could not be read, or a capture
            could not be stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{exp_name}/vms":
    get:
      tags:
        - Virtual Machines
      summary: List the VMs of an experiment
      description: >-
        Lists the experiment's VMs that the role may list, with sorting and
        paging. Needs the `vms` `list` permission.
      operationId: getExperimentsNameVms
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment to get VMs for
          required: true
          schema:
            type: string
        - name: screenshot
          in: query
          description: whether or not to include VM screenshots (value is size to grab)
          required: false
          example: "200"
          schema:
            type: string
        - name: sortCol
          in: query
          description: >-
            column to sort the VMs by, used with sortDir. `labels` sorts by how
            many labels and notes a VM has. `network` sorts by the VLAN IDs of
            its interfaces as numbers, and `taps` by their tap names. Both sort
            in interface order and put VMs that have none last. Ties sort by
            name A to Z in either direction.
          required: false
          schema:
            type: string
            enum: [name, host, uptime, delayed, labels, network, taps]
        - name: sortDir
          in: query
          description: sort direction, used with sortCol
          required: false
          schema:
            type: string
            enum: [asc, desc]
        - $ref: "#/components/parameters/PageNum"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: successful operation
          headers:
            X-Phenix-Seq:
              $ref: "#/components/headers/Seq"
            X-Phenix-Observed-At:
              $ref: "#/components/headers/ObservedAt"
            X-Phenix-Stale:
              $ref: "#/components/headers/Stale"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMs"
        "400":
          description: pageNum or perPage is not a whole number from 1 to 2147483647
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: the role may not list VMs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the experiment does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the experiment could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags:
        - Virtual Machines
      summary: Update several VMs of an experiment
      description: >-
        Applies each VM's changes as `PATCH
        /experiments/{exp_name}/vms/{vm_name}` would, one VM after another. It
        answers with the VMs it updated, read back, in `vms`, and with each VM
        it left unchanged in `errors`. Only `cpus`, `ram`, `disk`, `dnb`,
        `interface`, `host` and `snapshot` are applied. Other fields are
        ignored. Every disk and interface VLAN is checked before any VM changes.
        While the experiment runs, only an interface VLAN change applies, and
        any other change makes that VM `failed`.
        A VM the role may not `patch` (`vms`, on `<exp>/<vm>`) is `skipped`. A
        VM whose update fails is `failed`, and the rest are still updated. A VM
        updated but not read back is in neither list.
      operationId: patchExperimentsNameVms
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vms:
                  title: VMs
                  type: array
                  description: each VM's changes, by name
                  items:
                    $ref: "#/components/schemas/VMUpdate"
                total:
                  title: Total
                  type: integer
                  description: ignored
                  example: 2
            example:
              vms:
                - name: web
                  dnb: true
                - name: db
                  dnb: true
      responses:
        "200":
          description: the VMs updated, and how many, and those left unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMs"
        "400":
          description: >-
            a malformed body, a disk name minimega cannot use, or an interface
            VLAN minimega cannot take as one argument (as for `PATCH
            /experiments/{exp_name}/vms/{vm_name}`). The check runs before any
            VM changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: the role may patch none of the VMs, so none changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: >-
            every VM the role may patch failed to update (the cause names each
            VM and why)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{exp_name}/vms/actions":
    post:
      tags:
        - Virtual Machines
        - Jobs
      summary: Take one power action on several VMs in a background job
      description: >-
        Starts a `vms.action` background job that takes the action on each VM,
        four at a time, exactly as the VM's own route does (the same
        permission, lock, websocket messages and logs). A VM the role may not
        act on is skipped with `you do not have permission`, and a VM another
        action holds fails with `retryable` set. Each succeeded item's `result`
        is the VM as the single-VM route returns it (none for `kill`).
        Canceling the job starts no more VMs, and the VMs in progress finish.

        Before a `start` or `restart`, the job checks the disk and CD-ROM
        images of the VMs the role may act on, as an experiment start does
        (see the `experiment.disk-check` setting). A VM with a missing image,
        or an image that qemu cannot open, fails at once. Its `error` starts
        with `broken VM disk images` and names each disk and problem.
      operationId: postExperimentsNameVmsActions
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: exp_name
          in: path
          description: name of the running phenix experiment
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
                - vms
              properties:
                action:
                  title: Action
                  description: >-
                    the power action to take on each VM. Each action matches a
                    single-VM route and permission: `start` (POST .../start,
                    `vms/start` `update`), `pause` (POST .../stop, `vms/stop`
                    `update`), `restart` (POST .../restart, `vms/restart`
                    `update`), `shutdown` (POST .../shutdown, `vms/shutdown`
                    `update`), `resetDisk` (POST .../reset, `vms/reset`
                    `update`) and `kill` (DELETE .../{vm_name}, `vms` `delete`).
                  type: string
                  enum:
                    - start
                    - pause
                    - restart
                    - shutdown
                    - kill
                    - resetDisk
                vms:
                  title: VMs
                  type: array
                  description: the VMs' names (a repeated name counts once)
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: string
            example:
              action: restart
              vms:
                - web
                - db
      responses:
        "202":
          description: the job, started
          headers:
            Location:
              description: the job, at /api/v1/jobs/{id} under the server's base path
              schema:
                type: string
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          description: >-
            an unknown action, a malformed body, no VMs or more than 1000, or
            an invalid `Idempotency-Key`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: the role may take the action on none of the VMs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/IdempotencyKeyInFlight"
        "422":
          $ref: "#/components/responses/IdempotencyKeyReused"
        "429":
          description: >-
            too many of the user's jobs, or of all jobs, are waiting to run
            (`Retry-After` says when to try again)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            the server is shutting down and starts no more jobs (`Retry-After`
            says when to try again)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{exp_name}/vms/resetSettings":
    post:
      tags:
        - Virtual Machines
      summary: Restore the saved settings of VMs
      description: >-
        Restores, in a stopped experiment, the settings that each VM had when
        phenix created the experiment: `cpus`, `ram`, `disk`,
        `inject_partition`, `snapshot`, `dnb` and `host` (the schedule entry,
        removed when the saved host is empty). The VM's `defaults` show these
        settings. An experiment created before phenix saved them has none, and
        each of its VMs fails with `no saved settings for this VM`. A VM the
        role may not `patch` (`vms`, on `<exp>/<vm>`) is `skipped`. Each VM
        reset sends the same websocket update as `PATCH
        /experiments/{exp_name}/vms/{vm_name}`. The response is `200` also
        when every VM failed. phenix locks the experiment for the whole reset
        and saves all the VMs in one change.
      operationId: postExperimentsNameVmsResetSettings
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                vms:
                  title: VMs
                  type: array
                  description: >-
                    the names of the VMs to reset. When it is empty or absent,
                    every VM the role may patch is reset
                  items:
                    type: string
            example:
              vms:
                - web
                - db
      responses:
        "200":
          description: the VMs reset, read back, and those left unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMs"
        "400":
          description: the body is malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: the role may patch none of the VMs, so none changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the experiment does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: the experiment is running, or another action, such as a start or a stop, holds it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: >-
            the experiment could not be read or saved, or its saved settings
            do not decode. No VM changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{exp_name}/vms/{vm_name}":
    get:
      tags:
        - Virtual Machines
      summary: Get a VM
      description: >-
        Returns the VM with its node's annotations, which VM lists leave out.
        Needs the `vms` `get` permission.
      operationId: getExperimentsNameVmName
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment to get VM from
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix experiment VM to get
          required: true
          schema:
            type: string
        - name: screenshot
          in: query
          description: whether or not to include VM screenshots (value is size to grab)
          required: false
          example: "200"
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the experiment does not exist, or its topology does not have the VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the experiment or the VM could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags:
        - Virtual Machines
      summary: Update existing VM settings in existing experiment
      description: >-
        While the experiment runs, only an interface's VLAN, the tags and the
        annotations can change. Needs the `vms` `patch` permission. The
        response carries the annotations when the role may also get the VM.
      operationId: patchExperimentsNameVmsName
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment to modify
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix virtual machine to modify
          required: true
          schema:
            type: string
      requestBody:
        description: phenix virtual machine patch parameters
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                host:
                  title: "Host"
                  description: "Cluster host on which to run the VM."
                  example: compute-01
                  type: string
                cpus:
                  title: "CPUs"
                  description: "Number of virtual CPUs assigned to the VM."
                  example: 1
                  type: integer
                ram:
                  title: "RAM"
                  description: "Memory assigned to the VM, in megabytes."
                  example: 2048
                  type: integer
                disk:
                  title: "Disk"
                  example: ubuntu.qc2
                  type: string
                  description: >-
                    the image to boot from, relative to the minimega files
                    directory or absolute. minimega must be able to use its name
                    (see the 400 response).
                dnb:
                  title: "Do Not Boot"
                  description: "Whether the VM should remain powered off."
                  example: false
                  type: boolean
                interface:
                  title: "Interface"
                  description: "Network interface to update on the VM."
                  type: object
                  properties:
                    index:
                      title: "Index"
                      description: "Minimega network interface index to update."
                      example: 1
                      type: integer
                    vlan:
                      title: "VLAN"
                      example: EXP-1
                      type: string
                      description: >-
                        VLAN alias to connect the interface to (empty
                        disconnects it). Applies only while the experiment
                        is running, and is ignored otherwise. Must be one
                        minimega argument (see the 400 response).
                snapshot:
                  title: "Snapshot"
                  description: "Whether to take a VM disk snapshot."
                  example: false
                  type: boolean
                inject_partition:
                  title: "Inject Partition"
                  description: "Disk partition used for file injection."
                  example: 1
                  type: integer
                tag_update_mode:
                  title: "Tag Update Mode"
                  example: SET
                  type: string
                  enum: [NONE, SET, ADD]
                  default: NONE
                  description: >-
                    how `tags` applies: SET replaces the VM's tags, ADD adds to
                    them (replacing any with the same key), and NONE ignores
                    `tags`
                tags:
                  title: "Tags"
                  description: >-
                    String tags associated with the VM. Keys and values
                    minimega would read as something else are rejected (see
                    the 400 response).
                  type: object
                  additionalProperties:
                    type: string
                annotations:
                  title: Annotations
                  type: object
                  additionalProperties: true
                  description: >-
                    replaces all of the VM's annotations (`{}` removes them).
                    Apps read most annotations when the experiment starts.
                    Setting phenix/startup-autotunnel to a new value needs the
                    `vms/forwards` `create` permission on `<exp>/<vm>`.
            example:
              cpus: 2
              ram: 2048
              dnb: false
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        "400":
          description: >-
            invalid request, such as an annotation with an empty key, no
            value, or a value of a type the default apps would ignore. Also a
            disk whose name minimega cannot use (white space, quotes, a
            backslash, `#`, `$`, `,`, glob characters or a control character).
            Also a tag key or value with a double quote, a backslash, `$`, or a
            control character other than a newline or tab. Also a tag key or
            value with the `file:`, `http:`, `https:` or `tar:` scheme. Also a
            VLAN with any of those, white space, `'` or `#`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            forbidden, including setting phenix/startup-autotunnel without
            permission to create port forwards to the VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the experiment does not exist, or its topology does not have the VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            the experiment runs, and the request changes a setting other than
            an interface's VLAN, the tags or the annotations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the VM could not be updated or read back
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - Virtual Machines
      summary: Delete phenix experiment VM
      description: >-
        Kills the VM in minimega. The experiment must be running. Needs the
        `vms` `delete` permission.
      operationId: deleteExperimentsNameVmsName
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix virtual machine to delete
          required: true
          schema:
            type: string
      responses:
        "204":
          description: successful operation
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            the experiment does not exist, its topology does not have the VM,
            or minimega does not have the VM (for example, a VM already
            deleted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: the experiment is not running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the experiment could not be read, or minimega could not kill the VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{exp_name}/vms/{vm_name}/start":
    post:
      tags:
        - Virtual Machines
      summary: Start a VM
      description: >-
        Starts or resumes the VM in the running experiment and answers with
        the VM. Needs the `vms/start` `update` permission.
      operationId: postExperimentsNameVMsNameStart
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM to start
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        "400":
          description: the experiment could not be read after the action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            the experiment does not exist, its topology does not have the VM,
            or minimega does not have the VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            the experiment is not running, another action holds the VM, or the
            topology sets the VM to not boot (`general.do_not_boot`), so
            minimega did not launch it. Redeploy the VM to launch it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the experiment could not be read, or the VM could not be started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{exp_name}/vms/{vm_name}/stop":
    post:
      tags:
        - Virtual Machines
      summary: Pause a VM
      description: >-
        Pauses the VM in the running experiment and answers with the VM. Needs
        the `vms/stop` `update` permission.
      operationId: postExperimentsNameVMsNameStop
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM to stop
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        "400":
          description: the experiment could not be read after the action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            the experiment does not exist, its topology does not have the VM,
            or minimega does not have the VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: the experiment is not running, or another action holds the VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the experiment could not be read, or the VM could not be stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{exp_name}/vms/{vm_name}/redeploy":
    post:
      tags:
        - Virtual Machines
      summary: Redeploy a VM
      description: >-
        Needs the `vms/redeploy` `update` permission.
      operationId: postExperimentsNameVMsNameRedeploy
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM to redeploy
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cpus:
                  title: CPUs
                  description: number of virtual CPUs to give the VM (0 keeps its current count)
                  example: 2
                  type: integer
                ram:
                  title: RAM
                  description: memory to give the VM, in megabytes (0 keeps its current memory)
                  example: 2048
                  type: integer
                disk:
                  title: Disk
                  example: ubuntu.qc2,virtio
                  type: string
                  description: >-
                    the minimega disk spec of the new first disk,
                    `<path>[,<interface>][,<cache mode>]`. The path is the
                    image to boot from, relative to the minimega files
                    directory or absolute. A field that is not set keeps the
                    value of the current first disk. Empty keeps the VM's disk.
                injects:
                  title: Injects
                  example: true
                  type: boolean
                  description: whether to apply the VM's injections again
            example:
              cpus: 2
              ram: 2048
              disk: ubuntu.qc2,virtio
              injects: true
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        "400":
          description: >-
            an invalid request body, a disk spec minimega does not parse, or
            a disk path minimega cannot use (white space, quotes, a backslash,
            `#`, `$`, `,`, glob characters or a control character)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            the experiment does not exist, its topology does not have the VM,
            or minimega does not have the VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: the VM is busy, or the experiment is not running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the redeploy failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{exp_name}/vms/{vm_name}/qos":
    get:
      tags:
        - Virtual Machines
      summary: Get the link quality of a VM's interfaces
      description: >-
        Returns the link quality (minimega `qos`) of each interface of a VM of
        a running experiment, in interface order. Needs the `vms` `patch`
