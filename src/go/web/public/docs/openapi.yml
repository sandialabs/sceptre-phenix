          description: successful operation
        "400":
          description: request invalid, or the experiment is running
        "403":
          description: updating experiments not allowed for this user
        "409":
          description: experiment locked for update
  "/topologies":
    get:
      tags:
        - Topologies
      summary: Get all available topologies
      description: ""
      operationId: getTopologies
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topologies"
  "/disks":
    get:
      tags:
        - Disks
      summary: Get all available disk images
      description: >-
        Lists the disk images in the minimega files directory and its folders,
        the images the experiments' topologies use wherever they are, and the
        images backing any of them, each once by its full path. The folders
        searched go at most 16 levels below the files directory and leave out
        hidden names (starting with `.`), `lost+found`, the experiment folders
        `<experiment>/files`, `<experiment>/tmp` and
        `<experiment>/miniccc_responses`, and the top-level `saved` and
        `transfer_*` folders; symlinked folders are not followed. Needs the
        `disks` `list` permission. A `disks` name is an image's file name, so
        it covers the files of that name in every folder. Lists only the images
        whose names the role may list, and of those outside the files
        directory only the ones an experiment the role may `get` uses, or that
        back an image the role sees. Each image's experiments are cut to those
        the role may `list`.
      operationId: getDisks
      parameters:
        - name: expName
          in: query
          description: >-
            look only in this experiment's topology, rather than every
            experiment's, for the images and uses it reports; needs the
            `experiments` `get` permission for it
          required: false
          schema:
            type: string
        - name: diskType
          in: query
          description: comma-separated kinds to list (vm, container, iso, unknown); all by default
          required: false
          schema:
            type: string
        - name: refresh
          in: query
          description: >-
            set to true to inspect every image again rather than reuse what is
            known about images that have not changed
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Disks"
        "403":
          description: >-
            forbidden, including an `expName` the role may not get
        "404":
          description: no experiment named `expName`
    post:
      tags:
        - Disks
      summary: Upload a disk image
      description: >-
        Writes the uploaded file to the top level of the minimega files
        directory, under the file's own name. Needs the `disks` `upload`
        permission.
      operationId: postDisks
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        "200":
          description: successful operation
        "403":
          description: forbidden
        "500":
          description: the upload could not be read or written
    delete:
      tags:
        - Disks
      summary: Delete a disk image
      description: >-
        Deletes the image's file. Images backed by it stop working. Needs the
        `disks` `delete` permission for the image's file name.
      operationId: deleteDisks
      parameters:
        - name: disk
          in: query
          description: >-
            the image, relative to the minimega files directory or absolute;
            it must be inside that directory and not in a folder the disk list
            leaves out
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
        "400":
          description: >-
            a path outside the minimega files directory or in a folder the
            disk list leaves out, or a folder
        "403":
          description: forbidden
        "404":
          description: no such image
        "500":
          description: the file could not be deleted
  "/disks/snapshot":
    post:
      tags:
        - Disks
      summary: Snapshot a disk image
      description: >-
        Makes a new qcow2 image backed by the image, with minimega's `disk
        snapshot`. Needs the `disks` `create` permission for the new image's
        file name.
      operationId: postDisksSnapshot
      parameters:
        - name: disk
          in: query
          description: >-
            the image, relative to the minimega files directory or absolute;
            it must be inside that directory and not in a folder the disk list
            leaves out
          required: true
          schema:
            type: string
        - name: new
          in: query
          description: >-
            the new image, relative to the folder holding `disk` or absolute:
            a file that does not exist yet, so not empty and not ending in `/`
            or in a `.` or `..` element; `.qcow2` is added unless it ends in
            `.qc2` or `.qcow2`
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
        "400":
          description: >-
            a path outside the minimega files directory or in a folder the
            disk list leaves out, an image that is not a regular file, a `new`
            that names a folder rather than a file, or a name minimega cannot
            use (white space, quotes, a backslash, `#`, `$`, `,`, glob
            characters or a control character)
        "403":
          description: forbidden
        "404":
          description: no such image, or no folder for the new one
        "409":
          description: the new image exists already
        "500":
          description: minimega could not make the snapshot
  "/disks/commit":
    post:
      tags:
        - Disks
      summary: Commit a disk image into its backing image
      description: >-
        Writes the image's changes into the image backing it, with minimega's
        `disk commit`. Needs the `disks` `update` permission for both images'
        file names.
      operationId: postDisksCommit
      parameters:
        - name: disk
          in: query
          description: >-
            the image, relative to the minimega files directory or absolute;
            it must be inside that directory and not in a folder the disk list
            leaves out
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
        "400":
          description: >-
            the image or its backing image is outside the minimega files
            directory, in a folder the disk list leaves out, or not a regular
            file, or the image's name is one minimega cannot use
        "403":
          description: forbidden
        "404":
          description: no such image
        "500":
          description: the image has no backing image, or the commit failed
  "/disks/rebase":
    post:
      tags:
        - Disks
      summary: Change a disk image's backing image
      description: >-
        Sets the image's backing image with minimega's `disk set-backing`, or,
        with `unsafe` false, `disk rebase`. Needs the `disks` `update`
        permission for the image's file name.
      operationId: postDisksRebase
      parameters:
        - name: disk
          in: query
          description: >-
            the image, relative to the minimega files directory or absolute;
            it must be inside that directory and not in a folder the disk list
            leaves out
          required: true
          schema:
            type: string
        - name: backing
          in: query
          description: >-
            the new backing image, as for `disk`; empty makes the image
            independent
          required: true
          schema:
            type: string
        - name: unsafe
          in: query
          description: >-
            true to change only the name of the backing image, false to also
            write into the image what differs between the old backing image and
            the new one
          required: true
          schema:
            type: boolean
      responses:
        "200":
          description: successful operation
        "400":
          description: >-
            a path outside the minimega files directory or in a folder the
            disk list leaves out, an image that is not a regular file, a name
            minimega cannot use (white space, quotes, a backslash, `#`, `$`,
            `,`, glob characters or a control character), or an `unsafe` that
            is not a boolean
        "403":
          description: forbidden
        "404":
          description: no such image
        "500":
          description: minimega could not change the backing image
  "/disks/resize":
    post:
      tags:
        - Disks
      summary: Resize a disk image
      description: >-
        Resizes the image with minimega's `disk resize`. Needs the `disks`
        `update` permission for the image's file name.
      operationId: postDisksResize
      parameters:
        - name: disk
          in: query
          description: >-
            the image, relative to the minimega files directory or absolute;
            it must be inside that directory and not in a folder the disk list
            leaves out
          required: true
          schema:
            type: string
        - name: size
          in: query
          description: >-
            the new size, or a change to it with a leading `+` or `-`, suffixed
            with K, M, G, T, P or E; for example `50G` or `-500M`
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
        "400":
          description: >-
            a path outside the minimega files directory or in a folder the
            disk list leaves out, an image that is not a regular file, or a
            name minimega cannot use (white space, quotes, a backslash, `#`,
            `$`, `,`, glob characters or a control character)
        "403":
          description: forbidden
        "404":
          description: no such image
        "500":
          description: >-
            a size not in the form above, or minimega could not resize the
            image
  "/disks/clone":
    post:
      tags:
        - Disks
      summary: Copy a disk image
      description: >-
        Copies the image's file to a new file, never replacing one. Needs the
        `disks` `create` permission for the new image's file name.
      operationId: postDisksClone
      parameters:
        - name: disk
          in: query
          description: >-
            the image, relative to the minimega files directory or absolute;
            it must be inside that directory and not in a folder the disk list
            leaves out
          required: true
          schema:
            type: string
        - name: new
          in: query
          description: >-
            the new image, relative to the folder holding `disk` or absolute:
            a file that does not exist yet, so not empty and not ending in `/`
            or in a `.` or `..` element; `.qcow2` is added unless it ends in
            `.qc2` or `.qcow2`
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
        "400":
          description: >-
            a path outside the minimega files directory or in a folder the
            disk list leaves out, an image that is not a regular file, a `new`
            that names a folder rather than a file, or a new name minimega
            cannot use
        "403":
          description: forbidden
        "404":
          description: no such image, or no folder for the new one
        "409":
          description: the new image exists already
        "500":
          description: the copy failed
  "/disks/rename":
    post:
      tags:
        - Disks
      summary: Rename a disk image
      description: >-
        Renames the image's file, never replacing a file. Images backed by it
        stop working until they are rebased onto the new name. Needs the
        `disks` `update` permission for the image's file name.
      operationId: postDisksRename
      parameters:
        - name: disk
          in: query
          description: >-
            the image, relative to the minimega files directory or absolute;
            it must be inside that directory and not in a folder the disk list
            leaves out
          required: true
          schema:
            type: string
        - name: new
          in: query
          description: >-
            the new image, relative to the folder holding `disk` or absolute:
            a file that does not exist yet, so not empty and not ending in `/`
            or in a `.` or `..` element; `.qcow2` is added unless it ends in
            `.qc2` or `.qcow2`
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
        "400":
          description: >-
            a path outside the minimega files directory or in a folder the
            disk list leaves out, a folder, a `new` that names a folder rather
            than a file, or a new name minimega cannot use
        "403":
          description: forbidden
        "404":
          description: no such image, or no folder for the new one
        "409":
          description: the new image exists already
        "500":
          description: >-
            the rename failed, such as when the new image's folder is on
            another file system
  "/disks/download":
    get:
      tags:
        - Disks
      summary: Download a disk image
      description: >-
        Sends the image's file as an attachment. Needs the `disks` `get`
        permission for the image's file name.
      operationId: getDisksDownload
      parameters:
        - name: disk
          in: query
          description: >-
            the image, relative to the minimega files directory or absolute;
            it must be inside that directory and not in a folder the disk list
            leaves out
          required: true
          schema:
            type: string
      responses:
        "200":
          description: the image's file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: >-
            a path outside the minimega files directory or in a folder the
            disk list leaves out, or a folder
        "403":
          description: forbidden
        "404":
          description: no such image
  "/hosts":
    get:
      tags:
        - Hosts
      summary: Get all cluster hosts
      description: ""
      operationId: getHosts
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hosts"
  "/users":
    get:
      tags:
        - Users
      summary: Get all users
      description: ""
      operationId: getUsers
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Users"
    post:
      tags:
        - Users
      summary: Create a new user
      description: ""
      operationId: postUsers
      requestBody:
        description: user details
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                first_name:
                  type: string
                last_name:
                  type: string
                role_name:
                  type: string
                resource_names:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  "/users/{username}":
    get:
      tags:
        - Users
      summary: Get a specific user
      description: ""
      operationId: getUserUsername
      parameters:
        - name: username
          in: path
          description: username of user to get
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      tags:
        - Users
      summary: Update existing user
      description: ""
      operationId: patchUsersUsername
      parameters:
        - name: username
          in: path
          description: username of user to modify
          required: true
          schema:
            type: string
      requestBody:
        description: user parameters
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                role_name:
                  type: string
                resource_names:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      tags:
        - Users
      summary: Delete existing user
      description: ""
      operationId: deleteUsersUsername
      parameters:
        - name: username
          in: path
          description: username of user to delete
          required: true
          schema:
            type: string
      responses:
        "204":
          description: successful operation
  "/signup":
    post:
      tags:
        - Users
      summary: Signup as a new user
      description: ""
      operationId: postSignup
      requestBody:
        description: user details
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                first_name:
                  type: string
                last_name:
                  type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credentials"
  "/login":
    get:
      tags:
        - Users
      summary: Login a user
      description: ""
      operationId: getLogin
      parameters:
        - in: query
          name: user
          schema:
            type: string
          description: login username
        - in: query
          name: pass
          schema:
            type: string
          description: login password
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credentials"
    post:
      tags:
        - Users
      summary: Login a user
      description: ""
      operationId: postLogin
      requestBody:
        description: login credentials
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: string
                pass:
                  type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credentials"
  "/logout":
    get:
      tags:
        - Users
      summary: Logout a user
      description: ""
      operationId: getLogout
      responses:
        "204":
          description: successful operation
  "/console":
    post:
      tags:
        - Console
      summary: Start a minimega console
      description: >-
        Starts a console owned by the requesting user. It ends if no websocket
        attaches within 15 seconds.
      operationId: postConsole
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Console"
        "403":
          description: the role may not start a console (miniconsole post)
        "405":
          description: the server was started without --minimega-console
        "500":
          description: the console could not be started
  "/console/{pid}":
    parameters:
      - name: pid
        in: path
        description: process ID of the console
        required: true
        schema:
          type: integer
    get:
      tags:
        - Console
      summary: Check that a console is still running
      description: >-
        Lets a client attach to the console it had open, after a reload or from
        another tab, instead of starting another.
      operationId: getConsole
      responses:
        "200":
          description: the console is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Console"
        "403":
          description: the role may not use a console (miniconsole get)
        "404":
          description: no running console with this pid belongs to the user
    delete:
      tags:
        - Console
      summary: End a console
      description: >-
        Kills the console's process and closes its websockets; the UI does this
        when the user logs out. Needs the permission that starts a console.
      operationId: deleteConsole
      responses:
        "204":
          description: the console has ended
        "403":
          description: the role may not start a console (miniconsole post)
        "404":
          description: no running console with this pid belongs to the user
        "500":
          description: the console's process did not end
  "/console/{pid}/ws":
    get:
      tags:
        - Console
      summary: Attach to a console using a WebSocket
      description: >-
        Binary frames carry the console's output: first up to 256 KiB of its
        recent output, then its live output. Frames sent are its input.
        Several websockets can attach at once, and closing one leaves the
        console running. The server closes the websocket normally (1000) once
        the console has ended.
      operationId: getConsoleWs
      parameters:
        - name: pid
          in: path
          description: process ID of the console
          required: true
          schema:
            type: integer
      responses:
        "101":
          description: switching protocols
        "403":
          description: the role may not use a console (miniconsole get)
        "404":
          description: no running console with this pid belongs to the user
  "/console/{pid}/size":
    post:
      tags:
        - Console
      summary: Set a console's terminal size
      description: >-
        Both query parameters are required and must be unsigned integers: a
        request without them, or with a value that is not all digits, does not
        match this route at all.
      operationId: postConsoleSize
      parameters:
        - name: pid
          in: path
          description: process ID of the console
          required: true
          schema:
            type: integer
        - name: cols
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 65535
        - name: rows
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 65535
      responses:
        "200":
          description: successful operation
        "400":
          description: the pid is not a number, or rows or cols is above 65535
        "403":
          description: the role may not start a console (miniconsole post)
        "404":
          description: no running console with this pid belongs to the user
        "500":
          description: the terminal size could not be set
  "/features":
    servers:
      - url: http://localhost:3000
    get:
      tags:
        - Features
      summary: List the server's enabled optional features
      description: >-
        Served from the server root rather than under `/api/v1`, and needs
        neither credentials nor a permission.
      operationId: getFeatures
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Features"
  "/downloads/tunneler":
    servers:
      - url: http://localhost:3000
    get:
      tags:
        - Tunneler
      summary: List the tunneler builds installed on this server
      description: >-
        Names the phenix-tunneler builds in the server's `downloads/tunneler`
        directory, sorted, so the Tunneler page offers only downloads that
        exist. A build may be a link to a file elsewhere. Subdirectories,
        hidden files (names starting with a dot), broken links and anything
        else that is not a file are left out, and an empty list is returned
        once the directory is gone. Both
        download paths are served from the server root, not under `/api/v1`,
        and need neither credentials nor a permission. They exist only while
        the `tunneler-download` feature is on, which it is when that directory
        exists, relative to the directory the server runs from, at startup;
        without it, the request falls through to the web UI instead.
      operationId: getDownloadsTunneler
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tunnelers"
        "500":
          description: the downloads directory exists but could not be read
  "/downloads/tunneler/{name}":
    servers:
      - url: http://localhost:3000
    get:
      tags:
        - Tunneler
      summary: Download a tunneler build
      description: >-
        Serves one of the builds `GET /downloads/tunneler` lists, as an
        attachment under its own name. Only a file, or a link to one,
        directly in the downloads directory is served: a name that is a path,
        or that starts with a dot, is refused. Needs neither credentials nor a
        permission.
      operationId: getDownloadsTunnelerName
      parameters:
        - name: name
          in: path
          description: file name of the build, as the list reports it
          required: true
          schema:
            type: string
            example: phenix-tunneler-linux-amd64
      responses:
        "200":
          description: the build
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: the name is empty, is not a bare file name, or starts with a dot
        "404":
          description: no such build is installed on this server
        "500":
          description: the build could not be read or opened
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
  - url: http://localhost:3000/api/v1
components:
  schemas:
    Console:
      type: object
      properties:
        pid:
          type: integer
          description: process ID of the console
      required:
        - pid
    Configs:
      type: object
      properties:
        configs:
          type: array
          items:
            $ref: "#/components/schemas/Config"
    Config:
      type: object
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          type: object
          properties:
            name:
              type: string
            annotations:
              type: object
              additionalProperties:
                type: string
          required:
            - name
        spec:
          type: object
          additionalProperties: true
      required:
        - apiVersion
        - kind
        - metadata
        - spec
    Experiments:
      type: object
      properties:
        experiments:
          type: array
          items:
            $ref: "#/components/schemas/Experiment"
    Experiment:
      type: object
      properties:
        id:
          type: string
          description: unused; always empty
        name:
          type: string
        topology:
          type: string
        scenario:
          type: string
          description: the scenario's name; empty when the experiment has none
        status:
          type: string
          description: >-
            what the server is doing to the experiment (starting, stopping,
            creating, deleting, ...). `GET /experiments` otherwise reports
            started or stopped; other responses otherwise leave it empty.
        apps:
          type: array
          items:
            type: string
        start_time:
          type: string
          format: date-time
        running:
          type: boolean
        percent:
          type: number
          description: >-
            start progress from 0 to 1 while the experiment is starting;
            reported by `GET /experiments` only
        vm_count:
          type: integer
        delayed_vms:
          type: integer
        vlan_min:
          type: integer
        vlan_max:
          type: integer
        vlan_count:
          type: integer
        vlans:
          type: array
          items:
            type: object
            properties:
              vlan:
                type: integer
              alias:
                type: string
        vms:
          type: array
          items:
            $ref: "#/components/schemas/VM"
    VMs:
      type: object
      properties:
        vms:
          type: array
          items:
            $ref: "#/components/schemas/VM"
        total:
          type: integer
          description: how many VMs there are, before paging
    VM:
      type: object
      properties:
        name:
          type: string
        experiment:
          type: string
        host:
          type: string
        ipv4:
          type: array
          items:
            type: string
        cpus:
          type: integer
        ram:
          type: integer
        disk:
          type: string
        dnb:
          type: boolean
        networks:
          type: array
          items:
            type: string
        taps:
          type: array
          items:
            type: string
        captures:
          type: array
          items:
            $ref: "#/components/schemas/Capture"
        running:
          type: boolean
        busy:
          type: boolean
        state:
          type: string
        cdRom:
          type: string
        tags:
          type: object
          additionalProperties:
            type: string
        ccActive:
          type: boolean
        external:
          type: boolean
        delayed_start:
          type: string
        snapshot:
          type: boolean
        inject_partition:
          type: integer
        description:
          type: string
        uptime:
          type: number
          format: float
        screenshot:
          type: string
          format: base64
        annotations:
          type: object
          additionalProperties: true
          nullable: true
          description: >-
            the node's annotations; only a single VM's GET response, and its
            PATCH response when the role may also get the VM, carry them. VM
            lists, other responses and websocket updates send null.
    Schedule:
      type: object
      properties:
        schedule:
          type: array
          items:
            type: object
            properties:
              vm:
                type: string
              host:
                type: string
              auto_assigned:
                type: boolean
    Captures:
      type: object
      properties:
        captures:
          type: array
          items:
            $ref: "#/components/schemas/Capture"
    Capture:
      type: object
      properties:
        vm:
          type: string
        interface:
          type: integer
        filepath:
          type: string
    Snapshots:
      type: object
      properties:
        snapshots:
          type: array
          items:
            type: string
    Files:
      type: object
      properties:
        files:
          type: array
          description: the files on the requested page, or all of them
          items:
            type: object
            properties:
              name:
                type: string
              path:
                type: string
                description: path relative to the experiment's files directory
              date:
                type: string
              size:
                type: integer
              categories:
                type: array
                items:
                  type: string
              plainText:
                type: boolean
              isDir:
                type: boolean
        total:
          type: integer
          description: how many files match, before paging
    FilePaths:
      type: object
      required:
        - paths
      properties:
        paths:
          type: array
          description: file paths relative to the experiment's files directory, as listed
          items:
            type: string
    FilesDeleted:
      type: object
      properties:
        deleted:
          type: array
          items:
            type: string
        failed:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              error:
                type: string
    ScorchPipelines:
      type: object
      description: >-
        Every Scorch run of an experiment, with the state of the scorch app
        and of the experiment itself.
      properties:
        pipelines:
          type: array
          description: >-
            one pipeline per run in the scorch app metadata, in run order,
            each the run's top-level loop; null when it configures no runs
          nullable: true
          items:
            $ref: "#/components/schemas/ScorchPipeline"
        running:
          type: integer
          description: >-
            the run the scorch app is executing, or -1 when the app is not
            running or has reported no run
          example: -1
        app_running:
          type: boolean
          description: whether the scorch app itself is running
        experiment:
          type: object
          description: the experiment's own state, so the Scorch page can show it
          properties:
            status:
              type: string
              description: >-
                started, stopped, or what the server is doing to it (starting,
                stopping, ...)
    ScorchPipeline:
      type: object
      description: >-
        One loop of a run's pipeline: a node per stage (`configure`, `start`, a
        `loop` node when this loop nests another, `stop`, `cleanup` and
        `done`), a node per component the loop names, and the edges that order
        them. A node's index is its position in `pipeline`, which is what an
        edge points at.
      properties:
        name:
          type: string
          description: the run's name, when the run's metadata names it
        hasCleanup:
          type: boolean
          description: >-
            whether this loop defines cleanup components. For a run's
            top-level loop (loop 0) those are the run's, which can be run on
            their own; for a nested loop they are that loop's.
        pipeline:
          type: array
          items:
            $ref: "#/components/schemas/ScorchPipelineNode"
    ScorchPipelineNode:
      type: object
      properties:
        name:
          type: string
          description: the stage's name, or the component's
        hint:
          type: string
          description: always sent, always empty at present
        status:
          type: string
          description: the latest status reported for the node
          enum:
            - unknown
            - running
            - background
            - unstable
            - success
            - failure
        stage:
          type: string
          description: the stage a component node belongs to; empty on a stage node
        exp:
          type: string
        run:
          type: integer
        loop:
          type: integer
        next:
          type: array
          description: edges to the nodes that follow this one
          items:
            $ref: "#/components/schemas/ScorchPipelineEdge"
    ScorchPipelineEdge:
      type: object
      properties:
        index:
          type: integer
          description: position of the node the edge points at in `pipeline`
        weight:
          type: integer
          description: 0 until the edge has been taken, then 2
    Hosts:
      type: object
      properties:
        hosts:
          type: array
          items:
            $ref: "#/components/schemas/Host"
    Host:
      type: object
      properties:
        name:
          type: string
        cpus:
          type: integer
        cpucommit:
          type: integer
        load:
          type: array
          description: the 1, 5 and 15 minute load averages
          items:
            type: string
        memused:
          type: integer
        memtotal:
          type: integer
        memcommit:
          type: integer
        tx:
          type: number
        rx:
          type: number
        bandwidth:
          type: string
        diskusage:
          type: object
          description: >-
            percent in use of the disks holding the phenix and minimega base
            directories
          properties:
            diskphenix:
              type: number
            diskminimega:
              type: number
        netcommit:
          type: integer
        vms:
          type: integer
        uptime:
          type: number
          format: float
        schedulable:
          type: boolean
        headnode:
          type: boolean
    Applications:
      type: object
      properties:
        applications:
          type: array
          items:
            type: string
    BuilderTopology:
      type: object
      required:
        - topology
        - builderXML
      properties:
        name:
          type: string
          description: topology name; ignored by PUT /builder/topologies/{name}
        topology:
          type: object
          description: generated topology spec
          properties:
            nodes:
              type: array
              items:
                type: object
        builderXML:
          type: string
          description: mxGraph document for the diagram
        vlans:
          type: object
          description: VLAN alias to ID, used by the experiment endpoints only
          additionalProperties:
            type: integer
        scenario:
          type: string
          description: scenario name, used by the experiment endpoints only
    Topologies:
      type: object
      properties:
        topologies:
          type: array
          items:
            type: string
    Disks:
      type: object
      properties:
        disks:
          type: array
          description: sorted by name, then by full path
          items:
            $ref: "#/components/schemas/Disk"
    Disk:
      type: object
      properties:
        kind:
          type: string
          enum: [VM, Container, ISO, Unknown]
        name:
          type: string
          description: >-
            the image's file name, which `disks` permissions name; images in
            different folders can share it
        fullPath:
          type: string
          description: >-
            the image's absolute path, without `.` or `..` segments, which
            identifies it
        relativePath:
          type: string
          description: >-
            the image's path relative to the minimega files directory, or empty
            when the image is outside it
        outsideFilesDir:
          type: boolean
          description: whether the image is outside the minimega files directory
        readOnly:
          type: boolean
          description: >-
            whether the disk actions refuse the image: it is outside the
            minimega files directory, or in a folder the disk list leaves out,
            such as an experiment's files
        size:
          type: string
          description: size of the file, as a readable string
        virtualSize:
          type: string
          description: size the guest sees, as a readable string
        experiments:
          type: array
          description: >-
            experiments whose topology uses the image, directly or as the
            backing image of an image it uses
          nullable: true
          items:
            type: object
            properties:
              name:
                type: string
              running:
                type: boolean
        backingImages:
          type: array
          description: >-
            the full paths of the images this one is backed by, nearest first
          items:
            type: string
        inUse:
          type: boolean
          description: whether the image's file is in use, such as by a running VM
    Users:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
    User:
      type: object
      properties:
        username:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: object
          properties:
            name:
              type: string
            resources:
              type: array
              items:
                type: string
            resource_names:
              type: array
              items:
                type: string
            verbs:
              type: array
              items:
                type: string
    Credentials:
      type: object
      properties:
        username:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
        token:
          type: string
    SoHSummaries:
      type: object
      properties:
        experiments:
          type: array
          items:
            $ref: "#/components/schemas/SoHSummary"
    SoHSummary:
      type: object
      description: >-
        One experiment's state of health. Only `name`, `scenario`, `status`,
        `running`, `configured` and `vms.total` are reported for a stopped
        experiment.
      properties:
        name:
          type: string
        scenario:
          type: string
        status:
          type: string
          description: started, stopped, or what the server is doing to it (starting, stopping, ...)
        percent:
          type: number
          description: start progress from 0 to 1 while starting
        running:
          type: boolean
        configured:
          type: boolean
          description: whether the scenario includes the soh app
        started:
          type: boolean
        soh_initialized:
          type: boolean
          description: whether the soh app has finished a run
        soh_running:
          type: boolean
          description: whether the soh app is running now
        vms:
          $ref: "#/components/schemas/SoHVMCounts"
        down_vms:
          type: array
          description: VMs not running or not deployed (at most 50)
          items:
            type: string
        vms_error:
          type: string
          description: why minimega could not be asked for VM states
        hosts:
          type: integer
          description: hosts with results
        hosts_with_errors:
          type: integer
        checks:
          $ref: "#/components/schemas/SoHTally"
        reachability:
          $ref: "#/components/schemas/SoHTally"
        last_run:
          type: string
          format: date-time
          description: when the last run finished (the newest check for results from older versions)
        last_run_duration:
          type: number
          description: seconds the last run took
        history:
          type: array
          description: the last 20 runs, oldest first
          items:
            $ref: "#/components/schemas/SoHRun"
        failing_checks:
          type: array
          description: failing checks from the latest results, newest first (at most 50)
          items:
            $ref: "#/components/schemas/SoHFailingCheck"
        error:
          type: string
          description: why the experiment's soh results could not be read
    SoHVMCounts:
      type: object
      description: >-
        VMs by state. `known` is false when minimega was not or could not be
        asked; only `total` is set then. `failing` counts running VMs with a
        failing check.
      properties:
        known:
          type: boolean
        total:
          type: integer
        running:
          type: integer
        failing:
          type: integer
        notrunning:
          type: integer
        notboot:
          type: integer
        notdeploy:
          type: integer
        external:
          type: integer
        delayed:
          type: integer
    SoHTally:
      type: object
      properties:
        total:
          type: integer
        passing:
          type: integer
        failing:
          type: integer
    SoHRun:
      type: object
      properties:
        time:
          type: string
          format: date-time
        duration:
          type: number
        total:
          type: integer
        failing:
          type: integer
        hosts_failing:
          type: integer
        hosts_down:
          type: integer
    SoHFailingCheck:
      type: object
      properties:
        host:
          type: string
        check:
          type: string
          enum:
            - network
            - reachability
            - file
            - file absent
            - service
            - process
            - listener
            - container
            - custom test
        target:
          type: string
        error:
          type: string
        time:
          type: string
          format: date-time
    Features:
      type: object
      properties:
        features:
          type: array
          description: >-
            the enabled features, in no particular order: each one named with
            the `phenix ui --features` flag (such as `vm-mount`), `file-server`
            when a file server endpoint is configured, `tunneler-download` when
            the server's `downloads/tunneler` directory exists at startup, and
            `webshark` when a WebShark build is installed
          items:
            type: string
            example: webshark
    Tunnelers:
      type: object
      properties:
        files:
          type: array
          description: file names of the builds installed on this server, sorted
          items:
            type: string
            example: phenix-tunneler-linux-amd64
