        "404":
          $ref: "#/components/responses/BuilderNotFound"
  "/builder/drafts":
    get:
      tags:
        - Builder
      summary: List Builder drafts
      description: >
        Requires `configs` `list`. Returns the caller's own drafts, and
        separately the drafts of other users shared with the caller (`via`
        `share`) or the caller holds `builder-drafts` `list` for (`via`
        `role`). Drafts whose metadata this server can no longer read (for
        example, written by a newer phenix) are listed apart, as damaged:
        the caller's own, and those of other users the caller holds
        `builder-drafts` `list` for, never because of a share. They cannot be
        opened, only deleted. Drafts the caller may not see are never counted
        or described. `canDelete` says of each draft whether the caller may
        delete it. No row has `experiment`.
      operationId: getBuilderDrafts
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderDrafts"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
    post:
      tags:
        - Builder
      summary: Create a Builder draft
      description: >
        Requires `configs` `create`. The draft is owned by the caller and holds
        the document as its first snapshot. Nothing is published. With
        `forkOf`, the caller must be able to read that draft: own it, have it
        shared with them, or hold `builder-drafts` `get` for it. With a
        `sourceToken` naming a published document, the caller must hold
        `configs` `get` for the config it was published to. With a
        `sourceToken` naming the Builder file of a topology, the file is read
        as GET /builder/topologies/{topology}/document reads it, with the
        same permission and the same answers when it cannot be used, and the
        draft is refused with 409 when the file no longer holds the document
        the token names, or the topology is no longer read from its file.
        The server stamps the document before it stores it: `author` and
        `createdAt` are kept when the document has them, and are otherwise the
        caller and the current time; `updatedBy` and `updatedAt` are always
        the caller and the current time, and values sent are replaced. One
        document is stored as it is: the document a `sourceToken` of the
        `builder-doc/` or `builder-file/` form names, sent back unchanged, so
        the draft holds exactly what was opened, under the same digest. A
        value that is not valid in any of the four fields refuses the request
        (422). The response has no document; its `stamp` holds the four
        values the stored document has. A draft opened from a published
        document, or one that forks a draft, has `experiment` when that
        publication made an experiment that still exists and the caller
        holds `experiments` `get` for it.
      operationId: postBuilderDrafts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderDraftCreate"
      responses:
        "201":
          description: draft created
          headers:
            ETag:
              $ref: "#/components/headers/BuilderETag"
            Location:
              schema:
                description: location of the new draft
                type: string
                format: uri-reference
            Warning:
              $ref: "#/components/headers/BuilderWarning"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderDraft"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "409":
          description: >
            The `sourceToken` names the Builder file of a topology, and the
            file's document changed since it was opened, or the topology is no
            longer read from its file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "413":
          $ref: "#/components/responses/BuilderTooLarge"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/drafts/{owner}/{draft}":
    parameters:
