          example: 8
    LoggingSettings:
      title: Logging Settings
      type: object
      description: When the server rotates the system log file, and how many old files it keeps.
      properties:
        max_file_rotations:
          title: Max File Rotations
          type: integer
          description: old log files to keep
          example: 3
        max_file_size:
          title: Max File Size
          type: integer
          description: size in megabytes at which the server rotates the log file
          example: 100
        max_file_age:
          title: Max File Age
