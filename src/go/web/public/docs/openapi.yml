      description: >-
        Removes the link quality of one interface of a VM of a running
        experiment (minimega `clear qos`). Needs the `vms` `patch` permission
        on `<exp>/<vm>`. Sends a websocket `experiment/vm` `update` of the VM.
      operationId: deleteExperimentsNameVmsNameInterfacesIndexQos
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of the VM
          required: true
          schema:
            type: string
        - name: iface
          in: path
          description: index of the VM's interface, from 0, in the order of the topology node's interfaces
          required: true
          example: 0
          schema:
            type: integer
            minimum: 0
      responses:
        "204":
          description: the link quality was cleared
        "400":
          description: an index that is not an interface of the VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the experiment or the VM does not exist, or minimega does not have the VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: the experiment is not running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: minimega could not clear the link quality
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{exp_name}/vms/{vm_name}/screenshot.png":
    get:
      tags:
        - Virtual Machines
      summary: Get screenshot of running VM in experiment
      operationId: getExperimentsNameVmsNameScreenshot
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix virtual machine to get screenshot from
          required: true
          schema:
            type: string
        - name: size
          in: query
          description: >-
            width of the screenshot, a whole number from 1 to 4096, rounded up
            to a multiple of 200 (at most 4096)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 4096
            default: 200
        - name: base64
          in: query
          description: >-
            set to true to get the screenshot as a `data:image/png;base64,` URL
            in `text/plain`. Set to false or omit it to get the PNG. A value
            that is not a boolean is refused with 400.
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: successful operation
          content:
            text/plain:
              schema:
                type: string
                description: the screenshot as a data URL, when `base64` is true
                example: data:image/png;base64,iVBORw0KGgo=
            image/png:
              schema:
                type: string
                format: binary
        "400":
          description: >-
            the size is out of range, the `base64` value is not a boolean, or
            no screenshot could be taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: the role may not get the VM's screenshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{exp_name}/vms/{vm_name}/vnc":
    get:
      tags:
        - Virtual Machines
      summary: Open a VM's VNC page
      description: >-
        The noVNC page that connects to the VM's console over
        `GET /experiments/{exp_name}/vms/{vm_name}/vnc/ws`, with the VM's
        `vncBanner` annotation as its banner. A browser opens it as a link,
        with the token as `?token=`. The page sends a Content-Security-Policy
        that runs only its own scripts, and is not cached. Needs the
        `vms/vnc` `get` permission.
      operationId: getExperimentsNameVmsNameVnc
      parameters:
        - $ref: "#/components/parameters/ExpName"
        - $ref: "#/components/parameters/VMName"
      responses:
        "200":
          description: the VNC page
          content:
            text/html:
              schema:
                type: string
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the experiment's topology has no such VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the page could not be built
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{exp_name}/vms/{vm_name}/vnc/ws":
    get:
      tags:
        - Virtual Machines
      summary: Tunnel to VNC of running VM using a WebSocket
      description: >-
        Proxies the VM's VNC console. Binary frames carry the raw VNC (RFB)
        bytes both ways between the client and the VM's VNC port. Needs the
        `vms/vnc` `get` permission.
      operationId: getExperimentsNameVmsNameVncWs
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix virtual machine to connect to
          required: true
          schema:
            type: string
      responses:
        "101":
          description: switching protocols
        "400":
          description: the VM's VNC endpoint could not be found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: the role may not `get` the VM's `vms/vnc`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            the server is shutting down (`Retry-After` says when to try again)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{exp_name}/vms/{vm_name}/captures":
    get:
      tags:
        - Virtual Machines
      summary: List a VM's packet captures
      operationId: getExperimentsNameVmsNameCaptures
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM to get captures for
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Captures"
        "403":
          description: the role may not list the VM's captures
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - Virtual Machines
      summary: Start a packet capture on a VM
      description: >-
        Starts a packet capture on one interface of a running VM, into the
        experiment's files directory. Needs the `vms/captures` `create`
        permission.
      operationId: postExperimentsNameVmsNameCapture
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM to start capture on
          required: true
          schema:
            type: string
      requestBody:
        description: phenix VM packet capture parameters
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                interface:
                  title: "Interface"
                  description: "Minimega interface index to capture."
                  example: 1
                  type: integer
                filename:
                  title: "Filename"
                  description: >-
                    name of the capture file in the experiment's files
                    directory. A folder part is dropped, and `.pcap` is added
                    when the name does not end in it.
                  example: capture.pcap
                  type: string
            example:
              interface: 0
              filename: capture.pcap
      responses:
        "204":
          description: successful operation
        "400":
          description: >-
            a malformed body, no filename, an interface index that the VM does
            not have, or an interface that is not connected to a VLAN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the experiment does not exist, or its topology does not have the VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: the VM is not running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the capture could not be started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - Virtual Machines
      summary: Stop a VM's packet captures
      description: >-
        Stops the VM's packet captures, or with `iface`, only the capture on
        that interface. Needs the `vms/captures` `delete` permission.
      operationId: deleteExperimentsNameVmsNameCaptures
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM to stop captures on
          required: true
          schema:
            type: string
        - name: iface
          in: query
          description: >-
            the index of the interface whose capture to stop. Without it,
            every capture of the VM stops.
          required: false
          example: 0
          schema:
            type: integer
            minimum: 0
      responses:
        "204":
          description: successful operation
        "400":
          description: iface is not a whole number, or is less than 0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            no capture runs on the VM, or with iface, on that interface (for
            example, captures already stopped)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the captures could not be stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{exp_name}/vms/{vm_name}/captures/{interface}/stream":
    get:
      tags:
        - Virtual Machines
      summary: Stream a running packet capture
      description: >-
        Streams a running capture as a pcap file until the capture stops. The
        stream starts with everything captured so far (or, with `from=now`,
        nothing captured before the request), then each packet as it is
        captured. A plain request
        gets a chunked `application/vnd.tcpdump.pcap` body that Wireshark can
        read from a pipe, for example `curl -sN -H 'X-Phenix-Auth-Token:
        Bearer <token>' <url> | wireshark -k -i -`. A websocket request gets
        the same bytes as binary messages: the first holds the pcap file
        header and each later one whole packets. Needs the `vms/captures`
        `list` permission on `<exp>/<vm>` and `experiments/files` `get` on the
        experiment.
      operationId: getExperimentsNameVmsNameCapturesInterfaceStream
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM being captured
          required: true
          schema:
            type: string
        - name: interface
          in: path
          description: index of the VM interface being captured
          required: true
          example: 0
          schema:
            type: integer
        - name: from
          in: query
          description: "`now` to skip packets captured before the request"
          required: false
          schema:
            type: string
            enum: [now]
      responses:
        "101":
          description: switching protocols (websocket)
        "200":
          description: the capture, streamed as it grows
          headers:
            Content-Disposition:
              description: "`attachment`, named `<vm>-<interface>.pcap`"
              schema:
                type: string
            Cache-Control:
              description: "`no-store`"
              schema:
                type: string
          content:
            application/vnd.tcpdump.pcap:
              schema:
                type: string
                format: binary
        "400":
          description: the interface is not an index, or the capture path is not safe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the interface is not being captured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the capture could not be opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            the server is shutting down (`Retry-After` says when to try again)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{exp_name}/vms/{vm_name}/cdrom":
    post:
      tags:
        - Virtual Machines
      summary: Change the disc in a VM's CD-ROM drive
      description: >-
        Inserts an image into the running VM's CD-ROM drive, replacing any
        there, and publishes an `experiment/vm` `cdrom-inserted` message on
        the `/ws` websocket. Needs the `vms/cdrom` `update` permission.
      operationId: postExperimentsNameVmsNameCdrom
      parameters:
        - $ref: "#/components/parameters/ExpName"
        - $ref: "#/components/parameters/VMName"
        - name: isoPath
          in: query
          description: the image to insert, as minimega names it
          required: true
          schema:
            type: string
          example: /phenix/images/tools.iso
      responses:
        "204":
          description: the disc was changed
        "400":
          description: >-
            no image path, or an image path minimega cannot use (white space,
            quotes, a backslash, `#`, `$`, `,`, glob characters or a control
            character)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            the experiment does not exist, its topology does not have the VM, or
            minimega does not have the VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: the experiment is not running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the disc could not be changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - Virtual Machines
      summary: Eject the disc in a VM's CD-ROM drive
      description: >-
        Ejects the running VM's CD-ROM and publishes an `experiment/vm`
        `cdrom-ejected` message on the `/ws` websocket. Needs the `vms/cdrom`
        `delete` permission.
      operationId: deleteExperimentsNameVmsNameCdrom
      parameters:
        - $ref: "#/components/parameters/ExpName"
        - $ref: "#/components/parameters/VMName"
      responses:
        "204":
          description: the disc was ejected
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            the experiment does not exist, its topology does not have the VM, or
            minimega does not have the VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: the experiment is not running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the disc could not be ejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{exp_name}/vms/{vm_name}/commit":
    post:
      tags:
        - Virtual Machines
      summary: Commit a VM's disk to a new image
      description: >-
        Writes the running VM's disk as it is now, its snapshot's changes
        included, to a new image backed by nothing else. It pauses the VM while
        it writes, and answers once the image is written.
        Progress is published on the `/ws` websocket as
        `experiment/vm/commit` messages (`committing`, `progress` with a
        `percent`, then `commit` with this response, or
        `errorCommitting`). Needs the `vms/commit` `create` permission.
      operationId: postExperimentsNameVmsNameCommit
      parameters:
        - $ref: "#/components/parameters/ExpName"
        - $ref: "#/components/parameters/VMName"
      requestBody:
        description: >-
          the new image's `filename`, a bare file name with no `/`, written in
          the minimega files directory. Without a body, the server names the
          image after the VM's base image.
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageFilename"
      responses:
        "200":
          description: the new image, and the VM
          content:
            application/json:
              schema:
                type: object
                properties:
                  disk:
                    title: Disk
                    type: string
                    description: the new image's name
                    example: web-committed.qc2
                  vm:
                    title: VM
                    description: the VM
                    allOf:
                      - $ref: "#/components/schemas/VM"
        "400":
          description: >-
            a malformed body, no filename, a filename that is not a bare file
            name (a folder, `.` or `..`), a filename that minimega cannot take
            as one argument, or an experiment that could not be read afterwards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            the experiment does not exist, its topology does not have the VM,
            or minimega does not have the VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: another action holds the VM, or the experiment is not running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the disk could not be committed, or the VM read back
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{exp_name}/vms/{vm_name}/files":
    get:
      tags:
        - Virtual Machines
      summary: List a folder of a mounted VM disk
      description: >-
        Lists the folder's entries, with paths relative to the mount. Entries
        read before a read error are still listed, with the error in `error`.
        Only with the `vm-mount` feature. Needs the `vms/mount` `list`
        permission.
      operationId: getExperimentsNameVmsNameFiles
      parameters:
        - $ref: "#/components/parameters/ExpName"
        - $ref: "#/components/parameters/VMName"
        - name: path
          in: query
          description: the folder, relative to the mount
          required: true
          schema:
            type: string
          example: etc
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    title: Error
                    type: string
                    description: why the folder could not be read in full, or empty when it was
                    example: ""
                  files:
                    title: Files
                    type: array
                    nullable: true
                    description: the folder's entries, or null when it is empty
                    items:
                      $ref: "#/components/schemas/File"
        "400":
          description: the VM is not mounted, or the path is a file or outside the mount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the path could not be read, or reading it timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{exp_name}/vms/{vm_name}/files/copy":
    post:
      tags:
        - Virtual Machines
      summary: Copy an experiment file into a mounted VM disk
      description: >-
        Copies one of the experiment's files on the head node into a folder of
        the mount, under its own name. It replaces a file of that
        name. Only with the `vm-mount` feature. Needs the `vms/mount` `patch`
        permission and the `experiments/files` `get` permission.
      operationId: postExperimentsNameVmsNameFilesCopy
      parameters:
        - $ref: "#/components/parameters/ExpName"
        - $ref: "#/components/parameters/VMName"
        - name: source
          in: query
          description: the experiment file, relative to the experiment's files directory
          required: true
          schema:
            type: string
          example: captures/router_eth0.pcap
        - name: path
          in: query
          description: >-
            the folder to copy into, relative to the mount. Empty or absent
            means the mount's root.
          required: false
          schema:
            type: string
          example: tmp
      responses:
        "200":
          description: the file was copied
        "400":
          description: >-
            the VM is not mounted, the folder is outside the mount or a file,
            or the source is not one of the experiment's files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the folder or the source could not be read, or the copy failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{exp_name}/vms/{vm_name}/files/download":
    get:
      tags:
        - Virtual Machines
      summary: Download a file from a mounted VM
      description: >-
        Streams a file from the VM's mounted disk, mounted with
        `POST /experiments/{exp_name}/vms/{vm_name}/mount`, as an attachment.
        Downloads resume with `Range` and `If-Range`, as other downloads do.
        Served only while the `vm-mount` feature is on. Needs the `vms/mount`
        `get` permission on `<exp>/<vm>`.
      operationId: getExperimentsNameVmsNameFilesDownload
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of the mounted VM
          required: true
          schema:
            type: string
        - name: path
          in: query
          description: the file, relative to the root of the VM's mount
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/RangeHeader"
        - $ref: "#/components/parameters/IfRangeHeader"
        - $ref: "#/components/parameters/IfNoneMatchHeader"
      responses:
        "200":
          description: the file
          headers:
            Content-Disposition:
              description: "`attachment`, named after the file"
              schema:
                type: string
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/LastModified"
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          $ref: "#/components/responses/PartialContent"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: the VM is not mounted, or the path is a folder or outside the mount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no such file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
        "500":
          description: the file could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    head:
      tags:
        - Virtual Machines
      summary: Check a mounted VM file download
      description: >-
        The GET response's headers without the file: its size
        (Content-Length), `ETag` and `Last-Modified`. Needs the `vms/mount`
        `get` permission on `<exp>/<vm>`.
      operationId: headExperimentsNameVmsNameFilesDownload
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of the mounted VM
          required: true
          schema:
            type: string
        - name: path
          in: query
          description: the file, relative to the root of the VM's mount
          required: true
          schema:
            type: string
      responses:
        "200":
          description: the file's headers
          headers:
            Content-Length:
              description: the file's size in bytes
              schema:
                type: integer
            Content-Disposition:
              description: "`attachment`, named after the file"
              schema:
                type: string
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/LastModified"
        "400":
          description: the VM is not mounted, or the path is a folder or outside the mount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no such file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the file could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{exp_name}/vms/{vm_name}/restart":
    post:
      tags:
        - Virtual Machines
      summary: Restart a VM
      description: >-
        Resets the running VM, as its reset button would, or starts it if it
        has quit, and answers with it. Needs the `vms/restart` `update`
        permission.
      operationId: postExperimentsNameVmsNameRestart
      parameters:
        - $ref: "#/components/parameters/ExpName"
        - $ref: "#/components/parameters/VMName"
      responses:
        "200":
          description: the VM, restarted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        "400":
          description: the experiment could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            the experiment does not exist, its topology does not have the VM,
            or minimega does not have the VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: the experiment is not running, or another action holds the VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the VM could not be restarted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{exp_name}/vms/{vm_name}/shutdown":
    post:
      tags:
        - Virtual Machines
      summary: Shut a VM down
      description: >-
        Stops the VM's packet captures and asks it to power off, killing it
        if it has not within 30 seconds, and answers with it. Needs the
        `vms/shutdown` `update` permission.
      operationId: postExperimentsNameVmsNameShutdown
      parameters:
        - $ref: "#/components/parameters/ExpName"
        - $ref: "#/components/parameters/VMName"
      responses:
        "200":
          description: the VM, shut down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        "400":
          description: the experiment could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            the experiment does not exist, its topology does not have the VM,
            or minimega does not have the VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: the experiment is not running, or another action holds the VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the VM could not be shut down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{exp_name}/vms/{vm_name}/reset":
    post:
      tags:
        - Virtual Machines
      summary: Reset a VM's disk
      description: >-
        Stops the VM's packet captures and kills the VM. Then it replaces its
        disk snapshot with a new one of its image, so the changes the VM made
        are lost. Then it starts the VM again and answers with it. The VM must
        run from
        a snapshot. Needs the `vms/reset` `update` permission.
      operationId: postExperimentsNameVmsNameReset
      parameters:
        - $ref: "#/components/parameters/ExpName"
        - $ref: "#/components/parameters/VMName"
      responses:
        "200":
          description: the VM, reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        "400":
          description: the experiment could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            the experiment does not exist, its topology does not have the VM,
            or minimega does not have the VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: the experiment is not running, or another action holds the VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the VM could not be reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{exp_name}/vms/{vm_name}/memorySnapshot":
    post:
      tags:
        - Virtual Machines
      summary: Snapshot a VM's memory to a file
      description: >-
        Dumps the running VM's memory to a file and answers once it is
        written. Progress is published on the `/ws` websocket as
        `experiment/vm/memorySnapshot` messages (`committing`, `progress`
        with a `percent`, then `commit` with the file's name as `disk`, or
        `errorCommitting`). Needs the `vms/memorySnapshot` `create`
        permission.
      operationId: postExperimentsNameVmsNameMemorySnapshot
      parameters:
        - $ref: "#/components/parameters/ExpName"
        - $ref: "#/components/parameters/VMName"
      requestBody:
        description: >-
          the dump's `filename`. Its extension becomes `.elf`. A relative name
          is saved in the experiment's files directory. An absolute path is
          also accepted, but for a VM on another node it must be in the
          experiment's files directory.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageFilename"
            example:
              filename: web-memory.elf
      responses:
        "204":
          description: the memory snapshot was written
        "400":
          description: >-
            a malformed body, no filename, a filename that minimega cannot
            take as one argument, or, for a VM on a node other than the
            headnode, a path outside the experiment's files directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            the experiment does not exist, its topology does not have the VM,
            or minimega does not have the VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: another action holds the VM, or the experiment is not running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the memory snapshot failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{exp_name}/vms/{vm_name}/forwards":
    get:
      tags:
        - Virtual Machines
      summary: List a VM's port forwards
      description: >-
        Every user's forwards to the VM, after dropping those whose tunnel
        has closed. Needs the `vms/forwards` `list` permission.
      operationId: getExperimentsNameVmsNameForwards
      parameters:
        - $ref: "#/components/parameters/ExpName"
        - $ref: "#/components/parameters/VMName"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  listeners:
                    title: Listeners
                    type: array
                    nullable: true
                    description: the forwards, or null when there are none
                    items:
                      $ref: "#/components/schemas/PortForward"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - Virtual Machines
      summary: Forward a port to a VM
      description: >-
        Opens a minimega tunnel from a cluster port to the destination, as
        seen from the VM's cluster host, and makes it the caller's forward. `GET
        .../forwards/{host}/{port}/ws` attaches to the forward, and
        `phenix-tunneler` serves it on the caller's own computer. `dst=VNC`
        forwards the VM's VNC console instead. A user has at most one forward
        to each host and port of a VM. Publishes an `experiment/vm/forward`
        `create` message on the `/ws` websocket. Needs the `vms/forwards`
        `create` permission.
      operationId: postExperimentsNameVmsNameForwards
      parameters:
        - $ref: "#/components/parameters/ExpName"
        - $ref: "#/components/parameters/VMName"
        - name: src
          in: query
          description: the local port the forward is to be served on, recorded for the tunneler
          required: true
          schema:
            type: integer
          example: 2222
        - name: host
          in: query
          description: the destination host, as the VM's cluster host reaches it
          required: false
          schema:
            type: string
            default: 127.0.0.1
        - name: dst
          in: query
          description: the destination port, or `VNC` for the VM's VNC console
          required: true
          schema:
            type: string
          example: "22"
      responses:
        "204":
          description: the forward was created
        "400":
          description: >-
            the forward could not be created. A port is not a number, the VM was
            not found, the user has this forward already, or the tunnel failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: minimega did not answer within 5 minutes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - Virtual Machines
      summary: Close a port forward to a VM
      description: >-
        Closes the caller's own forward to the host and port, and publishes an
        `experiment/vm/forward` `delete` message on the `/ws` websocket.
        Needs the `vms/forwards` `delete` permission.
      operationId: deleteExperimentsNameVmsNameForwards
      parameters:
        - $ref: "#/components/parameters/ExpName"
        - $ref: "#/components/parameters/VMName"
        - name: host
          in: query
          description: the forward's destination host
          required: false
          schema:
            type: string
            default: 127.0.0.1
        - name: dst
          in: query
          description: the forward's destination port (5900 for a VNC forward)
          required: true
          schema:
            type: integer
          example: 22
      responses:
        "204":
          description: the forward was closed
        "400":
          description: the port is not a number, or the user has no such forward
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: minimega does not know the VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the tunnel could not be closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: minimega did not answer within 5 minutes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{exp_name}/vms/{vm_name}/forwards/{host}/{port}/ws":
    get:
      tags:
        - Virtual Machines
      summary: Attach to a port forward over a WebSocket
      description: >-
        Proxies the forward's TCP connection over the websocket in binary
        frames, both ways, until either side closes. The caller's own forward
        to the host and port is used, else another user's at random. The
        handshake needs an `Origin` header. Needs the `vms/forwards` `get`
        permission.
      operationId: getExperimentsNameVmsNameForwardsHostPortWs
      parameters:
        - $ref: "#/components/parameters/ExpName"
        - $ref: "#/components/parameters/VMName"
        - name: host
          in: path
          description: the forward's destination host
          required: true
          schema:
            type: string
        - name: port
          in: path
          description: the forward's destination port
          required: true
          schema:
            type: integer
      responses:
        "101":
          description: switching protocols, then the forward's bytes follow as binary frames
        "400":
          description: no forward to the host and port, or not a websocket handshake
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden, or a handshake without an `Origin` header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            the server is shutting down (`Retry-After` says when to try again)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{exp_name}/vms/{vm_name}/mount":
    post:
      tags:
        - Virtual Machines
      summary: Mount a VM's disk on the server
      description: >-
        Mounts the running VM's disk under the server's mount directory, for
        the file routes that follow, and counts the caller as one of its
        users. A request made while another is mounting it waits for that
        mount. Only with the `vm-mount` feature. Needs the `vms/mount` `post`
        permission.
      operationId: postExperimentsNameVmsNameMount
      parameters:
        - $ref: "#/components/parameters/ExpName"
        - $ref: "#/components/parameters/VMName"
      responses:
        "200":
          description: the disk is mounted
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: the disk is being unmounted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the disk could not be mounted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{exp_name}/vms/{vm_name}/files/upload":
    put:
      tags:
        - Virtual Machines
      summary: Upload a file into a mounted VM disk
      description: >-
        Writes the uploaded file into the folder under its own file name,
        replacing a file of that name. Only with the `vm-mount` feature.
        Needs the `vms/mount` `patch` permission.
      operationId: putExperimentsNameVmsNameFilesUpload
      parameters:
        - $ref: "#/components/parameters/ExpName"
        - $ref: "#/components/parameters/VMName"
        - name: path
          in: query
          description: the folder to write into, relative to the mount
          required: true
          schema:
            type: string
          example: tmp
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  title: File
                  type: string
                  format: binary
                  description: the file, saved under its file name
                  example: notes.txt
      responses:
        "200":
          description: the file was written
        "400":
          description: the VM is not mounted, or the path is outside the mount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the folder does not exist, the form has no file, or the file could not be written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{exp_name}/vms/{vm_name}/snapshots":
    get:
      tags:
        - Virtual Machines
      summary: List a VM's disk snapshots
      operationId: getExperimentsNameVmsNameSnapshots
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM to get snapshots for
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshots"
              example:
                snapshots: [before-update]
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the experiment does not exist, or its topology does not have the VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the experiment or its snapshots could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - Virtual Machines
      summary: Create a VM disk snapshot
      description: >-
        Takes a disk snapshot of the running VM. Needs the `vms/snapshots`
        `create` permission.
      operationId: postExperimentsNameVmsNameSnapshots
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM to snapshot
          required: true
          schema:
            type: string
      requestBody:
        description: phenix VM snapshot parameters
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filename:
                  title: "Filename"
                  description: >-
                    Name of the snapshot: a bare file name, with no folder,
                    that minimega can take as one argument (see the 400
                    response).
                  example: before-update
                  type: string
            example:
              filename: before-update
      responses:
        "204":
          description: successful operation
        "400":
          description: >-
            a malformed body, no filename, a filename that is not a bare file
            name (a folder, `.` or `..`), or a filename that minimega cannot
            take as one argument (white space, quotes, a backslash, `#`, `$`,
            `,`, glob characters or a control character)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            the experiment does not exist, its topology does not have the VM,
            or minimega does not have the VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            another action holds the VM, the experiment is not running, or the
            VM is not running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the snapshot failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{exp_name}/vms/{vm_name}/snapshots/{snapshot}":
    post:
      tags:
        - Virtual Machines
      summary: Restore a VM to a disk snapshot
      description: >-
        Restores the VM in the running experiment to the snapshot. Needs the
        `vms/snapshots` `update` permission.
      operationId: postExperimentsNameVmsNameSnapshotsSnapshot
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM to restore
          required: true
          schema:
            type: string
        - name: snapshot
          in: path
          description: name of snapshot to restore VM to
          required: true
          schema:
            type: string
      responses:
        "204":
          description: successful operation
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            the experiment does not exist, its topology does not have the VM,
            minimega does not have the VM, or the VM does not have the snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: another action holds the VM, or the experiment is not running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the restore failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/experiments/{exp_name}/vms/{vm_name}/unmount":
    delete:
      tags:
        - Virtual Machines
      summary: Unmount a VM's disk
      description: >-
        Ends the caller's use of the VM's mount. Once no user is left, it waits
        up to 30 seconds for the mount's file requests to finish, then unmounts
        the disk. A VM that is not mounted answers 200 too. Only
        with the `vm-mount` feature. Needs the `vms/mount` `delete`
        permission.
      operationId: deleteExperimentsNameVmsNameUnmount
      parameters:
        - $ref: "#/components/parameters/ExpName"
        - $ref: "#/components/parameters/VMName"
      responses:
        "200":
          description: the caller's use ended, and the disk is unmounted when no one else uses it
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            the disk is being mounted or unmounted, or file requests kept it
            busy for 30 seconds (`mount busy`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the disk could not be unmounted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/schedulers":
    get:
      tags:
        - Experiments
      summary: List the scheduling algorithms
      description: >-
        Lists the algorithms that POST /experiments/{name}/schedule can run:
        the built-in ones, sorted by name, then the user schedulers
        (`phenix-scheduler-<name>` executables on the server's PATH), sorted
        by name. Needs the `experiments/schedule` `create` permission on any
        experiment.
      operationId: getSchedulers
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedulers"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/vms":
    get:
      tags:
        - Virtual Machines
      summary: Get all running VMs
      description: >-
        The running VMs of every running experiment that the role may list.
        With `pageNum` and `perPage`, screenshots are taken only of the VMs on
        that page, and `total` counts them all.
      operationId: getVMs
      parameters:
        - name: screenshot
          in: query
          description: whether or not to include VM screenshots (value is size to grab)
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/PageNum"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: successful operation
          headers:
            X-Phenix-Seq:
              $ref: "#/components/headers/Seq"
            X-Phenix-Observed-At:
              $ref: "#/components/headers/ObservedAt"
            X-Phenix-Stale:
              $ref: "#/components/headers/Stale"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMs"
        "400":
          description: pageNum or perPage is not a whole number from 1 to 2147483647
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: the role may not list VMs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the store could not be read, so no experiments are known
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/soh":
    get:
      tags:
        - State of Health
      summary: Summarize the state of health of every experiment
      description: >-
        One summary per experiment the caller may `get` (the `experiments`
        `get` check of `GET /experiments/{name}/soh`). Needs the
        `experiments` `list` permission and the `vms` `list` permission.
        Results come from each experiment's soh app status. VM
        states come from one `vm info summary` per running experiment, or,
        while an experiment is starting or stopping, from the states last
        read. At most 50 failing checks and down VMs are listed per
        experiment.
      operationId: getSoH
      responses:
        "200":
          description: >-
            successful operation. The headers report the oldest VM states in the
            response, and whether any are earlier states.
          headers:
            X-Phenix-Seq:
              $ref: "#/components/headers/Seq"
            X-Phenix-Observed-At:
              $ref: "#/components/headers/ObservedAt"
            X-Phenix-Stale:
              $ref: "#/components/headers/Stale"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoHSummaries"
        "403":
          description: the role may not list experiments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/applications":
    get:
      tags:
        - Applications
      summary: Get all available user applications
      operationId: getApplications
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Applications"
              example:
                applications: [soh, scorch]
        "403":
          description: the role may not list applications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the apps could not be listed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/topologies":
    get:
      tags:
        - Topologies
      summary: Get all available topologies
      operationId: getTopologies
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topologies"
              example:
                topologies: [lab]
        "403":
          description: the role may not list topologies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the store cannot list the topologies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/topologies/{name}/scenarios":
    get:
      tags:
        - Topologies
      summary: Get the scenarios of a topology
      description: >-
        Maps each scenario whose `topology` annotation names the topology,
        and that the role may list, to the apps it runs. Needs the
        `scenarios` `list` permission.
      operationId: getTopologiesNameScenarios
      parameters:
        - name: name
          in: path
          description: name of the topology
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  scenarios:
                    title: Scenarios
                    type: object
                    description: each scenario's apps, by scenario name
                    additionalProperties:
                      type: array
                      items:
                        type: string
                    example:
                      demo-scenario: [soh, scorch]
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the scenarios could not be listed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/disks":
    get:
      tags:
        - Disks
      summary: Get all available disk images
      description: >-
        Lists the disk images in the minimega files directory and its folders,
        at most 16 levels deep: the files with a known extension (`.qcow2`,
        `.qc2`, `.qcow`, `_rootfs.tgz`, `.hdd` or `.iso`). It also lists the
        images that experiment topologies use, wherever they are, and the
        images that back them. Each image is listed once, by its full path.
        The search skips hidden names (starting with `.`), `lost+found`, the
        experiment folders `<experiment>/files`, `<experiment>/tmp` and
        `<experiment>/miniccc_responses`, the top-level `saved` and
        `transfer_*` folders, and symlinked folders. An image that qemu-img
        cannot open because qemu refuses its qcow2 version or feature bits is
        listed from its header, with a `formatIssue` of level `error`.

        Needs the `disks` `list` permission for each image's file name, which
        covers the files of that name in every folder. Outside the files
        directory, the list has only the images that an experiment the role
        may `get` uses, or that back an image the role sees. Each image's
        experiments are cut to those the role may `list`.
      operationId: getDisks
      parameters:
        - name: expName
          in: query
          description: >-
            look only in this experiment's topology, rather than every
            experiment's, for the images and uses it reports. Needs the
            `experiments` `get` permission for it.
          required: false
          schema:
            type: string
        - name: diskType
          in: query
          description: comma-separated kinds to list (vm, container, iso, unknown), all by default
          required: false
          example: vm,iso
          schema:
            type: string
        - name: refresh
          in: query
          description: >-
            set to true to inspect every image again rather than reuse what is
            known about images that have not changed
          required: false
          schema:
            type: boolean
        - $ref: "#/components/parameters/PageNum"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Disks"
        "400":
          description: pageNum or perPage is not a whole number from 1 to 2147483647
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            forbidden, including an `expName` the role may not get
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no experiment named `expName`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the images or the experiment could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - Disks
      summary: Upload a disk image
      description: >-
        Writes the uploaded file to the top level of the minimega files
        directory, under the file's own name. It replaces all of an image
        of that name. Needs the `disks` `upload` permission.
      operationId: postDisks
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  title: File
                  description: the disk image file to upload
                  example: ubuntu.qc2
                  type: string
                  format: binary
              required:
                - file
      responses:
        "200":
          description: successful operation
        "400":
          description: >-
            a body that is not a multipart form, no `file` part, or a file name
            that is not usable in the minimega files directory (such as `..`,
            a hidden name, or a name that is too long)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: a folder has the file's name in the minimega files directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the upload could not be read or written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - Disks
      summary: Delete a disk image
      description: >-
        Deletes the image's file. First, phenix finds the images whose backing
        chain holds the image, and the experiments whose VMs use it directly
        or through a backing chain, as GET /disks lists them. If it finds any,
        it keeps the file and answers 409 with the code `disk_in_use`. Send
        the delete again with `force=true` to delete the image anyway. Images
        backed by it then stop working. Needs the `disks` `delete` permission
        for the image's file name.
      operationId: deleteDisks
      parameters:
        - name: disk
          in: query
          description: >-
            the image, relative to the minimega files directory or absolute. It
            must be inside that directory and not in a folder the disk list
            leaves out.
          required: true
          example: ubuntu/ubuntu.qcow2
          schema:
            type: string
        - name: force
          in: query
          description: >-
            set to true to delete the image even when other images or
            experiments use it
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: successful operation
        "400":
          description: >-
            a path outside the minimega files directory or in a folder the
            disk list leaves out, a folder, or a `force` value that is not a
            boolean, or a required query parameter is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no such image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            other images or experiments use the image, and `force` is not
            true. The code is `disk_in_use` and `metadata.retry` is `force`.
            The message names at most 10 of them. `details.images` and
            `details.experiments` list those that the role may see, and
            `details.hidden` counts the others.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the file could not be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/disks/snapshot":
    post:
      tags:
        - Disks
      summary: Snapshot a disk image
      description: >-
        Makes a new qcow2 image backed by the image, with minimega's `disk
        snapshot`. Needs the `disks` `create` permission for the new image's
        file name and `get` for the image's.
      operationId: postDisksSnapshot
      parameters:
        - name: disk
          in: query
          description: >-
            the image, relative to the minimega files directory or absolute. It
            must be inside that directory and not in a folder the disk list
            leaves out.
          required: true
          example: ubuntu/ubuntu.qcow2
          schema:
            type: string
        - name: new
          in: query
          description: >-
            the new image, relative to the folder holding `disk` or absolute. It
            must name a file that does not exist yet. It is not empty and does
            not end in `/` or in a `.` or `..` element. The server adds `.qcow2`
            unless it ends in `.qc2` or `.qcow2`. The snapshot is a qcow2
            image, so the server also adds `.qcow2` to a name that ends in
            `.qcow`.
          required: true
          example: ubuntu-snap.qcow2
          schema:
            type: string
      responses:
        "200":
          description: successful operation
        "400":
          description: >-
            a path outside the minimega files directory or in a folder the
            disk list leaves out, or an image that is not a regular file. Also a
            `new` that names a folder rather than a file, or a name minimega
            cannot use. Such a name has white space, quotes, a backslash, `#`,
            `$`, `,`, glob characters or a control character.
            Also a required query parameter is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no such image, or no folder for the new one
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: the new image exists already
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: minimega could not make the snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/disks/commit":
    post:
      tags:
        - Disks
      summary: Commit a disk image into its backing image
      description: >-
        Writes the image's changes into the image backing it, with minimega's
        `disk commit`. Needs the `disks` `update` permission for both images'
        file names.
      operationId: postDisksCommit
      parameters:
        - name: disk
          in: query
          description: >-
            the image, relative to the minimega files directory or absolute. It
            must be inside that directory and not in a folder the disk list
            leaves out.
          required: true
          example: ubuntu/ubuntu.qcow2
          schema:
            type: string
      responses:
        "200":
          description: successful operation
        "400":
          description: >-
            the image or its backing image is outside the minimega files
            directory, in a folder the disk list leaves out, or not a regular
            file, or one of them can keep its data in other files, such as a
            vmdk image or a qcow2 image with an external data file. Also an
            image whose name minimega cannot use.
            Also a required query parameter is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no such image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: the image has no backing image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the commit failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/disks/rebase":
    post:
      tags:
        - Disks
      summary: Change a disk image's backing image
      description: >-
        Sets the image's backing image with minimega's `disk set-backing`, or,
        with `unsafe` false, `disk rebase`. Needs the `disks` `update`
        permission for the image's file name and `get` for the new backing
        image's file name.
      operationId: postDisksRebase
      parameters:
        - name: disk
          in: query
          description: >-
            the image, relative to the minimega files directory or absolute. It
            must be inside that directory and not in a folder the disk list
            leaves out.
          required: true
          example: ubuntu/ubuntu.qcow2
          schema:
            type: string
        - name: backing
          in: query
          description: >-
            the new backing image, as for `disk` (empty makes the image
            independent)
          required: true
          example: ubuntu/base.qcow2
          schema:
            type: string
        - name: unsafe
          in: query
          description: >-
            true to change only the backing image name, or false to also write
            the differences between the old and new backing images into the
            image
          required: true
          schema:
            type: boolean
      responses:
        "200":
          description: successful operation
        "400":
          description: >-
            a path outside the minimega files directory or in a folder the
            disk list leaves out, or an image that is not a regular file. With
            `unsafe` false, also an image of either backing chain that is outside
            that directory or can keep its data in other files, such as a vmdk
            image or a qcow2 image with an external data file. Also a
            name minimega cannot use, or an `unsafe` that is not a boolean. Such
            a name has white space, quotes, a backslash, `#`, `$`, `,`, glob
            characters or a control character.
            Also a required query parameter is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no such image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: minimega could not change the backing image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/disks/resize":
    post:
      tags:
        - Disks
      summary: Resize a disk image
      description: >-
        Resizes the image with minimega's `disk resize`. Needs the `disks`
        `update` permission for the image's file name.
      operationId: postDisksResize
      parameters:
        - name: disk
          in: query
          description: >-
            the image, relative to the minimega files directory or absolute. It
            must be inside that directory and not in a folder the disk list
            leaves out.
          required: true
          example: ubuntu/ubuntu.qcow2
          schema:
            type: string
        - name: size
          in: query
          description: >-
            the new size, or a change to it with a leading `+` or `-`, suffixed
            with K, M, G, T, P or E. For example, `50G` or `-500M`.
          required: true
          example: 50G
          schema:
            type: string
      responses:
        "200":
          description: successful operation
        "400":
          description: >-
            a path outside the minimega files directory or in a folder the
            disk list leaves out, or an image that is not a regular file. Also
            an image that can keep its data in other files, such as a vmdk image
            or a qcow2 image with an external data file. Also a
            name minimega cannot use, which has white space, quotes, a
            backslash, `#`, `$`, `,`, glob characters or a control character.
            Also a size not in the form above.
            Also a required query parameter is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no such image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: minimega could not resize the image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/disks/clone":
    post:
      tags:
        - Disks
      summary: Copy a disk image
      description: >-
        Copies the image's file to a new file, never replacing one. Needs the
        `disks` `create` permission for the new image's file name and `get`
        for the image's.
      operationId: postDisksClone
      parameters:
        - name: disk
          in: query
          description: >-
            the image, relative to the minimega files directory or absolute. It
            must be inside that directory and not in a folder the disk list
            leaves out.
          required: true
          example: ubuntu/ubuntu.qcow2
          schema:
            type: string
        - name: new
          in: query
          description: >-
            the new image, relative to the folder holding `disk` or absolute. It
            must name a file that does not exist yet. It is not empty and does
            not end in `/` or in a `.` or `..` element. The copy keeps the
            format of `disk`, so the extension of `disk` decides the name. For
            `.qcow2` or `.qc2`, the name can end in `.qcow2` or `.qc2`. For
            `.qcow`, it can also end in `.qcow`. For `.iso`, `.hdd` or
            `_rootfs.tgz`, it must end in that extension. The server adds
            `.qcow2`, `.qcow` or the extension of `disk` to a name that has no
            known image extension. A name with a different known image
            extension, such as `bar.qcow2` for `foo.iso`, gets `400`. When
            `disk` has no known extension, the server adds `.qcow2` unless the
            name ends in `.qc2` or `.qcow2`.
          required: true
          example: ubuntu-copy.qcow2
          schema:
            type: string
      responses:
        "200":
          description: successful operation
        "400":
          description: >-
            a path outside the minimega files directory or in a folder the
            disk list leaves out, or an image that is not a regular file. Also a
            `new` that names a folder rather than a file, a new name minimega
            cannot use, or a new name with a known image extension that the
            format of `disk` does not take.
            Also a required query parameter is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no such image, or no folder for the new one
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: the new image exists already
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the copy failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/disks/clone/jobs":
    post:
      tags:
        - Disks
        - Jobs
      summary: Copy a disk image in a background job
      description: >-
        Checks the request as POST /disks/clone does, then copies the image in
        a `disk.clone` background job. The job's one item is the new image's
        file name, and its progress counts the bytes copied. The copy goes to a
        hidden temporary file (`.<new>.partial-<hex>`) that becomes the image
        only when complete, so a canceled or interrupted clone leaves no image.
        The server deletes such files when it starts. Needs `disks` `create`
        for the new image's file name and `get` for the image's.
      operationId: postDisksCloneJob
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: disk
          in: query
          description: the image, as for POST /disks/clone
          required: true
          example: ubuntu/ubuntu.qcow2
          schema:
            type: string
        - name: new
          in: query
          description: the new image, as for POST /disks/clone
          required: true
          example: ubuntu-copy.qcow2
          schema:
            type: string
      responses:
        "202":
          description: the job, started
          headers:
            Location:
              description: the job, at /api/v1/jobs/{id} under the server's base path
              schema:
                type: string
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          description: as for POST /disks/clone, or an invalid `Idempotency-Key`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no such image, or no folder for the new one
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            the new image exists already, or the server is still serving a
            request with the same `Idempotency-Key` (with `Retry-After`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/IdempotencyKeyReused"
        "429":
          description: >-
            too many of the user's jobs, or of all jobs, are waiting to run
            (`Retry-After` says when to try again)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            the server is shutting down and starts no more jobs (`Retry-After`
            says when to try again)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the image could not be read, or the job could not be started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/disks/rename":
    post:
      tags:
        - Disks
      summary: Rename a disk image
      description: >-
        Renames the image's file, never replacing a file. Images backed by it
        stop working until they are rebased onto the new name. Needs the
        `disks` `update` permission for the image's file name and `create`
        for the new file name.
      operationId: postDisksRename
      parameters:
        - name: disk
          in: query
          description: >-
            the image, relative to the minimega files directory or absolute. It
            must be inside that directory and not in a folder the disk list
            leaves out.
          required: true
          schema:
            type: string
        - name: new
          in: query
          description: >-
            the new image, with the same rules as `new` of POST /disks/clone.
            The image keeps its format: `bar` for `foo.iso` becomes `bar.iso`,
            and a known extension that does not fit the format of `disk`, such
            as `bar.qcow2`, gets 400.
          required: true
          example: ubuntu-2204.qcow2
          schema:
            type: string
      responses:
        "200":
          description: successful operation
        "400":
          description: >-
            a path outside the minimega files directory or in a folder the
            disk list leaves out, or a folder. Also a `new` that names a folder
            rather than a file, a new name minimega cannot use, or a new name
            with a known image extension that the format of `disk` does not
            take.
            Also a required query parameter is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no such image, or no folder for the new one
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: the new image exists already
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: >-
            the rename failed, such as when the new image's folder is on
            another file system
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/disks/download":
    get:
      tags:
        - Disks
      summary: Download a disk image
      description: >-
        Streams the image's file as an attachment. Downloads resume: send
        `Range` with `If-Range` set to the `ETag` of an earlier response. The
        server then sends the rest (206) only while the image is unchanged. An
        image
        a running VM writes to changes under the download, so stop the VM
        first for a consistent copy. Needs the `disks` `get` permission for
        the image's file name.
      operationId: getDisksDownload
      parameters:
        - name: disk
          in: query
          description: >-
            the image, relative to the minimega files directory or absolute. It
            must be inside that directory and not in a folder the disk list
            leaves out.
          required: true
          example: ubuntu/ubuntu.qcow2
          schema:
            type: string
        - $ref: "#/components/parameters/RangeHeader"
        - $ref: "#/components/parameters/IfRangeHeader"
        - $ref: "#/components/parameters/IfNoneMatchHeader"
        - $ref: "#/components/parameters/IfMatchHeader"
      responses:
        "200":
          description: the image's file
          headers:
            Content-Disposition:
              description: "`attachment`, named after the image's file"
              schema:
                type: string
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/LastModified"
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
            Repr-Digest:
              $ref: "#/components/headers/ReprDigest"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          $ref: "#/components/responses/PartialContent"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: >-
            a path outside the minimega files directory or in a folder the
            disk list leaves out, or a folder, or a required query parameter is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no such image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
        "500":
          description: the image could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    head:
      tags:
        - Disks
      summary: Check a disk image download
      description: >-
        The GET response's headers without the image: its size
        (Content-Length), `ETag` and `Last-Modified`. Needs the `disks` `get`
        permission for the image's file name.
      operationId: headDisksDownload
      parameters:
        - name: disk
          in: query
          description: >-
            the image, relative to the minimega files directory or absolute. It
            must be inside that directory and not in a folder the disk list
            leaves out.
          required: true
          example: ubuntu/ubuntu.qcow2
          schema:
            type: string
        - $ref: "#/components/parameters/RangeHeader"
        - $ref: "#/components/parameters/IfRangeHeader"
        - $ref: "#/components/parameters/IfNoneMatchHeader"
        - $ref: "#/components/parameters/IfMatchHeader"
      responses:
        "200":
          description: the image's headers
          headers:
            Content-Length:
              description: the image's size in bytes
              schema:
                type: integer
            Content-Disposition:
              description: "`attachment`, named after the image's file"
              schema:
                type: string
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/LastModified"
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
            Repr-Digest:
              $ref: "#/components/headers/ReprDigest"
        "206":
          $ref: "#/components/responses/PartialContent"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: >-
            a path outside the minimega files directory or in a folder the
            disk list leaves out, or a folder, or a required query parameter is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no such image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
        "500":
          description: the image could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/disks/checksum":
    get:
      tags:
        - Disks
      summary: Get a disk image's SHA-256 checksum
      description: >-
        Computes the image's SHA-256 in the background, at most two files at
        a time server-wide. It keeps the checksum in memory for as long as the
        image is unchanged. The answer is 202 until the checksum is known, then
        200. A large image takes
        minutes. From then on, downloads of the image carry it as
        `Repr-Digest`. Needs the `disks` `get` permission for the image's
        file name.
      operationId: getDisksChecksum
      parameters:
        - name: disk
          in: query
          description: >-
            the image, relative to the minimega files directory or absolute. It
            must be inside that directory and not in a folder the disk list
            leaves out.
          required: true
          example: ubuntu/ubuntu.qcow2
          schema:
            type: string
      responses:
        "200":
          description: the file's checksum
          headers:
            Repr-Digest:
              $ref: "#/components/headers/ReprDigest"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileChecksum"
        "202":
          description: the server is computing the checksum. Ask again later.
          headers:
            Retry-After:
              description: seconds to wait before asking again
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileChecksum"
        "400":
          description: >-
            a path outside the minimega files directory or in a folder the
            disk list leaves out, or a folder, or a required query parameter is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no such image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: the image changed while the server hashed it. Ask again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the image could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/disks/details":
    get:
      tags:
        - Disks
      summary: Get the details of one disk image
      description: >-
        Reads one image of the disk list for the details card of the Disks
        page. It reads the file, the qcow or qcow2 header, and the partition
        table and file systems of the disk that the image holds. For a qcow or
        qcow2 image, it reads through the backing chain with `qemu-img dd`,
        which it runs read-only with `-U`. It does not mount the image. It
        reads at most 16 MiB of the disk, for at most 30 seconds. It keeps the
        result until the size, modification time or inode of a file it read
        changes, or until a GET /disks with `refresh`. When it cannot read a
        part, a field such as `partitionsUnavailable` says why. Needs the
        `disks` `list` permission for the image's file name, and the role must
        see the image in GET /disks. `vms` holds only the experiments that the
        role may `get`.
      operationId: getDisksDetails
      parameters:
        - name: disk
          in: query
          description: >-
            the image, relative to the minimega files directory or absolute,
            as GET /disks lists it
          required: true
          example: ubuntu/ubuntu.qcow2
          schema:
            type: string
      responses:
        "200":
          description: what the server read from the image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiskDetails"
        "400":
          description: >-
            no image, a path outside the minimega files directory that the
            role may not see, or a path in a folder that the disk list leaves
            out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            the path is in the minimega files directory, but the disk list
            does not hold the image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the disk list or the image could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/hosts":
    get:
      tags:
        - Hosts
      summary: Get all cluster hosts
      description: >-
        The list is reused for up to 5 seconds. `X-Phenix-Observed-At` says
        when it was read from minimega. Each host's disk usage is measured at
        most once a minute.
      operationId: getHosts
      responses:
        "200":
          description: successful operation
          headers:
            X-Phenix-Seq:
              $ref: "#/components/headers/Seq"
            X-Phenix-Observed-At:
              $ref: "#/components/headers/ObservedAt"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hosts"
        "403":
          description: the role may not list cluster hosts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: minimega cannot list the cluster hosts, or it lists none
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/users":
    get:
      tags:
        - Users
      summary: Get all users
      description: >-
        Lists the users the role may list, or only the requester's own user
        for a role that may only get it.
      operationId: getUsers
      responses:
        "200":
          description: >-
            the users the role may list, or only the requester's own user for
            a role that may only get it. The list is empty when there is no
            such user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Users"
        "403":
          description: the role may neither list users nor get its own user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the users could not be read from the store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - Users
      summary: Create a new user
      description: >-
        Creates a user with the named role. Needs `users` `create`. The new
        user may get and update their own user.
      operationId: postUsers
      requestBody:
        description: user details
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
                - role_name
              properties:
                username:
                  title: "Username"
                  description: >-
                    Username used to identify the account. It starts with a
                    letter or digit and contains only letters, digits, '.',
                    '_', '@', '+' and '-'.
                  example: user@example.org
                  type: string
                  pattern: '^[A-Za-z0-9][A-Za-z0-9._@+-]*$'
                password:
                  title: "Password"
                  description: "Password supplied for account creation or sign-in."
                  example: <password>
                  type: string
                first_name:
                  title: "First Name"
                  description: "User given name."
                  example: Alex
                  type: string
                last_name:
                  title: "Last Name"
                  description: "User family name."
                  example: Example
                  type: string
                role_name:
                  title: "Role Name"
                  description: "Name of the role assigned to the user."
                  example: Experiment User
                  type: string
                resource_names:
                  title: "Resource Names"
                  description: "Resource names assigned to the user."
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: >-
            a malformed body, a username that is not valid, a password that
            does not meet the password rules, or a role that does not exist
            (no user is stored)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: a user with this username already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the user could not be created, or its role could not be set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/users/{username}":
    get:
      tags:
        - Users
      summary: Get a specific user
      description: >-
        Needs `users` `get` for the user. `proxy_token` is present only for
        the requester's own user.
      operationId: getUserUsername
      parameters:
        - name: username
          in: path
          description: username of user to get
          required: true
          example: user@example.org
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the user does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the user could not be read from the store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags:
        - Users
      summary: Update existing user
      description: >-
        Changes the names, role or password of the user. Needs `users`
        `patch`; a role change also needs `users/roles` `patch`, and a
        password change needs the current password.
      operationId: patchUsersUsername
      parameters:
        - name: username
          in: path
          description: username of user to modify
          required: true
          example: user@example.org
          schema:
            type: string
      requestBody:
        description: user parameters
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  title: "First Name"
                  description: "User given name."
                  example: Alex
                  type: string
                last_name:
                  title: "Last Name"
                  description: "User family name."
                  example: Example
                  type: string
                role_name:
                  title: "Role Name"
                  description: >-
                    Name of the role to assign. The server ignores it unless
                    the caller holds `users/roles` `patch` on the user.
                  example: Experiment User
                  type: string
                resource_names:
                  title: "Resource Names"
                  description: >-
                    Resource names for the role. They apply only with
                    `role_name`.
                  type: array
                  items:
                    type: string
                password:
                  title: "Password"
                  description: "The current password. A password change needs it."
                  example: <password>
                  type: string
                new_password:
                  title: "New Password"
                  description: >-
                    The new password. It must meet the password rules. Send it
                    with the current password.
                  example: <new-password>
                  type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: >-
            a malformed body, a role that does not exist, or a password change
            without the correct current password or with a new password that
            does not meet the password rules. The server checks all of the
            change before it writes, so a refused request changes nothing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the user does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: >-
            the user could not be read from the store, or the names, the role
            or the password cannot be saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - Users
      summary: Delete existing user
      description: >-
        Deletes the user and revokes the capture tokens given under it. Needs
        `users` `delete`. A requester cannot delete their own user.
      operationId: deleteUsersUsername
      parameters:
        - name: username
          in: path
          description: username of user to delete
          required: true
          example: user@example.org
          schema:
            type: string
      responses:
        "204":
          description: successful operation
        "403":
          description: the user is the requester's own user, or deleting the user is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the user does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the user could not be deleted from the store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/users/{username}/tokens":
    post:
      tags:
        - Users
      summary: Create an API token for a user
      description: >-
        Signs a token that lasts the given lifetime, until it expires or is
        removed, and adds it to the user's tokens. Needs `users` `patch` on
        the user and, for another user, `users/tokens` `create` on them too.
      operationId: postUsersUsernameTokens
      parameters:
        - name: username
          in: path
          description: the user to create the token for
          required: true
          example: user@example.org
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - lifetime
              properties:
                lifetime:
                  title: Lifetime
                  type: string
                  description: >-
                    how long the token lasts: a Go duration, such as `720h`,
                    or a whole number of days from 1 to 106751, such as `30`
                  example: 720h
                desc:
                  title: Description
                  type: string
                  description: >-
                    a note on the token (default: `manually generated - <time
                    created>`, with the time in RFC 3339)
                  example: CI pipeline
      responses:
        "200":
          description: the token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    title: Token
                    type: string
                    description: the token, for `X-Phenix-Auth-Token`
                    example: eyJhbGciOi...example
                  desc:
                    title: Description
                    type: string
                    description: the token's note
                    example: CI pipeline
                  exp:
                    title: Expiration
                    type: string
                    format: date-time
                    description: when the token expires
                    example: "2026-02-01T10:00:00Z"
        "400":
          description: >-
            a malformed body, a lifetime that is neither a duration nor a
            number of days, a lifetime of zero or less, or more than 106751 days
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: the user does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the user could not be read from the store, or the token could not be signed or saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/signup":
    post:
      tags:
        - Users
      summary: Signup as a new user
      description: >-
        Creates a user with no role and signs it in. With proxy auth, the
        username must be the user that the proxy names.
      operationId: postSignup
      requestBody:
        description: user details
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  title: "Username"
                  description: >-
                    Username used to identify the account. It starts with a
                    letter or digit and contains only letters, digits, '.',
                    '_', '@', '+' and '-'.
                  example: user@example.org
                  type: string
                  pattern: '^[A-Za-z0-9][A-Za-z0-9._@+-]*$'
                password:
                  title: "Password"
                  description: "Password supplied for account creation or sign-in."
                  example: <password>
                  type: string
                first_name:
                  title: "First Name"
                  description: "User given name."
                  example: Alex
                  type: string
                last_name:
                  title: "Last Name"
                  description: "User family name."
                  example: Example
                  type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credentials"
        "400":
          description: >-
            a malformed body, a username that is not valid, or a password that
            does not meet the password rules (no user is stored)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >-
            with proxy auth, the proxy names no user, or names a user other
            than the username
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: a user with this username already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the session token could not be signed or saved (the user is stored)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/login":
    get:
      tags:
        - Users
      summary: Login a user
      description: >-
        Signs in and returns a session token. The server reads HTTP Basic
        credentials, or else the `user` and `pass` query parameters. With
        proxy auth, it reads the user that the trusted proxy names and ignores
        both. A wrong user and a wrong password get the same 401.
      operationId: getLogin
      parameters:
        - in: query
          name: user
          schema:
            type: string
          description: login username
          example: user@example.org
        - in: query
          name: pass
          schema:
            type: string
          description: login password
          example: <password>
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credentials"
        "400":
          description: no username or password given
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >-
            the user does not exist or the password is wrong (without proxy
            auth both get the same answer), or, with proxy auth, the proxy
            names no user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            with proxy auth only, no such user. The Error's `metadata.username`
            names the user, so the proxy sign-up page can offer to create it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the session token could not be signed or saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - Users
      summary: Login a user
      description: >-
        Signs in with a password and returns a session token. A wrong user and
        a wrong password get the same 401. With proxy auth, use GET.
      operationId: postLogin
      requestBody:
        description: login credentials
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user
                - pass
              properties:
                user:
                  title: "User"
                  description: "Username used to authenticate."
                  example: johndoe@example.com
                  type: string
                pass:
                  title: "Pass"
                  description: "Password used to authenticate."
                  example: "<password>"
                  type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credentials"
        "400":
          description: >-
            no username or password given, a body that cannot be parsed, or
            proxy auth is on (use GET)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >-
            the user does not exist or the password is wrong (without proxy
            auth both get the same answer), or, with proxy auth, the proxy
            names no user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            with proxy auth only, no such user. The Error's `metadata.username`
            names the user, so the proxy sign-up page can offer to create it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the session token could not be signed or saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/logout":
    post:
      tags:
        - Users
      summary: Logout a user
      description: >-
        Signs the session's token out, so it is refused from then on, and
        revokes the capture tokens given under it. A session without a
        stored user, as with auth disabled, has no token to sign out, and
        the request does nothing.
      operationId: postLogout
      responses:
        "204":
          description: successful operation
        "500":
          description: the user could not be read from the store, or the token could not be removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/workflow/configs/{branch}":
    post:
      tags:
        - Workflow
      summary: Create or update a phenix config for a workflow branch
      description: >
        Creates the config if it does not exist and updates it otherwise. The
        server sets BRANCH_NAME to the branch before parsing the body, so
        ${BRANCH_NAME} placeholders expand to the branch name. The server
        stores every other ${NAME} placeholder as written. The Content-Type
        header must be exactly application/json or application/x-yaml. A
        Topology is also checked for a node an experiment could not use, such
        as a hostname used twice or a reserved hostname, before it is stored.
        With dryRun=true it runs the same checks, returns what it would do, and
        stores nothing. Needs `configs` `create` or `update` before the body is
        parsed, then `configs` `create` on a new config or `update` on a
        stored one, by the kind and name the body gives (such as
        `Topology/lab`), dry run or not.
      operationId: postWorkflowConfigsBranch
      parameters:
        - name: branch
          in: path
          description: workflow branch name
          required: true
          schema:
            type: string
        - name: dryRun
          in: query
          description: >
            Checks the config as a real request would (placeholder expansion,
            the create or update decision, permissions, schema validation and,
            for a Topology, the node checks an experiment would fail on) and
            returns the result without storing the config or running config
            hooks. For an Experiment config only the schema is checked; the
            experiment checks run when the config is stored. The parameter's
            name is matched exactly, so a request that spells it differently is
            carried out for real.
          required: false
          schema:
            type: boolean
            default: false
      requestBody:
        description: phenix config of a storable kind (e.g. Topology or Scenario)
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Config"
          application/x-yaml:
            schema:
              $ref: "#/components/schemas/Config"
      responses:
        "200":
          description: dry run; nothing was stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowConfigResult"
        "201":
          description: config created or updated (no response body)
          headers:
            Location:
              description: location of the created or updated config, under the server's base path
              schema:
                type: string
                format: uri-reference
        "400":
          description: >
            unsupported Content-Type, unparsable body, a missing or unknown kind
            or a name containing "/", an invalid dryRun value, a schema
            validation failure (explained lines in metadata.validation, original
            validator text in metadata.validation-raw), or, for a Topology, a
            node an experiment could not use, such as a hostname used twice or
            a reserved hostname, or a spec that does not decode; or, on a real
            upsert, a config hook rejects the config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            updating the config is not allowed, or creating one of its
            `Kind/name` is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: another request deleted the config before the update stored it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: another request created the config before this request stored it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          description: >-
            a User config changed while the update ran (`metadata.revision`
            holds its current revision)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the store could not read or store the config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/workflow/apply/{branch}":
    post:
      tags:
        - Workflow
      summary: Apply a phenix workflow config to a workflow branch
      description: >
        Validates the workflow config against the Workflow schema, finds the
        experiment mapped to the branch (phenix.workflow/branch annotation),
        plans an action, and checks the default bridge and the topology and
        scenario the action would use, including a stored topology's nodes, as
        creating an experiment would. Only then does it create, update, start,
        or restart the experiment. A failed check leaves a running experiment
        running. Before a restart stops the experiment, it checks the disk
        images and CD-ROM images of the start it makes. A missing file, or an
        image that qemu cannot open, refuses the restart with 400 and the code
        `broken_disks`, unless the
        scenario has a user app, which can change the disks. In that case, the
        start checks again. With dryRun=true, the server returns the plan after
        the same checks and changes nothing. A dry run of a plan that starts the
        experiment lists in `warnings` what that disk check finds. A dry run
        before a first deploy names the configs the caller will store with
        pending. The server sets BRANCH_NAME
        to the branch before parsing the body, so ${BRANCH_NAME} placeholders
        expand to the branch name. The server keeps every other ${NAME}
        placeholder as written. The Content-Type header must be
        exactly application/json or application/x-yaml.
      operationId: postWorkflowApplyBranch
      parameters:
        - name: branch
          in: path
          description: workflow branch name
          required: true
          schema:
            type: string
        - name: tag
          in: query
          description: >
            key=value tag stored on the experiment, joined with commas into the
            phenix.workflow/tags annotation; repeat the parameter for more tags
          required: false
          style: form
          explode: true
          example: [owner=blue-team]
          schema:
            type: array
            items:
              type: string
        - name: dryRun
          in: query
          description: >
            Runs every check, a stored topology's node checks included, and
            returns the plan without creating, updating, starting, or stopping
            anything. The parameter's name is matched exactly, so a request
            that spells it differently is treated as a real apply, and refused
            with 400 when it also carries pending.
          required: false
          schema:
            type: boolean
            default: false
        - name: pending
          in: query
          description: >
            A config the caller will create or update before the real apply,
            usually the pending value a dry run of POST /workflow/configs/{branch}
            returned: <Kind>/<name>, such as Topology/helloworld, optionally
            followed by "?" and the config's references, such as
            Scenario/helloworld?from=helloworld-base&topology=helloworld
            (url-encode the value). The kind may be in any case. Repeat the
            parameter for more configs. A pending topology or scenario is not
            looked up, decoded or merged, so a first deploy can be checked
            before its configs are stored; the references listed after "?" are
            checked instead, with the errors the real apply gives (on a create,
            a scenario's topology annotation; each fromScenario, which must be
            pending or stored and annotated for the topology; each included
            topology, which must be pending, stored or a file on the server).
            An include that is neither pending nor stored is looked up as a
            file on the server, as the real apply does, so the answer shows
            whether that path exists on the server; grant workflow:create only
            to roles trusted with that (the default policies give it to Global
            Admin only). Only allowed with dryRun=true; otherwise, or for a
            value that is not a config name, the request is a 400.
          required: false
          style: form
          explode: true
          example: [Topology/helloworld]
          schema:
            type: array
            items:
              type: string
        - name: expect
          in: query
          description: >
            The action the caller expects, usually from an earlier dry run. A
            different planned action gets 409 and changes nothing, on a dry run
            too. A value that is not an action gets 400 with the message
            invalid expect value "<value>".
          required: false
          example: createAndStart
          schema:
            type: string
            enum:
              - none
              - create
              - createAndStart
              - update
              - updateAndStart
              - restart
      requestBody:
        description: phenix workflow config
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Workflow"
          application/x-yaml:
            schema:
              $ref: "#/components/schemas/Workflow"
      responses:
        "200":
          description: plan carried out, or only returned when dryRun is true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowResult"
        "400":
          description: >
            unsupported Content-Type, unparsable body, invalid dryRun, expect or
            pending value, pending without dryRun=true, Workflow schema failure
            (explained lines in metadata.validation, original validator text in
            metadata.validation-raw), invalid config (e.g. defaultBridge longer
            than 15 characters, a default bridge another experiment uses, or an
            auto.create that is not a valid experiment name), a topology or
            scenario that is missing, cannot be read for any reason, fails to
            decode, or fails to merge, a stored topology whose nodes an
            experiment could not use, or a pending reference that fails its
            check. These errors leave everything unchanged. A missing disk
            image or CD-ROM image of a restart has the code `broken_disks` and
            leaves the experiment running. A failure to stop,
            reconfigure or start the experiment while the plan is carried
            out, which comes after changes were made
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: applying workflows is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            another request deleted the experiment while the plan is carried
            out, so it cannot be started or stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            more than one experiment is mapped to the branch, auto.create names
            an existing experiment that is not mapped to the branch, or the
            planned action differs from expect, with nothing changed; or another
            request is starting or stopping the experiment while the plan is
            carried out, which comes after changes were made when it happens as
            the experiment is started after a create, update or stop. Also an
            experiment that another request started or stopped while the plan
            is carried out, so it already runs or does not run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: internal error, or a failure while carrying out the plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: >-
            minimega could not kill the VMs of the experiment a restart stops,
            so it is still running. `POST /experiments/{name}/stop?force=true`
            marks it stopped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/options":
    get:
      tags:
        - Workflow
      summary: Get server-side options
      description: >
        Server-side settings that clients read: every phenix CLI command
        fetches them over the unix socket when it starts, to inherit the
        server's bridge-mode, deploy-mode and use-gre-mesh, and the web UI's
        Experiments page reads them too. workflow-dry-run is true when
        POST /workflow/configs/{branch} and POST /workflow/apply/{branch} both
        support dryRun, and apply supports pending and expect. An older server
        ignores dryRun on /workflow/configs/{branch} and stores the config, so
        phenix workflow apply refuses servers without it.
      operationId: getOptions
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Options"
        "403":
          description: listing options is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/schemas/builder/v1":
    get:
      tags:
        - Builder
        - Schemas
      summary: Get the JSON Schema of Builder documents
      description: >
        Requires `builder` `use`.
      operationId: getBuilderSchema
      responses:
        "200":
          description: >
            The complete JSON Schema (draft 2020-12) of a Builder document
            (the `BuilderDocument` component shows its outline). Each property
            has a title, a description and examples.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403":
          $ref: "#/components/responses/BuilderForbidden"
  "/schemas/builder/templates/v1":
    get:
      tags:
        - Builder
        - Schemas
      summary: Get the JSON Schema of Builder template files
      description: >
        Requires `builder` `use`, as the document schema does. A template file
        holds one collection of device templates, in YAML or JSON. The Node
        Templates tab exports and imports this file. At start, phenix reads
        the template files in its template directory
        (`--base-dir.builder-templates`) as read-only server collections.
      operationId: getBuilderTemplateFileSchema
      responses:
        "200":
          description: >
            The complete JSON Schema (draft 2020-12) of a template file
            (`$id` `https://phenix.sandia.gov/schemas/builder/templates/v1`).
            Each property has a title, a description and examples. phenix also
            checks two rules outside the schema: template names are different,
            ignoring case, and icons are PNG images that phenix accepts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403":
          $ref: "#/components/responses/BuilderForbidden"
  "/schemas/builder/layersets/v1":
    get:
      tags:
        - Builder
        - Schemas
      summary: Get the JSON Schema of Builder layer set files
      description: >
        Requires `builder` `use`, as the document schema does. A layer set
        file holds one layer set, in YAML or JSON, with copies of the custom
        icons that it names. The Layers tab of the Drafts page downloads and
        uploads this file.
      operationId: getBuilderLayerSetFileSchema
      responses:
        "200":
          description: >
            The complete JSON Schema (draft 2020-12) of a layer set file
            (`$id` `https://phenix.sandia.gov/schemas/builder/layersets/v1`).
            Each property has a title, a description and examples. phenix also
            checks rules outside the schema. Layer IDs are different. Node
            matcher patterns are regular expressions without nested repeats,
            with at most 3 `*`, `+` or `{n,}` repeats. Icons are PNG images
            that phenix accepts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403":
          $ref: "#/components/responses/BuilderForbidden"
  "/schemas/builder/package/v1":
    get:
      tags:
        - Builder
        - Schemas
      summary: Get the JSON Schema of Builder packages
      description: >
        Requires `builder` `use`. A Builder package is one JSON or YAML file
        that `POST /builder/package` makes. It holds a Builder document, what
        the diagram needs on a phenix server, and, when selected, the Scenario
        and Topology configs and custom icons that the document names.
      operationId: getBuilderPackageSchema
      responses:
        "200":
          description: >
            The complete JSON Schema (draft 2020-12) of a package (`$id`
            `https://phenix.sandia.gov/schemas/builder/package/v1`). It holds
            the definitions of the document schema. Each property has a title,
            a description and examples. phenix also checks, outside the
            schema, that the requirements name each carried config. It also
            checks what the document schema cannot express.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403":
          $ref: "#/components/responses/BuilderForbidden"
  "/builder/drafts":
    get:
      tags:
        - Builder
      summary: List Builder drafts
      description: >
        Requires `builder` `use`. Returns every draft, newest change first,
        each with its creator. It lists separately, as damaged, the drafts
        whose metadata this server cannot read (such as drafts that a newer
        phenix wrote), which a caller can delete but not open. No row has
        `experiment`. `limits` gives the most drafts the server holds.
      operationId: getBuilderDrafts
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderDrafts"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "500":
          $ref: "#/components/responses/BuilderServerError"
    post:
      tags:
        - Builder
      summary: Create a Builder draft
      description: >-
        Requires `builder` `use`. Creates a draft whose first snapshot holds the
        document, with the caller as its creator, and publishes nothing. The server
        writes the draft and its document in one transaction, so a refused request
        stores nothing.

        The `sourceToken` and `forkOf` fields of the body give the permission and
        status rules of each source, and `document` tells how the server stamps the
        document `metadata`. The response has no document, and its `stamp` holds the
        stamped values.
      operationId: postBuilderDrafts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderDraftCreate"
      responses:
        "201":
          description: draft created
          headers:
            ETag:
              $ref: "#/components/headers/BuilderETag"
            Location:
              description: location of the new draft, under the server's base path
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderDraft"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "409":
          description: >
            The `sourceToken` names the Builder file of a topology, and the
            document of the file changed after the caller opened it. Or the
            server no longer reads the topology from its file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: >
            The request body or the document is larger than the size limits
            of the server. Or the server holds `limits.drafts` drafts (2000),
            the most it holds, damaged drafts included (`draft.limit`). The
            message then says to delete drafts or to run Clean up in the
            Builder settings (POST /builder/cleanup).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
        "500":
          $ref: "#/components/responses/BuilderServerError"
  "/builder/drafts/{draft}":
    parameters:
      - $ref: "#/components/parameters/BuilderDraftID"
    get:
      tags:
        - Builder
      summary: Get a Builder draft with its current document
      description: >
        Requires `builder` `use`. `experiment` names an experiment that the
        draft published. For a draft opened from a published diagram, it can
        also name an experiment that the diagram published. It is present
        while that experiment exists and
        the caller holds `experiments` `get` for it.
      operationId: getBuilderDraft
      responses:
        "200":
          description: successful operation
          headers:
            ETag:
              $ref: "#/components/headers/BuilderETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderDraft"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "500":
          $ref: "#/components/responses/BuilderServerError"
    delete:
      tags:
        - Builder
      summary: Delete a Builder draft
      description: >
        Requires `builder` `use`. Deletes any draft, also a damaged one, and
        changes no published config. A delete during a publication of the
        draft waits for it to end, then answers 412 with the new ETag.
      operationId: deleteBuilderDraft
      parameters:
        - $ref: "#/components/parameters/BuilderIfMatch"
      responses:
        "204":
          description: draft deleted
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "409":
          $ref: "#/components/responses/BuilderConflict"
        "412":
          description: >
            The If-Match header does not name the current revision of the
            draft (`draft.stale`). The response carries its current ETag. The
            listing does the same for a draft whose metadata this server can
            no longer read, because the server cannot read such a draft alone.
          headers:
            ETag:
              $ref: "#/components/headers/BuilderETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/BuilderServerError"
  "/builder/drafts/{draft}/snapshots":
    parameters:
      - $ref: "#/components/parameters/BuilderDraftID"
    get:
      tags:
        - Builder
      summary: List the snapshots of a Builder draft
      description: >
        Requires `builder` `use`. The list starts with the oldest
        snapshot. `cursor` is the index of the current snapshot.
      operationId: getBuilderDraftSnapshots
      responses:
        "200":
          description: successful operation
          headers:
            ETag:
              $ref: "#/components/headers/BuilderETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderSnapshots"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "500":
          $ref: "#/components/responses/BuilderServerError"
    post:
      tags:
        - Builder
      summary: Save a Builder draft
      description: >
        Requires `builder` `use`. Appends the document as a new snapshot,
        discards the snapshots after the cursor (the redo branch), and moves
        the cursor to the new one. A draft keeps at most 50 snapshots of at
        most 50 MiB in total; the server removes the oldest to make room.

        The server stamps the document's `metadata`, and replaces the values
        sent: `createdBy` and `createdAt` from the draft create, `updatedBy`
        and `updatedAt` as the caller and the current time. A value that is
        not valid gets 422. The response has no document; its `stamp` holds
        the four values written.
      operationId: postBuilderDraftSnapshots
      parameters:
        - $ref: "#/components/parameters/BuilderIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderSnapshotCreate"
      responses:
        "201":
          description: Snapshot appended. The response is the draft without its document.
          headers:
            ETag:
              $ref: "#/components/headers/BuilderETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderDraft"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "409":
          $ref: "#/components/responses/BuilderConflict"
        "412":
          $ref: "#/components/responses/BuilderPreconditionFailed"
        "413":
          $ref: "#/components/responses/BuilderTooLarge"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
        "500":
          $ref: "#/components/responses/BuilderServerError"
  "/builder/drafts/{draft}/snapshots/{snapshot}":
    parameters:
      - $ref: "#/components/parameters/BuilderDraftID"
      - name: snapshot
        in: path
        description: snapshot ID, or `current` for the snapshot that the cursor identifies
        required: true
        example: current
        schema:
          type: string
    get:
      tags:
        - Builder
      summary: Get one snapshot of a Builder draft with its document
      description: >
        Requires `builder` `use`.
      operationId: getBuilderDraftSnapshot
      responses:
        "200":
          description: successful operation
          headers:
            ETag:
              $ref: "#/components/headers/BuilderETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderSnapshotDocument"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "500":
          $ref: "#/components/responses/BuilderServerError"
    delete:
      tags:
        - Builder
      summary: Delete one snapshot of a Builder draft
      description: >
        Requires `builder` `use`. Removes the
        snapshot from the history and deletes its content. A caller cannot
        delete the snapshot that the cursor identifies (the current version).
        The cursor stays on it. When the last publication names the deleted
        snapshot, the publication record stays, and the draft is then
        `dirty`.
      operationId: deleteBuilderDraftSnapshot
      parameters:
        - $ref: "#/components/parameters/BuilderIfMatch"
      responses:
        "200":
          description: Snapshot deleted. The response is the draft without its document.
          headers:
            ETag:
              $ref: "#/components/headers/BuilderETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderDraft"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "409":
          description: >
            The snapshot is the current version (`draft.snapshot.current`), or
            the draft changed during the request (`draft.conflict`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          $ref: "#/components/responses/BuilderPreconditionFailed"
        "500":
          $ref: "#/components/responses/BuilderServerError"
  "/builder/drafts/{draft}/cursor":
    parameters:
      - $ref: "#/components/parameters/BuilderDraftID"
    patch:
      tags:
        - Builder
      summary: Move the cursor of a Builder draft (undo and redo)
      description: >
        Requires `builder` `use`. The move discards no snapshot.
      operationId: patchBuilderDraftCursor
      parameters:
        - $ref: "#/components/parameters/BuilderIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderCursorMove"
      responses:
        "200":
          description: Cursor moved. The response is the draft without its document.
          headers:
            ETag:
              $ref: "#/components/headers/BuilderETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderDraft"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "409":
          $ref: "#/components/responses/BuilderConflict"
        "412":
          $ref: "#/components/responses/BuilderPreconditionFailed"
        "413":
          $ref: "#/components/responses/BuilderTooLarge"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
        "500":
          $ref: "#/components/responses/BuilderServerError"
  "/builder/drafts/{draft}/publish":
    parameters:
      - $ref: "#/components/parameters/BuilderDraftID"
    post:
      tags:
        - Builder
      summary: Publish a Builder draft to phenix configs
      description: >-
        Requires `builder` `use`, the caller's own `configs` `create` or `update` on
        each target config, and `experiments` `create` or `update` for an experiment
        target. Publishes the current snapshot of the draft as a Topology config and,
        in `topology-experiment` mode, an Experiment config. It is the only Builder
        operation that creates or updates configs, and the request carries only the
        intent. A draft imported from a stored Topology or Experiment also needs
        `configs` `get` on it and `topologies` `get` (or `experiments` `get`) on its
        name, so that the server can check that the source did not change.

        A repeat of a completed publication with the same If-Match gets 200 with every
        stage skipped. When a stage fails after earlier stages wrote, the answer is 409
        or 500 with a `partial` result, and the same request with the same If-Match
        finishes the publication. The fields of BuilderPublishRequest give the
        scenario stage, the update rules of each target and the dry run.
      operationId: postBuilderDraftPublish
      parameters:
        - name: If-Match
          in: header
          description: >
            The ETag of the draft revision to publish, as for every Builder
            change (`BuilderIfMatch`). It is required except for a dry run,
            which ignores it. A missing or malformed ETag gets 400 before the
            body is decoded, unless the body asks for a dry run.
          required: false
          example: '"3"'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderPublishRequest"
      responses:
        "200":
          description: >
            publication succeeded, or, for a dry run, what it would change
            (`BuilderPublishPreview`, status `preview`)
          headers:
            ETag:
              $ref: "#/components/headers/BuilderETag"
            Warning:
              $ref: "#/components/headers/BuilderWarning"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BuilderPublishResult"
                  - $ref: "#/components/schemas/BuilderPublishPreview"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "409":
          description: >
            A target config or the draft changed after the server prepared the
            publication. Or an included topology now defines a hostname that the
            published topology also defines. Or a stage failed on such a
            conflict after the server wrote earlier stages (a `partial` result).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/BuilderPublishResult"
        "412":
          $ref: "#/components/responses/BuilderPreconditionFailed"
        "413":
          $ref: "#/components/responses/BuilderTooLarge"
        "422":
          description: >
            The document fails validation, or publishes something that phenix
            refuses. Examples are an interface with no VLAN on a device that is
            not external, and interfaces that share an IP or MAC address. A
            hostname that phenix refuses is also an example: one character
            long, `all`, all digits, or `phenix` on a Windows node. A device
            setting that makes the experiment fail to start is another example
            (`device.drives.none`, `device.ospf.missing` and
            `device.ntp-server.invalid`). The message names them.
            This status also applies to a scenario that the document lists and
            that does not exist or that the caller may not read. It also applies
            to an experiment scenario that the document does not list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: >
            A stage failed after the server wrote earlier stages (a `partial`
            result). Or the server could not read the draft.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/BuilderPublishResult"
  "/builder/drafts/{draft}/preflight":
    parameters:
      - $ref: "#/components/parameters/BuilderDraftID"
    post:
      tags:
        - Builder
      summary: Run preflight checks on a Builder draft
      description: >-
        Requires `builder` `use` and `configs` `get`. Runs the checks that the request
        names (see BuilderPreflightCheckName) on the current document of the draft, all
        at the same time, and reports each as `passed`, `failed` or `unavailable` with
        a summary and its issues. One check never stops the others, and the route
        writes nothing and starts no VM or experiment.
      operationId: postBuilderDraftPreflight
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderPreflightRequest"
      responses:
        "200":
          description: each check named, in the request's order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderPreflightReport"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "413":
          $ref: "#/components/responses/BuilderTooLarge"
        "500":
          $ref: "#/components/responses/BuilderServerError"
  "/builder/sources":
    get:
      tags:
        - Builder
      summary: List the configs Builder can use as sources
      description: >
        Requires `builder` `use` and `configs` `list`. POST /builder/generate
        can import
        topologies and experiments. Scenarios and images are for selection
        only. The server filters each config by `configs` `list` for its name.
        For topologies, experiments and scenarios, it also filters by the
        `list` permission of that resource. A topology also reports how many
        topologies it includes (`includeCount`), to a caller who holds
        `configs` `get` for its name.
      operationId: getBuilderSources
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderSources"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "500":
          $ref: "#/components/responses/BuilderServerError"
  "/builder/generate":
    post:
      tags:
        - Builder
      summary: Import a Builder document from a Topology or Experiment config
      description: >-
        Requires `builder` `use` and `configs` `get`. Converts a stored config
        (`source`) or an uploaded config (`content`) into a Builder document and writes
        nothing. A stored source also needs `configs` `get` for its name and
        `topologies` or `experiments` `list` for it. Uploaded content needs `configs`
        `create`, as for POST /configs, but the server keeps each `${NAME}` and
        `${NAME:default}` placeholder as written and never reads its environment for
        them.

        A Topology with the `builder-xml` annotation and no `builder-doc` converts from
        its legacy diagram, as POST /builder/legacy converts one, and its `source` has
        `builder` `builder-xml`. The fields of BuilderGenerateRequest give the include,
        copy and name rules, and the `document` of BuilderGenerateResult tells what the
        server changes.
      operationId: postBuilderGenerate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderGenerateRequest"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderGenerateResult"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "413":
          $ref: "#/components/responses/BuilderTooLarge"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
        "500":
          description: >
            The server could not read the config store: the stored source, or
            the Scenario config an imported Experiment names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/builder/legacy":
    post:
      tags:
        - Builder
      summary: Convert a legacy Builder diagram into a Builder document
      description: >-
        Requires `builder` `use`, `configs` `get` and `configs` `create`, because the
        content can be a config file, as for POST /configs. Converts a diagram of the
        legacy Builder (the editor that phenix had before the Builder), or a Topology
        config that carries one in `builder-xml`, into a Builder document and writes
        nothing.

        For a diagram alone, its node settings are the nodes, and its `$NAME`
        placeholders get values from its own variables and the legacy defaults. Its
        source is `manual`, so a draft made from it publishes a new topology. For a
        Topology, its spec defines every node, and the diagram only places the nodes,
        matched by hostname. The response then has its `source`, with `stored` false.
        The server reads from the store only the topologies that a topology includes,
        and keeps each `${NAME}` placeholder as written.
      operationId: postBuilderLegacy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderLegacyRequest"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderGenerateResult"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "413":
          $ref: "#/components/responses/BuilderTooLarge"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
        "500":
          $ref: "#/components/responses/BuilderServerError"
  "/builder/export/topology":
    post:
      tags:
        - Builder
      summary: Export a Builder document as the Topology config Publish writes
      description: >
        Projects the document onto the phenix Topology config that a publish of
        it would write, and returns that config as YAML. The operation reads
        nothing and writes nothing. Requires `builder` `use` and `configs`
        `get`. The server checks the document as a draft save checks it, within
        the same size limits. The config has no `builder-doc` annotation. It
        names the included topologies of the document in `includeTopologies`,
        and does not merge them.

        When the phenix config validation refuses the document, the answer
        is 422, as for a publish. A publish names these reasons in this
        order, before any other reason. First, it names interfaces without a
        VLAN, then addresses that interfaces share. Then it names hostnames
        that phenix refuses, then device settings that make the experiment
        fail to start. An export names interfaces
        without a VLAN only when a `vlan` is missing or null. It names
        hostnames only when one is a single character, which the validation
        also refuses. Otherwise it gives the reason of the validation.
        `publishBlockers` reports what only a publish refuses. Examples are an
        interface with a blank VLAN, and interfaces that share an IP or MAC
        address. Another example is a hostname that phenix refuses only when
        it creates an experiment (`all`, all digits, or `phenix` on a Windows
        node). A device setting that makes the experiment fail to start is
        also an example. One such setting is an `ntp-server` label that names
        no interface with an address.
      operationId: postBuilderExportTopology
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTopologyExportRequest"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTopologyExport"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "413":
          $ref: "#/components/responses/BuilderTooLarge"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
        "500":
          $ref: "#/components/responses/BuilderServerError"
  "/builder/package":
    post:
      tags:
        - Builder
      summary: Make a Builder package of a document
      description: >-
        Requires `builder` `use` and `configs` `get`. Returns the package of the
        document in the request, with the edits not saved yet: the document, the
        sections that `include` names, and the requirements. It writes nothing.

        The server reads each Scenario config that the document names and, with
        `topologies`, each included topology from the config store with the
        permissions of the caller (`configs` `get` on it, and `scenarios` or
        `topologies` `list`). It never reads an include that is a file path. Configs go
        in the package without their times and `builder-*` annotations, and the package
        never holds the content of a file, a script or an app.
      operationId: postBuilderPackage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderPackageRequest"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderPackageResult"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "413":
          description: >-
            The package is larger than 5242880 bytes (`package.too-large`), or the
            request body is larger than the size limits of the server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >-
            The document fails validation, or something else would refuse the
            package, such as a stored config without a spec (`package.invalid`, with
            `issues`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/BuilderServerError"
  "/builder/package/resolve":
    post:
      tags:
        - Builder
      summary: Check what a Builder package's diagram needs on this server
      description: >-
        Requires `builder` `use` and `configs` `get`. Reports, for each requirement of
        the package in the body, whether this server has it: `present`, `different`,
        `missing` or `unknown`. It writes nothing, and the Builder creates a missing
        config that the user selects through `POST /configs`.
      operationId: postBuilderPackageResolve
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: >
                a Builder package, as `GET /schemas/builder/package/v1`
                describes it
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderPackageDependencies"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "413":
          description: >-
            The body is larger than 5242880 bytes (`package.too-large`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >-
            The server decodes the package strictly and checks it as the package
            schema describes. A package that does not validate, has an unknown field,
            or carries a config with a `builder-*` annotation gets `package.invalid`,
            with each problem in `issues`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/BuilderServerError"
  "/builder/cleanup":
    post:
      tags:
        - Builder
      summary: Clean up Builder storage
      description: >-
        Requires `builder` `use`, as deleting any draft does. Deletes every published,
        unchanged draft, then removes the orphaned storage that the server also removes
        when it starts and every hour after that. With `dryRun=true` it removes nothing,
        and answers with what it would remove.

        The request has no body. A draft or a record that the server could not read or
        remove does not fail the request, and the `Warning` header then says that
        removing some of it failed.
      operationId: postBuilderCleanup
      parameters:
        - name: dryRun
          in: query
          description: >
            `true` counts what the cleanup would remove and removes nothing.
            The server refuses a value that is not a boolean.
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: what the cleanup removed, or would remove
          headers:
            Warning:
              $ref: "#/components/headers/BuilderWarning"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderCleanup"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "500":
          $ref: "#/components/responses/BuilderServerError"
  "/builder/documents":
    get:
      tags:
        - Builder
      summary: List published Builder documents
      description: >
        Requires `builder` `use` and `configs` `list`. Lists the published
        documents that configs reference in their `builder-doc` annotation,
        for the configs the caller may list. A topology whose annotation names
        a Builder file (`path`) and no stored document is listed with `source`
        `file` and the path only; the listing reads no file, so it lists the
        row whether or not the server can use the file. A `store` row has
        `experiment` when its publication made an experiment that still
        exists, has the topology of the row, and that the caller may `get`.
      operationId: getBuilderDocuments
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderPublishedDocuments"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "500":
          $ref: "#/components/responses/BuilderServerError"
  "/builder/documents/{document}":
    get:
      tags:
        - Builder
      summary: Get a published Builder document
      description: >
        Requires `builder` `use`, and `configs` `get` for the config that the
        document was published to. A document that the caller may not read, or
        that no config references any more, gets 404.
      operationId: getBuilderDocument
      parameters:
        - name: document
          in: path
          description: published document ID
          required: true
          example: 7f010dcd-e23d-514c-9206-3609df999026
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          headers:
            ETag:
              $ref: "#/components/headers/BuilderDocumentETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderPublishedDocument"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
    delete:
      tags:
        - Builder
      summary: Delete a published Builder topology
      description: >
        Requires `builder` `use`, and `configs` `delete` for the topology.
        Deletes the Topology config that the document is current for, as
        `DELETE /configs/Topology/{name}` does, then every published document
        of that topology. Drafts and experiments made from it do not change. A
        document that the caller may not get, or that is no longer current
        (the topology references another document, was published again, or
        was deleted), gets 404. A published experiment gets 422; delete it on
        the Experiments page. `If-Match` must name the `etag` the caller read,
        and a topology that changed since then, in any way, gets 412 with the
        current tag.

        The list does not show a document whose stored metadata this server
        cannot read (such as one a newer phēnix wrote); the server logs its
        ID. Deleting it removes only that record and its content, and changes
        no config. The caller needs `configs` `get` and `delete` for the
        config the record names, or for every config (`*/*`) when it names
        none. `If-Match` must name the record's tag, which a 412 gives in its
        ETag header.
      operationId: deleteBuilderDocument
      parameters:
        - name: document
          in: path
          description: published document ID
          required: true
          example: 7f010dcd-e23d-514c-9206-3609df999026
          schema:
            type: string
        - $ref: "#/components/parameters/BuilderDocumentIfMatch"
      responses:
        "204":
          description: >
            The server deleted the topology, or the damaged document. A
            Warning header says that the server could not remove all of the
            topology's published documents. The list never shows them again,
            and a later server start removes them.
          headers:
            Warning:
              $ref: "#/components/headers/BuilderWarning"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "412":
          $ref: "#/components/responses/BuilderStale"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
  "/builder/topologies/{topology}/document":
    get:
      tags:
        - Builder
      summary: Get the Builder document a topology references
      description: >
        Requires `builder` `use`, and `configs` `get` for the topology, which
        says nothing about the file. Returns the document that the
        `builder-doc` annotation of the topology names. The stored published
        document that the annotation's `id` or `digest` names has priority.
        Otherwise the server reads the Builder file at the annotation's
        `path`, on every request. A topology that does not exist, that the
        caller may not get, or that names no document gets the same 404.

        The file must be below the phenix base directory (`--base-dir.phenix`)
        and outside the directory of the mounted VM file systems. It must be a
        regular file of at most 5 MiB, reached through no symbolic link that
        leaves the base directory or has an absolute target, and hold a valid
        Builder document as JSON or YAML. A `digest` beside `path` pins the
        file, and the server refuses a file with another digest. A caller who
        may create or update any one topology can name any Builder file below
        the base directory in it, and then read the file here. When the server
        cannot use a file, the answer is a fixed sentence that names the path,
        never what the file holds.
      operationId: getBuilderTopologyDocument
      parameters:
        - name: topology
          in: path
          description: topology name
          required: true
          example: lab
          schema:
            type: string
      responses:
        "200":
          description: >
            The document, with `digest`, `size` and `document`. For a file,
            `topologyDiffers` says whether the stored topology differs from
            what the document publishes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderPublishedDocument"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          description: >
            The topology does not exist, the caller may not get it, or it
            references no Builder document. Or the Builder file that it names
            does not exist on this phenix server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The Builder file is larger than 5 MiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            The Builder file is outside the directory that phenix reads
            Builder files from, or phenix cannot read it. Or it is not a
            regular file, or not a valid Builder document. Or it does not
            match the digest that the topology records for it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/builder/icons":
    get:
      tags:
        - Builder
      summary: List the icons of the Builder icon library
      description: >
        Requires `builder` `use`. Returns every icon of the icon library of
        the server, sorted by name, ignoring case, without its image. Each icon
        has the ID of its image, its uploader, its aliases, its revision and
        its entity tag. The aliases are the earlier names from its renames,
        which still name it. Each icon also tells whether a caller may rename
        or delete it. A caller may not rename or delete an icon of the server
        template files. `GET /builder/icons/{icon}` gives the image of
        one icon. The ID is the hash of the image, so a client needs the image
        of an ID once. The response also tells the most icons that the
        library holds, and the entity tag of the list. A request whose
        `If-None-Match` names that tag (weak comparison) gets 304, with no
        body, while the list is the same. The server sends an image only as
        base64 inside JSON, never as an image. Every response of the icon
        operations also carries
        `Content-Security-Policy: default-src 'none'; frame-ancestors 'none'`.
      operationId: listBuilderIcons
      parameters:
        - name: If-None-Match
          in: header
          description: the entity tag of the list as last read
          required: false
          example: '"5d41402abc4b2a76b9719d911017c592"'
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          headers:
            ETag:
              description: the entity tag of the list
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderIconList"
        "304":
          description: The list is the one that If-None-Match names.
          headers:
            ETag:
              description: the entity tag of the list
              schema:
                type: string
        "403":
          $ref: "#/components/responses/BuilderForbidden"
    post:
      tags:
        - Builder
      summary: Add an icon to the Builder icon library
      description: >
        Requires `builder` `use`. Adds a PNG of at most 96 by 96 pixels and
        65536 bytes, sent as base64, under a name of 1 to 64 letters, digits,
        `_`, `@`, `.` and `-` that is not `.` or `..` and that no icon or alias
        has, ignoring case. Only the bytes tell what the image is, and the
        server refuses all images that are not PNG.

        The server stores a clean PNG as it is and encodes any other PNG
        again, which keeps only the pixels, so use the `data` that the
        response returns. A name that already names an icon with the same
        bytes gets 200 with that icon, and a name of another icon or alias
        gets 409. The library holds at most 2000 icons, of all users together.
      operationId: createBuilderIcon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderIconUpload"
      responses:
        "200":
          description: the name already names an icon with the same bytes
          headers:
            ETag:
              $ref: "#/components/headers/BuilderIconETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderIcon"
        "201":
          description: icon added
          headers:
            ETag:
              $ref: "#/components/headers/BuilderIconETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderIcon"
        "400":
          description: >
            The request is malformed. Its body is not a single JSON value of
            the expected shape (the server refuses unknown fields), or `data`
            is missing or not base64.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "409":
          description: >
            The name, ignoring case, names another icon or is another icon's
            alias. The message names that icon and who uploaded it, for
            example `icon name "plc" belongs to an icon alice uploaded.
            Choose another name`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: >
            The request body is larger than 131072 bytes, or the image is
            larger than 65536 bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            The name is not an icon name, the image is not a PNG or is more
            than 96 pixels wide or high, or the library holds 2000 icons.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/builder/icons/{icon}":
    parameters:
      - name: icon
        in: path
        description: >
          the name of the icon, or one of its aliases, in any case. A path
          that names no icon gets 404, whatever its form.
        required: true
        example: plc
        schema:
          type: string
    get:
      tags:
        - Builder
      summary: Read an icon of the Builder icon library
      description: >
        Requires `builder` `use`. Returns the icon that the path names, with
        its image. `name` is the current name of the icon. A request whose
        `If-None-Match` names the icon's `etag` gets 304, with no body.
      operationId: getBuilderIcon
      parameters:
        - name: If-None-Match
          in: header
          description: the entity tag of the icon as last read
          required: false
          example: '"3"'
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          headers:
            ETag:
              $ref: "#/components/headers/BuilderIconETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderIcon"
        "304":
          description: The icon is at the revision that If-None-Match names.
          headers:
            ETag:
              $ref: "#/components/headers/BuilderIconETag"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderIconNotFound"
    put:
      tags:
        - Builder
      summary: Rename an icon of the Builder icon library
      description: >
        Requires `builder` `use`. Gives the icon that the path names a new
        name that no other icon or alias has, ignoring case; a change of case
        renames it in place. The old name becomes an alias, so diagrams and
        templates that name it still show the icon, and a rename to one of its
        aliases makes that alias its name again. An icon keeps at most 16 old
        names; a rename that would exceed that gets 422 and keeps them all. An
        icon of the server template files gets 403.
      operationId: renameBuilderIcon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderIconRename"
      responses:
        "200":
          description: the icon as renamed
          headers:
            ETag:
              $ref: "#/components/headers/BuilderIconETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderIcon"
        "400":
          description: >
            The request is malformed. Its body is not a single JSON value of
            the expected shape (the server refuses unknown fields).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderIconNotFound"
        "409":
          description: >
            Another icon or its alias has the new name, or the icon changed
            during the rename. The server renamed nothing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The request body is larger than 4096 bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            The new name is not an icon name, or the icon already has 16 old
            names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - Builder
      summary: Delete an icon from the Builder icon library
      description: >
        Requires `builder` `use`. Deletes the icon that the path names, by its
        name or an alias, with all its aliases. Diagrams and templates that
        name it show their built-in icon, and a downloaded document keeps its
        own copy. An icon of the server template files gets 403. `If-Match`
        must name the icon's `etag`; a stale tag, also one from before a
        rename, gets 412 with the current tag. The server also removes a
        record of that name that it cannot read, whose tag is that of its
        record revision.
      operationId: deleteBuilderIcon
      parameters:
        - $ref: "#/components/parameters/BuilderIconIfMatch"
      responses:
        "204":
          description: icon deleted
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderIconNotFound"
        "409":
          description: >
            A record that the server cannot read changed during the delete.
            The server deleted nothing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          $ref: "#/components/responses/BuilderStale"
  "/builder/templates":
    get:
      tags:
        - Builder
      summary: List the device templates
      description: >
        Requires `builder` `use`. Returns the template library of the
        server, the built-in templates and the collections of the template
        files of the server. Every caller gets the same response. A template
        names its custom icon, which the icon library resolves.

        `templates` and `collections` are the template library of the server
        (`source` `library`), in the order that callers added their items.
        Every
        user with Builder access changes the same library: no item has an
        owner. A server whose library never changed has an empty library.
        When this server cannot read the library record, the response has
        `damaged` true and none of its items. The server then refuses every
        change of it with 409.

        `builtins` are the five built-in templates (`server`, `workstation`,
        `router`, `firewall`, `external`, `source` `builtin`, version 1).
        `preloaded` lists the collections that the server read at start from
        the template files of its template directory
        (`--base-dir.builder-templates`). There is one collection per file,
        with its templates (`source` `preloaded`, version 1). Built-in and
        preloaded items are read only. A write route that names one gets 409
        with the code `template.item.read-only`. A caller can change a copy in
        the library.

        A template that a diagram copied names its source in the diagram
        (`templates[].source` of the Builder document: `kind`, `id` and
        `version`). When the `version` of the item with that `source` and
        `id` here is higher, the library holds a newer version.
      operationId: getBuilderTemplates
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplateLibrary"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
  "/builder/templates/items":
    post:
      tags:
        - Builder
      summary: Add device templates to the template library
      description: >
        Requires `builder` `use`. Adds 1 to 200 templates in one write,
        each with a new ID. With `collection`, the same write also makes a
        new collection that holds exactly those templates. The custom icon of
        a template (`device.icon`) is an icon name. The icon library resolves
        it, whether or not it holds that icon now. A template of the library
        has no `source`.
      operationId: createBuilderTemplates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTemplateCreate"
      responses:
        "201":
          description: templates added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplateCreateResult"
        "400":
          description: >
            The request is malformed. Its body is not a single JSON value of
            the expected shape (the server refuses unknown fields), or it names
            no template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "409":
          $ref: "#/components/responses/BuilderTemplateConflict"
        "413":
          $ref: "#/components/responses/BuilderTemplateTooLarge"
        "422":
          $ref: "#/components/responses/BuilderTemplateUnprocessable"
        "503":
          $ref: "#/components/responses/BuilderTemplateBusy"
  "/builder/templates/items/{template}":
    parameters:
      - $ref: "#/components/parameters/BuilderTemplateID"
    put:
      tags:
        - Builder
      summary: Replace a device template of the template library
      description: >
        Requires `builder` `use`, which lets a user replace any template of
        the library. Replaces the name, description and device of one
        template, which keeps its ID; its version rises by one. Equal content
        changes nothing and keeps the entity tag. Devices made from the
        template do not change, and a diagram's copy changes only when its
        user updates it.
      operationId: putBuilderTemplate
      parameters:
        - $ref: "#/components/parameters/BuilderTemplateIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTemplateContent"
      responses:
        "200":
          description: the template now stored
          headers:
            ETag:
              $ref: "#/components/headers/BuilderTemplateETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplate"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderTemplateNotFound"
        "409":
          $ref: "#/components/responses/BuilderTemplateConflict"
        "412":
          $ref: "#/components/responses/BuilderTemplatePreconditionFailed"
        "413":
          $ref: "#/components/responses/BuilderTemplateTooLarge"
        "422":
          $ref: "#/components/responses/BuilderTemplateUnprocessable"
        "503":
          $ref: "#/components/responses/BuilderTemplateBusy"
  "/builder/templates/collections":
    post:
      tags:
        - Builder
      summary: Add a collection to the template library
      description: >
        Requires `builder` `use`. A collection is a named group of
        templates of the library. A template can be in more than one
        collection. Every ID in `templateIds` must name a template of the
        library, one time. A built-in template or a template of a template
        file gets 409.
      operationId: createBuilderTemplateCollection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTemplateCollectionContent"
      responses:
        "201":
          description: collection added
          headers:
            ETag:
              $ref: "#/components/headers/BuilderTemplateETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplateCollection"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "409":
          $ref: "#/components/responses/BuilderTemplateConflict"
        "413":
          $ref: "#/components/responses/BuilderTemplateTooLarge"
        "422":
          $ref: "#/components/responses/BuilderTemplateUnprocessable"
        "503":
          $ref: "#/components/responses/BuilderTemplateBusy"
  "/builder/templates/collections/{collection}":
    parameters:
      - $ref: "#/components/parameters/BuilderTemplateCollectionID"
    put:
      tags:
        - Builder
      summary: Replace a collection of the template library
      description: >
        Requires `builder` `use`. Replaces the name, the description and
        the templates of one collection. The collection keeps its ID. To add
        a template to a collection, or to remove one from it, send this
        request with the changed list. Content that is equal to the stored
        content changes nothing and keeps the entity tag.
      operationId: putBuilderTemplateCollection
      parameters:
        - $ref: "#/components/parameters/BuilderTemplateIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTemplateCollectionContent"
      responses:
        "200":
          description: the collection now stored
          headers:
            ETag:
              $ref: "#/components/headers/BuilderTemplateETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplateCollection"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderTemplateNotFound"
        "409":
          $ref: "#/components/responses/BuilderTemplateConflict"
        "412":
          $ref: "#/components/responses/BuilderTemplatePreconditionFailed"
        "413":
          $ref: "#/components/responses/BuilderTemplateTooLarge"
        "422":
          $ref: "#/components/responses/BuilderTemplateUnprocessable"
        "503":
          $ref: "#/components/responses/BuilderTemplateBusy"
  "/builder/templates/delete":
    post:
      tags:
        - Builder
      summary: Delete templates and collections of the template library
      description: >
        Requires `builder` `use`. Deletes the named templates and collections
        in one write. Each item names the `etag` the caller read, as a PUT
        names it in If-Match, and an item without a strong, quoted tag gets
        400. If the library holds any item at another tag, the request gets
        412 (`template.item.stale`) with that item's current tag and deletes
        nothing. An ID that the library does not hold is ignored, so a repeat
        is harmless. A built-in template or an item of a template file gets
        409. A deleted template leaves every collection, and a deleted
        collection leaves its templates. A diagram's copy of a deleted
        template stays, and its editor says that the library template was
        deleted.
      operationId: deleteBuilderTemplates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTemplateSelection"
      responses:
        "200":
          description: how many templates and collections the request deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplateDeleteResult"
        "400":
          description: >
            The request is malformed. Its body is not a single JSON value of
            the expected shape (the server refuses unknown fields). Or it
            names no template and no collection, or an item has no strong,
            quoted `etag`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "409":
          $ref: "#/components/responses/BuilderTemplateConflict"
        "412":
          $ref: "#/components/responses/BuilderTemplatePreconditionFailed"
        "413":
          description: The request body is larger than 64 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/BuilderTemplateBusy"
  "/builder/layersets":
    get:
      tags:
        - Builder
      summary: List the layer sets of the Builder layer set library
      description: >
        Requires `builder` `use`. Returns every layer set of the server's
        library to every Builder user: the built-in sets first (the Purdue
        Model set, ID `builtin:purdue`), then the rest by name, ignoring case.
        `defaultId` is the server's default set for new diagrams, or null, and
        `defaultEtag` is the tag that a change of it names in If-Match.
        `damaged` counts the unreadable records that the list leaves out.
      operationId: listBuilderLayerSets
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderLayerSetList"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
    post:
      tags:
        - Builder
      summary: Add a layer set to the Builder layer set library
      description: >
        Requires `builder` `use`. Adds a set under a new ID, at version 1.
        Every user of the Builder sees every set. The library holds at most
        200 sets, apart from the built-in sets. To duplicate a set, read it
        and send its content here.
      operationId: createBuilderLayerSet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderLayerSetContent"
      responses:
        "201":
          description: layer set added
          headers:
            ETag:
              $ref: "#/components/headers/BuilderLayerSetETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderLayerSet"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "413":
          $ref: "#/components/responses/BuilderLayerSetTooLarge"
        "422":
          $ref: "#/components/responses/BuilderLayerSetUnprocessable"
  "/builder/layersets/default":
    get:
      tags:
        - Builder
      summary: Read the default layer set of the server
      description: >
        Requires `builder` `use`. Returns the set that new diagrams of all
        users start with, or null. The server has one default set for all
        users. A selection of a set that no longer exists is null. A new blank
        diagram
        copies the default set and links to it. With no default, a new
        diagram shows the placeholder layers 0 to 6. `etag` is the entity tag
        of the selection, which a change of it names in If-Match.
      operationId: getBuilderDefaultLayerSet
      responses:
        "200":
          description: successful operation
          headers:
            ETag:
              $ref: "#/components/headers/BuilderLayerSetDefaultETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderLayerSetDefaultSelection"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
    put:
      tags:
        - Builder
      summary: Select the default layer set of the server
      description: >
        Requires `builder` `use`. Selects the set that the new diagrams of
        all users copy. Each Builder user can change it. `id` null or empty
        removes the selection. If-Match must name the `etag` of the current
        selection. Another tag gets 412 (`layerset.stale`) with the current
        tag. A set that does not exist gets 422 with the code
        `layerset.default.unknown`.
      operationId: putBuilderDefaultLayerSet
      parameters:
        - $ref: "#/components/parameters/BuilderLayerSetDefaultIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderLayerSetDefault"
      responses:
        "200":
          description: the selection now stored
          headers:
            ETag:
              $ref: "#/components/headers/BuilderLayerSetDefaultETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderLayerSetDefaultSelection"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "409":
          $ref: "#/components/responses/BuilderLayerSetDamaged"
        "412":
          description: >
            The If-Match header does not name the current selection
            (`layerset.stale`). The response carries the current entity tag.
          headers:
            ETag:
              $ref: "#/components/headers/BuilderLayerSetDefaultETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The request body is larger than 4 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            The set that `id` names does not exist (`layerset.default.unknown`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/BuilderLayerSetBusy"
  "/builder/layersets/{layerset}":
    parameters:
      - $ref: "#/components/parameters/BuilderLayerSetID"
    get:
      tags:
        - Builder
      summary: Read a layer set of the Builder layer set library
      description: >
        Requires `builder` `use`. Returns the set with its entity tag.
      operationId: getBuilderLayerSet
      responses:
        "200":
          description: successful operation
          headers:
            ETag:
              $ref: "#/components/headers/BuilderLayerSetETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderLayerSet"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderLayerSetNotFound"
        "409":
          $ref: "#/components/responses/BuilderLayerSetDamaged"
    put:
      tags:
        - Builder
      summary: Replace a layer set of the Builder layer set library
      description: >
        Requires `builder` `use`. Any user with this permission may change
        any set, but nobody may change a built-in set (403,
        `layerset.read-only`). Replaces the content of the set. A change
        increases the version by one. Content that is equal to the stored
        content changes nothing and keeps the entity tag. Diagrams that copied
        the set keep their copies, and the editor offers them the update.
      operationId: putBuilderLayerSet
      parameters:
        - $ref: "#/components/parameters/BuilderLayerSetIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderLayerSetContent"
      responses:
        "200":
          description: the layer set now stored
          headers:
            ETag:
              $ref: "#/components/headers/BuilderLayerSetETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderLayerSet"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderLayerSetReadOnly"
        "404":
          $ref: "#/components/responses/BuilderLayerSetNotFound"
        "409":
          $ref: "#/components/responses/BuilderLayerSetDamaged"
        "412":
          $ref: "#/components/responses/BuilderLayerSetPreconditionFailed"
        "413":
          $ref: "#/components/responses/BuilderLayerSetTooLarge"
        "422":
          $ref: "#/components/responses/BuilderLayerSetUnprocessable"
        "503":
          $ref: "#/components/responses/BuilderLayerSetBusy"
    delete:
      tags:
        - Builder
      summary: Delete a layer set from the Builder layer set library
      description: >
        Requires `builder` `use`. Any user with this permission may delete
        any set, but nobody may delete a built-in set (403,
        `layerset.read-only`). Diagrams that copied the set keep their copies.
        A default selection of the set becomes null. If-Match must name the
        `etag` of the current content. A record that the server cannot read
        has the tag of its record revision, `"<revision>"`, which a 412 gives.
      operationId: deleteBuilderLayerSet
      parameters:
        - $ref: "#/components/parameters/BuilderLayerSetIfMatch"
      responses:
        "204":
          description: layer set deleted
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderLayerSetReadOnly"
        "404":
          $ref: "#/components/responses/BuilderLayerSetNotFound"
        "412":
          $ref: "#/components/responses/BuilderLayerSetPreconditionFailed"
        "503":
          $ref: "#/components/responses/BuilderLayerSetBusy"
  "/console":
    post:
      tags:
        - Console
      summary: Start a minimega console
      description: >-
        Starts a console owned by the requesting user. It ends if no websocket
        attaches within 15 seconds.
      operationId: postConsole
      parameters:
        - name: namespace
          in: query
          description: >-
            the experiment whose minimega namespace the console uses by
            default (`phenix mm --attach --namespace`). The experiment must
            exist, and the role must have experiments get on it. Without it,
            the console uses no namespace.
          required: false
          schema:
            type: string
            example: demo
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Console"
        "400":
          description: >-
            no experiment has the namespace's name, or the role may not get it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: the role may not start a console (miniconsole post)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: the server was started without --minimega-console
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the console could not be started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            the server is shutting down (`Retry-After` says when to try again)
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/console/{pid}":
    parameters:
      - name: pid
        in: path
        description: process ID of the console
        required: true
        schema:
          type: integer
    get:
      tags:
        - Console
      summary: Check that a console is still running
      description: >-
        Lets a client attach to the console it had open, after a reload or from
        another tab, instead of starting another.
      operationId: getConsole
      responses:
        "200":
          description: the console is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Console"
        "400":
          description: the pid is not a number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: the role may not use a console (miniconsole get)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no running console with this pid belongs to the user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - Console
      summary: End a console
      description: >-
        Kills the console's process and closes its websockets. The UI does this
        when the user logs out. Needs the permission that starts a console.
      operationId: deleteConsole
      responses:
        "204":
          description: the console has ended
        "400":
          description: the pid is not a number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: the role may not start a console (miniconsole post)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no running console with this pid belongs to the user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the console's process did not end
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/console/{pid}/ws":
    get:
      tags:
        - Console
      summary: Attach to a console using a WebSocket
      description: >-
        Binary frames carry the console's output: first up to 256 KiB of its
        recent output, then its live output. Frames sent are its input.
        Several websockets can attach at once, and closing one leaves the
        console running. The server closes the websocket normally (1000) once
        the console has ended. It also closes a websocket normally when more
        than 1 MiB of output waits for it; the console continues to run.
      operationId: getConsoleWs
      parameters:
        - name: pid
          in: path
          description: process ID of the console
          required: true
          schema:
            type: integer
      responses:
        "101":
          description: switching protocols
        "400":
          description: the pid is not a number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: the role may not use a console (miniconsole get)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no running console with this pid belongs to the user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            the server is shutting down (`Retry-After` says when to try again)
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/console/{pid}/size":
    post:
      tags:
        - Console
      summary: Set a console's terminal size
      description: >-
        Both query parameters are required and must be unsigned integers. A
        request without them, or with a value that is not all digits, does not
        match this route at all. A console starts at 80 columns and 24 rows.
        A resize sends no input to the console.
      operationId: postConsoleSize
      parameters:
        - name: pid
          in: path
          description: process ID of the console
          required: true
          schema:
            type: integer
        - name: cols
          in: query
          description: the terminal width in columns
          required: true
          example: 80
          schema:
            type: integer
            minimum: 0
            maximum: 65535
        - name: rows
          in: query
          description: the terminal height in rows
          required: true
          example: 24
          schema:
            type: integer
            minimum: 0
            maximum: 65535
      responses:
        "200":
          description: successful operation
        "400":
          description: the pid is not a number, or rows or cols is above 65535
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: the role may not start a console (miniconsole post)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no running console with this pid belongs to the user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the terminal size could not be set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/features":
    servers:
      - url: http://localhost:3000
    get:
      tags:
        - Features
      summary: List the server's enabled optional features
      description: >-
        Served from the server root rather than under `/api/v1`, and needs
        neither credentials nor a permission.
      operationId: getFeatures
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Features"
  "/version":
    servers:
      - url: http://localhost:3000
    get:
      tags:
        - Features
      summary: Get the server's build
      description: >-
        Served from the server root rather than under `/api/v1`, and needs
        neither credentials nor a permission.
      operationId: getVersion
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
  "/docs/openapi.yml":
    servers:
      - url: http://localhost:3000
    get:
      tags:
        - Features
      summary: Get this API's OpenAPI document
      description: >-
        This document, with `info.version` set to the server's build, as
        `X-Phenix-Version` names it. Served from the server root rather than
        under `/api/v1`, and needs neither credentials nor a permission.
      operationId: getOpenAPISpec
      responses:
        "200":
          description: the OpenAPI document
          headers:
            X-Phenix-Version:
              $ref: "#/components/headers/Version"
            ETag:
              description: the document's entity tag, for `If-None-Match`
              schema:
                type: string
            Last-Modified:
              description: when the server loaded the document
              schema:
                type: string
            Vary:
              description: "`Accept-Encoding`"
              schema:
                type: string
            Content-Encoding:
              description: "`gzip`, for a client that accepts it"
              schema:
                type: string
          content:
            application/yaml:
              schema:
                type: string
        "304":
          description: the document still has the `If-None-Match` ETag
          headers:
            ETag:
              description: the document's entity tag
              schema:
                type: string
        "404":
          description: the server has no OpenAPI document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the document could not be read or prepared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    head:
      tags:
        - Features
      summary: Get this API's OpenAPI document's headers
      description: The headers `GET /docs/openapi.yml` answers with.
      operationId: headOpenAPISpec
      responses:
        "200":
          description: the OpenAPI document's headers
          headers:
            X-Phenix-Version:
              $ref: "#/components/headers/Version"
            ETag:
              description: the document's entity tag, for `If-None-Match`
              schema:
                type: string
            Last-Modified:
              description: when the server loaded the document
              schema:
                type: string
            Vary:
              description: "`Accept-Encoding`"
              schema:
                type: string
            Content-Encoding:
              description: "`gzip`, for a client that accepts it"
              schema:
                type: string
        "304":
          description: the document still has the `If-None-Match` ETag
          headers:
            ETag:
              description: the document's entity tag
              schema:
                type: string
        "404":
          description: the server has no OpenAPI document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the document could not be read or prepared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/downloads/tunneler":
    servers:
      - url: http://localhost:3000
    get:
      tags:
        - Tunneler
      summary: List the tunneler builds installed on this server
      description: >-
        Names the phenix-tunneler builds in the server's `downloads/tunneler`
        directory, sorted, so the Tunneler page offers only downloads that
        exist. A build may be a link to a file elsewhere. The list leaves out
        subdirectories, hidden files (names starting with a dot), broken links
        and anything else that is not a file. It is empty once the directory is
        gone. Both download paths are served from the server root, not under
        `/api/v1`, and need neither credentials nor a permission. They exist
        only while the `tunneler-download` feature is on. The feature is on when
        that directory exists at startup, relative to the directory the server
        runs from. Without it, the web UI handler serves the request instead.
      operationId: getDownloadsTunneler
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tunnelers"
        "500":
          description: the downloads directory exists but could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/downloads/tunneler/{name}":
    servers:
      - url: http://localhost:3000
    get:
      tags:
        - Tunneler
      summary: Download a tunneler build
      description: >-
        Serves one of the builds `GET /downloads/tunneler` lists, as an
        attachment under its own name. Only a file, or a link to one,
        directly in the downloads directory is served. A name that is a path,
        or that starts with a dot, is refused. Downloads resume with `Range`
        and `If-Range`, as other downloads do. Needs neither credentials nor a
        permission.
      operationId: getDownloadsTunnelerName
      parameters:
        - name: name
          in: path
          description: file name of the build, as the list reports it
          required: true
          schema:
            type: string
            example: phenix-tunneler-linux-amd64
        - $ref: "#/components/parameters/RangeHeader"
        - $ref: "#/components/parameters/IfRangeHeader"
        - $ref: "#/components/parameters/IfNoneMatchHeader"
        - $ref: "#/components/parameters/IfMatchHeader"
      responses:
        "200":
          description: the build
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/LastModified"
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
            Repr-Digest:
              $ref: "#/components/headers/ReprDigest"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          $ref: "#/components/responses/PartialContent"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: the name is empty, is not a bare file name, or starts with a dot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no such build is installed on this server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
        "500":
          description: the build could not be read or opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    head:
      tags:
        - Tunneler
      summary: Check a tunneler build download
      description: >-
        The GET response's headers without the build: its size
        (Content-Length), `ETag` and `Last-Modified`.
      operationId: headDownloadsTunnelerName
      parameters:
        - name: name
          in: path
          description: file name of the build, as the list reports it
          required: true
          schema:
            type: string
            example: phenix-tunneler-linux-amd64
        - $ref: "#/components/parameters/RangeHeader"
        - $ref: "#/components/parameters/IfRangeHeader"
        - $ref: "#/components/parameters/IfNoneMatchHeader"
        - $ref: "#/components/parameters/IfMatchHeader"
      responses:
        "200":
          description: the build's headers
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/LastModified"
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
            Repr-Digest:
              $ref: "#/components/headers/ReprDigest"
        "206":
          $ref: "#/components/responses/PartialContent"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: the name is empty, is not a bare file name, or starts with a dot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no such build is installed on this server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
  "/webshark/json":
    servers:
      - url: http://localhost:3000
    get:
      tags:
        - Experiments
      summary: Answer WebShark's capture listing and download requests
      description: >-
        Answers what the bundled WebShark asks, with a capture name or capture
        token as the only credential (see `GET /webshark/captures/{name}`).
        `method=files` lists no captures, since WebShark opens each one by
        name. `method=download` sends the capture as an attachment, if the
        name allows `download`, and resumes as other downloads do. Served from
        the server root, only when WebShark is installed. Errors are
        `WebSharkError` JSON.
      operationId: getWebsharkJson
      parameters:
        - name: method
          in: query
          description: what WebShark asks for
          required: true
          schema:
            type: string
            enum: [files, download]
        - name: capture
          in: query
          description: the capture name, for `download`
          required: false
          example: router-k2j4m6n8p1q3r5s7t9v2w4x6y8.pcap
          schema:
            type: string
        - $ref: "#/components/parameters/RangeHeader"
        - $ref: "#/components/parameters/IfRangeHeader"
        - $ref: "#/components/parameters/IfNoneMatchHeader"
        - $ref: "#/components/parameters/IfMatchHeader"
      responses:
        "200":
          description: no captures, or the capture
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    title: Files
                    type: array
                    description: always empty
                    items:
                      type: string
                    example: []
                  pwd:
                    title: Pwd
                    type: string
                    description: always `.`
                    example: .
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          $ref: "#/components/responses/PartialContent"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: a method other than files or download
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSharkError"
        "403":
          description: >-
            the capture name does not allow downloads, or a proxy that names
            its user named another user than the name's
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSharkError"
        "404":
          description: >-
            no such capture name, one that has ended, or whose user may no
            longer read the capture, or a capture that no longer exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSharkError"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
        "503":
          description: the user's access to the capture could not be checked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSharkError"
  "/webshark/captures/{name}":
    servers:
      - url: http://localhost:3000
    get:
      tags:
        - Experiments
      summary: Read a capture for WebShark
      description: >-
        The capture that a capture name names, as WebShark reads it to show it.
        The name is the only credential, and it is bound to the user and session
        it was given to. Each use checks that the user may still read the
        capture. A saved capture resumes as other downloads do. A running
        capture sends the bytes captured so far, with no `ETag` or
        `Last-Modified` and `Cache-Control: no-store`. Served from the server
        root, only when WebShark is installed.
      operationId: getWebsharkCapturesName
      parameters:
        - name: name
          in: path
          description: the capture name
          required: true
          example: router-k2j4m6n8p1q3r5s7t9v2w4x6y8.pcap
          schema:
            type: string
        - $ref: "#/components/parameters/RangeHeader"
        - $ref: "#/components/parameters/IfRangeHeader"
        - $ref: "#/components/parameters/IfNoneMatchHeader"
      responses:
        "200":
          description: the capture
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          $ref: "#/components/responses/PartialContent"
        "304":
          $ref: "#/components/responses/NotModified"
        "403":
          description: >-
            the capture name does not allow viewing, or a proxy that names its
            user named another user than the name's
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSharkError"
        "404":
          description: >-
            no such capture name, one that has ended, or whose user may no
            longer read the capture, or a capture that no longer exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSharkError"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
        "503":
          description: the user's access to the capture could not be checked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSharkError"
    head:
      tags:
        - Experiments
      summary: Check a capture for WebShark
      description: The GET response's headers without the capture.
      operationId: headWebsharkCapturesName
      parameters:
        - name: name
          in: path
          description: the capture name
          required: true
          example: router-k2j4m6n8p1q3r5s7t9v2w4x6y8.pcap
          schema:
            type: string
      responses:
        "200":
          description: the capture's headers
        "403":
          description: the capture name does not allow viewing, or names another proxy user
        "404":
          description: no such capture name, one that has ended, or a capture that no longer exists
        "503":
          description: the user's access to the capture could not be checked
  "/webshark/streams/{token}":
    servers:
      - url: http://localhost:3000
    get:
      tags:
        - Virtual Machines
      summary: Stream a running VM packet capture with a stream token
      description: >-
        Streams the running capture that a `pcs_` stream token from `POST
        /experiments/{exp_name}/captureTokens` names, as `GET
        /experiments/{exp_name}/vms/{vm_name}/captures/{interface}/stream`
        does, for a command such as `curl -fsSN
        '<origin>/webshark/streams/<token>' | wireshark -k -i -`. Served from
        the server root (under the base path when there is one), not
        `/api/v1`. The token is the only credential, each use checks that its
        user may still read the capture, and the stream ends with the token.
      operationId: getWebsharkStreamsToken
      parameters:
        - name: token
          in: path
          description: the stream token
          required: true
          example: pcs_k2j4m6n8p1q3r5s7t9v2w4x6y8
          schema:
            type: string
        - name: from
          in: query
          description: "`now` to skip packets captured before the request"
          required: false
          schema:
            type: string
            enum: [now]
      responses:
        "200":
          description: the capture, streamed as it grows
          content:
            application/vnd.tcpdump.pcap:
              schema:
                type: string
                format: binary
        "400":
          description: the capture path is not safe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            the token does not allow streaming, or a proxy that names its user
            named another user than the token's
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            no such token, or one that has ended, been revoked, or whose user
            may no longer read the capture. Also the interface is no longer
            being captured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the capture could not be opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: the token's user's access could not be checked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/webshark/watch":
    servers:
      - url: http://localhost:3000
    get:
      tags:
        - Experiments
      summary: Follow a capture's growth for WebShark
      description: >-
        Server-sent events that tell WebShark when a running capture grows,
        so it reloads the capture. The first is a `capture-changed` event whose
        `kind` is `init`, with the capture's size and modification time. Then
        one of kind `append` comes each time the capture has grown, at most as
        often as its size allows. `heartbeat` events come between them. A saved
        capture gets
        only its `init`. The stream ends when the capture name does. Needs a
        capture name that allows `watch`. Served from the server root, only
        when WebShark is installed.
      operationId: getWebsharkWatch
      parameters:
        - name: capture
          in: query
          description: the capture name
          required: true
          example: router-k2j4m6n8p1q3r5s7t9v2w4x6y8.pcap
          schema:
            type: string
      responses:
        "200":
          description: >-
            the events, each `event: <name>` and `data: <JSON>`:
            `capture-changed` data is `{"size": <bytes>, "mtime":
            <milliseconds since the epoch>, "kind": "init" | "append"}`, and
            `heartbeat` data is `{"t": <milliseconds since the epoch>}`
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: capture-changed
                data: {"kind":"init","mtime":1767261600000,"size":4096}
        "403":
          description: >-
            the capture name does not allow watching, or a proxy that names its
            user named another user than the name's
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSharkError"
        "404":
          description: >-
            no such capture name, one that has ended, or whose user may no
            longer read the capture, or a capture that no longer exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSharkError"
        "503":
          description: the user's access to the capture could not be checked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSharkError"
  "/healthz":
    servers:
      - url: http://localhost:3000
    get:
      tags:
        - Health
      summary: Check the server's liveness
      description: >-
        Whether the server is up: its uptime and how long the BoltDB store
        takes to list configs. Results are cached briefly (the store for 2
        seconds), and each check has a timeout, so probes are cheap. Needs no
        credentials. `output` fields need a token, or auth disabled.
      operationId: getHealthz
      parameters:
        - name: exclude
          in: query
          description: >-
            checks to leave out, by name (`uptime`, `store`). Repeat it, or
            separate names with commas.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              example: store
      responses:
        "200":
          description: the server is alive (status pass or warn)
          content:
            application/health+json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: the server is not alive (status fail)
          content:
            application/health+json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
    head:
      tags:
        - Health
      summary: Check the server's liveness, without a body
      description: >-
        The status and headers that `GET /healthz` answers with, and no body.
      operationId: headHealthz
      parameters:
        - name: exclude
          in: query
          description: checks to leave out, by name, as for GET
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              example: store
      responses:
        "200":
          description: the server is alive (status pass or warn)
        "503":
          description: the server is not alive (status fail)
  "/readyz":
    servers:
      - url: http://localhost:3000
    get:
      tags:
        - Health
      summary: Check the server's readiness
      description: >-
        Whether the server can run experiments. The checks cover minimega
        (response time, version, namespaces and mesh size), the store,
        qemu-img, WebShark (when installed), disk use of the minimega files and
        phenix base directories, the websocket broker, uptime and Go runtime
        numbers. The status is the worst of them. A minimega that does not
        answer, an unreadable store, or a disk at least 98% full fails. A slow
        minimega or store, a disk at least 90% full, a missing qemu-img or
        WebShark, a smaller mesh, or a backed-up websocket queue warns.
        Results are cached per check (minimega for 5 seconds), so probes send
        minimega at most three commands every 5 seconds. Needs no credentials,
        but `output` fields need a token or auth disabled.
      operationId: getReadyz
      parameters:
        - name: exclude
          in: query
          description: >-
            checks to leave out, by name (`uptime`, `go`, `store`, `minimega`,
            `qemu-img`, `webshark`, `disk`, `websocket`). Repeat it, or separate
            names with commas.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              example: disk
      responses:
        "200":
          description: the server is ready (status pass or warn)
          content:
            application/health+json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: the server is not ready (status fail)
          content:
            application/health+json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
    head:
      tags:
        - Health
      summary: Check the server's readiness, without a body
      description: >-
        The status and headers that `GET /readyz` answers with, and no body.
      operationId: headReadyz
      parameters:
        - name: exclude
          in: query
          description: checks to leave out, by name, as for GET
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: the server is ready (status pass or warn)
        "503":
          description: the server is not ready (status fail)
  "/jobs":
    get:
      tags:
        - Jobs
      summary: List background jobs
      description: >-
        The requesting user's jobs, and those of other users the role may list
        (`jobs` `list` on their experiment), newest first. The list leaves out
        their items'
        `result`, which GET /jobs/{id} returns. Also served on the unix socket.
      operationId: getJobs
      parameters:
        - name: experiment
          in: query
          description: only the jobs of this experiment
          required: false
          example: exp1
          schema:
            type: string
        - name: kind
          in: query
          description: only jobs of this kind
          required: false
          schema:
            type: string
            enum:
              - vms.action
              - files.archive
              - disk.clone
        - name: active
          in: query
          description: "`true` for only the jobs queued or running"
          required: false
          schema:
            type: boolean
        - $ref: "#/components/parameters/PageNum"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: the jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    title: Jobs
                    description: the jobs the caller may see, newest first
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
                  total:
                    title: Total
                    description: how many jobs the caller may see, before paging
                    example: 3
                    type: integer
        "400":
          description: pageNum or perPage is not a whole number from 1 to 2147483647
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/jobs/{id}":
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      tags:
        - Jobs
      summary: Get a background job
      description: >-
        The job with every item and its result. Needs to be the job's owner,
        or `jobs` `get`. Also served on the unix socket.
      operationId: getJob
      responses:
        "200":
          description: the job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: no such job, or another user's that the role may not get
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - Jobs
      summary: Dismiss a finished background job
      description: >-
        Forgets the job and deletes its artifact. Needs to be the job's owner,
        or `jobs` `delete`.
      operationId: deleteJob
      responses:
        "204":
          description: the job is dismissed
        "404":
          description: no such job, or another user's that the role may not delete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: the job is still queued or running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/jobs/{id}/cancel":
    post:
      tags:
        - Jobs
      summary: Cancel a background job
      description: >-
        A queued job ends `canceled` immediately. A running job ends `canceled`
        when its work notices. A VM action job ends after the VMs in progress,
        and an archive or clone job ends immediately, leaving no file. Needs to be
        the job's
        owner, or `jobs` `update`. Also served on the unix socket.
      operationId: postJobCancel
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "202":
          description: the job, with `cancelRequested`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: no such job, or another user's that the role may not cancel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            the job has finished (`job has finished`), or phēnix cannot cancel it
            (`phēnix cannot cancel this job`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/jobs/{id}/artifact":
    get:
      tags:
        - Jobs
      summary: Download a background job's artifact
      description: >-
        The file the job produced, as an attachment. Downloads resume with
        `Range` and `If-Range`, as other downloads do. Needs to be the job's
        owner, or `jobs` `get`. An experiment file archive also needs
        `experiments/files` `get` on its experiment, checked on every
        download. A browser link may pass the token as `?token=`.
      operationId: getJobArtifact
      parameters:
        - $ref: "#/components/parameters/JobID"
        - $ref: "#/components/parameters/RangeHeader"
        - $ref: "#/components/parameters/IfRangeHeader"
        - $ref: "#/components/parameters/IfNoneMatchHeader"
        - $ref: "#/components/parameters/IfMatchHeader"
      responses:
        "200":
          description: the artifact
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/LastModified"
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "206":
          $ref: "#/components/responses/PartialContent"
        "304":
          $ref: "#/components/responses/NotModified"
        "403":
          description: the role may no longer get the files the archive holds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no such job, another user's, or a job with no artifact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
    head:
      tags:
        - Jobs
      summary: Check a background job's artifact
      description: The GET response's headers without the file.
      operationId: headJobArtifact
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: the artifact's headers
        "403":
          description: the role may no longer get the files the archive holds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: no such job, another user's, or a job with no artifact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/roles":
    get:
      tags:
        - Users
      summary: List the roles
      description: Needs the `roles` `list` permission.
      operationId: getRoles
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    title: Roles
                    type: array
                    nullable: true
                    description: the roles, or null when there are none
                    items:
                      $ref: "#/components/schemas/Role"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the roles could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/settings":
    get:
      tags:
        - Settings
      summary: Get the web UI settings
      description: >-
        The password rules, log file rotation and session timeout the web
        UI's Settings page edits, which the store holds. Needs no permission.
      operationId: getSettings
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "500":
          description: the settings could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - Settings
      summary: Change the web UI settings
      description: >-
        Replaces every setting with the body's, which take effect immediately. A
        field the body leaves out is set to its zero value, which
        `min_length` refuses, so send them all, as `GET /settings` returns
        them. Needs the `settings` `update` permission.
      operationId: postSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: the settings were changed
        "400":
          description: >-
            the body is not settings, or its password minimum length is not
            from 8 to 32 (no setting is changed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: >-
            a setting could not be saved (the settings saved before it keep
            their new values)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/settings/password":
    get:
      tags:
        - Settings
      summary: Get the password rules
      description: >-
        What a new password must have, which the sign-up and password forms
        check. Needs no permission.
      operationId: getSettingsPassword
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordSettings"
        "500":
          description: the settings could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/settings/timeout":
    get:
      tags:
        - Settings
      summary: Get the web UI session timeout
      description: >-
        When the web UI signs an idle user out, and warns before it does.
        Needs no permission.
      operationId: getSettingsTimeout
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeoutSettings"
        "500":
          description: the settings could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/logs":
    get:
      tags:
        - Logs
      summary: Get the server's log entries in a time range
      description: >-
        The entries of the server's system log file, rotated files included,
        from `start` to `end`, oldest first. The Logs page then follows new
        entries on the `/ws` websocket (`log` resource). Needs the `logs`
        `get` permission.
      operationId: getLogs
      parameters:
        - name: start
          in: query
          description: the time of the first entry, RFC 3339
          required: true
          schema:
            type: string
            format: date-time
          example: "2026-01-01T10:00:00Z"
        - name: end
          in: query
          description: the time of the last entry, RFC 3339 (the default is 30 seconds from now)
          required: false
          example: "2026-01-01T10:05:00Z"
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: the entries, an empty list when none match
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogEntry"
        "400":
          description: start is missing, or start or end is not an RFC 3339 time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the log files could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/logs/files":
    get:
      tags:
        - Logs
      summary: List the log files to download
      description: >-
        The log files `GET /logs/files/{name}` downloads: the server's own
        system log (`log.system.path`) and minimega's
        (`ui.logs.minimega-path`). Each shows whether it can be downloaded now
        and, when it cannot, why. Needs the `logs` `get` permission.
      operationId: getLogFiles
      responses:
        "200":
          description: the log files, phenix's first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogFileList"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/logs/files/{name}":
    get:
      tags:
        - Logs
      summary: Download a log file
      description: >-
        Streams the server's system log file (`phenix`), as it is now and
        without its rotated files, or minimega's log file (`minimega`) as an
        attachment. The file grows as the server logs, so a download is the
        file as it was when the download started. A resumed download
        with `If-Range` sends the whole file again once it has grown. Each
        download is audited as `log-download`. Needs the `logs` `get`
        permission.
      operationId: getLogFile
      parameters:
        - name: name
          in: path
          description: the log file, `phenix` or `minimega`
          required: true
          schema:
            type: string
            enum: [phenix, minimega]
        - $ref: "#/components/parameters/RangeHeader"
        - $ref: "#/components/parameters/IfRangeHeader"
        - $ref: "#/components/parameters/IfNoneMatchHeader"
        - $ref: "#/components/parameters/IfMatchHeader"
      responses:
        "200":
          description: the log file
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/LastModified"
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
          content:
            text/plain:
              schema:
                type: string
                format: binary
        "206":
          $ref: "#/components/responses/PartialContent"
        "304":
          $ref: "#/components/responses/NotModified"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            no such log file, or the server writes no system log. Also the
            server does not know where minimega's log is
            (`ui.logs.minimega-path`), or finds no regular file there.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the log file cannot be opened or read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: the server may not read the log file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
    head:
      tags:
        - Logs
      summary: Check a log file download
      description: >-
        The GET response's headers without the file: its size
        (Content-Length), `ETag` and `Last-Modified`. Needs the `logs` `get`
        permission.
      operationId: headLogFile
      parameters:
        - name: name
          in: path
          description: the log file, `phenix` or `minimega`
          required: true
          schema:
            type: string
            enum: [phenix, minimega]
        - $ref: "#/components/parameters/RangeHeader"
        - $ref: "#/components/parameters/IfRangeHeader"
        - $ref: "#/components/parameters/IfNoneMatchHeader"
        - $ref: "#/components/parameters/IfMatchHeader"
      responses:
        "200":
          description: the log file's headers
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/LastModified"
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
        "206":
          $ref: "#/components/responses/PartialContent"
        "304":
          $ref: "#/components/responses/NotModified"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            no such log file, or the server writes no system log. Also the
            server does not know where minimega's log is
            (`ui.logs.minimega-path`), or finds no regular file there.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
        "500":
          description: the log file cannot be opened or read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: the server may not read the log file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/ws":
    get:
      tags:
        - Events
      summary: Receive the server's events over a WebSocket
      description: |
        The web UI's event stream. Each text frame holds one or more JSON
        `WebSocketMessage`s, one per line. Each message is a change the server
        publishes. Examples are an `experiment` that was created, started or
        deleted, and an `experiment/vm` that was started, stopped, redeployed
        or updated. Other examples are a VM `experiment/vm/screenshot`, a
        `config`, `user`, `job` or `disks` change, `apps/<app>` trigger
        progress, a SCORCH `apps/scorch` update, or a `log` entry. A client
        gets only the messages its role may see, each checked against the
        permission of the route that made the change. It gets `log` entries
        only once it subscribes, and only when its role may `get` `logs`.

        A client sends JSON `WebSocketRequest`s, of at most 2 KiB:

        - `{"resource": {"type": "log", "action": "subscribe"}}` (or
          `unsubscribe`) starts or stops the live log entries.
        - `{"resource": {"type": "experiment/vms", "name": "<exp>",
          "action": "list"}, "request": {...}}` asks for a page of the
          experiment's VMs. An `experiment/vms` message answers it. While the
          experiment runs, its VMs then get `experiment/vm/screenshot`
          messages, each only when the VM's image changed. `request` takes
          `filter`, `labels`, `hosts`, `show_dnb`, `sort_column`, `sort_asc`,
          `page_number` and `page_size`. `labels` is a list of `{"key":
          "<key>", "value": "<value>"}`. With labels, only the VMs that carry
          one are listed. `hosts` is a list of cluster host names. With hosts,
          only the VMs running on one are listed. A newer list replaces one not
          yet answered. `unsubscribe` stops the screenshots. Needs `vms`
          `list`.
        - `{"resource": {"type": "metadata/screenshot"}, "request": {"size":
          "<width>"}}` sets the width of the client's screenshots, in pixels,
          rounded up to a multiple of 200.
        - `{"resource": {"type": "experiment/topology", "name": "<exp>",
          "action": "search"}, "request": {"term": "hostname", "value":
          "<value>"}}` searches the experiment's network graph, as `GET
          /experiments/{name}/topology/search` does, answered with an
          `experiment/topology` message. Needs `experiments/topology` `get`.

        The server ignores requests that it cannot read. The server pings
        every 54 seconds and drops a client that has not answered within 60.
        When 256 messages wait for a client that is too slow, the server
        closes it with 1013 (Try Again Later) and the reason
        `client too slow`. The client then reconnects
        and reloads what it shows. When the server shuts down it closes every
        client with 1001 (Going Away) and the reason `server shutting down`,
        and answers new websockets with 503. Every message carries `seq`, as the
        introduction describes. Needs a signed-in user, but no permission of
        its own.
      operationId: getWs
      responses:
        "101":
          description: switching protocols, then `WebSocketMessage`s follow
        "400":
          description: not a websocket handshake
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            the server is shutting down (`Retry-After` says when to try again)
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
externalDocs:
  description: phēnix documentation
  url: https://phenix.sceptre.dev
servers:
  - url: http://localhost:3000/api/v1
components:
  schemas:
    Console:
      title: Console
      description: A console started on the server.
      type: object
      properties:
        pid:
          title: PID
          example: 12345
          type: integer
          description: process ID of the console
        namespace:
          title: Namespace
          example: demo
          type: string
          description: >-
            the experiment whose minimega namespace the console uses by
            default, or empty for no namespace
      required:
        - pid
        - namespace
    Configs:
      title: "Configs"
      description: "The configs from GET /configs that the role may list, without their `spec` and `status`."
      type: object
      properties:
        configs:
          title: "Configs"
          description: "The configs that the role may list."
          type: array
          items:
            $ref: "#/components/schemas/Config"
    Config:
      title: "Config"
      description: >-
        A phenix config, such as a Topology or an Experiment, that the config routes and POST
        /workflow/configs/{branch} read or write.
      type: object
      properties:
        apiVersion:
          title: "API Version"
          description: "API version that identifies the resource representation."
          example: phenix.sandia.gov/v1
          type: string
        kind:
          title: "Kind"
          description: "Kind of configuration resource."
          example: Topology
          type: string
        metadata:
          title: "Metadata"
          description: "Metadata associated with the configuration resource."
          type: object
          properties:
            name:
              title: "Name"
              description: "Name of the config, unique within its kind."
              example: water-plant
              type: string
            created:
              title: "Created"
              example: "2026-01-01T00:00:00Z"
              type: string
              readOnly: true
              description: >-
                when the config was first stored (RFC 3339). The server ignores
                it on input
            updated:
              title: "Updated"
              example: "2026-01-02T00:00:00Z"
              type: string
              readOnly: true
              description: >-
                when the config was last written (RFC 3339, whole seconds). The
                server ignores it on input
            revision:
              title: Revision
              example: 42
              type: integer
              format: int64
              readOnly: true
              description: >-
                The store sets it on every write, and it only increases. It is
                opaque, so compare it for equality only. Absent for a config
                that has no stored revision. The server ignores it on input
            annotations:
              title: "Annotations"
              description: >
                Text values by key. `builder-doc` is the one annotation that
                is a map: the Builder document a topology references.
              type: object
              properties:
                builder-doc:
                  title: Builder Document
                  description: the Builder document that a topology references
                  allOf:
                    - $ref: "#/components/schemas/BuilderDocumentReference"
              additionalProperties:
                type: string
          required:
            - name
        spec:
          title: "Spec"
          example: {"nodes": []}
          description: "Configuration specification for the resource."
          type: object
          additionalProperties: true
        status:
          title: "Status"
          example: {}
          description: >-
            The runtime status phenix keeps for the resource, such as an
            experiment's start time, VLANs and app statuses. It is absent when
            the resource has none, and the server ignores it on input.
          type: object
          readOnly: true
          additionalProperties: true
      required:
        - apiVersion
        - kind
        - metadata
        - spec
    BuilderDocumentReference:
      title: Builder Document Reference
      description: >
        The Builder document that a topology references, in its `builder-doc`
        annotation. It holds at least one sub-key. Publish writes `digest` and
        `id`, and keeps a `path` that the topology already has. The server
        refuses a config whose reference is not valid. A renamed or copied
        topology can have an `id` that is not the one that its `digest` gives
        for the name of the topology. When a caller creates or updates a
        topology with such an `id`, the server removes the `id`. It also
        removes the `digest`, unless the reference has a `path`.
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        digest:
          title: Digest
          example: "sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"
          description: >
            digest of the document's canonical JSON, `sha256:` and 64
            lowercase hex digits. It names the stored published document of
            this topology with that content, and pins the content of the
            file `path` names.
          type: string
        id:
          title: ID
          example: "7f010dcd-e23d-514c-9206-3609df999026"
          description: >
            ID of a stored published document (see `/builder/documents`).
            It names a document only when that document was published to
            this topology.
          type: string
        path:
          title: Path
          example: "/phenix/topologies/water-plant.builder.json"
          description: >
            absolute, clean path of a Builder document file on the phenix
            server, at most 1024 bytes, ending in `.json`, `.yaml` or `.yml`.
          type: string
    Experiments:
      title: "Experiments"
      description: "The experiments from GET /experiments that the role may list, with their count before paging."
      type: object
      properties:
        experiments:
          title: "Experiments"
          description: "The experiments on the requested page, or all of them."
          type: array
          items:
            $ref: "#/components/schemas/Experiment"
        total:
          title: Total
          description: how many experiments the role may list, before paging
          example: 4
          type: integer
    Experiment:
      title: "Experiment"
      description: >-
        A phenix experiment with its status and VMs, as GET /experiments/{name}, the start and stop routes and
        GET /experiments return it.
      type: object
      properties:
        id:
          title: "ID"
          example: ""
          type: string
          description: unused and always empty
        name:
          title: "Name"
          description: "Name of the experiment."
          example: exp1
          type: string
        topology:
          title: "Topology"
          description: "Topology configuration embedded in or referenced by this resource."
          example: example-topology
          type: string
        scenario:
          title: "Scenario"
          example: example-scenario
          type: string
          description: the scenario's name, or empty when the experiment has none
        scenarios:
          title: "Scenarios"
          description: >-
            the experiment's scenario, then each other scenario its apps take
            their configuration from (`fromScenario`), in app order. Empty when
            the experiment has none
          example: [example-scenario, base-scenario]
          type: array
          items:
            type: string
        status:
          title: "Status"
          example: started
          type: string
          description: >-
            what the server is doing to the experiment, such as starting,
            stopping, creating or deleting. It is also starting while another
            phenix process, such as `phenix experiment start`, starts the
            experiment. Otherwise, `GET /experiments` reports started or
            stopped, and other responses leave it empty.
        apps:
          title: "Apps"
          example: [scorch, ntp]
          description: "Applications configured for this scenario."
          type: array
          items:
            type: string
        start_time:
          title: "Start Time"
          description: "RFC 3339 time the experiment started, or empty when it is not running."
          example: "2026-01-01T00:00:00Z"
          type: string
        running:
          title: "Running"
          description: "Whether the experiment is running."
          example: false
          type: boolean
        percent:
          title: Percent
          example: 0.5
          type: number
          description: >-
            start progress from 0 to 1 while the experiment is starting. Only
            `GET /experiments` reports it
        vms_unknown:
          title: VMs Unknown
          example: false
          type: boolean
          description: >-
            minimega did not answer for every VM in `vms` (or was busy), so the
            response lists some as configured with an empty state. The server
            sets it only when the response lists VMs
        interrupted:
          title: Interrupted
          example: >-
            VMs were waiting to start when phenix stopped tracking them, and
            these VMs, or VMs they wait on, are no longer in minimega: web
          type: string
          description: >-
            for a running experiment, why phenix could not resume the delayed VM
            starts and post-start apps its start still waited on when phenix
            restarted. Absent otherwise. Stopping or restarting the experiment
            clears it
        builder:
          title: Builder
          type: object
          nullable: true
          description: >-
            the Builder draft and published document that last published the
            experiment, from its `builder-experiment` annotation. It is null
            when the annotation is absent, does not decode, or names neither
          properties:
            draft:
              title: Draft
              type: string
              description: the ID of the Builder draft, or empty when the annotation names none
              example: d1
            document:
              title: Document
              type: string
              description: the ID of the published Builder document, or empty when the annotation names none
              example: doc1
        vm_count:
          title: "VM Count"
          description: "Number of VMs associated with the experiment."
          example: 1
          type: integer
        delayed_vms:
          title: "Delayed VMs"
          description: "Number of VMs waiting for a delayed start condition."
          example: 1
          type: integer
        vlan_min:
          title: "VLAN Min"
          description: "Lowest VLAN ID allocated to the experiment."
          example: 1
          type: integer
        vlan_max:
          title: "VLAN Max"
          description: "Highest VLAN ID allocated to the experiment."
          example: 1
          type: integer
        vlan_count:
          title: "VLAN Count"
          description: "Number of VLANs allocated to the experiment."
          example: 1
          type: integer
        vlans:
          title: "VLANs"
          example: [{vlan: 101, alias: EXP}]
          description: "VLAN IDs and aliases allocated to the experiment."
          type: array
          items:
            title: VLAN
            description: A VLAN alias of the experiment and the VLAN ID that it maps to.
            type: object
            properties:
              vlan:
                title: "VLAN"
                description: "VLAN ID that the alias maps to."
                example: 1
                type: integer
              alias:
                title: "Alias"
                description: "Alias assigned to this VLAN ID."
                example: EXP-1
                type: string
        vms:
          title: "VMs"
          description: "Virtual machines associated with the experiment."
          type: array
          items:
            $ref: "#/components/schemas/VM"
    VMs:
      title: "VMs"
      description: >-
        A page of VMs from GET /vms or GET /experiments/{exp_name}/vms, or the result of a bulk PATCH, with
        counts and filter values.
      type: object
      properties:
        vms:
          title: "VMs"
          description: "The VMs on the requested page, or all of them."
          type: array
          items:
            $ref: "#/components/schemas/VM"
        total:
          title: Total
          example: 12
          type: integer
          description: how many VMs there are, before paging
        runtime_unknown:
          title: Runtime Unknown
          example: false
          type: boolean
          description: >-
            minimega did not answer for every VM of a running experiment (or was
            busy). The response lists the VMs it did not report as configured,
            with an empty state, instead of omitting them
        observed_at:
          title: Observed At
          example: "2026-01-01T10:00:00Z"
          type: string
          description: >-
            when the server read minimega for the VMs, as an RFC 3339 time.
            Empty when the server did not read it, as for a stopped experiment
            or a bulk `PATCH`
        errors:
          title: Errors
          description: >-
            the VMs a bulk `PATCH` left unchanged, and why. Empty for every
            other response
          type: array
          items:
            $ref: "#/components/schemas/VMItemError"
        labels:
          title: Labels
          description: >-
            every distinct label on the VMs the role may list, before filtering
            and paging, ordered by key then value. Empty for a bulk `PATCH`
          type: array
          items:
            $ref: "#/components/schemas/VMLabel"
        hosts:
          title: Hosts
          description: >-
            every distinct cluster host running the VMs the role may list,
            before filtering and paging, sorted. Empty for a bulk `PATCH`
          type: array
          items:
            type: string
          example: [compute1, compute2]
        running:
          title: Running
          description: >-
            how many of the VMs the role may list are running, before filtering
            and paging. It is 0 for a bulk `PATCH`
          type: integer
          example: 9
        delayed:
          title: Delayed
          description: >-
            the names of the VMs the role may list that still wait for a
            delayed start (a timer, user or C2 delay), before filtering and
            paging. Empty for a bulk `PATCH`
          type: array
          items:
            type: string
          example: [client1, client2]
    VMLabel:
      title: VM Label
      description: A key and value label a VM carries.
      type: object
      properties:
        key:
          title: Key
          description: the label's key
          example: role
          type: string
        value:
          title: Value
          description: the label's value, which may be empty
          example: server
          type: string
    VMItemError:
      title: VM Item Error
      description: A VM a bulk update left unchanged.
      type: object
      properties:
        name:
          title: Name
          description: the VM
          example: web
          type: string
        status:
          title: Status
          description: >-
            `skipped` when the role may not change the VM, `failed` when its
            change did not succeed
          type: string
          enum:
            - skipped
            - failed
          example: failed
        error:
          title: Error
          description: why the VM is unchanged
          example: you do not have permission
          type: string
    VM:
      title: "VM"
      description: >-
        One VM of an experiment, as GET /experiments/{exp_name}/vms/{vm_name}, its PATCH and the VM action
        routes return it.
      type: object
      properties:
        name:
          title: "Name"
          description: "Hostname of the VM, unique within its experiment."
          example: host-01
          type: string
        experiment:
          title: "Experiment"
          description: "Name of the experiment containing the VM."
          example: example-experiment
          type: string
        host:
          title: "Host"
          description: "Cluster host assigned to or running the VM."
          example: compute-01
          type: string
        ipv4:
          title: "IPv4"
          example: ["10.0.0.2"]
          description: "IPv4 addresses assigned to the virtual machine."
          type: array
          items:
            type: string
        cpus:
          title: "CPUs"
          description: "Number of virtual CPUs assigned to the VM."
          example: 1
          type: integer
        ram:
          title: "RAM"
          description: "Memory assigned to the VM, in megabytes."
          example: 1
          type: integer
        disk:
          title: "Disk"
          description: "Disk image or disk path used by the VM."
          example: ubuntu.qc2
          type: string
        dnb:
          title: "Do Not Boot"
          description: "Whether the VM should remain powered off."
          example: false
          type: boolean
        networks:
          title: "Networks"
          example: [EXP]
          description: "Networks connected to the VM."
          type: array
          items:
            type: string
        taps:
          title: "Taps"
          example: [mega_tap0]
          description: "Tap interfaces associated with the VM."
          type: array
          items:
            type: string
        captures:
          title: "Captures"
          description: "Packet captures associated with the VM or experiment."
          type: array
          items:
            $ref: "#/components/schemas/Capture"
        running:
          title: "Running"
          description: "Whether the VM is running."
          example: false
          type: boolean
        busy:
          title: "Busy"
          description: "Whether an operation is currently acting on the VM."
          example: false
          type: boolean
        state:
          title: "State"
          description: >-
            minimega state of the VM, such as BUILDING, RUNNING, PAUSED or QUIT.
            EXTERNAL for an external node, and empty when minimega did not
            report the VM.
          example: RUNNING
          type: string
        cdRom:
          title: CD ROM
          description: the image in the VM's CD-ROM drive, if any
          example: tools.iso
          type: string
        tags:
          title: "Tags"
          example: {"role": "server"}
          description: "String tags associated with the VM."
          type: object
          additionalProperties:
            type: string
        ccActive:
          title: CC Active
          description: whether the VM's miniccc agent is connected
          example: false
          type: boolean
        external:
          title: "External"
          description: "Whether the VM represents an external node outside minimega."
          example: false
          type: boolean
        delayed_start:
          title: "Delayed Start"
          description: "Description of the VM start delay, if any."
          example: timer:30s
          type: string
        snapshot:
          title: "Snapshot"
          description: "Whether to take a VM disk snapshot."
          example: false
          type: boolean
        inject_partition:
          title: "Inject Partition"
          description: "Disk partition used for file injection."
          example: 1
          type: integer
        description:
          title: Description
          description: the VM's description from the topology
          example: Web server
          type: string
        os_type:
          title: OS Type
          description: >-
            the guest operating system its topology node gives in
            hardware.os_type, such as linux, windows or vyos. Empty when the
            node gives none
          example: linux
          type: string
        uptime:
          title: "Uptime"
          description: "Seconds since the VM started."
          example: 3600.5
          type: number
          format: double
        screenshot:
          title: "Screenshot"
          description: "Base64-encoded screenshot data URL, when requested."
          example: data:image/png;base64,aGVsbG8=
          type: string
        annotations:
          title: Annotations
          example: {"owner": "alice"}
          type: object
          additionalProperties: true
          nullable: true
          description: >-
            the node's annotations. Only a single VM's GET response, and its
            PATCH response when the role may also get the VM, carry them. VM
            lists, other responses and websocket updates send null.
        defaults:
          title: Defaults
          description: >-
            the settings the VM had when phenix created its experiment, which
            POST /experiments/{exp_name}/vms/resetSettings restores. The VM
            list, a VM's GET, its PATCH and a reset carry them. They are null
            for a VM its experiment saved no settings for, and in other
            responses
          type: object
          allOf:
            - $ref: "#/components/schemas/VMDefaults"
          nullable: true
    VMDefaults:
      title: VM Defaults
      description: >-
        The settings of a VM that phenix saved when it created the VM's
        experiment, in the form of the VM's own fields. POST
        /experiments/{exp_name}/vms/resetSettings restores them.
      type: object
      nullable: true
      properties:
        cpus:
          title: CPUs
          description: the number of virtual CPUs
          example: 1
          type: integer
        ram:
          title: RAM
          description: the memory, in megabytes
          example: 1024
          type: integer
        disk:
          title: Disk
          description: the full path of the first drive's image, empty for a VM with no drive
          example: /phenix/images/ubuntu.qc2
          type: string
        inject_partition:
          title: Inject Partition
          description: the partition of the first drive that phenix injects files into
          example: 1
          type: integer
        snapshot:
          title: Snapshot
          description: whether the VM runs on a snapshot of its disk
          example: true
          type: boolean
        dnb:
          title: Do Not Boot
          description: whether the VM stays powered off when the experiment starts
          example: false
          type: boolean
        host:
          title: Host
          description: the cluster host the schedule placed the VM on, empty for none
          example: compute-01
          type: string
    VMQoS:
      title: VM Link Quality
      description: The link quality of each interface of a VM.
      type: object
      properties:
        interfaces:
          title: Interfaces
          description: one entry for each interface of the VM, in interface order
          type: array
          items:
            $ref: "#/components/schemas/InterfaceQoS"
    InterfaceQoS:
      title: Interface Link Quality
      description: >-
        The link quality that minimega applies to the traffic one VM interface
        receives. Each value is as minimega reports it, and empty when it is
        not set.
      type: object
      properties:
        interface:
          title: Interface
          description: the index of the interface, from 0
          example: 0
          type: integer
        loss:
          title: Loss
          description: the percent of packets dropped at random
          example: "0.5"
          type: string
        delay:
          title: Delay
          description: the time each packet is held
          example: 100ms
          type: string
        rate:
          title: Rate
          description: the most bandwidth
          example: 10mbit
          type: string
    Schedulers:
      title: Schedulers
      description: The scheduling algorithms that POST /experiments/{name}/schedule can run.
      type: object
      properties:
        schedulers:
          title: Schedulers
          description: the built-in schedulers, then the user schedulers
          type: array
          items:
            title: Scheduler
            description: One scheduling algorithm.
            type: object
            properties:
              name:
                title: Name
                description: the name to give as `algorithm`
                example: round-robin
                type: string
              builtin:
                title: Built In
                description: >-
                  true for a scheduler phenix has built in, false for a
                  `phenix-scheduler-<name>` executable
                example: true
                type: boolean
              description:
                title: Description
                description: >-
                  what a built-in scheduler does; left out for a user
                  scheduler
                example: >-
                  Puts each VM that has no host on the host that has the
                  fewest VMs at that time, so that the VMs spread evenly.
                  Keeps the hosts that you set.
                type: string
    Schedule:
      title: "Schedule"
      description: >-
        The cluster host of each VM of an experiment, from GET /experiments/{name}/schedule or after POST
        schedules the experiment.
      type: object
      properties:
        schedule:
          title: "Schedule"
          description: "VM-to-host placement assignments."
          type: array
          items:
            title: VM Placement
            description: The cluster host of one VM.
            type: object
            properties:
              vm:
                title: "VM"
                description: "Name of the VM associated with this result."
                example: node-01
                type: string
              host:
                title: "Host"
                description: "Cluster host assigned to or running the VM."
                example: compute-01
                type: string
              auto_assigned:
                title: "Auto Assigned"
                description: "Whether the scheduler selected this host automatically."
                example: false
                type: boolean
    Captures:
      title: "Captures"
      description: >-
        The running packet captures of an experiment or of one VM, or the captures that POST
        /experiments/{name}/captureSubnet started.
      type: object
      properties:
        captures:
          title: "Captures"
          description: "Packet captures associated with the VM or experiment."
          type: array
          items:
            $ref: "#/components/schemas/Capture"
    Capture:
      title: "Capture"
      description: "One packet capture: the VM, the index of its interface and the capture file."
      type: object
      properties:
        vm:
          title: "VM"
          description: "Name of the VM associated with this result."
          example: node-01
          type: string
        interface:
          title: "Interface"
          description: "Network interface index used for the packet capture."
          example: 1
          type: integer
        filepath:
          title: "Filepath"
          description: "Path to the packet capture file."
          example: /phenix/captures/capture.pcap
          type: string
    CaptureToken:
      title: Capture Token
      description: A capture token, as the experiment's capture token routes give and list it.
      type: object
      properties:
        id:
          title: ID
          type: string
          description: not secret. It names the token in listings, logs and revocation
          example: 3f9a0c51d2e47b86
        token:
          title: Token
          type: string
          description: >-
            the token, only when it is given: `pcs_<random>` for a stream, or
            a WebShark capture name
          example: pcs_k2j4m6n8p1q3r5s7t9v2w4x6y8
        operations:
          title: Operations
          description: what the token may be used for
          type: array
          items:
            type: string
            enum: [stream, view, download, watch]
        expires:
          title: Expires
          example: "2026-01-01T12:00:00Z"
          type: string
          format: date-time
          description: when the token, and anything it opened, ends at the latest
        useBy:
          title: Use By
          example: "2026-01-01T10:05:00Z"
          type: string
          format: date-time
          description: a stream token's last moment to start a stream
        lastUsed:
          title: Last Used
          description: when the token was last used
          example: "2026-01-01T10:05:00Z"
          type: string
          format: date-time
        uses:
          title: Uses
          description: how many times the token has been used
          example: 1
          type: integer
        experiment:
          title: Experiment
          description: the experiment the capture belongs to
          example: exp1
          type: string
        target:
          title: Target
          description: the capture the token reads
          type: object
          properties:
            path:
              title: Path
              example: captures/router_eth0.pcap
              type: string
              description: the experiment file holding the capture, when known
            vm:
              title: VM
              description: the VM whose interface is captured, for a running capture
              example: router
              type: string
            interface:
              title: Interface
              description: the index of the captured VM interface, for a running capture
              example: 0
              type: integer
        urls:
          title: URLs
          type: object
          description: where to use the token, relative to the UI's base path
          properties:
            stream:
              title: Stream
              description: where a stream token streams the capture as pcap
              type: string
              example: webshark/streams/pcs_k2j4m6n8p1q3r5s7t9v2w4x6y8
            view:
              title: View
              description: where WebShark opens the capture
              type: string
              example: webshark/embed?capture=router-k2j4m6n8p1q3r5s7t9v2w4x6y8.pcap
    CaptureTokenRequest:
      title: Capture Token Request
      description: >-
        The capture a capture token is for, named as
        `/experiments/{exp_name}/webshark` takes it, and what it may be used
        for.
      type: object
      required:
        - operations
      properties:
        path:
          title: Path
          example: captures/router_eth0.pcap
          type: string
          description: a .pcap, .pcapng or .cap experiment file, optionally gzipped
        vm:
          title: VM
          example: router
          type: string
          description: VM with a running capture (with interface)
        interface:
          title: Interface
          example: 0
          type: integer
          description: index of the VM interface being captured
        operations:
          title: Operations
          type: array
          description: "`stream` alone, or any of `view`, `download` and `watch`"
          items:
            type: string
            enum: [stream, view, download, watch]
          example: [stream]
    CaptureTokenList:
      title: Capture Token List
      description: The caller's capture tokens for one experiment.
      type: object
      properties:
        tokens:
          title: Tokens
          description: >-
            the caller's capture tokens for the experiment that have
            not ended, without the tokens themselves
          type: array
          items:
            $ref: "#/components/schemas/CaptureToken"
    Snapshots:
      title: "Snapshots"
      description: >-
        The names of the saved snapshots of one VM, from GET /experiments/{exp_name}/vms/{vm_name}/snapshots.
      type: object
      properties:
        snapshots:
          title: "Snapshots"
          example: [host-01__before-patch]
          description: "Snapshot names available for the VM."
          type: array
          items:
            type: string
    Files:
      title: "Files"
      description: "A page of an experiment's files from GET /experiments/{name}/files, with their count before paging."
      type: object
      properties:
        files:
          title: "Files"
          type: array
          description: the files on the requested page, or all of them
          items:
            title: File
            description: An experiment file or directory.
            type: object
            properties:
              name:
                title: Name
                description: the file's name
                example: router_eth0.pcap
                type: string
              path:
                title: Path
                example: captures/router_eth0.pcap
                type: string
                description: path relative to the experiment's files directory
              date:
                title: Date
                description: RFC 3339 time the file last changed
                example: "2026-01-01T10:00:00Z"
                type: string
              size:
                title: Size
                description: the file's size in bytes
                example: 1048576
                type: integer
              categories:
                title: Categories
                description: what the file is, such as `Packet Capture`, `Scorch Artifact` or `Filebeat`
                type: array
                items:
                  type: string
              plainText:
                title: Plain Text
                description: whether the file is plain text the Files tab can show
                example: false
                type: boolean
              isDir:
                title: Is Dir
                description: whether the entry is a directory
                example: false
                type: boolean
        total:
          title: Total
          example: 12
          type: integer
          description: how many files match, before paging
    FilePaths:
      title: File Paths
      description: Experiment files to act on, by their paths as listed.
      type: object
      required:
        - paths
      properties:
        paths:
          title: Paths
          example: [captures/router_eth0.pcap]
          type: array
          description: file paths relative to the experiment's files directory, as listed
          items:
            type: string
    FilesDeleted:
      title: Files Deleted
      description: The outcome of deleting several experiment files.
      type: object
      properties:
        deleted:
          title: Deleted
          example: [captures/router_eth0.pcap]
          description: the paths that the server deleted
          type: array
          items:
            type: string
        failed:
          title: Failed
          description: the paths that the server could not delete, with the reason
          type: array
          items:
            title: Failed Delete
            description: A file that the server could not delete, and the reason.
            type: object
            properties:
              path:
                title: Path
                description: the file's path as the request named it
                example: captures/router_eth0.pcap
                type: string
              error:
                title: Error
                description: why the server could not delete the file
                example: no such file
                type: string
    ScorchPipelines:
      title: Scorch Pipelines
      type: object
      description: >-
        Every Scorch run of an experiment, with the state of the scorch app
        and of the experiment itself.
      properties:
        pipelines:
          title: Pipelines
          type: array
          description: >-
            one pipeline per run in the scorch app metadata, in run order, each
            the run's top-level loop. Null when the metadata configures no runs
          nullable: true
          items:
            $ref: "#/components/schemas/ScorchPipeline"
        running:
          title: Running
          type: integer
          description: >-
            the run the scorch app is executing, or -1 when the app is not
            running or has reported no run
          example: -1
        app_running:
          title: App Running
          example: false
          type: boolean
          description: whether the scorch app itself is running
        experiment:
          title: Experiment
          type: object
          description: the experiment's own state, so the Scorch page can show it
          properties:
            status:
              title: Status
              example: started
              type: string
              description: >-
                started, stopped, or what the server is doing to it, such as
                starting or stopping
    ScorchPipeline:
      title: Scorch Pipeline
      type: object
      description: >-
        One loop of a run's pipeline. It has a node per stage (`configure`,
        `start`, a `loop` node when this loop nests another, `stop`, `cleanup`
        and `done`). It also has a node per component the loop names, and the
        edges that order them. An edge points at a node by its index, which is
        the node's position in `pipeline`.
      properties:
        name:
          title: Name
          example: baseline
          type: string
          description: the run's name, when the run's metadata names it
        hasCleanup:
          title: Has Cleanup
          example: true
          type: boolean
          description: >-
            whether this loop defines cleanup components. For a run's top-level
            loop (loop 0), those are the run's, which can be run separately. For
            a nested loop, they are that loop's.
        pipeline:
          title: Pipeline
          description: the loop's nodes. An edge names a node by its index here
          type: array
          items:
            $ref: "#/components/schemas/ScorchPipelineNode"
    ScorchPipelineNode:
      title: Scorch Pipeline Node
      description: A stage or component of a Scorch pipeline loop.
      type: object
      properties:
        name:
          title: Name
          example: configure
          type: string
          description: the stage's name, or the component's
        hint:
          title: Hint
          example: ""
          type: string
          description: always sent, always empty at present
        status:
          title: Status
          type: string
          description: the latest status reported for the node
          enum:
            - unknown
            - running
            - background
            - unstable
            - success
            - failure
        stage:
          title: Stage
          example: start
          type: string
          description: the stage a component node belongs to, or empty on a stage node
        exp:
          title: Exp
          description: the experiment's name
          example: exp1
          type: string
        run:
          title: Run
          description: the run's index in the scorch app metadata
          example: 0
          type: integer
        loop:
          title: Loop
          description: the loop's nesting depth, 0 for a run's top-level loop
          example: 0
          type: integer
        next:
          title: Next
          type: array
          nullable: true
          description: >-
            edges to the nodes that follow this one. Null when the node has no
            edges, as for the `done` node
          items:
            $ref: "#/components/schemas/ScorchPipelineEdge"
    ScorchPipelineEdge:
      title: Scorch Pipeline Edge
      description: An edge of a Scorch pipeline, to the node that follows.
      type: object
      properties:
        index:
          title: Index
          example: 1
          type: integer
          description: position of the node the edge points at in `pipeline`
        weight:
          title: Weight
          example: 0
          type: integer
          description: 0 until the edge has been taken, then 2
    Hosts:
      title: "Hosts"
      description: "The minimega cluster hosts from GET /hosts that the role may list."
      type: object
      properties:
        hosts:
          title: "Hosts"
          description: "The cluster hosts the role may list."
          type: array
          items:
            $ref: "#/components/schemas/Host"
    Host:
      title: "Host"
      description: "One minimega cluster host, with its resources, its load and the number of VMs on it."
      type: object
      properties:
        name:
          title: "Name"
          description: "Name of the cluster host."
          example: compute1
          type: string
        cpus:
          title: "CPUs"
          description: "Number of CPUs available on the cluster host."
          example: 1
          type: integer
        cpucommit:
          title: "CPU Commit"
          description: "Number of CPUs committed to virtual machines on the host."
          example: 2
          type: integer
        load:
          title: "Load"
          example:
            - "0.50"
            - "0.75"
            - "1.00"
          type: array
          description: the 1, 5 and 15 minute load averages
          items:
            example: "0.50"
            type: string
        memused:
          title: "Memused"
          description: "Memory in use on the cluster host, in megabytes."
          example: 1
          type: integer
        memtotal:
          title: "Memtotal"
          description: "Total memory on the cluster host, in megabytes."
          example: 8192
          type: integer
        memcommit:
          title: "Memory Commit"
          description: "Memory committed to virtual machines on the host, in megabytes."
          example: 2048
          type: integer
        tx:
          title: "Transmit"
          description: "Transmit bandwidth value reported for the cluster host."
          example: 0.0
          type: number
        rx:
          title: "Receive"
          description: "Receive bandwidth value reported for the cluster host."
          example: 0.0
          type: number
        bandwidth:
          title: "Bandwidth"
          description: "Network bandwidth reported for the cluster host."
          example: "rx: 0.0 / tx: 0.0"
          type: string
        diskusage:
          title: "Disk Usage"
          type: object
          description: >-
            percent in use of the disks holding the phenix and minimega base
            directories
          properties:
            diskphenix:
              title: "Phenix Disk Usage"
              description: "Percentage of the host filesystem used by phēnix."
              example: 42.5
              type: number
            diskminimega:
              title: "Minimega Disk Usage"
              description: "Percentage of the host filesystem used by minimega."
              example: 35.0
              type: number
        netcommit:
          title: "Network Commit"
          description: "Network capacity committed to virtual machines on the host."
          example: 0
          type: integer
        vms:
          title: "VMs"
          description: "Number of VMs on the host."
          example: 1
          type: integer
        uptime:
          title: "Uptime"
          description: "Seconds since the host started."
          example: 86400.5
          type: number
          format: double
        schedulable:
          title: "Schedulable"
          description: "Whether the cluster host can run VMs."
          example: false
          type: boolean
        headnode:
          title: "Headnode"
          description: "Whether this host is the cluster headnode."
          example: false
          type: boolean
    Applications:
      title: "Applications"
      description: "The names of the phenix apps from GET /applications that the role may list."
      type: object
      properties:
        applications:
          title: "Applications"
          example: [scorch, ntp]
          description: "Application names available to experiments."
          type: array
          items:
            type: string
    Topologies:
      title: "Topologies"
      description: "The names of the Topology configs from GET /topologies that the role may list."
      type: object
      properties:
        topologies:
          title: "Topologies"
          example: [water-plant]
          description: "The names of the topologies that the role may list."
          type: array
          items:
            type: string
    Disks:
      title: "Disks"
      description: "A page of the disk images from GET /disks that the role may see, with their count before paging."
      type: object
      properties:
        disks:
          title: "Disks"
          type: array
          description: sorted by name, then by full path
          items:
            $ref: "#/components/schemas/Disk"
        total:
          title: Total
          description: how many disk images the role sees, before paging
          example: 7
          type: integer
    Disk:
      title: Disk
      description: A disk image the server found in or under the minimega files directory.
      type: object
      properties:
        kind:
          title: Kind
          description: what the image is for, from its file type
          type: string
          enum: [VM, Container, ISO, Unknown]
        name:
          title: Name
          example: ubuntu.qc2
          type: string
          description: >-
            the image's file name, which `disks` permissions name. Images in
            different folders can share it
        fullPath:
          title: Full Path
          example: /phenix/images/ubuntu.qc2
          type: string
          description: >-
            the image's absolute path, without `.` or `..` segments, which
            identifies it
        relativePath:
          title: Relative Path
          example: ubuntu.qc2
          type: string
          description: >-
            the image's path relative to the minimega files directory, or empty
            when the image is outside it
        outsideFilesDir:
          title: Outside Files Dir
          example: false
          type: boolean
          description: whether the image is outside the minimega files directory
        readOnly:
          title: Read Only
          example: false
          type: boolean
          description: >-
            whether the disk actions refuse the image. They refuse an image
            outside the minimega files directory, or in a folder that the disk
            list omits, such as an experiment's files
        size:
          title: Size
          example: 2.1 GiB
          type: string
          description: size of the file, as a readable string
        virtualSize:
          title: Virtual Size
          example: 20 GiB
          type: string
          description: size the guest sees, as a readable string
        experiments:
          title: Experiments
          type: array
          description: >-
            experiments whose topology uses the image, directly or as the
            backing image of an image it uses
          nullable: true
          items:
            title: Disk Experiment Use
            description: An experiment whose topology uses the image.
            type: object
            properties:
              name:
                title: Name
                description: the experiment's name
                example: exp1
                type: string
              running:
                title: Running
                description: whether the experiment is running
                example: false
                type: boolean
        backingImages:
          title: Backing Images
          example: [/phenix/images/kali-base.qc2]
          type: array
          description: >-
            the full paths of the backing images of this one, nearest first. For
            a broken chain, only the images the server could read
          items:
            type: string
        inUse:
          title: In Use
          example: false
          type: boolean
          description: whether the image's file is in use, such as by a running VM
        brokenChain:
          title: Broken Chain
          example: false
          type: boolean
          description: >-
            whether qemu cannot open the image as the server sees the files. A
            file in its backing chain is missing, or the chain loops or is more
            than 64 images deep. False when the server cannot read the image
        chainProblem:
          title: Chain Problem
          example: backing file /phenix/images/ro_kali.qc2 is missing
          type: string
          description: >-
            what breaks the backing chain, in one sentence, or empty when
            brokenChain is false
        missingBacking:
          title: Missing Backing
          example: /phenix/images/ro_kali.qc2
          type: string
          description: >-
            the full path of the missing backing file. Empty for a chain that
            loops, is too deep, or is not broken
        format:
          title: Format
          example: qcow2
          type: string
          description: >-
            the image's format as qemu-img names it, such as qcow2, qcow (qcow
            version 1), raw, vmdk or qed. Empty when the server does not know
            it
        formatVersion:
          title: Format Version
          example: 3
          type: integer
          description: >-
            the version of a qcow2 or qcow image from its header, such as 2 or
            3. Zero for other formats, or when the server cannot read the header
        formatIssue:
          title: Format Issue
          description: >-
            why the image's format needs care, from its header. Null when it
            needs no care. The server reads only the header, and runs no other
            qemu-img command for it
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DiskFormatIssue"
    DiskFormatIssue:
      title: Disk Format Issue
      description: why the format of a disk image needs care
      type: object
      properties:
        level:
          title: Level
          description: >-
            error for an image that qemu refuses to open, or to open
            read/write. warning for an image of an old format, or of a
            format whose backing chain the server does not check
          type: string
          enum: [warning, error]
        problem:
          title: Problem
          example: >-
            /phenix/images/kali.qc2 is a qcow2 version 2 image, an old
            version of the format
          type: string
          description: what is wrong, in one sentence with no final period
        fix:
          title: Fix
          example: Stop each VM that uses it, then upgrade it to version 3
          type: string
          description: what to do, in one or two sentences with no final period
        command:
          title: Command
          example: qemu-img amend -f qcow2 -o compat=1.1 /phenix/images/kali.qc2
          type: string
          description: >-
            the qemu-img command of the fix, with the image's full path.
            "<new image>" in it is the name of a new image that you
            choose. Empty when the fix needs more than one command
    DiskDetails:
      title: Disk Details
      description: >-
        What the server read from one disk image for its details card. A
        reason field that is not empty says why the server did not read a
        part, and the fields of that part are then empty.
      type: object
      properties:
        fullPath:
          title: Full Path
          example: /phenix/images/kali.qc2
          type: string
          description: the image's absolute path, as GET /disks lists it
        format:
          title: Format
          example: qcow2
          type: string
          description: the image's format, as GET /disks lists it
        formatVersion:
          title: Format Version
          example: 3
          type: integer
          description: the version of a qcow2 or qcow image, as GET /disks lists it
        formatIssue:
          title: Format Issue
          description: why the image's format needs care, as GET /disks lists it. Null when it needs no care
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DiskFormatIssue"
        fileBytes:
          title: File Bytes
          example: 4294967296
          type: integer
          format: int64
          description: the size of the file in bytes
        allocatedBytes:
          title: Allocated Bytes
          example: 2147483648
          type: integer
          format: int64
          description: the space the file takes on the server's disk, in bytes
        virtualBytes:
          title: Virtual Bytes
          example: 21474836480
          type: integer
          format: int64
          description: >-
            the size in bytes of the disk the image holds, as the guest sees
            it. Zero when the server does not know it
        modified:
          title: Modified
          example: "2026-10-30T12:00:00Z"
          type: string
          description: the time the file last changed, in RFC 3339, or empty
        qcow:
          title: Qcow
          description: the header of a qcow or qcow2 image. Null for other formats
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DiskQcowHeader"
        fileUnavailable:
          title: File Unavailable
          example: ""
          type: string
          description: >-
            why the server cannot open the image, such as an image that only
            minimega on a different host can read, or empty
        partitionTable:
          title: Partition Table
          type: string
          description: >-
            the partition table of the disk the image holds: none for a disk
            with no table, and unknown for a table the server cannot read.
            Empty when partitionsUnavailable says why the server did not read
            it
          enum: [mbr, gpt, none, unknown, ""]
        diskId:
          title: Disk ID
          example: "0x1a2b3c4d"
          type: string
          description: the MBR disk signature or the GPT disk GUID, or empty
        sectorSize:
          title: Sector Size
          example: 512
          type: integer
          description: the sector size of the partition table in bytes, or zero
        partitions:
          title: Partitions
          type: array
          description: >-
            the partitions, in the order of their numbers. The numbers are
            those that Linux gives, which `inject_partition` uses
          items:
            $ref: "#/components/schemas/DiskPartition"
        filesystem:
          title: Filesystem
          description: >-
            the file system on the whole disk when it has no partition table,
            such as iso9660. Null otherwise
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DiskFilesystem"
        partitionNotes:
          title: Partition Notes
          example: ["phenix read 16 MiB of the disk, its limit, so it shows only some file systems"]
          type: array
          description: >-
            what is wrong with the partition table, or what the server did not
            read, each in one sentence with no final period
          items:
            type: string
        partitionsUnavailable:
          title: Partitions Unavailable
          example: >-
            qemu-img is not installed where phenix runs, so phenix cannot read
            the partitions of a qcow2 image
          type: string
          description: why the server did not read the partitions, or empty
        overlays:
          title: Overlays
          type: array
          description: >-
            the images of the disk list whose backing chain holds this image,
            sorted by full path
          items:
            $ref: "#/components/schemas/DiskOverlay"
        vms:
          title: VMs
          type: array
          description: >-
            the VMs whose drives name this image directly, in experiments the
            role may get
          items:
            $ref: "#/components/schemas/DiskVMUse"
    DiskQcowHeader:
      title: Disk Qcow Header
      description: what the header of a qcow or qcow2 image says
      type: object
      properties:
        compat:
          title: Compat
          type: string
          description: >-
            the qcow2 compatibility level: 0.10 for version 2 and 1.1 for
            version 3. Empty for qcow version 1
          enum: ["0.10", "1.1", ""]
        clusterSize:
          title: Cluster Size
          example: 65536
          type: integer
          format: int64
          description: the cluster size in bytes
        refcountBits:
          title: Refcount Bits
          example: 16
          type: integer
          description: the width of a reference count in bits. Zero for qcow version 1
        encryption:
          title: Encryption
          type: string
          description: the encryption method. qemu does not open aes or luks images for VMs
          enum: [none, aes, luks]
        compression:
          title: Compression
          type: string
          description: the compression type of compressed clusters
          enum: [zlib, zstd]
        dirty:
          title: Dirty
          example: false
          type: boolean
          description: whether qemu did not close the image cleanly
        corrupt:
          title: Corrupt
          example: false
          type: boolean
          description: whether qemu marked the image as corrupt
        externalDataFile:
          title: External Data File
          example: false
          type: boolean
          description: whether the image's data is in a different file
        extendedL2:
          title: Extended L2
          example: false
          type: boolean
          description: whether the image has extended L2 entries (subclusters)
        lazyRefcounts:
          title: Lazy Refcounts
          example: false
          type: boolean
          description: whether qemu writes the reference counts late
        snapshots:
          title: Snapshots
          example: 0
          type: integer
          description: the number of internal snapshots in the image
        backingFile:
          title: Backing File
          example: kali-base.qc2
          type: string
          description: the backing file name as the header stores it, or empty
        backingFormat:
          title: Backing Format
          example: qcow2
          type: string
          description: the backing file's format from the header, or empty when qemu probes it
    DiskPartition:
      title: Disk Partition
      description: a partition of the disk an image holds
      type: object
      properties:
        number:
          title: Number
          example: 1
          type: integer
          description: >-
            the number Linux gives the partition: 1 to 4 for MBR primary
            partitions, 5 and up for logical partitions, and the entry
            number for GPT
        type:
          title: Type
          example: Linux filesystem
          type: string
          description: the name of the partition type, or empty for a type the server does not know
        typeId:
          title: Type ID
          example: 0FC63DAF-8483-4772-8E79-3D69D8477DE4
          type: string
          description: the MBR type byte, such as 0x83, or the GPT type GUID
        start:
          title: Start
          example: 1048576
          type: integer
          format: int64
          description: the offset of the partition from the start of the disk, in bytes
        size:
          title: Size
          example: 21473787904
          type: integer
          format: int64
          description: the size of the partition in bytes, cut to the end of the disk
        bootable:
          title: Bootable
          example: false
          type: boolean
          description: the MBR active flag, or the GPT legacy BIOS bootable attribute
        extended:
          title: Extended
          example: false
          type: boolean
          description: whether this is an MBR extended partition, which holds the logical partitions
        logical:
          title: Logical
          example: false
          type: boolean
          description: whether this is an MBR logical partition
        name:
          title: Name
          example: root
          type: string
          description: the GPT partition name, or empty
        guid:
          title: GUID
          example: 640404B5-A045-442A-A464-CBBDD0706315
          type: string
          description: the GPT unique partition GUID, or empty
        filesystem:
          title: Filesystem
          description: >-
            the file system in the partition. Null for an extended partition,
            or for a partition the server did not read
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DiskFilesystem"
    DiskFilesystem:
      title: Disk Filesystem
      description: a file system, from its magic bytes
      type: object
      properties:
        type:
          title: Type
          type: string
          description: the file system type as blkid names it, or unknown
          enum:
            - ext2
            - ext3
            - ext4
            - xfs
            - btrfs
            - ntfs
            - exfat
            - vfat
            - swap
            - LVM2_member
            - crypto_LUKS
            - iso9660
            - squashfs
            - unknown
        version:
          title: Version
          example: FAT32
          type: string
          description: FAT12, FAT16 or FAT32 for vfat, the LUKS version for crypto_LUKS, or empty
        label:
          title: Label
          example: rootfs
          type: string
          description: the file system label, or empty
    DiskOverlay:
      title: Disk Overlay
      description: an image backed by the image of the details
      type: object
      properties:
        fullPath:
          title: Full Path
          example: /phenix/images/kali-snap.qc2
          type: string
          description: the overlay's absolute path
        direct:
          title: Direct
          example: true
          type: boolean
          description: whether the image of the details is the overlay's own backing file
    DiskVMUse:
      title: Disk VM Use
      description: a VM whose drive names a disk image
      type: object
      properties:
        experiment:
          title: Experiment
          example: exp1
          type: string
          description: the experiment's name
        running:
          title: Running
          example: false
          type: boolean
          description: whether the experiment is running
        vm:
          title: VM
          example: kali
          type: string
          description: the VM's hostname
        drive:
          title: Drive
          example: 0
          type: integer
          description: the index of the drive in the VM's drives
        injectPartition:
          title: Inject Partition
          example: 1
          type: integer
          description: >-
            the partition that phenix injects files into: that of the first
            drive, or 0 for none
    Users:
      title: "Users"
      description: >-
        The users from GET /users that the role may list, or only the caller when the role may get only its own
        user.
      type: object
      properties:
        users:
          title: "Users"
          description: "The users that the role may list."
          type: array
          items:
            $ref: "#/components/schemas/User"
    User:
      title: "User"
      description: >-
        A phenix user account and its role, as GET /users/{username}, POST /users and PATCH /users/{username}
        return it.
      type: object
      properties:
        username:
          title: "Username"
          description: "Username used to identify the account."
          example: user@example.org
          type: string
        first_name:
          title: "First Name"
          description: "User given name."
          example: Alex
          type: string
        last_name:
          title: "Last Name"
          description: "User family name."
          example: Example
          type: string
        role:
          title: "Role"
          description: "Role and policies assigned to the user."
          allOf:
            - $ref: "#/components/schemas/Role"
        resource_names:
          title: "Resource Names"
          example: [water-plant]
          description: "Resource names assigned to the user."
          type: array
          items:
            type: string
        proxy_token:
          title: "Proxy Token"
          description: "Authentication token supplied by a trusted proxy."
          example: proxy-token-example
          type: string
          readOnly: true
    Credentials:
      title: "Credentials"
      description: >-
        The signed-in user and the auth token for later requests, from POST /login, GET /login or POST /signup.
      type: object
      properties:
        user:
          title: "User"
          description: "The signed-in user."
          allOf:
            - $ref: "#/components/schemas/User"
        token:
          title: "Token"
          description: "Authentication token returned for subsequent API requests."
          example: eyJhbGciOi...example
          type: string
    BuilderIssue:
      title: Builder Issue
      description: >
        One problem that the Builder found in a document, a publication or a
        request. It has the code of the rule that it breaks, its severity, what
        it says, and its location, by the parts that the Builder knows. The
        validator of the web UI reports the same codes for the same rules. A
        code never changes its meaning after phenix publishes it. A new rule
        gets a new code.
      type: object
      required:
        - code
        - severity
        - message
      properties:
        code:
          title: Code
          description: >
            The rule the issue breaks, as dotted lowercase words whose first
            names what the rule is about.
          type: string
          pattern: "^[a-z]+(\\.[a-z0-9-]+)+$"
          example: node.hostname.duplicate
        severity:
          title: Severity
          description: >
            `error` for an issue that refuses the request, `warning` for one
            that does not.
          type: string
          enum: [error, warning]
          example: error
        message:
          title: Message
          description: What the issue says, in words for a person to read.
          type: string
          example: duplicate hostname "web" (also nodes[1])
        path:
          title: Path
          description: >
            Where the issue is in the document, when it is about a part of
            it.
          type: string
          example: nodes[3].device.hostname
        nodeId:
          title: Node ID
          description: The ID of the node the issue is about, when it is about one.
          type: string
          example: 4113dfc0-f4be-57f9-8115-6cecd1f1aea3
        edgeId:
          title: Edge ID
          description: The ID of the connection the issue is about, when it is about one.
          type: string
          example: 7f010dcd-e23d-514c-9206-3609df999026
        networkId:
          title: Network ID
          description: The ID of the network the issue is about, when it is about one.
          type: string
          example: a8af611d-c68f-54e0-94a5-9176cea64e44
        field:
          title: Field
          description: >
            The JSON Forms data path of the device field the issue is about,
            when it is about one.
          type: string
          example: spec.network.interfaces.0.vlan
    BuilderDocument:
      title: Builder Document
      description: >-
        A Builder document: the diagram of a topology, with its nodes, networks,
        connections and canvas settings, and no other property. This component
        gives an outline of the nested properties. GET /schemas/builder/v1
        serves the complete JSON Schema that the server checks each document
        against.

        `layout`, `iconSize`, `templates` and `icons` are for presentation only,
        and the server never writes them to a config.
      type: object
      additionalProperties: false
      required:
        - "$schema"
        - revision
        - metadata
        - nodes
        - networks
        - edges
        - viewport
        - grid
      properties:
        "$schema":
          title: Schema URI
          description: >
            the Builder document schema, which a document must name exactly
          type: string
          enum:
            - https://phenix.sandia.gov/schemas/builder/v1
          example: https://phenix.sandia.gov/schemas/builder/v1
        revision:
          title: Schema Revision
          description: >
            the revision of the Builder document schema the document follows
          type: integer
          enum:
            - 1
          example: 1
        metadata:
          title: Metadata
          description: >
            what the document says of itself: its identifier, name and
            description, who made and last saved it and when, and its notes
          allOf:
            - $ref: "#/components/schemas/BuilderDocumentMetadata"
          example:
            id: 49d876d1-571a-5b5c-91b7-aadf5bb5209c
            name: Pump station
            createdBy: alice
            createdAt: "2026-10-01T15:04:05Z"
            updatedBy: bob
            updatedAt: "2026-10-02T09:30:00Z"
            notes:
              - Snapshot the PLC images before each run.
        nodes:
          title: Nodes
          description: >
            the items on the canvas: devices, switches, notes and groups, and
            the shapes, icons and lines drawn beside them
          type: array
          items:
            title: Node
            description: >
              an item on the canvas. It carries the payload its `kind` names,
              and no other.
            type: object
            required:
              - id
              - kind
              - position
            properties:
              id:
                title: ID
                example: "7f010dcd-e23d-514c-9206-3609df999026"
                description: >
                  identifier of the node, unique among the document's nodes
                type: string
              kind:
                title: Kind
                description: what the node is, which names its payload
                type: string
                enum:
                  - device
                  - switch
                  - note
                  - group
                  - shape
                  - icon
                  - line
              label:
                title: Label
                example: "plc-1"
                description: text shown on the node
                type: string
              position:
                title: Position
                description: >
                  where the node is on the canvas: `x` and `y` in pixels,
                  relative to its parent group when it has one
                type: object
                required:
                  - x
                  - y
                additionalProperties: false
                properties:
                  x:
                    title: X
                    description: horizontal canvas position, in pixels
                    type: number
                    example: 160
                  y:
                    title: Y
                    description: vertical canvas position, in pixels
                    type: number
                    example: 256
              size:
                title: Size
                description: >
                  explicit `width` and `height` of the node in pixels. Without
                  them, the editor sets the size of the node
                type: object
                required:
                  - width
                  - height
                additionalProperties: false
                properties:
                  width:
                    title: Width
                    description: width of the node in pixels, more than zero
                    type: number
                    minimum: 0
                    exclusiveMinimum: true
                    example: 120
                  height:
                    title: Height
                    description: height of the node in pixels, more than zero
                    type: number
                    minimum: 0
                    exclusiveMinimum: true
                    example: 80
              parentId:
                title: Parent ID
                example: "6f1c8a52-3d2e-4b7a-9c1d-2e5f7a9b0c13"
                description: identifier of the group node this node belongs to
                type: string
              device:
                title: Device
                description: >-
                  payload of a device node: the hostname, the complete phenix
                  node spec, the connection points, the icon and its `iconSize`,
                  and the colors. `hideDescription` true hides the node
                  description on the canvas, and `layer` (0 to 99) names a layer
                  that `layers` need not define. A publish never writes `layer`
                  or `hideDescription`
                type: object
                additionalProperties: true
              switch:
                title: Switch
                description: >
                  payload of a switch node. It has the network that it
                  represents, and the colors. It also has the `iconSize` of
                  its icon in place of the size of the diagram, and the
                  `layer` (as for a device). A publish never writes the
                  `layer`.
                type: object
                additionalProperties: true
              note:
                title: Note
                description: payload of a note node, its text and color
                type: object
                additionalProperties: true
              group:
                title: Group
                description: >
                  payload of a group node: its title, description, color,
                  border style and icon. It also has the `iconSize` of the
                  icon in place of the size of the diagram, and whether the
                  group is collapsed. `hideDescription` true hides the
                  description of the group on the canvas
                type: object
                additionalProperties: true
              shape:
                title: Shape
                description: >
                  payload of a shape node: `rectangle` or `circle`, its label,
                  fill and outline colors and border style. Never published
                type: object
                additionalProperties: true
              icon:
                title: Icon
                description: >
                  payload of an icon node: exactly one of a built-in `iconKey`
                  and a custom `icon`, and its label. Never published
                type: object
                additionalProperties: true
              line:
                title: Line
                description: >
                  payload of a line node: its 2 to 64 `points` (relative to the
                  position of the node), and its label, color and line style.
                  It also has its `startArrow` and `endArrow`. Never published
                type: object
                additionalProperties: true
          example:
            - id: 4113dfc0-f4be-57f9-8115-6cecd1f1aea3
              kind: device
              label: router
              position:
                x: 0
                y: 0
              device:
                hostname: router
                iconKey: router
                spec:
                  type: Router
                  general:
                    hostname: router
                  hardware:
                    os_type: vyos
                    drives:
                      - image: vyos.qc2
                  network:
                    interfaces:
                      - name: eth0
                        type: ethernet
                        proto: static
                        address: 10.0.0.1
                        mask: 24
                        vlan: EXP
                interfaces:
                  - id: 7f010dcd-e23d-514c-9206-3609df999026
                    name: eth0
                    index: 0
            - id: dee6bc70-8103-581e-8b31-6c95cda798a0
              kind: switch
              label: EXP
              position:
                x: 160
                y: 256
              switch:
                networkId: a8af611d-c68f-54e0-94a5-9176cea64e44
        networks:
          title: Networks
          description: >
            the networks (VLANs) the switches and connections of the document
            belong to
          type: array
          items:
            title: Network
            description: a phenix network (VLAN)
            type: object
            required:
              - id
              - name
            properties:
              id:
                title: ID
                example: "0b6e2c1d-8f4a-4e3b-a5c7-1d2e3f4a5b6c"
                description: identifier of the network
                type: string
              name:
                title: Name
                example: "control"
                description: >
                  VLAN name, unique in the document and without white space
                  (`\s` in an ECMAScript pattern), which device interfaces
                  name as their `vlan`
                type: string
              alias:
                title: Alias
                example: 100
                description: >
                  VLAN number published to an experiment's `vlans.aliases`
                type: integer
                minimum: 1
                maximum: 4094
              description:
                title: Description
                example: "The control network."
                description: free text describing the network
                type: string
              color:
                title: Color
                example: "#2563eb"
                description: >
                  color of the network's connection lines, as CSS color text
                type: string
              lineStyle:
                title: Line Style
                example: "dashed"
                description: >-
                  dash pattern of the network's connection lines. Empty leaves
                  the pattern to the editor
                type: string
                enum: ["", solid, dashed, dotted, dash-dot]
              subnet:
                title: Subnet
                description: >
                  IPv4 network of the network in CIDR form without host bits,
                  which the editor gives interface addresses from. Builder
                  only: a publish does not write it
                type: string
                example: 10.0.0.0/24
              gateway:
                title: Gateway
                example: "10.0.0.1"
                description: >
                  IPv4 address of the network's gateway, a host address of
                  its subnet. The editor sets it as the gateway of an
                  interface that it gives an address. Builder only: a publish
                  does not write it
                type: string
                format: ipv4
          example:
            - id: a8af611d-c68f-54e0-94a5-9176cea64e44
              name: EXP
              alias: 101
              description: Experiment network
              subnet: 10.0.0.0/24
              gateway: 10.0.0.1
        edges:
          title: Connections
          description: >
            the connections, each joining one device interface to one switch,
            and so to its network
          type: array
          items:
            title: Connection
            description: >
              a device connection point attached to a switch. The server checks
              the nodes, connection points and network it names.
            type: object
            required:
              - id
              - sourceNodeId
              - targetNodeId
              - networkId
            properties:
              id:
                title: ID
                example: "6f1c8a52-3d2e-4b7a-9c1d-2e5f7a9b0c13"
                description: identifier of the connection
                type: string
              sourceNodeId:
                title: Source Node ID
                example: "7f010dcd-e23d-514c-9206-3609df999026"
                description: identifier of the node the connection starts at
                type: string
              sourceHandleId:
                title: Source Handle ID
                example: "0b6e2c1d-8f4a-4e3b-a5c7-1d2e3f4a5b6c"
                description: >
                  connection point of the source node, when it is a device
                type: string
              targetNodeId:
                title: Target Node ID
                example: "6f1c8a52-3d2e-4b7a-9c1d-2e5f7a9b0c13"
                description: identifier of the node the connection ends at
                type: string
              targetHandleId:
                title: Target Handle ID
                example: "0b6e2c1d-8f4a-4e3b-a5c7-1d2e3f4a5b6c"
                description: >
                  connection point of the target node, when it is a device
                type: string
              networkId:
                title: Network ID
                example: "0b6e2c1d-8f4a-4e3b-a5c7-1d2e3f4a5b6c"
                description: >
                  identifier of the network of the switch the connection joins
                type: string
              label:
                title: Label
                example: "uplink"
                description: text shown on the connection
                type: string
              color:
                title: Color
                example: "#dc2626"
                description: >
                  line color drawn in place of the network's, as CSS color text
                type: string
              lineStyle:
                title: Line Style
                example: "dotted"
                description: >-
                  dash pattern drawn in place of the network's. Empty means the
                  network's pattern
                type: string
                enum: ["", solid, dashed, dotted, dash-dot]
              route:
                title: Route
                description: >
                  the path that an automatic layout drew, as canvas positions
                  from the source handle to the target handle. Never published
                type: array
                items:
                  title: Route Point
                  description: A point of the route, as a canvas position in pixels.
                  type: object
                  required:
                    - x
                    - y
                  additionalProperties: false
                  properties:
                    x:
                      title: X
                      description: horizontal canvas position, in pixels
                      type: number
                      example: 160
                    y:
                      title: Y
                      description: vertical canvas position, in pixels
                      type: number
                      example: 256
          example:
            - id: 503c4f01-e7e0-5a2e-a07d-26e2776fea8f
              sourceNodeId: 4113dfc0-f4be-57f9-8115-6cecd1f1aea3
              sourceHandleId: 7f010dcd-e23d-514c-9206-3609df999026
              targetNodeId: dee6bc70-8103-581e-8b31-6c95cda798a0
              networkId: a8af611d-c68f-54e0-94a5-9176cea64e44
        viewport:
          title: Viewport
          description: >
            the pan (`x`, `y`, in screen pixels) and `zoom` of the canvas when
            the user saved the document
          type: object
          required:
            - x
            - y
            - zoom
          additionalProperties: false
          properties:
            x:
              title: Pan X
              description: horizontal pan of the canvas, in screen pixels
              type: number
              example: 0
            y:
              title: Pan Y
              description: vertical pan of the canvas, in screen pixels
              type: number
              example: 0
            zoom:
              title: Zoom
              description: zoom factor of the canvas, more than zero, where 1 is 100 percent
              type: number
              minimum: 0
              exclusiveMinimum: true
              example: 1
          example:
            x: 0
            y: 0
            zoom: 1
        grid:
          title: Grid
          description: >
            the grid that the canvas draws. Nodes snap to it while the Snap to
            grid setting of the user is on. It tells whether the canvas shows
            the grid, and gives its `size` in pixels, a whole number from 4 to
            200
          type: object
          required:
            - enabled
            - size
          additionalProperties: false
          properties:
            enabled:
              title: Grid Shown
              description: whether the canvas draws the grid
              type: boolean
              example: true
            size:
              title: Grid Size
              description: distance between the grid lines, in pixels
              type: integer
              minimum: 4
              maximum: 200
              example: 16
          example:
            enabled: true
            size: 16
        scenarios:
          title: Scenarios
          description: >-
            the names of the Scenario configs on the server that the diagram
            uses, with no scenario content and no two names that differ only in
            case. A publish adds the topology to the `topology` annotation of
            each scenario, and an experiment published with the topology uses
            the scenario that the publish request names
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 256
            pattern: "^[A-Za-z0-9_@.-]+$"
          example:
            - pump-station-ntp
            - pump-station-attack
        source:
          title: Source
          description: >
            the config that the document was generated from, the time of that
            generation, and the warnings that the generation raised
          type: object
          additionalProperties: true
          example:
            kind: topology
            name: pump-station
            apiVersion: phenix.sandia.gov/v1
            importedAt: "2026-10-01T15:04:05Z"
            digest: sha256:1f7f8940e18192505e3ec1f993db7204b6baa8d6c1d9156917a82c663656a1b4
            updatedAt: "2026-09-30T08:00:00Z"
        layout:
          title: Layout
          description: >
            the automatic layout that last set the positions of the document.
            The editor names it in its layout menu. An empty value, or an id
            that the editor does not know, means that no layout set the
            positions
          type: string
          example: elk
        iconSize:
          title: Icon Size
          description: >
            the size of the icons of devices, switches and groups on the
            canvas: small (16 pixels), medium (24) or large (32). A node that
            names its own size uses that size. Empty is small
          type: string
          enum:
            - ""
            - small
            - medium
            - large
          example: large
        layers:
          title: Layers
          description: >-
            the layers of the diagram in any order, which devices and switches
            name by `id`. The layered layout puts a higher `id` nearer the top,
            and node `matchers` put a device with no layer selected in a layer.
            With no layers, the editor offers placeholder layers 0 to 6. Never
            published
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/BuilderLayer"
          example:
            - id: 3
              label: Operations
            - id: 2
              label: Supervisory control
              iconKey: desktop
              color: "#15803d"
              matchers:
                general.hostname: ^(hmi|scada)-
            - id: 1
              label: Field devices
        layerSet:
          title: Layer Set Options
          description: >-
            the options of the layer set that the diagram copied its layers
            from. The diagram keeps its own copy of the layers, and the editor
            offers an update when the linked `source` set has a later version.
            Never published
          allOf:
            - $ref: "#/components/schemas/BuilderDocumentLayerSet"
          example:
            name: Purdue Model
            matchConflict: lowest
            layerOutlines: true
            source:
              id: builtin:purdue
              version: 1
        templates:
          title: Templates
          description: >-
            the device templates saved with the diagram, which the editor offers
            beside its own. A copied template names its origin in `source`: the
            `kind` (`library`, `builtin` or `preloaded`), `id`, `version` and
            optional `digest`. The editor offers an update when the library
            holds a later version
          type: array
          maxItems: 50
          items:
            title: Device Template
            description: A device template saved with the diagram.
            type: object
            additionalProperties: true
          example:
            - id: 0d5f8f4e-6a57-4b53-9d0a-5c0f4e3b2a11
              name: Edge router
              description: VyOS router with one static interface
              device:
                iconKey: router
                spec:
                  type: Router
                  general:
                    hostname: router
              source:
                kind: library
                id: 6a1f0c2e-3b4d-4e5f-8a7b-9c0d1e2f3a4b
                version: 3
                digest: sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
        icons:
          title: Custom Icons
          description: >
            copies of the custom icons that the nodes and templates name, at
            most 50. Each is its base64 PNG data under its icon name. A draft
            on a server carries none (names resolve through the icon library).
            A downloaded document carries every icon that it uses.
          type: object
          maxProperties: 50
          additionalProperties:
            title: Custom Icon
            description: A PNG icon of at most 96 by 96 pixels and 40960 bytes.
            type: object
            required:
              - data
            additionalProperties: false
            properties:
              data:
                title: Icon Data
                description: the PNG bytes, in standard base64 with padding and no line breaks
                type: string
                format: byte
                example: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==
          example:
            plc:
              data: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==
    BuilderDocumentMetadata:
      title: Builder Document Metadata
      description: >-
        What a Builder document says of itself: its identifier, name,
        description and notes, and who made it and last saved it, and when. It
        is part of the content and digest of the document, and the server writes
        none of it to a config. The server sets `createdBy`, `createdAt`,
        `updatedBy` and `updatedAt` when it stores a draft snapshot, so a
        document that was never a draft can lack them.
      type: object
      additionalProperties: false
      required:
        - id
      properties:
        id:
          title: Document ID
          description: identifier of the document
          type: string
          example: 49d876d1-571a-5b5c-91b7-aadf5bb5209c
        name:
          title: Name
          description: >
            name of the diagram, which a draft takes as its title: at most 512
            bytes, without control characters
          type: string
          example: Pump station
        description:
          title: Description
          description: free text describing the diagram
          type: string
          example: Water treatment pump station with two PLCs and an HMI.
        createdBy:
          title: Created By
          description: >
            user who first made the document. The server keeps this value
            from the document of the draft create, or else uses the user who
            created the draft. Every later save writes the same value.
          type: string
          maxLength: 256
          example: alice
        createdAt:
          title: Created At
          description: >
            when the document was first made, in UTC to the second
            (`YYYY-MM-DDTHH:MM:SSZ`). The server sets and keeps it as it does
            `createdBy`.
          type: string
          format: date-time
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
          example: "2026-10-01T15:04:05Z"
        updatedBy:
          title: Updated By
          description: >
            user whose save stored this content. The server sets it on every
            save, and replaces a value that the client sends.
          type: string
          maxLength: 256
          example: bob
        updatedAt:
          title: Updated At
          description: >
            the time of that save, in the form of `createdAt`. The server sets
            it on every save, and replaces a value that the client sends. It is
            not `source.updatedAt`, which is a time of the config that the
            document was imported from.
          type: string
          format: date-time
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
          example: "2026-10-02T09:30:00Z"
        notes:
          title: Notes
          description: >-
            free text notes about the diagram, in the order of the editor. Each
            note is not blank, has at most 4096 bytes in UTF-8 (`maxLength`
            counts characters), and has no control characters except newline
            and tab
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 4096
          example:
            - Snapshot the PLC images before each run.
            - "VLAN EXP carries the control traffic.\nKeep it isolated."
    BuilderDocumentStamp:
      title: Builder Document Stamp
      description: >
        The `createdBy`, `createdAt`, `updatedBy` and `updatedAt` of the
        `metadata` of the document that a request stored. The stamp omits a
        field that the stored document does not have. Thus a draft
        opened unchanged from a document that names nobody has an empty
        stamp.
      type: object
      properties:
        createdBy:
          title: Created By
          description: the user who created the document
          example: "alice"
          type: string
        createdAt:
          title: Created At
          description: when the document was created
          example: "2026-01-01T09:30:00Z"
          type: string
          format: date-time
        updatedBy:
          title: Updated By
          description: the user who last changed the document
          example: "alice"
          type: string
        updatedAt:
          title: Updated At
          description: when the document was last changed
          example: "2026-01-02T15:04:05Z"
          type: string
          format: date-time
    BuilderDraftCreate:
      title: Builder Draft Create
      description: >-
        The body of POST /builder/drafts: the document of a new draft and where
        it comes from.
      type: object
      additionalProperties: false
      properties:
        title:
          title: Title
          description: the title of the draft
          example: "Water plant"
          type: string
        summary:
          title: Summary
          example: "Imported from Topology/water-plant"
          description: summary of the first snapshot
          type: string
        sourceToken:
          title: Source Token
          example: "topology/water-plant"
          description: >-
            where the draft comes from: `<kind>/<name>` (an imported config),
            `uploaded/<kind>/<name>` (an uploaded config), `uploaded/legacy-xml`
            (an uploaded legacy Builder diagram without a Topology),
            `builder-doc/<document id>` (a published document) or
            `builder-file/<topology name>/<digest>` (the Builder file of a
            topology, with the `digest` that GET
            /builder/topologies/{topology}/document returned).

            An uploaded source names no stored config, so the draft cannot
            update a stored Topology or Experiment. For `builder-doc`, the
            caller must hold `configs` `get` for the config that the document
            was published to (404 otherwise). For `builder-file`, the server
            reads the file as GET /builder/topologies/{topology}/document does,
            with the same permission and answers. It answers 409 when the file
            no longer holds the document that the token names, or when the
            server no longer reads the topology from its file.
          type: string
        sourceFile:
          title: Source File
          example: "water-plant.yml"
          description: >
            the name of the uploaded file that the document came from, kept
            only for display. It is a file name of at most 255 bytes without
            `/` or `\`, not `.` or `..`, with no control characters (422
            otherwise). The server never opens anything by it.
          type: string
          maxLength: 255
        forkOf:
          title: Fork Of
          example: "6f1c8a52-3d2e-4b7a-9c1d-2e5f7a9b0c13"
          description: >
            the ID of a draft that the new draft forks. The draft must exist
            (404 otherwise). The new draft takes
            its source token in place of `sourceToken`. It records the last
            publication of that draft as `forked`. Thus a publish of the new
            draft can update what that draft published or was opened from. It
            records no source file: not the file of that draft, and not a
            `sourceFile` sent with it.
          type: string
        document:
          title: Document
          description: >-
            the document of the draft's first snapshot. The server sets
            `metadata.updatedBy` and `updatedAt` to the caller and the current
            time, and sets `createdBy` and `createdAt` the same way when the
            document does not have them. A value that is not valid in one of
            these four fields gets 422. A document that a `builder-doc/` or
            `builder-file/` source names is stored as it is, with the same
            digest, so the draft holds exactly what the caller opened
          allOf:
            - $ref: "#/components/schemas/BuilderDocument"
      required:
        - document
    BuilderSnapshotCreate:
      title: Builder Snapshot Create
      description: >-
        The body of POST /builder/drafts/{draft}/snapshots: the document that a
        save stores as the draft's new snapshot.
      type: object
      additionalProperties: false
      properties:
        summary:
          title: Summary
          description: what the save changed, as the client describes it
          example: "Add plc-2"
          type: string
        document:
          title: Document
          description: the document to store
          allOf:
            - $ref: "#/components/schemas/BuilderDocument"
        opId:
          title: Operation ID
          example: "save-42"
          description: >
            the client's id for this save, kept with the snapshot, so a
            client that never saw the response can tell that the server
            stored it
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
      required:
        - document
    BuilderCursorMove:
      title: Builder Cursor Move
      description: exactly one of `index` and `snapshotId`
      type: object
      additionalProperties: false
      properties:
        index:
          title: Index
          example: 2
          description: index of the snapshot to move to, oldest first
          type: integer
          minimum: 0
        snapshotId:
          title: Snapshot ID
          description: ID of the snapshot to move to
          example: "0b6e2c1d-8f4a-4e3b-a5c7-1d2e3f4a5b6c"
          type: string
    BuilderDraft:
      title: Builder Draft
      description: >-
        A draft of the Builder: a document that a user edits, with the history
        of its snapshots and its last publication.
      type: object
      properties:
        id:
          title: ID
          description: ID of the draft
          example: "6f1c8a52-3d2e-4b7a-9c1d-2e5f7a9b0c13"
          type: string
        createdBy:
          title: Created By
          example: "alice"
          description: the user who created the draft
          type: string
        title:
          title: Title
          description: the title of the draft
          example: "Water plant"
          type: string
        sourceToken:
          title: Source Token
          description: where the draft comes from, as `sourceToken` of BuilderDraftCreate gives it
          example: "topology/water-plant"
          type: string
        sourceFile:
          title: Source File
          example: "water-plant.yml"
          description: >
            for a draft made from an uploaded file, the name of that file
          type: string
        created:
          title: Created
          description: when the draft was created
          example: "2026-01-01T09:30:00Z"
          type: string
          format: date-time
        updated:
          title: Updated
          description: when the draft was last changed
          example: "2026-01-02T15:04:05Z"
          type: string
          format: date-time
        lastModifiedBy:
          title: Last Modified By
          description: the user who last changed the draft
          example: "alice"
          type: string
        cursor:
          title: Cursor
          example: 2
          description: index of the current snapshot
          type: integer
        snapshots:
          title: Snapshots
          example: 3
          description: number of snapshots the draft keeps
          type: integer
        snapshotId:
          title: Snapshot ID
          example: "0b6e2c1d-8f4a-4e3b-a5c7-1d2e3f4a5b6c"
          description: ID of the current snapshot
          type: string
        digest:
          title: Digest
          example: "sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"
          description: digest of the current snapshot's document
          type: string
        size:
          title: Size
          example: 4096
          description: size in bytes of the current snapshot's document
          type: integer
        historyBytes:
          title: History Bytes
          example: 12288
          description: total size in bytes of the snapshots the draft keeps
          type: integer
        dirty:
          title: Dirty
          example: false
          description: whether the current snapshot differs from the last publication
          type: boolean
        canUndo:
          title: Can Undo
          description: whether the cursor can move to an older snapshot
          example: true
          type: boolean
        canRedo:
          title: Can Redo
          description: whether the cursor can move to a newer snapshot
          example: false
          type: boolean
        etag:
          title: ETag
          example: "\"7\""
          description: the value of the ETag header for this revision
          type: string
        document:
          title: Document
          description: the document of the current snapshot (GET of one draft only)
          allOf:
            - $ref: "#/components/schemas/BuilderDocument"
        stamp:
          title: Stamp
          description: >
            what the stored document holds in `metadata.createdBy`,
            `createdAt`, `updatedBy` and `updatedAt` (creating a draft and saving one
            only, whose responses have no document). An editor copies it
            into its own copy of the document.
          allOf:
            - $ref: "#/components/schemas/BuilderDocumentStamp"
        history:
          title: History
          description: the snapshots, oldest first (GET of one draft only)
          type: array
          items:
            $ref: "#/components/schemas/BuilderSnapshot"
        publication:
          title: Publication
          description: the draft's last publication. Not present before the first
          allOf:
            - $ref: "#/components/schemas/BuilderPublication"
        forked:
          title: Forked
          description: >
            for a draft created with `forkOf`, what that draft had last
            published when this draft forked it, which this draft may update
            too
          type: object
          properties:
            documentId:
              title: Document ID
              description: ID of the published document of that draft
              example: "7f010dcd-e23d-514c-9206-3609df999026"
              type: string
            topologyTarget:
              title: Topology Target
              description: the topology that draft published
              example: "water-plant"
              type: string
            experimentTarget:
              title: Experiment Target
              description: the experiment that draft published
              example: "water-plant-exp"
              type: string
        experiment:
          title: Experiment
          example: "water-plant-exp"
          description: >-
            name of an experiment that this draft, the diagram it was opened
            from, or the draft it forks published. It is present while the experiment exists and the
            caller holds `experiments` `get` for it, as the server calculates it
            for each response. GET of one draft, POST /builder/drafts and the
            `draft` of a publish answer report it, but the listing does not
          type: string
    BuilderDrafts:
      title: Builder Drafts
      description: >-
        The answer of GET /builder/drafts: every draft that the caller may see,
        and the drafts that the server can no longer read.
      type: object
      properties:
        drafts:
          title: Drafts
          description: every draft, the most recently changed first
          type: array
          items:
            $ref: "#/components/schemas/BuilderDraft"
        damaged:
          title: Damaged
          description: every draft whose metadata this server can no longer read
          type: array
          items:
            $ref: "#/components/schemas/BuilderDamagedDraft"
        limits:
          title: Limits
          description: what the server may hold
          type: object
          properties:
            drafts:
              title: Drafts
              example: 2000
              description: >
                the most drafts the server holds, damaged drafts included
                (2000). A new draft past it gets 413 and `draft.limit`.
              type: integer
    BuilderCleanup:
      title: Builder Cleanup
      description: >
        What POST /builder/cleanup removed, or with `dryRun` would remove. It
        keeps the orphaned storage that the server stored within the last hour,
        because a save or a publication may still reference it.
      type: object
      properties:
        dryRun:
          title: Dry Run
          description: >-
            true when the request asked only what the cleanup would remove, so
            it removed nothing
          example: false
          type: boolean
        drafts:
          title: Drafts
          example: ["6f1c8a52-3d2e-4b7a-9c1d-2e5f7a9b0c13"]
          description: >-
            the IDs of the published, unchanged drafts: the current snapshot is
            the one that the draft last published, no newer snapshot follows,
            and the topology still references the published document. Each
            delete names the revision that the cleanup read, so a draft that
            changed meanwhile stays, and a cleanup waits for a publication in
            progress. The published configs and documents stay
          type: array
          items:
            type: string
        documents:
          title: Documents
          example: 3
          description: the published documents that no topology references
          type: integer
        content:
          title: Content
          example: 5
          description: the stored content records that nothing names
          type: integer
    BuilderDamagedDraft:
      title: Builder Damaged Draft
      description: >
        What this server can still read of a draft whose metadata it can no
        longer read. A caller cannot open it, but can delete it with its ETag.
      type: object
      properties:
        id:
          title: ID
          description: ID of the draft
          example: "6f1c8a52-3d2e-4b7a-9c1d-2e5f7a9b0c13"
          type: string
        createdBy:
          title: Created By
          example: "alice"
          description: >
            the user who created the draft, present when the server can still
            read it
          type: string
        title:
          title: Title
          example: "Water plant"
          description: present when the server can still read it
          type: string
        updated:
          title: Updated
          example: "2026-01-02T15:04:05Z"
          description: present when the server can still read it
          type: string
          format: date-time
        etag:
          title: ETag
          example: "\"7\""
          description: the If-Match value that deletes the draft
          type: string
    BuilderSnapshot:
      title: Builder Snapshot
      description: One saved state of a draft's document, without the document.
      type: object
      properties:
        id:
          title: ID
          description: ID of the snapshot
          example: "0b6e2c1d-8f4a-4e3b-a5c7-1d2e3f4a5b6c"
          type: string
        digest:
          title: Digest
          description: digest of the snapshot's document
          example: "sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"
          type: string
        size:
          title: Size
          description: size in bytes of the snapshot's document
          example: 4096
          type: integer
        createdAt:
          title: Created At
          description: when the snapshot was saved
          example: "2026-01-02T15:04:05Z"
          type: string
          format: date-time
        createdBy:
          title: Created By
          description: the user who saved the snapshot
          example: "alice"
          type: string
        summary:
          title: Summary
          description: what the save changed, as the client describes it
          example: "Add plc-2"
          type: string
        opId:
          title: Operation ID
          example: "save-42"
          description: the client's id for the save that stored the snapshot
          type: string
        current:
          title: Current
          description: whether the draft's cursor points at this snapshot
          example: true
          type: boolean
    BuilderSnapshots:
      title: Builder Snapshots
      description: >-
        The answer of GET /builder/drafts/{draft}/snapshots: the snapshots of a
        draft and its cursor.
      type: object
      properties:
        snapshots:
          title: Snapshots
          description: the snapshots of the draft, oldest first
          type: array
          items:
            $ref: "#/components/schemas/BuilderSnapshot"
        cursor:
          title: Cursor
          description: index of the current snapshot
          example: 2
          type: integer
    BuilderSnapshotDocument:
      title: Builder Snapshot Document
      description: >-
        The answer of GET /builder/drafts/{draft}/snapshots/{snapshot}: a
        snapshot with its document.
      type: object
      properties:
        snapshot:
          title: Snapshot
          description: the snapshot
          allOf:
            - $ref: "#/components/schemas/BuilderSnapshot"
        document:
          title: Document
          description: the document of the snapshot
          allOf:
            - $ref: "#/components/schemas/BuilderDocument"
    BuilderPublication:
      title: Builder Publication
      description: the draft's last publication
      type: object
      properties:
        mode:
          title: Mode
          description: >-
            whether the publication wrote only the topology, or the topology and
            an experiment
          type: string
          enum:
            - topology
            - topology-experiment
        topologyTarget:
          title: Topology Target
          description: name of the Topology config that the draft was published to
          example: "water-plant"
          type: string
        topologyAction:
          title: Topology Action
          description: >-
            whether the publication created the topology (`create`) or updated
            it (`update`)
          example: "create"
          type: string
        experimentTarget:
          title: Experiment Target
          description: >-
            name of the Experiment config that the publication wrote, for a
            `topology-experiment` publication
          example: "water-plant-exp"
          type: string
        scenarioTarget:
          title: Scenario Target
          description: name of the Scenario config of that experiment, when it has one
          example: "plant-ntp"
          type: string
        snapshotId:
          title: Snapshot ID
          description: ID of the snapshot that was published
          example: "0b6e2c1d-8f4a-4e3b-a5c7-1d2e3f4a5b6c"
          type: string
        digest:
          title: Digest
          description: digest of the document of that snapshot
          example: "sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"
          type: string
        documentId:
          title: Document ID
          description: ID of the stored published document that the publication made
          example: "7f010dcd-e23d-514c-9206-3609df999026"
          type: string
        publishedAt:
          title: Published At
          description: when the draft was published
          example: "2026-01-02T15:04:05Z"
          type: string
          format: date-time
        publishedBy:
          title: Published By
          description: the user who published the draft
          example: "alice"
          type: string
    BuilderPublishTarget:
      title: Builder Publish Target
      description: A config that a publication creates or updates.
      type: object
      additionalProperties: false
      properties:
        name:
          title: Name
          example: "water-plant"
          description: config name
          type: string
        action:
          title: Action
          description: create a new config or update an existing one
          type: string
          enum:
            - create
            - update
      required:
        - name
        - action
    BuilderPublishScenario:
      title: Builder Publish Scenario
      description: >
        the scenario that a `topology-experiment` publication creates or
        updates the experiment with: one of the scenarios that the draft's
        document lists, by name
      type: object
      additionalProperties: false
      properties:
        name:
          title: Name
          example: "plant-ntp"
          description: Scenario config name
          type: string
      required:
        - name
    BuilderPublishRequest:
      title: Builder Publish Request
      description: >
        `topology` mode publishes only the topology. `topology-experiment`
        mode also requires an experiment target. It may name the scenario of
        the experiment, which must be one of the scenarios that the document
        lists. Without one, the experiment has no scenario.

        In both modes, a `scenario` stage runs before the experiment stage.
        Each Scenario config that the document lists must exist and be
        readable (`configs` `get` and `scenarios` `list`), or the answer is 422
        and names the scenario. The stage adds the topology to the `topology`
        annotation of each scenario that does not name it yet, which needs
        `configs` `update` on that scenario (403 otherwise). Its message tells
        which scenarios it changed, and a publish never creates or replaces the
        spec of a scenario.
      type: object
      additionalProperties: false
      properties:
        mode:
          title: Mode
          description: whether to publish only the topology, or the topology and an experiment
          type: string
          enum:
            - topology
            - topology-experiment
        topology:
          title: Topology
          description: >-
            the Topology config to create or update. A draft updates an existing
            topology only when the draft was imported from it, or when the draft
            published it (or was opened from the published diagram that did)
            and nothing else changed it since. The server refuses other updates
            with 409.

            Only a draft imported from a topology with a legacy diagram
            (`builder-xml`) updates it, while the diagram is the one that the
            import read. The update replaces `builder-xml` with `builder-doc`
            and adds a warning. Only a draft opened from the Builder file that a
            topology is read from updates that topology, while the file and the
            topology did not change. The topology keeps its `path`, the file
            stays as it is, and a warning says that the file is now behind.
          allOf:
            - $ref: "#/components/schemas/BuilderPublishTarget"
        scenario:
          title: Scenario
          description: the scenario of the experiment, for `topology-experiment` only
          allOf:
            - $ref: "#/components/schemas/BuilderPublishScenario"
        experiment:
          title: Experiment
          description: >-
            the Experiment config to create or update, required for
            `topology-experiment`. The update rules of `topology` apply to it.
            The experiment records the draft and the published document in its
            `builder-experiment` annotation, and its digest after the configure
            stage of its apps ran. An update runs that stage, as an update
            through `/configs` does
          allOf:
            - $ref: "#/components/schemas/BuilderPublishTarget"
        dryRun:
          title: Dry Run
          description: >-
            make every check of the publication on the current snapshot, write
            nothing (no published document, config, scenario annotation,
            experiment or draft record), and answer 200 with a
            `BuilderPublishPreview`. A dry run needs the same permissions but no
            If-Match. It takes no lock, so what it reports can change before the
            publication.
          type: boolean
          default: false
      required:
        - mode
        - topology
    BuilderPublishPreview:
      title: Builder Publish Preview
      description: >
        the answer of a dry run of a publication: what it would change, the
        warnings it would give, and the refusal that it would get. A dry run
        writes nothing.
      type: object
      properties:
        status:
          title: Status
          description: >-
            always `preview`, which tells the answer of a dry run from that of a
            publication
          type: string
          enum:
            - preview
        changes:
          title: Changes
          description: >
            what a publish would change, compared with what the server stores
            now. Null when the server would refuse the publication
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/BuilderPublishChanges"
        warnings:
          title: Warnings
          description: >
            what the publication would warn of, each with its code. This
            includes the warnings about how the diagram configures its devices
            and networks (see BuilderPublishResult)
          type: array
          items:
            $ref: "#/components/schemas/BuilderIssue"
        errors:
          title: Errors
          description: >-
            why the server would refuse the publication: the refusals that a
            publish answers with 400 (a target name), 409 or 422, each with its
            code, such as `publish.topology.exists` or the issues of
            `publish.blocked`. Refusals about permissions (403, or 404 for a
            draft that the caller may not see), a body that is not a publish
            request (400) and a server failure keep their status.
          type: array
          items:
            $ref: "#/components/schemas/BuilderIssue"
    BuilderPublishChanges:
      title: Builder Publish Changes
      description: >
        what publishing a draft to a target changes, compared with what the
        server stores now. The server sorts every list by name.
      type: object
      properties:
        topology:
          title: Topology
          description: the Topology config
          allOf:
            - $ref: "#/components/schemas/BuilderConfigChange"
        includes:
          title: Includes
          description: the topologies the Topology config includes (`spec.includeTopologies`)
          type: array
          items:
            $ref: "#/components/schemas/BuilderIncludeChange"
        scenarios:
          title: Scenarios
          description: >
            the Scenario configs the document lists, each of which gets the
            topology in its `topology` annotation unless it names it already
          type: array
          items:
            $ref: "#/components/schemas/BuilderScenarioAnnotation"
        images:
          title: Images
          description: >
            the disk images the devices of the stored topology use, compared
            with those the published topology's devices use
            (`hardware.drives[].image`)
          type: array
          items:
            $ref: "#/components/schemas/BuilderImageChange"
        experiment:
          title: Experiment
          description: the Experiment config, for a `topology-experiment` publication only
          allOf:
            - $ref: "#/components/schemas/BuilderConfigChange"
        vlanAliases:
          title: VLAN Aliases
          description: >
            the VLAN aliases of the experiment (`spec.vlans.aliases`), each
            added when the publication creates the experiment. For a
            `topology-experiment`
            publication only. Not present when there is none
          type: array
          items:
            $ref: "#/components/schemas/BuilderVLANAliasChange"
        removedHostPins:
          title: Removed Host Pins
          description: >
            the host pins (`spec.schedules`) that an update of the experiment
            removes, because their VMs are no longer in the topology, sorted
            by hostname. The warning `publish.experiment.pins-removed` names
            them too. Not present when there is none, or when the caller may not
            get the experiment's schedule (`experiments/schedule` `get`): the
            warning then gives only their number
          type: array
          items:
            $ref: "#/components/schemas/BuilderHostPin"
    BuilderConfigChange:
      title: Builder Config Change
      description: What a publication does to one config.
      type: object
      properties:
        name:
          title: Name
          description: the config's name
          example: "water-plant"
          type: string
        action:
          title: Action
          description: >
            `create`, `update`, or `unchanged` when the config already holds
            this publication, so the publication writes nothing to it
          type: string
          enum:
            - create
            - update
            - unchanged
    BuilderIncludeChange:
      title: Builder Include Change
      description: What a publication does to one topology that the Topology config includes.
      type: object
      properties:
        name:
          title: Name
          example: "shared-topology"
          description: included topology
          type: string
        change:
          title: Change
          description: whether the published topology adds the include, removes it, or keeps it
          type: string
          enum:
            - added
            - removed
            - kept
    BuilderScenarioAnnotation:
      title: Builder Scenario Annotation
      description: >-
        What a publication does to the `topology` annotation of one Scenario
        config that the document lists.
      type: object
      properties:
        name:
          title: Name
          example: "plant-ntp"
          description: Scenario config name
          type: string
        change:
          title: Change
          description: >
            `annotate` adds the topology to the `topology` annotation of the
            scenario. `unchanged` names a scenario that already names it
          type: string
          enum:
            - annotate
            - unchanged
    BuilderImageChange:
      title: Builder Image Change
      description: How the use of one disk image changes when the topology is published.
      type: object
      properties:
        name:
          title: Name
          example: "ubuntu.qc2"
          description: the image as the drives name it
          type: string
        change:
          title: Change
          description: whether the published topology adds the image, removes it, or keeps it
          type: string
          enum:
            - added
            - removed
            - kept
        devices:
          title: Devices
          example: [plc-1]
          description: >
            the hostnames of the devices that use the image once published,
            or, for a removed image, of those that used it
          type: array
          items:
            type: string
        onServer:
          title: On Server
          example: true
          description: >
            whether the server has a disk image of that file name, as GET
            /disks lists them. Null when unknown, for one of these causes. The
            caller may not list disks or that file name (whether or not the
            server has it). Or the listing failed, is empty (as it is without
            minimega) or did not end within 10 seconds
          type: boolean
          nullable: true
    BuilderVLANAliasChange:
      title: Builder VLAN Alias Change
      description: How a publication changes the VLAN alias of one network of the experiment.
      type: object
      properties:
        name:
          title: Name
          example: "control"
          description: network name
          type: string
        from:
          title: From
          example: 100
          description: the experiment's alias now, null for none
          type: integer
          nullable: true
        to:
          title: To
          example: 101
          description: the alias the publication writes, null for none
          type: integer
          nullable: true
        change:
          title: Change
          description: how the publication changes the alias
          type: string
          enum:
            - added
            - removed
            - changed
            - kept
    BuilderHostPin:
      title: Builder Host Pin
      description: >
        the host pin of a VM: an entry of the experiment's `spec.schedules`.
        A pin names a node when its hostname is the node's hostname exactly,
        case included
      type: object
      properties:
        hostname:
          title: Hostname
          example: "plc-1"
          description: the VM's hostname
          type: string
        host:
          title: Host
          example: "compute1"
          description: the cluster host that the pin assigns the VM to
          type: string
        renamedTo:
          title: Renamed To
          example: "plc-01"
          description: >
            the device's new hostname, when the diagram renamed the device.
            Not present otherwise
          type: string
    BuilderPublishStage:
      title: Builder Publish Stage
      description: One stage of a publication, such as the write of the topology, and its result.
      type: object
      properties:
        name:
          title: Name
          example: "topology"
          description: document, topology, scenario, experiment or draft
          type: string
        status:
          title: Status
          example: "created"
          description: created, updated, skipped, ok or failed
          type: string
        message:
          title: Message
          description: what the stage did, or why it failed
          example: "created topology water-plant"
          type: string
        config:
          title: Config
          example: "Topology/water-plant"
          description: >
            the config the stage wrote, as `<Kind>/<name>`. The scenario
            stage, which covers every scenario the document lists, names one
            only when the document lists one, and its message says which it
            changed.
          type: string
    BuilderPublishResult:
      title: Builder Publish Result
      description: >-
        The answer of a publication: the result of each stage, the configs it
        wrote, and the draft after it.
      type: object
      properties:
        status:
          title: Status
          description: >-
            `succeeded` when every stage succeeded, `partial` when a stage
            failed after another stage wrote a config. A `partial` result has
            the warning `publish.retry.available` unless the draft changed
            meanwhile, and on the retry the stages that are already done answer
            `skipped`
          type: string
          enum:
            - succeeded
            - partial
        stages:
          title: Stages
          description: the stages of the publication, in the order that the server ran them
          type: array
          items:
            $ref: "#/components/schemas/BuilderPublishStage"
        warnings:
          title: Warnings
          description: >
            what the caller should know of the publication, each with its
            code. Examples are `publish.file.unchanged`,
            `publish.legacy.replaced` and `publish.experiment.pins-removed`
            (see removedHostPins). Another example is
            `publish.retry.available` on a partial publication that the same
            request finishes. They also hold the warnings about how the
            diagram configures its devices and networks, which the editor's
            Diagram checks give too. These are `device.rulesets.ignored`,
            `interface.ruleset.unknown`, `interface.ip.outside-subnet`,
            `network.gateway.unowned` and `network.subnet.overlap`. They also
            include the device settings that phenix's apps do not apply as
            drawn, such as `device.router-os.unsupported` or
            `device.ntp-server.ignored`
          type: array
          items:
            $ref: "#/components/schemas/BuilderIssue"
        errors:
          title: Errors
          description: >
            why a stage of a partial publication failed, each with its code:
            `publish.stage.failed` or `publish.experiment.running`
          type: array
          items:
            $ref: "#/components/schemas/BuilderIssue"
        topology:
          title: Topology
          description: the topology that the publication wrote
          allOf:
            - $ref: "#/components/schemas/BuilderPublishTarget"
        scenario:
          title: Scenario
          description: the scenario of the experiment, when the request named one
          allOf:
            - $ref: "#/components/schemas/BuilderPublishScenario"
        experiment:
          title: Experiment
          description: >-
            the experiment that the publication wrote, for a `topology-
            experiment` publication
          allOf:
            - $ref: "#/components/schemas/BuilderPublishTarget"
        removedHostPins:
          title: Removed Host Pins
          description: >
            the host pins (`spec.schedules`) that the update of the experiment
            removed, because their VMs are no longer in the topology, sorted
            by hostname. Not present when there is none, or when the caller may
            not get the experiment's schedule (`experiments/schedule` `get`).
            The warning `publish.experiment.pins-removed` names them, or gives
            only their number to such a caller
          type: array
          items:
            $ref: "#/components/schemas/BuilderHostPin"
        draft:
          title: Draft
          description: the draft after the publication, which records it
          allOf:
            - $ref: "#/components/schemas/BuilderDraft"
    BuilderSource:
      title: Builder Source
      description: >-
        A config that the Builder can open or offer: a Topology, an Experiment,
        a Scenario or an Image.
      type: object
      properties:
        kind:
          title: Kind
          description: the kind of the config
          example: "Topology"
          type: string
        name:
          title: Name
          description: the name of the config
          example: "water-plant"
          type: string
        fullName:
          title: Full Name
          description: the config as `<Kind>/<name>`
          example: "Topology/water-plant"
          type: string
        apiVersion:
          title: API Version
          description: the API version of the config
          example: "phenix.sandia.gov/v1"
          type: string
        created:
          title: Created
          description: when the config was first stored (RFC 3339). Not present when unknown
          example: "2026-01-01T09:30:00Z"
          type: string
        updated:
          title: Updated
          description: when the config was last written (RFC 3339). Not present when unknown
          example: "2026-01-02T15:04:05Z"
          type: string
        digest:
          title: Digest
          example: "sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"
          description: >
            for a Topology or an Experiment, the digest that a document
            imported from it records as its `source.digest`. The digest covers
            the apiVersion, kind, name and spec of the config, and the
            `builder-xml` diagram of a Topology that has one. Not present for a
            Scenario or an Image
          type: string
        stored:
          title: Stored
          example: true
          description: false for a config generated from uploaded content
          type: boolean
        builder:
          title: Builder
          example: "builder-doc"
          description: >
            the builder annotation the config carries, if any: `builder-doc`
            (Builder) or, on a Topology without it, `builder-xml` (legacy
            Builder diagram)
          type: string
        generatable:
          title: Generatable
          example: true
          description: whether POST /builder/generate accepts this config
          type: boolean
        includeCount:
          title: Include Count
          example: 1
          description: >
            the number of topologies a Topology includes
            (`includeTopologies`). Not present when it includes none, and for
            every other kind. Also not present for a caller without `configs`
            `get` for the config, and in the `source` of a generated document.
          type: integer
          minimum: 1
    BuilderSources:
      title: Builder Sources
      description: >-
        The answer of GET /builder/sources: the configs of each kind that the
        caller may open or offer in the Builder.
      type: object
      properties:
        topologies:
          title: Topologies
          description: the Topology configs
          type: array
          items:
            $ref: "#/components/schemas/BuilderSource"
        experiments:
          title: Experiments
          description: the Experiment configs
          type: array
          items:
            $ref: "#/components/schemas/BuilderSource"
        scenarios:
          title: Scenarios
          description: the Scenario configs
          type: array
          items:
            $ref: "#/components/schemas/BuilderSource"
        images:
          title: Images
          description: the Image configs
          type: array
          items:
            $ref: "#/components/schemas/BuilderSource"
    BuilderGenerateRequest:
      title: Builder Generate Request
      description: exactly one of `source` and `content`
      type: object
      additionalProperties: false
      properties:
        source:
          title: Source
          example: "Topology/water-plant"
          description: a stored Topology or Experiment config, as `<Kind>/<name>`
          type: string
        content:
          title: Content
          example: |
            apiVersion: phenix.sandia.gov/v1
            kind: Topology
          description: a Topology or Experiment config as JSON or YAML text
          type: string
        includes:
          title: Includes
          description: >
            what happens to the nodes of the topologies that a Topology
            includes. `keep` (the default, also when not present or empty)
            shows them read only. `combine` copies them into the document and
            makes it a new topology. The server refuses `combine` for an
            Experiment (422), and another value gets 400.

            The server reads the included topologies from the config store with
            the permissions of the caller, never from a file. With `keep`, their
            nodes are marked `includedFrom`, and `source.unresolvedIncludes`
            lists the includes that the server could not read. With `combine`,
            only those includes stay in `source.includeTopologies`.
          type: string
          enum:
            - keep
            - combine
        copy:
          title: Copy
          description: >
            make the document a copy that is not linked to the Topology that
            it is generated from. `includes` `combine` implies it. The copy gets
            the diagram note `Copied from <name>` in `metadata.notes`, where
            `<name>` is the name in the metadata of the source config. The
            server refuses it for an Experiment (422).

            A combined document and a copy name no config. Their `source.kind`
            is `manual`, so a draft made from them publishes a new topology and
            never updates the source. The `source` of the response is still the
            config that the server read.
          type: boolean
          default: false
        name:
          title: Name
          example: "water-plant-copy"
          description: >
            the name of the new topology, and of the document. The server
            accepts it only with `copy` or `includes` `combine` (400
            otherwise). When empty, the source's name with `-combined` (for
            `combine`) or `-copy` added, and the server does not search for a
            free name. A name that is not a config name of 1 to 512 bytes gets
            422 (`import.name.invalid`), and the name of the stored Topology
            that the request imports gets 422 (`import.name.source`).
          type: string
          maxLength: 512
          pattern: "^[A-Za-z0-9_@.-]*$"
    BuilderGenerateResult:
      title: Builder Generate Result
      description: >-
        A Builder document that the server made from a config or a legacy
        diagram, with what it changed.
      type: object
      properties:
        document:
          title: Document
          description: >-
            the Builder document. Its device nodes keep the order of the nodes
            of the config, then the nodes of each included topology in the order
            phenix merges them, and a publish writes them in that order. From an
            Experiment, each node spec loses what phenix added to it: a
            `bridge_set_in_topo`, a bridge set to the default bridge, each field
            that phenix reads as unset, and each value equal to the phenix
            default, such as `vm_type` `kvm`. A nullable field such as
            `snapshot` keeps an explicit 0 or false, and `os_type` and the
            required fields stay.

            The `scenario` annotation of an Experiment becomes the `scenarios`
            of the document only when this server stores a Scenario config of
            that name and the caller may list it (`configs` `list` and
            `scenarios` `list`). Otherwise a warning says that the document
            lists no scenario. For uploaded content, a listed scenario adds a
            warning that it is the Scenario config of this server, not the copy
            in the file.
          allOf:
            - $ref: "#/components/schemas/BuilderDocument"
        warnings:
          title: Warnings
          description: what the document omitted or changed
          type: array
          items:
            type: string
        source:
          title: Source
          description: >
            the config the document was made from. POST /builder/legacy
            omits it for a diagram that came without a Topology.
          allOf:
            - $ref: "#/components/schemas/BuilderSource"
    BuilderLegacyRequest:
      title: Builder Legacy Request
      description: >-
        The body of POST /builder/legacy: a legacy Builder diagram to convert to
        a Builder document.
      type: object
      additionalProperties: false
      required:
        - content
      properties:
        content:
          title: Content
          example: "<mxGraphModel><root></root></mxGraphModel>"
          description: >
            the text of a legacy Builder diagram file: mxGraph XML whose root
            element is `mxGraphModel` or `root`, or a Topology config as YAML
            or JSON that has the `builder-xml` annotation. The server reads no
            encoded or compressed XML.

            At most 5242880 bytes, with XML that nests at most 32 elements deep
            and holds at most 10000 cells, and no DOCTYPE or other declaration.
            A refusal repeats nothing of the content but the name and kind of a
            config, or the name of the root element of the XML
          type: string
        name:
          title: Name
          example: "legacy-diagram"
          description: >-
            the name of the document of a diagram that has no Topology
            (`legacy-diagram` when absent or blank), at most 512 bytes with no
            control characters. A Topology uses its own name
          type: string
    BuilderTopologyExportRequest:
      title: Builder Topology Export Request
      description: >-
        The body of POST /builder/export/topology: the document to export as a
        Topology config.
      type: object
      additionalProperties: false
      properties:
        document:
          title: Document
          description: the document to export
          allOf:
            - $ref: "#/components/schemas/BuilderDocument"
        name:
          title: Name
          example: "water-plant"
          description: >-
            the name of the topology. When empty, the server uses the document
            name with `-` in place of each run of characters that a config name
            may not hold, or `topology` if no characters are left
          type: string
      required:
        - document
    BuilderTopologyExport:
      title: Builder Topology Export
      description: >-
        The Topology config that a document publishes, as YAML, with the
        warnings and the publish blockers.
      type: object
      properties:
        name:
          title: Name
          example: "water-plant"
          description: the topology's name
          type: string
        yaml:
          title: YAML
          example: |
            apiVersion: phenix.sandia.gov/v1
            kind: Topology
          description: >
            the Topology config, as YAML that loads back as the config. The
            server writes a string that the YAML block style would change,
            such as one that starts with a line break, in double quotes
          type: string
        warnings:
          title: Warnings
          description: >
            what the projection omitted or changed, and the warnings about
            how the diagram configures its devices and networks (see
            BuilderPublishResult), each with its code
          type: array
          items:
            $ref: "#/components/schemas/BuilderIssue"
        publishBlockers:
          title: Publish Blockers
          description: >
            why the server would refuse a publish of the topology, although
            the phenix config validation accepts it. There is one issue per
            check, in the order that a publish makes the checks. First come
            interfaces without a VLAN, then addresses that interfaces share.
            Then come hostnames that phenix refuses when it creates an
            experiment, then device settings that make the experiment fail to
            start. The 422 message of a publish
            names the first. Each issue says what that message says about its
            check, and has the code of the first problem of the check. When the
            check has one problem, the issue also has its location.
          type: array
          items:
            $ref: "#/components/schemas/BuilderIssue"
    BuilderPackageRequest:
      title: Builder Package Request
      description: >-
        The body of POST /builder/package: the document to package and the
        sections to include.
      type: object
      additionalProperties: false
      properties:
        document:
          title: Document
          description: the document to package
          allOf:
            - $ref: "#/components/schemas/BuilderDocument"
        include:
          title: Include
          description: >-
            the sections that the package carries, each at most once:
            `scenarios` (the Scenario configs that the document names),
            `topologies` (the topologies that it includes), `icons` (a copy of
            each custom icon that it names) and `images` (the disk images of
            the devices and their hosts, in the requirements)
          type: array
          items:
            type: string
            enum:
              - scenarios
              - topologies
              - icons
              - images
      required:
        - document
    BuilderPackageResult:
      title: Builder Package Result
      description: >-
        The answer of POST /builder/package: the package and what it does not
        carry.
      type: object
      properties:
        package:
          title: Package
          description: >
            the package, as `GET /schemas/builder/package/v1` describes it,
            ready for a client to save as a JSON or YAML file. `POST
            /builder/package/resolve` always accepts it. Whatever the package
            carries, its requirements list the scenarios, included topologies,
            templates and custom icons of the document, and the apps of the
            scenarios that the server could read. They also list the files that
            the devices and the packaged configs name (injection sources, app
            asset directories). The `icons` section copies each custom icon from
            the icon library
          type: object
          additionalProperties: true
        warnings:
          title: Warnings
          description: >
            what the package names but does not carry, or omits from its
            requirements, and why, each with its code. A config that does not
            exist, or that the caller may not read, is a requirement but not in
            the package, with the same warning for both
            (`package.config.unreadable`). An entry that the package format
            refuses is not in the requirements (`package.requirement.left-out`
            or `package.requirements.truncated`): blank, longer than 4096 bytes,
            with control characters, or after the first 1000 of its list. Other
            codes are `package.include.file-path`, `package.icon.missing` and
            `package.icons.too-many`
          type: array
          items:
            $ref: "#/components/schemas/BuilderIssue"
    BuilderPackageDependencies:
      title: Builder Package Dependencies
      description: >-
        The answer of POST /builder/package/resolve: whether the server has each
        requirement of a package.
      type: object
      properties:
        dependencies:
          title: Dependencies
          description: >
            one entry per entry of the package's requirements, by kind in the
            order scenario, topology, template, icon, image, app, file
          type: array
          items:
            title: Package Dependency
            description: One requirement of the package, and whether the server has it.
            type: object
            properties:
              kind:
                title: Kind
                description: the kind of the requirement
                type: string
                enum:
                  - scenario
                  - topology
                  - template
                  - icon
                  - image
                  - app
                  - file
              name:
                title: Name
                example: "ubuntu.qc2"
                description: the name or path, as the requirements give it
                type: string
              status:
                title: Status
                description: >-
                  `present` when the server has it as the package needs it,
                  `missing` when it does not have it, `different` when it has
                  another version, and `unknown` when the server cannot tell. A
                  Scenario or Topology config is `present` when the server has
                  one of that name with the spec of the package, or the package
                  carries no spec. It is `unknown` when the caller may not read
                  it (`configs` `get`, and `scenarios` or `topologies` `list`),
                  so the answer does not disclose whether it exists. A custom
                  icon compares by its bytes the same way, under `configs`
                  `list`.

                  The server looks for a disk image among the images that `GET
                  /disks` lists for the caller, so an image that the caller may
                  not see is `missing`. A drive matches by the name or full path
                  of the image, else by its file name, which `detail` then
                  tells. Images and apps are `unknown` without `disks` `list` or
                  `applications` `list`, or when the server cannot list the
                  images. Templates are always `present`, and files are always
                  `unknown`
                type: string
                enum:
                  - present
                  - missing
                  - different
                  - unknown
              packaged:
                title: Packaged
                example: false
                description: whether the package carries it
                type: boolean
              detail:
                title: Detail
                example: "used by plc-1 and plc-2"
                description: >
                  why the status is what it is, such as the devices that use
                  a disk image, when that needs saying
                type: string
    BuilderPreflightCheckName:
      title: Builder Preflight Check Name
      description: >-
        a preflight check. `capacity` compares the vCPUs and memory of the
        devices that phenix starts (all but external devices) with the free CPUs
        and memory of the schedulable cluster hosts, and checks that each device
        fits on one host. A device uses `hardware.vcpus` and `hardware.memory`,
        or 1 and 512 MB when it does not set them. `network` compares the VLANs
        of the devices and the aliases of the networks with the VLAN range of
        the named `experiment` (none without one) and with the VLANs that
        running experiments hold. It also compares the bridges of the
        interfaces, and the default bridge of the experiment (else `phenix`),
        with the Open vSwitch bridges of the schedulable hosts, which it lists
        with `ovs-vsctl list-br` through the minimega `shell` command.

        `disks` finds each drive image by file name among the disk images of the
        server, and checks that a kvm device has a VM or ISO image and a
        container has a container image. `apps` finds each app that a listed
        Scenario does not disable among the default, built-in and user apps. A
        listed scenario that does not exist is the error
        `preflight.app.scenario-missing`.
      type: string
      enum:
        - capacity
        - network
        - disks
        - apps
    BuilderPreflightRequest:
      title: Builder Preflight Request
      description: >-
        The body of POST /builder/drafts/{draft}/preflight: the checks to make.
      type: object
      additionalProperties: false
      properties:
        checks:
          title: Checks
          description: the checks to make, in the order of the report. Each at most once
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/BuilderPreflightCheckName"
          example:
            - disks
            - apps
        experiment:
          title: Experiment
          description: >
            the experiment whose VLAN range and default bridge the network
            check uses. Empty or not present for none
          type: string
          example: lab-exp
      required:
        - checks
    BuilderPreflightResult:
      title: Builder Preflight Result
      description: The result of one preflight check.
      type: object
      properties:
        name:
          title: Name
          description: the check
          allOf:
            - $ref: "#/components/schemas/BuilderPreflightCheckName"
        status:
          title: Status
          description: >-
            `failed` when an issue is an error, `unavailable` when nothing
            failed but the server could not make the check or a part of it,
            else `passed`. Warnings can be among the issues of any status.

            The causes of `unavailable` are: the role does not have `hosts`
            `list` (capacity and bridges), `disks` `list`, `applications`
            `list` or `experiments` `list` (VLANs in use), or read access to
            the experiment (`configs` `get` and `experiments` `get`) or a
            scenario (`configs` `get` and `scenarios` `list`). Also, the server
            cannot reach minimega, lists no disk images within 10 seconds, or
            the check takes more than 20 seconds. An issue tells why, with the
            code `preflight.unavailable`, or the warning
            `preflight.app.scenario-unreadable` for a scenario
          type: string
          enum:
            - passed
            - failed
            - unavailable
        summary:
          title: Summary
          description: what the check compared, in one line, and what it could not check
          type: string
          example: "Found: 3 of 3 drive images, among the server's 12 disk images."
        issues:
          title: Issues
          description: >
            what the check found, each with its `preflight.` code and, when it
            is about one, the device, network and field
          type: array
          items:
            $ref: "#/components/schemas/BuilderIssue"
    BuilderPreflightReport:
      title: Builder Preflight Report
      description: >-
        The answer of a preflight: the result of each check, and the checks by
        result.
      type: object
      properties:
        checks:
          title: Checks
          description: the result of each check asked for, in the request's order
          type: array
          items:
            $ref: "#/components/schemas/BuilderPreflightResult"
        passed:
          title: Passed
          description: the checks that passed, in the request's order
          type: array
          items:
            $ref: "#/components/schemas/BuilderPreflightCheckName"
        failed:
          title: Failed
          description: the checks that failed, in the request's order
          type: array
          items:
            $ref: "#/components/schemas/BuilderPreflightCheckName"
        unavailable:
          title: Unavailable
          description: the checks that the server could not make, in the request's order
          type: array
          items:
            $ref: "#/components/schemas/BuilderPreflightCheckName"
    BuilderPublishedDocument:
      title: Builder Published Document
      description: >
        The Builder document that a config references. It is a stored
        published document that Publish stored (`source` `store`). Or it is
        the Builder file that a topology's `builder-doc` annotation names
        (`source` `file`). A file has no `id`,
        `draftId`, `snapshotId`, `createdAt` or `createdBy`. In a listing a
        file also has no `digest` and no `size`, since a listing reads no
        file.
      type: object
      properties:
        source:
          title: Source
          description: where the server keeps the document
          type: string
          enum:
            - store
            - file
        id:
          title: ID
          example: "7f010dcd-e23d-514c-9206-3609df999026"
          description: stored documents only
          type: string
        digest:
          title: Digest
          example: "sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"
          description: digest of the document's canonical JSON, not of a file's bytes
          type: string
        size:
          title: Size
          example: 4096
          description: size of the document's canonical JSON, in bytes
          type: integer
        target:
          title: Target
          example: "water-plant"
          description: name of the config that references the document
          type: string
        kind:
          title: Kind
          description: the kind of the config that references the document
          example: "Topology"
          type: string
        config:
          title: Config
          example: "Topology/water-plant"
          description: the config that references the document, as `<Kind>/<name>`
          type: string
        path:
          title: Path
          example: "/phenix/topologies/water-plant.builder.json"
          description: files only. The path of the Builder file on the phenix server
          type: string
        draftId:
          title: Draft ID
          example: "6f1c8a52-3d2e-4b7a-9c1d-2e5f7a9b0c13"
          description: >
            stored documents only. The draft that first published the
            document.
          type: string
        snapshotId:
          title: Snapshot ID
          example: "0b6e2c1d-8f4a-4e3b-a5c7-1d2e3f4a5b6c"
          description: >-
            for a stored document only, the snapshot of that draft. Absent when
            `draftId` is absent
          type: string
        createdAt:
          title: Created At
          example: "2026-01-02T15:04:05Z"
          description: stored documents only. The time of the first publish of the document
          type: string
          format: date-time
        createdBy:
          title: Created By
          example: "alice"
          description: >
            stored documents only. The user who first published the document.
          type: string
        etag:
          title: ETag
          example: "\"0f3a9c2b7d1e4f6a8b5c3d2e1f0a9b8c\""
          description: >
            stored documents only. The entity tag that DELETE
            /builder/documents/{document} must name in If-Match. It covers the
            document and all that the topology holds, so a publish or any
            other change of the topology gives a new one.
          type: string
        topologyDiffers:
          title: Topology Differs
          example: false
          description: >
            files only, in GET /builder/topologies/{topology}/document. True
            when the stored topology is not what the document publishes. Then
            a draft opened from the file cannot update the topology
          type: boolean
        experiment:
          title: Experiment
          example: "water-plant-exp"
          description: >
            name of an experiment that the publication of this document made,
            when it still exists and the caller holds `experiments` `get` for
            it. Only on rows of GET /builder/documents with `source` `store`.
          type: string
        document:
          title: Document
          description: the document (GET of one document only)
          allOf:
            - $ref: "#/components/schemas/BuilderDocument"
      required:
        - source
        - target
        - kind
        - config
    BuilderPublishedDocuments:
      title: Builder Published Documents
      description: >-
        The answer of GET /builder/documents: the published Builder documents
        that configs reference.
      type: object
      properties:
        documents:
          title: Documents
          description: the published documents, each as a config references it
          type: array
          items:
            $ref: "#/components/schemas/BuilderPublishedDocument"
    BuilderIconUpload:
      title: Builder Icon Upload
      description: >-
        The body of POST /builder/icons: a new custom icon and its name.
      type: object
      additionalProperties: false
      required:
        - name
        - data
      properties:
        name:
          title: Name
          example: "plc-blue"
          description: >-
            the name that nodes and templates use for the icon. It is not `.`
            or `..`, and no icon or alias has it, ignoring case
          type: string
          pattern: "^[A-Za-z0-9_@.-]{1,64}$"
        data:
          title: Data
          example: "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGNgYGD4DwABBAEAwS2OUAAAAABJRU5ErkJggg=="
          description: >
            a PNG of at most 96 by 96 pixels and 65536 bytes, in standard
            base64 with padding and without line breaks
          type: string
    BuilderIconRename:
      title: Builder Icon Rename
      description: >-
        The body of PUT /builder/icons/{icon}: the new name of an icon.
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          title: Name
          example: "plc-blue"
          description: >
            the new name of the icon, by the rules for the name of a new icon.
            The old name becomes an alias
          type: string
          pattern: "^[A-Za-z0-9_@.-]{1,64}$"
    BuilderIconSummary:
      title: Builder Icon Summary
      description: >
        an icon of the library without its image, as the list gives it
      type: object
      properties:
        name:
          title: Name
          example: "plc-blue"
          description: >
            the icon's name now. It is the key of the icon in a Builder
            document's `icons`, and what a node's or template's `icon` names.
          type: string
        id:
          title: ID
          example: "sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"
          description: >
            `sha256:` and the SHA-256 of the stored PNG, as 64 lowercase hex
            digits: two icons hold the same image exactly when their IDs are
            equal.
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        owner:
          title: Owner
          example: "alice"
          description: >
            the user who uploaded the icon. Empty for an icon that phenix
            added from a template file of its template directory, which no
            user owns, renames or deletes
          type: string
        width:
          title: Width
          example: 64
          description: width in pixels, 1 to 96
          type: integer
        height:
          title: Height
          example: 64
          description: height in pixels, 1 to 96
          type: integer
        bytes:
          title: Bytes
          example: 2048
          description: length of the stored PNG, at most 40960
          type: integer
        created:
          title: Created
          example: "2026-01-01T09:30:00Z"
          description: when the icon was uploaded
          type: string
          format: date-time
        updated:
          title: Updated
          example: "2026-01-02T15:04:05Z"
          description: when the icon was last renamed, or uploaded
          type: string
          format: date-time
        createdBy:
          title: Created By
          example: "alice"
          description: >
            the user who uploaded the icon. Not present for an icon that phenix
            added from a template file
          type: string
        updatedBy:
          title: Updated By
          example: "alice"
          description: >
            the user who last renamed the icon, or uploaded it. Not present for
            an icon that phenix added from a template file
          type: string
        aliases:
          title: Aliases
          description: >
            the names the icon had before its renames, oldest first, each of
            which still names it
          type: array
          items:
            type: string
        canRename:
          title: Can Rename
          example: true
          description: >
            whether a caller may rename the icon: false only for an icon that
            phenix
            added from a template file
          type: boolean
        canDelete:
          title: Can Delete
          example: true
          description: >
            whether a caller may delete the icon: false only for an icon that
            phenix
            added from a template file
          type: boolean
        revision:
          title: Revision
          example: 12
          description: >
            the revision of the icon's record. Each rename gives the icon a
            new one
          type: integer
        etag:
          title: ETag
          example: "\"12\""
          description: >
            the entity tag of the revision, `"<revision>"`, which DELETE
            /builder/icons/{icon} must name in If-Match
          type: string
    BuilderIcon:
      title: Builder Icon
      description: an icon of the library with its image
      allOf:
        - $ref: "#/components/schemas/BuilderIconSummary"
        - type: object
          properties:
            data:
              title: Data
              example: "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGNgYGD4DwABBAEAwS2OUAAAAABJRU5ErkJggg=="
              description: >
                the stored PNG in standard base64 with padding, which may
                differ from what the client sent
              type: string
    BuilderIconList:
      title: Builder Icon List
      description: >-
        The answer of GET /builder/icons: the icons of the library and its
        limit.
      type: object
      properties:
        icons:
          title: Icons
          description: >
            every icon of the library, sorted by name without regard to case,
            without its image
          type: array
          items:
            $ref: "#/components/schemas/BuilderIconSummary"
        maxIcons:
          title: Max Icons
          example: 2000
          description: the most icons the library holds, of all users together
          type: integer
        etag:
          title: ETag
          example: "\"5d41402abc4b2a76b9719d911017c592\""
          description: >
            the entity tag of the list, as the ETag header gives it. A request
            that names it in If-None-Match gets 304 while the list is the same
          type: string
    BuilderLayer:
      title: Builder Layer
      type: object
      description: >
        a layer of a diagram or of a layer set. The rules are those of
        `GET /schemas/builder/v1` (`$defs.layer`)
      additionalProperties: false
      required:
        - id
        - label
      properties:
        id:
          title: ID
          example: 1
          description: an integer from 0 to 99 that no other layer of the list has
          type: integer
          minimum: 0
          maximum: 99
        label:
          title: Label
          example: "Field devices"
          description: not blank, at most 64 bytes, with no control characters
          type: string
          minLength: 1
          maxLength: 64
        iconKey:
          title: Icon Key
          example: "plc"
          description: >
            a built-in icon that the editor shows to the left of the label.
            Empty or not present for none
          type: string
        icon:
          title: Icon
          example: "plant"
          description: >
            a custom icon name that the editor shows in place of `iconKey`.
            Empty or not present for none
          type: string
        color:
          title: Color
          example: "#15803d"
          description: >-
            the color of the layer, `#rrggbb`, for the label when the contrast
            is sufficient and for node outlines when the layer set's
            `layerOutlines` is true
          type: string
          pattern: "^(#[0-9a-fA-F]{6})?$"
        matchers:
          title: Matchers
          description: >
            at most 16 node matchers. Each key is a path of keys joined by dots
            into the spec of a device (at most 128 bytes, such as
            `general.hostname` or `network.interfaces.0.vlan`). Each value is a
            regular expression of 1 to 256 bytes. It must compile in Go (RE2)
            and in JavaScript. It must not repeat a group that has a repeat or
            a `|` in it more than once, such as `(a+)+`. It must have at most
            3 `*`, `+` or `{n,}` repeats. The editor
            puts a device that has no layer selected in a layer whose matcher
            matches it
          type: object
          maxProperties: 16
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 256
    BuilderDocumentLayerSet:
      title: Builder Document Layer Set
      type: object
      description: >
        the options of the layer set that a diagram copied its layers from.
        It also names the layer set of the server that the layers link to
      additionalProperties: false
      properties:
        name:
          title: Name
          example: "Plant levels"
          description: >
            the name of the layer set, at most 128 bytes. Empty for layers that
            no layer set gave
          type: string
          maxLength: 128
        matchConflict:
          title: Match Conflict
          description: >
            the layer that a device gets when the node matchers of more than
            one layer match it. Empty is `lowest`
          type: string
          enum:
            - ""
            - lowest
            - highest
        layerOutlines:
          title: Layer Outlines
          example: false
          description: >
            when true, the editor draws the outline of a node in the color of
            its layer, unless the node has its own outline color
          type: boolean
        source:
          title: Source
          description: >
            the layer set and the version that the layers were last copied
            from or saved to. Not present when the layers link to no set
          type: object
          additionalProperties: false
          required:
            - id
            - version
          properties:
            id:
              title: ID
              description: the ID of the layer set
              example: "builtin:purdue"
              type: string
              pattern: "^[A-Za-z0-9_.:-]{1,128}$"
            version:
              title: Version
              description: the version of the layer set
              example: 1
              type: integer
              minimum: 1
    BuilderLayerSetContent:
      title: Builder Layer Set Content
      type: object
      description: >-
        The content of a layer set that a request adds or replaces, with no
        unknown fields. A layer set file holds the same fields, with `$schema`
        and `icons` (`GET /schemas/builder/layersets/v1`).
      additionalProperties: false
      required:
        - name
        - layers
      properties:
        name:
          title: Name
          description: not blank, at most 128 bytes, with no control characters
          type: string
          minLength: 1
          maxLength: 128
          example: Plant levels
        description:
          title: Description
          description: at most 1024 bytes, with no control characters
          type: string
          maxLength: 1024
          example: Levels of the water plant network.
        iconKey:
          title: Icon Key
          description: the built-in icon of the set. Empty for none
          type: string
          example: plc
        icon:
          title: Icon
          example: "plant"
          description: a custom icon name, shown in place of `iconKey`. Empty for none
          type: string
        matchConflict:
          title: Match Conflict
          description: >
            the layer that a device gets when the node matchers of more than
            one layer match it: the lowest ID or the highest ID. Empty is
            `lowest`
          type: string
          enum:
            - ""
            - lowest
            - highest
          example: lowest
        layerOutlines:
          title: Layer Outlines
          description: >
            when true, the editor draws the outline of a node in the color of
            its layer, unless the node has its own outline color
          type: boolean
          example: false
        layers:
          title: Layers
          description: 1 to 32 layers, each with an ID that no other layer has
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: "#/components/schemas/BuilderLayer"
          example:
            - id: 2
              label: Supervisory control
              iconKey: desktop
              color: "#15803d"
              matchers:
                general.hostname: ^(hmi|scada)-
            - id: 1
              label: Field devices
    BuilderLayerSet:
      title: Builder Layer Set
      description: >-
        A layer set of the server: a named list of layers that a diagram can
        copy.
      type: object
      properties:
        id:
          title: ID
          description: >-
            the ID of the set: `builtin:<name>` for a built-in set, else an ID
            from the server
          type: string
          example: builtin:purdue
        name:
          title: Name
          description: the name of the set
          example: "Plant levels"
          type: string
        description:
          title: Description
          description: the text of the set
          example: "Levels of the water plant network."
          type: string
        iconKey:
          title: Icon Key
          description: the built-in icon of the set. Empty for none
          example: "plc"
          type: string
        icon:
          title: Icon
          description: a custom icon name, shown in place of `iconKey`. Empty for none
          example: "plant"
          type: string
        matchConflict:
          title: Match Conflict
          description: "`lowest` or `highest`. Never empty"
          type: string
          enum:
            - lowest
            - highest
        layerOutlines:
          title: Layer Outlines
          description: when true, the editor draws the outline of a node in the color of its layer
          example: false
          type: boolean
        layers:
          title: Layers
          description: the layers of the set
          type: array
          items:
            $ref: "#/components/schemas/BuilderLayer"
        builtin:
          title: Builtin
          example: false
          description: >-
            true for a set that every server has, which nobody can change or
            delete. Duplicate it to change it
          type: boolean
        version:
          title: Version
          example: 2
          description: >
            starts at 1 and grows by one with every change of the content.
            Always 1 for a built-in set
          type: integer
        etag:
          title: ETag
          example: "\"2\""
          description: the entity tag of the content, `"<version>"`, for If-Match
          type: string
        created:
          title: Created
          example: "2026-01-01T09:30:00Z"
          description: not present for a built-in set
          type: string
          format: date-time
        updated:
          title: Updated
          example: "2026-01-02T15:04:05Z"
          description: when the content last changed. Not present for a built-in set
          type: string
          format: date-time
        createdBy:
          title: Created By
          example: "alice"
          description: the user who added the set. Not present for a built-in set
          type: string
        updatedBy:
          title: Updated By
          example: "alice"
          description: >
            the user who last changed the content. Not present for a built-in set
          type: string
    BuilderLayerSetList:
      title: Builder Layer Set List
      description: >-
        The answer of GET /builder/layersets: the layer sets, the default set
        and the limits.
      type: object
      properties:
        layerSets:
          title: Layer Sets
          description: the built-in sets, then the other sets of the server
          type: array
          items:
            $ref: "#/components/schemas/BuilderLayerSet"
        defaultId:
          title: Default ID
          example: "builtin:purdue"
          description: the default set of the server for new diagrams, or null
          type: string
          nullable: true
        defaultEtag:
          title: Default ETag
          description: >
            the entity tag of the default selection, which PUT
            /builder/layersets/default names in If-Match
          type: string
          example: '"0"'
        damaged:
          title: Damaged
          example: 0
          description: >
            how many records the server cannot read. The list does not show them
          type: integer
        limits:
          title: Limits
          description: what the library and one set may hold
          allOf:
            - $ref: "#/components/schemas/BuilderLayerSetLimits"
    BuilderLayerSetLimits:
      title: Builder Layer Set Limits
      type: object
      description: what the library and one set may hold
      properties:
        layerSets:
          title: Layer Sets
          description: the most sets the library holds, apart from the built-in sets
          type: integer
          example: 200
        layers:
          title: Layers
          description: the most layers of one set
          type: integer
          example: 32
        nameBytes:
          title: Name Bytes
          description: the most bytes of the name of a set
          type: integer
          example: 128
        descriptionBytes:
          title: Description Bytes
          description: the most bytes of the description of a set
          type: integer
          example: 1024
        labelBytes:
          title: Label Bytes
          description: the most bytes of the label of a layer
          type: integer
          example: 64
        matchers:
          title: Matchers
          description: the most node matchers of one layer
          type: integer
          example: 16
        matcherPathBytes:
          title: Matcher Path Bytes
          description: the most bytes of the path of a node matcher
          type: integer
          example: 128
        patternBytes:
          title: Pattern Bytes
          description: the most bytes of the pattern of a node matcher
          type: integer
          example: 256
    BuilderLayerSetDefault:
      title: Builder Layer Set Default
      description: >-
        The body of PUT /builder/layersets/default: the layer set that new
        diagrams get.
      type: object
      additionalProperties: false
      properties:
        id:
          title: ID
          description: the ID of a layer set, or null or an empty string for none
          type: string
          nullable: true
          example: builtin:purdue
    BuilderLayerSetDefaultSelection:
      title: Builder Layer Set Default Selection
      description: >-
        The default layer set of the server for new diagrams, with the entity
        tag of the selection.
      type: object
      properties:
        id:
          title: ID
          description: the ID of a layer set, or null for none
          type: string
          nullable: true
          example: builtin:purdue
        etag:
          title: ETag
          description: >
            the entity tag of the selection: `"<revision>"` of its record, or
            `"0"` when the server never stored a selection
          type: string
          example: '"0"'
    BuilderTemplateDevice:
      title: Builder Template Device
      description: >
        What a template sets: every field of a device node except its
        hostname, its connection points and where it was included from. The
        editor names a device made from the template after
        `spec.general.hostname`, and makes that name unique in the diagram.
      type: object
      required:
        - spec
      properties:
        iconKey:
          title: Icon Key
          example: "plc"
          description: one of the Builder's icon keys
          type: string
        icon:
          title: Icon
          example: "plc-blue"
          description: >
            the name of a custom icon of the icon library, drawn in place of
            `iconKey` while the library has an icon of that name
          type: string
          pattern: "^[A-Za-z0-9_@.-]{1,64}$"
        iconSize:
          title: Icon Size
          description: >
            the size of the icon of a device made from the template, on the
            canvas: small (16 pixels), medium (24) or large (32). Empty uses
            the `iconSize` of the diagram
          type: string
          enum:
            - ""
            - small
            - medium
            - large
        outlineColor:
          title: Outline Color
          description: the outline color of a device made from the template, `#rrggbb`
          example: "#1d4ed8"
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        fillColor:
          title: Fill Color
          description: the fill color of a device made from the template, `#rrggbb`
          example: "#dbeafe"
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        hideDescription:
          title: Hide Description
          example: false
          description: >
            true hides the description of a device made from the template on
            the canvas
          type: boolean
        layer:
          title: Layer
          example: 1
          description: >
            the ID of the layer of a device made from the template, an
            integer from 0 to 99. A diagram need not define the layer.
          type: integer
          minimum: 0
          maximum: 99
        spec:
          title: Spec
          description: >-
            a complete phenix node spec, as a device node holds it, with a
            `general.hostname` that has no white space. It takes at most 16384
            bytes as JSON with the other fields, and the server does not check
            it against the phenix node schema
          type: object
          additionalProperties: true
    BuilderTemplate:
      title: Builder Template
      description: >-
        A device template: what a device made from it gets.
      type: object
      properties:
        id:
          title: ID
          example: "6f1c8a52-3d2e-4b7a-9c1d-2e5f7a9b0c13"
          description: >-
            unique among the templates of its source: a UUID in the library and
            a short name for a built-in template. The ID of a template from a
            template file starts with `server-`, comes from the file and
            template names, and is the same at every start
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
        source:
          title: Source
          description: >
            `library` for a template of the template library of the server.
            `builtin` for a built-in template. `preloaded` for a template that
            the server read from a template file. A diagram's copy of the
            template names this value as its `source.kind`
          type: string
          enum:
            - library
            - builtin
            - preloaded
        name:
          title: Name
          description: the name of the template
          example: "PLC"
          type: string
        description:
          title: Description
          example: "A programmable logic controller."
          description: >
            the text of the template, which the editor shows where it lists
            templates. The editor never writes it into a node
          type: string
        device:
          title: Device
          description: what a device made from the template gets
          allOf:
            - $ref: "#/components/schemas/BuilderTemplateDevice"
        version:
          title: Version
          example: 3
          description: >
            starts at 1 and grows by one with every change of the name, the
            description or the device. Always 1 for a read-only template
          type: integer
        etag:
          title: ETag
          example: "\"3\""
          description: the entity tag of the content, `"<version>"`, for If-Match
          type: string
        created:
          title: Created
          example: "2026-01-01T09:30:00Z"
          description: not present for a read-only template
          type: string
          format: date-time
        updated:
          title: Updated
          example: "2026-01-02T15:04:05Z"
          description: when the content last changed. Not present for a read-only template
          type: string
          format: date-time
        createdBy:
          title: Created By
          example: "alice"
          description: the user who added the template. Not present for a read-only template
          type: string
        updatedBy:
          title: Updated By
          example: "alice"
          description: >
            the user who last changed the name, the description or the device.
            Not present for a read-only template
          type: string
        collections:
          title: Collections
          description: the IDs of the collections of the same source that hold the template
          type: array
          items:
            type: string
    BuilderTemplateCollection:
      title: Builder Template Collection
      description: A named list of templates of the same source.
      type: object
      properties:
        id:
          title: ID
          example: "6f1c8a52-3d2e-4b7a-9c1d-2e5f7a9b0c13"
          description: >
            unique among the collections of the library. For a collection that
            the server read from a template file, `server-` and a digest of
            the file name
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
        source:
          title: Source
          description: >
            `library` for a collection of the template library of the server.
            `preloaded` for a collection that the server read from a template
            file
          type: string
          enum:
            - library
            - preloaded
        name:
          title: Name
          description: the name of the collection
          example: "Plant devices"
          type: string
        description:
          title: Description
          description: the text of the collection
          example: "The devices of the water plant."
          type: string
        templateIds:
          title: Template IDs
          description: the templates of the collection, in the order given
          type: array
          items:
            type: string
        version:
          title: Version
          example: 3
          description: >
            starts at 1. Increases by one with every change of the name, the
            description or the templates, also when a caller deletes a
            template of the collection
          type: integer
        etag:
          title: ETag
          example: "\"3\""
          description: the entity tag of the content, `"<version>"`, for If-Match
          type: string
        created:
          title: Created
          example: "2026-01-01T09:30:00Z"
          description: not present for a collection from a template file
          type: string
          format: date-time
        updated:
          title: Updated
          example: "2026-01-02T15:04:05Z"
          description: >-
            when the content last changed. Not present for a collection from a
            template file
          type: string
          format: date-time
        createdBy:
          title: Created By
          example: "alice"
          description: the user who added the collection. Not present for a collection from a template file
          type: string
        updatedBy:
          title: Updated By
          example: "alice"
          description: >
            the user who last changed the name, the description or the
            templates. Not present for a collection from a template file
          type: string
    BuilderTemplateLibrary:
      title: Builder Template Library
      description: >-
        The answer of GET /builder/templates: the templates and collections of
        every source, and the limits.
      type: object
      properties:
        templates:
          title: Templates
          description: the templates of the library, in the order that callers added them
          type: array
          items:
            $ref: "#/components/schemas/BuilderTemplate"
        collections:
          title: Collections
          description: >
            the collections of the library, in the order that callers added
            them.
            Every ID in a collection's `templateIds` is in `templates`
          type: array
          items:
            $ref: "#/components/schemas/BuilderTemplateCollection"
        builtins:
          title: Builtins
          description: the built-in templates, read only, in no collection
          type: array
          items:
            $ref: "#/components/schemas/BuilderTemplate"
        preloaded:
          title: Preloaded
          description: >
            the collections that the server read from its template files at
            start, in the order of the file names, each with its templates.
            Read only
          type: array
          items:
            title: Preloaded Collection
            description: A collection from a template file, with its templates.
            type: object
            properties:
              collection:
                title: Collection
                description: a collection that the server read from a template file
                allOf:
                  - $ref: "#/components/schemas/BuilderTemplateCollection"
              templates:
                title: Templates
                description: the templates of that collection, in the order of the file
                type: array
                items:
                  $ref: "#/components/schemas/BuilderTemplate"
        damaged:
          title: Damaged
          example: false
          description: >
            this server cannot read the library record, so the response lists
            none of its items
          type: boolean
        limits:
          title: Limits
          description: what the library may hold
          type: object
          properties:
            templates:
              title: Templates
              example: 200
              description: the most templates the library holds
              type: integer
            collections:
              title: Collections
              example: 50
              description: the most collections the library holds
              type: integer
            nameBytes:
              title: Name Bytes
              example: 128
              description: the most bytes a template or collection name has
              type: integer
            descriptionBytes:
              title: Description Bytes
              example: 1024
              description: the most bytes a description has
              type: integer
            deviceBytes:
              title: Device Bytes
              example: 16384
              description: the most bytes a template's `device` takes as JSON
              type: integer
    BuilderTemplateContent:
      title: Builder Template Content
      description: >-
        The body of PUT /builder/templates/items/{template}: the new content of
        a template.
      type: object
      additionalProperties: false
      required:
        - name
        - device
      properties:
        name:
          title: Name
          example: "PLC"
          description: 1 to 128 bytes, not blank, without control characters
          type: string
        description:
          title: Description
          example: "A programmable logic controller."
          description: at most 1024 bytes, without control characters
          type: string
        device:
          title: Device
          description: what a device made from the template gets
          allOf:
            - $ref: "#/components/schemas/BuilderTemplateDevice"
    BuilderTemplateCreate:
      title: Builder Template Create
      description: >-
        The body of POST /builder/templates/items: the new templates, and a
        collection to hold them.
      type: object
      additionalProperties: false
      required:
        - templates
      properties:
        templates:
          title: Templates
          description: the new templates, 1 to 200
          type: array
          minItems: 1
          maxItems: 200
          items:
            title: New Template
            description: The content of one new template.
            type: object
            additionalProperties: false
            required:
              - name
              - device
            properties:
              name:
                title: Name
                example: "PLC"
                description: 1 to 128 bytes, not blank, without control characters
                type: string
              description:
                title: Description
                example: "A programmable logic controller."
                description: at most 1024 bytes, without control characters
                type: string
              device:
                title: Device
                description: what a device made from the template gets
                allOf:
                  - $ref: "#/components/schemas/BuilderTemplateDevice"
        collection:
          title: Collection
          description: a new collection to hold exactly the new templates
          type: object
          additionalProperties: false
          required:
            - name
          properties:
            name:
              title: Name
              description: the name of the collection, by the rules for the name of a template
              example: "Plant devices"
              type: string
            description:
              title: Description
              description: the text of the collection, by the rules for the description of a template
              example: "The devices of the water plant."
              type: string
    BuilderTemplateCreateResult:
      title: Builder Template Create Result
      description: >-
        The answer of POST /builder/templates/items: the IDs and entity tags of
        the new items.
      type: object
      properties:
        created:
          title: Created
          description: the new templates, in the order of the request
          type: array
          items:
            title: Created Item
            description: The ID and entity tag of one new template.
            type: object
            properties:
              id:
                title: ID
                description: the ID of the new template
                example: "6f1c8a52-3d2e-4b7a-9c1d-2e5f7a9b0c13"
                type: string
              etag:
                title: ETag
                description: the entity tag of the new template, for If-Match
                example: "\"1\""
                type: string
        collection:
          title: Collection
          description: the new collection, when the request asked for one
          type: object
          properties:
            id:
              title: ID
              description: the ID of the new collection
              example: "0b6e2c1d-8f4a-4e3b-a5c7-1d2e3f4a5b6c"
              type: string
            etag:
              title: ETag
              description: the entity tag of the new collection, for If-Match
              example: "\"1\""
              type: string
    BuilderTemplateCollectionContent:
      title: Builder Template Collection Content
      description: The content of a template collection, as a request adds or replaces one.
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          title: Name
          example: "Plant devices"
          description: 1 to 128 bytes, not blank, without control characters
          type: string
        description:
          title: Description
          example: "The devices of the water plant."
          description: at most 1024 bytes, without control characters
          type: string
        templateIds:
          title: Template IDs
          description: templates of the library, each named once
          type: array
          maxItems: 200
          items:
            type: string
    BuilderTemplateSelection:
      title: Builder Template Selection
      description: at least one item in all
      type: object
      additionalProperties: false
      properties:
        templates:
          title: Templates
          description: the templates to delete
          type: array
          items:
            $ref: "#/components/schemas/BuilderTemplateRef"
        collections:
          title: Collections
          description: the collections to delete. Their templates stay
          type: array
          items:
            $ref: "#/components/schemas/BuilderTemplateRef"
    BuilderTemplateRef:
      title: Builder Template Reference
      description: a template or a collection, with the entity tag of its content
      type: object
      additionalProperties: false
      required:
        - id
        - etag
      properties:
        id:
          title: ID
          description: the ID of the template or collection
          example: "6f1c8a52-3d2e-4b7a-9c1d-2e5f7a9b0c13"
          type: string
        etag:
          title: ETag
          example: "\"3\""
          description: >
            the `etag` of the item as the caller read it: one strong, quoted
            entity tag, such as `"3"`
          type: string
    BuilderTemplateDeleteResult:
      title: Builder Template Delete Result
      description: >-
        The answer of POST /builder/templates/delete: how many items it deleted.
      type: object
      properties:
        deleted:
          title: Deleted
          description: how many items the request deleted
          type: object
          properties:
            templates:
              title: Templates
              description: the number of deleted templates
              example: 2
              type: integer
            collections:
              title: Collections
              description: the number of deleted collections
              example: 1
              type: integer
    Workflow:
      type: object
      title: Workflow
      description: >-
        A phenix workflow config: what applying a workflow branch creates,
        updates or restarts one experiment from.
      additionalProperties: false
      required:
        - apiVersion
        - kind
        - spec
      properties:
        apiVersion:
          example: phenix.sandia.gov/v0
          type: string
          title: API Version
          description: The config API version; a workflow config is phenix.sandia.gov/v0.
          enum:
            - phenix.sandia.gov/v0
        kind:
          example: Workflow
          type: string
          title: Kind
          description: The config kind, which is always Workflow.
          enum:
            - Workflow
        metadata:
          type: object
          title: Metadata
          description: >-
            Not read by the server; it is accepted so a workflow config has the
            same four top-level keys as every other phenix config, and so a later
            version can carry a name or annotations without a breaking change.
          nullable: true
        spec:
          type: object
          title: Workflow Spec
          description: >-
            What an apply may do and the experiment settings it sets; an empty
            spec applies every default.
          additionalProperties: false
          properties:
            auto:
              type: object
              title: Auto
              description: What an apply may do to the experiment mapped to the workflow branch without being asked.
              nullable: true
              additionalProperties: false
              properties:
                create:
                  example: example
                  type: string
                  title: Create
                  description: >-
                    The name of the experiment to create when none is mapped to
                    the branch; unset never creates one.
                  nullable: true
                update:
                  example: false
                  type: boolean
                  title: Update
                  description: >-
                    Whether an apply may update the experiment already mapped to
                    the branch; defaults to true when unset.
                  nullable: true
                restart:
                  example: false
                  type: boolean
                  title: Restart
                  description: >-
                    Whether an apply may start a new or updated experiment and
                    stop and restart a running one; defaults to true when unset.
                  nullable: true
            topology:
              example: example-topology
              type: string
              title: Topology
              description: >-
                The name of the topology config; required to create an
                experiment, and on an update defaults to the experiment's
                current topology.
              nullable: true
            scenario:
              example: example-scenario
              type: string
              title: Scenario
              description: The name of the scenario config; on an update defaults to the experiment's current scenario.
              nullable: true
            vlans:
              type: object
              title: VLANs
              description: >-
                VLAN alias to VLAN ID; every alias used by an interface in the
                topology is set to its ID here, or left for minimega to pick
                when not listed.
              nullable: true
              additionalProperties:
                type: integer
            schedules:
              type: object
              title: Schedules
              description: >-
                VM hostname to cluster host; each listed non-external node of
                the topology is scheduled on that host.
              nullable: true
              additionalProperties:
                type: string
            deployMode:
              example: all
              type: string
              title: Deploy Mode
              description: >-
                Where VMs are deployed, all, no-headnode or only-headnode in any
                letter case; unset or empty uses the server's deploy-mode
                setting.
              nullable: true
              pattern: '^(?i:all|no-headnode|only-headnode)?$'
            useGREMesh:
              example: false
              type: boolean
              title: Use GRE Mesh
              description: >-
                Whether the experiment uses a GRE mesh between cluster hosts; it
                is OR-ed with the server's use-gre-mesh setting, so either turns
                it on.
              nullable: true
            vlanRange:
              type: object
              title: VLAN Range
              description: The range of VLAN IDs the experiment may allocate from; unset leaves both ends unset.
              nullable: true
              additionalProperties: false
              properties:
                min:
                  example: 1
                  type: integer
                  title: Minimum
                  description: The lowest VLAN ID the experiment may use; 0 leaves the minimum unset.
                  nullable: true
                max:
                  example: 1
                  type: integer
                  title: Maximum
                  description: The highest VLAN ID the experiment may use; 0 leaves the maximum unset.
                  nullable: true
            defaultBridge:
              example: phenix
              type: string
              title: Default Bridge
              description: >-
                The bridge the experiment's VMs attach to by default; defaults to
                phenix, is at most 15 characters (the Linux interface name
                limit), and unless it is phenix no other experiment may use it.
              nullable: true
              maxLength: 15
    WorkflowResult:
      title: "Workflow Result"
      description: >-
        What POST /workflow/apply/{branch} did, or would do with dryRun: the
        action, the experiment and why.
      type: object
      properties:
        action:
          title: "Action"
          description: "Action planned or performed by the workflow."
          example: create
          type: string
          enum:
            - none
            - create
            - createAndStart
            - update
            - updateAndStart
            - restart
        experiment:
          title: "Experiment"
          example: example-experiment
          type: string
          description: experiment the action applies to (empty when no experiment is involved)
        reason:
          title: "Reason"
          example: No changes are needed.
          type: string
          description: why nothing was done, when action is none
        dryRun:
          title: "Dry Run"
          example: false
          type: boolean
          description: true when nothing was changed because dryRun was requested
        warnings:
          title: "Warnings"
          description: >-
            Only a dry run of a plan that starts the experiment sets it. It
            lists each problem that the disk check of that start finds, such as
            a missing backing file. A problem that would refuse the start begins
            with `the start would fail: `
          type: array
          items:
            type: string
            example: >-
              the start would fail: VM host-01: disk kali.qc2: backing file
              /phenix/images/ro_kali.qc2 is missing
    WorkflowConfigResult:
      title: "Workflow Config Result"
      type: object
      description: what POST /workflow/configs/{branch}?dryRun=true would do
      properties:
        action:
          title: "Action"
          example: create
          type: string
          enum:
            - create
            - update
          description: whether the request would create the config or update the stored one
        kind:
          title: "Kind"
          example: Topology
          type: string
          description: the config's kind, e.g. Topology
        name:
          title: "Name"
          example: example-name
          type: string
          description: the config's name after the server filled in its placeholders, such as ${BRANCH_NAME}
        dryRun:
          title: "Dry Run"
          example: false
          type: boolean
          description: always true
        pending:
          title: "Pending"
          example: Topology/example-topology
          type: string
          description: >
            the value to pass as pending to a dry run of
            POST /workflow/apply/{branch}: Kind/name, followed for a scenario by
            ?from=...&topology=... (its fromScenario names and topology
            annotation) and for a topology that includes others by ?include=...
    Options:
      title: "Options"
      description: "The server-side settings that clients read."
      type: object
      properties:
        bridge-mode:
          title: "Bridge Mode"
          description: "Bridge mode configured on the server."
          example: native
          type: string
        deploy-mode:
          title: "Deploy Mode"
          description: "Default VM deployment mode configured on the server."
          example: all
          type: string
        use-gre-mesh:
          title: "Use GRE Mesh"
          description: "Whether the server uses a GRE mesh between cluster hosts."
          example: false
          type: boolean
        base-dir.injects:
          title: "Inject Directory"
          example: /phenix/injects
          type: string
          description: directory phenix workflow apply stages injects into
        workflow-dry-run:
          title: "Workflow Dry Run"
          example: false
          type: boolean
          description: >
            true when POST /workflow/configs/{branch} and POST /workflow/apply/{branch}
            support dryRun, and apply supports pending and expect
    Error:
      title: "Error"
      description: "The JSON body of every error response."
      type: object
      properties:
        message:
          title: "Message"
          example: Request could not be completed.
          type: string
          description: what went wrong; for a config validation failure, the first explained line
        cause:
          title: "Cause"
          example: Resource not found.
          type: string
          description: the underlying error text
        code:
          title: "Code"
          type: string
          description: >-
            a stable, machine-readable kind of error, for clients to match on
            instead of the message. The code is optional, so a client must also
            handle an Error without one. The codes are `invalid_request` (the
            server cannot act on the request as sent: 400, 405, 413, 415, 416,
            422), `unauthorized` (401), `forbidden` (403), `not_found` (404,
            410), `conflict` (409, 412, 423: in conflict with the current
            state), `rate_limited` (429), `unavailable` (502, 503, 504: try
            again later) and `internal` (any other server error). `broken_disks`
            (400) refuses a start because a VM's disk image or CD-ROM image is
            missing, has a broken backing chain, or qemu cannot open an image of
            the chain (see `details.disks`). `disk_in_use` (409) refuses to
            delete a disk image that other images or experiments use (see
            `details.images` and `details.experiments`).

            A Builder route gives each error a code of its own instead, such
            as `document.invalid`, `publish.blocked`, `publish.topology.exists`,
            `request.not-found` or `request.stale`. The answers about a draft
            that a client must tell apart have their own codes: `draft.stale`
            (412), `draft.conflict` and `draft.snapshot.current` (409). A method
            that a Builder route does not take gets 405,
            `request.method-not-allowed`, and the methods that the route takes
            in `Allow`. A refusal about one of the scenarios that a draft lists
            (`publish.scenario.*`) names that scenario in `metadata.scenario`.
          anyOf:
            - enum:
                - invalid_request
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - rate_limited
                - unavailable
                - internal
                - broken_disks
                - disk_in_use
            - pattern: "^[a-z]+(\\.[a-z0-9-]+)+$"
          example: not_found
        metadata:
          title: "Metadata"
          type: object
          description: extra details, returned for some errors
          properties:
            validation:
              title: "Validation"
              example: example
              type: string
              description: >
                for a schema validation failure, the explained lines separated by
                newlines, each in the form <item> "<hostname|name>" (line N): <what>
                (at <sub-path>), with (line N) left out for single-line sources and
                an extra hint line for a misplaced key; an error that cannot be
                placed in the source (in a templated key, in data a config hook
                added, in a YAML merge key, or a missing or misindented
                metadata.name) keeps the validator's text; for an unparsable body
                sent to POST /configs, the parser error
            validation-raw:
              title: "Validation Raw"
              example: example
              type: string
              description: for a schema validation failure, the original validator text
            username:
              title: "Username"
              example: johndoe
              type: string
              description: for a sign-in of an unknown user, that user's name
            retry:
              title: "Retry"
              example: force
              type: string
              enum:
                - force
              description: >-
                `force` when the request can succeed if sent again with
                `force=true`. POST /experiments/{name}/stop sets it when it
                could not kill the VMs: the experiment is still running, and a
                forced stop marks it stopped. DELETE /disks sets it for an image
                that other images or experiments use (`disk_in_use`), and a
                forced delete deletes the image
            revision:
              title: "Revision"
              example: "7"
              type: string
              description: >-
                on a 412 from a config write or delete, the config's current
                `metadata.revision`. Absent when the config has no stored
                revision
            scenario:
              title: "Scenario"
              example: plant-scenario
              type: string
              description: >-
                on a `publish.scenario.*` refusal, the name of the scenario
                that the refusal is about
          additionalProperties:
            type: string
        details:
          title: "Details"
          type: object
          description: structured details, returned for some codes
          properties:
            disks:
              title: "Disks"
              description: >-
                for the code `broken_disks`, each disk image or CD-ROM image of
                a VM that qemu cannot open, sorted by VM and drive
              type: array
              items:
                $ref: "#/components/schemas/BrokenDisk"
            images:
              title: "Images"
              description: >-
                for the code `disk_in_use`, the full path of each image whose
                backing chain holds the image, sorted. Only the images that
                the role may see
              type: array
              items:
                type: string
                example: /phenix/images/child.qc2
            experiments:
              title: "Experiments"
              description: >-
                for the code `disk_in_use`, each experiment whose VMs use the
                image directly or through a backing chain, sorted by name.
                Only the experiments that the role may list
              type: array
              items:
                title: Disk Experiment Use
                description: An experiment whose VMs use the image.
                type: object
                properties:
                  name:
                    title: Name
                    description: the experiment's name
                    example: exp1
                    type: string
                  running:
                    title: Running
                    description: >-
                      whether the experiment is running. minimega may then
                      hold the image open
                    example: false
                    type: boolean
            hidden:
              title: "Hidden"
              description: >-
                for the code `disk_in_use`, how many other images and
                experiments use the image that the role may not see
              type: integer
              example: 0
        issues:
          title: "Issues"
          description: >
            Each problem of a Builder error, when the error names them one by
            one. These are the issues of a document that does not validate
            (`document.invalid`), or the interfaces, addresses and hostnames
            that only a publish refuses (`publish.blocked`).
          type: array
          items:
            $ref: "#/components/schemas/BuilderIssue"

    BrokenDisk:
      title: "Broken Disk"
      description: >-
        A disk image or CD-ROM image of a VM that is missing, whose backing
        chain is broken, or that qemu cannot open.
      type: object
      properties:
        vm:
          title: "VM"
          description: the VM's hostname
          type: string
          example: host-01
        drive:
          title: "Drive"
          description: "`disk` for an entry of hardware.drives, `cdrom` for the VM's CD-ROM (advanced.cdrom)"
          type: string
          enum:
            - disk
            - cdrom
          example: disk
        image:
          title: "Image"
          description: the image as the topology names it
          type: string
          example: kali.qc2
        path:
          title: "Path"
          description: the image's full path, as minimega reads it
          type: string
          example: /phenix/images/kali.qc2
        missing:
          title: "Missing"
          description: >-
            full path of the missing file, the image itself or a file in its
            backing chain. Empty for a chain that loops or is more than 64
            images deep, and for an image that qemu cannot open, such as an
            encrypted image
          type: string
          example: /phenix/images/ro_kali.qc2
        problem:
          title: "Problem"
          description: what is wrong, in one sentence
          type: string
          example: backing file /phenix/images/ro_kali.qc2 is missing
    SoHSummaries:
      title: SoH Summaries
      description: The state of health of every experiment the caller may see.
      type: object
      properties:
        experiments:
          title: Experiments
          description: one summary per experiment
          type: array
          items:
            $ref: "#/components/schemas/SoHSummary"
    SoHSummary:
      title: SoH Summary
      type: object
      description: >-
        One experiment's state of health. Only `name`, `scenario`, `status`,
        `running`, `configured`, `soh_disabled` and `vms.total` are reported
        for a stopped experiment.
      properties:
        name:
          title: Name
          description: the experiment's name
          example: exp1
          type: string
        scenario:
          title: Scenario
          description: the experiment's scenario
          example: soh-scenario
          type: string
        status:
          title: Status
          example: started
          type: string
          description: >-
            started, stopped, or what the server is doing to it, such as
            starting or stopping
        percent:
          title: Percent
          example: 0.5
          type: number
          description: start progress from 0 to 1 while starting
        running:
          title: Running
          description: whether the experiment is running
          example: true
          type: boolean
        configured:
          title: Configured
          example: true
          type: boolean
          description: whether the scenario includes the soh app
        started:
          title: Started
          description: whether the experiment's start has finished
          example: true
          type: boolean
        soh_disabled:
          title: SoH Disabled
          example: false
          type: boolean
          description: >-
            whether the scenario sets `disabled: true` on the soh app. A
            disabled app does not run at post-start. It runs only when a user
            starts it.
        soh_initialized:
          title: SoH Initialized
          example: true
          type: boolean
          description: whether the soh app has finished a run
        soh_running:
          title: SoH Running
          example: false
          type: boolean
          description: whether the soh app is running now
        vms:
          title: VMs
          description: the experiment's VMs by state
          allOf:
            - $ref: "#/components/schemas/SoHVMCounts"
        down_vms:
          title: Down VMs
          type: array
          description: VMs not running or not deployed (at most 50)
          items:
            type: string
        vms_error:
          title: VMs Error
          example: minimega is busy
          type: string
          description: why the server could not ask minimega for VM states
        vms_observed_at:
          title: VMs Observed At
          example: "2026-01-01T10:00:00Z"
          type: string
          format: date-time
          description: when the server read minimega for the VM counts
        vms_stale:
          title: VMs Stale
          example: false
          type: boolean
          description: >-
            the VM counts are the states last read, served while minimega is
            busy starting or stopping an experiment
        hosts:
          title: Hosts
          example: 5
          type: integer
          description: hosts with results
        hosts_with_errors:
          title: Hosts With Errors
          description: hosts with a failing check
          example: 1
          type: integer
        checks:
          title: Checks
          description: every check of the latest results, reachability checks included
          allOf:
            - $ref: "#/components/schemas/SoHTally"
        reachability:
          title: Reachability
          description: the reachability checks of the latest results
          allOf:
            - $ref: "#/components/schemas/SoHTally"
        last_run:
          title: Last Run
          example: "2026-01-01T10:00:00Z"
          type: string
          format: date-time
          description: when the last run finished (the newest check for results from older versions)
        last_run_duration:
          title: Last Run Duration
          example: 12.5
          type: number
          description: seconds the last run took
        history:
          title: History
          type: array
          description: the last 20 runs, oldest first
          items:
            $ref: "#/components/schemas/SoHRun"
        failing_checks:
          title: Failing Checks
          type: array
          description: failing checks from the latest results, newest first (at most 50)
          items:
            $ref: "#/components/schemas/SoHFailingCheck"
        error:
          title: Error
          example: reading soh results failed
          type: string
          description: why the experiment's soh results could not be read
    SoHVMCounts:
      title: SoH VM Counts
      type: object
      description: >-
        VMs by state. `known` is false when the server did not or could not ask
        minimega. Then only `total` is set. `failing` counts running VMs with a
        failing check.
      properties:
        known:
          title: Known
          description: whether the server asked minimega for the VMs' states
          example: true
          type: boolean
        total:
          title: Total
          description: VMs in the experiment
          example: 5
          type: integer
        running:
          title: Running
          description: running VMs
          example: 5
          type: integer
        failing:
          title: Failing
          description: running VMs with a failing check
          example: 1
          type: integer
        notrunning:
          title: Notrunning
          description: deployed VMs that are not running
          example: 0
          type: integer
        notboot:
          title: Notboot
          description: VMs marked do not boot
          example: 0
          type: integer
        notdeploy:
          title: Notdeploy
          description: VMs configured but not deployed
          example: 0
          type: integer
        external:
          title: External
          description: external VMs, which minimega does not run
          example: 0
          type: integer
        delayed:
          title: Delayed
          description: VMs whose start is delayed
          example: 0
          type: integer
    SoHTally:
      title: SoH Tally
      description: A count of checks. `passing` plus `failing` is `total`.
      type: object
      properties:
        total:
          title: Total
          description: checks counted
          example: 40
          type: integer
        passing:
          title: Passing
          description: checks that passed
          example: 38
          type: integer
        failing:
          title: Failing
          description: checks that failed
          example: 2
          type: integer
    SoHRun:
      title: SoH Run
      description: One completed run of the soh checks.
      type: object
      properties:
        time:
          title: Time
          description: when the run finished
          example: "2026-01-01T10:00:00Z"
          type: string
          format: date-time
        duration:
          title: Duration
          description: seconds the run took
          example: 12.5
          type: number
        total:
          title: Total
          description: checks run
          example: 40
          type: integer
        failing:
          title: Failing
          description: checks that failed
          example: 2
          type: integer
        hosts_failing:
          title: Hosts Failing
          description: VMs with a failing check
          example: 1
          type: integer
        hosts_down:
          title: Hosts Down
          description: VMs whose networking check failed
          example: 0
          type: integer
    SoHFailingCheck:
      title: SoH Failing Check
      description: One failing check from the latest soh results.
      type: object
      properties:
        host:
          title: Host
          description: the VM the check ran on
          example: web
          type: string
        check:
          title: Check
          description: the kind of check
          type: string
          enum:
            - network
            - reachability
            - file
            - file absent
            - service
            - process
            - listener
            - container
            - custom test
        target:
          title: Target
          description: what the check looked for, such as an address, file, service or process
          example: 10.0.0.1
          type: string
        error:
          title: Error
          description: why the check failed
          example: no route to host
          type: string
        time:
          title: Time
          description: when the check ran
          example: "2026-01-01T10:00:00Z"
          type: string
          format: date-time
    Version:
      title: Version
      description: The phenix build the server runs.
      type: object
      properties:
        commit:
          title: Commit
          example: 059cd25b
          type: string
          description: the git commit the server was built from
        tag:
          title: Tag
          example: v1.2.0
          type: string
          description: the git tag the server was built from, if any
        buildDate:
          title: Build Date
          example: Tue Oct 13 22:49:41 UTC 2026
          type: string
          description: when the server was built
        repo:
          title: Repo
          example: sandialabs/sceptre-phenix
          type: string
          description: the repository the server was built from
    Features:
      title: Features
      description: The optional features the server has enabled.
      type: object
      properties:
        features:
          title: Features
          type: array
          description: >-
            the enabled features, in no particular order. The list has each
            feature that the `phenix ui --features` flag names, such as
            `vm-mount`. It has `file-server` when a file server endpoint is
            configured, and `tunneler-download` when the server's
            `downloads/tunneler` directory exists at startup. It has `webshark`
            when a WebShark build is installed
          items:
            type: string
            example: webshark
    FileChecksum:
      title: File Checksum
      description: The size, modification time, ETag and SHA-256 digest of an experiment file.
      type: object
      properties:
        path:
          title: Path
          example: captures/router_eth0.pcap
          type: string
          description: the file as the request named it
        size:
          title: Size
          description: the file's size in bytes
          example: 1048576
          type: integer
          format: int64
        modified:
          title: Modified
          description: when the file was last modified
          example: "2026-01-01T10:00:00Z"
          type: string
          format: date-time
        etag:
          title: ETag
          example: "\"1a2b3c-65a1f2e0\""
          type: string
          description: the `ETag` downloads of the file carry
        sha256:
          title: SHA-256
          example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
          type: string
          description: hex SHA-256 of the file. Absent while the server computes it
    Tunnelers:
      title: Tunnelers
      description: The tunneler builds this server offers for download.
      type: object
      properties:
        files:
          title: Files
          type: array
          description: file names of the builds installed on this server, sorted
          items:
            type: string
            example: phenix-tunneler-linux-amd64
    HealthResponse:
      title: Health Response
      type: object
      description: >-
        A health response in the format of the IETF draft
        draft-inadarei-api-health-check-06
      properties:
        status:
          title: Status
          type: string
          enum: [pass, warn, fail]
          description: the worst status of every check
          example: pass
        version:
          title: Version
          type: string
          description: the phenix build's tag
          example: v1.2.0
        releaseId:
          title: Release ID
          type: string
          description: the phenix build's commit
          example: 059cd25b
        serviceId:
          title: Service ID
          description: the service the response is for
          type: string
          example: phenix
        description:
          title: Description
          description: what the response reports on
          type: string
          example: phēnix readiness
        notes:
          title: Notes
          type: array
          description: present when the request was not authenticated
          items:
            type: string
            example: "output fields omitted: request not authenticated"
        output:
          title: Output
          example: "minimega did not answer: unable to dial"
          type: string
          description: detail, only for authenticated requests
        checks:
          title: Checks
          type: object
          description: >-
            the checks' results, keyed "component:measurement" (such as
            `minimega:responseTime`). Most keys have one result, and
            `disk:utilization` has one per filesystem
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/HealthCheckResult"
      required:
        - status
        - serviceId
        - description
        - checks
    HealthCheckResult:
      title: Health Check Result
      description: One check's result in a health response.
      type: object
      properties:
        componentId:
          title: Component ID
          type: string
          description: >-
            the component observed, such as `minimega`, `bolt` or `files-dir`.
            It is never a path or host name
          example: minimega
        componentType:
          title: Component Type
          description: the kind of component observed
          type: string
          enum: [component, datastore, system]
          example: component
        observedValue:
          title: Observed Value
          description: >-
            the value observed. Each key keeps one JSON type across runs, and a
            run that observed nothing omits it. Fractional values (milliseconds,
            percentages) always carry a decimal point, even when whole (`42.0`)
          example: 1.27
        observedUnit:
          title: Observed Unit
          description: the unit of `observedValue`, when it has one
          type: string
          example: ms
        status:
          title: Status
          description: the check's status
          type: string
          enum: [pass, warn, fail]
          example: pass
        affectedEndpoints:
          title: Affected Endpoints
          type: array
          description: the API routes that do not work while this check warns or fails
          items:
            type: string
            example: /api/v1/vms
        time:
          title: Time
          example: "2026-01-01T10:00:00Z"
          type: string
          format: date-time
          description: when the value was observed
        output:
          title: Output
          type: string
          description: >-
            why the check warns or fails, or other detail (paths, hosts,
            errors). Only for authenticated requests
          example: "minimega did not answer: unable to dial"
      required:
        - status
        - time

    Job:
      title: Job
      type: object
      description: A background job and the outcome of each of its items.
      required:
        - id
        - kind
        - owner
        - title
        - status
        - cancelable
        - progress
        - items
        - created
        - updated
        - revision
      properties:
        id:
          title: ID
          type: string
          description: "`j` and 16 hex digits"
          example: j0f3a9c2e81b4d7a6
        kind:
          title: Kind
          description: what the job does
          type: string
          enum:
            - vms.action
            - files.archive
            - disk.clone
        owner:
          title: Owner
          example: admin@example.com
          type: string
          description: the user who started the job
        experiment:
          title: Experiment
          example: exp1
          type: string
          description: the experiment the job acts on, if any
        title:
          title: Title
          description: a readable description of the job
          type: string
          example: Restart 3 VMs
        params:
          title: Params
          type: object
          description: what the job was asked to do, such as its action
          additionalProperties:
            type: string
        status:
          title: Status
          type: string
          description: >-
            `partial` when some items succeeded and others failed or were
            skipped, `failed` when none succeeded or the job itself failed
          enum:
            - queued
            - running
            - succeeded
            - partial
            - failed
            - canceled
        cancelable:
          title: Cancelable
          description: whether the job can still be canceled
          example: true
          type: boolean
        cancelRequested:
          title: Cancel Requested
          description: whether the job received a cancel request and is stopping
          example: false
          type: boolean
        progress:
          title: Progress
          description: the job's progress
          allOf:
            - $ref: "#/components/schemas/JobProgress"
        items:
          title: Items
          description: each item the job acts on, with its outcome
          type: array
          items:
            $ref: "#/components/schemas/JobItem"
        itemsOmitted:
          title: Items Omitted
          example: 0
          type: integer
          description: >-
            items that a websocket message omits (it carries at most 500). GET
            the job to get all items
        error:
          title: Error
          example: experiment exp1 is not running
          type: string
          description: why the job failed, when no item gives the reason
        artifact:
          title: Artifact
          description: the file the job produced, once it is ready
          allOf:
            - $ref: "#/components/schemas/JobArtifact"
        created:
          title: Created
          description: when the job was created
          example: "2026-01-01T10:00:00Z"
          type: string
          format: date-time
        updated:
          title: Updated
          description: when the job last changed
          example: "2026-01-01T10:00:05Z"
          type: string
          format: date-time
        started:
          title: Started
          description: when the job started running
          example: "2026-01-01T10:00:01Z"
          type: string
          format: date-time
        finished:
          title: Finished
          description: when the job finished
          example: "2026-01-01T10:00:09Z"
          type: string
          format: date-time
        revision:
          title: Revision
          example: 7
          type: integer
          description: increases with every change. Keep the update with the highest value
    JobItem:
      title: Job Item
      description: One item a job acts on and its outcome.
      type: object
      required:
        - name
        - status
      properties:
        name:
          title: Name
          example: web
          type: string
          description: the VM, file or disk image the item acts on
        status:
          title: Status
          description: the item's outcome so far
          type: string
          enum:
            - pending
            - running
            - succeeded
            - failed
            - skipped
            - canceled
        error:
          title: Error
          type: string
          description: why the item failed or was skipped
          example: you do not have permission
        retryable:
          title: Retryable
          example: false
          type: boolean
          description: >-
            trying the item again later may succeed, such as a VM another
            action holds
        result:
          title: Result
          type: object
          description: >-
            what the item's action returned, such as the VM it left (as GET
            /experiments/{exp}/vms/{name} returns it). The websocket does not
            send it
    JobProgress:
      title: Job Progress
      description: The progress of a job.
      type: object
      required:
        - done
        - total
      properties:
        done:
          title: Done
          example: 2
          type: integer
          description: items with an outcome
        total:
          title: Total
          example: 3
          type: integer
          description: items, or 1 for a job of none
        bytes:
          title: Bytes
          example: 10485760
          type: integer
          format: int64
          description: bytes handled, for file work
        bytesTotal:
          title: Bytes Total
          description: bytes to handle in all, for file work
          example: 52428800
          type: integer
          format: int64
    JobArtifact:
      title: Job Artifact
      type: object
      description: The file a job produced, at GET /jobs/{id}/artifact.
      required:
        - name
        - size
      properties:
        name:
          title: Name
          description: the file name the artifact downloads as
          type: string
          example: exp1-files.zip
        size:
          title: Size
          description: the file's size in bytes
          example: 52428800
          type: integer
          format: int64
        incomplete:
          title: Incomplete
          example: false
          type: boolean
          description: the file lacks some of the requested content
    NetflowRecord:
      title: Netflow Record
      type: object
      description: One netflow record of an experiment's bridge.
      properties:
        proto:
          title: Protocol
          type: integer
          description: the IP protocol number
          example: 6
        src:
          title: Source
          type: string
          description: the source address
          example: 10.0.0.1
        sport:
          title: Source Port
          type: integer
          description: the source port
          example: 50123
        dst:
          title: Destination
          type: string
          description: the destination address
          example: 10.0.0.2
        dport:
          title: Destination Port
          type: integer
          description: the destination port
          example: 443
        packets:
          title: Packets
          type: integer
          description: packets in the flow
          example: 12
        bytes:
          title: Bytes
          type: integer
          description: bytes in the flow
          example: 4096
    NetflowCaptureList:
      title: Netflow Capture List
      type: object
      description: An experiment's recorded netflow captures, newest first.
      required: [captures]
      properties:
        captures:
          title: Captures
          type: array
          description: the captures, newest first
          items:
            $ref: "#/components/schemas/NetflowCapture"
    NetflowCapture:
      title: Netflow Capture
      type: object
      description: One recorded netflow capture of an experiment.
      required: [id, started, stopped, state, size, flows, truncated, path]
      properties:
        id:
          title: ID
          type: string
          description: the capture's UTC start time, which identifies it
          example: 20261028T153012.345Z
        started:
          title: Started
          type: string
          format: date-time
          description: when the capture started
          example: "2026-10-28T15:30:12.345Z"
        stopped:
          title: Stopped
          type: string
          format: date-time
          nullable: true
          description: when the capture stopped, or null unless its state is `stopped`
          example: "2026-10-28T16:00:00Z"
        state:
          title: State
          type: string
          description: >-
            `recording` while the capture runs, `stopped` once it stopped, and
            `interrupted` when the server stopped or restarted before it did.
            While the capture is `recording` and `truncated`, the server no
            longer records its lines
          enum: [recording, stopped, interrupted]
          example: stopped
        size:
          title: Size
          type: integer
          format: int64
          description: bytes of the recorded lines
          example: 834211
        flows:
          title: Flows
          type: integer
          format: int64
          nullable: true
          description: lines recorded, or null when the capture was interrupted
          example: 10342
        truncated:
          title: Truncated
          type: boolean
          description: >-
            whether recording stopped early, at the size limit or on a write
            error. Later flows were only shown live
          example: false
        path:
          title: Path
          type: string
          description: the recorded lines' path in the experiment's files
          example: netflow/20261028T153012.345Z.txt
    ExperimentGraph:
      title: Experiment Graph
      type: object
      description: An experiment's VMs and VLANs as a graph.
      properties:
        nodes:
          title: Nodes
          type: array
          description: the VMs, then a `Switch` node for each VLAN
          items:
            $ref: "#/components/schemas/GraphNode"
        edges:
          title: Edges
          type: array
          description: one edge for each VM interface
          items:
            $ref: "#/components/schemas/GraphEdge"
        running:
          title: Running
          type: boolean
          description: whether the experiment is running
          example: true
    GraphNode:
      title: Graph Node
      type: object
      description: >-
        A VM, as minimega reports it for a running experiment, or a VLAN's
        `Switch` node, which sets only `id`, `name`, `type` and `networks`.
      properties:
        id:
          title: ID
          type: integer
          description: the node's ID in the graph, which edges and searches name
          example: 0
        name:
          title: Name
          type: string
          description: the VM's hostname, or the VLAN's alias
          example: web
        description:
          title: Description
          type: string
          description: the VM's description from the topology
          example: Web server
        type:
          title: Type
          type: string
          description: the node's type, such as VirtualMachine, or Switch for a VLAN
          example: VirtualMachine
        experiment:
          title: Experiment
          type: string
          description: the experiment's name
          example: exp1
        host:
          title: Host
          type: string
          description: the cluster host running the VM
          example: compute1
        ipv4:
          title: IPv4
          type: array
          description: the VM's IPv4 address on each interface
          items:
            type: string
          example: [10.0.0.1]
        cpus:
          title: CPUs
          type: integer
          description: the VM's virtual CPUs
          example: 1
        ram:
          title: RAM
          type: integer
          description: the VM's memory, in megabytes
          example: 1024
        disk:
          title: Disk
          type: string
          description: the VM's disk image
          example: ubuntu.qc2
        inject_partition:
          title: Inject Partition
          type: integer
          description: the disk partition injections go to
          example: 1
        osType:
          title: OS Type
          type: string
          description: the VM's OS type
          example: linux
        dnb:
          title: Do Not Boot
          type: boolean
          description: whether the VM is marked do not boot
          example: false
        networks:
          title: Networks
          type: array
          description: the VLAN each interface connects to
          items:
            type: string
          example: [EXP_1]
        taps:
          title: Taps
          type: array
          description: the VM's tap interfaces
          items:
            type: string
          example: [mega_tap0]
        captures:
          title: Captures
          type: array
          description: the VM's running packet captures
          items:
            $ref: "#/components/schemas/Capture"
        state:
          title: State
          type: string
          description: minimega's state of the VM
          example: RUNNING
        running:
          title: Running
          type: boolean
          description: whether the VM is running
          example: true
        busy:
          title: Busy
          type: boolean
          description: whether an action holds the VM
          example: false
        ccActive:
          title: Miniccc Active
          type: boolean
          description: whether the VM's miniccc agent is connected
          example: true
        uptime:
          title: Uptime
          type: number
          description: seconds the VM has run
          example: 3600
        cdRom:
          title: CD-ROM
          type: string
          description: the image in the VM's CD-ROM drive, if any
          example: tools.iso
        tags:
          title: Tags
          type: object
          description: the VM's minimega tags
          additionalProperties:
            type: string
        snapshot:
          title: Snapshot
          type: boolean
          description: whether the VM runs from a snapshot of its disk
          example: true
        labels:
          title: Labels
          type: object
          description: the VM's labels from the topology
          additionalProperties:
            type: string
    GraphEdge:
      title: Graph Edge
      type: object
      description: An edge between two graph nodes.
      properties:
        id:
          title: ID
          type: integer
          description: the edge's ID
          example: 0
        source:
          title: Source
          type: integer
          description: the ID of the node the edge starts at
          example: 0
        target:
          title: Target
          type: integer
          description: the ID of the node the edge ends at
          example: 3
        length:
          title: Length
          type: integer
          description: the edge's drawn length
          example: 150
    SoHNetwork:
      title: SoH Network
      type: object
      description: An experiment's network graph with its state of health.
      required: [started, soh_disabled, soh_initialized, soh_running, nodes, edges, hosts, host_flows]
      properties:
        started:
          title: Started
          type: boolean
          description: whether the experiment's start has finished
          example: true
        soh_disabled:
          title: SoH Disabled
          type: boolean
          description: >-
            whether the scenario sets `disabled: true` on the soh app. A
            disabled app does not run at post-start. It runs only when a user
            starts it.
          example: false
        soh_initialized:
          title: SoH Initialized
          type: boolean
          description: whether the soh app has finished a run
          example: true
        soh_running:
          title: SoH Running
          type: boolean
          description: whether the soh app is running now
          example: false
        nodes:
          title: Nodes
          type: array
          description: the VMs, then a node for each VLAN
          items:
            $ref: "#/components/schemas/SoHNode"
        edges:
          title: Edges
          type: array
          description: one edge for each VM interface
          items:
            $ref: "#/components/schemas/GraphEdge"
        hosts:
          title: Hosts
          type: array
          description: the hosts the soh app recorded flows between
          items:
            type: string
          example: [web, db]
        host_flows:
          title: Host Flows
          type: array
          description: >-
            a matrix of the flows the soh app recorded: the entry at row i,
            column j counts those from host i to host j. Empty, never null, when
            it recorded none
          items:
            type: array
            items:
              type: integer
          example: [[0, 3], [2, 0]]
    SoHNode:
      title: SoH Node
      type: object
      description: A graph node with its state of health.
      required: [id, label, image, tags, status, soh]
      properties:
        id:
          title: ID
          type: integer
          description: the node's ID in the graph
          example: 0
        label:
          title: Label
          type: string
          description: the VM's hostname, or the VLAN's alias
          example: web
        image:
          title: Image
          type: string
          description: >-
            what the UI draws the node as: the VM's OS type, `Router` or
            `Firewall` for those node types, or `switch` for a VLAN
          example: linux
        tags:
          title: Tags
          type: object
          description: the node's tags
          additionalProperties:
            type: string
        status:
          title: Status
          type: string
          description: the VM's state, or `ignore` for a VLAN
          enum: [running, notrunning, notboot, notdeploy, external, ignore]
        soh:
          title: SoH
          description: the VM's latest soh results, if any
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/SoHHostState"
    SoHHostState:
      title: SoH Host State
      type: object
      description: One VM's latest soh results, each check's kind in its own list.
      required: [hostname, cpuLoad, errors]
      properties:
        hostname:
          title: Hostname
          type: string
          description: the VM's hostname
          example: web
        cpuLoad:
          title: CPU Load
          type: string
          description: the VM's CPU load
          example: "0.12"
        networking:
          title: Networking
          type: array
          description: the network checks
          items:
            $ref: "#/components/schemas/SoHState"
        reachability:
          title: Reachability
          type: array
          description: the reachability checks
          items:
            $ref: "#/components/schemas/SoHState"
        files:
          title: Files
          type: array
          description: the checks that files exist
          items:
            $ref: "#/components/schemas/SoHState"
        filesAbsent:
          title: Files Absent
          type: array
          description: the checks that files do not exist
          items:
            $ref: "#/components/schemas/SoHState"
        services:
          title: Services
          type: array
          description: the service checks
          items:
            $ref: "#/components/schemas/SoHState"
        processes:
          title: Processes
          type: array
          description: the process checks
          items:
            $ref: "#/components/schemas/SoHState"
        listeners:
          title: Listeners
          type: array
          description: the listener checks
          items:
            $ref: "#/components/schemas/SoHState"
        containers:
          title: Containers
          type: array
          description: the container checks
          items:
            $ref: "#/components/schemas/SoHState"
        customTests:
          title: Custom Tests
          type: array
          description: the custom host tests from the VM's soh profile
          items:
            $ref: "#/components/schemas/SoHState"
        errors:
          title: Errors
          type: boolean
          description: >-
            whether any of the VM's checks failed, which the UI marks on the
            node's border
          example: false
    SoHState:
      title: SoH State
      type: object
      description: One soh check's result.
      required: [metadata, timestamp, success, error]
      properties:
        metadata:
          title: Metadata
          type: object
          description: what the check looked at, such as its target
          additionalProperties: true
        timestamp:
          title: Timestamp
          type: string
          description: when the check ran, RFC 3339
          example: "2026-01-01T10:00:00Z"
        success:
          title: Success
          type: string
          description: what passed, when the check passed
          example: 10.0.0.2 reachable
        error:
          title: Error
          type: string
          description: why the check failed, when it failed
          example: no route to host
    CaptureSubnetRequest:
      title: Capture Subnet Request
      type: object
      description: The VMs whose interfaces on a subnet to capture or stop capturing.
      properties:
        subnet:
          title: Subnet
          type: string
          description: the subnet, as a CIDR prefix
          example: 10.0.0.0/24
        vms:
          title: VMs
          type: array
          description: the VMs to act on. An empty list acts on every VM of the experiment
          items:
            type: string
          example: [web]
    CaptureVlanRequest:
      title: Capture VLAN Request
      type: object
      description: The VMs whose interfaces on a VLAN to capture or stop capturing.
      properties:
        vlan:
          title: VLAN
          type: string
          description: >-
            the alias of the VLAN, in the case that minimega reports it, such
            as EXP_1 for an interface on `EXP_1 (101)`
          example: EXP_1
        vms:
          title: VMs
          type: array
          description: >-
            the VMs to act on. An empty list acts on each VM of the experiment
            whose captures the role may change
          items:
            type: string
          example: [web]
    VMUpdate:
      title: VM Update
      type: object
      description: >-
        The changes to one VM of an experiment, by name. Omitted fields keep
        their value, and while the experiment runs, only `interface` can change.
      required:
        - name
      properties:
        name:
          title: Name
          type: string
          description: the VM's name
          example: web
        cpus:
          title: CPUs
          type: integer
          description: virtual CPUs, or 0 to keep them
          example: 2
        ram:
          title: RAM
          type: integer
          description: memory in megabytes, or 0 to keep it
          example: 2048
        disk:
          title: Disk
          type: string
          description: the disk image, or empty to keep it
          example: ubuntu.qc2
        dnb:
          title: Do Not Boot
          type: boolean
          description: whether the VM is marked do not boot
          example: true
        interface:
          title: Interface
          type: object
          description: an interface to connect to another VLAN, or to disconnect
          properties:
            index:
              title: Index
              type: integer
              description: the interface's index
              example: 0
            vlan:
              title: VLAN
              type: string
              description: the VLAN alias to connect it to, or empty to disconnect it
              example: EXP_2
        host:
          title: Host
          type: string
          description: the cluster host to schedule the VM on
          example: compute1
        snapshot:
          title: Snapshot
          type: boolean
          description: whether the VM runs from a snapshot of its disk
          example: true
    ImageFilename:
      title: Image Filename
      type: object
      description: The name of the file to write.
      required:
        - filename
      properties:
        filename:
          title: Filename
          type: string
          description: >-
            the name of the file to write. The operation that takes it gives
            the rules for the name
          example: web-committed.qc2
    PortForward:
      title: Port Forward
      type: object
      description: A user's port forward to a VM.
      properties:
        exp:
          title: Experiment
          type: string
          description: the experiment's name
          example: exp1
        vm:
          title: VM
          type: string
          description: the VM's name
          example: web
        srcPort:
          title: Src Port
          type: integer
          description: the local port that serves the forward
          example: 2222
        dstHost:
          title: Dst Host
          type: string
          description: the destination host, as the VM's cluster host reaches it
          example: 127.0.0.1
        dstPort:
          title: Dst Port
          type: integer
          description: the destination port
          example: 22
        owner:
          title: Owner
          type: string
          description: the user who created the forward
          example: alice@example.com
    File:
      title: File
      type: object
      description: A file or folder.
      properties:
        name:
          title: Name
          type: string
          description: the file's name
          example: hostname
        path:
          title: Path
          type: string
          description: the file's path from the root of the mount, starting with `/`
          example: /etc/hostname
        date:
          title: Date
          type: string
          description: when the file was last modified, RFC 3339
          example: "2026-01-01T10:00:00Z"
        size:
          title: Size
          type: integer
          description: the file's size in bytes
          example: 8
        categories:
          title: Categories
          type: array
          description: what the file is, when known
          items:
            type: string
          example: []
        plainText:
          title: Plain Text
          type: boolean
          description: whether the file is plain text
          example: true
        isDir:
          title: Is Dir
          type: boolean
          description: whether the entry is a folder
          example: false
    ScorchTerminal:
      title: Scorch Terminal
      type: object
      description: A terminal a SCORCH break component opened, and a client of it.
      properties:
        exp:
          title: Experiment
          type: string
          description: the experiment's name
          example: exp1
        run:
          title: Run
          type: integer
          description: the run's index
          example: 0
        loop:
          title: Loop
          type: integer
          description: the loop's nesting depth
          example: 0
        stage:
          title: Stage
          type: string
          description: the stage the component runs in
          example: start
        name:
          title: Name
          type: string
          description: the break component's name
          example: pause
        loc:
          title: Location
          type: string
          description: >-
            the websocket the client attaches with, under the UI's base path.
            Empty in a listing
          example: /api/v1/experiments/exp1/scorch/terminals/4242/ws/0f7b2a1e-5c1d-4f6e-9d2a-3b4c5d6e7f80
        exit:
          title: Exit
          type: string
          description: >-
            the route that ends the terminal, for its writing client only. Empty
            for a read-only client and in a listing
          example: /api/v1/experiments/exp1/scorch/terminals/4242/exit/0f7b2a1e-5c1d-4f6e-9d2a-3b4c5d6e7f80
        readOnly:
          title: Read-Only
          type: boolean
          description: whether the client only watches the terminal
          example: false
    Role:
      title: Role
      type: object
      description: A role and the policies it grants.
      properties:
        name:
          title: Name
          type: string
          description: the role's name
          example: Experiment User
        policies:
          title: Policies
          type: array
          description: the role's policies
          items:
            title: Policy
            description: The resources, resource names and verbs that the role grants.
            type: object
            properties:
              resources:
                title: Resources
                type: array
                description: the resource types the policy covers
                items:
                  type: string
                example: [experiments, vms/*]
              resourceNames:
                title: Resource Names
                type: array
                description: the names of the resources the policy covers
                items:
                  type: string
                example: [exp1, exp1/*]
              verbs:
                title: Verbs
                type: array
                description: the actions the policy allows
                items:
                  type: string
                example: [get, list]
    Settings:
      title: Settings
      type: object
      description: The settings of the web UI's Settings page.
      properties:
        password_settings:
          title: Password Settings
          description: the password rules
          allOf:
            - $ref: "#/components/schemas/PasswordSettings"
        logging_settings:
          title: Logging Settings
          description: the system log file's rotation
          allOf:
            - $ref: "#/components/schemas/LoggingSettings"
        timeout_settings:
          title: Timeout Settings
          description: the session timeout
          allOf:
            - $ref: "#/components/schemas/TimeoutSettings"
    PasswordSettings:
      title: Password Settings
      type: object
      description: What a new password must have.
      properties:
        lowercase_req:
          title: Lowercase Req
          type: boolean
          description: whether a password needs a lowercase letter
          example: true
        uppercase_req:
          title: Uppercase Req
          type: boolean
          description: whether a password needs an uppercase letter
          example: true
        number_req:
          title: Number Req
          type: boolean
          description: whether a password needs a number
          example: true
        symbol_req:
          title: Symbol Req
          type: boolean
          description: whether a password needs a symbol
          example: false
        min_length:
          title: Min Length
          type: integer
          description: the shortest password allowed, from 8 to 32
          example: 8
    LoggingSettings:
      title: Logging Settings
      type: object
      description: When the server rotates the system log file, and how many old files it keeps.
      properties:
        max_file_rotations:
          title: Max File Rotations
          type: integer
          description: old log files to keep
          example: 3
        max_file_size:
          title: Max File Size
          type: integer
          description: size in megabytes at which the server rotates the log file
          example: 100
        max_file_age:
          title: Max File Age
          type: integer
          description: days to keep an old log file
          example: 90
    TimeoutSettings:
      title: Timeout Settings
      type: object
      description: When the web UI signs an idle user out.
      properties:
        enabled:
          title: Enabled
          type: boolean
          description: whether the web UI signs idle users out
          example: true
        timeout_min:
          title: Timeout Min
          type: number
          description: minutes of idleness before the web UI signs the user out
          example: 30
        warning_min:
          title: Warning Min
          type: number
          description: how many minutes before the sign-out the web UI warns the user
          example: 3
    LogEntry:
      title: Log Entry
      type: object
      description: One entry of the server's log.
      properties:
        time:
          title: Time
          type: integer
          format: int64
          description: when the entry was logged, in microseconds since the Unix epoch
          example: 1767261600000000
        timestamp:
          title: Timestamp
          type: string
          description: when the entry was logged, readable
          example: "2026-01-01 10:00:00.000"
        level:
          title: Level
          type: string
          description: the entry's level
          example: INFO
        msg:
          title: Message
          type: string
          description: the entry's message, with its other fields appended
          example: "experiment started exp=exp1"
        type:
          title: Type
          type: string
          description: what the entry is about
          enum: [SYSTEM, ACTION, SECURITY, AUDIT, HTTP, MINIMEGA, SOH, SCORCH, PHENIX-APP]
    LogFileList:
      title: Log File List
      type: object
      description: The log files the server serves.
      required: [files]
      properties:
        files:
          title: Files
          type: array
          description: the log files, phenix's first
          items:
            $ref: "#/components/schemas/LogFile"
    LogFile:
      title: Log File
      type: object
      description: One log file the server serves, and whether it can serve it now.
      required: [name, available]
      properties:
        name:
          title: Name
          type: string
          description: the log file's name in `GET /logs/files/{name}`
          enum: [phenix, minimega]
        available:
          title: Available
          type: boolean
          description: whether the file can be downloaded now
          example: true
        size:
          title: Size
          type: integer
          format: int64
          description: the file's size in bytes, when it is available
          example: 1048576
        modified:
          title: Modified
          type: string
          format: date-time
          description: when the file last changed, when it is available
          example: "2026-01-01T10:00:00Z"
        reason:
          title: Reason
          type: string
          description: why the file cannot be downloaded, when it is not available
          example: "the minimega log file is not configured (set ui.logs.minimega-path)"
    WebSocketMessage:
      title: WebSocket Message
      type: object
      description: A change the server publishes on the `/ws` websocket, or its answer to a request.
      properties:
        resource:
          title: Resource
          description: what changed
          allOf:
            - $ref: "#/components/schemas/WebSocketResource"
        result:
          title: Result
          description: >-
            the message's data, such as the experiment or VM as the API returns
            it, or null when the action alone describes the change
          example:
            name: web
            running: true
        seq:
          title: Seq
          type: integer
          format: int64
          description: the message's sequence number, comparable with `X-Phenix-Seq`
          example: 1042
    WebSocketRequest:
      title: WebSocket Request
      type: object
      description: A request a client sends on the `/ws` websocket.
      properties:
        resource:
          title: Resource
          description: what the request is about
          allOf:
            - $ref: "#/components/schemas/WebSocketResource"
        request:
          title: Request
          type: object
          description: >-
            the request's parameters, which depend on its resource type. Null or
            omitted when it takes none
          nullable: true
          additionalProperties: true
          example:
            term: hostname
            value: web
    WebSocketResource:
      title: WebSocket Resource
      type: object
      description: The resource a `/ws` message or request is about.
      properties:
        type:
          title: Type
          type: string
          description: the kind of resource, such as `experiment`, `experiment/vm` or `log`
          example: experiment/vm
        name:
          title: Name
          type: string
          description: the resource's name, such as `<exp>/<vm>` for a VM
          example: exp1/web
        action:
          title: Action
          type: string
          description: what happened to it, or what the request asks
          example: start
    WebSharkError:
      title: WebShark Error
      type: object
      description: An error in the JSON form that the bundled WebShark reads.
      required: [err, errstr]
      properties:
        err:
          title: Error
          type: integer
          description: always 1
          example: 1
        errstr:
          title: Error Text
          type: string
          description: what went wrong
          example: Not Found

  # Shared by the single-file download routes, which resume interrupted
  # downloads with Range and If-Range.
  parameters:
    BuilderDraftID:
      name: draft
      in: path
      description: draft ID
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    BuilderIfMatch:
      name: If-Match
      in: header
      description: >-
        The ETag of the draft revision that the change is based on, one
        strong quoted entity tag such as `"3"`. A missing, wildcard or weak tag
        gets 400, and a tag of another revision gets 412.
      required: true
      schema:
        type: string
        example: '"3"'
    BuilderTemplateID:
      name: template
      in: path
      description: template ID
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    BuilderTemplateCollectionID:
      name: collection
      in: path
      description: collection ID
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    BuilderTemplateIfMatch:
      name: If-Match
      in: header
      description: >-
        The `etag` of the template or collection that the change is based
        on, one strong quoted entity tag such as `"3"`. A missing, wildcard or
        weak tag gets 400, and a tag of other content gets 412.
      required: true
      schema:
        type: string
        example: '"3"'
    BuilderLayerSetID:
      name: layerset
      in: path
      description: >
        the ID of the layer set. A path that names no set gets 404, whatever
        its form
      required: true
      schema:
        type: string
    BuilderLayerSetIfMatch:
      name: If-Match
      in: header
      description: >-
        The `etag` of the layer set that the change is based on, one strong
        quoted entity tag such as `"3"`. A missing, wildcard or weak tag gets
        400, and a tag of other content gets 412 (`layerset.stale`).
      required: true
      schema:
        type: string
        example: '"3"'
    BuilderIconIfMatch:
      name: If-Match
      in: header
      description: >-
        The `etag` of the icon as listed or read, one strong quoted entity tag
        such as `"12"`. A missing, wildcard or weak tag gets 400, and a tag of
        another revision gets 412.
      required: true
      schema:
        type: string
        example: '"12"'
    BuilderDocumentIfMatch:
      name: If-Match
      in: header
      description: >-
        The `etag` of the published document as listed or read, one strong
        quoted entity tag. A missing, wildcard or weak tag gets 400, and a tag
        of another state of the topology gets 412.
      required: true
      schema:
        type: string
        example: '"0f3a9c2b7d1e4f6a8b5c3d2e1f0a9b8c"'
    BuilderLayerSetDefaultIfMatch:
      name: If-Match
      in: header
      description: >-
        The `etag` of the default selection as listed or read, one strong
        quoted entity tag such as `"0"`. A missing, wildcard or weak tag gets
        400, and a tag of another selection gets 412 (`layerset.stale`).
      required: true
      schema:
        type: string
        example: '"0"'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: >-
        1 to 255 printable ASCII characters that name this request. A retry with
        the same key gets the first request's answer instead of starting a
        second job (see Idempotency in the introduction)
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 255
        example: 6f1c2a0e-4b5d-4c8e-9a7f-2d3e1b0c9f84
    PageNum:
      name: pageNum
      in: query
      description: >-
        page to return, from 1, used with perPage. Without both, the server
        returns every item
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 2147483647
        example: 1
    PerPage:
      name: perPage
      in: query
      description: items per page, used with pageNum
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 2147483647
        example: 25
    ExpName:
      name: exp_name
      in: path
      description: name of phenix experiment
      required: true
      schema:
        type: string
    VMName:
      name: vm_name
      in: path
      description: name of the experiment's VM
      required: true
      schema:
        type: string
    ScorchExp:
      name: name
      in: path
      description: name of phenix experiment
      required: true
      schema:
        type: string
    ScorchRun:
      name: run
      in: path
      description: index of the run in the experiment's scorch app metadata
      required: true
      schema:
        type: integer
    ScorchLoop:
      name: loop
      in: path
      description: nesting depth of the loop, 0 for the run's top-level loop
      required: true
      schema:
        type: integer
    ScorchStage:
      name: stage
      in: path
      description: the stage, such as configure, start, stop or cleanup
      required: true
      schema:
        type: string
    ScorchComponent:
      name: cmp
      in: path
      description: the component's name
      required: true
      schema:
        type: string
    ScorchTerminalPID:
      name: pid
      in: path
      description: the PID of the process the terminal runs
      required: true
      schema:
        type: integer
    JobID:
      name: id
      in: path
      description: the job's ID
      required: true
      schema:
        type: string
    RangeHeader:
      name: Range
      in: header
      description: >-
        the bytes to send, such as `bytes=1048576-` to resume a download after
        its first MiB
      required: false
      schema:
        type: string
    IfRangeHeader:
      name: If-Range
      in: header
      description: >-
        the `ETag` of an earlier response. The server honors `Range` only while
        the file still has it, and sends a changed file whole (200)
      required: false
      schema:
        type: string
    IfNoneMatchHeader:
      name: If-None-Match
      in: header
      description: >-
        the `ETag` of an earlier response. The response is 304 while the file
        still has it
      required: false
      schema:
        type: string
    # Config revisions: conditional reads and writes of one config.
    ConfigIfMatch:
      name: If-Match
      in: header
      description: >-
        optional. The config's `ETag` from an earlier read (`"r<revision>"`), or
        `*`. The write runs only while the config is still at that revision, and
        answers 412 otherwise. This prevents a silent overwrite of a concurrent
        change. Weak tags never match, and a malformed value gets a 400.
      required: false
      schema:
        type: string
    ConfigIfNoneMatch:
      name: If-None-Match
      in: header
      description: >-
        the config's `ETag` from an earlier read. The response is 304 while the
        config is still at that revision
      required: false
      schema:
        type: string
    IfMatchHeader:
      name: If-Match
      in: header
      description: >-
        the `ETag` of an earlier response. The response is 412 when the file
        no longer has it
      required: false
      schema:
        type: string
        example: '"2f1c-1000-17a2b3c4d5e6f708-17a2b3c4d5e6f708"'
  headers:
    BuilderETag:
      description: the draft's revision as a quoted entity tag, for the next If-Match
      schema:
        type: string
    BuilderTemplateETag:
      description: >
        the entity tag of the template's or collection's content,
        `"<version>"`, for the next If-Match
      schema:
        type: string
    BuilderLayerSetETag:
      description: >
        the entity tag of the layer set's content, `"<version>"`, for the
        next If-Match
      schema:
        type: string
    BuilderIconETag:
      description: >
        the entity tag of the icon's revision, `"<revision>"`, for the If-Match
        of a delete
      schema:
        type: string
    BuilderDocumentETag:
      description: >
        the entity tag of the published document and its topology, for the
        If-Match of a delete
      schema:
        type: string
    BuilderLayerSetDefaultETag:
      description: >
        the entity tag of the default layer set selection, for the next
        If-Match
      schema:
        type: string
    BuilderWarning:
      description: >
        Set when the change succeeded, but the server could not remove the
        content that it replaced. Only the server log has the cause.
      schema:
        type: string
    IdempotentReplayed:
      description: >-
        `true` when the answer is the first one given for the request's
        `Idempotency-Key`, replayed rather than starting another job
      schema:
        type: string
        enum:
          - "true"
    # Ordering and freshness (see the description). Seq is on every API
    # response; it is listed on the live reads clients order against /ws.
    Seq:
      description: >-
        this process's sequence number, taken as the request started. It orders
        the response against websocket messages and other responses
      schema:
        type: integer
        format: int64
    ObservedAt:
      description: >-
        when the server read the oldest runtime data in the response from
        minimega (RFC 3339)
      schema:
        type: string
        format: date-time
    Stale:
      description: "`true` when the response serves runtime data past its normal bound"
      schema:
        type: string
        enum:
          - "true"
    Version:
      description: >-
        the server's build: a release's version without its `v`, or
        `0.0.0-dev+<commit>`
      schema:
        type: string
        example: 0.0.0-dev+f0856e98
    # Config revisions: conditional reads and writes of one config.
    ConfigETag:
      description: >-
        strong validator `"r<revision>"` naming the config's revision (not its
        bytes, so it holds for a gzip-compressed body too). Absent for a config
        with no stored revision
      schema:
        type: string
    ConfigRevision:
      description: >-
        the config's `metadata.revision`, as a plain number. Absent for a config
        with no stored revision, as the ETag is
      schema:
        type: integer
        format: int64
    ETag:
      description: >-
        strong validator built from the file's inode, size and modification
        time (not its contents), so it changes whenever the file does
      schema:
        type: string
    LastModified:
      description: the file's modification time
      schema:
        type: string
    AcceptRanges:
      description: "`bytes`: the file can be fetched, and resumed, in ranges"
      schema:
        type: string
    ContentRange:
      description: the range sent and the file's size, such as `bytes 1048576-2097151/4194304`
      schema:
        type: string
    ReprDigest:
      description: >-
        the whole file's SHA-256 (RFC 9530), such as `sha-256=:<base64>:`. The
        server sends it only after the file's checksum route computes it. It
        holds for a range too, so a client can verify a resumed download. A
        gzip-compressed response does not have it
      schema:
        type: string
    RetryAfter:
      description: seconds to wait before trying again
      schema:
        type: integer
  responses:
    BuilderBadRequest:
      description: >-
        The body is not a single JSON value of the expected shape, with no
        unknown fields, or the If-Match header is missing or is not one strong
        entity tag.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BuilderForbidden:
      description: >
        The role of the caller does not have a permission that the operation
        requires: `builder` `use`, or a config permission that the operation
        names.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BuilderNotFound:
      description: >-
        The resource does not exist, or it is a published document or config
        that the caller may not read, which gets the same answer.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BuilderConflict:
      description: >-
        The draft (`draft.conflict`) or a target config changed during the
        request. Read the draft again and try again.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BuilderPreconditionFailed:
      description: >
        The If-Match header does not name the draft's current revision
        (`draft.stale`). The response carries the draft's current ETag.
      headers:
        ETag:
          $ref: "#/components/headers/BuilderETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BuilderStale:
      description: >-
        Another user changed the resource after the caller read it, so
        If-Match does not name its current state (`request.stale`). Read the
        resource again. The `ETag` header has its current entity tag.
      headers:
        ETag:
          description: the current entity tag of the resource, for the next If-Match
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BuilderTooLarge:
      description: >-
        The request body or the document is larger than the size limits of
        the server. The snapshot history never causes this status, because
        the server removes its oldest snapshots.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BuilderUnprocessable:
      description: >
        The request is well formed, but the server cannot apply it. Examples
        are a document that fails validation, or a config that the server
        cannot convert.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BuilderIconNotFound:
      description: >
        No icon of the icon library has the name in the path, nor keeps it
        as an alias, ignoring case. The message never repeats the path.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BuilderTemplateNotFound:
      description: >
        The library holds no template or collection with the ID in the path.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BuilderTemplateConflict:
      description: >-
        This version of phenix cannot read the library record, or the request
        names a built-in or preloaded item (`source` `builtin` or `preloaded`),
        which nobody can change. For such an item the code is
        `template.item.read-only`, and `message` names the item and says to
        duplicate it into the library.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BuilderTemplatePreconditionFailed:
      description: >-
        Another user changed the template or collection after the caller
        read it, so If-Match does not name its current content
        (`template.item.stale`). Reload the library and apply the change
        again. The `ETag` header has the current entity tag.
      headers:
        ETag:
          $ref: "#/components/headers/BuilderTemplateETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BuilderTemplateTooLarge:
      description: >
        The request body is larger than the route allows (6 MiB to add
        templates, 1 MiB to replace one, 64 KiB otherwise). Or the library
        would hold more than 200 templates, 50 collections or 200 templates
        in one collection, or use more than 512 KiB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BuilderTemplateUnprocessable:
      description: >
        The request is well formed, but the server cannot apply it. `message`
        says why. It names a template that is not valid by its place in the
        request and the field. Examples are `templates[0].name: a template needs
        a name` or `templates[0].device.icon: icon name "a b" must be 1 to
        64 letters, digits, "_", "@", "." or "-"`. The server refuses a
        collection for its name, its description, or a template that the
        library does not hold or that the collection names twice.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BuilderTemplateBusy:
      description: >
        The library kept changing during the request. Try again.
      headers:
        Retry-After:
          description: seconds to wait before trying again
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BuilderLayerSetNotFound:
      description: >
        No layer set has the ID in the path.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BuilderLayerSetReadOnly:
      description: >
        The role of the caller does not have a permission that the operation
        requires. Or the path names a built-in layer set, which nobody can
        change or delete (`layerset.read-only`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BuilderLayerSetDamaged:
      description: >
        This version of phenix cannot read the record of the layer set.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BuilderLayerSetPreconditionFailed:
      description: >
        The If-Match header does not name the current content of the layer
        set (`layerset.stale`). The response carries the current entity tag.
      headers:
        ETag:
          $ref: "#/components/headers/BuilderLayerSetETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BuilderLayerSetTooLarge:
      description: >
        The request body is larger than 1 MiB. Or the library holds 200
        layer sets, the most it can hold (`layerset.library.full`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BuilderLayerSetUnprocessable:
      description: >
        The layer set does not validate (`layerset.invalid`). `issues` lists
        each problem with its code and its path in the set, such as
        `layers[0].matchers.general.hostname` with the code
        `layer.matcher-pattern.invalid`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BuilderLayerSetBusy:
      description: >
        The layer set kept changing during the request. Try again.
      headers:
        Retry-After:
          description: seconds to wait before trying again
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    IdempotencyKeyInFlight:
      description: >-
        the server is still serving a request with the same `Idempotency-Key`.
        `Retry-After` says when to try again
      headers:
        Retry-After:
          description: seconds to wait before trying again
          schema:
            type: integer
            example: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    IdempotencyKeyReused:
      description: >-
        the same user already used the `Idempotency-Key` on the same path, for a
        request with another body or query
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    # Config revisions: conditional reads and writes of one config.
    ConfigNotModified:
      description: the config is still at the `If-None-Match` revision
      headers:
        ETag:
          $ref: "#/components/headers/ConfigETag"
    ConfigPreconditionFailed:
      description: >-
        the config is no longer at the `If-Match` revision, or does not exist.
        `metadata.revision` holds its current revision
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PartialContent:
      description: the requested range of the file
      headers:
        Content-Range:
          $ref: "#/components/headers/ContentRange"
        ETag:
          $ref: "#/components/headers/ETag"
        Repr-Digest:
          $ref: "#/components/headers/ReprDigest"
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    NotModified:
      description: the file still has the `If-None-Match` ETag
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
    PreconditionFailed:
      description: the file no longer has the `If-Match` ETag
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RangeNotSatisfiable:
      description: the range starts past the end of the file
      headers:
        Content-Range:
          description: "`bytes */<size>`"
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BuilderServerError:
      description: >-
        The server could not read or write its store, or failed in another
        way. `message` says why.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
