        "404":
          $ref: "#/components/responses/BuilderNotFound"
    delete:
      tags:
        - Builder
      summary: Delete one snapshot of a Builder draft
      description: >
        Requires `configs` `update`, and for another user's draft an edit
        share, or `builder-drafts` `update`. Removes the snapshot from the
        history and deletes its content. The snapshot the cursor points at
        (the current version) cannot be deleted; the cursor keeps pointing at
        it. A last publication naming the deleted snapshot is kept; the draft
        is then `dirty`.
      operationId: deleteBuilderDraftSnapshot
      parameters:
        - $ref: "#/components/parameters/BuilderIfMatch"
      responses:
        "200":
          description: snapshot deleted; the draft without its document
          headers:
            ETag:
              $ref: "#/components/headers/BuilderETag"
            Warning:
              $ref: "#/components/headers/BuilderWarning"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderDraft"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "409":
          description: >
            The snapshot is the current version, or the draft changed while
            the request was handled.
          content:
