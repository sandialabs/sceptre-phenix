          type: array
          items:
            $ref: "#/components/schemas/Config"
    Config:
      title: "Config"
      description: "Schema describing the Config resource."
      type: object
      properties:
        apiVersion:
          title: "API Version"
          description: "API version that identifies the resource representation."
          example: phenix.sandia.gov/v1
          type: string
        kind:
          title: "Kind"
          description: "Kind of configuration resource."
          example: Topology
          type: string
        metadata:
          title: "Metadata"
          description: "Metadata associated with the configuration resource."
          type: object
          properties:
            name:
              title: "Name"
              description: "Name used to identify this resource or entry."
              example: example-name
              type: string
            created:
              title: "Created"
              description: "Time when the resource was created."
              example: "2026-01-01T00:00:00Z"
              type: string
              format: date-time
              readOnly: true
            updated:
              title: "Updated"
              description: "Time when the resource was last updated."
              example: "2026-01-02T00:00:00Z"
              type: string
              format: date-time
              readOnly: true
            annotations:
              title: "Annotations"
              description: "String-valued annotations associated with the configuration resource."
              type: object
              additionalProperties:
                type: string
          required:
            - name
        spec:
          title: "Spec"
          description: "Configuration specification for the resource."
          type: object
          additionalProperties: true
      required:
        - apiVersion
        - kind
        - metadata
        - spec
    Experiments:
      title: "Experiments"
      description: "Schema describing the Experiments resource."
      type: object
      properties:
        experiments:
          title: "Experiments"
          description: "Experiments returned by the API."
          type: array
          items:
            $ref: "#/components/schemas/Experiment"
    Experiment:
      title: "Experiment"
      description: "Schema describing the Experiment resource."
      type: object
      properties:
        id:
          title: "Id"
          description: "Unique identifier of the experiment."
          example: experiment-01
          type: string
        name:
          title: "Name"
          description: "Name used to identify this resource or entry."
          example: example-name
          type: string
        topology:
          title: "Topology"
          description: "Topology configuration embedded in or referenced by this resource."
          example: example-topology
          type: string
        scenario:
          title: "Scenario"
          description: "Scenario configuration embedded in or referenced by this resource."
          example: example-scenario
          type: string
        apps:
          title: "Apps"
          description: "Applications configured for this scenario."
          type: array
          items:
            type: string
        start_time:
          title: "Start Time"
          description: "Time when the experiment started."
          example: "2026-01-01T00:00:00Z"
          type: string
          format: date-time
        running:
          title: "Running"
          description: "Whether the experiment or VM is currently running."
          example: false
          type: boolean
        status:
          title: "Status"
          description: "Current lifecycle status of the experiment or VM."
          example: started
          type: string
        vm_count:
          title: "VM Count"
          description: "Number of VMs associated with the experiment."
          example: 1
          type: integer
        delayed_vms:
          title: "Delayed VMs"
          description: "Number of VMs waiting for a delayed start condition."
          example: 1
          type: integer
        vlan_min:
          title: "VLAN Min"
          description: "Lowest VLAN ID allocated to the experiment."
          example: 1
          type: integer
        vlan_max:
          title: "VLAN Max"
          description: "Highest VLAN ID allocated to the experiment."
          example: 1
          type: integer
        vlan_count:
          title: "VLAN Count"
          description: "Number of VLANs allocated to the experiment."
          example: 1
          type: integer
        vlans:
          title: "VLANs"
          description: "VLAN IDs and aliases allocated to the experiment."
          type: array
          items:
            type: object
            properties:
              vlan:
                title: "VLAN"
                description: "VLAN alias or identifier assigned to the interface."
                example: 1
                type: integer
              alias:
                title: "Alias"
                description: "Alias assigned to this VLAN ID."
                example: EXP-1
                type: string
        vms:
          title: "VMs"
          description: "Virtual machines associated with the experiment."
          type: array
          items:
            $ref: "#/components/schemas/VM"
    VMs:
      title: "VMs"
      description: "Schema describing the VMs resource."
      type: object
      properties:
        vms:
          title: "VMs"
          description: "Virtual machines returned by the API."
          type: array
          items:
            $ref: "#/components/schemas/VM"
    VM:
      title: "VM"
      description: "Schema describing the VM resource."
      type: object
      properties:
        name:
          title: "Name"
          description: "Name used to identify this resource or entry."
          example: example-name
          type: string
        experiment:
          title: "Experiment"
          description: "Name of the experiment containing the VM."
          example: example-experiment
          type: string
        host:
          title: "Host"
          description: "Cluster host assigned to or running the VM."
          example: compute-01
          type: string
        ipv4:
          title: "IPv4"
          description: "IPv4 addresses assigned to the virtual machine."
          type: array
          items:
            type: string
        cpus:
          title: "CPUs"
          description: "Number of virtual CPUs assigned to the VM."
          example: 1
          type: integer
        ram:
          title: "RAM"
          description: "Memory assigned to the VM, in megabytes."
          example: 1
          type: integer
        disk:
          title: "Disk"
          description: "Disk image or disk path used by the VM."
          example: ubuntu.qc2
          type: string
        dnb:
          title: "Do Not Boot"
          description: "Whether the VM should remain powered off."
          example: false
          type: boolean
        networks:
          title: "Networks"
          description: "Networks connected to the VM."
          type: array
          items:
            type: string
        taps:
          title: "Taps"
          description: "Tap interfaces associated with the VM."
          type: array
          items:
            type: string
        captures:
          title: "Captures"
          description: "Packet captures associated with the VM or experiment."
          type: array
          items:
            $ref: "#/components/schemas/Capture"
        running:
          title: "Running"
          description: "Whether the experiment or VM is currently running."
          example: false
          type: boolean
        busy:
          title: "Busy"
          description: "Whether an operation is currently acting on the VM."
          example: false
          type: boolean
        state:
          title: "State"
          description: "Current minimega state of the VM."
          example: running
          type: string
        cd_rom:
          title: "CD-ROM"
          description: "Disk currently mounted in the VM CD-ROM drive."
          example: tools.iso
          type: string
        tags:
          title: "Tags"
          description: "String tags associated with the VM."
          type: object
          additionalProperties:
            type: string
        cc_active:
          title: "Miniccc Active"
          description: "Whether the VM has an active miniccc connection."
          example: false
          type: boolean
        external:
          title: "External"
          description: "Whether the VM represents an external node outside minimega."
          example: false
          type: boolean
        delayed_start:
          title: "Delayed Start"
          description: "Description of the VM start delay, if any."
          example: timer:30s
          type: string
        snapshot:
          title: "Snapshot"
          description: "Whether to take a VM disk snapshot."
          example: false
          type: boolean
        inject_partition:
          title: "Inject Partition"
          description: "Disk partition used for file injection."
          example: 1
          type: integer
        description:
          title: "Description"
          description: "Human-readable description of this resource or entry."
          example: Example resource
          type: string
        uptime:
          title: "Uptime"
          description: "Elapsed time since the host or VM started."
          example: 1
          type: number
          format: float
        screenshot:
          title: "Screenshot"
          description: "Base64-encoded screenshot data URL, when requested."
          example: data:image/png;base64,aGVsbG8=
          type: string
    Schedule:
      title: "Schedule"
      description: "Schema describing the Schedule resource."
      type: object
      properties:
        schedule:
          title: "Schedule"
          description: "VM-to-host placement assignments."
          type: array
          items:
            type: object
            properties:
              vm:
                title: "VM"
                description: "Name of the VM associated with this result."
                example: node-01
                type: string
              host:
                title: "Host"
                description: "Cluster host assigned to or running the VM."
                example: compute-01
                type: string
              auto_assigned:
                title: "Auto Assigned"
                description: "Whether the scheduler selected this host automatically."
                example: false
                type: boolean
    Captures:
      title: "Captures"
      description: "Schema describing the Captures resource."
      type: object
      properties:
        captures:
          title: "Captures"
          description: "Packet captures associated with the VM or experiment."
          type: array
          items:
            $ref: "#/components/schemas/Capture"
    Capture:
      title: "Capture"
      description: "Schema describing the Capture resource."
      type: object
      properties:
        vm:
          title: "VM"
          description: "Name of the VM associated with this result."
          example: node-01
          type: string
        interface:
          title: "Interface"
          description: "Network interface index used for the packet capture."
          example: 1
          type: integer
        filepath:
          title: "Filepath"
          description: "Path to the packet capture file."
          example: /phenix/captures/capture.pcap
          type: string
    Snapshots:
      title: "Snapshots"
      description: "Schema describing the Snapshots resource."
      type: object
      properties:
        snapshots:
          title: "Snapshots"
          description: "Snapshot names available for the VM."
          type: array
          items:
            type: string
    Files:
      title: "Files"
      description: "Schema describing the Files resource."
      type: object
      properties:
        files:
          title: "Files"
          description: "Files available for the experiment."
          type: array
          items:
            type: string
    Hosts:
      title: "Hosts"
      description: "Schema describing the Hosts resource."
      type: object
      properties:
        hosts:
          title: "Hosts"
          description: "Host-specific application settings."
          type: array
          items:
            $ref: "#/components/schemas/Host"
    Host:
      title: "Host"
      description: "Schema describing the Host resource."
      type: object
      properties:
        name:
          title: "Name"
          description: "Name used to identify this resource or entry."
          example: example-name
          type: string
        cpus:
          title: "CPUs"
          description: "Number of CPUs available on the cluster host."
          example: 1
          type: integer
        load:
          title: "Load"
          description: "One-, five-, and fifteen-minute load averages reported for the cluster host."
          example:
            - "0.50"
            - "0.75"
            - "1.00"
          type: array
          items:
            type: string
            example: "0.50"
        cpucommit:
          title: "CPU Commit"
          description: "Number of CPUs committed to virtual machines on the host."
          example: 2
          type: integer
        memused:
          title: "Memused"
          description: "Memory in use on the cluster host, in megabytes."
          example: 1
          type: integer
        memcommit:
          title: "Memory Commit"
          description: "Memory committed to virtual machines on the host, in megabytes."
          example: 2048
          type: integer
        memtotal:
          title: "Memtotal"
          description: "Total memory on the cluster host, in megabytes."
          example: 8192
          type: integer
        tx:
          title: "Transmit"
          description: "Transmit bandwidth value reported for the cluster host."
          example: 0.0
          type: number
          format: float
        rx:
          title: "Receive"
          description: "Receive bandwidth value reported for the cluster host."
          example: 0.0
          type: number
          format: float
        bandwidth:
          title: "Bandwidth"
          description: "Network bandwidth reported for the cluster host."
          example: "rx: 0.0 / tx: 0.0"
          type: string
        diskusage:
          title: "Disk Usage"
          description: "Disk usage percentages for phēnix and minimega on the host."
          type: object
          properties:
            diskphenix:
              title: "Phenix Disk Usage"
              description: "Percentage of the host filesystem used by phēnix."
              example: 42.5
              type: number
              format: float
            diskminimega:
              title: "Minimega Disk Usage"
              description: "Percentage of the host filesystem used by minimega."
              example: 35.0
              type: number
              format: float
        netcommit:
          title: "Network Commit"
          description: "Network capacity committed to virtual machines on the host."
          example: 0
          type: integer
        vms:
          title: "VMs"
          description: "Virtual machines returned by the API."
          example: 1
          type: integer
        uptime:
          title: "Uptime"
          description: "Elapsed time since the host or VM started."
          example: 1
          type: number
          format: float
        headnode:
          title: "Headnode"
          description: "Whether this host is the cluster headnode."
          example: false
          type: boolean
        schedulable:
          title: "Schedulable"
          description: "Whether the cluster host can run VMs."
          example: false
          type: boolean
    Applications:
      title: "Applications"
      description: "Schema describing the Applications resource."
      type: object
      properties:
        applications:
          title: "Applications"
          description: "Application names available to experiments."
          type: array
          items:
            type: string
    BuilderTopology:
      title: "Builder Topology"
      description: "Schema describing the Builder Topology resource."
      type: object
      required:
        - name
        - topology
        - builderXML
      properties:
        name:
          title: "Name"
          example: example-name
          type: string
          description: topology name; ignored by PUT /builder/topologies/{name}
        topology:
          title: "Topology"
          type: object
          description: generated topology spec
          properties:
            nodes:
              title: "Nodes"
              description: "Nodes that make up the topology."
              type: array
              items:
                type: object
        builderXML:
          title: "Builder XML"
          example: <mxGraphModel/>
          type: string
          description: mxGraph document for the diagram
        vlans:
          title: "VLANs"
          type: object
          description: VLAN alias to ID, used by the experiment endpoints only
          additionalProperties:
            type: integer
        scenario:
          title: "Scenario"
          example: example-scenario
          type: string
          description: scenario name, used by the experiment endpoints only
    Topologies:
      title: "Topologies"
      description: "Schema describing the Topologies resource."
      type: object
      properties:
        topologies:
          title: "Topologies"
          description: "Topology names returned by the API."
          type: array
          items:
            type: string
    Disks:
      title: "Disks"
      description: "Schema describing the Disks resource."
      type: object
      properties:
        disks:
          title: "Disks"
          description: "Disk image names available to the server."
          type: array
          items:
            type: string
    Users:
      title: "Users"
      description: "Schema describing the Users resource."
      type: object
      properties:
        users:
          title: "Users"
          description: "Users returned by the API."
          type: array
          items:
            $ref: "#/components/schemas/User"
    User:
      title: "User"
      description: "Schema describing the User resource."
      type: object
      properties:
        username:
          title: "Username"
          description: "Username used to identify the account."
          example: user@example.org
          type: string
        first_name:
          title: "First Name"
          description: "User given name."
          example: Alex
          type: string
        last_name:
          title: "Last Name"
          description: "User family name."
          example: Example
          type: string
        role:
          title: "Role"
          description: "Role and policies assigned to the user."
          type: object
          properties:
            name:
              title: "Name"
              description: "Name used to identify this resource or entry."
              example: example-name
              type: string
            policies:
              title: "Policies"
              description: "Access policies assigned to this role."
              type: array
              items:
                type: object
                properties:
                  resources:
                    title: "Resources"
                    description: "Resource types covered by this policy."
                    type: array
                    items:
                      type: string
                  resourceNames:
                    title: "Resource Names"
                    description: "Resource names covered by this policy."
                    type: array
                    items:
                      type: string
                  verbs:
                    title: "Verbs"
                    description: "Actions allowed on the listed resources."
                    type: array
                    items:
                      type: string
        resource_names:
          title: "Resource Names"
          description: "Resource names assigned to the user."
          type: array
          items:
            type: string
        proxy_token:
          title: "Proxy Token"
          description: "Authentication token supplied by a trusted proxy."
          example: proxy-token-example
          type: string
          readOnly: true
    Credentials:
      title: "Credentials"
      description: "Schema describing the Credentials resource."
      type: object
      properties:
        user:
          title: "User"
          description: "Whether node start requires user confirmation."
          $ref: "#/components/schemas/User"
        token:
          title: "Token"
          description: "Authentication token returned for subsequent API requests."
          example: eyJhbGciOi...example
          type: string
    Workflow:
      type: object
      title: Workflow
      description: >-
        A phenix workflow config: what applying a workflow branch creates,
        updates or restarts one experiment from.
      additionalProperties: false
      required:
        - apiVersion
        - kind
        - spec
      properties:
        apiVersion:
          example: phenix.sandia.gov/v0
          type: string
          title: API Version
          description: The config API version; a workflow config is phenix.sandia.gov/v0.
          enum:
            - phenix.sandia.gov/v0
        kind:
          example: Workflow
          type: string
          title: Kind
          description: The config kind, which is always Workflow.
          enum:
            - Workflow
        metadata:
          type: object
          title: Metadata
          description: >-
            Not read by the server; it is accepted so a workflow config has the
            same four top-level keys as every other phenix config, and so a later
            version can carry a name or annotations without a breaking change.
          nullable: true
        spec:
          type: object
          title: Workflow Spec
          description: >-
            What an apply may do and the experiment settings it sets; an empty
            spec applies every default.
          additionalProperties: false
          properties:
            auto:
              type: object
              title: Auto
              description: What an apply may do to the experiment mapped to the workflow branch without being asked.
              nullable: true
              additionalProperties: false
              properties:
                create:
                  example: example
                  type: string
                  title: Create
                  description: >-
                    The name of the experiment to create when none is mapped to
                    the branch; unset never creates one.
                  nullable: true
                update:
                  example: false
                  type: boolean
                  title: Update
                  description: >-
                    Whether an apply may update the experiment already mapped to
                    the branch; defaults to true when unset.
                  nullable: true
                restart:
                  example: false
                  type: boolean
                  title: Restart
                  description: >-
                    Whether an apply may start a new or updated experiment and
                    stop and restart a running one; defaults to true when unset.
                  nullable: true
            topology:
              example: example-topology
              type: string
              title: Topology
              description: >-
                The name of the topology config; required to create an
                experiment, and on an update defaults to the experiment's
                current topology.
              nullable: true
            scenario:
              example: example-scenario
              type: string
              title: Scenario
              description: The name of the scenario config; on an update defaults to the experiment's current scenario.
              nullable: true
            vlans:
              type: object
              title: VLANs
              description: >-
                VLAN alias to VLAN ID; every alias used by an interface in the
                topology is set to its ID here, or left for minimega to pick
                when not listed.
              nullable: true
              additionalProperties:
                type: integer
            schedules:
              type: object
              title: Schedules
              description: >-
                VM hostname to cluster host; each listed non-external node of
                the topology is scheduled on that host.
              nullable: true
              additionalProperties:
                type: string
            deployMode:
              example: all
              type: string
              title: Deploy Mode
              description: >-
                Where VMs are deployed, all, no-headnode or only-headnode in any
                letter case; unset or empty uses the server's deploy-mode
                setting.
              nullable: true
              pattern: '^(?i:all|no-headnode|only-headnode)?$'
            useGREMesh:
              example: false
              type: boolean
              title: Use GRE Mesh
              description: >-
                Whether the experiment uses a GRE mesh between cluster hosts; it
                is OR-ed with the server's use-gre-mesh setting, so either turns
                it on.
              nullable: true
            vlanRange:
              type: object
              title: VLAN Range
              description: The range of VLAN IDs the experiment may allocate from; unset leaves both ends unset.
              nullable: true
              additionalProperties: false
              properties:
                min:
                  example: 1
                  type: integer
                  title: Minimum
                  description: The lowest VLAN ID the experiment may use; 0 leaves the minimum unset.
                  nullable: true
                max:
                  example: 1
                  type: integer
                  title: Maximum
                  description: The highest VLAN ID the experiment may use; 0 leaves the maximum unset.
                  nullable: true
            defaultBridge:
              example: phenix
              type: string
              title: Default Bridge
              description: >-
                The bridge the experiment's VMs attach to by default; defaults to
                phenix, is at most 15 characters (the Linux interface name
                limit), and unless it is phenix no other experiment may use it.
              nullable: true
              maxLength: 15
    WorkflowResult:
      title: "Workflow Result"
      description: "Schema describing the Workflow Result resource."
      type: object
      properties:
        action:
          title: "Action"
          description: "Action planned or performed by the workflow."
          example: create
          type: string
          enum:
            - none
            - create
            - createAndStart
            - update
            - updateAndStart
            - restart
        experiment:
          title: "Experiment"
          example: example-experiment
          type: string
          description: experiment the action applies to (empty when no experiment is involved)
        reason:
          title: "Reason"
          example: No changes are needed.
          type: string
          description: why nothing was done, when action is none
        dryRun:
          title: "Dry Run"
          example: false
          type: boolean
          description: true when nothing was changed because dryRun was requested
    WorkflowConfigResult:
      title: "Workflow Config Result"
      type: object
      description: what POST /workflow/configs/{branch}?dryRun=true would do
      properties:
        action:
          title: "Action"
          example: create
          type: string
          enum:
            - create
            - update
          description: whether the request would create the config or update the stored one
        kind:
          title: "Kind"
          example: Topology
          type: string
          description: the config's kind, e.g. Topology
        name:
          title: "Name"
          example: example-name
          type: string
          description: the config's name after the server filled in its placeholders, such as ${BRANCH_NAME}
        dryRun:
          title: "Dry Run"
          example: false
          type: boolean
          description: always true
        pending:
          title: "Pending"
          example: Topology/example-topology
          type: string
          description: >
            the value to pass as pending to a dry run of
            POST /workflow/apply/{branch}: Kind/name, followed for a scenario by
            ?from=...&topology=... (its fromScenario names and topology
            annotation) and for a topology that includes others by ?include=...
    Options:
      title: "Options"
      description: "Schema describing the Options resource."
      type: object
      properties:
        bridge-mode:
          title: "Bridge Mode"
          description: "Bridge mode configured on the server."
          example: native
          type: string
        deploy-mode:
          title: "Deploy Mode"
          description: "Default VM deployment mode configured on the server."
          example: all
          type: string
        use-gre-mesh:
          title: "Use Gre Mesh"
          description: "Whether the server uses a GRE mesh between cluster hosts."
          example: false
          type: boolean
        base-dir.injects:
          title: "Inject Directory"
          example: /phenix/injects
          type: string
          description: directory phenix workflow apply stages injects into
        workflow-dry-run:
          title: "Workflow Dry Run"
          example: false
          type: boolean
          description: >
            true when POST /workflow/configs/{branch} and POST /workflow/apply/{branch}
            support dryRun, and apply supports pending and expect
    Error:
      title: "Error"
      description: "Schema describing the Error resource."
      type: object
      properties:
        message:
          title: "Message"
          example: Request could not be completed.
          type: string
          description: what went wrong; for a config validation failure, the first explained line
        cause:
          title: "Cause"
          example: Resource not found.
          type: string
          description: the underlying error text
        metadata:
          title: "Metadata"
          type: object
          description: extra details, returned for some errors
          properties:
            validation:
              title: "Validation"
              example: example
              type: string
              description: >
                for a schema validation failure, the explained lines separated by
                newlines, each in the form <item> "<hostname|name>" (line N): <what>
                (at <sub-path>), with (line N) left out for single-line sources and
                an extra hint line for a misplaced key; an error that cannot be
                placed in the source (in a templated key, in data a config hook
                added, in a YAML merge key, or a missing or misindented
                metadata.name) keeps the validator's text; for an unparsable body
                sent to POST /configs, the parser error
            validation-raw:
              title: "Validation Raw"
              example: example
              type: string
              description: for a schema validation failure, the original validator text
          additionalProperties:
            type: string
