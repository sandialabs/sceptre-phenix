openapi: 3.0.0
info:
  description: phenix API
  version: 0.0.0
  title: phenix
  contact:
    url: https://github.com/sandialabs/sceptre-phenix
  license:
    name: GNU General Public License v3.0
tags:
  - name: Configs
    description: Config details and controls
  - name: Schemas
    description: Config spec schemas
  - name: Experiments
    description: Experiments details and controls
  - name: Virtual Machines
    description: Experiment VM details and controls
  - name: Hosts
    description: Cluster host details
  - name: Applications
    description: Available phenix user applications
  - name: Topologies
    description: Available phenix topologies
  - name: Disks
    description: Available phenix disk images
  - name: Users
    description: User details and controls
  - name: Workflow
    description: Workflow config upserts and applies, and the server options clients read
  - name: Builder
    description: >
      Builder drafts, snapshots, generation and publication. Every operation
      needs the one Builder permission: the verb `use` on the resource
      `builder`. A role that holds it may read, change and delete every
      draft, template, icon and layer set, whoever made them. No permission
      applies to one draft, template, icon or layer set. Some operations read
      or write phenix configs: publish, import, export, sources, packages,
      preflight checks and published documents. Each of these operations
      also needs the config permissions that its description names.

      The icon library belongs to the server. Each icon has a name that is
      unique, ignoring case. Any caller may rename or delete an uploaded
      icon. No caller may rename or delete an icon of the server template
      files.

      The template library belongs to the server. Built-in templates and the
      items of the server template files are read only.

      Every response of a Builder operation carries
      `X-Content-Type-Options: nosniff` and `Cache-Control: no-store`,
      whatever its status, 304 included.

      `OPTIONS` on the path of any Builder operation answers 204 with the
      `Allow` header of that path. It reads and changes nothing.
paths:
  "/configs":
    get:
      tags:
        - Configs
      summary: Get all phenix configs
      description: ""
      operationId: getConfigs
      parameters:
        - name: kind
          in: query
          description: limit configs to specified kind (defaults to all)
          required: false
          schema:
            type: string
            enum:
              - all
              - topology
              - scenario
              - experiment
              - image
              - user
              - role
            default: all
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Configs"
    post:
      tags:
        - Configs
      summary: Create new phenix config
      description: >
        Needs `configs` `create` on the config the body names, by its kind
        and name (such as `Topology/lab`). The server replaces each
        `${BRANCH_NAME}` placeholder with a value from its environment. It
        stores every other `${NAME}` placeholder as written.
      operationId: postConfigs
      requestBody:
        description: phenix config creation parameters
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Config"
          application/x-yaml:
            schema:
              $ref: "#/components/schemas/Config"
          multipart/form-data:
            schema:
              type: object
              properties:
                fileupload:
                  type: string
                  format: binary
      responses:
        "201":
          description: successful config creation
          headers:
            Location:
              schema:
                description: location of newly created config
                type: string
                format: uri
        "400":
          description: >
            unknown content type or file extension, unparsable body (the parser
            error in metadata.validation), unknown kind, a config with the same
            name that already exists, a schema validation failure (explained
            lines in metadata.validation, original validator text in
            metadata.validation-raw), or a config hook or the store rejects the
            config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: creating configs is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the request or the uploaded file cannot be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/configs/{kind}/{name}":
    get:
      tags:
        - Configs
      summary: Get existing phenix config
      description: ""
      operationId: getConfigsKindName
      parameters:
        - name: kind
          in: path
          description: kind of phenix config to get
          required: true
          schema:
            type: string
        - name: name
          in: path
          description: name of phenix config to get
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: content format for response
          required: false
          schema:
            type: string
            enum:
              - application/json
              - application/x-yaml
            default: application/json
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/Config"
    put:
      tags:
        - Configs
      summary: Update existing phenix config
      description: >
        Can also be used to rename a config by changing the name in the metadata
        portion of the config header and using the old name in the request path.
        Renaming a Topology, or changing its kind, removes the Builder
        documents published under its old name, as deleting it does. The
        `builder-doc` annotation of the renamed config loses the `id` and the
        `digest` that Publish wrote. The annotation keeps a `path`, and the
        `digest` beside that `path`. The server removes the annotation when it
        is empty (see `BuilderDocumentReference`). Needs `configs` `update` on
        the config of the path and, when the body names another kind or name,
        on that config too. The server replaces each `${BRANCH_NAME}`
        placeholder with a value from its environment. It stores every other
        `${NAME}` placeholder as written.
      operationId: putConfigsKindName
      parameters:
        - name: kind
          in: path
          description: kind of phenix config to get
          required: true
          schema:
            type: string
        - name: name
          in: path
          description: name of phenix config to get
          required: true
          schema:
            type: string
      requestBody:
        description: phenix config update parameters
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Config"
          application/x-yaml:
            schema:
              $ref: "#/components/schemas/Config"
          multipart/form-data:
            schema:
              type: object
              properties:
                fileupload:
                  type: string
                  format: binary
      responses:
        "204":
          description: successful config update
          headers:
            Location:
              schema:
                description: location of updated config
                type: string
                format: uri
        "400":
          description: >
            unknown content type or file extension, a config that does not exist,
            an unknown kind, a schema validation failure (explained lines in
            metadata.validation, original validator text in
            metadata.validation-raw), or a config hook or the store rejects the
            config; for an Experiment config, also a failure to reconfigure the
            experiment after the updated config was stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: updating the config is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the request or the uploaded file cannot be read or parsed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - Configs
      summary: Delete existing phenix config
      description: ""
      operationId: deleteConfigsKindName
      parameters:
        - name: kind
          in: path
          description: kind of phenix config to delete
          required: true
          schema:
            type: string
        - name: name
          in: path
          description: name of phenix config to delete
          required: true
          schema:
            type: string
      responses:
        "204":
          description: successful operation
  "/schemas/{version}":
    get:
      tags:
        - Schemas
      summary: Get full schema (all config specs) for specific version
      description: >
        Each version's schema file holds the schemas of the config kinds stored
        at that version, and a config is validated against the file of its own
        apiVersion: v0 holds Workflow; v1 holds Topology, Experiment, Image,
        User and Role; v2 holds Scenario.
      operationId: getSchemasVersion
      parameters:
        - name: version
          in: path
          description: version of phenix config schema to get
          required: true
          schema:
            type: string
            enum:
              - "v0"
              - "v1"
              - "v2"
        - name: Accept
          in: header
          description: content format for response
          required: false
          schema:
            type: string
            enum:
              - application/json
              - application/x-yaml
            default: application/json
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            application/x-yaml:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: unknown version or Accept content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: getting schemas is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/schemas/{kind}/{version}":
    get:
      tags:
        - Schemas
      summary: Get schema for specific config spec kind/version
      description: >
        A kind's schema exists only in the version it is stored at, the version
        its configs are validated against: Workflow in v0, Scenario in v2, and
        every other kind in v1.
      operationId: getSchemasKindVersion
      parameters:
        - name: kind
          in: path
          description: kind of phenix config schema to get
          required: true
          schema:
            type: string
            enum:
              - topology
              - scenario
              - experiment
              - image
              - user
              - role
              - workflow
        - name: version
          in: path
          description: version of phenix config schema to get
          required: true
          schema:
            type: string
            enum:
              - "v0"
              - "v1"
              - "v2"
        - name: Accept
          in: header
          description: content format for response
          required: false
          schema:
            type: string
            enum:
              - application/json
              - application/x-yaml
            default: application/json
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            application/x-yaml:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: unknown Accept content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: getting this schema is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            there is no schema for this kind or version, such as a v1 kind
            requested at v2, or an unknown version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
  "/experiments":
    get:
      tags:
        - Experiments
      summary: Get all phenix experiments
      description: ""
      operationId: getExperiments
      parameters:
        - name: screenshot
          in: query
          description: whether or not to include VM screenshots (value is size to grab)
          required: false
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiments"
    post:
      tags:
        - Experiments
      summary: Create new phenix experiment
      description: ""
      operationId: postExperiments
      requestBody:
        description: phenix experiment creation parameters
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                topology:
                  type: string
                apps:
                  type: array
                  items:
                    type: string
                vlan_min:
                  type: integer
                vlan_max:
                  type: integer
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
  "/experiments/{name}":
    get:
      tags:
        - Experiments
      summary: Get existing phenix experiment
      description: ""
      operationId: getExperimentsName
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get
          required: true
          schema:
            type: string
        - name: screenshot
          in: query
          description: whether or not to include VM screenshots (value is size to grab)
          required: false
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
    delete:
      tags:
        - Experiments
      summary: Delete existing phenix experiment
      description: ""
      operationId: deleteExperimentsName
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to delete
          required: true
          schema:
            type: string
      responses:
        "204":
          description: successful operation
  "/experiments/{name}/start":
    post:
      tags:
        - Experiments
      summary: Start existing phenix experiment
      description: ""
      operationId: postExperimentsNameStart
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to start
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
  "/experiments/{name}/stop":
    post:
      tags:
        - Experiments
      summary: Stop existing phenix experiment
      description: ""
      operationId: postExperimentsNameStop
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to stop
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
  "/experiments/{name}/schedule":
    get:
      tags:
        - Experiments
      summary: Get current schedule for existing experiment
      description: ""
      operationId: getExperimentsNameSchedule
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get schedule for
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
    post:
      tags:
        - Experiments
      summary: Update current schedule for existing experiment
      description: ""
      operationId: postExperimentsNameSchedule
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to update schedule for
          required: true
          schema:
            type: string
      requestBody:
        description: scheduling algorithm to use
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                algorithm:
                  type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
  "/experiments/{name}/captures":
    get:
      tags:
        - Experiments
      summary: Get captures for existing experiment
      description: ""
      operationId: getExperimentsNameCaptures
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get captures for
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Captures"
  "/experiments/{name}/files":
    get:
      tags:
        - Experiments
      summary: Get list of files for experiment
      description: ""
      operationId: getExperimentsNameFiles
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get files for
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Files"
  "/experiments/{name}/files/{filename}":
    get:
      tags:
        - Experiments
      summary: Download experiment file
      description: ""
      operationId: getExperimentsNameFilesFilename
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get file from
          required: true
          schema:
            type: string
        - name: filename
          in: path
          description: name of file download
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  "/experiments/{exp_name}/vms":
    get:
      tags:
        - Virtual Machines
      summary: get all VMs in existing experiment
      description: ""
      operationId: getExperimentsNameVms
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment to get VMs for
          required: true
          schema:
            type: string
        - name: screenshot
          in: query
          description: whether or not to include VM screenshots (value is size to grab)
          required: false
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMs"
  "/experiments/{exp_name}/vms/{vm_name}":
    get:
      tags:
        - Virtual Machines
      summary: get given VM in existing experiment
      description: ""
      operationId: getExperimentsNameVmName
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment to get VM from
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix experiment VM to get
          required: true
          schema:
            type: string
        - name: screenshot
          in: query
          description: whether or not to include VM screenshots (value is size to grab)
          required: false
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
    patch:
      tags:
        - Virtual Machines
      summary: Update existing VM settings in existing experiment
      description: ""
      operationId: patchExperimentsNameVmsName
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment to modify
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix virtual machine to modify
          required: true
          schema:
            type: string
      requestBody:
        description: phenix virtual machine patch parameters
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                host:
                  type: string
                cpus:
                  type: integer
                ram:
                  type: integer
                disk:
                  type: string
                dnb:
                  type: boolean
                interface:
                  type: object
                  properties:
                    index:
                      type: integer
                    vlan:
                      type: integer
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
    delete:
      tags:
        - Virtual Machines
      summary: Delete phenix experiment VM
      description: ""
      operationId: deleteExperimentsNameVmsName
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix virtual machine to delete
          required: true
          schema:
            type: string
      responses:
        "204":
          description: successful operation
  "/experiments/{exp_name}/vms/{vm_name}/start":
    post:
      tags:
        - Virtual Machines
      summary: start VM in experiment
      description: ""
      operationId: postExperimentsNameVMsNameStart
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM to start
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
  "/experiments/{exp_name}/vms/{vm_name}/stop":
    post:
      tags:
        - Virtual Machines
      summary: stop VM in experiment
      description: ""
      operationId: postExperimentsNameVMsNameStop
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM to stop
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
  "/experiments/{exp_name}/vms/{vm_name}/redeploy":
    post:
      tags:
        - Virtual Machines
      summary: redeploy VM in experiment
      description: ""
      operationId: postExperimentsNameVMsNameRedeploy
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM to redeploy
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
  "/experiments/{exp_name}/vms/{vm_name}/screenshot.png":
    get:
      tags:
        - Virtual Machines
      summary: Get screenshot of running VM in experiment
      description: ""
      operationId: getExperimentsNameVmsNameScreenshot
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix virtual machine to get screenshot from
          required: true
          schema:
            type: string
        - name: size
          in: query
          description: size of screenshot to grab
          required: false
          schema:
            type: string
        - name: base64
          in: query
          description: whether or not to base64 encode the screenshot image
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: successful operation
          content:
            image/png:
              schema:
                type: string
                format: base64
  "/experiments/{exp_name}/vms/{vm_name}/vnc/ws":
    get:
      tags:
        - Virtual Machines
      summary: Tunnel to VNC of running VM using a WebSocket
      description: ""
      operationId: getExperimentsNameVmsNameVncWs
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix virtual machine to connect to
          required: true
          schema:
            type: string
      responses:
        "101":
          description: switching protocols
  "/experiments/{exp_name}/vms/{vm_name}/captures":
    get:
      tags:
        - Virtual Machines
      summary: get phenix experiment VM packet captures
      description: ""
      operationId: getExperimentsNameVmsNameCaptures
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM to get captures for
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Captures"
    post:
      tags:
        - Virtual Machines
      summary: start phenix experiment VM packet capture
      description: ""
      operationId: postExperimentsNameVmsNameCapture
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM to start capture on
          required: true
          schema:
            type: string
      requestBody:
        description: phenix VM packet capture parameters
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                interface:
                  type: integer
                filename:
                  type: string
      responses:
        "204":
          description: successful operation
    delete:
      tags:
        - Virtual Machines
      summary: stop phenix experiment VM packet captures
      description: ""
      operationId: deleteExperimentsNameVmsNameCaptures
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM to stop captures on
          required: true
          schema:
            type: string
      responses:
        "204":
          description: successful operation
  "/experiments/{exp_name}/vms/{vm_name}/snapshots":
    get:
      tags:
        - Virtual Machines
      summary: get phenix experiment VM snapshots
      description: ""
      operationId: getExperimentsNameVmsNameSnapshots
      parameters:
        - name: exp_name
          in: path
