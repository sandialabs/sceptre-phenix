openapi: 3.0.0
info:
  description: phenix API
  version: 0.0.0
  title: phenix
  termsOfService: http://swagger.io/terms/
  contact:
    url: https://github.com/sandialabs/sceptre-phenix
  license:
    name: GNU General Public License v3.0
tags:
  - name: Configs
    description: Config details and controls
  - name: Schemas
    description: Config spec schemas
  - name: Experiments
    description: Experiments details and controls
  - name: Scorch
    description: >-
      SCORCH pipeline details and controls. A scenario's scorch app metadata
      defines one or more runs, each a pipeline of configure, start, loop,
      stop and cleanup stages built from the components it names. These
      endpoints report those pipelines and their latest statuses, and start,
      cancel, clear and clean up a run.
  - name: Virtual Machines
    description: Experiment VM details and controls
  - name: Hosts
    description: Cluster host details
  - name: Applications
    description: Available phenix user applications
  - name: Topologies
    description: Available phenix topologies
  - name: Builder
    description: Graphical topology Builder diagrams and the topologies built from them
  - name: Disks
    description: Available phenix disk images
  - name: Users
    description: User details and controls
  - name: State of Health
    description: State of health across experiments
  - name: Console
    description: >-
      minimega consoles in the web UI (the server must run with
      --minimega-console). A console belongs to the user who started it: only
      that user can check on it, attach to it, resize it, or end it, and
      another user's console is reported as not found. A console keeps running
      while websockets attach and detach, and ends when its process exits, when
      it is deleted, or once no websocket has been attached for 15 seconds.
  - name: Features
    description: >-
      The optional features this server has enabled, which the web UI reads to
      decide what to offer.
  - name: Tunneler
    description: >-
      phenix-tunneler builds this server offers for download. Like
      /features, and unlike the other endpoints here, these two are served
      from the server root rather than under /api/v1, and need neither
      credentials nor a permission, so each declares its own server.
paths:
  "/configs":
    get:
      tags:
        - Configs
      summary: Get all phenix configs
      description: ""
      operationId: getConfigs
      parameters:
        - name: kind
          in: query
          description: limit configs to specified kind (defaults to all)
          required: false
          schema:
            type: string
            enum:
              - all
              - topology
              - scenario
              - experiment
              - image
              - user
              - role
            default: all
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Configs"
    post:
      tags:
        - Configs
      summary: Create new phenix config
      description: ""
      operationId: postConfigs
      requestBody:
        description: phenix config creation parameters
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Config"
          application/x-yaml:
            schema:
              $ref: "#/components/schemas/Config"
          multipart/form-data:
            schema:
              type: object
              properties:
                fileupload:
                  type: string
                  format: binary
      responses:
        "201":
          description: successful config creation
          headers:
            Location:
              schema:
                description: location of newly created config
                type: string
                format: uri
  "/configs/{kind}/{name}":
    get:
      tags:
        - Configs
      summary: Get existing phenix config
      description: ""
      operationId: getConfigsKindName
      parameters:
        - name: kind
          in: path
          description: kind of phenix config to get
          required: true
          schema:
            type: string
        - name: name
          in: path
          description: name of phenix config to get
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: content format for response
          required: false
          schema:
            type: string
            enum:
              - application/json
              - application/x-yaml
            default: application/json
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/Config"
    put:
      tags:
        - Configs
      summary: Update existing phenix config
      description: >
        Can also be used to rename a config by changing the name in the metadata
        portion of the config header and using the old name in the request path.
      operationId: putConfigsKindName
      parameters:
        - name: kind
          in: path
          description: kind of phenix config to get
          required: true
          schema:
            type: string
        - name: name
          in: path
          description: name of phenix config to get
          required: true
          schema:
            type: string
      requestBody:
        description: phenix config update parameters
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Config"
          application/x-yaml:
            schema:
              $ref: "#/components/schemas/Config"
          multipart/form-data:
            schema:
              type: object
              properties:
                fileupload:
                  type: string
                  format: binary
      responses:
        "204":
          description: successful config update
          headers:
            Location:
              schema:
                description: location of updated config
                type: string
                format: uri
    delete:
      tags:
        - Configs
      summary: Delete existing phenix config
      description: ""
      operationId: deleteConfigsKindName
      parameters:
        - name: kind
          in: path
          description: kind of phenix config to delete
          required: true
          schema:
            type: string
        - name: name
          in: path
          description: name of phenix config to delete
          required: true
          schema:
            type: string
      responses:
        "204":
          description: successful operation
  "/schemas/{version}":
    get:
      tags:
        - Schemas
      summary: Get full schema (all config specs) for specific version
      description: ""
      operationId: getSchemasVersion
      parameters:
        - name: version
          in: path
          description: version of phenix config schema to get
          required: true
          schema:
            type: string
            enum:
              - "v1"
              - "v2"
        - name: Accept
          in: header
          description: content format for response
          required: false
          schema:
            type: string
            enum:
              - application/json
              - application/x-yaml
            default: application/json
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            application/x-yaml:
              schema:
                type: object
                additionalProperties: true
  "/schemas/{kind}/{version}":
    get:
      tags:
        - Schemas
      summary: Get schema for specific config spec kind/version
      description: ""
      operationId: getSchemasKindVersion
      parameters:
        - name: kind
          in: path
          description: kind of phenix config schema to get
          required: true
          schema:
            type: string
            enum:
              - topology
              - scenario
              - experiment
              - image
              - user
              - role
        - name: version
          in: path
          description: version of phenix config schema to get
          required: true
          schema:
            type: string
            enum:
              - "v1"
              - "v2"
        - name: Accept
          in: header
          description: content format for response
          required: false
          schema:
            type: string
            enum:
              - application/json
              - application/x-yaml
            default: application/json
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            application/x-yaml:
              schema:
                type: object
                additionalProperties: true
  "/experiments":
    get:
      tags:
        - Experiments
      summary: Get all phenix experiments
      description: ""
      operationId: getExperiments
      parameters:
        - name: screenshot
          in: query
          description: whether or not to include VM screenshots (value is size to grab)
          required: false
          schema:
            type: string
        - name: vms
          in: query
          description: >-
            set to false to leave each experiment's VMs out (`vms` is empty)
            and not ask minimega about them; `vm_count` and `delayed_vms` come
            from the topology. Ignored when screenshot is set.
          required: false
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiments"
    post:
      tags:
        - Experiments
      summary: Create new phenix experiment
      description: ""
      operationId: postExperiments
      requestBody:
        description: phenix experiment creation parameters
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - topology
              properties:
                name:
                  type: string
                topology:
                  type: string
                scenario:
                  type: string
                disabled_apps:
                  description: scenario apps to leave out of the experiment
                  type: array
                  items:
                    type: string
                vlan_min:
                  type: integer
                vlan_max:
                  type: integer
                workflow_branch:
                  description: >-
                    stored as the phenix.workflow/branch experiment annotation,
                    so `annotations` may not also set it
                  type: string
                deploy_mode:
                  type: string
                  enum: ["", no-headnode, only-headnode, all]
                default_bridge:
                  type: string
                use_gre_mesh:
                  type: boolean
                node_annotations:
                  description: >-
                    added to every VM in the experiment's copy of the topology
                    (the topology config is unchanged); a VM's own annotation
                    for the same key wins. Values keep their JSON type, and
                    phenix/default-apps must be a boolean,
                    phenix/startup-autotunnel a list of strings, and
                    vrouter/vyos-password and vrouter/enable-ssh strings.
                  type: object
                  additionalProperties: {}
                annotations:
                  description: >-
                    added to the experiment's metadata annotations; topology
                    and scenario are set by phenix and rejected
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "204":
          description: >-
            experiment created; it is announced to websocket clients as an
            experiment create event
        "400":
          description: invalid request, such as an annotation phenix rejects
        "403":
          description: forbidden
        "409":
          description: phenix is already acting on an experiment with this name
  "/experiments/{name}":
    get:
      tags:
        - Experiments
      summary: Get existing phenix experiment
      description: ""
      operationId: getExperimentsName
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get
          required: true
          schema:
            type: string
        - name: screenshot
          in: query
          description: whether or not to include VM screenshots (value is size to grab)
          required: false
          schema:
            type: string
        - name: vms
          in: query
          description: >-
            set to false to leave the VMs out (`vms` is empty) and not ask
            minimega about them; `vm_count` and `delayed_vms` come from the VMs
            configured in the topology. Ignored when screenshot is set.
          required: false
          schema:
            type: boolean
            default: true
        - name: filter
          in: query
          description: search expression the VMs must match
          required: false
          schema:
            type: string
        - name: show_dnb
          in: query
          description: any value includes the VMs marked do not boot
          required: false
          schema:
            type: string
        - name: sortCol
          in: query
          description: column to sort the VMs by, used with sortDir
          required: false
          schema:
            type: string
            enum: [name, host, uptime, delayed]
        - name: sortDir
          in: query
          description: sort direction, used with sortCol
          required: false
          schema:
            type: string
            enum: [asc, desc]
        - name: pageNum
          in: query
          description: page to return, from 1, used with perPage
          required: false
          schema:
            type: integer
            minimum: 1
        - name: perPage
          in: query
          description: VMs per page, used with pageNum
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: >-
            successful operation; `vms` holds the page asked for and
            `vm_count` how many VMs match, before paging
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
        "400":
          description: pageNum or perPage is not a whole number of at least 1
    delete:
      tags:
        - Experiments
      summary: Delete existing phenix experiment
      description: ""
      operationId: deleteExperimentsName
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to delete
          required: true
          schema:
            type: string
      responses:
        "204":
          description: successful operation
  "/experiments/{name}/start":
    post:
      tags:
        - Experiments
      summary: Start existing phenix experiment
      description: ""
      operationId: postExperimentsNameStart
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to start
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
  "/experiments/{name}/stop":
    post:
      tags:
        - Experiments
      summary: Stop existing phenix experiment
      description: ""
      operationId: postExperimentsNameStop
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to stop
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
  "/experiments/{name}/schedule":
    get:
      tags:
        - Experiments
      summary: Get current schedule for existing experiment
      description: ""
      operationId: getExperimentsNameSchedule
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get schedule for
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
    post:
      tags:
        - Experiments
      summary: Update current schedule for existing experiment
      description: ""
      operationId: postExperimentsNameSchedule
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to update schedule for
          required: true
          schema:
            type: string
      requestBody:
        description: scheduling algorithm to use
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                algorithm:
                  type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
  "/experiments/{name}/captures":
    get:
      tags:
        - Experiments
      summary: Get captures for existing experiment
      description: ""
      operationId: getExperimentsNameCaptures
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get captures for
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Captures"
  "/experiments/{exp_name}/webshark":
    post:
      tags:
        - Experiments
      summary: Name a packet capture for WebShark to open
      description: >-
        Returns a random name under which the WebShark viewer (served at
        `/webshark/` when installed) opens a capture: a saved capture file, by
        its path as the experiment's files are listed (needs the
        `experiments/files` `get` permission), or a VM interface's running
        capture (also needs `vms/captures` `list` on `<exp>/<vm>`). A file
        still being captured opens live. WebShark's own requests carry no
        credentials, so the name is what grants access to the capture, for
        12 hours after its last use. Open it at
        `/webshark/embed?capture=<name>&embed=1`.
      operationId: postExperimentsNameWebshark
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  description: a .pcap, .pcapng or .cap experiment file, optionally gzipped
                  example: captures/router_eth0.pcap
                vm:
                  type: string
                  description: VM with a running capture (with interface)
                interface:
                  type: integer
                  description: index of the VM interface being captured
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  capture:
                    type: string
                    description: the name WebShark opens the capture by
                  live:
                    type: boolean
                    description: whether the capture is still running
                  title:
                    type: string
        "400":
          description: >-
            neither or both of a path and a VM, a VM without an interface
            index, a path that is not clean and relative to the files
            directory, or not a capture file
        "403":
          description: forbidden
        "404":
          description: no such file, or the interface is not being captured
        "501":
          description: WebShark is not installed
  "/experiments/{name}/files":
    get:
      tags:
        - Experiments
      summary: Get list of files for experiment
      description: >-
        Lists the experiment's files on the head node and every mesh node.
        A listing is reused for a few seconds, so a file written just before
        the request may not be in it yet. Needs the `experiments/files`
        `list` permission.
      operationId: getExperimentsNameFiles
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get files for
          required: true
          schema:
            type: string
        - name: filter
          in: query
          description: search expression the files must match
          required: false
          schema:
            type: string
        - name: sortCol
          in: query
          description: column to sort by, used with sortDir
          required: false
          schema:
            type: string
            enum: [name, date, size]
        - name: sortDir
          in: query
          description: sort direction, used with sortCol
          required: false
          schema:
            type: string
            enum: [asc, desc]
        - name: pageNum
          in: query
          description: page to return, from 1, used with perPage
          required: false
          schema:
            type: integer
            minimum: 1
        - name: perPage
          in: query
          description: files per page, used with pageNum
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Files"
        "400":
          description: pageNum or perPage is not a whole number of at least 1
        "403":
          description: forbidden
  "/experiments/{name}/files/download":
    post:
      tags:
        - Experiments
      summary: Download several experiment files as a zip archive
      description: >-
        Streams a zip archive (`<name>-files.zip`) of the listed files, each
        stored under its path relative to the experiment's files directory.
        Every path is checked before anything is sent. Needs the
        `experiments/files` `get` permission. At most 500 files totaling
        2 GiB are allowed.
      operationId: postExperimentsNameFilesDownload
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to download files from
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilePaths"
      responses:
        "200":
          description: zip archive of the files
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          description: >-
            no paths, a path that is not clean and relative to the files
            directory, or a pcap a running capture is still writing
        "403":
          description: forbidden
        "404":
          description: a path is not one of the experiment's files
        "413":
          description: more than 500 files, or more than 2 GiB in total
  "/experiments/{name}/files/delete":
    post:
      tags:
        - Experiments
      summary: Delete several experiment files
      description: >-
        Deletes the listed files from the head node and every mesh node that
        has them. Files that cannot be deleted are listed with the reason and
        the rest are still deleted. Needs the `experiments/files` `delete`
        permission.
      operationId: postExperimentsNameFilesDelete
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to delete files from
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilePaths"
      responses:
        "200":
          description: files deleted, and those that were not
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilesDeleted"
        "400":
          description: an invalid request body, or no paths given
        "403":
          description: forbidden
        "500":
          description: deleting the files failed; any of them may remain
  "/experiments/{name}/files/{filename}":
    get:
      tags:
        - Experiments
      summary: Download experiment file
      description: ""
      operationId: getExperimentsNameFilesFilename
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get file from
          required: true
          schema:
            type: string
        - name: filename
          in: path
          description: name of file download
          required: true
          schema:
            type: string
        - name: path
          in: query
          description: path of the file relative to the experiment's files directory, as listed
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: >-
            the path is not clean and relative to the files directory, or a
            running capture is still writing the pcap
        "403":
          description: forbidden
        "404":
          description: the path is not one of the experiment's files
    delete:
      tags:
        - Experiments
      summary: Delete experiment file
      description: >-
        Deletes the file from the head node and every mesh node that has it.
        Needs the `experiments/files` `delete` permission.
      operationId: deleteExperimentsNameFilesFilename
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to delete the file from
          required: true
          schema:
            type: string
        - name: filename
          in: path
          description: name of the file to delete
          required: true
          schema:
            type: string
        - name: path
          in: query
          description: path of the file relative to the experiment's files directory, as listed
          required: true
          schema:
            type: string
      responses:
        "204":
          description: file deleted
        "400":
          description: >-
            the path is not clean and relative to the files directory, has
            characters minimega would read as a glob or several arguments, or
            names a pcap a running capture is still writing
        "403":
          description: forbidden
        "404":
          description: the path is not one of the experiment's files
  "/experiments/{name}/scorch/pipelines":
    get:
      tags:
        - Scorch
      summary: Get every Scorch run's pipeline for an experiment
      description: >-
        One pipeline per run in the experiment's scorch app metadata, in run
        order, each the run's own top-level loop. Also reports which run the
        scorch app is executing, whether that app is running at all, and the
        experiment's own state, so the Scorch page needs no separate
        experiment request. Needs the `experiments` `get` permission on the
        experiment.
      operationId: getExperimentsNameScorchPipelines
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get Scorch pipelines for
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScorchPipelines"
        "400":
          description: >-
            the experiment could not be read from the store, or one of its
            pipelines could not be built
        "403":
          description: getting the experiment is not allowed for this user
        "500":
          description: the experiment's scorch metadata could not be decoded
  "/experiments/{name}/scorch/pipelines/{run}":
    post:
      tags:
        - Scorch
      summary: Start a Scorch run
      description: >-
        Executes the run's configure, start, loop, stop and cleanup stages in
        the background and answers as soon as it has started; the pipeline
        endpoints and the `apps/scorch` websocket resource report how it gets
        on. A run that is already executing is refused. Needs the
        `experiments/trigger` `create` and the `experiments` `get` permissions
        on the experiment.
      operationId: postExperimentsNameScorchPipelinesRun
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to start a Scorch run for
          required: true
          schema:
            type: string
        - name: run
          in: path
          description: index of the run in the experiment's scorch app metadata
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: the run has started
        "400":
          description: >-
            the run ID is not a number, the experiment could not be read from
            the store, or the run is already executing
        "403":
          description: starting Scorch runs is not allowed for this user
    delete:
      tags:
        - Scorch
      summary: Cancel a Scorch run
      description: >-
        Cancels the run's context, which ends the stage it is executing and
        the run with it. A run that is not executing is left alone and the
        answer is the same. Needs the `experiments/trigger` `delete`
        permission on the experiment.
      operationId: deleteExperimentsNameScorchPipelinesRun
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to cancel a Scorch run for
          required: true
          schema:
            type: string
        - name: run
          in: path
          description: index of the run in the experiment's scorch app metadata
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: the run has been canceled, or was not executing
        "400":
          description: the run ID is not a number
        "403":
          description: canceling Scorch runs is not allowed for this user
  "/experiments/{name}/scorch/pipelines/{run}/cleanup":
    post:
      tags:
        - Scorch
      summary: Run only a Scorch run's cleanup stage
      description: >-
        Executes the run's top-level cleanup components on their own, without
        its other stages, to tear down what a canceled or failed run left
        behind, and answers as soon as they have started. Only a run whose
        `hasCleanup` is true has any, and a run that is already executing is
        refused. Needs the `experiments/trigger` `create` and the
        `experiments` `get` permissions on the experiment.
      operationId: postExperimentsNameScorchPipelinesRunCleanup
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to clean a Scorch run up for
          required: true
          schema:
            type: string
        - name: run
          in: path
          description: index of the run in the experiment's scorch app metadata
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: the cleanup stage has started
        "400":
          description: >-
            the run ID is not a number, the experiment could not be read from
            the store, the run has no cleanup components, or the run is
            already executing
        "403":
          description: starting Scorch runs is not allowed for this user
        "500":
          description: the experiment's scorch metadata could not be decoded
  "/experiments/{name}/scorch/pipelines/{run}/clear":
    post:
      tags:
        - Scorch
      summary: Clear a Scorch run's status
      description: >-
        Forgets the statuses held for every loop of the run, so its pipeline
        shows as never run, and broadcasts each cleared loop over the
        `apps/scorch` websocket resource. A run that is executing is refused,
        so cancel it first. Needs the `experiments/trigger` `create`
        permission on the experiment.
      operationId: postExperimentsNameScorchPipelinesRunClear
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to clear a Scorch run for
          required: true
          schema:
            type: string
        - name: run
          in: path
          description: index of the run in the experiment's scorch app metadata
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: the run's status has been cleared
        "400":
          description: >-
            the run ID is not a number, or the experiment could not be read
            from the store
        "403":
          description: clearing Scorch runs is not allowed for this user
        "404":
          description: the experiment's scorch app metadata has no such run
        "409":
          description: the run is executing
        "500":
          description: the experiment's scorch metadata could not be decoded
  "/experiments/{name}/scorch/pipelines/{run}/{loop}":
    get:
      tags:
        - Scorch
      summary: Get one loop of a Scorch run's pipeline
      description: >-
        The pipeline for a single loop of a run: a node per stage and per
        component, the edges that order them, and each node's latest status.
        Loop 0 is the run itself, and every loop above it is the pipeline
        nested in the loop below. Needs the `experiments` `get` permission on
        the experiment.
      operationId: getExperimentsNameScorchPipelinesRunLoop
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get a Scorch pipeline for
          required: true
          schema:
            type: string
        - name: run
          in: path
          description: index of the run in the experiment's scorch app metadata
          required: true
          schema:
            type: integer
        - name: loop
          in: path
          description: loop to get, 0 for the run itself
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScorchPipeline"
        "400":
          description: >-
            the run ID or the loop number is not a number, the experiment
            could not be read from the store, the experiment has no such run,
            or the run does not configure that loop
        "403":
          description: getting the experiment is not allowed for this user
  "/experiments/{exp_name}/vms":
