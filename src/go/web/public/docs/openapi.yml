      operationId: postConsole
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Console"
        "403":
          description: the role may not start a console (miniconsole post)
        "405":
          description: the server was started without --minimega-console
        "500":
          description: the console could not be started
  "/console/{pid}":
    parameters:
      - name: pid
        in: path
        description: process ID of the console
        required: true
        schema:
          type: integer
    get:
      tags:
        - Console
      summary: Check that a console is still running
      description: >-
        Lets a client attach to the console it had open, after a reload or from
        another tab, instead of starting another.
      operationId: getConsole
      responses:
        "200":
          description: the console is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Console"
        "403":
          description: the role may not use a console (miniconsole get)
        "404":
          description: no running console with this pid belongs to the user
    delete:
      tags:
        - Console
      summary: End a console
      description: >-
        Kills the console's process and closes its websockets; the UI does this
        when the user logs out. Needs the permission that starts a console.
      operationId: deleteConsole
      responses:
        "204":
          description: the console has ended
        "403":
          description: the role may not start a console (miniconsole post)
        "404":
          description: no running console with this pid belongs to the user
        "500":
          description: the console's process did not end
  "/console/{pid}/ws":
    get:
      tags:
        - Console
      summary: Attach to a console using a WebSocket
      description: >-
        Binary frames carry the console's output: first up to 256 KiB of its
        recent output, then its live output. Frames sent are its input.
        Several websockets can attach at once, and closing one leaves the
        console running. The server closes the websocket normally (1000) once
        the console has ended.
      operationId: getConsoleWs
      parameters:
        - name: pid
          in: path
          description: process ID of the console
          required: true
          schema:
            type: integer
      responses:
        "101":
          description: switching protocols
        "403":
          description: the role may not use a console (miniconsole get)
        "404":
          description: no running console with this pid belongs to the user
  "/console/{pid}/size":
    post:
      tags:
        - Console
      summary: Set a console's terminal size
      description: >-
        Both query parameters are required and must be unsigned integers: a
        request without them, or with a value that is not all digits, does not
        match this route at all.
      operationId: postConsoleSize
      parameters:
        - name: pid
          in: path
          description: process ID of the console
          required: true
          schema:
            type: integer
        - name: cols
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 65535
        - name: rows
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 65535
      responses:
        "200":
          description: successful operation
        "400":
          description: the pid is not a number, or rows or cols is above 65535
        "403":
          description: the role may not start a console (miniconsole post)
        "404":
          description: no running console with this pid belongs to the user
        "500":
          description: the terminal size could not be set
  "/features":
    servers:
      - url: http://localhost:3000
    get:
      tags:
        - Features
      summary: List the server's enabled optional features
      description: >-
        Served from the server root rather than under `/api/v1`, and needs
        neither credentials nor a permission.
      operationId: getFeatures
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Features"
  "/downloads/tunneler":
    servers:
      - url: http://localhost:3000
    get:
      tags:
        - Tunneler
      summary: List the tunneler builds installed on this server
      description: >-
        Names the phenix-tunneler builds in the server's `downloads/tunneler`
        directory, sorted, so the Tunneler page offers only downloads that
        exist. A build may be a link to a file elsewhere. Subdirectories,
        hidden files (names starting with a dot), broken links and anything
        else that is not a file are left out, and an empty list is returned
        once the directory is gone. Both
        download paths are served from the server root, not under `/api/v1`,
        and need neither credentials nor a permission. They exist only while
        the `tunneler-download` feature is on, which it is when that directory
        exists, relative to the directory the server runs from, at startup;
        without it, the request falls through to the web UI instead.
      operationId: getDownloadsTunneler
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tunnelers"
        "500":
          description: the downloads directory exists but could not be read
  "/downloads/tunneler/{name}":
    servers:
      - url: http://localhost:3000
    get:
      tags:
        - Tunneler
      summary: Download a tunneler build
      description: >-
        Serves one of the builds `GET /downloads/tunneler` lists, as an
        attachment under its own name. Only a file, or a link to one,
        directly in the downloads directory is served: a name that is a path,
        or that starts with a dot, is refused. Downloads resume with `Range`
        and `If-Range`, as other downloads do. Needs neither credentials nor a
        permission.
      operationId: getDownloadsTunnelerName
      parameters:
        - name: name
          in: path
          description: file name of the build, as the list reports it
          required: true
          schema:
            type: string
            example: phenix-tunneler-linux-amd64
        - $ref: "#/components/parameters/RangeHeader"
        - $ref: "#/components/parameters/IfRangeHeader"
        - $ref: "#/components/parameters/IfNoneMatchHeader"
      responses:
        "200":
          description: the build
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/LastModified"
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
            Repr-Digest:
              $ref: "#/components/headers/ReprDigest"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          $ref: "#/components/responses/PartialContent"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: the name is empty, is not a bare file name, or starts with a dot
        "404":
          description: no such build is installed on this server
        "500":
          description: the build could not be read or opened
    head:
      tags:
        - Tunneler
      summary: Check a tunneler build download
      description: >-
        The GET response's headers without the build: its size
        (Content-Length), `ETag` and `Last-Modified`.
      operationId: headDownloadsTunnelerName
      parameters:
        - name: name
          in: path
          description: file name of the build, as the list reports it
          required: true
          schema:
            type: string
            example: phenix-tunneler-linux-amd64
      responses:
        "200":
          description: the build's headers
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/LastModified"
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
            Repr-Digest:
              $ref: "#/components/headers/ReprDigest"
        "400":
          description: the name is empty, is not a bare file name, or starts with a dot
        "404":
          description: no such build is installed on this server
  "/healthz":
    servers:
      - url: http://localhost:3000
    get:
      tags:
        - Health
      summary: Check the server's liveness
      description: >-
        Whether the server is up: its uptime and, for a BoltDB store, how long
        the store takes to list configs. An etcd store is checked only by
        /readyz, since restarting phenix would not fix an etcd outage. Results
        are cached briefly (the store for 2 seconds), and each check has a
        timeout, so probes are cheap. Needs no credentials; `output` fields
        need a token, or auth disabled.
      operationId: getHealthz
      responses:
        "200":
          description: the server is alive (status pass or warn)
          content:
            application/health+json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: the server is not alive (status fail)
          content:
            application/health+json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
    head:
      tags:
        - Health
      summary: Check the server's liveness, without a body
      operationId: headHealthz
      responses:
        "200":
          description: the server is alive (status pass or warn)
        "503":
          description: the server is not alive (status fail)
  "/readyz":
    servers:
      - url: http://localhost:3000
    get:
      tags:
        - Health
      summary: Check the server's readiness
      description: >-
        Whether the server can run experiments: minimega's response time,
        version and namespaces, the mesh size, the store, qemu-img, WebShark
        (when installed), disk use of the minimega files directory and the
        phenix base directory, the websocket broker, uptime and Go runtime
        numbers. Status is the worst of every check's: minimega not answering,
        an unreadable store or a disk at least 98% full fail; a disk at least
        90% full, a slow minimega or store, a missing qemu-img or WebShark, a
        shrunken mesh or a backed-up websocket queue warn. Results are cached
        per check (minimega for 5 seconds), so probes send minimega at most
        three commands every 5 seconds. Needs no credentials; `output` fields
        need a token, or auth disabled.
      operationId: getReadyz
      parameters:
        - name: exclude
          in: query
          description: >-
            checks to leave out, by name (`uptime`, `go`, `store`, `minimega`,
            `qemu-img`, `webshark`, `disk`, `websocket`); repeat it, or
            separate names with commas
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              example: disk
      responses:
        "200":
          description: the server is ready (status pass or warn)
          content:
            application/health+json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: the server is not ready (status fail)
          content:
            application/health+json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
    head:
      tags:
        - Health
      summary: Check the server's readiness, without a body
      operationId: headReadyz
      parameters:
        - name: exclude
          in: query
          description: checks to leave out, by name, as for GET
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: the server is ready (status pass or warn)
        "503":
          description: the server is not ready (status fail)
  "/jobs":
    get:
      tags:
        - Jobs
      summary: List background jobs
      description: >-
        The requesting user's jobs, and those of other users the role may list
        (`jobs` `list` on their experiment), newest first, without their items'
        `result`, which GET /jobs/{id} returns. Also served on the unix socket.
      operationId: getJobs
      parameters:
        - name: experiment
          in: query
          description: only the jobs of this experiment
          required: false
          schema:
            type: string
        - name: kind
          in: query
          description: only jobs of this kind
          required: false
          schema:
            type: string
            enum:
              - vms.action
              - files.archive
              - disk.clone
        - name: active
          in: query
          description: "`true` for only the jobs queued or running"
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: the jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
  "/jobs/{id}":
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      tags:
        - Jobs
      summary: Get a background job
      description: >-
        The job with every item and its result. Needs to be the job's owner,
        or `jobs` `get`. Also served on the unix socket.
      operationId: getJob
      responses:
        "200":
          description: the job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: no such job, or another user's that the role may not get
    delete:
      tags:
        - Jobs
      summary: Dismiss a finished background job
      description: >-
        Forgets the job and deletes its artifact. Needs to be the job's owner,
        or `jobs` `delete`.
      operationId: deleteJob
      responses:
        "204":
          description: the job is dismissed
        "404":
          description: no such job, or another user's that the role may not delete
        "409":
          description: the job is still queued or running
  "/jobs/{id}/cancel":
    post:
      tags:
        - Jobs
      summary: Cancel a background job
      description: >-
        A queued job ends `canceled` at once. A running job ends `canceled`
        when its work notices: a VM action job after the VMs in progress, an
        archive or clone job at once, leaving no file. Needs to be the job's
        owner, or `jobs` `update`. Also served on the unix socket.
      operationId: postJobCancel
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "202":
          description: the job, with `cancelRequested`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: no such job, or another user's that the role may not cancel
        "409":
          description: >-
            the job has finished (`job has finished`), or cannot be canceled
            (`this job cannot be canceled`)
  "/jobs/{id}/artifact":
    get:
      tags:
        - Jobs
      summary: Download a background job's artifact
      description: >-
        The file the job produced, as an attachment. Downloads resume with
        `Range` and `If-Range`, as other downloads do. Needs to be the job's
        owner, or `jobs` `get`. A browser link may pass the token as `?token=`.
      operationId: getJobArtifact
      parameters:
        - $ref: "#/components/parameters/JobID"
        - $ref: "#/components/parameters/RangeHeader"
        - $ref: "#/components/parameters/IfRangeHeader"
        - $ref: "#/components/parameters/IfNoneMatchHeader"
      responses:
        "200":
          description: the artifact
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/LastModified"
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "206":
          $ref: "#/components/responses/PartialContent"
        "304":
          $ref: "#/components/responses/NotModified"
        "404":
          description: no such job, another user's, or a job with no artifact
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
    head:
      tags:
        - Jobs
      summary: Check a background job's artifact
      description: The GET response's headers without the file.
      operationId: headJobArtifact
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: the artifact's headers
        "404":
          description: no such job, another user's, or a job with no artifact
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
  - url: http://localhost:3000/api/v1
components:
  schemas:
    Console:
      type: object
      properties:
        pid:
          type: integer
          description: process ID of the console
      required:
        - pid
    Configs:
      type: object
      properties:
        configs:
          type: array
          items:
            $ref: "#/components/schemas/Config"
    Config:
      type: object
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          type: object
          properties:
            name:
              type: string
            created:
              type: string
              readOnly: true
              description: when the config was first stored (RFC 3339); ignored on input
            updated:
              type: string
              readOnly: true
              description: when the config was last written (RFC 3339, whole seconds); ignored on input
            revision:
              type: integer
              format: int64
              readOnly: true
              description: >-
                set by the store on every write and only increasing; opaque, so
                compare it for equality only. Absent for a config not written
                since revisions were added. Ignored on input
            annotations:
              type: object
              additionalProperties:
                type: string
          required:
            - name
        spec:
          type: object
          additionalProperties: true
      required:
        - apiVersion
        - kind
        - metadata
        - spec
    Experiments:
      type: object
      properties:
        experiments:
          type: array
          items:
            $ref: "#/components/schemas/Experiment"
    Experiment:
      type: object
      properties:
        id:
          type: string
          description: unused; always empty
        name:
          type: string
        topology:
          type: string
        scenario:
          type: string
          description: the scenario's name; empty when the experiment has none
        status:
          type: string
          description: >-
            what the server is doing to the experiment (starting, stopping,
            creating, deleting, ...). `GET /experiments` otherwise reports
            started or stopped; other responses otherwise leave it empty.
        apps:
          type: array
          items:
            type: string
        start_time:
          type: string
          format: date-time
        running:
          type: boolean
        percent:
          type: number
          description: >-
            start progress from 0 to 1 while the experiment is starting;
            reported by `GET /experiments` only
        vm_count:
          type: integer
        delayed_vms:
          type: integer
        vlan_min:
          type: integer
        vlan_max:
          type: integer
        vlan_count:
          type: integer
        vlans:
          type: array
          items:
            type: object
            properties:
              vlan:
                type: integer
              alias:
                type: string
        vms:
          type: array
          items:
            $ref: "#/components/schemas/VM"
    VMs:
      type: object
      properties:
        vms:
          type: array
          items:
            $ref: "#/components/schemas/VM"
        total:
          type: integer
          description: how many VMs there are, before paging
    VM:
      type: object
      properties:
        name:
          type: string
        experiment:
          type: string
        host:
          type: string
        ipv4:
          type: array
          items:
            type: string
        cpus:
          type: integer
        ram:
          type: integer
        disk:
          type: string
        dnb:
          type: boolean
        networks:
          type: array
          items:
            type: string
        taps:
          type: array
          items:
            type: string
        captures:
          type: array
          items:
            $ref: "#/components/schemas/Capture"
        running:
          type: boolean
        busy:
          type: boolean
        state:
          type: string
        cdRom:
          type: string
        tags:
          type: object
          additionalProperties:
            type: string
        ccActive:
          type: boolean
        external:
          type: boolean
        delayed_start:
          type: string
        snapshot:
          type: boolean
        inject_partition:
          type: integer
        description:
          type: string
        uptime:
          type: number
          format: float
        screenshot:
          type: string
          format: base64
        annotations:
          type: object
          additionalProperties: true
          nullable: true
          description: >-
            the node's annotations; only a single VM's GET response, and its
            PATCH response when the role may also get the VM, carry them. VM
            lists, other responses and websocket updates send null.
    Schedule:
      type: object
      properties:
        schedule:
          type: array
          items:
            type: object
            properties:
              vm:
                type: string
              host:
                type: string
              auto_assigned:
                type: boolean
    Captures:
      type: object
      properties:
        captures:
          type: array
          items:
            $ref: "#/components/schemas/Capture"
    Capture:
      type: object
      properties:
        vm:
          type: string
        interface:
          type: integer
        filepath:
          type: string
    CaptureToken:
      type: object
      properties:
        id:
          type: string
          description: not secret; names the token in listings, logs and revocation
          example: 3f9a0c51d2e47b86
        token:
          type: string
          description: >-
            the token, only when it is given: `pcs_<random>` for a stream, or
            a WebShark capture name
          example: pcs_k2j4m6n8p1q3r5s7t9v2w4x6y8
        operations:
          type: array
          items:
            type: string
            enum: [stream, view, download, watch]
        expires:
          type: string
          format: date-time
          description: when the token, and anything it opened, ends at the latest
        useBy:
          type: string
          format: date-time
          description: a stream token's last moment to start a stream
        lastUsed:
          type: string
          format: date-time
        uses:
          type: integer
        experiment:
          type: string
        target:
          type: object
          properties:
            path:
              type: string
              description: the experiment file holding the capture, when known
            vm:
              type: string
            interface:
              type: integer
        urls:
          type: object
          description: where to use the token, relative to the UI's base path
          properties:
            stream:
              type: string
              example: webshark/streams/pcs_k2j4m6n8p1q3r5s7t9v2w4x6y8
            view:
              type: string
              example: webshark/embed?capture=router-k2j4m6n8p1q3r5s7t9v2w4x6y8.pcap
    Snapshots:
      type: object
      properties:
        snapshots:
          type: array
          items:
            type: string
    Files:
      type: object
      properties:
        files:
          type: array
          description: the files on the requested page, or all of them
          items:
            type: object
            properties:
              name:
                type: string
              path:
                type: string
                description: path relative to the experiment's files directory
              date:
                type: string
              size:
                type: integer
              categories:
                type: array
                items:
                  type: string
              plainText:
                type: boolean
              isDir:
                type: boolean
        total:
          type: integer
          description: how many files match, before paging
    FilePaths:
      type: object
      required:
        - paths
      properties:
        paths:
          type: array
          description: file paths relative to the experiment's files directory, as listed
          items:
            type: string
    FilesDeleted:
      type: object
      properties:
        deleted:
          type: array
          items:
            type: string
        failed:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              error:
                type: string
    ScorchPipelines:
      type: object
      description: >-
        Every Scorch run of an experiment, with the state of the scorch app
        and of the experiment itself.
      properties:
        pipelines:
          type: array
          description: >-
            one pipeline per run in the scorch app metadata, in run order,
            each the run's top-level loop; null when it configures no runs
          nullable: true
          items:
            $ref: "#/components/schemas/ScorchPipeline"
        running:
          type: integer
          description: >-
            the run the scorch app is executing, or -1 when the app is not
            running or has reported no run
          example: -1
        app_running:
          type: boolean
          description: whether the scorch app itself is running
        experiment:
          type: object
          description: the experiment's own state, so the Scorch page can show it
          properties:
            status:
              type: string
              description: >-
                started, stopped, or what the server is doing to it (starting,
                stopping, ...)
    ScorchPipeline:
      type: object
      description: >-
        One loop of a run's pipeline: a node per stage (`configure`, `start`, a
        `loop` node when this loop nests another, `stop`, `cleanup` and
        `done`), a node per component the loop names, and the edges that order
        them. A node's index is its position in `pipeline`, which is what an
        edge points at.
      properties:
        name:
          type: string
          description: the run's name, when the run's metadata names it
        hasCleanup:
          type: boolean
          description: >-
            whether this loop defines cleanup components. For a run's
            top-level loop (loop 0) those are the run's, which can be run on
            their own; for a nested loop they are that loop's.
        pipeline:
          type: array
          items:
            $ref: "#/components/schemas/ScorchPipelineNode"
    ScorchPipelineNode:
      type: object
      properties:
        name:
          type: string
          description: the stage's name, or the component's
        hint:
          type: string
          description: always sent, always empty at present
        status:
          type: string
          description: the latest status reported for the node
          enum:
            - unknown
            - running
            - background
            - unstable
            - success
            - failure
        stage:
          type: string
          description: the stage a component node belongs to; empty on a stage node
        exp:
          type: string
        run:
          type: integer
        loop:
          type: integer
        next:
          type: array
          description: edges to the nodes that follow this one
          items:
            $ref: "#/components/schemas/ScorchPipelineEdge"
    ScorchPipelineEdge:
      type: object
      properties:
        index:
          type: integer
          description: position of the node the edge points at in `pipeline`
        weight:
          type: integer
          description: 0 until the edge has been taken, then 2
    Hosts:
      type: object
      properties:
        hosts:
          type: array
          items:
            $ref: "#/components/schemas/Host"
    Host:
      type: object
      properties:
        name:
          type: string
        cpus:
          type: integer
        cpucommit:
          type: integer
        load:
          type: array
          description: the 1, 5 and 15 minute load averages
          items:
            type: string
        memused:
          type: integer
        memtotal:
          type: integer
        memcommit:
          type: integer
        tx:
          type: number
        rx:
          type: number
        bandwidth:
          type: string
        diskusage:
          type: object
          description: >-
            percent in use of the disks holding the phenix and minimega base
            directories
          properties:
            diskphenix:
              type: number
            diskminimega:
              type: number
        netcommit:
          type: integer
        vms:
          type: integer
        uptime:
          type: number
          format: float
        schedulable:
          type: boolean
        headnode:
          type: boolean
    Applications:
      type: object
      properties:
        applications:
          type: array
          items:
            type: string
    BuilderTopology:
      type: object
      required:
        - topology
        - builderXML
      properties:
        name:
          type: string
          description: topology name; ignored by PUT /builder/topologies/{name}
        topology:
          type: object
          description: generated topology spec
          properties:
            nodes:
              type: array
              items:
                type: object
        builderXML:
          type: string
          description: mxGraph document for the diagram
        vlans:
          type: object
          description: VLAN alias to ID, used by the experiment endpoints only
          additionalProperties:
            type: integer
        scenario:
          type: string
          description: scenario name, used by the experiment endpoints only
    Topologies:
      type: object
      properties:
        topologies:
          type: array
          items:
            type: string
    Disks:
      type: object
      properties:
        disks:
          type: array
          description: sorted by name, then by full path
          items:
            $ref: "#/components/schemas/Disk"
    Disk:
      type: object
      properties:
        kind:
          type: string
          enum: [VM, Container, ISO, Unknown]
        name:
          type: string
          description: >-
            the image's file name, which `disks` permissions name; images in
            different folders can share it
        fullPath:
          type: string
          description: >-
            the image's absolute path, without `.` or `..` segments, which
            identifies it
        relativePath:
          type: string
          description: >-
            the image's path relative to the minimega files directory, or empty
            when the image is outside it
        outsideFilesDir:
          type: boolean
          description: whether the image is outside the minimega files directory
        readOnly:
          type: boolean
          description: >-
            whether the disk actions refuse the image: it is outside the
            minimega files directory, or in a folder the disk list leaves out,
            such as an experiment's files
        size:
          type: string
          description: size of the file, as a readable string
        virtualSize:
          type: string
          description: size the guest sees, as a readable string
        experiments:
          type: array
          description: >-
            experiments whose topology uses the image, directly or as the
            backing image of an image it uses
          nullable: true
          items:
            type: object
            properties:
              name:
                type: string
              running:
                type: boolean
        backingImages:
          type: array
          description: >-
            the full paths of the images this one is backed by, nearest first
          items:
            type: string
        inUse:
          type: boolean
          description: whether the image's file is in use, such as by a running VM
    Users:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
    User:
      type: object
      properties:
        username:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: object
          properties:
            name:
              type: string
            resources:
              type: array
              items:
                type: string
            resource_names:
              type: array
              items:
                type: string
            verbs:
              type: array
              items:
                type: string
    Credentials:
      type: object
      properties:
        username:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
        token:
          type: string
    Workflow:
      type: object
      title: Workflow
      description: >-
        A phenix workflow config: what applying a workflow branch creates,
        updates or restarts one experiment from.
      additionalProperties: false
      required:
        - apiVersion
        - kind
        - spec
      properties:
        apiVersion:
          type: string
          title: API Version
          description: The config API version; a workflow config is phenix.sandia.gov/v0.
          enum:
            - phenix.sandia.gov/v0
        kind:
          type: string
          title: Kind
          description: The config kind, which is always Workflow.
          enum:
            - Workflow
        metadata:
          type: object
          title: Metadata
          description: >-
            Not read by the server; it is accepted so a workflow config has the
            same four top-level keys as every other phenix config, and so a later
            version can carry a name or annotations without a breaking change.
          nullable: true
        spec:
          type: object
          title: Workflow Spec
          description: >-
            What an apply may do and the experiment settings it sets; an empty
            spec applies every default.
          additionalProperties: false
          properties:
            auto:
              type: object
              title: Auto
              description: What an apply may do to the experiment mapped to the workflow branch without being asked.
              nullable: true
              additionalProperties: false
              properties:
                create:
                  type: string
                  title: Create
                  description: >-
                    The name of the experiment to create when none is mapped to
                    the branch; unset never creates one.
                  nullable: true
                update:
                  type: boolean
                  title: Update
                  description: >-
                    Whether an apply may update the experiment already mapped to
                    the branch; defaults to true when unset.
                  nullable: true
                restart:
                  type: boolean
                  title: Restart
                  description: >-
                    Whether an apply may start a new or updated experiment and
                    stop and restart a running one; defaults to true when unset.
                  nullable: true
            topology:
              type: string
              title: Topology
              description: >-
                The name of the topology config; required to create an
                experiment, and on an update defaults to the experiment's
                current topology.
              nullable: true
            scenario:
              type: string
              title: Scenario
              description: The name of the scenario config; on an update defaults to the experiment's current scenario.
              nullable: true
            vlans:
              type: object
              title: VLANs
              description: >-
                VLAN alias to VLAN ID; every alias used by an interface in the
                topology is set to its ID here, or left for minimega to pick
                when not listed.
              nullable: true
              additionalProperties:
                type: integer
            schedules:
              type: object
              title: Schedules
              description: >-
                VM hostname to cluster host; each listed non-external node of
                the topology is scheduled on that host.
              nullable: true
              additionalProperties:
                type: string
            deployMode:
              type: string
              title: Deploy Mode
              description: >-
                Where VMs are deployed, all, no-headnode or only-headnode in any
                letter case; unset or empty uses the server's deploy-mode
                setting.
              nullable: true
              pattern: '^(?i:all|no-headnode|only-headnode)?$'
            useGREMesh:
              type: boolean
              title: Use GRE Mesh
              description: >-
                Whether the experiment uses a GRE mesh between cluster hosts; it
                is OR-ed with the server's use-gre-mesh setting, so either turns
                it on.
              nullable: true
            vlanRange:
              type: object
              title: VLAN Range
              description: The range of VLAN IDs the experiment may allocate from; unset leaves both ends unset.
              nullable: true
              additionalProperties: false
              properties:
                min:
                  type: integer
                  title: Minimum
                  description: The lowest VLAN ID the experiment may use; 0 leaves the minimum unset.
                  nullable: true
                max:
                  type: integer
                  title: Maximum
                  description: The highest VLAN ID the experiment may use; 0 leaves the maximum unset.
                  nullable: true
            defaultBridge:
              type: string
              title: Default Bridge
              description: >-
                The bridge the experiment's VMs attach to by default; defaults to
                phenix, is at most 15 characters (the Linux interface name
                limit), and unless it is phenix no other experiment may use it.
              nullable: true
              maxLength: 15
    WorkflowResult:
      type: object
      properties:
        action:
          type: string
          enum:
            - none
            - create
            - createAndStart
            - update
            - updateAndStart
            - restart
        experiment:
          type: string
          description: experiment the action applies to (empty when no experiment is involved)
        reason:
          type: string
          description: why nothing was done, when action is none
        dryRun:
          type: boolean
          description: true when nothing was changed because dryRun was requested
    WorkflowConfigResult:
      type: object
      description: what POST /workflow/configs/{branch}?dryRun=true would do
      properties:
        action:
          type: string
          enum:
            - create
            - update
          description: whether the request would create the config or update the stored one
        kind:
          type: string
          description: the config's kind, e.g. Topology
        name:
          type: string
          description: the config's name after the server filled in its placeholders, such as ${BRANCH_NAME}
        dryRun:
          type: boolean
          description: always true
        pending:
          type: string
          description: >
            the value to pass as pending to a dry run of
            POST /workflow/apply/{branch}: Kind/name, followed for a scenario by
            ?from=...&topology=... (its fromScenario names and topology
            annotation) and for a topology that includes others by ?include=...
    Options:
      type: object
      properties:
        bridge-mode:
          type: string
        deploy-mode:
          type: string
        use-gre-mesh:
          type: boolean
        base-dir.injects:
          type: string
          description: directory phenix workflow apply stages injects into
        workflow-dry-run:
          type: boolean
          description: >
            true when POST /workflow/configs/{branch} and POST /workflow/apply/{branch}
            support dryRun, and apply supports pending and expect
    Error:
      type: object
      properties:
        message:
          type: string
          description: what went wrong; for a config validation failure, the first explained line
        cause:
          type: string
          description: the underlying error text
        metadata:
          type: object
          description: extra details, returned for some errors
          properties:
            validation:
              type: string
              description: >
                for a schema validation failure, the explained lines separated by
                newlines, each in the form <item> "<hostname|name>" (line N): <what>
                (at <sub-path>), with (line N) left out for single-line sources and
                an extra hint line for a misplaced key; an error that cannot be
                placed in the source (in a templated key, in data a config hook
                added, in a YAML merge key, or a missing or misindented
                metadata.name) keeps the validator's text; for an unparsable body
                sent to POST /configs, the parser error
            validation-raw:
              type: string
              description: for a schema validation failure, the original validator text
          additionalProperties:
            type: string
    SoHSummaries:
      type: object
      properties:
        experiments:
          type: array
          items:
            $ref: "#/components/schemas/SoHSummary"
    SoHSummary:
      type: object
      description: >-
        One experiment's state of health. Only `name`, `scenario`, `status`,
        `running`, `configured` and `vms.total` are reported for a stopped
        experiment.
      properties:
        name:
          type: string
        scenario:
          type: string
        status:
          type: string
          description: started, stopped, or what the server is doing to it (starting, stopping, ...)
        percent:
          type: number
          description: start progress from 0 to 1 while starting
        running:
          type: boolean
        configured:
          type: boolean
          description: whether the scenario includes the soh app
        started:
          type: boolean
        soh_initialized:
          type: boolean
          description: whether the soh app has finished a run
        soh_running:
          type: boolean
          description: whether the soh app is running now
        vms:
          $ref: "#/components/schemas/SoHVMCounts"
        down_vms:
          type: array
          description: VMs not running or not deployed (at most 50)
          items:
            type: string
        vms_error:
          type: string
          description: why minimega could not be asked for VM states
        hosts:
          type: integer
          description: hosts with results
        hosts_with_errors:
          type: integer
        checks:
          $ref: "#/components/schemas/SoHTally"
        reachability:
          $ref: "#/components/schemas/SoHTally"
        last_run:
          type: string
          format: date-time
          description: when the last run finished (the newest check for results from older versions)
        last_run_duration:
          type: number
          description: seconds the last run took
        history:
          type: array
          description: the last 20 runs, oldest first
          items:
            $ref: "#/components/schemas/SoHRun"
        failing_checks:
          type: array
          description: failing checks from the latest results, newest first (at most 50)
          items:
            $ref: "#/components/schemas/SoHFailingCheck"
        error:
          type: string
          description: why the experiment's soh results could not be read
    SoHVMCounts:
      type: object
      description: >-
        VMs by state. `known` is false when minimega was not or could not be
        asked; only `total` is set then. `failing` counts running VMs with a
        failing check.
      properties:
        known:
          type: boolean
        total:
          type: integer
        running:
          type: integer
        failing:
          type: integer
        notrunning:
          type: integer
        notboot:
          type: integer
        notdeploy:
          type: integer
        external:
          type: integer
        delayed:
          type: integer
    SoHTally:
      type: object
      properties:
        total:
          type: integer
        passing:
          type: integer
        failing:
          type: integer
    SoHRun:
      type: object
      properties:
        time:
          type: string
          format: date-time
        duration:
          type: number
        total:
          type: integer
        failing:
          type: integer
        hosts_failing:
          type: integer
        hosts_down:
          type: integer
    SoHFailingCheck:
      type: object
      properties:
        host:
          type: string
        check:
          type: string
          enum:
            - network
            - reachability
            - file
            - file absent
            - service
            - process
            - listener
            - container
            - custom test
        target:
          type: string
        error:
          type: string
        time:
          type: string
          format: date-time
    Features:
      type: object
      properties:
        features:
          type: array
          description: >-
            the enabled features, in no particular order: each one named with
            the `phenix ui --features` flag (such as `vm-mount`), `file-server`
            when a file server endpoint is configured, `tunneler-download` when
            the server's `downloads/tunneler` directory exists at startup, and
            `webshark` when a WebShark build is installed
          items:
            type: string
            example: webshark
    FileChecksum:
      type: object
      properties:
        path:
          type: string
          description: the file as the request named it
        size:
          type: integer
          format: int64
        modified:
          type: string
          format: date-time
        etag:
          type: string
          description: the `ETag` downloads of the file carry
        sha256:
          type: string
          description: hex SHA-256 of the file; absent while it is being computed
    Tunnelers:
      type: object
      properties:
        files:
          type: array
          description: file names of the builds installed on this server, sorted
          items:
            type: string
            example: phenix-tunneler-linux-amd64
    HealthResponse:
      type: object
      description: >-
        A health response in the format of the IETF draft
        draft-inadarei-api-health-check-06
      properties:
        status:
          type: string
          enum: [pass, warn, fail]
          description: the worst status of every check
          example: pass
        version:
          type: string
          description: the phenix build's tag
          example: v1.2.0
        releaseId:
          type: string
          description: the phenix build's commit
          example: 059cd25b
        serviceId:
          type: string
          example: phenix
        description:
          type: string
          example: phēnix readiness
        notes:
          type: array
          description: present when the request was not authenticated
          items:
            type: string
            example: "output fields omitted: request not authenticated"
        output:
          type: string
          description: detail, only for authenticated requests
        checks:
          type: object
          description: >-
            the checks' results, keyed "component:measurement" (such as
            `minimega:responseTime`); most keys have one result, and
            `disk:utilization` has one per filesystem
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/HealthCheckResult"
      required:
        - status
        - serviceId
        - description
        - checks
    HealthCheckResult:
      type: object
      properties:
        componentId:
          type: string
          description: >-
            the component observed, such as `minimega`, `bolt` or
            `files-dir`; never a path or host name
          example: minimega
        componentType:
          type: string
          enum: [component, datastore, system]
          example: component
        observedValue:
          description: >-
            the value observed; each key keeps one JSON type across runs, and
            a run that observed nothing leaves it out. Fractional values
            (milliseconds, percentages) always carry a decimal point, even
            when whole (`42.0`)
          example: 1.27
        observedUnit:
          type: string
          example: ms
        status:
          type: string
          enum: [pass, warn, fail]
          example: pass
        affectedEndpoints:
          type: array
          description: the API routes that do not work while this check warns or fails
          items:
            type: string
            example: /api/v1/vms
        time:
          type: string
          format: date-time
          description: when the value was observed
        output:
          type: string
          description: >-
            why the check warns or fails, or other detail (paths, hosts,
            errors); only for authenticated requests
          example: "minimega did not answer: unable to dial"
      required:
        - status
        - time

    Job:
      type: object
      description: A background job and the outcome of each of its items.
      required:
        - id
        - kind
        - owner
        - title
        - status
        - cancelable
        - progress
        - items
        - created
        - updated
        - revision
      properties:
        id:
          type: string
          description: "`j` and 16 hex digits"
          example: j0f3a9c2e81b4d7a6
        kind:
          type: string
          enum:
            - vms.action
            - files.archive
            - disk.clone
        owner:
          type: string
          description: the user who started the job
        experiment:
          type: string
          description: the experiment the job acts on, if any
        title:
          type: string
          example: Restart 3 VMs
        params:
          type: object
          description: what the job was asked to do, such as its action
          additionalProperties:
            type: string
        status:
          type: string
          description: >-
            `partial` when some items succeeded and others failed or were
            skipped, `failed` when none succeeded or the job itself failed
          enum:
            - queued
            - running
            - succeeded
            - partial
            - failed
            - canceled
        cancelable:
          type: boolean
        cancelRequested:
          type: boolean
        progress:
          $ref: "#/components/schemas/JobProgress"
        items:
          type: array
          items:
            $ref: "#/components/schemas/JobItem"
        itemsOmitted:
          type: integer
          description: >-
            items a websocket message left out (it carries at most 500); GET
            the job for them all
        error:
          type: string
          description: why the job failed, when no item tells
        artifact:
          $ref: "#/components/schemas/JobArtifact"
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
        started:
          type: string
          format: date-time
        finished:
          type: string
          format: date-time
        revision:
          type: integer
          description: increases with every change; keep the update with the highest
    JobItem:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
          description: the VM, file or disk image the item acts on
        status:
          type: string
          enum:
            - pending
            - running
            - succeeded
            - failed
            - skipped
            - canceled
        error:
          type: string
          description: why the item failed or was skipped
          example: you don't have permission
        retryable:
          type: boolean
          description: >-
            trying the item again later may succeed, such as a VM another
            action holds
        result:
          type: object
          description: >-
            what the item's action returned, such as the VM it left (as GET
            /experiments/{exp}/vms/{name} returns it); not sent over the
            websocket
    JobProgress:
      type: object
      required:
        - done
        - total
      properties:
        done:
          type: integer
          description: items with an outcome
        total:
          type: integer
          description: items, or 1 for a job of none
        bytes:
          type: integer
          format: int64
          description: bytes handled, for file work
        bytesTotal:
          type: integer
          format: int64
    JobArtifact:
      type: object
      description: The file a job produced, at GET /jobs/{id}/artifact.
      required:
        - name
        - size
      properties:
        name:
          type: string
          example: exp1-files.zip
        size:
          type: integer
          format: int64
        incomplete:
          type: boolean
          description: the file lacks some of what was asked for

  # Shared by the single-file download routes, which resume interrupted
  # downloads with Range and If-Range.
  parameters:
    JobID:
      name: id
      in: path
      description: the job's ID
      required: true
      schema:
        type: string
    RangeHeader:
      name: Range
      in: header
      description: >-
        the bytes to send, such as `bytes=1048576-` to resume a download after
        its first MiB
      required: false
      schema:
        type: string
    IfRangeHeader:
      name: If-Range
      in: header
      description: >-
        the `ETag` of an earlier response: `Range` is honored only while the
        file still has it, and a changed file is sent whole (200)
      required: false
      schema:
        type: string
    IfNoneMatchHeader:
      name: If-None-Match
      in: header
      description: the `ETag` of an earlier response; 304 while the file still has it
      required: false
      schema:
        type: string
    # Config revisions: conditional reads and writes of one config.
    ConfigIfMatch:
      name: If-Match
      in: header
      description: >-
        optional; the config's `ETag` from an earlier read (`"r<revision>"`),
        or `*`. The write runs only while the config is still at that
        revision, and answers 412 otherwise, so a concurrent change is not
        silently overwritten. Weak tags never match; a malformed value is a
        400.
      required: false
      schema:
        type: string
    ConfigIfNoneMatch:
      name: If-None-Match
      in: header
      description: the config's `ETag` from an earlier read; 304 while the config is still at that revision
      required: false
      schema:
        type: string
  headers:
    # Config revisions: conditional reads and writes of one config.
    ConfigETag:
      description: >-
        strong validator `"r<revision>"` naming the config's revision (not
        its bytes, so it holds for a gzip-compressed body too); absent for a
        config not written since revisions were added
      schema:
        type: string
    ConfigRevision:
      description: the config's `metadata.revision`, as a plain number; absent when the ETag is
      schema:
        type: integer
        format: int64
    ETag:
      description: >-
        strong validator built from the file's inode, size and modification
        time (not its contents), so it changes whenever the file does
      schema:
        type: string
    LastModified:
      description: the file's modification time
      schema:
        type: string
    AcceptRanges:
      description: "`bytes`: the file can be fetched, and resumed, in ranges"
      schema:
        type: string
    ContentRange:
      description: the range sent and the file's size, such as `bytes 1048576-2097151/4194304`
      schema:
        type: string
    ReprDigest:
      description: >-
        the whole file's SHA-256 (RFC 9530), such as `sha-256=:<base64>:`,
        sent only once the file's checksum route has computed it; it holds
        for a range too, so a resumed download can be verified, and is
        dropped from a gzip-compressed response
      schema:
        type: string
  responses:
    # Config revisions: conditional reads and writes of one config.
    ConfigNotModified:
      description: the config is still at the `If-None-Match` revision
      headers:
        ETag:
          $ref: "#/components/headers/ConfigETag"
    ConfigPreconditionFailed:
      description: >-
        the config is no longer at the `If-Match` revision, or does not exist;
        `metadata.revision` holds its current revision
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PartialContent:
      description: the requested range of the file
      headers:
        Content-Range:
          $ref: "#/components/headers/ContentRange"
        ETag:
          $ref: "#/components/headers/ETag"
        Repr-Digest:
          $ref: "#/components/headers/ReprDigest"
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    NotModified:
      description: the file still has the `If-None-Match` ETag
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
    PreconditionFailed:
      description: the file no longer has the `If-Match` ETag
    RangeNotSatisfiable:
      description: the range starts past the end of the file
      headers:
        Content-Range:
          description: "`bytes */<size>`"
          schema:
            type: string
