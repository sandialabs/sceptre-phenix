      required:
        - name
      properties:
        name:
          title: Name
          type: string
          description: the VM's name
          example: web
        cpus:
          title: CPUs
          type: integer
          description: virtual CPUs, or 0 to keep them
          example: 2
        ram:
          title: RAM
          type: integer
          description: memory in megabytes, or 0 to keep it
          example: 2048
        disk:
          title: Disk
          type: string
          description: the disk image, or empty to keep it
          example: ubuntu.qc2
        dnb:
          title: Do Not Boot
          type: boolean
          description: whether the VM is marked do not boot
          example: true
        interface:
          title: Interface
          type: object
          description: an interface to connect to another VLAN
          properties:
            index:
              title: Index
              type: integer
              description: the interface's index
              example: 0
            vlan:
              title: VLAN
              type: string
              description: the VLAN alias to connect it to
              example: EXP_2
        host:
          title: Host
          type: string
          description: the cluster host to schedule the VM on
          example: compute1
        snapshot:
          title: Snapshot
          type: boolean
          description: whether the VM runs from a snapshot of its disk
          example: true
    ImageFilename:
      title: Image Filename
      type: object
      description: The name of the file to write.
      required:
        - filename
      properties:
        filename:
          title: Filename
          type: string
          description: the file's name, in the minimega files directory unless absolute
          example: web-committed.qc2
    PortForward:
      title: Port Forward
      type: object
      description: A user's port forward to a VM.
      properties:
        exp:
          title: Experiment
          type: string
          description: the experiment's name
          example: exp1
        vm:
          title: VM
          type: string
          description: the VM's name
          example: web
        srcPort:
          title: Src Port
          type: integer
          description: the local port that serves the forward
          example: 2222
        dstHost:
          title: Dst Host
          type: string
          description: the destination host, as the VM's cluster host reaches it
          example: 127.0.0.1
        dstPort:
          title: Dst Port
          type: integer
          description: the destination port
          example: 22
        owner:
          title: Owner
          type: string
          description: the user who created the forward
          example: alice@example.com
    File:
      title: File
      type: object
      description: A file or folder.
      properties:
        name:
          title: Name
          type: string
          description: the file's name
          example: hostname
        path:
          title: Path
          type: string
          description: the file's path, relative to the listed folder
          example: /etc/hostname
        date:
          title: Date
          type: string
          description: when the file was last modified, RFC 3339
          example: "2026-01-01T10:00:00Z"
        size:
          title: Size
          type: integer
          description: the file's size in bytes
          example: 8
        categories:
          title: Categories
          type: array
          description: what the file is, when known
          items:
            type: string
          example: []
        plainText:
          title: Plain Text
          type: boolean
          description: whether the file is plain text
          example: true
        isDir:
          title: Is Dir
          type: boolean
          description: whether the entry is a folder
          example: false
    ScorchTerminal:
      title: Scorch Terminal
      type: object
      description: A terminal a SCORCH break component opened, and a client of it.
      properties:
        exp:
          title: Experiment
          type: string
          description: the experiment's name
          example: exp1
        run:
          title: Run
          type: integer
          description: the run's index
          example: 0
        loop:
          title: Loop
          type: integer
          description: the loop's nesting depth
          example: 0
        stage:
          title: Stage
          type: string
          description: the stage the component runs in
          example: start
        name:
          title: Name
          type: string
          description: the break component's name
          example: pause
        loc:
          title: Location
          type: string
          description: >-
            the websocket the client attaches with, under the UI's base path.
