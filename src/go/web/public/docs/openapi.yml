  "/schemas/builder/v1":
    get:
      tags:
        - Builder Flow
        - Schemas
      summary: Get the JSON Schema of Builder Flow documents
      description: >
        Requires the `schemas` `get` permission for `builder`. Without the
        builder-beta feature the request reaches `/schemas/{kind}/{version}`,
        which also answers 404 because there is no config kind named builder.
      operationId: getBuilderSchema
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
  "/builder/drafts":
    get:
      tags:
        - Builder Flow
      summary: List Builder Flow drafts
      description: >
        Requires `configs` `list`. Returns the caller's own drafts, and
        separately the drafts of other users shared with the caller (`via`
        `share`) or the caller holds `builder-drafts` `list` for (`via`
        `role`). Drafts whose metadata this server can no longer read (for
        example, written by a newer phenix) are listed apart, as damaged:
        the caller's own, and those of other users the caller holds
        `builder-drafts` `list` for, never because of a share. They cannot be
        opened, only deleted. Drafts the caller may not see are never counted
        or described.
      operationId: getBuilderDrafts
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderDrafts"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
    post:
      tags:
        - Builder Flow
      summary: Create a Builder Flow draft
      description: >
        Requires `configs` `create`. The draft is owned by the caller and holds
        the document as its first snapshot. Nothing is published. With
        `forkOf`, the caller must be able to read that draft: own it, have it
        shared with them, or hold `builder-drafts` `get` for it. With a
        `sourceToken` naming a published document, the caller must hold
        `configs` `get` for the config it was published to.
      operationId: postBuilderDrafts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderDraftCreate"
      responses:
        "201":
          description: draft created
          headers:
            ETag:
              $ref: "#/components/headers/BuilderETag"
            Location:
              schema:
                description: location of the new draft
                type: string
                format: uri-reference
            Warning:
              $ref: "#/components/headers/BuilderWarning"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderDraft"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "413":
          $ref: "#/components/responses/BuilderTooLarge"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/drafts/{owner}/{draft}":
    parameters:
      - $ref: "#/components/parameters/BuilderDraftOwner"
      - $ref: "#/components/parameters/BuilderDraftID"
    get:
      tags:
        - Builder Flow
      summary: Get a Builder Flow draft with its current document
      description: >
        Requires `configs` `get`, and for another user's draft a share, or
        `builder-drafts` `get`. `access`, `via`, `canShare` and `shares` say
        what the caller may do with it; `readOnly` is also set when the
        caller's role cannot update configs.
      operationId: getBuilderDraft
      responses:
        "200":
          description: successful operation
          headers:
            ETag:
              $ref: "#/components/headers/BuilderETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderDraft"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
    delete:
      tags:
        - Builder Flow
      summary: Delete a Builder Flow draft
      description: >
        Requires `configs` `delete`, and for another user's draft
        `builder-drafts` `delete`: a share never allows deleting a draft.
        Published configs are not affected.
      operationId: deleteBuilderDraft
      parameters:
        - $ref: "#/components/parameters/BuilderIfMatch"
      responses:
        "204":
          description: draft deleted
          headers:
            Warning:
              $ref: "#/components/headers/BuilderWarning"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "409":
          $ref: "#/components/responses/BuilderConflict"
        "412":
          description: >
            The If-Match header does not name the draft's current revision.
            The caller may delete the draft, so the response carries its
            current ETag, as the listing does for a draft whose metadata this
            server can no longer read, which cannot be read on its own.
          headers:
            ETag:
              $ref: "#/components/headers/BuilderETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/drafts/{owner}/{draft}/snapshots":
    parameters:
      - $ref: "#/components/parameters/BuilderDraftOwner"
      - $ref: "#/components/parameters/BuilderDraftID"
    get:
      tags:
        - Builder Flow
      summary: List the snapshots of a Builder Flow draft
      description: >
        Requires `configs` `get`, and for another user's draft a share, or
        `builder-drafts` `get`. Snapshots are listed oldest first; `cursor` is
        the index of the current one.
      operationId: getBuilderDraftSnapshots
      responses:
        "200":
          description: successful operation
          headers:
            ETag:
              $ref: "#/components/headers/BuilderETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderSnapshots"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
    post:
      tags:
        - Builder Flow
      summary: Save a Builder Flow draft
      description: >
        Requires `configs` `update`, and for another user's draft an edit
        share, or `builder-drafts` `update`. Appends the document as a new
        snapshot, discards any
        snapshots after the cursor (the redo branch), and moves the cursor to
        the new snapshot. A draft keeps at most 50 snapshots of at most 50 MiB
        in total; the oldest are dropped to make room for the new one.
      operationId: postBuilderDraftSnapshots
      parameters:
        - $ref: "#/components/parameters/BuilderIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderSnapshotCreate"
      responses:
        "201":
          description: snapshot appended; the draft without its document
          headers:
            ETag:
              $ref: "#/components/headers/BuilderETag"
            Warning:
              $ref: "#/components/headers/BuilderWarning"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderDraft"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "409":
          $ref: "#/components/responses/BuilderConflict"
        "412":
          $ref: "#/components/responses/BuilderPreconditionFailed"
        "413":
          $ref: "#/components/responses/BuilderTooLarge"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/drafts/{owner}/{draft}/snapshots/{snapshot}":
    parameters:
      - $ref: "#/components/parameters/BuilderDraftOwner"
      - $ref: "#/components/parameters/BuilderDraftID"
      - name: snapshot
        in: path
        description: snapshot ID, or `current` for the snapshot the cursor points at
        required: true
        schema:
          type: string
    get:
      tags:
        - Builder Flow
      summary: Get one snapshot of a Builder Flow draft with its document
      description: >
        Requires `configs` `get`, and for another user's draft a share, or
        `builder-drafts` `get`.
      operationId: getBuilderDraftSnapshot
      responses:
        "200":
          description: successful operation
          headers:
            ETag:
              $ref: "#/components/headers/BuilderETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderSnapshotDocument"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
    delete:
      tags:
        - Builder Flow
      summary: Delete one snapshot of a Builder Flow draft
      description: >
        Requires `configs` `update`, and for another user's draft an edit
        share, or `builder-drafts` `update`. Removes the snapshot from the
        history and deletes its content. The snapshot the cursor points at
        (the current version) cannot be deleted; the cursor keeps pointing at
        it. A last publication naming the deleted snapshot is kept; the draft
        is then `dirty`.
      operationId: deleteBuilderDraftSnapshot
      parameters:
        - $ref: "#/components/parameters/BuilderIfMatch"
      responses:
        "200":
          description: snapshot deleted; the draft without its document
          headers:
            ETag:
              $ref: "#/components/headers/BuilderETag"
            Warning:
              $ref: "#/components/headers/BuilderWarning"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderDraft"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "409":
          description: >
            The snapshot is the current version, or the draft changed while
            the request was handled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "412":
          $ref: "#/components/responses/BuilderPreconditionFailed"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/drafts/{owner}/{draft}/cursor":
    parameters:
      - $ref: "#/components/parameters/BuilderDraftOwner"
      - $ref: "#/components/parameters/BuilderDraftID"
    patch:
      tags:
        - Builder Flow
      summary: Move the cursor of a Builder Flow draft (undo and redo)
      description: >
        Requires `configs` `update`, and for another user's draft an edit
        share, or `builder-drafts` `update`. No snapshot is discarded. PUT is
        accepted as well.
      operationId: patchBuilderDraftCursor
      parameters:
        - $ref: "#/components/parameters/BuilderIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderCursorMove"
      responses:
        "200":
          description: cursor moved; the draft without its document
          headers:
            ETag:
              $ref: "#/components/headers/BuilderETag"
            Warning:
              $ref: "#/components/headers/BuilderWarning"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderDraft"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "409":
          $ref: "#/components/responses/BuilderConflict"
        "412":
          $ref: "#/components/responses/BuilderPreconditionFailed"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
    put:
      tags:
        - Builder Flow
      summary: Move the cursor of a Builder Flow draft (undo and redo)
      description: The same operation as PATCH.
      operationId: putBuilderDraftCursor
      parameters:
        - $ref: "#/components/parameters/BuilderIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderCursorMove"
      responses:
        "200":
          description: cursor moved; the draft without its document
          headers:
            ETag:
              $ref: "#/components/headers/BuilderETag"
            Warning:
              $ref: "#/components/headers/BuilderWarning"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderDraft"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "409":
          $ref: "#/components/responses/BuilderConflict"
        "412":
          $ref: "#/components/responses/BuilderPreconditionFailed"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/drafts/{owner}/{draft}/publish":
    parameters:
      - $ref: "#/components/parameters/BuilderDraftOwner"
      - $ref: "#/components/parameters/BuilderDraftID"
    post:
      tags:
        - Builder Flow
      summary: Publish a Builder Flow draft to phenix configs
      description: >
        The only Builder Flow operation that writes configs. It publishes the
        draft's current snapshot; the request carries intent only. Requires
        `configs` `update` (and for another user's draft an edit share, or
        `builder-drafts` `update`), and the caller's own `configs` `create`
        or `update` on each target config according to its action, and
        `experiments` `create` or `update` for an experiment target.
        Repeating a publication that already completed, with the If-Match it
        was sent with, answers 200 with every stage
        skipped. A draft updates an existing topology or experiment only when
        it was imported from it, or when it published it (or was opened from
        the published diagram that did) and nothing else changed it since;
        any other update is refused with 409. A published experiment records
        which draft and published document published it, and its digest once
        its apps' configure stage ran, in its `builder-experiment`
        annotation; an experiment update runs that stage, as an update
        through `/configs` does. When a stage fails after earlier stages were
        written, the response is 409, 500 or 507 with a result whose status is
        `partial`. When the published document was stored but content it
        replaces could not be removed, the publication goes on and answers
        with a `Warning` header and a warning in the result.
      operationId: postBuilderDraftPublish
      parameters:
        - $ref: "#/components/parameters/BuilderIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderPublishRequest"
      responses:
        "200":
          description: publication succeeded
          headers:
            ETag:
              $ref: "#/components/headers/BuilderETag"
            Warning:
              $ref: "#/components/headers/BuilderWarning"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderPublishResult"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "409":
          description: >
            A target config or the draft changed since the publication was
            prepared, or a stage failed on such a conflict after earlier stages
            were written (a `partial` result).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WebError"
                  - $ref: "#/components/schemas/BuilderPublishResult"
        "412":
          $ref: "#/components/responses/BuilderPreconditionFailed"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
        "500":
          description: >
            A stage failed after earlier stages were written (a `partial`
            result), or the draft could not be read.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WebError"
                  - $ref: "#/components/schemas/BuilderPublishResult"
        "507":
          description: >
            etcd is out of space. Nothing was written, or a stage failed after
            earlier stages were written (a `partial` result whose failed stage
            says so). The message says what an administrator must do.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WebError"
                  - $ref: "#/components/schemas/BuilderPublishResult"
  "/builder/drafts/{owner}/{draft}/shares":
    parameters:
      - $ref: "#/components/parameters/BuilderDraftOwner"
      - $ref: "#/components/parameters/BuilderDraftID"
    get:
      tags:
        - Builder Flow
      summary: List who a Builder Flow draft is shared with
      description: >
        Requires `configs` `get`, and owning the draft: only the owner learns
        who else has access (403 for anyone else who can see it). Each entry
        is checked against the account it was shared with; `stale` marks one
        whose account was deleted or replaced by a new one under the same
        name, which grants nothing. The list has its own entity tag,
        `"shares-N"`, for the next PUT.
      operationId: getBuilderDraftShares
      responses:
        "200":
          description: successful operation
          headers:
            ETag:
              $ref: "#/components/headers/BuilderSharesETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderShares"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
    put:
      tags:
        - Builder Flow
      summary: Replace who a Builder Flow draft is shared with
      description: >
        Requires `configs` `update`, owning the draft, and a user account of
        the caller's own (so not when authentication is off). The request
        replaces the whole list, of at most 25 users, each of whom must have
        an account; a share is bound to that account. A user whose account
        was replaced must be removed, saved, and added again. Changing the
        list also changes the draft's ETag, which the response carries in
        `draft.etag`; there is no top-level `etag`. A request that changes
        nothing answers 200 with both entity tags unchanged. Content saves
        never conflict with it: they use the draft's ETag, not the list's.
      operationId: putBuilderDraftShares
      parameters:
        - name: If-Match
          in: header
          description: >
            The list's entity tag, `"shares-N"` from GET or the last PUT
            (`"shares-0"` for a draft never shared). A missing header, a
            wildcard or a weak tag is rejected with 400; any other tag,
            including a draft ETag, with 412.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderShareUpdate"
      responses:
        "200":
          description: the list now stored
          headers:
            ETag:
              $ref: "#/components/headers/BuilderSharesETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderShares"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "412":
          description: >
            The If-Match header does not name the list's current entity tag,
            or the list changed while the request was handled. The response
            carries the current one.
          headers:
            ETag:
              $ref: "#/components/headers/BuilderSharesETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "413":
          description: The request body is larger than 64 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "422":
          description: Some entries were refused; `errors` says which and why.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderShareErrors"
        "503":
          description: >
            The draft kept changing while the list was written. Try again.
          headers:
            Retry-After:
              description: seconds to wait before trying again
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/drafts/{owner}/{draft}/shares/candidates":
    parameters:
      - $ref: "#/components/parameters/BuilderDraftOwner"
      - $ref: "#/components/parameters/BuilderDraftID"
    get:
      tags:
        - Builder Flow
      summary: List who a Builder Flow draft can be shared with
      description: >
        The same callers as PUT of the share list may ask (403 for anyone
        else who can see the draft). Lists, sorted by username, the users the
        caller may view as `GET /users` lists them (none without `users`
        `list`) whom a PUT of the share list would accept: every user with an
        account other than the owner, except a user the draft is shared with
        through an account since removed. Users the draft is already shared
        with are listed too.
      operationId: getBuilderDraftShareCandidates
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderShareCandidates"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
  "/builder/sources":
    get:
      tags:
        - Builder Flow
      summary: List the configs Builder Flow can use as sources
      description: >
        Requires `configs` `list`. Topologies and experiments can be imported
        with POST /builder/generate; scenarios and images are offered for
        selection only. Each config is filtered by `configs` `list` for its
        name and, for topologies, experiments and scenarios, by the `list`
        permission of that resource.
      operationId: getBuilderSources
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderSources"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
  "/builder/generate":
    post:
      tags:
        - Builder Flow
      summary: Import a Builder Flow document from a Topology or Experiment config
      description: >
        Converts a stored config (`source`) or an uploaded one (`content`)
        into a document and returns it; nothing is written. Requires `configs`
        `get`. A stored source also needs `configs` `get` for its name and the
        `topologies` or `experiments` `list` permission for it. Uploaded
        content needs `configs` `create`, because it is parsed as POST
        /configs parses a config, including the substitution of `${NAME}` from
        the server's environment (see Security Considerations in the phenix
        README).
      operationId: postBuilderGenerate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderGenerateRequest"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderGenerateResult"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "413":
          $ref: "#/components/responses/BuilderTooLarge"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
  "/builder/documents":
    get:
      tags:
        - Builder Flow
      summary: List published Builder Flow documents
      description: >
        Requires `configs` `list`. Lists the documents that configs currently
        reference in their `builder-doc` annotation, filtered by `configs`
        `list` for the config each one was published to.
      operationId: getBuilderDocuments
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderPublishedDocuments"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
  "/builder/documents/{document}":
    get:
      tags:
        - Builder Flow
      summary: Get a published Builder Flow document
      description: >
        Requires `configs` `get` for the config the document was published
        to. A document the caller may not read, or that no config references
        any more, is answered with 404.
      operationId: getBuilderDocument
      parameters:
        - name: document
          in: path
          description: published document ID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderPublishedDocument"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
  - url: http://localhost:3000/api/v1
components:
  schemas:
    Configs:
      type: object
      properties:
        configs:
          type: array
          items:
            $ref: "#/components/schemas/Config"
    Config:
      type: object
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          type: object
          properties:
            name:
              type: string
            annotations:
              type: object
              additionalProperties:
                type: string
          required:
            - name
        spec:
          type: object
          additionalProperties: true
      required:
        - apiVersion
        - kind
        - metadata
        - spec
    Experiments:
      type: object
      properties:
        experiments:
          type: array
          items:
            $ref: "#/components/schemas/Experiment"
    Experiment:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        topology:
          type: string
        apps:
          type: array
          items:
            type: string
        start_time:
          type: string
          format: date-time
        running:
          type: boolean
        vm_count:
          type: integer
        vlan_min:
          type: integer
        vlan_max:
          type: integer
        vlan_count:
          type: integer
        vlans:
          type: array
          items:
            type: object
            properties:
              vlan:
                type: integer
              alias:
                type: string
        vms:
          $ref: "#/components/schemas/VMs"
    VMs:
      type: object
      properties:
        vms:
          type: array
          items:
            $ref: "#/components/schemas/VM"
    VM:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        experiment:
          type: string
        host:
          type: string
        ipv4:
          type: array
          items:
            type: string
        cpus:
          type: integer
        ram:
          type: integer
        disk:
          type: string
        dnb:
          type: boolean
        networks:
          type: array
          items:
            type: string
        taps:
          type: array
          items:
            type: string
        captures:
          type: array
          items:
            $ref: "#/components/schemas/Capture"
        running:
          type: boolean
        uptime:
          type: number
          format: float
        screenshot:
          type: string
          format: base64
    Schedule:
      type: object
      properties:
        schedule:
          type: array
          items:
            type: object
            properties:
              vm:
                type: string
              host:
                type: string
              auto_assigned:
                type: boolean
    Captures:
      type: object
      properties:
        captures:
          type: array
          items:
            $ref: "#/components/schemas/Capture"
    Capture:
      type: object
      properties:
        vm:
          type: string
        interface:
          type: integer
        filepath:
          type: string
    Snapshots:
      type: object
      properties:
        snapshots:
          type: array
          items:
            type: string
    Files:
      type: object
      properties:
        files:
          type: array
          items:
            type: string
    Hosts:
      type: object
      properties:
        hosts:
          type: array
          items:
            $ref: "#/components/schemas/Host"
    Host:
      type: object
      properties:
        name:
          type: string
        cpus:
          type: integer
        load:
          type: string
        memused:
          type: integer
        memtotal:
          type: integer
        bandwidth:
          type: string
        vms:
          type: integer
        uptime:
          type: number
          format: float
        schedulable:
          type: boolean
    Applications:
      type: object
      properties:
        applications:
          type: array
          items:
            type: string
    BuilderTopology:
      type: object
      required:
        - topology
        - builderXML
      properties:
        name:
          type: string
          description: topology name; ignored by PUT /builder/topologies/{name}
        topology:
          type: object
          description: generated topology spec
          properties:
            nodes:
              type: array
              items:
                type: object
        builderXML:
          type: string
          description: mxGraph document for the diagram
        vlans:
          type: object
          description: VLAN alias to ID, used by the experiment endpoints only
          additionalProperties:
            type: integer
        scenario:
          type: string
          description: scenario name, used by the experiment endpoints only
    Topologies:
      type: object
      properties:
        topologies:
          type: array
          items:
            type: string
    Disks:
      type: object
      properties:
        disks:
          type: array
          items:
            type: string
    Users:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
    User:
      type: object
      properties:
        username:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: object
          properties:
            name:
              type: string
            resources:
              type: array
              items:
                type: string
            resource_names:
              type: array
              items:
                type: string
            verbs:
              type: array
              items:
                type: string
    Credentials:
      type: object
      properties:
        username:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
        token:
          type: string
    WebError:
      type: object
      properties:
        message:
          type: string
        cause:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
    BuilderDocument:
      description: >
        A Builder Flow document. GET /schemas/builder/v1 serves its complete
        JSON Schema.
      type: object
      additionalProperties: true
      properties:
        "$schema":
          type: string
          enum:
            - https://phenix.sandia.gov/schemas/builder/v1
        revision:
          type: integer
        id:
          type: string
        name:
          type: string
    BuilderDraftCreate:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
        summary:
          description: summary of the first snapshot
          type: string
        sourceToken:
          description: >
            the config the draft was imported from, as `<kind>/<name>`, or the
            published document it was opened from, as
            `builder-doc/<document id>`, which the caller must be able to read
            (404 otherwise)
          type: string
        forkOf:
          description: >
            a draft the new one forks, as `<owner>/<draft id>`, which the caller
            must be able to read (404 otherwise). The new draft takes its
            source token in place of `sourceToken`, and records its last
            publication as `forked`, so publishing the new draft can update
            what that draft published or was opened from.
          type: string
        owner:
          description: optional; when set, it must be the caller
          type: string
        document:
          $ref: "#/components/schemas/BuilderDocument"
      required:
        - document
    BuilderSnapshotCreate:
      type: object
      additionalProperties: false
      properties:
        summary:
          type: string
        document:
          $ref: "#/components/schemas/BuilderDocument"
        opId:
          description: >
            the client's id for this save, kept with the snapshot, so a
            client that never saw the response can tell it was stored
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
      required:
        - document
    BuilderCursorMove:
      description: exactly one of `index` and `snapshotId`
      type: object
      additionalProperties: false
      properties:
        index:
          description: index of the snapshot to move to, oldest first
          type: integer
          minimum: 0
        snapshotId:
          type: string
    BuilderDraft:
      type: object
      properties:
        id:
          type: string
        owner:
          type: string
        title:
          type: string
        sourceToken:
          type: string
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
        lastModifiedBy:
          type: string
        cursor:
          description: index of the current snapshot
          type: integer
        snapshots:
          description: number of snapshots the draft keeps
          type: integer
        snapshotId:
          description: ID of the current snapshot
          type: string
        digest:
          description: digest of the current snapshot's document
          type: string
        size:
          description: size in bytes of the current snapshot's document
          type: integer
        historyBytes:
          description: total size in bytes of the snapshots the draft keeps
          type: integer
        dirty:
          description: whether the current snapshot differs from the last publication
          type: boolean
        canUndo:
          type: boolean
        canRedo:
          type: boolean
        readOnly:
          description: >
            whether the caller may not update the draft: its access does not
            allow it, or its role cannot update configs (so `access` `edit`
            with `readOnly` means an edit share the caller's role cannot use)
          type: boolean
        etag:
          description: the value of the ETag header for this revision
          type: string
        document:
          $ref: "#/components/schemas/BuilderDocument"
        history:
          description: the snapshots, oldest first (GET of one draft only)
          type: array
          items:
            $ref: "#/components/schemas/BuilderSnapshot"
        publication:
          $ref: "#/components/schemas/BuilderPublication"
        forked:
          description: >
            for a draft created with `forkOf`, what that draft had last
            published when it was forked, which this draft may update too
          type: object
          properties:
            documentId:
              type: string
            topologyTarget:
              type: string
            experimentTarget:
              type: string
        access:
          description: >
            what the caller may do with the draft (listing, GET of one draft,
            and the `draft` of a PUT of its shares only)
          type: string
          enum:
            - owner
            - edit
            - view
        via:
          description: >
            where the caller's access to another user's draft comes from: a
            share naming the caller, or its role (listing and GET of one draft
            only). A caller with both is reported as `share`.
          type: string
          enum:
            - share
            - role
        canShare:
          description: >
            present and true when the caller owns the draft, may update
            configs, and has a user account, and so may change who it is
            shared with (listing, GET of one draft, and the `draft` of a PUT of
            its shares only)
          type: boolean
        shares:
          description: >
            who the draft is shared with, sorted by user, for its owner only,
            and only when it is shared with anyone. Entries whose account is
            gone are included; GET of the draft's shares marks them.
          type: array
          items:
            type: object
            properties:
              user:
                type: string
              access:
                type: string
                enum:
                  - view
                  - edit
    BuilderDrafts:
      type: object
      properties:
        drafts:
          description: the caller's own drafts
          type: array
          items:
            $ref: "#/components/schemas/BuilderDraft"
        shared:
          description: >
            drafts of other users shared with the caller (`via` `share`) or
            the caller's role lets it list (`via` `role`)
          type: array
          items:
            $ref: "#/components/schemas/BuilderDraft"
        damaged:
          description: >
            drafts, the caller's own or of other users the caller may list,
            whose metadata this server can no longer read
          type: array
          items:
            $ref: "#/components/schemas/BuilderDamagedDraft"
    BuilderDamagedDraft:
      description: >
        What can still be read of a draft whose metadata this server can no
        longer read. It cannot be opened, only deleted with its ETag.
      type: object
      properties:
        id:
          type: string
        owner:
          type: string
        title:
          description: present when it can still be read
          type: string
        updated:
          description: present when it can still be read
          type: string
          format: date-time
        etag:
          description: the If-Match value that deletes the draft
          type: string
        canDelete:
          description: whether the caller may delete the draft
          type: boolean
    BuilderSnapshot:
      type: object
      properties:
        id:
          type: string
        digest:
          type: string
        size:
          type: integer
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        summary:
          type: string
        opId:
          description: the client's id for the save that stored the snapshot
          type: string
        current:
          type: boolean
    BuilderSnapshots:
      type: object
      properties:
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/BuilderSnapshot"
        cursor:
          type: integer
    BuilderSnapshotDocument:
      type: object
      properties:
        snapshot:
          $ref: "#/components/schemas/BuilderSnapshot"
        document:
          $ref: "#/components/schemas/BuilderDocument"
    BuilderPublication:
      description: the draft's last publication
      type: object
      properties:
        mode:
          type: string
          enum:
            - topology
            - topology-experiment
        topologyTarget:
          type: string
        topologyAction:
          type: string
        experimentTarget:
          type: string
        scenarioTarget:
          type: string
        snapshotId:
          type: string
        digest:
          type: string
        documentId:
          type: string
        publishedAt:
          type: string
          format: date-time
        publishedBy:
          type: string
    BuilderPublishTarget:
      type: object
      additionalProperties: false
      properties:
        name:
          description: config name
          type: string
        action:
          description: >
            create a new config or update an existing one. A scenario target
            the document references as stored uses `use`: the stored spec is
            kept and the topology is added to its `topology` annotation, which
            needs `configs` `update`.
          type: string
          enum:
            - create
            - update
            - use
        expectedDigest:
          description: >
            Scenario targets with action `update` only, and required when the
            document's own scenario replaces a stored one: the `sha256:` digest
            of the stored scenario the update was prepared against. A scenario
            that changed since is refused with 409.
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
      required:
        - name
        - action
    BuilderPublishRequest:
      description: >
        `topology` mode publishes the topology only. `topology-experiment`
        mode also requires an experiment target and may name a scenario
        target.
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
            - topology
            - topology-experiment
        topology:
          $ref: "#/components/schemas/BuilderPublishTarget"
        scenario:
          $ref: "#/components/schemas/BuilderPublishTarget"
        experiment:
          $ref: "#/components/schemas/BuilderPublishTarget"
      required:
        - mode
        - topology
    BuilderPublishStage:
      type: object
      properties:
        name:
          description: document, topology, scenario, experiment or draft
          type: string
        status:
          description: created, updated, skipped, ok or failed
          type: string
        message:
          type: string
        config:
          description: the config the stage wrote, as `<Kind>/<name>`
          type: string
    BuilderPublishResult:
      type: object
      properties:
        status:
          type: string
          enum:
            - succeeded
            - partial
        stages:
          type: array
          items:
            $ref: "#/components/schemas/BuilderPublishStage"
        warnings:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: string
        topology:
          $ref: "#/components/schemas/BuilderPublishTarget"
        scenario:
          $ref: "#/components/schemas/BuilderPublishTarget"
        experiment:
          $ref: "#/components/schemas/BuilderPublishTarget"
        draft:
          $ref: "#/components/schemas/BuilderDraft"
    BuilderSource:
      type: object
      properties:
        kind:
          type: string
        name:
          type: string
        fullName:
          type: string
        apiVersion:
          type: string
        created:
          type: string
        updated:
          type: string
        digest:
          type: string
        stored:
          description: false for a config generated from uploaded content
          type: boolean
        builder:
          description: >
            the builder annotation the config carries, if any: `builder-doc`
            (Builder Flow) or `builder-xml` (legacy Builder)
          type: string
        generatable:
          description: whether POST /builder/generate accepts this config
          type: boolean
    BuilderSources:
      type: object
      properties:
        topologies:
          type: array
          items:
            $ref: "#/components/schemas/BuilderSource"
        experiments:
          type: array
          items:
            $ref: "#/components/schemas/BuilderSource"
        scenarios:
          type: array
          items:
            $ref: "#/components/schemas/BuilderSource"
        images:
          type: array
          items:
            $ref: "#/components/schemas/BuilderSource"
    BuilderGenerateRequest:
      description: exactly one of `source` and `content`
      type: object
      additionalProperties: false
      properties:
        source:
          description: a stored Topology or Experiment config, as `<Kind>/<name>`
          type: string
        content:
          description: a Topology or Experiment config as JSON or YAML text
          type: string
    BuilderGenerateResult:
      type: object
      properties:
        document:
          $ref: "#/components/schemas/BuilderDocument"
        warnings:
          description: what the document left out or changed
          type: array
          items:
            type: string
        source:
          $ref: "#/components/schemas/BuilderSource"
    BuilderPublishedDocument:
      type: object
      properties:
        id:
          type: string
        digest:
          type: string
        size:
          type: integer
        target:
          description: name of the config the document was published to
          type: string
        kind:
          type: string
        config:
          description: the config the document was published to, as `<Kind>/<name>`
          type: string
        draftId:
          type: string
        snapshotId:
          type: string
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        document:
          $ref: "#/components/schemas/BuilderDocument"
    BuilderPublishedDocuments:
      type: object
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/BuilderPublishedDocument"
    BuilderShares:
      type: object
      properties:
        shares:
          description: who the draft is shared with, sorted by user
          type: array
          items:
            type: object
            properties:
              user:
                type: string
              access:
                type: string
                enum:
                  - view
                  - edit
              grantedAt:
                type: string
                format: date-time
              stale:
                description: >
                  the account the draft was shared with was deleted, or
                  replaced by a new one under the same name, so this share
                  grants nothing
                type: boolean
        sharesEtag:
          description: the list's entity tag, the value of the ETag header
          type: string
        maxShares:
          description: the most users a draft may be shared with
          type: integer
        draft:
          description: >
            PUT only: the draft without its document and history, with its
            new `etag`
          allOf:
            - $ref: "#/components/schemas/BuilderDraft"
    BuilderShareUpdate:
      description: the complete new list
      type: object
      additionalProperties: false
      properties:
        shares:
          type: array
          maxItems: 25
          items:
            type: object
            additionalProperties: false
            properties:
              user:
                type: string
              access:
                type: string
                enum:
                  - view
                  - edit
            required:
              - user
              - access
      required:
        - shares
    BuilderShareCandidates:
      type: object
      properties:
        users:
          description: who the draft can be shared with, sorted by username
          type: array
          items:
            type: object
            properties:
              username:
                type: string
              name:
                description: the user's first and last name, or empty when unknown
                type: string
    BuilderShareErrors:
      description: a WebError with every refused entry
      type: object
      properties:
        message:
          type: string
        cause:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              user:
                description: the entry's user, empty for `too-many`
                type: string
              reason:
                description: >
                  `owner` (the owner is listed), `duplicate` (a user is listed
                  twice), `invalid-access` (not `view` or `edit`),
                  `invalid-user` (empty, over 256 bytes, control characters or
                  `/`), `too-many` (over 25 users), `unknown-user` (no such
                  account), or `account-removed` (the account the user was
                  shared with is gone: remove the user, save, and add them
                  again)
                type: string
                enum:
                  - owner
                  - duplicate
                  - invalid-access
                  - invalid-user
                  - too-many
                  - unknown-user
                  - account-removed
  parameters:
    BuilderDraftOwner:
      name: owner
      in: path
      description: the user that owns the draft
      required: true
      schema:
        type: string
    BuilderDraftID:
      name: draft
      in: path
      description: draft ID
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    BuilderIfMatch:
      name: If-Match
      in: header
      description: >
        The ETag of the draft revision the change is based on: exactly one
        strong, quoted entity tag, such as `"3"`. A missing header, a wildcard
        or a weak tag is rejected with 400; a tag naming any other revision is
        rejected with 412.
      required: true
      schema:
        type: string
  headers:
    BuilderETag:
      description: the draft's revision as a quoted entity tag, for the next If-Match
      schema:
        type: string
    BuilderSharesETag:
      description: >
        the entity tag of the list of who a draft is shared with,
        `"shares-N"`, for the next If-Match of PUT
      schema:
        type: string
    BuilderWarning:
      description: >
        Set when the change succeeded but removing the content it superseded
        failed. The cause is logged on the server only.
      schema:
        type: string
  responses:
    BuilderBadRequest:
      description: >
        The request is malformed: its body is not a single JSON value of the
        expected shape (unknown fields are rejected), or its If-Match header is
        missing or not a single strong entity tag.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderForbidden:
      description: >
        The caller's role lacks a permission the operation requires, or the
        caller can see the draft but may not do this to it: for example,
        saving it with a view share, deleting it with any share, or sharing
        it without owning it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderNotFound:
      description: >
        The resource does not exist; or it is another user's draft the caller
        may not see (not shared with the caller, and no `builder-drafts`
        permission), answered exactly as if it did not exist; or the server
        runs without the builder-beta feature, so the route does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderConflict:
      description: The draft or a target config changed while the request was handled.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderPreconditionFailed:
      description: The If-Match header does not name the draft's current revision.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderTooLarge:
      description: >
        The request body or the document exceeds the server's size limits.
        The snapshot history never does: its oldest snapshots are dropped
        instead.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderUnprocessable:
      description: >
        The request is well formed but cannot be applied, for example a
        document that fails validation or a config that cannot be converted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    InsufficientStorage:
      description: >
        etcd is out of space, so nothing was saved. `message` says what an
        administrator must do. The same request succeeds once space is freed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
