            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/LastModified"
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          $ref: "#/components/responses/PartialContent"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: the VM is not mounted, or the path is a folder or outside the mount
        "403":
          description: forbidden
        "404":
          description: no such file
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
    head:
      tags:
        - Virtual Machines
      summary: Check a mounted VM file download
      description: >-
        The GET response's headers without the file: its size
        (Content-Length), `ETag` and `Last-Modified`. Needs the `vms/mount`
        `get` permission on `<exp>/<vm>`.
      operationId: headExperimentsNameVmsNameFilesDownload
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of the mounted VM
          required: true
          schema:
            type: string
        - name: path
          in: query
          description: the file, relative to the root of the VM's mount
          required: true
          schema:
            type: string
      responses:
        "200":
          description: the file's headers
        "400":
          description: the VM is not mounted, or the path is a folder or outside the mount
        "403":
          description: forbidden
        "404":
          description: no such file
  "/experiments/{exp_name}/vms/{vm_name}/restart":
    get:
      tags:
        - Virtual Machines
      summary: Restart a VM
      description: >-
        Resets the running VM, as its reset button would, or starts it if it
        has quit, and answers with it. Needs the `vms/restart` `update`
        permission.
      operationId: getExperimentsNameVmsNameRestart
      parameters:
        - $ref: "#/components/parameters/ExpName"
        - $ref: "#/components/parameters/VMName"
      responses:
        "200":
          description: the VM, restarted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        "400":
          description: the experiment could not be read
        "403":
          description: forbidden
        "409":
          description: another action holds the VM
        "500":
          description: the VM could not be restarted
  "/experiments/{exp_name}/vms/{vm_name}/shutdown":
    get:
      tags:
        - Virtual Machines
      summary: Shut a VM down
      description: >-
        Stops the VM's packet captures and asks it to power off, killing it
        if it has not within 30 seconds, and answers with it. Needs the
        `vms/shutdown` `update` permission.
      operationId: getExperimentsNameVmsNameShutdown
      parameters:
        - $ref: "#/components/parameters/ExpName"
        - $ref: "#/components/parameters/VMName"
      responses:
        "200":
          description: the VM, shut down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        "400":
          description: the experiment could not be read
        "403":
          description: forbidden
        "409":
          description: another action holds the VM
        "500":
          description: the VM could not be shut down
  "/experiments/{exp_name}/vms/{vm_name}/reset":
    get:
      tags:
        - Virtual Machines
      summary: Reset a VM's disk
      description: >-
        Kills the VM, after stopping its packet captures, replaces its disk
        snapshot with a fresh one of its image, so the changes it made are
        lost, and starts it again; answers with the VM. The VM must run from
        a snapshot. Needs the `vms/reset` `update` permission.
      operationId: getExperimentsNameVmsNameReset
      parameters:
        - $ref: "#/components/parameters/ExpName"
        - $ref: "#/components/parameters/VMName"
      responses:
        "200":
          description: the VM, reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        "400":
          description: the experiment could not be read
        "403":
          description: forbidden
        "409":
          description: another action holds the VM
        "500":
          description: the VM could not be reset
  "/experiments/{exp_name}/vms/{vm_name}/memorySnapshot":
    post:
      tags:
        - Virtual Machines
      summary: Snapshot a VM's memory to a file
      description: >-
        Dumps the running VM's memory to a file and answers once it is
        written. Progress is published on the `/ws` websocket as
        `experiment/vm/memorySnapshot` messages (`committing`, `progress`
        with a `percent`, then `commit` with the file's name as `disk`, or
        `errorCommitting`). Needs the `vms/memorySnapshot` `create`
        permission.
      operationId: postExperimentsNameVmsNameMemorySnapshot
      parameters:
        - $ref: "#/components/parameters/ExpName"
        - $ref: "#/components/parameters/VMName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageFilename"
      responses:
        "204":
          description: the memory snapshot was written
        "400":
          description: a malformed body, or no filename
        "403":
          description: forbidden
        "409":
          description: another action holds the VM
        "500":
          description: the memory snapshot failed
  "/experiments/{exp_name}/vms/{vm_name}/forwards":
    get:
      tags:
        - Virtual Machines
      summary: List a VM's port forwards
      description: >-
        Every user's forwards to the VM, after dropping those whose tunnel
        has closed. Needs the `vms/forwards` `list` permission.
      operationId: getExperimentsNameVmsNameForwards
      parameters:
        - $ref: "#/components/parameters/ExpName"
        - $ref: "#/components/parameters/VMName"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  listeners:
                    title: Listeners
                    type: array
                    nullable: true
                    description: the forwards; null when there are none
                    items:
                      $ref: "#/components/schemas/PortForward"
        "403":
          description: forbidden
    post:
      tags:
        - Virtual Machines
      summary: Forward a port to a VM
      description: >-
        Opens a minimega tunnel from a cluster port to the destination, as
        seen from the VM's cluster host, and makes it the caller's forward,
        which `GET .../forwards/{host}/{port}/ws` attaches to and
        `phenix-tunneler` serves on the caller's own computer. `dst=VNC`
        forwards the VM's VNC console instead. A user has at most one forward
        to each host and port of a VM. Publishes an `experiment/vm/forward`
        `create` message on the `/ws` websocket. Needs the `vms/forwards`
        `create` permission.
      operationId: postExperimentsNameVmsNameForwards
      parameters:
        - $ref: "#/components/parameters/ExpName"
        - $ref: "#/components/parameters/VMName"
        - name: src
          in: query
          description: the local port the forward is to be served on, recorded for the tunneler
          required: true
          schema:
            type: integer
          example: 2222
        - name: host
          in: query
          description: the destination host, as the VM's cluster host reaches it
          required: false
          schema:
            type: string
            default: 127.0.0.1
        - name: dst
          in: query
          description: the destination port, or `VNC` for the VM's VNC console
          required: true
          schema:
            type: string
          example: "22"
      responses:
        "204":
          description: the forward was created
        "400":
          description: >-
            the forward could not be created: a port is not a number, the VM
            was not found, the user has this forward already, or the tunnel
            failed
        "403":
          description: forbidden
    delete:
      tags:
        - Virtual Machines
      summary: Close a port forward to a VM
      description: >-
        Closes the caller's own forward to the host and port, and publishes an
        `experiment/vm/forward` `delete` message on the `/ws` websocket.
        Needs the `vms/forwards` `delete` permission.
      operationId: deleteExperimentsNameVmsNameForwards
      parameters:
        - $ref: "#/components/parameters/ExpName"
        - $ref: "#/components/parameters/VMName"
        - name: host
          in: query
          description: the forward's destination host
          required: false
          schema:
            type: string
            default: 127.0.0.1
        - name: dst
          in: query
          description: the forward's destination port (5900 for a VNC forward)
          required: true
          schema:
            type: integer
          example: 22
      responses:
        "204":
          description: the forward was closed
        "400":
          description: the port is not a number, or the user has no such forward
        "403":
          description: forbidden
        "404":
          description: minimega does not know the VM
        "500":
          description: the tunnel could not be closed
  "/experiments/{exp_name}/vms/{vm_name}/forwards/{host}/{port}/ws":
    get:
      tags:
        - Virtual Machines
      summary: Attach to a port forward over a WebSocket
      description: >-
        Proxies the forward's TCP connection over the websocket in binary
        frames, both ways, until either side closes. The caller's own forward
        to the host and port is used, else another user's at random. The
        handshake needs an `Origin` header. Needs the `vms/forwards` `get`
        permission.
      operationId: getExperimentsNameVmsNameForwardsHostPortWs
      parameters:
        - $ref: "#/components/parameters/ExpName"
        - $ref: "#/components/parameters/VMName"
        - name: host
          in: path
          description: the forward's destination host
          required: true
          schema:
            type: string
        - name: port
          in: path
          description: the forward's destination port
          required: true
          schema:
            type: integer
      responses:
        "101":
          description: switching protocols; the forward's bytes follow as binary frames
        "400":
          description: no forward to the host and port, or not a websocket handshake
        "403":
          description: forbidden, or a handshake without an `Origin` header
  "/experiments/{exp_name}/vms/{vm_name}/mount":
    post:
      tags:
        - Virtual Machines
      summary: Mount a VM's disk on the server
      description: >-
        Mounts the running VM's disk under the server's mount directory, for
        the file routes that follow, and counts the caller as one of its
        users; a request made while another is mounting it waits for that
        mount. Only with the `vm-mount` feature. Needs the `vms/mount` `post`
        permission.
      operationId: postExperimentsNameVmsNameMount
      parameters:
        - $ref: "#/components/parameters/ExpName"
        - $ref: "#/components/parameters/VMName"
      responses:
        "200":
          description: the disk is mounted
        "403":
          description: forbidden
        "409":
          description: the disk is being unmounted
        "500":
          description: the disk could not be mounted
  "/experiments/{exp_name}/vms/{vm_name}/files/upload":
    put:
      tags:
        - Virtual Machines
      summary: Upload a file into a mounted VM disk
      description: >-
        Writes the uploaded file into the folder under its own file name,
        replacing a file of that name. Only with the `vm-mount` feature.
        Needs the `vms/mount` `patch` permission.
      operationId: putExperimentsNameVmsNameFilesUpload
      parameters:
        - $ref: "#/components/parameters/ExpName"
        - $ref: "#/components/parameters/VMName"
        - name: path
          in: query
          description: the folder to write into, relative to the mount
          required: true
          schema:
            type: string
          example: tmp
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  title: File
                  type: string
                  format: binary
                  description: the file, saved under its file name
                  example: notes.txt
      responses:
        "200":
          description: the file was written
        "400":
          description: the VM is not mounted, or the path is outside the mount
        "403":
          description: forbidden
        "500":
          description: the folder does not exist, the form has no file, or the file could not be written
  "/experiments/{exp_name}/vms/{vm_name}/snapshots":
    get:
      tags:
        - Virtual Machines
      summary: get phenix experiment VM snapshots
      operationId: getExperimentsNameVmsNameSnapshots
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM to get snapshots for
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshots"
    post:
      tags:
        - Virtual Machines
      summary: create phenix experiment VM snapshot
      operationId: postExperimentsNameVmsNameSnapshots
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM to snapshot
          required: true
          schema:
            type: string
      requestBody:
        description: phenix VM snapshot parameters
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filename:
                  title: "Filename"
                  description: "Name or path of the requested file."
                  example: capture.pcap
                  type: string
      responses:
        "204":
          description: successful operation
  "/experiments/{exp_name}/vms/{vm_name}/snapshots/{snapshot}":
    post:
      tags:
        - Virtual Machines
      summary: restore phenix experiment VM to snapshot
      operationId: postExperimentsNameVmsNameSnapshotsSnapshot
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM to restore
          required: true
          schema:
            type: string
        - name: snapshot
          in: path
          description: name of snapshot to restore VM to
          required: true
          schema:
            type: string
      responses:
        "204":
          description: successful operation
  "/experiments/{exp_name}/vms/{vm_name}/unmount":
    delete:
      tags:
        - Virtual Machines
      summary: Unmount a VM's disk
      description: >-
        Ends the caller's use of the VM's mount, and unmounts the disk once
        no user is left, after waiting up to 30 seconds for the mount's file
        requests to finish. A VM that is not mounted answers 200 too. Only
        with the `vm-mount` feature. Needs the `vms/mount` `delete`
        permission.
      operationId: deleteExperimentsNameVmsNameUnmount
      parameters:
        - $ref: "#/components/parameters/ExpName"
        - $ref: "#/components/parameters/VMName"
      responses:
        "200":
          description: the caller's use ended, and the disk is unmounted when no one else uses it
        "403":
          description: forbidden
        "409":
          description: >-
            the disk is being mounted or unmounted, or file requests kept it
            busy for 30 seconds (`mount busy`)
        "500":
          description: the disk could not be unmounted
  "/vms":
    get:
      tags:
        - Virtual Machines
      summary: Get all running VMs
      operationId: getVMs
      parameters:
        - name: screenshot
          in: query
          description: whether or not to include VM screenshots (value is size to grab)
          required: false
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          headers:
            X-Phenix-Observed-At:
              $ref: "#/components/headers/ObservedAt"
            X-Phenix-Stale:
              $ref: "#/components/headers/Stale"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMs"
        "500":
          description: the store could not be read, so no experiments are known
  "/soh":
    get:
      tags:
        - State of Health
      summary: Summarize the state of health of every experiment
      description: >-
        One summary per experiment the caller may `get` (the same check as
        `GET /experiments/{name}/soh`); needs the `experiments` `list`
        permission. Results come from each experiment's soh app status. VM
        states come from one `vm info summary` per running experiment, or,
        while an experiment is starting or stopping, from the states last
        read. At most 50 failing checks and down VMs are listed per
        experiment.
      operationId: getSoH
      responses:
        "200":
          description: >-
            successful operation; the headers report the oldest VM states in
            the response, and whether any are earlier states
          headers:
            X-Phenix-Observed-At:
              $ref: "#/components/headers/ObservedAt"
            X-Phenix-Stale:
              $ref: "#/components/headers/Stale"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoHSummaries"
        "403":
          description: the role may not list experiments
  "/applications":
    get:
      tags:
        - Applications
      summary: Get all available user applications
      operationId: getApplications
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Applications"
  "/builder":
    servers:
      - url: http://localhost:3000
    get:
      tags:
        - Builder
      summary: Open the Topology Builder
      description: >-
        The graphical Topology Builder's page, served from the server root
        rather than under `/api/v1`. It calls the `/builder/topologies` and
        `/experiments/builder` API routes with the signed-in user's token.
      operationId: getBuilderPage
      responses:
        "200":
          description: the Builder page
          content:
            text/html:
              schema:
                type: string
        "500":
          description: the page could not be read
  "/builder/save":
    servers:
      - url: http://localhost:3000
    post:
      tags:
        - Builder
      summary: Download a Builder diagram as a file
      description: >-
        Sends the posted diagram back as an attachment, which is how the
        Builder's File menu saves a diagram to the user's computer. The
        Builder posts a hidden form whose fields hold `encodeURIComponent`
        results, which are decoded once more. Served from the server root,
        and needs no credentials, since it only echoes what it is sent.
      operationId: postBuilderSave
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - xml
              properties:
                xml:
                  title: XML
                  type: string
                  description: the diagram, URI-encoded
                  example: "%3CmxGraphModel%2F%3E"
                filename:
                  title: Filename
                  type: string
                  description: the attachment's name, URI-encoded; defaults to `export`
                  example: demo.xml
                format:
                  title: Format
                  type: string
                  description: the diagram's format
                  enum: [xml, svg]
                  default: xml
      responses:
        "200":
          description: the diagram, as an attachment
          content:
            application/xml:
              schema:
                type: string
            image/svg+xml:
              schema:
                type: string
        "400":
          description: >-
            no diagram, a field that is not URI-encoded, or a format other
            than xml or svg
  "/builder/topologies":
    get:
      tags:
        - Builder
      summary: Get topologies that carry a Builder diagram
      operationId: getBuilderTopologies
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topologies"
        "403":
          description: listing topologies not allowed for this user
    post:
      tags:
        - Builder
      summary: Create a topology and its Builder diagram
      description: >-
        Creates the topology config and stores the diagram on it. Does not
        create an experiment. Refused while an experiment built from a topology
        of the same name is running.
      operationId: postBuilderTopology
      requestBody:
        description: Builder topology and diagram
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTopology"
      responses:
        "201":
          description: topology created
          headers:
            Location:
              description: path the new diagram is readable at
              schema:
                type: string
        "400":
          description: name, topology, or builderXML missing, or the spec is invalid
        "403":
          description: creating this topology not allowed for this user
        "409":
          description: another Builder write holds this name
  "/builder/topologies/{name}":
    get:
      tags:
        - Builder
      summary: Get one Builder diagram
      operationId: getBuilderTopology
      parameters:
        - name: name
          in: path
          description: topology name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/xml:
              schema:
                type: string
        "400":
          description: the topology does not carry a Builder diagram
        "403":
          description: getting this topology not allowed for this user
        "404":
          description: topology not found
        "500":
          description: reading the topology from the store failed
    put:
      tags:
        - Builder
      summary: Update a topology and its Builder diagram
      description: >-
        Writes only the spec and the diagram, leaving the rest of the stored
        config's metadata intact. Does not create or update an experiment.
      operationId: putBuilderTopology
      parameters:
        - name: name
          in: path
          description: topology name, which takes precedence over the payload
          required: true
          schema:
            type: string
      responses:
        "204":
          description: topology updated
        "400":
          description: >-
            topology or builderXML missing, the spec is invalid, the topology
            does not exist, or an experiment built from it is running
        "403":
          description: updating this topology not allowed for this user
        "409":
          description: another Builder write holds this name
      requestBody:
        description: Builder topology and diagram
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTopology"
  "/experiments/builder":
    post:
      tags:
        - Builder
      summary: Create a topology and a same-named experiment from Builder
      operationId: postExperimentFromBuilder
      requestBody:
        description: Builder topology, diagram, VLAN aliases, and scenario
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTopology"
      responses:
        "200":
          description: successful operation
        "400":
          description: request invalid, or the topology or experiment failed validation
        "403":
          description: creating experiments not allowed for this user
        "409":
          description: experiment locked for creation
    put:
      tags:
        - Builder
      summary: Update a Builder topology and its same-named experiment
      operationId: putExperimentFromBuilder
      requestBody:
        description: Builder topology, diagram, VLAN aliases, and scenario
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTopology"
      responses:
        "200":
          description: successful operation
        "400":
          description: request invalid, or the experiment is running
        "403":
          description: updating experiments not allowed for this user
        "409":
          description: experiment locked for update
  "/topologies":
    get:
      tags:
        - Topologies
      summary: Get all available topologies
      operationId: getTopologies
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topologies"
  "/topologies/{name}/scenarios":
    get:
      tags:
        - Topologies
      summary: Get the scenarios of a topology
      description: >-
        Maps each scenario whose `topology` annotation names the topology,
        and that the role may list, to the apps it runs. Needs the
        `scenarios` `list` permission.
      operationId: getTopologiesNameScenarios
      parameters:
        - name: name
          in: path
          description: name of the topology
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  scenarios:
                    title: Scenarios
                    type: object
                    description: each scenario's apps, by scenario name
                    additionalProperties:
                      type: array
                      items:
                        type: string
                    example:
                      demo-scenario: [soh, scorch]
        "403":
          description: forbidden
        "500":
          description: the scenarios could not be listed
  "/disks":
    get:
      tags:
        - Disks
      summary: Get all available disk images
      description: >-
        Lists the disk images in the minimega files directory and its folders,
        the images the experiments' topologies use wherever they are, and the
        images backing any of them, each once by its full path. The folders
        searched go at most 16 levels below the files directory and leave out
        hidden names (starting with `.`), `lost+found`, the experiment folders
        `<experiment>/files`, `<experiment>/tmp` and
        `<experiment>/miniccc_responses`, and the top-level `saved` and
        `transfer_*` folders; symlinked folders are not followed. Needs the
        `disks` `list` permission. A `disks` name is an image's file name, so
        it covers the files of that name in every folder. Lists only the images
        whose names the role may list, and of those outside the files
        directory only the ones an experiment the role may `get` uses, or that
        back an image the role sees. Each image's experiments are cut to those
        the role may `list`.
      operationId: getDisks
      parameters:
        - name: expName
          in: query
          description: >-
            look only in this experiment's topology, rather than every
            experiment's, for the images and uses it reports; needs the
            `experiments` `get` permission for it
          required: false
          schema:
            type: string
        - name: diskType
          in: query
          description: comma-separated kinds to list (vm, container, iso, unknown); all by default
          required: false
          schema:
            type: string
        - name: refresh
          in: query
          description: >-
            set to true to inspect every image again rather than reuse what is
            known about images that have not changed
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Disks"
        "403":
          description: >-
            forbidden, including an `expName` the role may not get
        "404":
          description: no experiment named `expName`
    post:
      tags:
        - Disks
      summary: Upload a disk image
      description: >-
        Writes the uploaded file to the top level of the minimega files
        directory, under the file's own name. Needs the `disks` `upload`
        permission.
      operationId: postDisks
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  title: File
                  description: the disk image file to upload
                  example: ubuntu.qc2
                  type: string
                  format: binary
              required:
                - file
      responses:
        "200":
          description: successful operation
        "403":
          description: forbidden
        "500":
          description: the upload could not be read or written
    delete:
      tags:
        - Disks
      summary: Delete a disk image
      description: >-
        Deletes the image's file. Images backed by it stop working. Needs the
        `disks` `delete` permission for the image's file name.
      operationId: deleteDisks
      parameters:
        - name: disk
          in: query
          description: >-
            the image, relative to the minimega files directory or absolute;
            it must be inside that directory and not in a folder the disk list
            leaves out
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
        "400":
          description: >-
            a path outside the minimega files directory or in a folder the
            disk list leaves out, or a folder
        "403":
          description: forbidden
        "404":
          description: no such image
        "500":
          description: the file could not be deleted
  "/disks/snapshot":
    post:
      tags:
        - Disks
      summary: Snapshot a disk image
      description: >-
        Makes a new qcow2 image backed by the image, with minimega's `disk
        snapshot`. Needs the `disks` `create` permission for the new image's
        file name and `get` for the image's.
      operationId: postDisksSnapshot
      parameters:
        - name: disk
          in: query
          description: >-
            the image, relative to the minimega files directory or absolute;
            it must be inside that directory and not in a folder the disk list
            leaves out
          required: true
          schema:
            type: string
        - name: new
          in: query
          description: >-
            the new image, relative to the folder holding `disk` or absolute:
            a file that does not exist yet, so not empty and not ending in `/`
            or in a `.` or `..` element; `.qcow2` is added unless it ends in
            `.qc2` or `.qcow2`
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
        "400":
          description: >-
            a path outside the minimega files directory or in a folder the
            disk list leaves out, an image that is not a regular file, a `new`
            that names a folder rather than a file, or a name minimega cannot
            use (white space, quotes, a backslash, `#`, `$`, `,`, glob
            characters or a control character)
        "403":
          description: forbidden
        "404":
          description: no such image, or no folder for the new one
        "409":
          description: the new image exists already
        "500":
          description: minimega could not make the snapshot
  "/disks/commit":
    post:
      tags:
        - Disks
      summary: Commit a disk image into its backing image
      description: >-
        Writes the image's changes into the image backing it, with minimega's
        `disk commit`. Needs the `disks` `update` permission for both images'
        file names.
      operationId: postDisksCommit
      parameters:
        - name: disk
          in: query
          description: >-
            the image, relative to the minimega files directory or absolute;
            it must be inside that directory and not in a folder the disk list
            leaves out
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
        "400":
          description: >-
            the image or its backing image is outside the minimega files
            directory, in a folder the disk list leaves out, or not a regular
            file, or the image's name is one minimega cannot use
        "403":
          description: forbidden
        "404":
          description: no such image
        "500":
          description: the image has no backing image, or the commit failed
  "/disks/rebase":
    post:
      tags:
        - Disks
      summary: Change a disk image's backing image
      description: >-
        Sets the image's backing image with minimega's `disk set-backing`, or,
        with `unsafe` false, `disk rebase`. Needs the `disks` `update`
        permission for the image's file name.
      operationId: postDisksRebase
      parameters:
        - name: disk
          in: query
          description: >-
            the image, relative to the minimega files directory or absolute;
            it must be inside that directory and not in a folder the disk list
            leaves out
          required: true
          schema:
            type: string
        - name: backing
          in: query
          description: >-
            the new backing image, as for `disk`; empty makes the image
            independent
          required: true
          schema:
            type: string
        - name: unsafe
          in: query
          description: >-
            true to change only the name of the backing image, false to also
            write into the image what differs between the old backing image and
            the new one
          required: true
          schema:
            type: boolean
      responses:
        "200":
          description: successful operation
        "400":
          description: >-
            a path outside the minimega files directory or in a folder the
            disk list leaves out, an image that is not a regular file, a name
            minimega cannot use (white space, quotes, a backslash, `#`, `$`,
            `,`, glob characters or a control character), or an `unsafe` that
            is not a boolean
        "403":
          description: forbidden
        "404":
          description: no such image
        "500":
          description: minimega could not change the backing image
  "/disks/resize":
    post:
      tags:
        - Disks
      summary: Resize a disk image
      description: >-
        Resizes the image with minimega's `disk resize`. Needs the `disks`
        `update` permission for the image's file name.
      operationId: postDisksResize
      parameters:
        - name: disk
          in: query
          description: >-
            the image, relative to the minimega files directory or absolute;
            it must be inside that directory and not in a folder the disk list
            leaves out
          required: true
          schema:
            type: string
        - name: size
          in: query
          description: >-
            the new size, or a change to it with a leading `+` or `-`, suffixed
            with K, M, G, T, P or E; for example `50G` or `-500M`
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
        "400":
          description: >-
            a path outside the minimega files directory or in a folder the
            disk list leaves out, an image that is not a regular file, or a
            name minimega cannot use (white space, quotes, a backslash, `#`,
            `$`, `,`, glob characters or a control character)
        "403":
          description: forbidden
        "404":
          description: no such image
        "500":
          description: >-
            a size not in the form above, or minimega could not resize the
            image
  "/disks/clone":
    post:
      tags:
        - Disks
      summary: Copy a disk image
      description: >-
        Copies the image's file to a new file, never replacing one. Needs the
        `disks` `create` permission for the new image's file name and `get`
        for the image's.
      operationId: postDisksClone
      parameters:
        - name: disk
          in: query
          description: >-
            the image, relative to the minimega files directory or absolute;
            it must be inside that directory and not in a folder the disk list
            leaves out
          required: true
          schema:
            type: string
        - name: new
          in: query
          description: >-
            the new image, relative to the folder holding `disk` or absolute:
            a file that does not exist yet, so not empty and not ending in `/`
            or in a `.` or `..` element; `.qcow2` is added unless it ends in
            `.qc2` or `.qcow2`
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
        "400":
          description: >-
            a path outside the minimega files directory or in a folder the
            disk list leaves out, an image that is not a regular file, a `new`
            that names a folder rather than a file, or a new name minimega
            cannot use
        "403":
          description: forbidden
        "404":
          description: no such image, or no folder for the new one
        "409":
          description: the new image exists already
        "500":
          description: the copy failed
  "/disks/clone/jobs":
    post:
      tags:
        - Disks
        - Jobs
      summary: Copy a disk image in a background job
      description: >-
        Checks the request as POST /disks/clone does, then copies the image in
        a `disk.clone` background job whose one item is the new image's file
        name and whose progress counts the bytes copied. The copy goes to a
        hidden temporary file (`.<new>.partial-<hex>`) that becomes the new
        image only once complete, so a canceled or interrupted clone leaves no
        image; the server deletes such temporary files when it starts. Needs
        the `disks` `create` permission for the new image's file name and
        `get` for the image's.
      operationId: postDisksCloneJob
      parameters:
        - name: disk
          in: query
          description: the image, as for POST /disks/clone
          required: true
          schema:
            type: string
        - name: new
          in: query
          description: the new image, as for POST /disks/clone
          required: true
          schema:
            type: string
      responses:
        "202":
          description: the job, started
          headers:
            Location:
              description: the job, at /api/v1/jobs/{id} under the server's base path
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          description: as for POST /disks/clone
        "403":
          description: forbidden
        "404":
          description: no such image, or no folder for the new one
        "409":
          description: the new image exists already
        "429":
          description: >-
            too many of the user's jobs, or of all jobs, are waiting to run;
            `Retry-After` says when to try again
  "/disks/rename":
    post:
      tags:
        - Disks
      summary: Rename a disk image
      description: >-
        Renames the image's file, never replacing a file. Images backed by it
        stop working until they are rebased onto the new name. Needs the
        `disks` `update` permission for the image's file name.
      operationId: postDisksRename
      parameters:
        - name: disk
          in: query
          description: >-
            the image, relative to the minimega files directory or absolute;
            it must be inside that directory and not in a folder the disk list
            leaves out
          required: true
          schema:
            type: string
        - name: new
          in: query
          description: >-
            the new image, relative to the folder holding `disk` or absolute:
            a file that does not exist yet, so not empty and not ending in `/`
            or in a `.` or `..` element; `.qcow2` is added unless it ends in
            `.qc2` or `.qcow2`
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
        "400":
          description: >-
            a path outside the minimega files directory or in a folder the
            disk list leaves out, a folder, a `new` that names a folder rather
            than a file, or a new name minimega cannot use
        "403":
          description: forbidden
        "404":
          description: no such image, or no folder for the new one
        "409":
          description: the new image exists already
        "500":
          description: >-
            the rename failed, such as when the new image's folder is on
            another file system
  "/disks/download":
    get:
      tags:
        - Disks
      summary: Download a disk image
      description: >-
        Streams the image's file as an attachment. Downloads resume: send
        `Range` with `If-Range` set to the `ETag` of an earlier response, and
        the rest comes back (206) only while the image is unchanged. An image
        a running VM writes to changes under the download, so stop the VM
        first for a consistent copy. Needs the `disks` `get` permission for
        the image's file name.
      operationId: getDisksDownload
      parameters:
        - name: disk
          in: query
          description: >-
            the image, relative to the minimega files directory or absolute;
            it must be inside that directory and not in a folder the disk list
            leaves out
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/RangeHeader"
        - $ref: "#/components/parameters/IfRangeHeader"
        - $ref: "#/components/parameters/IfNoneMatchHeader"
      responses:
        "200":
          description: the image's file
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/LastModified"
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
            Repr-Digest:
              $ref: "#/components/headers/ReprDigest"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          $ref: "#/components/responses/PartialContent"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: >-
            a path outside the minimega files directory or in a folder the
            disk list leaves out, or a folder
        "403":
          description: forbidden
        "404":
          description: no such image
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
    head:
      tags:
        - Disks
      summary: Check a disk image download
      description: >-
        The GET response's headers without the image: its size
        (Content-Length), `ETag` and `Last-Modified`. Needs the `disks` `get`
        permission for the image's file name.
      operationId: headDisksDownload
      parameters:
        - name: disk
          in: query
          description: >-
            the image, relative to the minimega files directory or absolute;
            it must be inside that directory and not in a folder the disk list
            leaves out
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/RangeHeader"
        - $ref: "#/components/parameters/IfRangeHeader"
        - $ref: "#/components/parameters/IfNoneMatchHeader"
      responses:
        "200":
          description: the image's headers
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/LastModified"
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
            Repr-Digest:
              $ref: "#/components/headers/ReprDigest"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: >-
            a path outside the minimega files directory or in a folder the
            disk list leaves out, or a folder
        "403":
          description: forbidden
        "404":
          description: no such image
  "/disks/checksum":
    get:
      tags:
        - Disks
      summary: Get a disk image's SHA-256 checksum
      description: >-
        Computes the image's SHA-256 in the background, at most two files at
        a time server-wide, and keeps it in memory for as long as the image is
        unchanged: 202 until it is known, then 200. A large image takes
        minutes. From then on, downloads of the image carry it as
        `Repr-Digest`. Needs the `disks` `get` permission for the image's
        file name.
      operationId: getDisksChecksum
      parameters:
        - name: disk
          in: query
          description: >-
            the image, relative to the minimega files directory or absolute;
            it must be inside that directory and not in a folder the disk list
            leaves out
          required: true
          schema:
            type: string
      responses:
        "200":
          description: the file's checksum
          headers:
            Repr-Digest:
              $ref: "#/components/headers/ReprDigest"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileChecksum"
        "202":
          description: the checksum is being computed; ask again later
          headers:
            Retry-After:
              description: seconds to wait before asking again
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileChecksum"
        "400":
          description: >-
            a path outside the minimega files directory or in a folder the
            disk list leaves out, or a folder
        "403":
          description: forbidden
        "404":
          description: no such image
        "409":
          description: the image changed while it was hashed; ask again
  "/hosts":
    get:
      tags:
        - Hosts
      summary: Get all cluster hosts
      description: >-
        The list is reused for up to 5 seconds; `X-Phenix-Observed-At` says
        when it was read from minimega. Each host's disk usage is measured at
        most once a minute.
      operationId: getHosts
      responses:
        "200":
          description: successful operation
          headers:
            X-Phenix-Observed-At:
              $ref: "#/components/headers/ObservedAt"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hosts"
  "/users":
    get:
      tags:
        - Users
      summary: Get all users
      operationId: getUsers
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Users"
    post:
      tags:
        - Users
      summary: Create a new user
      operationId: postUsers
      requestBody:
        description: user details
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  title: "Username"
                  description: "Username used to identify the account."
                  example: user@example.org
                  type: string
                password:
                  title: "Password"
                  description: "Password supplied for account creation or sign-in."
                  example: <password>
                  type: string
                first_name:
                  title: "First Name"
                  description: "User given name."
                  example: Alex
                  type: string
                last_name:
                  title: "Last Name"
                  description: "User family name."
                  example: Example
                  type: string
                role_name:
                  title: "Role Name"
                  description: "Name of the role assigned to the user."
                  example: Experiment User
                  type: string
                resource_names:
                  title: "Resource Names"
                  description: "Resource names assigned to the user."
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: >-
            the password does not meet the password rules, or the role does
            not exist; no user is stored
        "403":
          description: forbidden
        "409":
          description: a user with this username already exists
  "/users/{username}":
    get:
      tags:
        - Users
      summary: Get a specific user
      operationId: getUserUsername
      parameters:
