              $ref: "#/components/headers/BuilderETag"
            Warning:
              $ref: "#/components/headers/BuilderWarning"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderDraft"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "409":
          $ref: "#/components/responses/BuilderConflict"
        "412":
          $ref: "#/components/responses/BuilderPreconditionFailed"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
    put:
      tags:
        - Builder
      summary: Move the cursor of a Builder draft (undo and redo)
      description: The same operation as PATCH.
      operationId: putBuilderDraftCursor
      parameters:
        - $ref: "#/components/parameters/BuilderIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderCursorMove"
      responses:
        "200":
          description: cursor moved; the draft without its document
          headers:
            ETag:
              $ref: "#/components/headers/BuilderETag"
            Warning:
              $ref: "#/components/headers/BuilderWarning"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderDraft"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "409":
          $ref: "#/components/responses/BuilderConflict"
        "412":
          $ref: "#/components/responses/BuilderPreconditionFailed"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/drafts/{owner}/{draft}/publish":
    parameters:
      - $ref: "#/components/parameters/BuilderDraftOwner"
      - $ref: "#/components/parameters/BuilderDraftID"
    post:
      tags:
        - Builder
      summary: Publish a Builder draft to phenix configs
      description: >
        The only Builder operation that creates or updates configs
        (DELETE /builder/documents/{document} deletes a published topology).
        It publishes the draft's current snapshot; the request carries intent
        only. Requires `configs` `update` (and for another user's draft an
        edit share, or `builder-drafts` `update`), and the caller's own
        `configs` `create` or `update` on each target config according to its
        action, and `experiments` `create` or `update` for an experiment
        target. A draft imported from a stored Topology or Experiment also
        needs `configs` `get` on it and `topologies` `get` (or `experiments`
        `get`) on its name, to check it has not changed since.
        In either mode, a draft whose document lists `scenarios` has a
        `scenario` stage before the experiment's: each listed Scenario config
        must exist and be readable (`configs` `get` and `scenarios` `list`),
        else 422 naming it, and the topology is added to the `topology`
        annotation of each that does not name it yet, which needs `configs`
        `update` on it (else 403). A scenario that names it already is not
        written. The stage's message says which scenarios it changed.
        Publishing never creates or replaces a scenario's spec.
        Repeating a publication that already completed, with the If-Match it
        was sent with, answers 200 with every stage
        skipped. A draft updates an existing topology or experiment only when
        it was imported from it, or when it published it (or was opened from
        the published diagram that did) and nothing else changed it since;
        any other update is refused with 409. A topology that has a legacy
        Builder diagram (`builder-xml`) is updated by the draft imported from
        that topology only, not by one imported from an experiment built from
        it, and only while that diagram is the one the import read: a
        diagram changed, added or removed since is refused with 409, as a
        changed spec is. The update removes `builder-xml`, writes
        `builder-doc`, and adds a warning to the result, which says that the
        diagram was replaced or, for one the import could not read, that it
        was removed. A topology read from the Builder
        file its `builder-doc` annotation names is updated by a draft opened
        from that file, while the file still holds what the draft was opened
        from and the topology is still what the file publishes, and such a
        draft updates it in no other way: not as a draft imported from the
        topology either, when the file's document was. Publishing
        never writes the file: the topology keeps its `path`, and the result
        carries a warning that the file is now behind. A published experiment records
        which draft and published document published it, and its digest once
        its apps' configure stage ran, in its `builder-experiment`
        annotation; an experiment update runs that stage, as an update
        through `/configs` does. When a stage fails after earlier stages were
        written, the response is 409, 500 or 507 with a result whose status is
        `partial`. When the published document was stored but content it
        replaces could not be removed, the publication goes on and answers
        with a `Warning` header and a warning in the result.
      operationId: postBuilderDraftPublish
      parameters:
        - $ref: "#/components/parameters/BuilderIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderPublishRequest"
      responses:
        "200":
          description: publication succeeded
          headers:
            ETag:
              $ref: "#/components/headers/BuilderETag"
            Warning:
              $ref: "#/components/headers/BuilderWarning"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderPublishResult"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "409":
          description: >
            A target config or the draft changed since the publication was
            prepared, an included topology now defines a hostname the
            published topology also defines, or a stage failed on such a
            conflict after earlier stages were written (a `partial` result).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WebError"
                  - $ref: "#/components/schemas/BuilderPublishResult"
        "412":
          $ref: "#/components/responses/BuilderPreconditionFailed"
        "422":
          description: >
            The document fails validation, or publishes something phenix
            refuses, such as an interface of a device that is not external
            with no VLAN, interfaces that share an IP or MAC address, or a
            hostname phenix refuses (one character long, `all`, all digits, or
            `phenix` on a Windows node). The message names them. Also a
            scenario the document lists that does not exist or that the caller
            may not read, and an experiment scenario the document does not
            list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "500":
          description: >
            A stage failed after earlier stages were written (a `partial`
            result), or the draft could not be read.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WebError"
                  - $ref: "#/components/schemas/BuilderPublishResult"
        "507":
          description: >
            etcd is out of space. Nothing was written, or a stage failed after
            earlier stages were written (a `partial` result whose failed stage
            says so). The message says what an administrator must do.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WebError"
                  - $ref: "#/components/schemas/BuilderPublishResult"
  "/builder/drafts/{owner}/{draft}/shares":
    parameters:
      - $ref: "#/components/parameters/BuilderDraftOwner"
      - $ref: "#/components/parameters/BuilderDraftID"
    get:
      tags:
        - Builder
      summary: List who a Builder draft is shared with
      description: >
        Requires `configs` `get`, and owning the draft: only the owner learns
        who else has access (403 for anyone else who can see it). Each entry
        is checked against the account it was shared with; `stale` marks one
        whose account was deleted or replaced by a new one under the same
        name, which grants nothing. The list has its own entity tag,
        `"shares-N"`, for the next PUT.
      operationId: getBuilderDraftShares
      responses:
        "200":
          description: successful operation
          headers:
            ETag:
              $ref: "#/components/headers/BuilderSharesETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderShares"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
    put:
      tags:
        - Builder
      summary: Replace who a Builder draft is shared with
      description: >
        Requires `configs` `update`, owning the draft, and a user account of
        the caller's own (so not when authentication is off). The request
        replaces the whole list, of at most 25 users, each of whom must have
        an account; a share is bound to that account. A user whose account
        was replaced must be removed, saved, and added again. Changing the
        list also changes the draft's ETag, which the response carries in
        `draft.etag`; there is no top-level `etag`. A request that changes
        nothing answers 200 with both entity tags unchanged. Content saves
        never conflict with it: they use the draft's ETag, not the list's.
      operationId: putBuilderDraftShares
      parameters:
        - name: If-Match
          in: header
          description: >
            The list's entity tag, `"shares-N"` from GET or the last PUT
            (`"shares-0"` for a draft never shared). A missing header, a
            wildcard or a weak tag is rejected with 400; any other tag,
            including a draft ETag, with 412.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderShareUpdate"
      responses:
        "200":
          description: the list now stored
          headers:
            ETag:
              $ref: "#/components/headers/BuilderSharesETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderShares"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "412":
          description: >
            The If-Match header does not name the list's current entity tag,
            or the list changed while the request was handled. The response
            carries the current one.
          headers:
            ETag:
              $ref: "#/components/headers/BuilderSharesETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "413":
          description: The request body is larger than 64 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "422":
          description: Some entries were refused; `errors` says which and why.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderShareErrors"
        "503":
          description: >
            The draft kept changing while the list was written. Try again.
          headers:
            Retry-After:
              description: seconds to wait before trying again
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/drafts/{owner}/{draft}/shares/candidates":
    parameters:
      - $ref: "#/components/parameters/BuilderDraftOwner"
      - $ref: "#/components/parameters/BuilderDraftID"
    get:
      tags:
        - Builder
      summary: List who a Builder draft can be shared with
      description: >
        The same callers as PUT of the share list may ask (403 for anyone
        else who can see the draft). Lists, sorted by username, every account
        that can receive a share, whatever the caller's `users` permissions:
        every user with an account other than the owner whom a PUT of the
        share list would accept, so not a user the draft is shared with
        through an account since removed. Users the draft is already shared
        with are listed too.
      operationId: getBuilderDraftShareCandidates
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderShareCandidates"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
  "/builder/sources":
    get:
      tags:
        - Builder
      summary: List the configs Builder can use as sources
      description: >
        Requires `configs` `list`. Topologies and experiments can be imported
        with POST /builder/generate; scenarios and images are offered for
        selection only. Each config is filtered by `configs` `list` for its
        name and, for topologies, experiments and scenarios, by the `list`
        permission of that resource. A topology also reports how many
        topologies it includes (`includeCount`), to a caller who holds
        `configs` `get` for its name.
      operationId: getBuilderSources
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderSources"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
  "/builder/generate":
    post:
      tags:
        - Builder
      summary: Import a Builder document from a Topology or Experiment config
      description: >
        Converts a stored config (`source`) or an uploaded one (`content`)
        into a document and returns it; nothing is written. Requires `configs`
        `get`. A stored source also needs `configs` `get` for its name and the
        `topologies` or `experiments` `list` permission for it. Uploaded
        content needs `configs` `create`, because it is parsed as POST
        /configs parses a config, including the substitution of `${NAME}` from
        the server's environment (sandialabs/sceptre-phenix#436 describes
        this). A Topology that has the `builder-xml` annotation and no
        `builder-doc` is converted from its legacy Builder diagram, as POST
        /builder/legacy converts one: its `source` then has `builder`
        `builder-xml`. The topologies a Topology includes
        (`includeTopologies`) are read from the config store with the caller's
        permissions, never from a file. With `includes` `keep`, the default,
        their nodes are in the document marked `includedFrom` and read only,
        and the includes that could not be read are listed in the document's
        `source.unresolvedIncludes`. With `includes` `combine`, their nodes
        are the document's own, and only the includes that could not be read
        stay in its `source.includeTopologies`. `copy` asks for the same
        document as a plain import, not linked to the topology. A combined
        document and a copy name no config: `source.kind` is `manual`, the
        document's name is the new topology's name, and a draft made from it
        publishes a new topology and never updates the one it was imported
        from. The new name is `name`, or else the source's name with
        `-combined` or `-copy` added; the server does not look for a name no
        topology has. The response's `source` is still the config that was
        read. Answered with 400 when `includes` has another value, or when
        `name` is given without `copy` or `includes` `combine`. Answered with
        422 when `copy` or `includes` `combine` is asked of an Experiment,
        when the new name is not a config name of 1 to 512 bytes, and when it
        is the name of the stored topology being imported.
      operationId: postBuilderGenerate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderGenerateRequest"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderGenerateResult"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "413":
          $ref: "#/components/responses/BuilderTooLarge"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
  "/builder/legacy":
    post:
      tags:
        - Builder
      summary: Convert a legacy Builder diagram into a Builder document
      description: >
        Converts a diagram of the legacy Builder (the editor phenix had
        before the Builder) and returns the document; nothing is written, and
        nothing is read from the store but the topologies a topology
        includes. `content` is the text of a file: the diagram's mxGraph XML,
        whose root element is `mxGraphModel` or `root`, or a Topology config,
        as YAML or JSON, that has the `builder-xml` annotation. No encoded or
        compressed form of the XML is read. For a diagram alone, the node
        settings the diagram holds are the nodes, its `$NAME` placeholders
        are replaced from its own variables and the legacy defaults, and the
        document's source is `manual`, so a draft made from it publishes a
        new topology. For a Topology, its spec is the truth for every node
        and the diagram only places them, matched by hostname; the response
        has its `source`, with `stored` false. Requires `configs` `get` and
        `configs` `create`: a Topology config is parsed as POST /configs
        parses one, including the substitution of `${NAME}` from the
        server's environment. `content` holds at most 5242880 bytes, its XML
        nests at most 32 elements deep and holds at most 10000 cells, and a
        DOCTYPE or any other declaration is refused. A refusal repeats
        nothing of the content but the name and kind of a config, or the
        name of the XML's root element.
      operationId: postBuilderLegacy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderLegacyRequest"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderGenerateResult"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "413":
          $ref: "#/components/responses/BuilderTooLarge"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
  "/builder/export/topology":
    post:
      tags:
        - Builder
      summary: Export a Builder document as the Topology config Publish writes
      description: >
        Projects the document onto the phenix Topology config a publish of it
        would write, and returns it as YAML; nothing is read or written.
        Requires `configs` `get`, as opening a draft does. The document is
        checked as saving a draft checks it, within the same size limits. The
        config has no `builder-doc` annotation and names the document's
        included topologies in `includeTopologies` rather than merging them.
        A document phenix's config validation refuses is refused with 422, as
        a publish refuses it. A publish names interfaces without a VLAN, then
        addresses interfaces share, then hostnames phenix refuses, before any
        other reason; an export names interfaces without a VLAN only when a
        `vlan` is missing or null, and hostnames only when one is a single
        character, which the validation refuses too, and otherwise gives the
        validation's own reason. What only publishing refuses, such as an
        interface with a blank VLAN, interfaces that share an IP or MAC
        address, or a hostname phenix refuses only when it creates an
        experiment (`all`, all digits, or `phenix` on a Windows node), is
        reported in `publishBlockers` instead.
      operationId: postBuilderExportTopology
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTopologyExportRequest"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTopologyExport"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "413":
          $ref: "#/components/responses/BuilderTooLarge"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
  "/builder/documents":
    get:
      tags:
        - Builder
      summary: List published Builder documents
      description: >
        Requires `configs` `list`. Lists the documents that configs currently
        reference in their `builder-doc` annotation, filtered by `configs`
        `list` for the config each one was published to. A topology whose
        annotation names a Builder file (`path`), and no stored document that
        is current, is listed with `source` `file` and the path only: the
        listing reads no file, so such a row is listed whether or not the
        file can be used. A row with `source` `store` has `experiment` when
        the publication behind the document made an experiment that still
        exists, is built from the row's topology, and the caller holds
        `experiments` `get` for it.
      operationId: getBuilderDocuments
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderPublishedDocuments"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
  "/builder/documents/{document}":
    get:
      tags:
        - Builder
      summary: Get a published Builder document
      description: >
        Requires `configs` `get` for the config the document was published
        to. A document the caller may not read, or that no config references
        any more, is answered with 404.
      operationId: getBuilderDocument
      parameters:
        - name: document
          in: path
          description: published document ID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderPublishedDocument"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
    delete:
      tags:
        - Builder
      summary: Delete a published Builder topology
      description: >
        Deletes the Topology config the document is current for, as
        `DELETE /configs/Topology/{name}` does, then every published document
        of that topology. Drafts and experiments made from it are not
        changed. Requires `configs` `delete` for the topology; a document the
        caller may not get, or that is no longer current (the topology was
        changed to reference another document, published again or deleted),
        is answered with 404. A published experiment is refused with 422:
        experiments are deleted from the Experiments page.
      operationId: deleteBuilderDocument
      parameters:
        - name: document
          in: path
          description: published document ID
          required: true
          schema:
            type: string
      responses:
        "204":
          description: >
            The topology is deleted. A Warning header says its published
            documents could not all be removed; they are never listed again,
            and a later server start removes them.
          headers:
            Warning:
              $ref: "#/components/headers/BuilderWarning"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
  "/builder/topologies/{topology}/document":
    get:
      tags:
        - Builder
      summary: Get the Builder document a topology references
      description: >
        Returns the document the topology's `builder-doc` annotation names,
        wherever it is kept. The stored published document wins: the one the
        annotation's `id` or `digest` names for this topology. Without one,
        the Builder file at the annotation's `path` is read from the phenix
        server, on every request. The file must be below the phenix base
        directory (`--base-dir.phenix`) and outside the directory VM file
        systems are mounted in, be a regular file of at most 5 MiB reached
        through no symbolic link that leaves the base directory or has an
        absolute target, and hold a valid Builder document as JSON or
        YAML. A `digest` beside `path` pins the file: a file whose document
        has another digest is refused. Requires `configs` `get` for the
        topology, which says nothing of the file: a caller who may create
        or update any one topology can name any Builder file below the base
        directory in it, and read that file here. A topology the caller may
        not get, one that does not exist, and one that references no document
        are all answered with the same 404. A file that cannot be used is
        answered with a fixed sentence naming the path, never with anything
        the file holds.
      operationId: getBuilderTopologyDocument
      parameters:
        - name: topology
          in: path
          description: topology name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >
            The document, with `digest`, `size` and `document`. For a file,
            `topologyDiffers` says whether the stored topology differs from
            what the document publishes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderPublishedDocument"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          description: >
            The topology does not exist, the caller may not get it, or it
            references no Builder document; or the Builder file it names
            does not exist on this phenix server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "413":
          description: The Builder file is larger than 5 MiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "422":
          description: >
            The Builder file is outside the directory phenix reads Builder
            files from, cannot be read, is not a regular file, is not a valid
            Builder document, or does not match the digest the topology
            records for it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
  "/builder/icons":
    get:
      tags:
        - Builder
      summary: List the icons of your Builder icon library
      description: >
        Requires `configs` `list`. Returns only the caller's own icons, each
        with its PNG as base64, sorted by name, and the library's limits. An
        icon library belongs to one user: no operation reaches the library of
        another user, whatever the caller's role. The image is only ever sent
        as base64 inside JSON, never as an image. Every response of the icon
        operations also carries
        `Content-Security-Policy: default-src 'none'; frame-ancestors 'none'`.
      operationId: listBuilderIcons
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderIconList"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
    post:
      tags:
        - Builder
      summary: Add an icon to your Builder icon library
      description: >
        Requires `configs` `create`. Takes a PNG of at most 96 by 96 pixels
        and 65536 bytes, as base64. Only the bytes say what the image is: no
        file name, extension or declared type is read, and anything that is
        not a PNG (SVG, JPEG, GIF, WebP) is refused. A PNG that holds only
        the chunks `IHDR`, `PLTE`, `tRNS`, `IDAT` and `IEND`, a `PLTE` or
        `tRNS` only where its color type uses one, nothing after its pixels,
        and is at most 40960 bytes is stored as it is. Any other is encoded
        again, which keeps its pixels and drops everything else (text,
        metadata, color profiles, further frames, an unused palette, data
        after the pixels), so use the `id` and `data` the response returns.
        Sending bytes the library already holds answers 200 with the stored
        icon, under the name it has. A library holds at most 64 icons and
        1 MiB of PNG bytes.
      operationId: createBuilderIcon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderIconUpload"
      responses:
        "200":
          description: the library already held this icon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderIcon"
        "201":
          description: icon added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderIcon"
        "400":
          description: >
            The request is malformed: its body is not a single JSON value of
            the expected shape (unknown fields are rejected), or `data` is
            missing or not base64.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "413":
          description: >
            The request body is larger than 131072 bytes, or the image is
            larger than 65536 bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "422":
          description: >
            The image is not a PNG, is more than 96 pixels wide or high, or
            its name is over 64 bytes or holds control characters; or the
            library is full.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/icons/{icon}":
    delete:
      tags:
        - Builder
      summary: Delete an icon from your Builder icon library
      description: >
        Requires `configs` `delete`. Diagrams that use the icon keep their
        own copy. An icon the caller's library does not hold, and a path
        that is not 64 lowercase hex digits, are answered with the same 404.
      operationId: deleteBuilderIcon
      parameters:
        - name: icon
          in: path
          description: the 64 hex digits of the icon ID, without `sha256:`
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
      responses:
        "204":
          description: icon deleted
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          description: The caller's library holds no such icon.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
  "/builder/templates":
    get:
      tags:
        - Builder
      summary: List the device templates you can use
      description: >
        Requires `configs` `list`. Returns the templates and collections the
        caller can use, and the custom icons those templates name. First the
        caller's own library (`source` `own`), in the order its items were
        added; then, sorted by owner, the items of other users' libraries
        shared with the caller (`shared`) or published to every user
        (`server`), read only, as they are now. A template in a collection
        shared with the caller, or published, is listed as well; an item
        seen both ways is `shared`. A share applies only to the account it
        was made for. A user who never changed the library has the five
        built-in templates (`server`, `workstation`, `router`, `firewall`,
        `external`), at version 1 and without times; the first change stores
        them, and a built-in template that is deleted is never added again.
        A library record of the caller's that this server cannot read is
        reported with `damaged` true and none of its items; every change of
        it is then refused with 409. Another user's library that cannot be
        read is left out.
      operationId: getBuilderTemplates
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplateLibrary"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
  "/builder/templates/candidates":
    get:
      tags:
        - Builder
      summary: List who your Builder templates can be shared with
      description: >
        Requires `configs` `update` and a user account of the caller's own,
        as sharing does (403 otherwise; so not with authentication off).
        Lists, sorted by username, every account a share request would
        accept, whatever the caller's `users` permissions: every user with
        an account other than the caller.
      operationId: getBuilderTemplateShareCandidates
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderShareCandidates"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
  "/builder/templates/{owner}/items":
    parameters:
      - $ref: "#/components/parameters/BuilderTemplateOwner"
    post:
      tags:
        - Builder
      summary: Add device templates to your template library
      description: >
        Requires `configs` `create`, and being `{owner}`. Adds 1 to 200
        templates in one write, each under a new ID. With `collection`, a new
        collection holding exactly those templates is made in the same write.
        A template that names a custom icon (`device.icon`) needs that icon
        in the library already or in `icons`; an entry of `icons` nothing
        names is dropped. The first change of a library also stores the
        built-in templates it started with.
      operationId: createBuilderTemplates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTemplateCreate"
      responses:
        "201":
          description: templates added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplateCreateResult"
        "400":
          description: >
            The request is malformed: its body is not a single JSON value of
            the expected shape (unknown fields are rejected), or it names no
            template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderTemplateNotFound"
        "409":
          $ref: "#/components/responses/BuilderTemplateDamaged"
        "413":
          $ref: "#/components/responses/BuilderTemplateTooLarge"
        "422":
          $ref: "#/components/responses/BuilderTemplateUnprocessable"
        "503":
          $ref: "#/components/responses/BuilderTemplateBusy"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/templates/{owner}/items/{template}":
    parameters:
      - $ref: "#/components/parameters/BuilderTemplateOwner"
      - $ref: "#/components/parameters/BuilderTemplateID"
    put:
      tags:
        - Builder
      summary: Replace a device template of your template library
      description: >
        Requires `configs` `update`, and being `{owner}`. Replaces the name,
        the description and the device of one template, which keeps its ID.
        The custom icon rule of POST /builder/templates/{owner}/items holds;
        an icon no template names any more leaves the library. Content equal
        to what is stored changes nothing and keeps the entity tag. Devices
        already made from the template are not changed.
      operationId: putBuilderTemplate
      parameters:
        - $ref: "#/components/parameters/BuilderTemplateIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTemplateContent"
      responses:
        "200":
          description: the template now stored
          headers:
            ETag:
              $ref: "#/components/headers/BuilderTemplateETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplate"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderTemplateNotFound"
        "409":
          $ref: "#/components/responses/BuilderTemplateDamaged"
        "412":
          $ref: "#/components/responses/BuilderTemplatePreconditionFailed"
        "413":
          $ref: "#/components/responses/BuilderTemplateTooLarge"
        "422":
          $ref: "#/components/responses/BuilderTemplateUnprocessable"
        "503":
          $ref: "#/components/responses/BuilderTemplateBusy"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/templates/{owner}/collections":
    parameters:
      - $ref: "#/components/parameters/BuilderTemplateOwner"
    post:
      tags:
        - Builder
      summary: Add a collection to your template library
      description: >
        Requires `configs` `create`, and being `{owner}`. A collection is a
        named group of templates of the same library; a template may be in
        several. Every ID in `templateIds` must name a template of the
        library, once.
      operationId: createBuilderTemplateCollection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTemplateCollectionContent"
      responses:
        "201":
          description: collection added
          headers:
            ETag:
              $ref: "#/components/headers/BuilderTemplateETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplateCollection"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderTemplateNotFound"
        "409":
          $ref: "#/components/responses/BuilderTemplateDamaged"
        "413":
          $ref: "#/components/responses/BuilderTemplateTooLarge"
        "422":
          $ref: "#/components/responses/BuilderTemplateUnprocessable"
        "503":
          $ref: "#/components/responses/BuilderTemplateBusy"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/templates/{owner}/collections/{collection}":
    parameters:
      - $ref: "#/components/parameters/BuilderTemplateOwner"
      - $ref: "#/components/parameters/BuilderTemplateCollectionID"
    put:
      tags:
        - Builder
      summary: Replace a collection of your template library
      description: >
        Requires `configs` `update`, and being `{owner}`. Replaces the name,
        the description and the templates of one collection, which keeps its
        ID. Adding a template to a collection, and removing one from it, is
        this request with the changed list. Content equal to what is stored
        changes nothing and keeps the entity tag.
      operationId: putBuilderTemplateCollection
      parameters:
        - $ref: "#/components/parameters/BuilderTemplateIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTemplateCollectionContent"
      responses:
        "200":
          description: the collection now stored
          headers:
            ETag:
              $ref: "#/components/headers/BuilderTemplateETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplateCollection"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderTemplateNotFound"
        "409":
          $ref: "#/components/responses/BuilderTemplateDamaged"
        "412":
          $ref: "#/components/responses/BuilderTemplatePreconditionFailed"
        "413":
          $ref: "#/components/responses/BuilderTemplateTooLarge"
        "422":
          $ref: "#/components/responses/BuilderTemplateUnprocessable"
        "503":
          $ref: "#/components/responses/BuilderTemplateBusy"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/templates/{owner}/delete":
    parameters:
      - $ref: "#/components/parameters/BuilderTemplateOwner"
    post:
      tags:
        - Builder
      summary: Delete templates and collections of your template library
      description: >
        Requires `configs` `delete`, and being `{owner}`. Deletes the named
        templates and collections in one write. An ID the library does not
        hold is ignored, so repeating the request is harmless. A deleted
        template leaves every collection that held it, and its custom icon
        leaves the library with the last template that names it; a deleted
        collection leaves its templates. A built-in template is deleted like
        any other and does not come back. Diagrams are not changed: a device
        made from a template keeps no link to it.
      operationId: deleteBuilderTemplates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTemplateSelection"
      responses:
        "200":
          description: how many templates and collections were deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplateDeleteResult"
        "400":
          description: >
            The request is malformed: its body is not a single JSON value of
            the expected shape (unknown fields are rejected), or it names
            neither a template nor a collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderTemplateNotFound"
        "409":
          $ref: "#/components/responses/BuilderTemplateDamaged"
        "413":
          description: The request body is larger than 64 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "503":
          $ref: "#/components/responses/BuilderTemplateBusy"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/templates/{owner}/share":
    parameters:
      - $ref: "#/components/parameters/BuilderTemplateOwner"
    post:
      tags:
        - Builder
      summary: Share templates and collections of your template library
      description: >
        Requires `configs` `update`, being `{owner}`, and a user account of
        the caller's own (403 without it, so not with authentication off).
        Adds the users in `add` to, and removes the users in `remove` from,
        who each named template and collection is shared with. A recipient
        sees the item read only, as it is now, and can copy it into its own
        library; sharing a collection shares its templates. The request is
        a change of each list, not a new list: adding a user an item is
        already shared with, or removing one it is not, changes nothing, so
        no entity tag is needed. Every user added must have an account, and
        the share is bound to it: it grants nothing once that account is
        deleted, or replaced by a new one under the same name, until the
        user is added again. When a user in `add` is refused, nothing is
        changed (422). An item that would be shared with more than 25 users
        keeps its list, and an ID the library does not hold is ignored; both
        are named in `failed`, and the other items are changed. Changes are
        logged to the security log.
      operationId: shareBuilderTemplates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTemplateShareUpdate"
      responses:
        "200":
          description: the items that were not changed, if any
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplateResult"
        "400":
          description: >
            The request is malformed: its body is not a single JSON value of
            the expected shape (unknown fields are rejected), or it names no
            template or collection, or no user to add or remove.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderTemplateNotFound"
        "409":
          $ref: "#/components/responses/BuilderTemplateDamaged"
        "413":
          description: The request body is larger than 64 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "422":
          description: >
            A user in `add` or `remove` was refused: `owner` (the caller),
            `invalid-user`, `unknown-user` (no such account), `duplicate`
            (both added and removed), or `too-many` (more than 25 users
            added). Nothing was changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderShareErrors"
        "503":
          $ref: "#/components/responses/BuilderTemplateBusy"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/templates/{owner}/publish":
    parameters:
      - name: owner
        in: path
        description: >
          the user whose template library holds the items: the caller, or,
          to take items back from every user, any user
        required: true
        schema:
          type: string
    post:
      tags:
        - Builder
      summary: Publish templates and collections to every user, or take them back
      description: >
        Requires `configs` `update`. With `serverWide` true, publishes the
        named templates and collections of the caller's own library to every
        user, read only; this also requires `builder-templates` `publish`
        (403 without it), and for a library of another user the answer is
        404. Publishing a collection publishes its templates. Publishing an
        item already published keeps who published it and when. With
        `serverWide` false, takes the items back: the owner may, and so may
        anyone with `builder-templates` `publish`, for any user's library
        (403 for anyone else). An ID the library does not hold is named in
        `failed`, and the other items are changed. Publishing does not need
        a user account. Changes are logged to the security log.
      operationId: publishBuilderTemplates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTemplatePublishUpdate"
      responses:
        "200":
          description: the items that were not changed, if any
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplateResult"
        "400":
          description: >
            The request is malformed: its body is not a single JSON value of
            the expected shape (unknown fields are rejected), it has no
            `serverWide`, or it names no template or collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          description: >
            `serverWide` is true and `{owner}` is not the caller: an item is
            published by its owner only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "409":
          $ref: "#/components/responses/BuilderTemplateDamaged"
        "413":
          description: The request body is larger than 64 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "503":
          $ref: "#/components/responses/BuilderTemplateBusy"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
  - url: http://localhost:3000/api/v1
components:
  schemas:
    Configs:
      type: object
      properties:
        configs:
          type: array
          items:
            $ref: "#/components/schemas/Config"
    Config:
      type: object
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          type: object
          properties:
            name:
              type: string
            annotations:
              description: >
                Text values by key. `builder-doc` is the one annotation that
                is a map: the Builder document a topology references.
              type: object
              properties:
                builder-doc:
                  $ref: "#/components/schemas/BuilderDocumentReference"
              additionalProperties:
                type: string
          required:
            - name
        spec:
          type: object
          additionalProperties: true
      required:
        - apiVersion
        - kind
        - metadata
        - spec
    BuilderDocumentReference:
      description: >
        The Builder document a topology references, in its `builder-doc`
        annotation. It holds at least one sub-key. Publish writes `digest`
        and `id`, and keeps a `path` the topology already has. A config whose
        reference is not valid is refused. When a topology is created or
        updated with an `id` that is not the one its `digest` gives for the
        topology's name, as a renamed or copied topology has, the `id` is
        dropped, and the `digest` too unless `path` is set.
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        digest:
          description: >
            digest of the document's canonical JSON, `sha256:` and 64
            lowercase hex digits. It names the stored published document of
            this topology with that content, and pins the content of the
            file `path` names.
          type: string
        id:
          description: >
            ID of a stored published document (see `/builder/documents`).
            It names a document only when that document was published to
            this topology.
          type: string
        path:
          description: >
            absolute, clean path of a Builder document file on the phenix
            server, at most 1024 bytes, ending in `.json`, `.yaml` or `.yml`.
          type: string
    Experiments:
      type: object
      properties:
        experiments:
          type: array
          items:
            $ref: "#/components/schemas/Experiment"
    Experiment:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        topology:
          type: string
        apps:
          type: array
          items:
            type: string
        start_time:
          type: string
          format: date-time
        running:
          type: boolean
        vm_count:
          type: integer
        vlan_min:
          type: integer
        vlan_max:
          type: integer
        vlan_count:
          type: integer
        vlans:
          type: array
          items:
            type: object
            properties:
              vlan:
                type: integer
              alias:
                type: string
        vms:
          $ref: "#/components/schemas/VMs"
    VMs:
      type: object
      properties:
        vms:
          type: array
          items:
            $ref: "#/components/schemas/VM"
    VM:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        experiment:
          type: string
        host:
          type: string
        ipv4:
          type: array
          items:
            type: string
        cpus:
          type: integer
        ram:
          type: integer
        disk:
          type: string
        dnb:
          type: boolean
        networks:
          type: array
          items:
            type: string
        taps:
          type: array
          items:
            type: string
        captures:
          type: array
          items:
            $ref: "#/components/schemas/Capture"
        running:
          type: boolean
        uptime:
          type: number
          format: float
        screenshot:
          type: string
          format: base64
    Schedule:
      type: object
      properties:
        schedule:
