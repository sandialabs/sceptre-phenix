      - $ref: "#/components/parameters/BuilderDraftOwner"
      - $ref: "#/components/parameters/BuilderDraftID"
    patch:
      tags:
        - Builder
      summary: Move the cursor of a Builder draft (undo and redo)
      description: >
        Requires `configs` `update`. For the draft of another user, also
        requires an edit share or `builder-drafts` `update`. No snapshot is
        discarded. The server also accepts PUT.
      operationId: patchBuilderDraftCursor
      parameters:
        - $ref: "#/components/parameters/BuilderIfMatch"
      requestBody:
