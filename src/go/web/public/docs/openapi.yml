        experiment the draft published, or the published diagram it was
        opened from did, while one still exists and the caller holds
        `experiments` `get` for it.
      operationId: getBuilderDraft
      responses:
        "200":
          description: successful operation
          headers:
            ETag:
              $ref: "#/components/headers/BuilderETag"
          content:
            application/json:
