          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
  "/experiments/{exp_name}/vms/{vm_name}/redeploy":
    post:
      tags:
        - Virtual Machines
      summary: redeploy VM in experiment
      description: >-
        Needs the `vms/redeploy` `update` permission.
      operationId: postExperimentsNameVMsNameRedeploy
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM to redeploy
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cpus:
                  title: CPUs
                  description: number of virtual CPUs to give the VM; 0 keeps its current count
                  example: 2
                  type: integer
                ram:
                  title: RAM
                  description: memory to give the VM, in megabytes; 0 keeps its current memory
                  example: 2048
                  type: integer
                disk:
                  title: Disk
                  example: ubuntu.qc2
                  type: string
                  description: >-
                    the image to boot from, relative to the minimega files
                    directory or absolute; empty keeps the VM's disk
                injects:
                  title: Injects
                  example: true
                  type: boolean
                  description: whether to apply the VM's injections again
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        "400":
          description: >-
            an invalid request body, or a disk whose name minimega cannot use
            (white space, quotes, a backslash, `#`, `$`, `,`, glob characters
            or a control character)
        "403":
          description: forbidden
        "409":
          description: the VM is busy
        "500":
          description: the redeploy failed
  "/experiments/{exp_name}/vms/{vm_name}/screenshot.png":
    get:
