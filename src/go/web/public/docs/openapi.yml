                    type: string
                    description: the new image's name
                    example: web-committed.qc2
                  vm:
                    title: VM
                    description: the VM
                    allOf:
                      - $ref: "#/components/schemas/VM"
        "400":
          description: >-
            a malformed body, no filename, or an experiment that could not be
            read afterwards
        "403":
          description: forbidden
        "409":
          description: another action holds the VM
        "500":
          description: the disk could not be committed, or the VM read back
