                last_name:
                  title: "Last Name"
                  description: "User family name."
                  example: Example
                  type: string
                role_name:
                  title: "Role Name"
                  description: "Name of the role assigned to the user."
                  example: Experiment User
                  type: string
                resource_names:
                  title: "Resource Names"
                  description: "Resource names assigned to the user."
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      tags:
        - Users
      summary: Delete existing user
      operationId: deleteUsersUsername
      parameters:
        - name: username
          in: path
          description: username of user to delete
          required: true
          schema:
            type: string
      responses:
        "204":
          description: successful operation
  "/users/{username}/tokens":
    post:
      tags:
        - Users
      summary: Create an API token for a user
      description: >-
        Signs a token for the user that lasts the lifetime given, and adds it
        to the user's tokens. The token works until it expires or is removed.
        Needs the `users` `patch` permission on the user and, for a user other
        than the requester, `users/tokens` `create` on them as well.
      operationId: postUsersUsernameTokens
      parameters:
        - name: username
          in: path
          description: the user to create the token for
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - lifetime
              properties:
                lifetime:
                  title: Lifetime
                  type: string
                  description: >-
                    how long the token lasts: a Go duration, such as `720h`,
                    or a whole number of days, such as `30`
                  example: 720h
                desc:
                  title: Description
                  type: string
                  description: a note on the token (the default is the time it was made)
                  example: CI pipeline
      responses:
        "200":
          description: the token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    title: Token
                    type: string
                    description: the token, for `X-Phenix-Auth-Token`
                    example: eyJhbGciOi...example
                  desc:
                    title: Description
                    type: string
                    description: the token's note
                    example: CI pipeline
                  exp:
                    title: Expiration
                    type: string
                    format: date-time
                    description: when the token expires
                    example: "2026-02-01T10:00:00Z"
        "400":
          description: a malformed body, or a lifetime that is neither a duration nor a number of days
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the user does not exist, or the token could not be signed or saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
