    Captures:
      type: object
      properties:
        captures:
          type: array
          items:
            $ref: "#/components/schemas/Capture"
    Capture:
      type: object
      properties:
        vm:
          type: string
        interface:
          type: integer
        filepath:
          type: string
    Snapshots:
      type: object
      properties:
        snapshots:
          type: array
          items:
            type: string
    Files:
      type: object
      properties:
        files:
          type: array
          items:
            type: string
    Hosts:
      type: object
      properties:
        hosts:
          type: array
          items:
            $ref: "#/components/schemas/Host"
    Host:
      type: object
      properties:
        name:
          type: string
        cpus:
          type: integer
        load:
          type: string
        memused:
          type: integer
        memtotal:
          type: integer
        bandwidth:
          type: string
        vms:
          type: integer
        uptime:
          type: number
          format: float
        schedulable:
          type: boolean
    Applications:
      type: object
      properties:
        applications:
          type: array
