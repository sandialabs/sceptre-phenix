openapi: 3.0.0
info:
  description: phenix API
  version: 0.0.0
  title: phenix
  termsOfService: http://swagger.io/terms/
  contact:
    url: https://github.com/sandialabs/sceptre-phenix
  license:
    name: GNU General Public License v3.0
tags:
  - name: Configs
    description: Config details and controls
  - name: Schemas
    description: Config spec schemas
  - name: Experiments
    description: Experiments details and controls
  - name: Virtual Machines
    description: Experiment VM details and controls
  - name: Hosts
    description: Cluster host details
  - name: Applications
    description: Available phenix user applications
  - name: Topologies
    description: Available phenix topologies
  - name: Builder
    description: Graphical topology Builder diagrams and the topologies built from them
  - name: Disks
    description: Available phenix disk images
  - name: Users
    description: User details and controls
  - name: Workflow
    description: Workflow config upserts and applies, and the server options clients read
paths:
  "/configs":
    get:
      tags:
        - Configs
      summary: Get all phenix configs
      description: ""
      operationId: getConfigs
      parameters:
        - name: kind
          in: query
          description: limit configs to specified kind (defaults to all)
          required: false
          schema:
            type: string
            enum:
              - all
              - topology
              - scenario
              - experiment
              - image
              - user
              - role
            default: all
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Configs"
    post:
      tags:
        - Configs
      summary: Create new phenix config
      description: ""
      operationId: postConfigs
      requestBody:
        description: phenix config creation parameters
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Config"
          application/x-yaml:
            schema:
              $ref: "#/components/schemas/Config"
          multipart/form-data:
            schema:
              type: object
              properties:
                fileupload:
                  type: string
                  format: binary
      responses:
        "201":
          description: successful config creation
          headers:
            Location:
              schema:
                description: location of newly created config
                type: string
                format: uri
        "400":
          description: >
            unknown content type or file extension, unparsable body (the parser
            error in metadata.validation), unknown kind, a config with the same
            name that already exists, a schema validation failure (explained
            lines in metadata.validation, original validator text in
            metadata.validation-raw), or a config hook or the store rejects the
            config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: creating configs is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the request or the uploaded file cannot be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/configs/{kind}/{name}":
    get:
      tags:
        - Configs
      summary: Get existing phenix config
      description: ""
      operationId: getConfigsKindName
      parameters:
        - name: kind
          in: path
          description: kind of phenix config to get
          required: true
          schema:
            type: string
        - name: name
          in: path
          description: name of phenix config to get
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          description: content format for response
          required: false
          schema:
            type: string
            enum:
              - application/json
              - application/x-yaml
            default: application/json
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
            application/x-yaml:
              schema:
                $ref: "#/components/schemas/Config"
    put:
      tags:
        - Configs
      summary: Update existing phenix config
      description: >
        Can also be used to rename a config by changing the name in the metadata
        portion of the config header and using the old name in the request path.
      operationId: putConfigsKindName
      parameters:
        - name: kind
          in: path
          description: kind of phenix config to get
          required: true
          schema:
            type: string
        - name: name
          in: path
          description: name of phenix config to get
          required: true
          schema:
            type: string
      requestBody:
        description: phenix config update parameters
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Config"
          application/x-yaml:
            schema:
              $ref: "#/components/schemas/Config"
          multipart/form-data:
            schema:
              type: object
              properties:
                fileupload:
                  type: string
                  format: binary
      responses:
        "204":
          description: successful config update
          headers:
            Location:
              schema:
                description: location of updated config
                type: string
                format: uri
        "400":
          description: >
            unknown content type or file extension, a config that does not exist,
            an unknown kind, a schema validation failure (explained lines in
            metadata.validation, original validator text in
            metadata.validation-raw), or a config hook or the store rejects the
            config; for an Experiment config, also a failure to reconfigure the
            experiment after the updated config was stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: updating the config is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: the request or the uploaded file cannot be read or parsed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - Configs
      summary: Delete existing phenix config
      description: ""
      operationId: deleteConfigsKindName
      parameters:
        - name: kind
          in: path
          description: kind of phenix config to delete
          required: true
          schema:
            type: string
        - name: name
          in: path
          description: name of phenix config to delete
          required: true
          schema:
            type: string
      responses:
        "204":
          description: successful operation
  "/schemas/{version}":
    get:
      tags:
        - Schemas
      summary: Get full schema (all config specs) for specific version
      description: ""
      operationId: getSchemasVersion
      parameters:
        - name: version
          in: path
          description: version of phenix config schema to get
          required: true
          schema:
            type: string
            enum:
              - "v0"
              - "v1"
              - "v2"
        - name: Accept
          in: header
          description: content format for response
          required: false
          schema:
            type: string
            enum:
              - application/json
              - application/x-yaml
            default: application/json
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            application/x-yaml:
              schema:
                type: object
                additionalProperties: true
  "/schemas/{kind}/{version}":
    get:
      tags:
        - Schemas
      summary: Get schema for specific config spec kind/version
      description: the Workflow schema exists only in version v0
      operationId: getSchemasKindVersion
      parameters:
        - name: kind
          in: path
          description: kind of phenix config schema to get
          required: true
          schema:
            type: string
            enum:
              - topology
              - scenario
              - experiment
              - image
              - user
              - role
              - workflow
        - name: version
          in: path
          description: version of phenix config schema to get
          required: true
          schema:
            type: string
            enum:
              - "v0"
              - "v1"
              - "v2"
        - name: Accept
          in: header
          description: content format for response
          required: false
          schema:
            type: string
            enum:
              - application/json
              - application/x-yaml
            default: application/json
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            application/x-yaml:
              schema:
                type: object
                additionalProperties: true
  "/experiments":
    get:
      tags:
        - Experiments
      summary: Get all phenix experiments
      description: ""
      operationId: getExperiments
      parameters:
        - name: screenshot
          in: query
          description: whether or not to include VM screenshots (value is size to grab)
          required: false
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiments"
    post:
      tags:
        - Experiments
      summary: Create new phenix experiment
      description: ""
      operationId: postExperiments
      requestBody:
        description: phenix experiment creation parameters
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                topology:
                  type: string
                apps:
                  type: array
                  items:
                    type: string
                vlan_min:
                  type: integer
                vlan_max:
                  type: integer
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
  "/experiments/{name}":
    get:
      tags:
        - Experiments
      summary: Get existing phenix experiment
      description: ""
      operationId: getExperimentsName
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get
          required: true
          schema:
            type: string
        - name: screenshot
          in: query
          description: whether or not to include VM screenshots (value is size to grab)
          required: false
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
    delete:
      tags:
        - Experiments
      summary: Delete existing phenix experiment
      description: ""
      operationId: deleteExperimentsName
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to delete
          required: true
          schema:
            type: string
      responses:
        "204":
          description: successful operation
  "/experiments/{name}/start":
    post:
      tags:
        - Experiments
      summary: Start existing phenix experiment
      description: ""
      operationId: postExperimentsNameStart
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to start
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
  "/experiments/{name}/stop":
    post:
      tags:
        - Experiments
      summary: Stop existing phenix experiment
      description: ""
      operationId: postExperimentsNameStop
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to stop
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
  "/experiments/{name}/schedule":
    get:
      tags:
        - Experiments
      summary: Get current schedule for existing experiment
      description: ""
      operationId: getExperimentsNameSchedule
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get schedule for
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
    post:
      tags:
        - Experiments
      summary: Update current schedule for existing experiment
      description: ""
      operationId: postExperimentsNameSchedule
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to update schedule for
          required: true
          schema:
            type: name
      requestBody:
        description: scheduling algorithm to use
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                algorithm:
                  type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
  "/experiments/{name}/captures":
    get:
      tags:
        - Experiments
      summary: Get captures for existing experiment
      description: ""
      operationId: getExperimentsNameCaptures
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get captures for
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Captures"
  "/experiments/{name}/files":
    get:
      tags:
        - Experiments
      summary: Get list of files for experiment
      description: ""
      operationId: getExperimentsNameFiles
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get files for
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Files"
  "/experiments/{name}/files/{filename}":
    get:
      tags:
        - Experiments
      summary: Download experiment file
      description: ""
      operationId: getExperimentsNameFilesFilename
      parameters:
        - name: name
          in: path
          description: name of phenix experiment to get file from
          required: true
          schema:
            type: string
        - name: filename
          in: path
          description: name of file download
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  "/experiments/{exp_name}/vms":
    get:
      tags:
        - Virtual Machines
      summary: get all VMs in existing experiment
      description: ""
      operationId: getExperimentsNameVms
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment to get VMs for
          required: true
          schema:
            type: string
        - name: screenshot
          in: query
          description: whether or not to include VM screenshots (value is size to grab)
          required: false
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMs"
  "/experiments/{exp_name}/vms/{vm_name}":
    get:
      tags:
        - Virtual Machines
      summary: get given VM in existing experiment
      description: ""
      operationId: getExperimentsNameVmName
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment to get VM from
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix experiment VM to get
          required: true
          schema:
            type: string
        - name: screenshot
          in: query
          description: whether or not to include VM screenshots (value is size to grab)
          required: false
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
    patch:
      tags:
        - Virtual Machines
      summary: Update existing VM settings in existing experiment
      description: ""
      operationId: patchExperimentsNameVmsName
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment to modify
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix virtual machine to modify
          required: true
          schema:
            type: string
      requestBody:
        description: phenix virtual machine patch parameters
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                host:
                  type: string
                cpus:
                  type: integer
                ram:
                  type: integer
                disk:
                  type: string
                dnb:
                  type: boolean
                interface:
                  type: object
                  properties:
                    index:
                      type: integer
                    vlan:
                      type: integer
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
    delete:
      tags:
        - Virtual Machines
      summary: Delete phenix experiment VM
      description: ""
      operationId: deleteExperimentsNameVmsName
      parameters:
        - name: name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix virtual machine to delete
          required: true
          schema:
            type: string
      responses:
        "204":
          description: successful operation
  "/experiments/{exp_name}/vms/{vm_name}/start":
    post:
      tags:
        - Virtual Machines
      summary: start VM in experiment
      description: ""
      operationId: postExperimentsNameVMsNameStart
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM to start
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
  "/experiments/{exp_name}/vms/{vm_name}/stop":
    post:
      tags:
        - Virtual Machines
      summary: stop VM in experiment
      description: ""
      operationId: postExperimentsNameVMsNameStop
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM to stop
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
  "/experiments/{exp_name}/vms/{vm_name}/redeploy":
    post:
      tags:
        - Virtual Machines
      summary: redeploy VM in experiment
      description: ""
      operationId: postExperimentsNameVMsNameRedeploy
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM to redeploy
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
  "/experiments/{exp_name}/vms/{vm_name}/screenshot.png":
    get:
      tags:
        - Virtual Machines
      summary: Get screenshot of running VM in experiment
      description: ""
      operationId: getExperimentsNameVmsNameScreenshot
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix virtual machine to get screenshot from
          required: true
          schema:
            type: string
        - name: size
          in: query
          description: size of screenshot to grab
          required: false
          schema:
            type: string
        - name: base64
          in: query
          description: whether or not to base64 encode the screenshot image
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: successful operation
          content:
            image/png:
              schema:
                type: string
                format: base64
  "/experiments/{exp_name}/vms/{vm_name}/vnc/ws":
    get:
      tags:
        - Virtual Machines
      summary: Tunnel to VNC of running VM using a WebSocket
      description: ""
      operationId: getExperimentsNameVmsNameVncWs
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix virtual machine to connect to
          required: true
          schema:
            type: string
      responses:
        "101":
          description: switching protocols
  "/experiments/{exp_name}/vms/{vm_name}/captures":
    get:
      tags:
        - Virtual Machines
      summary: get phenix experiment VM packet captures
      description: ""
      operationId: getExperimentsNameVmsNameCaptures
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM to get captures for
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Captures"
    post:
      tags:
        - Virtual Machines
      summary: start phenix experiment VM packet capture
      description: ""
      operationId: postExperimentsNameVmsNameCapture
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM to start capture on
          required: true
          schema:
            type: string
      requestBody:
        description: phenix VM packet capture parameters
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                interface:
                  type: integer
                filename:
                  type: string
      responses:
        "204":
          description: successful operation
    delete:
      tags:
        - Virtual Machines
      summary: stop phenix experiment VM packet captures
      description: ""
      operationId: deleteExperimentsNameVmsNameCaptures
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM to stop captures on
          required: true
          schema:
            type: string
      responses:
        "204":
          description: successful operation
  "/experiments/{exp_name}/vms/{vm_name}/snapshots":
    get:
      tags:
        - Virtual Machines
      summary: get phenix experiment VM snapshots
      description: ""
      operationId: getExperimentsNameVmsNameSnapshots
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM to get snapshots for
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshots"
    post:
      tags:
        - Virtual Machines
      summary: create phenix experiment VM snapshot
      description: ""
      operationId: postExperimentsNameVmsNameSnapshots
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM to snapshot
          required: true
          schema:
            type: string
      requestBody:
        description: phenix VM snapshot parameters
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filename:
                  type: string
      responses:
        "204":
          description: successful operation
  "/experiments/{exp_name}/vms/{vm_name}/snapshots/{snapshot}":
    post:
      tags:
        - Virtual Machines
      summary: restore phenix experiment VM to snapshot
      description: ""
      operationId: postExperimentsNameVmsNameSnapshotsSnapshot
      parameters:
        - name: exp_name
          in: path
          description: name of phenix experiment
          required: true
          schema:
            type: string
        - name: vm_name
          in: path
          description: name of phenix VM to restore
          required: true
          schema:
            type: string
        - name: snapshot
          in: path
          description: name of snapshot to restore VM to
          required: true
          schema:
            type: string
      responses:
        "204":
          description: successful operation
  "/vms":
    get:
      tags:
        - Virtual Machines
      summary: Get all running VMs
      description: ""
      operationId: getVMs
      parameters:
        - name: screenshot
          in: query
          description: whether or not to include VM screenshots (value is size to grab)
          required: false
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMs"
  "/applications":
    get:
      tags:
        - Applications
      summary: Get all available user applications
      description: ""
      operationId: getApplications
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Applications"
  "/builder/topologies":
    get:
      tags:
        - Builder
      summary: Get topologies that carry a Builder diagram
      description: ""
      operationId: getBuilderTopologies
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topologies"
        "403":
          description: listing topologies not allowed for this user
    post:
      tags:
        - Builder
      summary: Create a topology and its Builder diagram
      description: >-
        Creates the topology config and stores the diagram on it. Does not
        create an experiment. Refused while an experiment built from a topology
        of the same name is running.
      operationId: postBuilderTopology
      requestBody:
        description: Builder topology and diagram
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTopology"
      responses:
        "201":
          description: topology created
          headers:
            Location:
              description: path the new diagram is readable at
              schema:
                type: string
        "400":
          description: name, topology, or builderXML missing, or the spec is invalid
        "403":
          description: creating this topology not allowed for this user
        "409":
          description: another Builder write holds this name
  "/builder/topologies/{name}":
    get:
      tags:
        - Builder
      summary: Get one Builder diagram
      description: ""
      operationId: getBuilderTopology
      parameters:
        - name: name
          in: path
          description: topology name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/xml:
              schema:
                type: string
        "400":
          description: the topology does not carry a Builder diagram
        "403":
          description: getting this topology not allowed for this user
        "404":
          description: topology not found
        "500":
          description: reading the topology from the store failed
    put:
      tags:
        - Builder
      summary: Update a topology and its Builder diagram
      description: >-
        Writes only the spec and the diagram, leaving the rest of the stored
        config's metadata intact. Does not create or update an experiment.
      operationId: putBuilderTopology
      parameters:
        - name: name
          in: path
          description: topology name, which takes precedence over the payload
          required: true
          schema:
            type: string
      responses:
        "204":
          description: topology updated
        "400":
          description: >-
            topology or builderXML missing, the spec is invalid, the topology
            does not exist, or an experiment built from it is running
        "403":
          description: updating this topology not allowed for this user
        "409":
          description: another Builder write holds this name
      requestBody:
        description: Builder topology and diagram
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTopology"
  "/experiments/builder":
