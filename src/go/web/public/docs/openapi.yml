        lowercase_req:
          title: Lowercase Req
          type: boolean
          description: whether a password needs a lowercase letter
          example: true
        uppercase_req:
          title: Uppercase Req
          type: boolean
          description: whether a password needs an uppercase letter
          example: true
        number_req:
          title: Number Req
          type: boolean
          description: whether a password needs a number
          example: true
        symbol_req:
          title: Symbol Req
          type: boolean
          description: whether a password needs a symbol
          example: false
        min_length:
          title: Min Length
