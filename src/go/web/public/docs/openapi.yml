  "/builder/drafts/{owner}/{draft}/publish":
    parameters:
      - $ref: "#/components/parameters/BuilderDraftOwner"
      - $ref: "#/components/parameters/BuilderDraftID"
    post:
      tags:
        - Builder
      summary: Publish a Builder draft to phenix configs
      description: >
        The only Builder operation that creates or updates configs
        (DELETE /builder/documents/{document} deletes a published topology).
        It publishes the draft's current snapshot; the request carries intent
        only. Requires `configs` `update` (and for another user's draft an
        edit share, or `builder-drafts` `update`), and the caller's own
        `configs` `create` or `update` on each target config according to its
        action, and `experiments` `create` or `update` for an experiment
        target. A draft imported from a stored Topology or Experiment also
        needs `configs` `get` on it and `topologies` `get` (or `experiments`
        `get`) on its name, to check it has not changed since.
        In either mode, a draft whose document lists `scenarios` has a
        `scenario` stage before the experiment's: each listed Scenario config
        must exist and be readable (`configs` `get` and `scenarios` `list`),
        else 422 naming it, and the topology is added to the `topology`
        annotation of each that does not name it yet, which needs `configs`
        `update` on it (else 403). A scenario that names it already is not
        written. The stage's message says which scenarios it changed.
        Publishing never creates or replaces a scenario's spec.
        Repeating a publication that already completed, with the If-Match it
        was sent with, answers 200 with every stage
        skipped. A draft updates an existing topology or experiment only when
        it was imported from it, or when it published it (or was opened from
        the published diagram that did) and nothing else changed it since;
        any other update is refused with 409. A topology that has a legacy
        Builder diagram (`builder-xml`) is updated by the draft imported from
        that topology only, not by one imported from an experiment built from
        it, and only while that diagram is the one the import read: a
        diagram changed, added or removed since is refused with 409, as a
        changed spec is. The update removes `builder-xml`, writes
        `builder-doc`, and adds a warning to the result, which says that the
        diagram was replaced or, for one the import could not read, that it
        was removed. A topology read from the Builder
        file its `builder-doc` annotation names is updated by a draft opened
        from that file, while the file still holds what the draft was opened
        from and the topology is still what the file publishes, and such a
        draft updates it in no other way: not as a draft imported from the
        topology either, when the file's document was. Publishing
        never writes the file: the topology keeps its `path`, and the result
        carries a warning that the file is now behind. A published experiment records
        which draft and published document published it, and its digest once
        its apps' configure stage ran, in its `builder-experiment`
        annotation; an experiment update runs that stage, as an update
        through `/configs` does. When a stage fails after earlier stages were
        written, the response is 409, 500 or 507 with a result whose status is
        `partial`. When the published document was stored but content it
        replaces could not be removed, the publication goes on and answers
        with a `Warning` header and a warning in the result.

        With `"dryRun": true` the request is a dry run: it needs the same
        permissions, makes every check of the publication on the draft's
        current snapshot, writes nothing (no published document, config,
        scenario annotation, experiment or draft record), needs no If-Match,
        and answers 200 with a `BuilderPublishPreview`: what the
        publication would change, the warnings it would give, and, in
        `errors`, the refusal a publication would answer with 400, 409 or
        422. A 403, a 404, a body that is not a publish request (400) and a
        server failure keep their status. It takes no lock, so what it
        reports may change before the publication is sent. The Publish
        dialog shows it as What publishing changes.
      operationId: postBuilderDraftPublish
      parameters:
        - name: If-Match
          in: header
          description: >
            The ETag of the draft revision the publication is based on, as
            for every Builder mutation (`BuilderIfMatch`): required, except
            for a dry run, which writes nothing and ignores it. A missing or
            malformed one is answered with 400 before the body is decoded,
            unless the body asks for a dry run.
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderPublishRequest"
      responses:
        "200":
          description: >
            publication succeeded, or, for a dry run, what it would change
            (`BuilderPublishPreview`, status `preview`)
          headers:
            ETag:
              $ref: "#/components/headers/BuilderETag"
            Warning:
              $ref: "#/components/headers/BuilderWarning"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BuilderPublishResult"
                  - $ref: "#/components/schemas/BuilderPublishPreview"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "409":
          description: >
            A target config or the draft changed since the publication was
            prepared, an included topology now defines a hostname the
            published topology also defines, or a stage failed on such a
            conflict after earlier stages were written (a `partial` result).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WebError"
                  - $ref: "#/components/schemas/BuilderPublishResult"
        "412":
          $ref: "#/components/responses/BuilderPreconditionFailed"
        "422":
          description: >
            The document fails validation, or publishes something phenix
            refuses, such as an interface of a device that is not external
            with no VLAN, interfaces that share an IP or MAC address, or a
            hostname phenix refuses (one character long, `all`, all digits, or
            `phenix` on a Windows node). The message names them. Also a
            scenario the document lists that does not exist or that the caller
            may not read, and an experiment scenario the document does not
            list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "500":
          description: >
            A stage failed after earlier stages were written (a `partial`
            result), or the draft could not be read.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WebError"
                  - $ref: "#/components/schemas/BuilderPublishResult"
        "507":
          description: >
            etcd is out of space. Nothing was written, or a stage failed after
            earlier stages were written (a `partial` result whose failed stage
            says so). The message says what an administrator must do.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WebError"
                  - $ref: "#/components/schemas/BuilderPublishResult"
  "/builder/drafts/{owner}/{draft}/preflight":
    parameters:
      - $ref: "#/components/parameters/BuilderDraftOwner"
      - $ref: "#/components/parameters/BuilderDraftID"
    post:
      tags:
        - Builder
      summary: Run preflight checks on a Builder draft
      description: >
        Puts the draft's current document through the checks the request
        names, in its order and all at once, and reports each as `passed`,
        `failed` or `unavailable`, with a summary and its issues. `capacity`
        compares the CPUs and memory of the devices phenix starts (every
        device but an external one; `hardware.vcpus` and `hardware.memory`,
        1 and 512 MB when unset) with what the schedulable cluster hosts have
        free, and checks that each device fits on one host, with its vCPUs
        and memory both within that host's CPUs and memory; `network` compares the
        VLANs the devices use and the networks' VLAN aliases with the VLAN
        range of the `experiment` named (none applies without one, or when
        the experiment sets no range), the aliases with the VLANs running
        experiments hold, and the bridges the interfaces name (and the
        experiment's default bridge, `phenix` without one) with the Open
        vSwitch bridges of the schedulable hosts, listed with `ovs-vsctl
        list-br` through minimega's `shell` command, which changes nothing;
        `disks` looks up each drive image by file
        name among the server's disk images and checks its kind (a VM or ISO
        image for a kvm device, a container image for a container); `apps`
        reads each Scenario config the document lists and looks up each app
        it does not disable among the default, built-in and user apps (a
        listed scenario that does not exist is the error
        `preflight.app.scenario-missing`). A
        check fails when one of its issues is an error. It is `unavailable`
        when it, or a part of it, could not be made and nothing failed: the
        caller's role lacks `hosts` `list` (capacity and bridges), `disks`
        `list`, `applications` `list`, `experiments` `list` (VLANs in use),
        read access to the experiment (`configs` `get` and `experiments`
        `get`) or to a scenario (`configs` `get` and `scenarios` `list`);
        minimega cannot be reached; the server lists no disk images; or the
        check took longer than 20 seconds. An issue says why (code
        `preflight.unavailable`, or `preflight.app.scenario-unreadable` as a
        warning for a scenario), and one check never keeps the others from
        being made. Needs what reading the draft needs (`configs` `get`, and
        for another user's draft a share or `builder-drafts` `get`). Nothing
        is written, and no VM or experiment is started.
      operationId: postBuilderDraftPreflight
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderPreflightRequest"
      responses:
        "200":
          description: each check named, in the request's order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderPreflightReport"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
  "/builder/drafts/{owner}/{draft}/shares":
    parameters:
      - $ref: "#/components/parameters/BuilderDraftOwner"
      - $ref: "#/components/parameters/BuilderDraftID"
    get:
      tags:
        - Builder
      summary: List who a Builder draft is shared with
      description: >
        Requires `configs` `get`, and owning the draft: only the owner learns
        who else has access (403 for anyone else who can see it). Each entry
        is checked against the account it was shared with; `stale` marks one
        whose account was deleted or replaced by a new one under the same
        name, which grants nothing. The list has its own entity tag,
        `"shares-N"`, for the next PUT.
      operationId: getBuilderDraftShares
      responses:
        "200":
          description: successful operation
          headers:
            ETag:
              $ref: "#/components/headers/BuilderSharesETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderShares"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
    put:
      tags:
        - Builder
      summary: Replace who a Builder draft is shared with
      description: >
        Requires `configs` `update`, owning the draft, and a user account of
        the caller's own (so not when authentication is off). The request
        replaces the whole list, of at most 25 users, each of whom must have
        an account; a share is bound to that account. A user whose account
        was replaced must be removed, saved, and added again. Changing the
        list also changes the draft's ETag, which the response carries in
        `draft.etag`; there is no top-level `etag`. A request that changes
        nothing answers 200 with both entity tags unchanged. Content saves
        never conflict with it: they use the draft's ETag, not the list's.
      operationId: putBuilderDraftShares
      parameters:
        - name: If-Match
          in: header
          description: >
            The list's entity tag, `"shares-N"` from GET or the last PUT
            (`"shares-0"` for a draft never shared). A missing header, a
            wildcard or a weak tag is rejected with 400; any other tag,
            including a draft ETag, with 412.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderShareUpdate"
      responses:
        "200":
          description: the list now stored
          headers:
            ETag:
              $ref: "#/components/headers/BuilderSharesETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderShares"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "412":
          description: >
            The If-Match header does not name the list's current entity tag,
            or the list changed while the request was handled
            (`draft.shares.stale`). The response carries the current one.
          headers:
            ETag:
              $ref: "#/components/headers/BuilderSharesETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "413":
          description: The request body is larger than 64 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "422":
          description: Some entries were refused; `errors` says which and why.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderShareErrors"
        "503":
          description: >
            The draft kept changing while the list was written. Try again.
          headers:
            Retry-After:
              description: seconds to wait before trying again
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/drafts/{owner}/{draft}/shares/candidates":
    parameters:
      - $ref: "#/components/parameters/BuilderDraftOwner"
      - $ref: "#/components/parameters/BuilderDraftID"
    get:
      tags:
        - Builder
      summary: List who a Builder draft can be shared with
      description: >
        The same callers as PUT of the share list may ask (403 for anyone
        else who can see the draft). Lists, sorted by username, every account
        that can receive a share, whatever the caller's `users` permissions:
        every user with an account other than the owner whom a PUT of the
        share list would accept, so not a user the draft is shared with
        through an account since removed. Users the draft is already shared
        with are listed too.
      operationId: getBuilderDraftShareCandidates
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderShareCandidates"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
  "/builder/sources":
    get:
      tags:
        - Builder
      summary: List the configs Builder can use as sources
      description: >
        Requires `configs` `list`. Topologies and experiments can be imported
        with POST /builder/generate; scenarios and images are offered for
        selection only. Each config is filtered by `configs` `list` for its
        name and, for topologies, experiments and scenarios, by the `list`
        permission of that resource. A topology also reports how many
        topologies it includes (`includeCount`), to a caller who holds
        `configs` `get` for its name.
      operationId: getBuilderSources
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderSources"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
  "/builder/generate":
    post:
      tags:
        - Builder
      summary: Import a Builder document from a Topology or Experiment config
      description: >
        Converts a stored config (`source`) or an uploaded one (`content`)
        into a document and returns it; nothing is written. Requires `configs`
        `get`. A stored source also needs `configs` `get` for its name and the
        `topologies` or `experiments` `list` permission for it. Uploaded
        content needs `configs` `create`, because it is parsed as POST
        /configs parses a config, including the substitution of `${NAME}` from
        the server's environment (sandialabs/sceptre-phenix#436 describes
        this). A Topology that has the `builder-xml` annotation and no
        `builder-doc` is converted from its legacy Builder diagram, as POST
        /builder/legacy converts one: its `source` then has `builder`
        `builder-xml`. The topologies a Topology includes
        (`includeTopologies`) are read from the config store with the caller's
        permissions, never from a file. With `includes` `keep`, the default,
        their nodes are in the document marked `includedFrom` and read only,
        and the includes that could not be read are listed in the document's
        `source.unresolvedIncludes`. With `includes` `combine`, their nodes
        are the document's own, and only the includes that could not be read
        stay in its `source.includeTopologies`. `copy` asks for the same
        document as a plain import, not linked to the topology. A combined
        document and a copy name no config: `source.kind` is `manual`, the
        document's name is the new topology's name, and a draft made from it
        publishes a new topology and never updates the one it was imported
        from. Their `metadata.notes` end with the note `Copied from <name>`,
        where `<name>` is the name in the source config's metadata. The new
        name is `name`, or else the source's name with
        `-combined` or `-copy` added; the server does not look for a name no
        topology has. The response's `source` is still the config that was
        read. An Experiment's scenario (its `scenario` annotation) becomes
        the document's `scenarios` when this server stores a Scenario config
        of that name that the caller may list (`configs` `list` and
        `scenarios` `list` for it); otherwise no scenario is listed and a
        warning says so. The scenario an Experiment holds is never taken
        into the document. For uploaded content, a listed scenario also adds
        a warning that it is this server's Scenario config of that name, not
        the copy the file holds. Answered with 400 when `includes` has
        another value, or when `name` is given without `copy` or `includes`
        `combine`. Answered with 422 when `copy` or `includes` `combine` is
        asked of an Experiment, when the new name is not a config name of 1
        to 512 bytes (`import.name.invalid`), and when it is the name of the
        stored topology being imported (`import.name.source`). Answered with
        500 when the config store cannot be read,
        such as for the Scenario config an Experiment names.
      operationId: postBuilderGenerate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderGenerateRequest"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderGenerateResult"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "413":
          $ref: "#/components/responses/BuilderTooLarge"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
        "500":
          description: >
            The config store could not be read: the stored source, or the
            Scenario config an imported Experiment names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
  "/builder/legacy":
    post:
      tags:
        - Builder
      summary: Convert a legacy Builder diagram into a Builder document
      description: >
        Converts a diagram of the legacy Builder (the editor phenix had
        before the Builder) and returns the document; nothing is written, and
        nothing is read from the store but the topologies a topology
        includes. `content` is the text of a file: the diagram's mxGraph XML,
        whose root element is `mxGraphModel` or `root`, or a Topology config,
        as YAML or JSON, that has the `builder-xml` annotation. No encoded or
        compressed form of the XML is read. For a diagram alone, the node
        settings the diagram holds are the nodes, its `$NAME` placeholders
        are replaced from its own variables and the legacy defaults, and the
        document's source is `manual`, so a draft made from it publishes a
        new topology. For a Topology, its spec is the truth for every node
        and the diagram only places them, matched by hostname; the response
        has its `source`, with `stored` false. Requires `configs` `get` and
        `configs` `create`: a Topology config is parsed as POST /configs
        parses one, including the substitution of `${NAME}` from the
        server's environment. `content` holds at most 5242880 bytes, its XML
        nests at most 32 elements deep and holds at most 10000 cells, and a
        DOCTYPE or any other declaration is refused. A refusal repeats
        nothing of the content but the name and kind of a config, or the
        name of the XML's root element.
      operationId: postBuilderLegacy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderLegacyRequest"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderGenerateResult"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "413":
          $ref: "#/components/responses/BuilderTooLarge"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
  "/builder/export/topology":
    post:
      tags:
        - Builder
      summary: Export a Builder document as the Topology config Publish writes
      description: >
        Projects the document onto the phenix Topology config a publish of it
        would write, and returns it as YAML; nothing is read or written.
        Requires `configs` `get`, as opening a draft does. The document is
        checked as saving a draft checks it, within the same size limits. The
        config has no `builder-doc` annotation and names the document's
        included topologies in `includeTopologies` rather than merging them.
        A document phenix's config validation refuses is refused with 422, as
        a publish refuses it. A publish names interfaces without a VLAN, then
        addresses interfaces share, then hostnames phenix refuses, before any
        other reason; an export names interfaces without a VLAN only when a
        `vlan` is missing or null, and hostnames only when one is a single
        character, which the validation refuses too, and otherwise gives the
        validation's own reason. What only publishing refuses, such as an
        interface with a blank VLAN, interfaces that share an IP or MAC
        address, or a hostname phenix refuses only when it creates an
        experiment (`all`, all digits, or `phenix` on a Windows node), is
        reported in `publishBlockers` instead.
      operationId: postBuilderExportTopology
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTopologyExportRequest"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTopologyExport"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "413":
          $ref: "#/components/responses/BuilderTooLarge"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
  "/builder/package":
    post:
      tags:
        - Builder
      summary: Make a Builder package of a document
      description: >
        Returns the package of the document the request carries, edits not
        saved yet included: the document, the sections `include` names, and
        the requirements, which list the document's scenarios, included
        topologies, templates, custom icons, the apps of the scenarios that
        could be read, and the files the document's devices and the packaged
        configs name (injection sources, app asset directories), whatever the
        package carries. Requires `configs` `get`. Each Scenario config the
        document names, and with `topologies` each included topology, is read
        from the config store under the caller's permissions (`configs`
        `get` on it and `scenarios` or `topologies` `list`); one that does
        not exist and one the caller may not read are named in the
        requirements but not carried, and a warning says so, in the same
        words for both. An include that is a file path is never read. The
        `icons` section gives the document a copy of each custom icon it
        names from the icon library. Configs are carried without their times
        and the Builder's annotations (`builder-*`). The package never holds
        the content of a file, a script or an app. Nothing is written. The
        package answered is always one `POST /builder/package/resolve` takes:
        a requirements entry the package format refuses (blank, longer than
        4096 bytes, holding control characters such as a newline in an
        injection source, or past the first 1000 entries of its list) is left
        out of the requirements, and a warning names it. Each warning is an
        issue with its code (`package.config.unreadable`,
        `package.include.file-path`, `package.icon.missing`,
        `package.icons.too-many`, `package.requirement.left-out`,
        `package.requirements.truncated`). Anything else the package would
        be refused for, such as a stored config without a spec, is answered
        422 with the code `package.invalid` and the issues. A package larger
        than 5242880 bytes is refused with 413 and the code
        `package.too-large`.
      operationId: postBuilderPackage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderPackageRequest"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderPackageResult"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "413":
          $ref: "#/components/responses/BuilderTooLarge"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
  "/builder/package/resolve":
    post:
      tags:
        - Builder
      summary: Check what a Builder package's diagram needs on this server
      description: >
        Reports, for each entry of the package's requirements, whether this
        server has it. Requires `configs` `get`. The package is the request
        body, at most 5242880 bytes (413 beyond, with the code
        `package.too-large`), decoded strictly (unknown fields are refused)
        and checked as the package schema describes, else 422 with the code
        `package.invalid` and, for a package that does not validate, each
        problem in `issues`; a carried config with a Builder annotation
        (`builder-*`) is refused too. A Scenario or Topology config
        is `present` when the server has one of that name with the package's
        spec, or the package carries none; `different` when its spec is
        another; `missing` when there is none; and `unknown` when the caller
        may not read it (`configs` `get` on it and `scenarios` or
        `topologies` `list`), so its existence is not disclosed. A custom
        icon is compared by its bytes the same way, under `configs` `list`.
        Disk images are looked for among those `GET /disks` lists the caller
        (`disks` `list`, then by name), so one the caller may not see is
        `missing`, as an absent one is; a drive is matched by the image's
        name or full path, else by its file name, which the `detail` then
        says (`Matched by file name pkg.qc2; this server's image is
        /phenix/images/pkg.qc2.`). Apps need `applications` `list`, for the
        name too. Without `disks` `list` or `applications` `list`, or when
        the disk images cannot be listed, they are `unknown`. Templates
        travel in the document and are
        `present`. Files are never checked and are `unknown`. Nothing is
        written: the Builder creates a missing config the user ticks through
        `POST /configs`.
      operationId: postBuilderPackageResolve
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: >
                a Builder package, as `GET /schemas/builder/package/v1`
                describes it
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderPackageDependencies"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "413":
          $ref: "#/components/responses/BuilderTooLarge"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
  "/builder/documents":
    get:
      tags:
        - Builder
      summary: List published Builder documents
      description: >
        Requires `configs` `list`. Lists the documents that configs currently
        reference in their `builder-doc` annotation, filtered by `configs`
        `list` for the config each one was published to. A topology whose
        annotation names a Builder file (`path`), and no stored document that
        is current, is listed with `source` `file` and the path only: the
        listing reads no file, so such a row is listed whether or not the
        file can be used. A row with `source` `store` has `experiment` when
        the publication behind the document made an experiment that still
        exists, is built from the row's topology, and the caller holds
        `experiments` `get` for it.
      operationId: getBuilderDocuments
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderPublishedDocuments"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
  "/builder/documents/{document}":
    get:
      tags:
        - Builder
      summary: Get a published Builder document
      description: >
        Requires `configs` `get` for the config the document was published
        to. A document the caller may not read, or that no config references
        any more, is answered with 404.
      operationId: getBuilderDocument
      parameters:
        - name: document
          in: path
          description: published document ID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderPublishedDocument"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
    delete:
      tags:
        - Builder
      summary: Delete a published Builder topology
      description: >
        Deletes the Topology config the document is current for, as
        `DELETE /configs/Topology/{name}` does, then every published document
        of that topology. Drafts and experiments made from it are not
        changed. Requires `configs` `delete` for the topology; a document the
        caller may not get, or that is no longer current (the topology was
        changed to reference another document, published again or deleted),
        is answered with 404. A published experiment is refused with 422:
        experiments are deleted from the Experiments page.
      operationId: deleteBuilderDocument
      parameters:
        - name: document
          in: path
          description: published document ID
          required: true
          schema:
            type: string
      responses:
        "204":
          description: >
            The topology is deleted. A Warning header says its published
            documents could not all be removed; they are never listed again,
            and a later server start removes them.
          headers:
            Warning:
              $ref: "#/components/headers/BuilderWarning"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
  "/builder/topologies/{topology}/document":
    get:
      tags:
        - Builder
      summary: Get the Builder document a topology references
      description: >
        Returns the document the topology's `builder-doc` annotation names,
        wherever it is kept. The stored published document wins: the one the
        annotation's `id` or `digest` names for this topology. Without one,
        the Builder file at the annotation's `path` is read from the phenix
        server, on every request. The file must be below the phenix base
        directory (`--base-dir.phenix`) and outside the directory VM file
        systems are mounted in, be a regular file of at most 5 MiB reached
        through no symbolic link that leaves the base directory or has an
        absolute target, and hold a valid Builder document as JSON or
        YAML. A `digest` beside `path` pins the file: a file whose document
        has another digest is refused. Requires `configs` `get` for the
        topology, which says nothing of the file: a caller who may create
        or update any one topology can name any Builder file below the base
        directory in it, and read that file here. A topology the caller may
        not get, one that does not exist, and one that references no document
        are all answered with the same 404. A file that cannot be used is
        answered with a fixed sentence naming the path, never with anything
        the file holds.
      operationId: getBuilderTopologyDocument
      parameters:
        - name: topology
          in: path
          description: topology name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >
            The document, with `digest`, `size` and `document`. For a file,
            `topologyDiffers` says whether the stored topology differs from
            what the document publishes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderPublishedDocument"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          description: >
            The topology does not exist, the caller may not get it, or it
            references no Builder document; or the Builder file it names
            does not exist on this phenix server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "413":
          description: The Builder file is larger than 5 MiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "422":
          description: >
            The Builder file is outside the directory phenix reads Builder
            files from, cannot be read, is not a regular file, is not a valid
            Builder document, or does not match the digest the topology
            records for it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
  "/builder/icons":
    get:
      tags:
        - Builder
      summary: List the icons of the Builder icon library
      description: >
        Requires `configs` `list`. Returns every icon of the server's icon
        library, sorted by name ignoring case, each with its PNG as base64,
        who uploaded it, its aliases (the names it had before its renames,
        which still name it), and whether the caller may rename or delete
        it; and how many icons and PNG bytes each user may upload and the
        caller has. The image is only ever sent as base64 inside JSON, never
        as an image. Every response of the icon operations also carries
        `Content-Security-Policy: default-src 'none'; frame-ancestors 'none'`.
      operationId: listBuilderIcons
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderIconList"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
    post:
      tags:
        - Builder
      summary: Add an icon to the Builder icon library
      description: >
        Requires `configs` `create`. Adds a PNG under a name the caller
        chooses: 1 to 64 letters, digits, `_`, `@`, `.` and `-`, not `.` or
        `..`, which no icon and no alias has, ignoring case. Takes a PNG of
        at most 96 by 96 pixels and 65536 bytes, as base64. Only the bytes
        say what the image is: no file name, extension or declared type is
        read, and anything that is not a PNG (SVG, JPEG, GIF, WebP) is
        refused. A PNG that holds only the chunks `IHDR`, `PLTE`, `tRNS`,
        `IDAT` and `IEND`, a `PLTE` or `tRNS` only where its color type uses
        one, nothing after its pixels, and is at most 40960 bytes is stored
        as it is. Any other is encoded again, which keeps its pixels and
        drops everything else (text, metadata, color profiles, further
        frames, an unused palette, data after the pixels), so use the `data`
        the response returns. A name that already names an icon with the
        same bytes answers 200 with that icon; one that names another icon,
        or is another icon's alias, answers 409. Each user may upload at most
        64 icons and 1 MiB of PNG bytes; the library holds at most 2000
        icons.
      operationId: createBuilderIcon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderIconUpload"
      responses:
        "200":
          description: the name already names an icon with the same bytes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderIcon"
        "201":
          description: icon added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderIcon"
        "400":
          description: >
            The request is malformed: its body is not a single JSON value of
            the expected shape (unknown fields are rejected), or `data` is
            missing or not base64.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "409":
          description: >
            The name, ignoring case, names another icon or is another icon's
            alias. The message names that icon and who uploaded it, for
            example `icon name "plc" is taken by an icon alice uploaded;
            choose another name`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "413":
          description: >
            The request body is larger than 131072 bytes, or the image is
            larger than 65536 bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "422":
          description: >
            The name is not an icon name, the image is not a PNG or is more
            than 96 pixels wide or high, or the caller's share of the library,
            or the library, is full.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/icons/{icon}":
    parameters:
      - name: icon
        in: path
        description: >
          the icon's name, or one of its aliases, in any case. A path that
          names no icon is answered with 404, whatever its form.
        required: true
        schema:
          type: string
    get:
      tags:
        - Builder
      summary: Read an icon of the Builder icon library
      description: >
        Requires `configs` `get`. Returns the icon the path names; `name` is
        the name it has now.
      operationId: getBuilderIcon
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderIcon"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderIconNotFound"
    put:
      tags:
        - Builder
      summary: Rename an icon of the Builder icon library
      description: >
        Requires `configs` `update`, and being the user who uploaded the icon
        or holding `builder-icons` `update` (403 otherwise). Gives the icon
        the path names a new name, which no other icon and no other icon's
        alias may have, ignoring case. The old name becomes an alias, so
        diagrams and templates that name it keep showing the icon. A change
        of case renames the icon in place; renaming it back to one of its
        aliases takes that name back.
      operationId: renameBuilderIcon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderIconRename"
      responses:
        "200":
          description: the icon as renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderIcon"
        "400":
          description: >
            The request is malformed: its body is not a single JSON value of
            the expected shape (unknown fields are rejected).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderIconNotFound"
        "409":
          description: >
            The new name is taken by another icon or its alias, or the icon
            changed while it was renamed; nothing was renamed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "413":
          description: The request body is larger than 4096 bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "422":
          description: The new name is not an icon name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
    delete:
      tags:
        - Builder
      summary: Delete an icon from the Builder icon library
      description: >
        Requires `configs` `delete`, and being the user who uploaded the
        icon or holding `builder-icons` `delete` (403 otherwise). Deletes the
        icon the path names, by its name or an alias, with all its aliases.
        Diagrams and templates that name it show their built-in icon; a
        downloaded document keeps its own copy. With `builder-icons`
        `delete`, a record of that name this server cannot read is removed.
        When an alias could not be removed, the answer is still 204, with a
        `Warning: 199` header.
      operationId: deleteBuilderIcon
      responses:
        "204":
          description: icon deleted
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderIconNotFound"
        "409":
          description: >
            The icon changed while it was deleted (it was renamed, say);
            nothing was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/templates":
    get:
      tags:
        - Builder
      summary: List the device templates you can use
      description: >
        Requires `configs` `list`. Returns the templates and collections the
        caller can use; a template names its custom icon, which the icon
        library resolves. First the
        caller's own library (`source` `own`), in the order its items were
        added; then, sorted by owner, the items of other users' libraries
        shared with the caller (`shared`) or published to every user
        (`server`), read only, as they are now. A template in a collection
        shared with the caller, or published, is listed as well; an item
        seen both ways is `shared`. A share applies only to the account it
        was made for. A user who never changed the library has the five
        built-in templates (`server`, `workstation`, `router`, `firewall`,
        `external`), at version 1 and without times; the first change stores
        them, and a built-in template that is deleted is never added again.
        A library record of the caller's that this server cannot read is
        reported with `damaged` true and none of its items; every change of
        it is then refused with 409. Another user's library that cannot be
        read is left out. `preloaded` lists, for every caller, the
        collections the server read at start from the template files of its
        template directory (`--base-dir.builder-templates`), one collection
        per file, with its templates (`source` `preloaded`, no owner,
        version 1). They are read only: a write route that names one answers
        409, and a copy in the caller's library can be changed.
      operationId: getBuilderTemplates
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplateLibrary"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
  "/builder/templates/candidates":
    get:
      tags:
        - Builder
      summary: List who your Builder templates can be shared with
      description: >
        Requires `configs` `update` and a user account of the caller's own,
        as sharing does (403 otherwise; so not with authentication off).
        Lists, sorted by username, every account a share request would
        accept, whatever the caller's `users` permissions: every user with
        an account other than the caller.
      operationId: getBuilderTemplateShareCandidates
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderShareCandidates"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
  "/builder/templates/{owner}/items":
    parameters:
      - $ref: "#/components/parameters/BuilderTemplateOwner"
    post:
      tags:
        - Builder
      summary: Add device templates to your template library
      description: >
        Requires `configs` `create`, and being `{owner}`. Adds 1 to 200
        templates in one write, each under a new ID. With `collection`, a new
        collection holding exactly those templates is made in the same write.
        A template's custom icon (`device.icon`) is an icon name, which the
        icon library resolves whether or not it holds that icon now. The
        first change of a library also stores the built-in templates it
        started with.
      operationId: createBuilderTemplates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTemplateCreate"
      responses:
        "201":
          description: templates added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplateCreateResult"
        "400":
          description: >
            The request is malformed: its body is not a single JSON value of
            the expected shape (unknown fields are rejected), or it names no
            template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderTemplateNotFound"
        "409":
          $ref: "#/components/responses/BuilderTemplateDamaged"
        "413":
          $ref: "#/components/responses/BuilderTemplateTooLarge"
        "422":
          $ref: "#/components/responses/BuilderTemplateUnprocessable"
        "503":
          $ref: "#/components/responses/BuilderTemplateBusy"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/templates/{owner}/items/{template}":
    parameters:
      - $ref: "#/components/parameters/BuilderTemplateOwner"
      - $ref: "#/components/parameters/BuilderTemplateID"
    put:
      tags:
        - Builder
      summary: Replace a device template of your template library
      description: >
        Requires `configs` `update`, and being `{owner}`. Replaces the name,
        the description and the device of one template, which keeps its ID.
        Content equal to what is stored changes nothing and keeps the entity
        tag. Devices already made from the template are not changed.
      operationId: putBuilderTemplate
      parameters:
        - $ref: "#/components/parameters/BuilderTemplateIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTemplateContent"
      responses:
        "200":
          description: the template now stored
          headers:
            ETag:
              $ref: "#/components/headers/BuilderTemplateETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplate"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderTemplateNotFound"
        "409":
          $ref: "#/components/responses/BuilderTemplateDamaged"
        "412":
          $ref: "#/components/responses/BuilderTemplatePreconditionFailed"
        "413":
          $ref: "#/components/responses/BuilderTemplateTooLarge"
        "422":
          $ref: "#/components/responses/BuilderTemplateUnprocessable"
        "503":
          $ref: "#/components/responses/BuilderTemplateBusy"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/templates/{owner}/collections":
    parameters:
      - $ref: "#/components/parameters/BuilderTemplateOwner"
    post:
      tags:
        - Builder
      summary: Add a collection to your template library
      description: >
        Requires `configs` `create`, and being `{owner}`. A collection is a
        named group of templates of the same library; a template may be in
        several. Every ID in `templateIds` must name a template of the
        library, once.
      operationId: createBuilderTemplateCollection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTemplateCollectionContent"
      responses:
        "201":
          description: collection added
          headers:
            ETag:
              $ref: "#/components/headers/BuilderTemplateETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplateCollection"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderTemplateNotFound"
        "409":
          $ref: "#/components/responses/BuilderTemplateDamaged"
        "413":
          $ref: "#/components/responses/BuilderTemplateTooLarge"
        "422":
          $ref: "#/components/responses/BuilderTemplateUnprocessable"
        "503":
          $ref: "#/components/responses/BuilderTemplateBusy"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/templates/{owner}/collections/{collection}":
    parameters:
      - $ref: "#/components/parameters/BuilderTemplateOwner"
      - $ref: "#/components/parameters/BuilderTemplateCollectionID"
    put:
      tags:
        - Builder
      summary: Replace a collection of your template library
      description: >
        Requires `configs` `update`, and being `{owner}`. Replaces the name,
        the description and the templates of one collection, which keeps its
        ID. Adding a template to a collection, and removing one from it, is
        this request with the changed list. Content equal to what is stored
        changes nothing and keeps the entity tag.
      operationId: putBuilderTemplateCollection
      parameters:
        - $ref: "#/components/parameters/BuilderTemplateIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTemplateCollectionContent"
      responses:
        "200":
          description: the collection now stored
          headers:
            ETag:
              $ref: "#/components/headers/BuilderTemplateETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplateCollection"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderTemplateNotFound"
        "409":
          $ref: "#/components/responses/BuilderTemplateDamaged"
        "412":
          $ref: "#/components/responses/BuilderTemplatePreconditionFailed"
        "413":
          $ref: "#/components/responses/BuilderTemplateTooLarge"
        "422":
          $ref: "#/components/responses/BuilderTemplateUnprocessable"
        "503":
          $ref: "#/components/responses/BuilderTemplateBusy"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/templates/{owner}/delete":
    parameters:
      - $ref: "#/components/parameters/BuilderTemplateOwner"
    post:
      tags:
        - Builder
      summary: Delete templates and collections of your template library
      description: >
        Requires `configs` `delete`, and being `{owner}`. Deletes the named
        templates and collections in one write. An ID the library does not
        hold is ignored, so repeating the request is harmless. A deleted
        template leaves every collection that held it; a deleted collection
        leaves its templates. A built-in template is deleted like any
        other. It stays deleted until you restore it (see
        `POST /builder/templates/{owner}/restore`). Diagrams are not
        changed: a device made from a template keeps no link to it.
      operationId: deleteBuilderTemplates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTemplateSelection"
      responses:
        "200":
          description: how many templates and collections were deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplateDeleteResult"
        "400":
          description: >
            The request is malformed: its body is not a single JSON value of
            the expected shape (unknown fields are rejected), or it names
            neither a template nor a collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderTemplateNotFound"
        "409":
          $ref: "#/components/responses/BuilderTemplateDamaged"
        "413":
          description: The request body is larger than 64 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "503":
          $ref: "#/components/responses/BuilderTemplateBusy"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/templates/{owner}/restore":
    parameters:
      - $ref: "#/components/parameters/BuilderTemplateOwner"
    post:
      tags:
        - Builder
      summary: Restore deleted built-in templates to your template library
      description: >
        Requires `configs` `create`, and being `{owner}`. Adds back the
        built-in templates (`server`, `workstation`, `router`, `firewall`,
        `external`) that the library does not hold, in one write. Each one
        gets its original ID and content at version 1, and goes last. It is
        in no collection, and it is not shared or published. With
        `templates`, only the built-in templates it names are restored.
        Without `templates`, or with an empty list, every missing built-in
        template is restored. An ID that is not a built-in ID is ignored. A
        built-in template that the library holds is ignored, also when it
        was changed. So repeating the request is harmless.
      operationId: restoreBuilderTemplates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTemplateRestore"
      responses:
        "200":
          description: the built-in templates that were restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplateRestoreResult"
        "400":
          description: >
            The request is malformed: its body is not a single JSON value of
            the expected shape (unknown fields are rejected).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderTemplateNotFound"
        "409":
          $ref: "#/components/responses/BuilderTemplateDamaged"
        "413":
          $ref: "#/components/responses/BuilderTemplateTooLarge"
        "503":
          $ref: "#/components/responses/BuilderTemplateBusy"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/templates/{owner}/share":
    parameters:
      - $ref: "#/components/parameters/BuilderTemplateOwner"
    post:
      tags:
        - Builder
      summary: Share templates and collections of your template library
      description: >
        Requires `configs` `update`, being `{owner}`, and a user account of
        the caller's own (403 without it, so not with authentication off).
        Adds the users in `add` to, and removes the users in `remove` from,
        who each named template and collection is shared with. A recipient
        sees the item read only, as it is now, and can copy it into its own
        library; sharing a collection shares its templates. The request is
        a change of each list, not a new list: adding a user an item is
        already shared with, or removing one it is not, changes nothing, so
        no entity tag is needed. Every user added must have an account, and
        the share is bound to it: it grants nothing once that account is
        deleted, or replaced by a new one under the same name, until the
        user is added again. When a user in `add` is refused, nothing is
        changed (422). An item that would be shared with more than 25 users
        keeps its list, and an ID the library does not hold is ignored; both
        are named in `failed`, and the other items are changed. Changes are
        logged to the security log.
      operationId: shareBuilderTemplates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTemplateShareUpdate"
      responses:
        "200":
          description: the items that were not changed, if any
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplateResult"
        "400":
          description: >
            The request is malformed: its body is not a single JSON value of
            the expected shape (unknown fields are rejected), or it names no
            template or collection, or no user to add or remove.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderTemplateNotFound"
        "409":
          $ref: "#/components/responses/BuilderTemplateDamaged"
        "413":
          description: The request body is larger than 64 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "422":
          description: >
            A user in `add` or `remove` was refused: `owner` (the caller),
            `invalid-user`, `unknown-user` (no such account), `duplicate`
            (both added and removed), or `too-many` (more than 25 users
            added). Nothing was changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderShareErrors"
        "503":
          $ref: "#/components/responses/BuilderTemplateBusy"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/templates/{owner}/publish":
    parameters:
      - name: owner
        in: path
        description: >
          the user whose template library holds the items: the caller, or,
          to take items back from every user, any user
        required: true
        schema:
          type: string
    post:
      tags:
        - Builder
      summary: Publish templates and collections to every user, or take them back
      description: >
        Requires `configs` `update`. With `serverWide` true, publishes the
        named templates and collections of the caller's own library to every
        user, read only; this also requires `builder-templates` `publish`
        (403 without it), and for a library of another user the answer is
        404. Publishing a collection publishes its templates. Publishing an
        item already published keeps who published it and when. With
        `serverWide` false, takes the items back: the owner may, and so may
        anyone with `builder-templates` `publish`, for any user's library
        (403 for anyone else). An ID the library does not hold is named in
        `failed`, and the other items are changed. Publishing does not need
        a user account. Changes are logged to the security log.
      operationId: publishBuilderTemplates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTemplatePublishUpdate"
      responses:
        "200":
          description: the items that were not changed, if any
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplateResult"
        "400":
          description: >
            The request is malformed: its body is not a single JSON value of
            the expected shape (unknown fields are rejected), it has no
            `serverWide`, or it names no template or collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          description: >
            `serverWide` is true and `{owner}` is not the caller: an item is
            published by its owner only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "409":
          $ref: "#/components/responses/BuilderTemplateDamaged"
        "413":
          description: The request body is larger than 64 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "503":
          $ref: "#/components/responses/BuilderTemplateBusy"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
  - url: http://localhost:3000/api/v1
components:
  schemas:
    Configs:
      type: object
      properties:
        configs:
          type: array
          items:
            $ref: "#/components/schemas/Config"
    Config:
      type: object
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          type: object
          properties:
            name:
              type: string
            annotations:
              description: >
                Text values by key. `builder-doc` is the one annotation that
                is a map: the Builder document a topology references.
              type: object
              properties:
                builder-doc:
                  $ref: "#/components/schemas/BuilderDocumentReference"
              additionalProperties:
                type: string
          required:
            - name
        spec:
          type: object
          additionalProperties: true
      required:
        - apiVersion
        - kind
        - metadata
        - spec
    BuilderDocumentReference:
      description: >
        The Builder document a topology references, in its `builder-doc`
        annotation. It holds at least one sub-key. Publish writes `digest`
        and `id`, and keeps a `path` the topology already has. A config whose
        reference is not valid is refused. When a topology is created or
        updated with an `id` that is not the one its `digest` gives for the
        topology's name, as a renamed or copied topology has, the `id` is
        dropped, and the `digest` too unless `path` is set.
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        digest:
          description: >
            digest of the document's canonical JSON, `sha256:` and 64
            lowercase hex digits. It names the stored published document of
            this topology with that content, and pins the content of the
            file `path` names.
          type: string
        id:
          description: >
            ID of a stored published document (see `/builder/documents`).
            It names a document only when that document was published to
            this topology.
          type: string
        path:
          description: >
            absolute, clean path of a Builder document file on the phenix
            server, at most 1024 bytes, ending in `.json`, `.yaml` or `.yml`.
          type: string
    Experiments:
      type: object
      properties:
        experiments:
          type: array
          items:
            $ref: "#/components/schemas/Experiment"
    Experiment:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        topology:
          type: string
        apps:
          type: array
          items:
            type: string
        start_time:
          type: string
          format: date-time
        running:
          type: boolean
        vm_count:
          type: integer
        vlan_min:
          type: integer
        vlan_max:
          type: integer
        vlan_count:
          type: integer
        vlans:
          type: array
          items:
            type: object
            properties:
              vlan:
                type: integer
              alias:
                type: string
        vms:
          $ref: "#/components/schemas/VMs"
    VMs:
      type: object
      properties:
        vms:
          type: array
          items:
            $ref: "#/components/schemas/VM"
    VM:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        experiment:
          type: string
        host:
          type: string
        ipv4:
          type: array
          items:
            type: string
        cpus:
          type: integer
        ram:
          type: integer
        disk:
          type: string
        dnb:
          type: boolean
        networks:
          type: array
          items:
            type: string
        taps:
          type: array
          items:
            type: string
        captures:
          type: array
          items:
            $ref: "#/components/schemas/Capture"
        running:
          type: boolean
        uptime:
          type: number
          format: float
        screenshot:
          type: string
          format: base64
    Schedule:
      type: object
      properties:
        schedule:
          type: array
          items:
            type: object
            properties:
              vm:
                type: string
              host:
                type: string
              auto_assigned:
                type: boolean
    Captures:
      type: object
      properties:
        captures:
          type: array
          items:
            $ref: "#/components/schemas/Capture"
    Capture:
      type: object
      properties:
        vm:
          type: string
        interface:
          type: integer
        filepath:
          type: string
    Snapshots:
      type: object
      properties:
        snapshots:
          type: array
          items:
            type: string
    Files:
      type: object
      properties:
        files:
          type: array
          items:
            type: string
    Hosts:
      type: object
      properties:
        hosts:
          type: array
          items:
            $ref: "#/components/schemas/Host"
    Host:
      type: object
      properties:
        name:
          type: string
        cpus:
          type: integer
        load:
          type: string
        memused:
          type: integer
        memtotal:
          type: integer
        bandwidth:
          type: string
        vms:
          type: integer
        uptime:
          type: number
          format: float
        schedulable:
          type: boolean
    Applications:
      type: object
      properties:
        applications:
          type: array
          items:
            type: string
    Topologies:
      type: object
      properties:
        topologies:
          type: array
          items:
            type: string
    Disks:
      type: object
      properties:
        disks:
          type: array
          items:
            type: string
    Users:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
    User:
      type: object
      properties:
        username:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: object
          properties:
            name:
              type: string
            resources:
              type: array
              items:
                type: string
            resource_names:
              type: array
              items:
                type: string
            verbs:
              type: array
              items:
                type: string
    Credentials:
      type: object
      properties:
        username:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
        token:
          type: string
    WebError:
      type: object
      properties:
        message:
          type: string
        cause:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        code:
          description: >
            The stable, machine-readable code of the failure. Every Builder
            route's error has one, such as `document.invalid`,
            `publish.blocked`, `publish.topology.exists`, `request.not-found`
            or `request.stale`; other routes leave it out. The answers about
            a draft a client tells apart have codes of their own:
            `draft.stale` and `draft.shares.stale` (412), `draft.conflict`
            and `draft.snapshot.current` (409). A method a Builder route does
            not take is answered with 405, `request.method-not-allowed`, and
            the methods it takes in `Allow`. A refusal about one of the
            scenarios a draft lists (`publish.scenario.*`) names that
            scenario in `metadata.scenario`. The docs list every code at
            https://phenix.sceptre.dev/latest/builder/error-codes/.
          type: string
          pattern: "^[a-z]+(\\.[a-z0-9-]+)+$"
          example: publish.blocked
        issues:
          description: >
            Each problem a Builder error is made of, when it names them one
            by one: the issues of a document that does not validate
            (`document.invalid`), or the interfaces, addresses and hostnames
            only publishing refuses (`publish.blocked`).
          type: array
          items:
            $ref: "#/components/schemas/BuilderIssue"
    BuilderIssue:
      title: Builder Issue
      description: >
        One problem the Builder found in a document, a publication or a
        request: the code of the rule it breaks, its severity, what it says,
        and where it is, by the parts that are known. The web UI's validator
        reports the same codes for the same rules. A code never changes
        meaning once published; a new rule gets a new code.
      type: object
      required:
        - code
        - severity
        - message
      properties:
        code:
          title: Code
          description: >
            The rule the issue breaks, as dotted lowercase words whose first
            names what the rule is about. The docs list every code at
            https://phenix.sceptre.dev/latest/builder/error-codes/.
          type: string
          pattern: "^[a-z]+(\\.[a-z0-9-]+)+$"
          example: node.hostname.duplicate
        severity:
          title: Severity
          description: >
            `error` for an issue that refuses what was asked, `warning` for
            one that does not.
          type: string
          enum: [error, warning]
          example: error
        message:
          title: Message
          description: What the issue says, in words a person is shown.
          type: string
          example: duplicate hostname "web" (also nodes[1])
        path:
          title: Path
          description: >
            Where the issue is in the document, when it is about a part of
            it.
          type: string
          example: nodes[3].device.hostname
        nodeId:
          title: Node ID
          description: The ID of the node the issue is about, when it is about one.
          type: string
          example: 4113dfc0-f4be-57f9-8115-6cecd1f1aea3
        edgeId:
          title: Edge ID
          description: The ID of the connection the issue is about, when it is about one.
          type: string
          example: 7f010dcd-e23d-514c-9206-3609df999026
        networkId:
          title: Network ID
          description: The ID of the network the issue is about, when it is about one.
          type: string
          example: a8af611d-c68f-54e0-94a5-9176cea64e44
        field:
          title: Field
          description: >
            The JSON Forms data path of the device field the issue is about,
            when it is about one.
          type: string
          example: spec.network.interfaces.0.vlan
    BuilderDocument:
      title: Builder Document
      description: >
        A Builder document: the diagram of a topology, with its nodes,
        networks and connections, how the canvas shows them, and under
        `metadata` what the document says of itself. This component lists
        every property of the document and outlines the nested ones; GET
        /schemas/builder/v1 serves the complete JSON Schema every document
        is checked against, with a title, a description and examples for
        each property. A document holds no other property: one that does,
        such as a metadata field at the root, is refused. `layout`,
        `iconSize`, `templates` and `icons` are presentation only and are
        never written to a config.
      type: object
      additionalProperties: false
      required:
        - "$schema"
        - revision
        - metadata
        - nodes
        - networks
        - edges
        - viewport
        - grid
      properties:
        "$schema":
          title: Schema URI
          description: >
            the Builder document schema, which a document must name exactly
          type: string
          enum:
            - https://phenix.sandia.gov/schemas/builder/v1
          example: https://phenix.sandia.gov/schemas/builder/v1
        revision:
          title: Schema Revision
          description: >
            the revision of the Builder document schema the document follows
          type: integer
          enum:
            - 1
          example: 1
        metadata:
          title: Metadata
          description: >
            what the document says of itself: its identifier, name and
            description, who made and last saved it and when, and its notes
          allOf:
            - $ref: "#/components/schemas/BuilderDocumentMetadata"
          example:
            id: 49d876d1-571a-5b5c-91b7-aadf5bb5209c
            name: Pump station
            createdBy: alice
            createdAt: "2026-10-01T15:04:05Z"
            updatedBy: bob
            updatedAt: "2026-10-02T09:30:00Z"
            notes:
              - Snapshot the PLC images before each run.
        nodes:
          title: Nodes
          description: >
            the items on the canvas: devices, switches, notes and groups, and
            the shapes, icons and lines drawn beside them
          type: array
          items:
            title: Node
            description: >
              an item on the canvas. It carries the payload its `kind` names,
              and no other.
            type: object
            required:
              - id
              - kind
              - position
            properties:
              id:
                description: >
                  identifier of the node, unique among the document's nodes
                type: string
              kind:
                description: what the node is, which names its payload
                type: string
                enum:
                  - device
                  - switch
                  - note
                  - group
                  - shape
                  - icon
                  - line
              label:
                description: text shown on the node
                type: string
              position:
                description: >
                  where the node is on the canvas: `x` and `y` in pixels,
                  relative to its parent group when it has one
                type: object
                additionalProperties: true
              size:
                description: >
                  explicit `width` and `height` of the node in pixels; without
                  one the editor sizes the node itself
                type: object
                additionalProperties: true
              parentId:
                description: identifier of the group node this node belongs to
                type: string
              device:
                description: >
                  payload of a device node: its hostname, its complete phenix
                  node spec (whose `general.notes` the canvas shows under the
                  node), its interface handles, its icon and the `iconSize`
                  it is drawn at in place of the diagram's, and its colors
                type: object
                additionalProperties: true
              switch:
                description: >
                  payload of a switch node: the network it stands for, its
                  colors, the `iconSize` its icon is drawn at in place of the
                  diagram's, and its `notes`, at most 100 lines of text the
                  canvas shows under the node, which are never published
                type: object
                additionalProperties: true
              note:
                description: payload of a note node, its text and color
                type: object
                additionalProperties: true
              group:
                description: >
                  payload of a group node: its title, description, color,
                  border style, icon and the `iconSize` it is drawn at in
                  place of the diagram's, and whether it is collapsed
                type: object
                additionalProperties: true
              shape:
                description: >
                  payload of a shape node: `rectangle` or `circle`, its label,
                  fill and outline colors and border style; never published
                type: object
                additionalProperties: true
              icon:
                description: >
                  payload of an icon node: exactly one of a built-in `iconKey`
                  and a custom `icon`, and its label; never published
                type: object
                additionalProperties: true
              line:
                description: >
                  payload of a line node: its 2 to 64 `points`, relative to the
                  node's position, its label, color and line style, and its
                  `startArrow` and `endArrow`; never published
                type: object
                additionalProperties: true
          example:
            - id: 4113dfc0-f4be-57f9-8115-6cecd1f1aea3
              kind: device
              label: router
              position:
                x: 0
                y: 0
              device:
                hostname: router
                iconKey: router
                spec:
                  type: Router
                  general:
                    hostname: router
                  hardware:
                    os_type: vyos
                    drives:
                      - image: vyos.qc2
                  network:
                    interfaces:
                      - name: eth0
                        type: ethernet
                        proto: static
                        address: 10.0.0.1
                        mask: 24
                        vlan: EXP
                interfaces:
                  - id: 7f010dcd-e23d-514c-9206-3609df999026
                    name: eth0
                    index: 0
            - id: dee6bc70-8103-581e-8b31-6c95cda798a0
              kind: switch
              label: EXP
              position:
                x: 160
                y: 256
              switch:
                networkId: a8af611d-c68f-54e0-94a5-9176cea64e44
        networks:
          title: Networks
          description: >
            the networks (VLANs) the switches and connections of the document
            belong to
          type: array
          items:
            title: Network
            description: a phenix network (VLAN)
            type: object
            required:
              - id
              - name
            properties:
              id:
                description: identifier of the network
                type: string
              name:
                description: >
                  VLAN name, unique in the document and without white space,
                  which device interfaces name as their `vlan`
                type: string
              alias:
                description: >
                  VLAN number published to an experiment's `vlans.aliases`
                type: integer
                minimum: 1
                maximum: 4094
              description:
                description: free text describing the network
                type: string
              color:
                description: >
                  color of the network's connection lines, as CSS color text
                type: string
              lineStyle:
                description: dash pattern of the network's connection lines
                type: string
          example:
            - id: a8af611d-c68f-54e0-94a5-9176cea64e44
              name: EXP
              alias: 101
              description: Experiment network
        edges:
          title: Connections
          description: >
            the connections, each joining one device interface to one switch,
            and so to its network
          type: array
          items:
            title: Connection
            description: >
              a device interface handle attached to a switch. The server checks
              the nodes, handles and network it names.
            type: object
            required:
              - id
              - sourceNodeId
              - targetNodeId
              - networkId
            properties:
              id:
                description: identifier of the connection
                type: string
              sourceNodeId:
                description: identifier of the node the connection starts at
                type: string
              sourceHandleId:
                description: >
                  interface handle of the source node, when it is a device
                type: string
              targetNodeId:
                description: identifier of the node the connection ends at
                type: string
              targetHandleId:
                description: >
                  interface handle of the target node, when it is a device
                type: string
              networkId:
                description: >
                  identifier of the network of the switch the connection joins
                type: string
              label:
                description: text shown on the connection
                type: string
              color:
                description: >
                  line color drawn in place of the network's, as CSS color text
                type: string
              lineStyle:
                description: dash pattern drawn in place of the network's
                type: string
              route:
                description: >
                  the path an automatic layout drew, as canvas positions from
                  the source handle to the target handle; never published
                type: array
                items:
                  type: object
                  additionalProperties: true
          example:
            - id: 503c4f01-e7e0-5a2e-a07d-26e2776fea8f
              sourceNodeId: 4113dfc0-f4be-57f9-8115-6cecd1f1aea3
              sourceHandleId: 7f010dcd-e23d-514c-9206-3609df999026
              targetNodeId: dee6bc70-8103-581e-8b31-6c95cda798a0
              networkId: a8af611d-c68f-54e0-94a5-9176cea64e44
        viewport:
          title: Viewport
          description: >
            the pan (`x`, `y`, in screen pixels) and `zoom` of the canvas when
            the document was saved
          type: object
          additionalProperties: true
          example:
            x: 0
            y: 0
            zoom: 1
        grid:
          title: Grid
          description: >
            the grid the canvas draws and snaps nodes to: whether it is shown,
            its `size` in pixels, and whether moved nodes snap to it
          type: object
          additionalProperties: true
          example:
            enabled: true
            size: 16
            snap: true
        scenarios:
          title: Scenarios
          description: >
            the names of the Scenario configs on the server the diagram is
            used with, at most 20, each a config name of at most 256 bytes and
            none twice ignoring case; the document holds no scenario content.
            Publishing adds the topology to the `topology` annotation of each,
            and an experiment published with the topology uses the one the
            publish request names.
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 256
            pattern: "^[A-Za-z0-9_@.-]+$"
          example:
            - pump-station-ntp
            - pump-station-attack
        source:
          title: Source
          description: >
            the config the document was generated from, when it was, and the
            warnings raised while generating it
          type: object
          additionalProperties: true
          example:
            kind: topology
            name: pump-station
            apiVersion: phenix.sandia.gov/v1
            importedAt: "2026-10-01T15:04:05Z"
            digest: sha256:1f7f8940e18192505e3ec1f993db7204b6baa8d6c1d9156917a82c663656a1b4
            updatedAt: "2026-09-30T08:00:00Z"
        layout:
          title: Layout
          description: >
            the automatic layout that last laid the document out, which the
            editor names in its layout menu; empty, or an id the editor does
            not know, means a layout did not make the positions
          type: string
          example: elk
        iconSize:
          title: Icon Size
          description: >
            the size the canvas draws the icons of devices, switches and
            groups at, unless a node names its own: small (16 pixels), medium
            (24) or large (32); empty is small
          type: string
          enum:
            - ""
            - small
            - medium
            - large
          example: large
        templates:
          title: Templates
          description: >
            the device templates saved with the diagram, at most 50, which the
            editor offers beside its own
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: true
          example:
            - id: 0d5f8f4e-6a57-4b53-9d0a-5c0f4e3b2a11
              name: Edge router
              description: VyOS router with one static interface
              device:
                iconKey: router
                spec:
                  type: Router
                  general:
                    hostname: router
        icons:
          title: Custom Icons
          description: >
            copies of the custom icons the nodes and templates name, at most
            50, each its base64 PNG data under its icon name. A draft on a
            server carries none (names resolve through the icon library); a
            downloaded document carries every icon it uses.
          type: object
          maxProperties: 50
          additionalProperties:
            type: object
            additionalProperties: true
          example:
            plc:
              data: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==
    BuilderDocumentMetadata:
      title: Builder Document Metadata
      description: >
        What a Builder document says of itself: its identifier, name and
        description, who made it and who saved it last and when, and its
        notes. It is part of the document's content and digest, and none of
        it is written to a config. The server sets `createdBy`, `createdAt`,
        `updatedBy` and `updatedAt` when it stores a draft snapshot (see POST
        /builder/drafts and POST /builder/drafts/{owner}/{draft}/snapshots).
        Each is optional: a document that was never saved as a draft, such
        as a Builder file written by hand, may have none. GET
        /schemas/builder/v1 serves its complete JSON Schema.
      type: object
      additionalProperties: false
      required:
        - id
      properties:
        id:
          title: Document ID
          description: identifier of the document
          type: string
          example: 49d876d1-571a-5b5c-91b7-aadf5bb5209c
        name:
          title: Name
          description: >
            name of the diagram, which a draft takes as its title: at most 512
            bytes, without control characters
          type: string
          example: Pump station
        description:
          title: Description
          description: free text describing the diagram
          type: string
          example: Water treatment pump station with two PLCs and an HMI.
        createdBy:
          title: Created By
          description: >
            user who first made the document. Kept from the document a draft
            is created with, or else the user who created the draft; every
            later save writes the same value.
          type: string
          maxLength: 256
          example: alice
        createdAt:
          title: Created At
          description: >
            when the document was first made, in UTC to the second
            (`YYYY-MM-DDTHH:MM:SSZ`). Set and kept as `createdBy` is.
          type: string
          format: date-time
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
          example: "2026-10-01T15:04:05Z"
        updatedBy:
          title: Updated By
          description: >
            user whose save stored this content. Set by the server on every
            save; a value sent is replaced.
          type: string
          maxLength: 256
          example: bob
        updatedAt:
          title: Updated At
          description: >
            when that save was, in the form of `createdAt`. Set by the server
            on every save; a value sent is replaced. It is not
            `source.updatedAt`, which is a time of the config the document
            was imported from.
          type: string
          format: date-time
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
          example: "2026-10-02T09:30:00Z"
        notes:
          title: Notes
          description: >
            free text notes about the diagram as a whole, in the order the
            editor lists them: at most 100, each not only white space, at
            most 4096 bytes in UTF-8 (maxLength counts characters, so the
            byte limit is the stricter one outside ASCII), and without
            control characters but newline and tab
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 4096
          example:
            - Snapshot the PLC images before each run.
            - "VLAN EXP carries the control traffic.\nKeep it isolated."
    BuilderDocumentStamp:
      description: >
        The `createdBy`, `createdAt`, `updatedBy` and `updatedAt` of the
        `metadata` of the document a request stored. A field the stored
        document does not have is left out, so a draft opened unchanged from
        a document that names nobody has an empty stamp.
      type: object
      properties:
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time
    BuilderDraftCreate:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
        summary:
          description: summary of the first snapshot
          type: string
        sourceToken:
          description: >
            the config the draft was imported from, as `<kind>/<name>`; an
            uploaded config, as `uploaded/<kind>/<name>`, or an uploaded
            legacy Builder diagram that came without a Topology, as
            `uploaded/legacy-xml`, either of which names no stored
            config, so it does not let the draft update a stored Topology or
            Experiment; the published document it was opened from, as
            `builder-doc/<document id>`, which the caller must be able to read
            (404 otherwise); or the Builder file of a topology it was opened
            from, as `builder-file/<topology name>/<digest>`, with the
            `digest` GET /builder/topologies/{topology}/document returned,
            which the caller must be able to read and which the file must
            still have (409 otherwise)
          type: string
        sourceFile:
          description: >
            the name of the uploaded file the document came from, kept only
            to show it: a file name of at most 255 bytes without `/` or `\`,
            not `.` or `..`, with no control characters (422 otherwise). The
            server never opens anything by it.
          type: string
          maxLength: 255
        forkOf:
          description: >
            a draft the new one forks, as `<owner>/<draft id>`, which the caller
            must be able to read (404 otherwise). The new draft takes its
            source token in place of `sourceToken`, and records its last
            publication as `forked`, so publishing the new draft can update
            what that draft published or was opened from. It records no
            source file: neither that draft's, nor a `sourceFile` sent with
            it.
          type: string
        owner:
          description: optional; when set, it must be the caller
          type: string
        document:
          $ref: "#/components/schemas/BuilderDocument"
      required:
        - document
    BuilderSnapshotCreate:
      type: object
      additionalProperties: false
      properties:
        summary:
          type: string
        document:
          $ref: "#/components/schemas/BuilderDocument"
        opId:
          description: >
            the client's id for this save, kept with the snapshot, so a
            client that never saw the response can tell it was stored
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
      required:
        - document
    BuilderCursorMove:
      description: exactly one of `index` and `snapshotId`
      type: object
      additionalProperties: false
      properties:
        index:
          description: index of the snapshot to move to, oldest first
          type: integer
          minimum: 0
        snapshotId:
          type: string
    BuilderDraft:
      type: object
      properties:
        id:
          type: string
        owner:
          type: string
        title:
          type: string
        sourceToken:
          type: string
        sourceFile:
          description: >
            the name of the uploaded file the draft was made from, when it
            was created with one
          type: string
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
        lastModifiedBy:
          type: string
        cursor:
          description: index of the current snapshot
          type: integer
        snapshots:
          description: number of snapshots the draft keeps
          type: integer
        snapshotId:
          description: ID of the current snapshot
          type: string
        digest:
          description: digest of the current snapshot's document
          type: string
        size:
          description: size in bytes of the current snapshot's document
          type: integer
        historyBytes:
          description: total size in bytes of the snapshots the draft keeps
          type: integer
        dirty:
          description: whether the current snapshot differs from the last publication
          type: boolean
        canUndo:
          type: boolean
        canRedo:
          type: boolean
        readOnly:
          description: >
            whether the caller may not update the draft: its access does not
            allow it, or its role cannot update configs (so `access` `edit`
            with `readOnly` means an edit share the caller's role cannot use)
          type: boolean
        etag:
          description: the value of the ETag header for this revision
          type: string
        document:
          $ref: "#/components/schemas/BuilderDocument"
        stamp:
          description: >
            what the stored document holds in `metadata.createdBy`,
            `createdAt`, `updatedBy` and `updatedAt` (creating a draft and saving one
            only, whose responses have no document). An editor copies it
            into its own copy of the document.
          allOf:
            - $ref: "#/components/schemas/BuilderDocumentStamp"
        history:
          description: the snapshots, oldest first (GET of one draft only)
          type: array
          items:
            $ref: "#/components/schemas/BuilderSnapshot"
        publication:
          $ref: "#/components/schemas/BuilderPublication"
        forked:
          description: >
            for a draft created with `forkOf`, what that draft had last
            published when it was forked, which this draft may update too
          type: object
          properties:
            documentId:
              type: string
            topologyTarget:
              type: string
            experimentTarget:
              type: string
        access:
          description: >
            what the caller may do with the draft (listing, GET of one draft,
            and the `draft` of a PUT of its shares only)
          type: string
          enum:
            - owner
            - edit
            - view
        via:
          description: >
            where the caller's access to another user's draft comes from: a
            share naming the caller, or its role (listing and GET of one draft
            only). A caller with both is reported as `share`.
          type: string
          enum:
            - share
            - role
        canShare:
          description: >
            present and true when the caller owns the draft, may update
            configs, and has a user account, and so may change who it is
            shared with (listing, GET of one draft, and the `draft` of a PUT of
            its shares only)
          type: boolean
        shares:
          description: >
            who the draft is shared with, sorted by user, for its owner only,
            and only when it is shared with anyone. Entries whose account is
            gone are included; GET of the draft's shares marks them.
          type: array
          items:
            type: object
            properties:
              user:
                type: string
              access:
                type: string
                enum:
                  - view
                  - edit
        canDelete:
          description: >
            whether the caller may delete the draft: `configs` `delete`, and
            the draft is its own or it holds `builder-drafts` `delete` for it.
            Left out when false. Reported by the listing, GET of one draft,
            and the `draft` of a PUT of its shares.
          type: boolean
        experiment:
          description: >
            name of an experiment this draft, or the published diagram it was
            opened from, published, when it still exists and the caller holds
            `experiments` `get` for it. It is worked out for each response,
            so it follows an experiment that was renamed and is left out
            once it is deleted. Reported by GET of one draft, POST
            /builder/drafts and the `draft` of a publish answer; never by
            the listing.
          type: string
    BuilderDrafts:
      type: object
      properties:
        drafts:
          description: the caller's own drafts
          type: array
          items:
            $ref: "#/components/schemas/BuilderDraft"
        shared:
          description: >
            drafts of other users shared with the caller (`via` `share`) or
            the caller's role lets it list (`via` `role`)
          type: array
          items:
            $ref: "#/components/schemas/BuilderDraft"
        damaged:
          description: >
            drafts, the caller's own or of other users the caller may list,
            whose metadata this server can no longer read
          type: array
          items:
            $ref: "#/components/schemas/BuilderDamagedDraft"
    BuilderDamagedDraft:
      description: >
        What can still be read of a draft whose metadata this server can no
        longer read. It cannot be opened, only deleted with its ETag.
      type: object
      properties:
        id:
          type: string
        owner:
          type: string
        title:
          description: present when it can still be read
          type: string
        updated:
          description: present when it can still be read
          type: string
          format: date-time
        etag:
          description: the If-Match value that deletes the draft
          type: string
        canDelete:
          description: whether the caller may delete the draft
          type: boolean
    BuilderSnapshot:
      type: object
      properties:
        id:
          type: string
        digest:
          type: string
        size:
          type: integer
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        summary:
          type: string
        opId:
          description: the client's id for the save that stored the snapshot
          type: string
        current:
          type: boolean
    BuilderSnapshots:
      type: object
      properties:
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/BuilderSnapshot"
        cursor:
          type: integer
    BuilderSnapshotDocument:
      type: object
      properties:
        snapshot:
          $ref: "#/components/schemas/BuilderSnapshot"
        document:
          $ref: "#/components/schemas/BuilderDocument"
    BuilderPublication:
      description: the draft's last publication
      type: object
      properties:
        mode:
          type: string
          enum:
            - topology
            - topology-experiment
        topologyTarget:
          type: string
        topologyAction:
          type: string
        experimentTarget:
          type: string
        scenarioTarget:
          type: string
        snapshotId:
          type: string
        digest:
          type: string
        documentId:
          type: string
        publishedAt:
          type: string
          format: date-time
        publishedBy:
          type: string
    BuilderPublishTarget:
      type: object
      additionalProperties: false
      properties:
        name:
          description: config name
          type: string
        action:
          description: create a new config or update an existing one
          type: string
          enum:
            - create
            - update
      required:
        - name
        - action
    BuilderPublishScenario:
      description: >
        the scenario the experiment of a `topology-experiment` publication is
        created or updated with: one of the scenarios the draft's document
        lists, by name
      type: object
      additionalProperties: false
      properties:
        name:
          description: Scenario config name
          type: string
      required:
        - name
    BuilderPublishRequest:
      description: >
        `topology` mode publishes the topology only. `topology-experiment`
        mode also requires an experiment target and may name the
        experiment's scenario, which must be one of the scenarios the
        document lists; without one, the experiment has no scenario. In
        both modes the topology is added to the `topology` annotation of
        every scenario the document lists.
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
            - topology
            - topology-experiment
        topology:
          $ref: "#/components/schemas/BuilderPublishTarget"
        scenario:
          $ref: "#/components/schemas/BuilderPublishScenario"
        experiment:
          $ref: "#/components/schemas/BuilderPublishTarget"
        dryRun:
          description: >
            make every check of the publication, write nothing, and answer
            with what it would change (`BuilderPublishPreview`). A dry run
            needs no If-Match.
          type: boolean
          default: false
      required:
        - mode
        - topology
    BuilderPublishPreview:
      description: >
        the answer of a dry run of a publication: what it would change, the
        warnings it would give, and the refusal it would be answered with.
        Nothing is written.
      type: object
      properties:
        status:
          type: string
          enum:
            - preview
        changes:
          description: >
            what publishing would change, compared with what is stored now;
            null when the publication would be refused
          nullable: true
          allOf:
            - $ref: "#/components/schemas/BuilderPublishChanges"
        warnings:
          description: what the publication would warn of, each with its code
          type: array
          items:
            $ref: "#/components/schemas/BuilderIssue"
        errors:
          description: >
            why the publication would be refused, each an error with its code:
            what a publish answers with 400 (a target name), 409 or 422, such
            as `publish.topology.exists`, `publish.scenario.missing`, or the
            issues of `publish.blocked`. Refusals of who may do what (403, and
            404 for a draft the caller may not see) keep their status.
          type: array
          items:
            $ref: "#/components/schemas/BuilderIssue"
    BuilderPublishChanges:
      description: >
        what publishing a draft to a target changes, compared with what is
        stored now. Every list is sorted by name.
      type: object
      properties:
        topology:
          $ref: "#/components/schemas/BuilderConfigChange"
        includes:
          description: the topologies the Topology config includes (`spec.includeTopologies`)
          type: array
          items:
            $ref: "#/components/schemas/BuilderIncludeChange"
        scenarios:
          description: >
            the Scenario configs the document lists, each of which gets the
            topology in its `topology` annotation unless it names it already
          type: array
          items:
            $ref: "#/components/schemas/BuilderScenarioAnnotation"
        images:
          description: >
            the disk images the devices of the stored topology use, compared
            with those the published topology's devices use
            (`hardware.drives[].image`)
          type: array
          items:
            $ref: "#/components/schemas/BuilderImageChange"
        experiment:
          description: the Experiment config, for a `topology-experiment` publication only
          allOf:
            - $ref: "#/components/schemas/BuilderConfigChange"
        vlanAliases:
          description: >
            the experiment's VLAN aliases (`spec.vlans.aliases`), each added
            when the experiment is created; for a `topology-experiment`
            publication only, and left out when there is none
          type: array
          items:
            $ref: "#/components/schemas/BuilderVLANAliasChange"
    BuilderConfigChange:
      type: object
      properties:
        name:
          type: string
        action:
          description: >
            `create`, `update`, or `unchanged` when the config already holds
            this publication, so nothing is written to it
          type: string
          enum:
            - create
            - update
            - unchanged
    BuilderIncludeChange:
      type: object
      properties:
        name:
          description: included topology
          type: string
        change:
          type: string
          enum:
            - added
            - removed
            - kept
    BuilderScenarioAnnotation:
      type: object
      properties:
        name:
          description: Scenario config name
          type: string
        change:
          description: >
            `annotate` adds the topology to the scenario's `topology`
            annotation; `unchanged` names a scenario that names it already
          type: string
          enum:
            - annotate
            - unchanged
    BuilderImageChange:
      type: object
      properties:
        name:
          description: the image as the drives name it
          type: string
        change:
          type: string
          enum:
            - added
            - removed
            - kept
        devices:
          description: >
            the hostnames of the devices that use the image once published,
            or, for a removed image, of those that used it
          type: array
          items:
            type: string
        onServer:
          description: >
            whether the server has a disk image of that file name, as
            GET /disks lists them; null when unknown (the caller may not list
            disks or may not list that file name, whether the server has it
            or not, or the listing failed or is empty, as it is without
            minimega)
          type: boolean
          nullable: true
    BuilderVLANAliasChange:
      type: object
      properties:
        name:
          description: network name
          type: string
        from:
          description: the experiment's alias now, null for none
          type: integer
          nullable: true
        to:
          description: the alias the publication writes, null for none
          type: integer
          nullable: true
        change:
          type: string
          enum:
            - added
            - removed
            - changed
            - kept
    BuilderPublishStage:
      type: object
      properties:
        name:
          description: document, topology, scenario, experiment or draft
          type: string
        status:
          description: created, updated, skipped, ok or failed
          type: string
        message:
          type: string
        config:
          description: >
            the config the stage wrote, as `<Kind>/<name>`. The scenario
            stage, which covers every scenario the document lists, names one
            only when the document lists one, and its message says which it
            changed.
          type: string
    BuilderPublishResult:
      type: object
      properties:
        status:
          type: string
          enum:
            - succeeded
            - partial
        stages:
          type: array
          items:
            $ref: "#/components/schemas/BuilderPublishStage"
        warnings:
          description: >
            what the caller should know of the publication, each with its
            code, such as `publish.file.unchanged` or `publish.legacy.replaced`
          type: array
          items:
            $ref: "#/components/schemas/BuilderIssue"
        errors:
          description: >
            why a stage of a partial publication failed, each with its code:
            `publish.stage.failed`, `publish.experiment.running` or
            `server.storage-full`
          type: array
          items:
            $ref: "#/components/schemas/BuilderIssue"
        topology:
          $ref: "#/components/schemas/BuilderPublishTarget"
        scenario:
          $ref: "#/components/schemas/BuilderPublishScenario"
        experiment:
          $ref: "#/components/schemas/BuilderPublishTarget"
        draft:
          $ref: "#/components/schemas/BuilderDraft"
    BuilderSource:
      type: object
      properties:
        kind:
          type: string
        name:
          type: string
        fullName:
          type: string
        apiVersion:
          type: string
        created:
          type: string
        updated:
          type: string
        digest:
          description: >
            for a Topology or an Experiment, the digest a document imported
            from it records as its `source.digest`: of the config's
            apiVersion, kind, name and spec, and of the `builder-xml` diagram
            of a Topology that has one. Left out for a Scenario or an Image
          type: string
        stored:
          description: false for a config generated from uploaded content
          type: boolean
        builder:
          description: >
            the builder annotation the config carries, if any: `builder-doc`
            (Builder) or, on a Topology without it, `builder-xml` (legacy
            Builder diagram)
          type: string
        generatable:
          description: whether POST /builder/generate accepts this config
          type: boolean
        includeCount:
          description: >
            the number of topologies a Topology includes
            (`includeTopologies`). Left out when it includes none, for every
            other kind, for a caller without `configs` `get` for the config,
            and in the `source` of a generated document.
          type: integer
          minimum: 1
    BuilderSources:
      type: object
      properties:
        topologies:
          type: array
          items:
            $ref: "#/components/schemas/BuilderSource"
        experiments:
          type: array
          items:
            $ref: "#/components/schemas/BuilderSource"
        scenarios:
          type: array
          items:
            $ref: "#/components/schemas/BuilderSource"
        images:
          type: array
          items:
            $ref: "#/components/schemas/BuilderSource"
    BuilderGenerateRequest:
      description: exactly one of `source` and `content`
      type: object
      additionalProperties: false
      properties:
        source:
          description: a stored Topology or Experiment config, as `<Kind>/<name>`
          type: string
        content:
          description: a Topology or Experiment config as JSON or YAML text
          type: string
        includes:
          description: >
            what becomes of the nodes of the topologies a Topology includes:
            `keep` (the default, also when left out or empty) shows them
            read only, and `combine` copies them into the document and makes
            it a new topology. `combine` is not allowed for an Experiment.
          type: string
          enum:
            - keep
            - combine
        copy:
          description: >
            make the document a copy that is not linked to the Topology it
            is generated from; `includes` `combine` implies it. The copy gets
            the diagram note `Copied from <name>` in `metadata.notes`, where
            `<name>` is the name in the source config's metadata. Not allowed
            for an Experiment.
          type: boolean
          default: false
        name:
          description: >
            the name of the new topology, and of the document. Only allowed
            with `copy` or `includes` `combine`. When empty, the source's
            name with `-combined` (for `combine`) or `-copy` added. It must
            not be the name of the stored Topology being imported.
          type: string
          maxLength: 512
          pattern: "^[A-Za-z0-9_@.-]*$"
    BuilderGenerateResult:
      type: object
      properties:
        document:
          $ref: "#/components/schemas/BuilderDocument"
        warnings:
          description: what the document left out or changed
          type: array
          items:
            type: string
        source:
          description: >
            the config the document was made from. Left out by POST
            /builder/legacy for a diagram that came without a Topology.
          allOf:
            - $ref: "#/components/schemas/BuilderSource"
    BuilderLegacyRequest:
      type: object
      additionalProperties: false
      required:
        - content
      properties:
        content:
          description: >
            the text of a legacy Builder diagram file: mxGraph XML, or a
            Topology config as YAML or JSON that has the `builder-xml`
            annotation; at most 5242880 bytes
          type: string
        name:
          description: >
            the name of the document of a diagram that comes without a
            Topology (`legacy-diagram` when left out or blank); at most 512
            bytes, without control characters. Ignored for a Topology, whose
            own name is used.
          type: string
    BuilderTopologyExportRequest:
      type: object
      additionalProperties: false
      properties:
        document:
          $ref: "#/components/schemas/BuilderDocument"
        name:
          description: >
            the topology's name; when empty, the document's name with each run
            of characters a config name may not hold replaced by `-` (as the
            Publish dialog proposes it), or `topology` when that leaves none
          type: string
      required:
        - document
    BuilderTopologyExport:
      type: object
      properties:
        name:
          description: the topology's name
          type: string
        yaml:
          description: >
            the Topology config, as YAML that loads back as the config; a
            string YAML's block style would change, such as one starting with
            a line break, is double quoted
          type: string
        warnings:
          description: what the projection left out or changed, each with its code
          type: array
          items:
            $ref: "#/components/schemas/BuilderIssue"
        publishBlockers:
          description: >
            why a publish of the topology would be refused although phenix's
            config validation accepts it, one issue per check in the order a
            publish makes them: interfaces without a VLAN, then addresses
            interfaces share, then hostnames phenix refuses when it creates an
            experiment. A publish's 422 message names the first. Each says
            what that message says of its check, has the code of the check's
            first problem, and is located when the check has one problem.
          type: array
          items:
            $ref: "#/components/schemas/BuilderIssue"
    BuilderPackageRequest:
      type: object
      additionalProperties: false
      properties:
        document:
          $ref: "#/components/schemas/BuilderDocument"
        include:
          description: >
            the sections the package carries, each at most once: `scenarios`
            (the Scenario configs the document names), `topologies` (the
            topologies it includes), `icons` (a copy of each custom icon it
            names) and `images` (the disk images the devices use, listed in
            the requirements with the hosts that use each)
          type: array
          items:
            type: string
            enum:
              - scenarios
              - topologies
              - icons
              - images
      required:
        - document
    BuilderPackageResult:
      type: object
      properties:
        package:
          description: >
            the package, as `GET /schemas/builder/package/v1` describes it,
            ready to be saved as a JSON or YAML file
          type: object
          additionalProperties: true
        warnings:
          description: >
            what the package names but does not carry, or leaves out of its
            requirements, and why, each with its code
          type: array
          items:
            $ref: "#/components/schemas/BuilderIssue"
    BuilderPackageDependencies:
      type: object
      properties:
        dependencies:
          description: >
            one entry per entry of the package's requirements, by kind in the
            order scenario, topology, template, icon, image, app, file
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                  - scenario
                  - topology
                  - template
                  - icon
                  - image
                  - app
                  - file
              name:
                description: the name or path, as the requirements give it
                type: string
              status:
                type: string
                enum:
                  - present
                  - missing
                  - different
                  - unknown
              packaged:
                description: whether the package carries it
                type: boolean
              detail:
                description: >
                  why the status is what it is, such as the devices that use
                  a disk image, when that needs saying
                type: string
    BuilderPreflightCheckName:
      description: a preflight check
      type: string
      enum:
        - capacity
        - network
        - disks
        - apps
    BuilderPreflightRequest:
      type: object
      additionalProperties: false
      properties:
        checks:
          description: the checks to make, in the order they are reported; each at most once
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/BuilderPreflightCheckName"
          example:
            - disks
            - apps
        experiment:
          description: >
            the experiment whose VLAN range and default bridge the network
            check goes by; empty or left out for none
          type: string
          example: lab-exp
      required:
        - checks
    BuilderPreflightResult:
      type: object
      properties:
        name:
          $ref: "#/components/schemas/BuilderPreflightCheckName"
        status:
          description: >
            `failed` when an issue is an error; `unavailable` when the check, or
            a part of it, could not be made and nothing failed; otherwise
            `passed`, with any warnings among the issues
          type: string
          enum:
            - passed
            - failed
            - unavailable
        summary:
          description: what the check compared, in one line, and what it could not check
          type: string
          example: "Found: 3 of 3 drive images, among the server's 12 disk images."
        issues:
          description: >
            what the check found, each with its `preflight.` code and, when it
            is about one, the device, network and field
          type: array
          items:
            $ref: "#/components/schemas/BuilderIssue"
    BuilderPreflightReport:
      type: object
      properties:
        checks:
          description: the result of each check asked for, in the request's order
          type: array
          items:
            $ref: "#/components/schemas/BuilderPreflightResult"
        passed:
          description: the checks that passed, in the request's order
          type: array
          items:
            $ref: "#/components/schemas/BuilderPreflightCheckName"
        failed:
          description: the checks that failed, in the request's order
          type: array
          items:
            $ref: "#/components/schemas/BuilderPreflightCheckName"
        unavailable:
          description: the checks that could not be made, in the request's order
          type: array
          items:
            $ref: "#/components/schemas/BuilderPreflightCheckName"
    BuilderPublishedDocument:
      description: >
        The Builder document a config references: a stored published
        document (`source` `store`), which Publish stored, or the Builder
        file a topology's `builder-doc` annotation names (`source` `file`). A file
        has no `id`,
        `draftId`, `snapshotId`, `createdAt` or `createdBy`. In a listing a
        file also has no `digest` and no `size`, since a listing reads no
        file.
      type: object
      properties:
        source:
          description: where the document is kept
          type: string
          enum:
            - store
            - file
        id:
          description: stored documents only
          type: string
        digest:
          description: digest of the document's canonical JSON, not of a file's bytes
          type: string
        size:
          description: size of the document's canonical JSON, in bytes
          type: integer
        target:
          description: name of the config that references the document
          type: string
        kind:
          type: string
        config:
          description: the config that references the document, as `<Kind>/<name>`
          type: string
        path:
          description: files only; the path of the Builder file on the phenix server
          type: string
        draftId:
          description: >
            stored documents only; the draft that first published the
            document.
          type: string
        snapshotId:
          description: >
            stored documents only; the snapshot of that draft. Absent with
            `draftId`.
          type: string
        createdAt:
          description: stored documents only; when the document was first published
          type: string
          format: date-time
        createdBy:
          description: >
            stored documents only; the user who first published the document.
          type: string
        topologyDiffers:
          description: >
            files only, in GET /builder/topologies/{topology}/document;
            true when the stored topology is not what the document publishes,
            so a draft opened from the file cannot update the topology
          type: boolean
        experiment:
          description: >
            name of an experiment the publication behind this document made,
            when it still exists and the caller holds `experiments` `get` for
            it. Only on rows of GET /builder/documents with `source` `store`.
          type: string
        document:
          $ref: "#/components/schemas/BuilderDocument"
      required:
        - source
        - target
        - kind
        - config
    BuilderPublishedDocuments:
      type: object
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/BuilderPublishedDocument"
    BuilderShares:
      type: object
      properties:
        shares:
          description: who the draft is shared with, sorted by user
          type: array
          items:
            type: object
            properties:
              user:
                type: string
              access:
                type: string
                enum:
                  - view
                  - edit
              grantedAt:
                type: string
                format: date-time
              stale:
                description: >
                  the account the draft was shared with was deleted, or
                  replaced by a new one under the same name, so this share
                  grants nothing
                type: boolean
        sharesEtag:
          description: the list's entity tag, the value of the ETag header
          type: string
        maxShares:
          description: the most users a draft may be shared with
          type: integer
        draft:
          description: >
            PUT only: the draft without its document and history, with its
            new `etag`
          allOf:
            - $ref: "#/components/schemas/BuilderDraft"
    BuilderShareUpdate:
      description: the complete new list
      type: object
      additionalProperties: false
      properties:
        shares:
          type: array
          maxItems: 25
          items:
            type: object
            additionalProperties: false
            properties:
              user:
                type: string
              access:
                type: string
                enum:
                  - view
                  - edit
            required:
              - user
              - access
      required:
        - shares
    BuilderShareCandidates:
      type: object
      properties:
        users:
          description: who the draft or the templates can be shared with, sorted by username
          type: array
          items:
            type: object
            properties:
              username:
                type: string
              name:
                description: the user's first and last name, or empty when unknown
                type: string
    BuilderShareErrors:
      description: a WebError with every refused entry
      type: object
      properties:
        message:
          type: string
        cause:
          type: string
        code:
          description: always `share.users.refused`
          type: string
          example: share.users.refused
        errors:
          type: array
          items:
            type: object
            properties:
              user:
                description: the entry's user, empty for `too-many`
                type: string
              reason:
                description: >
                  `owner` (the owner is listed), `duplicate` (a user is listed
                  twice), `invalid-access` (not `view` or `edit`),
                  `invalid-user` (empty, over 256 bytes, control characters or
                  `/`), `too-many` (over 25 users), `unknown-user` (no such
                  account), or `account-removed` (the account the user was
                  shared with is gone: remove the user, save, and add them
                  again)
                type: string
                enum:
                  - owner
                  - duplicate
                  - invalid-access
                  - invalid-user
                  - too-many
                  - unknown-user
                  - account-removed
    BuilderIconUpload:
      type: object
      additionalProperties: false
      required:
        - name
        - data
      properties:
        name:
          description: >
            the icon's name: 1 to 64 letters, digits, `_`, `@`, `.` and `-`,
            not `.` or `..`, which no icon and no alias has, ignoring case.
            Nodes and templates name the icon by it.
          type: string
          pattern: "^[A-Za-z0-9_@.-]{1,64}$"
        data:
          description: >
            a PNG of at most 96 by 96 pixels and 65536 bytes, in standard
            base64 with padding and without line breaks
          type: string
    BuilderIconRename:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          description: >
            the icon's new name, by the rules of a name an icon is added
            under; the old name becomes an alias
          type: string
          pattern: "^[A-Za-z0-9_@.-]{1,64}$"
    BuilderIcon:
      type: object
      properties:
        name:
          description: >
            the icon's name now. It is the key of the icon in a Builder
            document's `icons`, and what a node's or template's `icon` names.
          type: string
        id:
          description: >
            `sha256:` and the SHA-256 of the stored PNG, as 64 lowercase hex
            digits: two icons hold the same image exactly when their IDs are
            equal.
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        owner:
          description: >
            the user who uploaded the icon, or empty for an icon phenix added
            from a template file of its template directory, which no user
            owns: only holders of `builder-icons` rename or delete it
          type: string
        width:
          description: width in pixels, 1 to 96
          type: integer
        height:
          description: height in pixels, 1 to 96
          type: integer
        bytes:
          description: length of the stored PNG, at most 40960
          type: integer
        created:
          description: when the icon was uploaded
          type: string
          format: date-time
        updated:
          description: when the icon was last renamed, or uploaded
          type: string
          format: date-time
        aliases:
          description: >
            the names the icon had before its renames, oldest first, each of
            which still names it
          type: array
          items:
            type: string
        data:
          description: >
            the stored PNG in standard base64 with padding, which may differ
            from what was sent
          type: string
        canRename:
          description: >
            whether the caller may rename the icon: `configs` `update`, and
            being its uploader or holding `builder-icons` `update`
          type: boolean
        canDelete:
          description: >
            whether the caller may delete the icon: `configs` `delete`, and
            being its uploader or holding `builder-icons` `delete`
          type: boolean
    BuilderIconList:
      type: object
      properties:
        icons:
          description: every icon of the library, sorted by name without regard to case
          type: array
          items:
            $ref: "#/components/schemas/BuilderIcon"
        maxIcons:
          description: the most icons each user may upload
          type: integer
        maxBytes:
          description: the most PNG bytes the icons each user uploads may have together
          type: integer
        usedBytes:
          description: the PNG bytes of the icons the caller uploaded, together
          type: integer
        usedIcons:
          description: how many icons the caller uploaded
          type: integer
    BuilderTemplateDevice:
      description: >
        What a template fills in: every field of a device node but its
        hostname, its interface handles and where it was included from. A
        device made from the template is named after
        `spec.general.hostname`, made unique in the diagram.
      type: object
      required:
        - spec
      properties:
        iconKey:
          description: one of the Builder's icon keys
          type: string
        icon:
          description: >
            the name of a custom icon of the icon library, drawn in place of
            `iconKey` while the library has an icon of that name
          type: string
          pattern: "^[A-Za-z0-9_@.-]{1,64}$"
        iconSize:
          description: >
            the size the canvas draws the icon of a device made from the
            template at: small (16 pixels), medium (24) or large (32); empty
            draws it at the diagram's `iconSize`
          type: string
          enum:
            - ""
            - small
            - medium
            - large
        outlineColor:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        fillColor:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        spec:
          description: >
            a complete phenix node spec, as a device node holds it; at most
            16384 bytes as JSON together with the other fields. Its
            `general.hostname` is required and holds no white space. It is
            not checked against the phenix node schema.
          type: object
          additionalProperties: true
    BuilderTemplateShare:
      description: one user a template or a collection is shared with
      type: object
      properties:
        user:
          type: string
        grantedAt:
          type: string
          format: date-time
        stale:
          description: >
            the account the item was shared with was deleted, or replaced by
            a new one under the same name, so this share grants nothing
          type: boolean
    BuilderTemplate:
      type: object
      properties:
        id:
          description: >
            unique in the owner's library only: the built-in templates keep
            their short names in every library, any other is a UUID. A
            template the server read from a template file has an ID that
            starts with `server-`, made from the file's name and the
            template's name, the same at every start.
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
        owner:
          description: >
            the user whose library holds the template; empty for one the
            server read from a template file
          type: string
        source:
          description: >
            `own` for a template of the caller's library, `shared` for one
            another user shared with the caller, `server` for one published
            to every user, `preloaded` for one the server read from a template
            file
          type: string
          enum:
            - own
            - shared
            - server
            - preloaded
        name:
          type: string
        description:
          description: >
            the template's own text, shown where templates are listed; never
            written into a node
          type: string
        device:
          $ref: "#/components/schemas/BuilderTemplateDevice"
        version:
          description: >
            starts at 1 and grows by one with every change of the name, the
            description or the device
          type: integer
        etag:
          description: the entity tag of the content, `"<version>"`, for If-Match
          type: string
        created:
          description: left out for a built-in template that was never changed
          type: string
          format: date-time
        updated:
          description: >
            when the content last changed; left out for a built-in template
            that was never changed
          type: string
          format: date-time
        serverWide:
          description: the template itself is published to every user
          type: boolean
        publishedAt:
          description: left out unless `serverWide`
          type: string
          format: date-time
        publishedBy:
          description: left out unless `serverWide`
          type: string
        collections:
          description: >
            the IDs of the collections of the same owner that hold the
            template and that the caller sees
          type: array
          items:
            type: string
        shares:
          description: >
            who the template is shared with, sorted by user; sent to its
            owner only, and left out of the items of other owners
          type: array
          items:
            $ref: "#/components/schemas/BuilderTemplateShare"
    BuilderTemplateCollection:
      type: object
      properties:
        id:
          description: >
            unique among the collections of the owner's library; for a
            collection the server read from a template file, `server-` and a
            digest of the file's name
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
        owner:
          description: >
            the user whose library holds the collection; empty for one the
            server read from a template file
          type: string
        source:
          description: >
            `own` for a collection of the caller's library, `shared` for one
            another user shared with the caller, `server` for one published
            to every user, `preloaded` for one the server read from a template
            file
          type: string
          enum:
            - own
            - shared
            - server
            - preloaded
        name:
          type: string
        description:
          type: string
        templateIds:
          description: the templates of the collection, in the order given
          type: array
          items:
            type: string
        version:
          description: >
            starts at 1 and grows by one with every change of the name, the
            description or the templates, also when a template of the
            collection is deleted
          type: integer
        etag:
          description: the entity tag of the content, `"<version>"`, for If-Match
          type: string
        created:
          type: string
          format: date-time
        updated:
          description: when the content last changed
          type: string
          format: date-time
        serverWide:
          description: the collection is published to every user
          type: boolean
        publishedAt:
          description: left out unless `serverWide`
          type: string
          format: date-time
        publishedBy:
          description: left out unless `serverWide`
          type: string
        shares:
          description: >
            who the collection is shared with, sorted by user; sent to its
            owner only, and left out of the items of other owners
          type: array
          items:
            $ref: "#/components/schemas/BuilderTemplateShare"
    BuilderTemplateLibrary:
      type: object
      properties:
        owner:
          description: the caller, whose library the write routes change
          type: string
        templates:
          description: >
            the caller's own templates, in the order they were added, then
            the templates of other users shared with the caller or published,
            by owner
          type: array
          items:
            $ref: "#/components/schemas/BuilderTemplate"
        collections:
          description: >
            the caller's own collections, in the order they were added, then
            the collections of other users shared with the caller or
            published, by owner. Every ID in a collection's `templateIds` is
            in `templates`.
          type: array
          items:
            $ref: "#/components/schemas/BuilderTemplateCollection"
        preloaded:
          description: >
            the collections the server read from its template files at start,
            in the order of the files' names, each with its templates; read
            only, and the same for every caller
          type: array
          items:
            type: object
            properties:
              collection:
                $ref: "#/components/schemas/BuilderTemplateCollection"
              templates:
                type: array
                items:
                  $ref: "#/components/schemas/BuilderTemplate"
        canShare:
          description: >
            the caller may share its templates and collections: it has
            `configs` `update` and a user account
          type: boolean
        canPublish:
          description: >
            the caller may publish its templates and collections to every
            user, and take any user's published item back: it has `configs`
            `update` and `builder-templates` `publish`
          type: boolean
        damaged:
          description: >
            the caller's library record cannot be read by this server, so
            none of its items are listed
          type: boolean
        limits:
          type: object
          properties:
            templates:
              description: the most templates a library holds
              type: integer
            collections:
              description: the most collections a library holds
              type: integer
            shares:
              description: the most users one template or collection is shared with
              type: integer
            nameBytes:
              description: the most bytes a template or collection name has
              type: integer
            descriptionBytes:
              description: the most bytes a description has
              type: integer
            deviceBytes:
              description: the most bytes a template's `device` takes as JSON
              type: integer
    BuilderTemplateContent:
      type: object
      additionalProperties: false
      required:
        - name
        - device
      properties:
        name:
          description: 1 to 128 bytes, not blank, without control characters
          type: string
        description:
          description: at most 1024 bytes, without control characters
          type: string
        device:
          $ref: "#/components/schemas/BuilderTemplateDevice"
    BuilderTemplateCreate:
      type: object
      additionalProperties: false
      required:
        - templates
      properties:
        templates:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required:
              - name
              - device
            properties:
              name:
                description: 1 to 128 bytes, not blank, without control characters
                type: string
              description:
                description: at most 1024 bytes, without control characters
                type: string
              device:
                $ref: "#/components/schemas/BuilderTemplateDevice"
        collection:
          description: a new collection to hold exactly the new templates
          type: object
          additionalProperties: false
          required:
            - name
          properties:
            name:
              type: string
            description:
              type: string
    BuilderTemplateCreateResult:
      type: object
      properties:
        created:
          description: the new templates, in the order of the request
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              etag:
                type: string
        collection:
          description: the new collection, when the request asked for one
          type: object
          properties:
            id:
              type: string
            etag:
              type: string
    BuilderTemplateCollectionContent:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          description: 1 to 128 bytes, not blank, without control characters
          type: string
        description:
          description: at most 1024 bytes, without control characters
          type: string
        templateIds:
          description: templates of this library, each named once
          type: array
          maxItems: 200
          items:
            type: string
    BuilderTemplateSelection:
      description: at least one ID in all
      type: object
      additionalProperties: false
      properties:
        templates:
          type: array
          items:
            type: string
        collections:
          type: array
          items:
            type: string
    BuilderTemplateDeleteResult:
      type: object
      properties:
        deleted:
          type: object
          properties:
            templates:
              type: integer
            collections:
              type: integer
    BuilderTemplateRestore:
      description: the built-in templates to restore; none names every missing one
      type: object
      additionalProperties: false
      properties:
        templates:
          description: built-in template IDs; other IDs are ignored
          type: array
          items:
            type: string
    BuilderTemplateRestoreResult:
      type: object
      properties:
        restored:
          description: the IDs of the restored templates, in built-in order; empty when none was missing
          type: array
          items:
            type: string
    BuilderTemplateShareUpdate:
      description: at least one template or collection, and at least one user
      type: object
      additionalProperties: false
      properties:
        templates:
          type: array
          items:
            type: string
        collections:
          type: array
          items:
            type: string
        add:
          description: users to share the items with; at most 25
          type: array
          items:
            type: string
        remove:
          description: users to stop sharing the items with
          type: array
          items:
            type: string
    BuilderTemplatePublishUpdate:
      description: at least one template or collection
      type: object
      additionalProperties: false
      required:
        - serverWide
      properties:
        templates:
          type: array
          items:
            type: string
        collections:
          type: array
          items:
            type: string
        serverWide:
          description: true to publish the items to every user, false to take them back
          type: boolean
    BuilderTemplateResult:
      type: object
      properties:
        failed:
          description: the items that were not changed; empty when every one was
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                  - template
                  - collection
              id:
                type: string
              reason:
                description: >
                  `not-found` (the library holds no such item) or `too-many`
                  (the item would be shared with more than 25 users)
                type: string
                enum:
                  - not-found
                  - too-many
              code:
                description: >
                  the code of the reason: `template.item.not-found` or
                  `template.shares.too-many`
                type: string
                enum:
                  - template.item.not-found
                  - template.shares.too-many
    Workflow:
      type: object
      title: Workflow
      description: >-
        A phenix workflow config: what applying a workflow branch creates,
        updates or restarts one experiment from.
      additionalProperties: false
      required:
        - apiVersion
        - kind
        - spec
      properties:
        apiVersion:
          type: string
          title: API Version
          description: The config API version; a workflow config is phenix.sandia.gov/v0.
          enum:
            - phenix.sandia.gov/v0
        kind:
          type: string
          title: Kind
          description: The config kind, which is always Workflow.
          enum:
            - Workflow
        metadata:
          type: object
          title: Metadata
          description: >-
            Not read by the server; it is accepted so a workflow config has the
            same four top-level keys as every other phenix config, and so a later
            version can carry a name or annotations without a breaking change.
          nullable: true
        spec:
          type: object
          title: Workflow Spec
          description: >-
            What an apply may do and the experiment settings it sets; an empty
            spec applies every default.
          additionalProperties: false
          properties:
            auto:
              type: object
              title: Auto
              description: What an apply may do to the experiment mapped to the workflow branch without being asked.
              nullable: true
              additionalProperties: false
              properties:
                create:
                  type: string
                  title: Create
                  description: >-
                    The name of the experiment to create when none is mapped to
                    the branch; unset never creates one.
                  nullable: true
                update:
                  type: boolean
                  title: Update
                  description: >-
                    Whether an apply may update the experiment already mapped to
                    the branch; defaults to true when unset.
                  nullable: true
                restart:
                  type: boolean
                  title: Restart
                  description: >-
                    Whether an apply may start a new or updated experiment and
                    stop and restart a running one; defaults to true when unset.
                  nullable: true
            topology:
              type: string
              title: Topology
              description: >-
                The name of the topology config; required to create an
                experiment, and on an update defaults to the experiment's
                current topology.
              nullable: true
            scenario:
              type: string
              title: Scenario
              description: The name of the scenario config; on an update defaults to the experiment's current scenario.
              nullable: true
            vlans:
              type: object
              title: VLANs
              description: >-
                VLAN alias to VLAN ID; every alias used by an interface in the
                topology is set to its ID here, or left for minimega to pick
                when not listed.
              nullable: true
              additionalProperties:
                type: integer
            schedules:
              type: object
              title: Schedules
              description: >-
                VM hostname to cluster host; each listed non-external node of
                the topology is scheduled on that host.
              nullable: true
              additionalProperties:
                type: string
            deployMode:
              type: string
              title: Deploy Mode
              description: >-
                Where VMs are deployed, all, no-headnode or only-headnode in any
                letter case; unset or empty uses the server's deploy-mode
                setting.
              nullable: true
              pattern: '^(?i:all|no-headnode|only-headnode)?$'
            useGREMesh:
              type: boolean
              title: Use GRE Mesh
              description: >-
                Whether the experiment uses a GRE mesh between cluster hosts; it
                is OR-ed with the server's use-gre-mesh setting, so either turns
                it on.
              nullable: true
            vlanRange:
              type: object
              title: VLAN Range
              description: The range of VLAN IDs the experiment may allocate from; unset leaves both ends unset.
              nullable: true
              additionalProperties: false
              properties:
                min:
                  type: integer
                  title: Minimum
                  description: The lowest VLAN ID the experiment may use; 0 leaves the minimum unset.
                  nullable: true
                max:
                  type: integer
                  title: Maximum
                  description: The highest VLAN ID the experiment may use; 0 leaves the maximum unset.
                  nullable: true
            defaultBridge:
              type: string
              title: Default Bridge
              description: >-
                The bridge the experiment's VMs attach to by default; defaults to
                phenix, is at most 15 characters (the Linux interface name
                limit), and unless it is phenix no other experiment may use it.
              nullable: true
              maxLength: 15
    WorkflowResult:
      type: object
      properties:
        action:
          type: string
          enum:
            - none
            - create
            - createAndStart
            - update
            - updateAndStart
            - restart
        experiment:
          type: string
          description: experiment the action applies to (empty when no experiment is involved)
        reason:
          type: string
          description: why nothing was done, when action is none
        dryRun:
          type: boolean
          description: true when nothing was changed because dryRun was requested
    WorkflowConfigResult:
      type: object
      description: what POST /workflow/configs/{branch}?dryRun=true would do
      properties:
        action:
          type: string
          enum:
            - create
            - update
          description: whether the request would create the config or update the stored one
        kind:
          type: string
          description: the config's kind, e.g. Topology
        name:
          type: string
          description: the config's name after the server filled in its placeholders, such as ${BRANCH_NAME}
        dryRun:
          type: boolean
          description: always true
        pending:
          type: string
          description: >
            the value to pass as pending to a dry run of
            POST /workflow/apply/{branch}: Kind/name, followed for a scenario by
            ?from=...&topology=... (its fromScenario names and topology
            annotation) and for a topology that includes others by ?include=...
    Options:
      type: object
      properties:
        bridge-mode:
          type: string
        deploy-mode:
          type: string
        use-gre-mesh:
          type: boolean
        base-dir.injects:
          type: string
          description: directory phenix workflow apply stages injects into
        workflow-dry-run:
          type: boolean
          description: >
            true when POST /workflow/configs/{branch} and POST /workflow/apply/{branch}
            support dryRun, and apply supports pending and expect
    Error:
      type: object
      properties:
        message:
          type: string
          description: what went wrong; for a config validation failure, the first explained line
        cause:
          type: string
          description: the underlying error text
        metadata:
          type: object
          description: extra details, returned for some errors
          properties:
            validation:
              type: string
              description: >
                for a schema validation failure, the explained lines separated by
                newlines, each in the form <item> "<hostname|name>" (line N): <what>
                (at <sub-path>), with (line N) left out for single-line sources and
                an extra hint line for a misplaced key; an error that cannot be
                placed in the source (in a templated key, in data a config hook
                added, in a YAML merge key, or a missing or misindented
                metadata.name) keeps the validator's text; for an unparsable body
                sent to POST /configs, the parser error
            validation-raw:
              type: string
              description: for a schema validation failure, the original validator text
          additionalProperties:
            type: string
  parameters:
    BuilderDraftOwner:
      name: owner
      in: path
      description: the user that owns the draft
      required: true
      schema:
        type: string
    BuilderDraftID:
      name: draft
      in: path
      description: draft ID
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    BuilderIfMatch:
      name: If-Match
      in: header
      description: >
        The ETag of the draft revision the change is based on: exactly one
        strong, quoted entity tag, such as `"3"`. A missing header, a wildcard
        or a weak tag is rejected with 400; a tag naming any other revision is
        rejected with 412.
      required: true
      schema:
        type: string
    BuilderTemplateOwner:
      name: owner
      in: path
      description: >
        the user whose template library is changed, which must be the caller
        (`owner` of GET /builder/templates)
      required: true
      schema:
        type: string
    BuilderTemplateID:
      name: template
      in: path
      description: template ID
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    BuilderTemplateCollectionID:
      name: collection
      in: path
      description: collection ID
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    BuilderTemplateIfMatch:
      name: If-Match
      in: header
      description: >
        The `etag` of the template or collection the change is based on:
        exactly one strong, quoted entity tag, such as `"3"`. A missing
        header, a wildcard or a weak tag is rejected with 400; a tag that
        does not name the current content is rejected with 412.
      required: true
      schema:
        type: string
  headers:
    BuilderETag:
      description: the draft's revision as a quoted entity tag, for the next If-Match
      schema:
        type: string
    BuilderSharesETag:
      description: >
        the entity tag of the list of who a draft is shared with,
        `"shares-N"`, for the next If-Match of PUT
      schema:
        type: string
    BuilderTemplateETag:
      description: >
        the entity tag of the template's or collection's content,
        `"<version>"`, for the next If-Match
      schema:
        type: string
    BuilderWarning:
      description: >
        Set when the change succeeded but removing the content it superseded
        failed. The cause is logged on the server only.
      schema:
        type: string
  responses:
    BuilderBadRequest:
      description: >
        The request is malformed: its body is not a single JSON value of the
        expected shape (unknown fields are rejected), or its If-Match header is
        missing or not a single strong entity tag.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderForbidden:
      description: >
        The caller's role lacks a permission the operation requires, or the
        caller can see the draft but may not do this to it: for example,
        saving it with a view share, deleting it with any share, or sharing
        it without owning it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderNotFound:
      description: >
        The resource does not exist; or it is another user's draft the caller
        may not see (not shared with the caller, and no `builder-drafts`
        permission), answered exactly as if it did not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderConflict:
      description: >
        The draft or a target config changed while the request was handled.
        A draft that changed has the code `draft.conflict`: read it again and
        retry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderPreconditionFailed:
      description: >
        The If-Match header does not name the draft's current revision
        (`draft.stale`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderTooLarge:
      description: >
        The request body or the document exceeds the server's size limits.
        The snapshot history never does: its oldest snapshots are dropped
        instead.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderUnprocessable:
      description: >
        The request is well formed but cannot be applied, for example a
        document that fails validation or a config that cannot be converted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderIconNotFound:
      description: >
        No icon of the icon library has the name in the path, nor keeps it
        as an alias, ignoring case. The message never repeats the path.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderTemplateNotFound:
      description: >
        `{owner}` is not the caller: a library is changed by its owner only,
        whatever the caller's role. Or the library holds no template or
        collection with the ID in the path.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderTemplateDamaged:
      description: >
        The library record cannot be read by this version of phenix, so it
        cannot be changed. Or the request names a template or a collection
        the server read from one of its template files (`source`
        `preloaded`), which no one can change: `message` names it and says
        to copy it to the library instead.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderTemplatePreconditionFailed:
      description: >
        The If-Match header does not name the current content of the
        template or collection. The response carries the current entity tag.
      headers:
        ETag:
          $ref: "#/components/headers/BuilderTemplateETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderTemplateTooLarge:
      description: >
        The request body is larger than the route allows (6 MiB to add
        templates, 1 MiB to replace one, 64 KiB otherwise); or the library
        would hold more than 200 templates, 50 collections or 200 templates
        in one collection, or take more than 512 KiB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderTemplateUnprocessable:
      description: >
        The request is well formed but cannot be applied; `message` says
        why. A template that is not valid is named by its place in the
        request and the field, such as `templates[0].name: template name is
        required` or `templates[0].device.icon: icon name "a b" must be 1 to
        64 letters, digits, "_", "@", "." or "-"`. A collection is refused
        for its name, its description, or a template the library does not
        hold or that is named twice.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderTemplateBusy:
      description: >
        The library kept changing while the request was handled. Try again.
      headers:
        Retry-After:
          description: seconds to wait before trying again
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    InsufficientStorage:
      description: >
        etcd is out of space, so nothing was saved. `message` says what an
        administrator must do. The same request succeeds once space is freed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
