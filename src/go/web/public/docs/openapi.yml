      - $ref: "#/components/parameters/host"
      - $ref: "#/components/parameters/port"
    get:
      tags:
        - Virtual Machines
      summary: Connect to a VM port forward over a websocket
      operationId: getVMPortForwardWebSocket
      responses:
        "200":
          $ref: "#/components/responses/Success"
  "/experiments/{exp}/vms/{name}/mount":
    parameters:
      - $ref: "#/components/parameters/exp"
      - $ref: "#/components/parameters/name"
    post:
      tags:
        - Virtual Machines
      summary: Mount a VM disk
      description: Requires the "vm-mount" feature to be enabled.
      operationId: postVMMount
      responses:
        "200":
          $ref: "#/components/responses/Success"
  "/experiments/{exp}/vms/{name}/unmount":
    parameters:
      - $ref: "#/components/parameters/exp"
      - $ref: "#/components/parameters/name"
    delete:
      tags:
        - Virtual Machines
      summary: Unmount a VM disk
      description: Requires the "vm-mount" feature to be enabled.
      operationId: deleteVMMount
      responses:
        "200":
          $ref: "#/components/responses/Success"
  "/experiments/{exp}/vms/{name}/files":
    parameters:
      - $ref: "#/components/parameters/exp"
      - $ref: "#/components/parameters/name"
      - $ref: "#/components/parameters/pathQuery"
    get:
      tags:
        - Virtual Machines
      summary: List files on a mounted VM disk
      description: Requires the "vm-mount" feature to be enabled.
      operationId: getVMMountFiles
      responses:
        "200":
          $ref: "#/components/responses/Success"
  "/experiments/{exp}/vms/{name}/files/download":
    parameters:
      - $ref: "#/components/parameters/exp"
      - $ref: "#/components/parameters/name"
      - $ref: "#/components/parameters/pathQuery"
    get:
      tags:
        - Virtual Machines
      summary: Download a file from a mounted VM disk
      description: Requires the "vm-mount" feature to be enabled.
      operationId: getVMMountFileDownload
      responses:
        "200":
          $ref: "#/components/responses/Success"
  "/experiments/{exp}/vms/{name}/files/upload":
    parameters:
      - $ref: "#/components/parameters/exp"
      - $ref: "#/components/parameters/name"
      - $ref: "#/components/parameters/pathQuery"
    put:
      tags:
        - Virtual Machines
      summary: Upload a file to a mounted VM disk
      description: Requires the "vm-mount" feature to be enabled.
      operationId: putVMMountFileUpload
      responses:
        "200":
          $ref: "#/components/responses/Success"
  "/experiments/{exp}/vms/{name}/files/copy":
    parameters:
      - $ref: "#/components/parameters/exp"
      - $ref: "#/components/parameters/name"
    post:
      tags:
        - Virtual Machines
      summary: Copy an experiment file to a mounted VM disk
      description: Requires the "vm-mount" feature to be enabled.
      operationId: postVMMountFileCopy
      responses:
        "200":
          $ref: "#/components/responses/Success"
  "/disks/snapshot":
    parameters:
      - $ref: "#/components/parameters/diskQuery"
      - $ref: "#/components/parameters/newDiskQuery"
    post:
      tags:
        - Disks
      summary: Snapshot a disk
      operationId: postDiskSnapshot
      responses:
        "200":
          $ref: "#/components/responses/Success"
  "/disks/rebase":
    parameters:
      - $ref: "#/components/parameters/diskQuery"
      - $ref: "#/components/parameters/backingQuery"
      - $ref: "#/components/parameters/unsafeQuery"
    post:
      tags:
        - Disks
      summary: Rebase a disk onto a different backing image
      operationId: postDiskRebase
      responses:
        "200":
          $ref: "#/components/responses/Success"
  "/disks/resize":
    parameters:
      - $ref: "#/components/parameters/diskQuery"
      - $ref: "#/components/parameters/sizeQuery"
    post:
      tags:
        - Disks
      summary: Resize a disk
      operationId: postDiskResize
      responses:
        "200":
          $ref: "#/components/responses/Success"
  "/disks/commit":
    parameters:
      - $ref: "#/components/parameters/diskQuery"
    post:
      tags:
        - Disks
      summary: Commit a disk into its backing image
      operationId: postDiskCommit
      responses:
        "200":
          $ref: "#/components/responses/Success"
  "/disks/clone":
    parameters:
      - $ref: "#/components/parameters/diskQuery"
      - $ref: "#/components/parameters/newDiskQuery"
    post:
      tags:
        - Disks
      summary: Clone a disk
      operationId: postDiskClone
      responses:
        "200":
          $ref: "#/components/responses/Success"
  "/disks/rename":
    parameters:
      - $ref: "#/components/parameters/diskQuery"
      - $ref: "#/components/parameters/newDiskQuery"
    post:
      tags:
        - Disks
      summary: Rename a disk
      operationId: postDiskRename
      responses:
        "200":
          $ref: "#/components/responses/Success"
  "/disks/download":
    parameters:
      - $ref: "#/components/parameters/diskQuery"
    get:
      tags:
        - Disks
      summary: Download a disk
      operationId: getDiskDownload
      responses:
        "200":
          $ref: "#/components/responses/Success"
  "/topologies/{topo}/scenarios":
    parameters:
      - $ref: "#/components/parameters/topo"
    get:
      tags:
        - Topologies
      summary: Get the scenarios available for a topology
      operationId: getTopologyScenarios
      responses:
        "200":
          $ref: "#/components/responses/Success"
  "/users/{username}/tokens":
    parameters:
      - $ref: "#/components/parameters/username"
    post:
      tags:
        - Users
      summary: Create a user access token
      operationId: postUserToken
      responses:
        "200":
          $ref: "#/components/responses/Success"
  "/logs":
    get:
      tags:
        - Server
      summary: Get server logs
      operationId: getLogs
      responses:
        "200":
          $ref: "#/components/responses/Success"
  "/ws":
    get:
      tags:
        - Server
      summary: Connect to the event broker over a websocket
      operationId: getWebSocket
      responses:
        "200":
          $ref: "#/components/responses/Success"
  "/console":
    post:
      tags:
        - Console
      summary: Create a minimega console
      operationId: postConsole
      responses:
        "200":
          $ref: "#/components/responses/Success"
  "/console/{pid}/ws":
    parameters:
      - $ref: "#/components/parameters/pid"
    get:
      tags:
        - Console
      summary: Connect to a minimega console over a websocket
      operationId: getConsoleWebSocket
      responses:
        "200":
          $ref: "#/components/responses/Success"
  "/console/{pid}/size":
    parameters:
      - $ref: "#/components/parameters/pid"
      - $ref: "#/components/parameters/colsQuery"
      - $ref: "#/components/parameters/rowsQuery"
    post:
      tags:
        - Console
      summary: Resize a minimega console
      operationId: postConsoleSize
      responses:
        "200":
          $ref: "#/components/responses/Success"
  "/settings":
    get:
      tags:
        - Settings
      summary: Get server settings
      operationId: getSettings
      responses:
        "200":
          $ref: "#/components/responses/Success"
    post:
      tags:
        - Settings
      summary: Update server settings
      operationId: postSettings
      responses:
        "200":
          $ref: "#/components/responses/Success"
  "/settings/password":
    get:
      tags:
        - Settings
      summary: Get password requirements
      operationId: getPasswordRequirements
      responses:
        "200":
          $ref: "#/components/responses/Success"
  "/workflow/apply/{branch}":
    parameters:
      - $ref: "#/components/parameters/branch"
    post:
      tags:
        - Workflow
      summary: Apply a workflow branch
      operationId: postWorkflowApply
      responses:
        "200":
          $ref: "#/components/responses/Success"
  "/workflow/configs/{branch}":
    parameters:
      - $ref: "#/components/parameters/branch"
    post:
      tags:
        - Workflow
      summary: Create or update a workflow config
      operationId: postWorkflowConfig
      responses:
        "200":
          $ref: "#/components/responses/Success"
  "/options":
    get:
      tags:
        - Server
      summary: Get server options
      operationId: getOptions
      responses:
        "200":
          $ref: "#/components/responses/Success"
servers:
  - url: http://localhost:3000/api/v1
security:
  - bearerAuth: []
  - cookieAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT issued by POST /login, or a user access token issued by
        POST /users/{username}/tokens.
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: JWT issued by POST /login, used by the phenix web UI.
  responses:
    Success:
      description: successful operation
  parameters:
    name:
      name: name
      in: path
      required: true
      schema:
        type: string
    exp:
      name: exp
      in: path
      required: true
      schema:
        type: string
    run:
      name: run
      in: path
      required: true
      schema:
        type: string
    loop:
      name: loop
      in: path
      required: true
      schema:
        type: string
    stage:
      name: stage
      in: path
      required: true
      schema:
        type: string
    cmp:
      name: cmp
      in: path
      required: true
      schema:
        type: string
    pid:
      name: pid
      in: path
      required: true
      schema:
        type: string
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    host:
      name: host
      in: path
      required: true
      schema:
        type: string
    port:
      name: port
      in: path
      required: true
      schema:
        type: string
    topo:
      name: topo
      in: path
      required: true
      schema:
        type: string
    username:
      name: username
      in: path
      required: true
      schema:
        type: string
    branch:
      name: branch
      in: path
      required: true
      schema:
        type: string
    # Query parameters the router matches on: a request without them does not
    # reach the handler at all, so they are required rather than optional.
    diskQuery:
      name: disk
      in: query
      required: true
      description: path of the disk image, relative to the phenix images directory
      schema:
        type: string
    newDiskQuery:
      name: new
      in: query
      required: true
      description: path of the resulting disk image
      schema:
        type: string
    backingQuery:
      name: backing
      in: query
      required: true
      description: path of the new backing image (empty to flatten the disk)
      schema:
        type: string
    unsafeQuery:
      name: unsafe
      in: query
      required: true
      description: skip the backing image compatibility check
      schema:
        type: boolean
    sizeQuery:
      name: size
      in: query
      required: true
      description: new disk size (e.g. 10G)
      schema:
        type: string
    pathQuery:
      name: path
      in: query
      required: true
      description: path within the mounted VM disk
      schema:
        type: string
    colsQuery:
      name: cols
      in: query
      required: true
      schema:
        type: integer
    rowsQuery:
      name: rows
      in: query
      required: true
      schema:
        type: integer
    permissionsQuery:
      name: permissions
      in: query
      required: false
      description: >
        include each role's resolved permission matrix, equivalent to what
        `phenix util role-table` prints
      schema:
        type: boolean
        default: false
  schemas:
    Configs:
      type: object
      properties:
        configs:
          type: array
          items:
            $ref: "#/components/schemas/Config"
    Config:
      type: object
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          type: object
          properties:
            name:
              type: string
            annotations:
              type: object
              additionalProperties:
                type: string
          required:
            - name
        spec:
          type: object
          additionalProperties: true
      required:
        - apiVersion
        - kind
        - metadata
        - spec
    Experiments:
      type: object
      properties:
        experiments:
          type: array
          items:
            $ref: "#/components/schemas/Experiment"
    Experiment:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        topology:
          type: string
        apps:
          type: array
          items:
            type: string
        start_time:
          type: string
          format: date-time
        running:
          type: boolean
        vm_count:
          type: integer
        vlan_min:
          type: integer
        vlan_max:
          type: integer
        vlan_count:
          type: integer
        vlans:
          type: array
          items:
            type: object
            properties:
              vlan:
                type: integer
              alias:
                type: string
        vms:
          $ref: "#/components/schemas/VMs"
    VMs:
      type: object
      properties:
        vms:
          type: array
          items:
            $ref: "#/components/schemas/VM"
    VM:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        experiment:
          type: string
        host:
          type: string
        ipv4:
          type: array
          items:
            type: string
        cpus:
          type: integer
        ram:
          type: integer
        disk:
          type: string
        dnb:
          type: boolean
        networks:
          type: array
          items:
            type: string
        taps:
          type: array
          items:
            type: string
        captures:
          type: array
          items:
            $ref: "#/components/schemas/Capture"
        running:
          type: boolean
        uptime:
          type: number
          format: float
        screenshot:
          type: string
          format: base64
    Schedule:
      type: object
      properties:
        schedule:
          type: array
          items:
            type: object
            properties:
              vm:
                type: string
              host:
                type: string
              auto_assigned:
                type: boolean
    Captures:
      type: object
      properties:
        captures:
          type: array
          items:
            $ref: "#/components/schemas/Capture"
    Capture:
      type: object
      properties:
        vm:
          type: string
        interface:
          type: integer
        filepath:
          type: string
    Snapshots:
      type: object
      properties:
        snapshots:
          type: array
          items:
            type: string
    Files:
      type: object
      properties:
        files:
          type: array
          items:
            type: string
    Hosts:
      type: object
      properties:
        hosts:
          type: array
          items:
            $ref: "#/components/schemas/Host"
    Host:
      type: object
      properties:
        name:
          type: string
        cpus:
          type: integer
        load:
          type: string
        memused:
          type: integer
        memtotal:
          type: integer
        bandwidth:
          type: string
        vms:
          type: integer
        uptime:
          type: number
          format: float
        schedulable:
          type: boolean
    Applications:
      type: object
      properties:
        applications:
          type: array
          items:
            type: string
    Topologies:
      type: object
      properties:
        topologies:
          type: array
          items:
            type: string
    Disks:
      type: object
      properties:
        disks:
          type: array
          items:
            type: string
    Users:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
    User:
      type: object
      properties:
        username:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: object
          properties:
            name:
              type: string
            resources:
              type: array
              items:
                type: string
            resource_names:
              type: array
              items:
                type: string
            verbs:
              type: array
              items:
                type: string
    Policy:
      type: object
      properties:
        resources:
          type: array
          items:
            type: string
          example:
            - experiments
            - experiments/*
        resourceNames:
          type: array
          items:
            type: string
          example:
            - "*"
        verbs:
          type: array
          items:
            type: string
          example:
            - list
            - get
    Credentials:
      type: object
      properties:
        username:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
        token:
          type: string
