              $ref: "#/components/schemas/BuilderCursorMove"
      responses:
        "200":
          description: Cursor moved. The response is the draft without its document.
          headers:
            ETag:
              $ref: "#/components/headers/BuilderETag"
            Warning:
              $ref: "#/components/headers/BuilderWarning"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderDraft"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "409":
          $ref: "#/components/responses/BuilderConflict"
        "412":
          $ref: "#/components/responses/BuilderPreconditionFailed"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/drafts/{owner}/{draft}/publish":
    parameters:
      - $ref: "#/components/parameters/BuilderDraftOwner"
      - $ref: "#/components/parameters/BuilderDraftID"
    post:
      tags:
        - Builder
      summary: Publish a Builder draft to phenix configs
      description: >
        The only Builder operation that creates or updates configs.
        (DELETE /builder/documents/{document} deletes a published topology.)
        It publishes the current snapshot of the draft. The request carries
        only the intent.

        Requires `configs` `update`. For the draft of another user, also
        requires an edit share or `builder-drafts` `update`. The caller must
        also have its own `configs` `create` or `update` on each target
        config, as the action of the target requires. An experiment target
        also requires `experiments` `create` or `update`. A draft imported
        from a stored Topology or Experiment also needs `configs` `get` on it,
        and `topologies` `get` (or `experiments` `get`) on its name. The
        server uses them to check that the source did not change since the
        import.

        In both modes, a draft whose document lists `scenarios` has a
        `scenario` stage before the experiment stage. Each listed Scenario
        config must exist and be readable (`configs` `get` and `scenarios`
        `list`). Otherwise the answer is 422 and names the scenario. The stage
        adds the topology to the `topology` annotation of each scenario that
        does not name it yet. This needs `configs` `update` on that scenario
        (otherwise 403). The stage does not write a scenario that already
        names the topology. The stage message tells which scenarios it
        changed. A publish never creates or replaces the spec of a scenario.

        A repeat of a publication that completed, with the same If-Match,
        gets 200 with every stage skipped.

        A draft updates an existing topology or experiment only in these
        cases: the draft was imported from it, or the draft published it (or
        was opened from the published diagram that did) and nothing else
        changed it since. The server refuses all other updates with 409.

        Only the draft imported from a topology updates a topology that has a
        legacy Builder diagram (`builder-xml`). A draft imported from an
        experiment built from that topology does not. Also, the diagram must
        be the one that the import read. The server refuses with 409 a
        diagram that was changed, added or removed since, as for a changed
        spec. The update removes `builder-xml`, writes `builder-doc`, and adds
        a warning to the result. The warning says that the diagram was
        replaced or, if the import could not read it, removed.

        Some topologies are read from the Builder file that their
        `builder-doc` annotation names. Only a draft opened from that file
        updates such a topology. The file must still hold what the draft was
        opened from, and the topology must still be what the file publishes.
        Such a draft updates the topology in no other way. It does not update
        it as a draft imported from the topology, even when the document of
        the file was imported from the topology. A publish never writes the
        file. The topology keeps its `path`, and the result has a warning that
        the file is now behind.

        A published experiment records in its `builder-experiment` annotation
        which draft and published document published it. After the configure
        stage of its apps ran, it also records its digest there. An experiment
        update runs that stage, as an update through `/configs` does. When a
        stage fails after earlier stages were written, the response is 409,
        500 or 507, with a result whose status is `partial`. When the
        published document was stored but the content that it replaces could
        not be removed, the publication continues. The answer then has a
        `Warning` header and a warning in the result.

        With `"dryRun": true`, the request is a dry run. A dry run needs the
        same permissions, and makes every check of the publication on the
        current snapshot of the draft. It writes nothing (no published
        document, config, scenario annotation, experiment or draft record),
        and needs no If-Match. It answers 200 with a `BuilderPublishPreview`.
        This holds what the publication would change, the warnings it would
        give, and, in `errors`, the refusal that a publication would answer
        with 400, 409 or 422. A 403, a 404, a body that is not a publish
        request (400) and a server failure keep their status. The dry run
        takes no lock, so what it reports may change before the publication is
        sent. The Publish dialog shows it as What publishing changes.
      operationId: postBuilderDraftPublish
      parameters:
        - name: If-Match
          in: header
          description: >
            The ETag of the draft revision that the publication is based on,
            as for every Builder mutation (`BuilderIfMatch`). It is required,
            except for a dry run, which writes nothing and ignores it. A
            missing or malformed ETag gets 400 before the server decodes the
            body, unless the body asks for a dry run.
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderPublishRequest"
      responses:
        "200":
          description: >
            publication succeeded, or, for a dry run, what it would change
            (`BuilderPublishPreview`, status `preview`)
          headers:
            ETag:
              $ref: "#/components/headers/BuilderETag"
            Warning:
              $ref: "#/components/headers/BuilderWarning"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BuilderPublishResult"
                  - $ref: "#/components/schemas/BuilderPublishPreview"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "409":
          description: >
            A target config or the draft changed after the publication was
            prepared. Or an included topology now defines a hostname that the
            published topology also defines. Or a stage failed on such a
            conflict after earlier stages were written (a `partial` result).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WebError"
                  - $ref: "#/components/schemas/BuilderPublishResult"
        "412":
          $ref: "#/components/responses/BuilderPreconditionFailed"
        "422":
          description: >
            The document fails validation, or publishes something that phenix
            refuses. Examples are an interface with no VLAN on a device that is
            not external, interfaces that share an IP or MAC address, or a
            hostname that phenix refuses (one character long, `all`, all
            digits, or `phenix` on a Windows node). The message names them.
            This status also applies to a scenario that the document lists and
            that does not exist or that the caller may not read. It also applies
            to an experiment scenario that the document does not list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "500":
          description: >
            A stage failed after earlier stages were written (a `partial`
            result), or the draft could not be read.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WebError"
                  - $ref: "#/components/schemas/BuilderPublishResult"
        "507":
          description: >
            etcd is out of space. Nothing was written, or a stage failed after
            earlier stages were written (a `partial` result whose failed stage
            says so). The message says what an administrator must do.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WebError"
                  - $ref: "#/components/schemas/BuilderPublishResult"
  "/builder/drafts/{owner}/{draft}/preflight":
    parameters:
      - $ref: "#/components/parameters/BuilderDraftOwner"
      - $ref: "#/components/parameters/BuilderDraftID"
    post:
      tags:
        - Builder
      summary: Run preflight checks on a Builder draft
      description: >
        Puts the current document of the draft through the checks that the
        request names, in the request order and all at the same time. Reports
        each check as `passed`, `failed` or `unavailable`, with a summary and
        its issues.

        - `capacity` compares the CPUs and memory of the devices that phenix
        starts with the free CPUs and memory of the schedulable cluster hosts.
        These devices are all devices except external devices. A device uses
        `hardware.vcpus` and `hardware.memory`, or 1 and 512 MB when they are
        not set. The check also makes sure that each device fits on one host,
        with its vCPUs and memory both within the CPUs and memory of that
        host.

        - `network` compares the VLANs that the devices use, and the VLAN
        aliases of the networks, with the VLAN range of the named
        `experiment`. No range applies without an experiment, or when the
        experiment sets no range. The check compares the aliases with the
        VLANs that running experiments hold. It compares the bridges that the
        interfaces name (and the default bridge of the experiment, or `phenix`
        without one) with the Open vSwitch bridges of the schedulable hosts.
        It lists these bridges with `ovs-vsctl list-br` through the minimega
        `shell` command, which changes nothing.

        - `disks` looks up each drive image by file name among the disk
        images of the server. It checks the image kind: a VM or ISO image for
        a kvm device, and a container image for a container.

        - `apps` reads each Scenario config that the document lists. It looks
        up each app that the scenario does not disable among the default,
        built-in and user apps. A listed scenario that does not exist is the
        error `preflight.app.scenario-missing`.

        A check fails when one of its issues is an error. A check is
        `unavailable` when nothing failed, but the check, or a part of it,
        could not be made. The causes are:

        - The role of the caller does not have `hosts` `list` (capacity and
        bridges), `disks` `list`, `applications` `list`, or `experiments`
        `list` (VLANs in use).

        - The role does not have read access to the experiment (`configs`
        `get` and `experiments` `get`) or to a scenario (`configs` `get` and
        `scenarios` `list`).

        - minimega cannot be reached.

        - The server lists no disk images.

        - The check took more than 20 seconds.

        An issue tells why (code `preflight.unavailable`, or
        `preflight.app.scenario-unreadable` as a warning for a scenario). One
        check never stops the other checks. Needs the same permissions as a
        read of the draft: `configs` `get`, and for the draft of another user,
        a share or `builder-drafts` `get`. The route writes nothing, and starts
        no VM or experiment.
      operationId: postBuilderDraftPreflight
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderPreflightRequest"
      responses:
        "200":
          description: each check named, in the request's order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderPreflightReport"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
  "/builder/drafts/{owner}/{draft}/shares":
    parameters:
      - $ref: "#/components/parameters/BuilderDraftOwner"
      - $ref: "#/components/parameters/BuilderDraftID"
    get:
      tags:
        - Builder
      summary: List who a Builder draft is shared with
      description: >
        Requires `configs` `get` and ownership of the draft. Only the owner
        learns who else has access (403 for any other caller who can see the
        draft). The server checks each entry against the account that it was
        shared with. `stale` marks an entry whose account was deleted, or
        replaced by a new account with the same name. Such an entry grants
        nothing. The list has its own entity tag, `"shares-N"`, for the next
        PUT.
      operationId: getBuilderDraftShares
      responses:
        "200":
          description: successful operation
          headers:
            ETag:
              $ref: "#/components/headers/BuilderSharesETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderShares"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
    put:
      tags:
        - Builder
      summary: Replace who a Builder draft is shared with
      description: >
        Requires `configs` `update`, ownership of the draft, and a user
        account of the caller (thus not when authentication is off). The
        request replaces the whole list, of at most 25 users. Each user must
        have an account, and the share is bound to that account. A user whose
        account was replaced must be removed, saved, and added again. A change
        to the list also changes the ETag of the draft, which the response
        carries in `draft.etag`. There is no top-level `etag`. A request that
        changes nothing gets 200, with both entity tags unchanged. Content
        saves never conflict with this request, because they use the ETag of
        the draft, not the ETag of the list.
      operationId: putBuilderDraftShares
      parameters:
        - name: If-Match
          in: header
          description: >
            The entity tag of the list: `"shares-N"` from GET or the last PUT
            (`"shares-0"` for a draft that was never shared). A missing
            header, a wildcard or a weak tag gets 400. Any other tag, including
            a draft ETag, gets 412.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderShareUpdate"
      responses:
        "200":
          description: the list now stored
          headers:
            ETag:
              $ref: "#/components/headers/BuilderSharesETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderShares"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "412":
          description: >
            The If-Match header does not name the current entity tag of the
            list, or the list changed during the request
            (`draft.shares.stale`). The response carries the current tag.
          headers:
            ETag:
              $ref: "#/components/headers/BuilderSharesETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "413":
          description: The request body is larger than 64 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "422":
          description: Some entries were refused. `errors` tells which entries and why.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderShareErrors"
        "503":
          description: >
            The draft kept changing while the list was written. Try again.
          headers:
            Retry-After:
              description: seconds to wait before trying again
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/drafts/{owner}/{draft}/shares/candidates":
    parameters:
      - $ref: "#/components/parameters/BuilderDraftOwner"
      - $ref: "#/components/parameters/BuilderDraftID"
    get:
      tags:
        - Builder
      summary: List who a Builder draft can be shared with
      description: >
        The same callers as for PUT of the share list may ask (403 for any
        other caller who can see the draft). Lists, sorted by username, every
        account that can receive a share, whatever the `users` permissions of
        the caller. These are all users with an account, other than the
        owner, that a PUT of the share list would accept. Thus the list does
        not include a user that the draft is shared with through an account
        that was removed since. The list also includes users that the draft
        is already shared with.
      operationId: getBuilderDraftShareCandidates
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderShareCandidates"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
  "/builder/sources":
    get:
      tags:
        - Builder
      summary: List the configs Builder can use as sources
      description: >
        Requires `configs` `list`. POST /builder/generate can import
        topologies and experiments. Scenarios and images are for selection
        only. The server filters each config by `configs` `list` for its name.
        For topologies, experiments and scenarios, it also filters by the
        `list` permission of that resource. A topology also reports how many
        topologies it includes (`includeCount`), to a caller who holds
        `configs` `get` for its name.
      operationId: getBuilderSources
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderSources"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
  "/builder/generate":
    post:
      tags:
        - Builder
      summary: Import a Builder document from a Topology or Experiment config
      description: >
        Converts a stored config (`source`) or an uploaded config (`content`)
        into a document and returns it. Nothing is written. Requires `configs`
        `get`. A stored source also needs `configs` `get` for its name, and
        the `topologies` or `experiments` `list` permission for it. Uploaded
        content needs `configs` `create`, because the server parses it as
        POST /configs parses a config. This includes the substitution of
        `${NAME}` from the environment of the server
        (sandialabs/sceptre-phenix#436 describes this).

        A Topology that has the `builder-xml` annotation and no `builder-doc`
        is converted from its legacy Builder diagram, as POST /builder/legacy
        converts one. Its `source` then has `builder` `builder-xml`.

        The server reads the topologies that a Topology includes
        (`includeTopologies`) from the config store with the permissions of
        the caller, never from a file. With `includes` `keep` (the default),
        their nodes are in the document, marked `includedFrom` and read only.
        The document lists the includes that could not be read in its
        `source.unresolvedIncludes`. With `includes` `combine`, their nodes
        are nodes of the document. Only the includes that could not be read
        stay in its `source.includeTopologies`.

        `copy` asks for the same document as a plain import, not linked to
        the topology. A combined document and a copy name no config. Their
        `source.kind` is `manual`, and the document name is the name of the
        new topology. A draft made from such a document publishes a new
        topology, and never updates the topology it was imported from. Their
        `metadata.notes` end with the note `Copied from <name>`, where
        `<name>` is the name in the metadata of the source config. The new
        name is `name`, or else the source name with `-combined` or `-copy`
        added. The server does not look for a name that no topology has. The
        `source` of the response is still the config that was read.

        The scenario of an Experiment (its `scenario` annotation) becomes the
        `scenarios` of the document when this server stores a Scenario config
        of that name and the caller may list it (`configs` `list` and
        `scenarios` `list` for it). Otherwise, the document lists no
        scenario, and a warning says so. The scenario that an Experiment
        holds never goes into the document. For uploaded content, a listed
        scenario also adds a warning. The warning says that the scenario is
        the Scenario config of that name on this server, not the copy in the
        file.

        Errors:

        - 400 when `includes` has a different value, or when `name` is given
        without `copy` or `includes` `combine`.

        - 422 when `copy` or `includes` `combine` is asked of an Experiment,
        when the new name is not a config name of 1 to 512 bytes
        (`import.name.invalid`), and when it is the name of the stored
        topology of the import (`import.name.source`).

        - 500 when the config store cannot be read, for example for the
        Scenario config that an Experiment names.
      operationId: postBuilderGenerate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderGenerateRequest"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderGenerateResult"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "413":
          $ref: "#/components/responses/BuilderTooLarge"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
        "500":
          description: >
            The config store could not be read: the stored source, or the
            Scenario config an imported Experiment names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
  "/builder/legacy":
    post:
      tags:
        - Builder
      summary: Convert a legacy Builder diagram into a Builder document
      description: >
        Converts a diagram of the legacy Builder (the editor that phenix had
        before the Builder) and returns the document. Nothing is written. The
        server reads from the store only the topologies that a topology
        includes. `content` is the text of a file. The file is the mxGraph
        XML of the diagram, whose root element is `mxGraphModel` or `root`.
        Or the file is a Topology config, in YAML or JSON, that has the
        `builder-xml` annotation. The server reads no encoded or compressed
        form of the XML.

        For a diagram alone, the node settings in the diagram are the nodes.
        Its `$NAME` placeholders get values from its own variables and the
        legacy defaults. The source of the document is `manual`, so a draft
        made from it publishes a new topology. For a Topology, its spec is the
        truth for every node, and the diagram only places the nodes, matched
        by hostname. The response has its `source`, with `stored` false.

        Requires `configs` `get` and `configs` `create`, because a Topology
        config is parsed as POST /configs parses one. This includes the
        substitution of `${NAME}` from the environment of the server.
        `content` holds at most 5242880 bytes. Its XML nests at most 32
        elements deep and holds at most 10000 cells. The server refuses a
        DOCTYPE or any other declaration. A refusal repeats nothing of the
        content but the name and kind of a config, or the name of the root
        element of the XML.
      operationId: postBuilderLegacy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderLegacyRequest"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderGenerateResult"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "413":
          $ref: "#/components/responses/BuilderTooLarge"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
  "/builder/export/topology":
    post:
      tags:
        - Builder
      summary: Export a Builder document as the Topology config Publish writes
      description: >
        Projects the document onto the phenix Topology config that a publish
        of it would write, and returns that config as YAML. Nothing is read
        or written. Requires `configs` `get`, as the open of a draft does. The
        server checks the document as a draft save checks it, within the same
        size limits. The config has no `builder-doc` annotation. It names the
        included topologies of the document in `includeTopologies`, and does
        not merge them.

        When the phenix config validation refuses the document, the answer
        is 422, as for a publish. A publish names interfaces without a VLAN
        first, then addresses that interfaces share, then hostnames that
        phenix refuses, before any other reason. An export names interfaces
        without a VLAN only when a `vlan` is missing or null. It names
        hostnames only when one is a single character, which the validation
        also refuses. Otherwise it gives the reason of the validation.
        `publishBlockers` reports what only a publish refuses, such as an
        interface with a blank VLAN, interfaces that share an IP or MAC
        address, or a hostname that phenix refuses only when it creates an
        experiment (`all`, all digits, or `phenix` on a Windows node).
      operationId: postBuilderExportTopology
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTopologyExportRequest"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTopologyExport"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "413":
          $ref: "#/components/responses/BuilderTooLarge"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
  "/builder/package":
    post:
      tags:
        - Builder
      summary: Make a Builder package of a document
      description: >
        Returns the package of the document in the request, with the edits
        not saved yet. The package holds the document, the sections that
        `include` names, and the requirements. The requirements list these
        items, whatever the package carries: the scenarios of the document,
        its included topologies, its templates, its custom icons, the apps of
        the scenarios that could be read, and the files that the devices of
        the document and the packaged configs name (injection sources, app
        asset directories).

        Requires `configs` `get`. The server reads from the config store each
        Scenario config that the document names, and, with `topologies`, each
        included topology. It reads them with the permissions of the caller
        (`configs` `get` on it, and `scenarios` or `topologies` `list`). The
        requirements name a config that does not exist, or that the caller
        may not read, but the package does not carry it. A warning says so,
        in the same words for both cases. The server never reads an include
        that is a file path. The `icons` section gives the document a copy of
        each custom icon that it names, from the icon library. Configs go in
        the package without their times and Builder annotations
        (`builder-*`). The package never holds the content of a file, a
        script or an app. Nothing is written.

        `POST /builder/package/resolve` always accepts the package in the
        answer. The server leaves out of the requirements an entry that the
        package format refuses, and a warning names it. Such an entry is
        blank, longer than 4096 bytes, holds control characters (such as a
        newline in an injection source), or comes after the first 1000
        entries of its list. Each warning is an issue with its code
        (`package.config.unreadable`, `package.include.file-path`,
        `package.icon.missing`, `package.icons.too-many`,
        `package.requirement.left-out`, `package.requirements.truncated`).
        Anything else that would refuse the package, such as a stored config
        without a spec, gets 422 with the code `package.invalid` and the
        issues. A package larger than 5242880 bytes gets 413 with the code
        `package.too-large`.
      operationId: postBuilderPackage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderPackageRequest"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderPackageResult"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "413":
          $ref: "#/components/responses/BuilderTooLarge"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
  "/builder/package/resolve":
    post:
      tags:
        - Builder
      summary: Check what a Builder package's diagram needs on this server
      description: >
        Reports, for each entry of the requirements of the package, whether
        this server has it. Requires `configs` `get`. The package is the
        request body, at most 5242880 bytes. A larger body gets 413 with the
        code `package.too-large`. The server decodes the package strictly (it
        refuses unknown fields) and checks it as the package schema
        describes. Otherwise the answer is 422 with the code
        `package.invalid`. For a package that does not validate, `issues` has
        each problem. The server also refuses a carried config with a Builder
        annotation (`builder-*`).

        - A Scenario or Topology config is `present` when the server has one
        of that name with the spec of the package, or the package carries no
        spec. It is `different` when its spec is not the same, and `missing`
        when there is none. It is `unknown` when the caller may not read it
        (`configs` `get` on it, and `scenarios` or `topologies` `list`), so
        its existence is not disclosed.

        - A custom icon is compared by its bytes the same way, under
        `configs` `list`.

        - Disk images are looked for among the images that `GET /disks`
        lists the caller (`disks` `list`, then by name). Thus an image that
        the caller may not see is `missing`, as an absent image is. A drive
        matches by the name or full path of the image, else by its file name.
        The `detail` then tells this (`Matched by file name pkg.qc2; this
        server's image is /phenix/images/pkg.qc2.`).

        - Apps need `applications` `list`, also for the name.

        - Without `disks` `list` or `applications` `list`, or when the disk
        images cannot be listed, they are `unknown`.

        - Templates travel in the document, so they are `present`.

        - Files are never checked, so they are `unknown`.

        Nothing is written. The Builder creates a missing config that the
        user selects through `POST /configs`.
      operationId: postBuilderPackageResolve
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: >
                a Builder package, as `GET /schemas/builder/package/v1`
                describes it
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderPackageDependencies"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "413":
          $ref: "#/components/responses/BuilderTooLarge"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
  "/builder/documents":
    get:
      tags:
        - Builder
      summary: List published Builder documents
      description: >
        Requires `configs` `list`. Lists the documents that configs reference
        now in their `builder-doc` annotation, filtered by `configs` `list`
        for the config that each document was published to. A topology whose
        annotation names a Builder file (`path`), and no current stored
        document, is listed with `source` `file` and the path only. The
        listing reads no file, so such a row is listed whether or not the
        file can be used. A row with `source` `store` has `experiment` when
        the publication of the document made an experiment that still exists,
        is built from the topology of the row, and the caller holds
        `experiments` `get` for it.
      operationId: getBuilderDocuments
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderPublishedDocuments"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
  "/builder/documents/{document}":
    get:
      tags:
        - Builder
      summary: Get a published Builder document
      description: >
        Requires `configs` `get` for the config that the document was
        published to. A document that the caller may not read, or that no
        config references any more, gets 404.
      operationId: getBuilderDocument
      parameters:
        - name: document
          in: path
          description: published document ID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderPublishedDocument"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
    delete:
      tags:
        - Builder
      summary: Delete a published Builder topology
      description: >
        Deletes the Topology config that the document is current for, as
        `DELETE /configs/Topology/{name}` does. Then deletes every published
        document of that topology. Drafts and experiments made from it do not
        change. Requires `configs` `delete` for the topology. A document that
        the caller may not get, or that is no longer current, gets 404. A
        document is no longer current when the topology changed to reference
        another document, was published again, or was deleted. A published
        experiment gets 422, because experiments are deleted from the
        Experiments page.
      operationId: deleteBuilderDocument
      parameters:
        - name: document
          in: path
          description: published document ID
          required: true
          schema:
            type: string
      responses:
        "204":
          description: >
            The topology is deleted. A Warning header says that not all of
            its published documents could be removed. They are never listed
            again, and a later server start removes them.
          headers:
            Warning:
              $ref: "#/components/headers/BuilderWarning"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderNotFound"
        "422":
          $ref: "#/components/responses/BuilderUnprocessable"
  "/builder/topologies/{topology}/document":
    get:
      tags:
        - Builder
      summary: Get the Builder document a topology references
      description: >
        Returns the document that the `builder-doc` annotation of the
        topology names, wherever it is kept. The stored published document
        wins: the document that the `id` or `digest` of the annotation names
        for this topology. Without one, the server reads the Builder file at
        the `path` of the annotation, on every request. The file must:

        - be below the phenix base directory (`--base-dir.phenix`), and
        outside the directory that holds the mounted VM file systems

        - be a regular file of at most 5 MiB

        - be reached through no symbolic link that leaves the base directory
        or has an absolute target

        - hold a valid Builder document as JSON or YAML

        A `digest` beside `path` pins the file. The server refuses a file
        whose document has another digest. Requires `configs` `get` for the
        topology, which says nothing about the file. A caller who may create
        or update any one topology can name any Builder file below the base
        directory in it, and read that file here. These all get the same 404:
        a topology that the caller may not get, a topology that does not
        exist, and a topology that references no document. A file that cannot
        be used gets a fixed sentence that names the path, never anything
        that the file holds.
      operationId: getBuilderTopologyDocument
      parameters:
        - name: topology
          in: path
          description: topology name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >
            The document, with `digest`, `size` and `document`. For a file,
            `topologyDiffers` says whether the stored topology differs from
            what the document publishes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderPublishedDocument"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          description: >
            The topology does not exist, the caller may not get it, or it
            references no Builder document. Or the Builder file that it names
            does not exist on this phenix server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "413":
          description: The Builder file is larger than 5 MiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "422":
          description: >
            The Builder file is outside the directory phenix reads Builder
            files from, cannot be read, is not a regular file, is not a valid
            Builder document, or does not match the digest the topology
            records for it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
  "/builder/icons":
    get:
      tags:
        - Builder
      summary: List the icons of the Builder icon library
      description: >
        Requires `configs` `list`. Returns every icon of the icon library of
        the server, sorted by name, ignoring case. Each icon has its PNG as
        base64, its uploader, its aliases (the earlier names from its renames,
        which still name it), and whether the caller may rename or delete it.
        The response also tells how many icons and PNG bytes each user may
        upload, and how many the caller has. The server sends the image only
        as base64 inside JSON, never as an image. Every response of the icon
        operations also carries
        `Content-Security-Policy: default-src 'none'; frame-ancestors 'none'`.
      operationId: listBuilderIcons
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderIconList"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
    post:
      tags:
        - Builder
      summary: Add an icon to the Builder icon library
      description: >
        Requires `configs` `create`. Adds a PNG under a name that the caller
        selects. The name has 1 to 64 letters, digits, `_`, `@`, `.` and `-`.
        It is not `.` or `..`, and no icon or alias has it, ignoring case.
        Takes a PNG of at most 96 by 96 pixels and 65536 bytes, as base64.
        Only the bytes tell what the image is. The server reads no file name,
        extension or declared type, and refuses all images that are not PNG
        (SVG, JPEG, GIF, WebP).

        The server stores a PNG as it is when all these are true: it holds
        only the chunks `IHDR`, `PLTE`, `tRNS`, `IDAT` and `IEND`, it has a
        `PLTE` or `tRNS` only where its color type uses one, it has nothing
        after its pixels, and it is at most 40960 bytes. The server encodes
        all other PNGs again. This keeps the pixels and removes all else
        (text, metadata, color profiles, more frames, an unused palette, data
        after the pixels). Thus use the `data` that the response returns.

        A name that already names an icon with the same bytes gets 200 with
        that icon. A name of another icon, or an alias of another icon, gets
        409. Each user may upload at most 64 icons and 1 MiB of PNG bytes. The
        library holds at most 2000 icons.
      operationId: createBuilderIcon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderIconUpload"
      responses:
        "200":
          description: the name already names an icon with the same bytes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderIcon"
        "201":
          description: icon added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderIcon"
        "400":
          description: >
            The request is malformed. Its body is not a single JSON value of
            the expected shape (the server refuses unknown fields), or `data`
            is missing or not base64.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "409":
          description: >
            The name, ignoring case, names another icon or is another icon's
            alias. The message names that icon and who uploaded it, for
            example `icon name "plc" is taken by an icon alice uploaded;
            choose another name`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "413":
          description: >
            The request body is larger than 131072 bytes, or the image is
            larger than 65536 bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "422":
          description: >
            The name is not an icon name, or the image is not a PNG or is more
            than 96 pixels wide or high. Or the share of the caller in the
            library, or the library, is full.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/icons/{icon}":
    parameters:
      - name: icon
        in: path
        description: >
          the name of the icon, or one of its aliases, in any case. A path
          that names no icon gets 404, whatever its form.
        required: true
        schema:
          type: string
    get:
      tags:
        - Builder
      summary: Read an icon of the Builder icon library
      description: >
        Requires `configs` `get`. Returns the icon that the path names. `name`
        is the current name of the icon.
      operationId: getBuilderIcon
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderIcon"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderIconNotFound"
    put:
      tags:
        - Builder
      summary: Rename an icon of the Builder icon library
      description: >
        Requires `configs` `update`. The caller must also be the user who
        uploaded the icon, or hold `builder-icons` `update` (otherwise 403).
        Gives the icon that the path names a new name. No other icon, and no
        alias of another icon, may have that name, ignoring case. The old
        name becomes an alias, so diagrams and templates that name it
        continue to show the icon. A change of case renames the icon in
        place. A rename back to one of its aliases takes that name back.
      operationId: renameBuilderIcon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderIconRename"
      responses:
        "200":
          description: the icon as renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderIcon"
        "400":
          description: >
            The request is malformed. Its body is not a single JSON value of
            the expected shape (the server refuses unknown fields).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderIconNotFound"
        "409":
          description: >
            Another icon or its alias has the new name, or the icon changed
            during the rename. Nothing was renamed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "413":
          description: The request body is larger than 4096 bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "422":
          description: The new name is not an icon name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
    delete:
      tags:
        - Builder
      summary: Delete an icon from the Builder icon library
      description: >
        Requires `configs` `delete`. The caller must also be the user who
        uploaded the icon, or hold `builder-icons` `delete` (otherwise 403).
        Deletes the icon that the path names, by its name or an alias, with
        all its aliases. Diagrams and templates that name it show their
        built-in icon. A downloaded document keeps its own copy. With
        `builder-icons` `delete`, the server removes a record of that name
        that it cannot read. When an alias could not be removed, the answer
        is still 204, with a `Warning: 199` header.
      operationId: deleteBuilderIcon
      responses:
        "204":
          description: icon deleted
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderIconNotFound"
        "409":
          description: >
            The icon changed during the delete (for example, it was renamed).
            Nothing was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/templates":
    get:
      tags:
        - Builder
      summary: List the device templates you can use
      description: >
        Requires `configs` `list`. Returns the templates and collections that
        the caller can use. A template names its custom icon, which the icon
        library resolves.

        First comes the library of the caller (`source` `own`), in the order
        that its items were added. Then come, sorted by owner, the items of
        the libraries of other users that are shared with the caller
        (`shared`) or published to every user (`server`). These items are
        read only, and show their current state. A template in a collection
        that is shared with the caller, or published, is also listed. An item
        that the caller sees both ways is `shared`. A share applies only to
        the account that it was made for.

        A user who never changed the library has the five built-in templates
        (`server`, `workstation`, `router`, `firewall`, `external`), at
        version 1 and without times. The first change stores them. A deleted
        built-in template is never added again. When this server cannot read
        a library record of the caller, the response has `damaged` true and
        none of its items. The server then refuses every change of it with
        409. The response leaves out the library of another user that cannot
        be read.

        `preloaded` lists, for every caller, the collections that the server
        read at start from the template files of its template directory
        (`--base-dir.builder-templates`). There is one collection per file,
        with its templates (`source` `preloaded`, no owner, version 1). They
        are read only. A write route that names one gets 409. A copy in the
        library of the caller can be changed.
      operationId: getBuilderTemplates
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplateLibrary"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
  "/builder/templates/candidates":
    get:
      tags:
        - Builder
      summary: List who your Builder templates can be shared with
      description: >
        Requires `configs` `update` and a user account of the caller, as a
        share does (otherwise 403, so not when authentication is off). Lists,
        sorted by username, every account that a share request would accept,
        whatever the `users` permissions of the caller. These are all users
        with an account, other than the caller.
      operationId: getBuilderTemplateShareCandidates
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderShareCandidates"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
  "/builder/templates/{owner}/items":
    parameters:
      - $ref: "#/components/parameters/BuilderTemplateOwner"
    post:
      tags:
        - Builder
      summary: Add device templates to your template library
      description: >
        Requires `configs` `create`. The caller must be `{owner}`. Adds 1 to
        200 templates in one write, each with a new ID. With `collection`, the
        same write also makes a new collection that holds exactly those
        templates. The custom icon of a template (`device.icon`) is an icon
        name. The icon library resolves it, whether or not it holds that icon
        now. The first change of a library also stores the built-in templates
        that it started with.
      operationId: createBuilderTemplates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTemplateCreate"
      responses:
        "201":
          description: templates added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplateCreateResult"
        "400":
          description: >
            The request is malformed. Its body is not a single JSON value of
            the expected shape (the server refuses unknown fields), or it names
            no template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderTemplateNotFound"
        "409":
          $ref: "#/components/responses/BuilderTemplateDamaged"
        "413":
          $ref: "#/components/responses/BuilderTemplateTooLarge"
        "422":
          $ref: "#/components/responses/BuilderTemplateUnprocessable"
        "503":
          $ref: "#/components/responses/BuilderTemplateBusy"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/templates/{owner}/items/{template}":
    parameters:
      - $ref: "#/components/parameters/BuilderTemplateOwner"
      - $ref: "#/components/parameters/BuilderTemplateID"
    put:
      tags:
        - Builder
      summary: Replace a device template of your template library
      description: >
        Requires `configs` `update`. The caller must be `{owner}`. Replaces
        the name, the description and the device of one template. The
        template keeps its ID. Content that is equal to the stored content
        changes nothing and keeps the entity tag. Devices already made from
        the template do not change.
      operationId: putBuilderTemplate
      parameters:
        - $ref: "#/components/parameters/BuilderTemplateIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTemplateContent"
      responses:
        "200":
          description: the template now stored
          headers:
            ETag:
              $ref: "#/components/headers/BuilderTemplateETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplate"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderTemplateNotFound"
        "409":
          $ref: "#/components/responses/BuilderTemplateDamaged"
        "412":
          $ref: "#/components/responses/BuilderTemplatePreconditionFailed"
        "413":
          $ref: "#/components/responses/BuilderTemplateTooLarge"
        "422":
          $ref: "#/components/responses/BuilderTemplateUnprocessable"
        "503":
          $ref: "#/components/responses/BuilderTemplateBusy"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/templates/{owner}/collections":
    parameters:
      - $ref: "#/components/parameters/BuilderTemplateOwner"
    post:
      tags:
        - Builder
      summary: Add a collection to your template library
      description: >
        Requires `configs` `create`. The caller must be `{owner}`. A
        collection is a named group of templates of the same library. A
        template can be in more than one collection. Every ID in
        `templateIds` must name a template of the library, one time.
      operationId: createBuilderTemplateCollection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTemplateCollectionContent"
      responses:
        "201":
          description: collection added
          headers:
            ETag:
              $ref: "#/components/headers/BuilderTemplateETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplateCollection"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderTemplateNotFound"
        "409":
          $ref: "#/components/responses/BuilderTemplateDamaged"
        "413":
          $ref: "#/components/responses/BuilderTemplateTooLarge"
        "422":
          $ref: "#/components/responses/BuilderTemplateUnprocessable"
        "503":
          $ref: "#/components/responses/BuilderTemplateBusy"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/templates/{owner}/collections/{collection}":
    parameters:
      - $ref: "#/components/parameters/BuilderTemplateOwner"
      - $ref: "#/components/parameters/BuilderTemplateCollectionID"
    put:
      tags:
        - Builder
      summary: Replace a collection of your template library
      description: >
        Requires `configs` `update`. The caller must be `{owner}`. Replaces
        the name, the description and the templates of one collection. The
        collection keeps its ID. To add a template to a collection, or to
        remove one from it, send this request with the changed list. Content
        that is equal to the stored content changes nothing and keeps the
        entity tag.
      operationId: putBuilderTemplateCollection
      parameters:
        - $ref: "#/components/parameters/BuilderTemplateIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTemplateCollectionContent"
      responses:
        "200":
          description: the collection now stored
          headers:
            ETag:
              $ref: "#/components/headers/BuilderTemplateETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplateCollection"
        "400":
          $ref: "#/components/responses/BuilderBadRequest"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderTemplateNotFound"
        "409":
          $ref: "#/components/responses/BuilderTemplateDamaged"
        "412":
          $ref: "#/components/responses/BuilderTemplatePreconditionFailed"
        "413":
          $ref: "#/components/responses/BuilderTemplateTooLarge"
        "422":
          $ref: "#/components/responses/BuilderTemplateUnprocessable"
        "503":
          $ref: "#/components/responses/BuilderTemplateBusy"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/templates/{owner}/delete":
    parameters:
      - $ref: "#/components/parameters/BuilderTemplateOwner"
    post:
      tags:
        - Builder
      summary: Delete templates and collections of your template library
      description: >
        Requires `configs` `delete`. The caller must be `{owner}`. Deletes
        the named templates and collections in one write. The server ignores
        an ID that the library does not hold, so a repeat of the request is
        harmless. A deleted template leaves every collection that held it. A
        deleted collection leaves its templates. A built-in template is
        deleted as any other template. It stays deleted until you restore it
        (see `POST /builder/templates/{owner}/restore`). Diagrams do not
        change, because a device made from a template keeps no link to it.
      operationId: deleteBuilderTemplates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTemplateSelection"
      responses:
        "200":
          description: how many templates and collections were deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplateDeleteResult"
        "400":
          description: >
            The request is malformed. Its body is not a single JSON value of
            the expected shape (the server refuses unknown fields), or it names
            no template and no collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderTemplateNotFound"
        "409":
          $ref: "#/components/responses/BuilderTemplateDamaged"
        "413":
          description: The request body is larger than 64 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "503":
          $ref: "#/components/responses/BuilderTemplateBusy"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/templates/{owner}/restore":
    parameters:
      - $ref: "#/components/parameters/BuilderTemplateOwner"
    post:
      tags:
        - Builder
      summary: Restore deleted built-in templates to your template library
      description: >
        Requires `configs` `create`. The caller must be `{owner}`. Adds back
        the built-in templates (`server`, `workstation`, `router`, `firewall`,
        `external`) that the library does not hold, in one write. Each one
        gets its original ID and content at version 1, and goes last. It is
        in no collection, and it is not shared or published. With
        `templates`, the server restores only the built-in templates that it
        names. Without `templates`, or with an empty list, the server restores
        every missing built-in template. The server ignores an ID that is not
        a built-in ID. It also ignores a built-in template that the library
        holds, also when that template was changed. Thus a repeat of the
        request is harmless.
      operationId: restoreBuilderTemplates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTemplateRestore"
      responses:
        "200":
          description: the built-in templates that were restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplateRestoreResult"
        "400":
          description: >
            The request is malformed. Its body is not a single JSON value of
            the expected shape (the server refuses unknown fields).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderTemplateNotFound"
        "409":
          $ref: "#/components/responses/BuilderTemplateDamaged"
        "413":
          $ref: "#/components/responses/BuilderTemplateTooLarge"
        "503":
          $ref: "#/components/responses/BuilderTemplateBusy"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/templates/{owner}/share":
    parameters:
      - $ref: "#/components/parameters/BuilderTemplateOwner"
    post:
      tags:
        - Builder
      summary: Share templates and collections of your template library
      description: >
        Requires `configs` `update` and a user account of the caller (403
        without it, so not when authentication is off). The caller must be
        `{owner}`. Adds the users in `add` to the shares of each named
        template and collection, and removes the users in `remove`. A
        recipient sees the item read only, in its current state, and can copy
        it into its own library. A share of a collection also shares its
        templates.

        The request is a change of each list, not a new list. To add a user
        that already has a share of an item, or to remove a user that does
        not, changes nothing. Thus no entity tag is necessary. Every added
        user must have an account, and the share is bound to that account.
        The share grants nothing after that account is deleted, or replaced
        by a new account with the same name, until the user is added again.

        When the server refuses a user in `add`, nothing changes (422). An
        item that would be shared with more than 25 users keeps its list. The
        server ignores an ID that the library does not hold. `failed` names
        both of these, and the other items change. The server writes the
        changes to the security log.
      operationId: shareBuilderTemplates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTemplateShareUpdate"
      responses:
        "200":
          description: the items that were not changed, if any
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplateResult"
        "400":
          description: >
            The request is malformed. Its body is not a single JSON value of
            the expected shape (the server refuses unknown fields). Or it names
            no template or collection, or no user to add or remove.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          $ref: "#/components/responses/BuilderTemplateNotFound"
        "409":
          $ref: "#/components/responses/BuilderTemplateDamaged"
        "413":
          description: The request body is larger than 64 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "422":
          description: >
            The server refused a user in `add` or `remove`. The reason is
            `owner` (the caller), `invalid-user`, `unknown-user` (no such
            account), `duplicate` (both added and removed), or `too-many` (more
            than 25 users added). Nothing changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderShareErrors"
        "503":
          $ref: "#/components/responses/BuilderTemplateBusy"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  "/builder/templates/{owner}/publish":
    parameters:
      - name: owner
        in: path
        description: >
          the user whose template library holds the items: the caller, or,
          to take items back from every user, any user
        required: true
        schema:
          type: string
    post:
      tags:
        - Builder
      summary: Publish templates and collections to every user, or take them back
      description: >
        Requires `configs` `update`. With `serverWide` true, publishes the
        named templates and collections of the library of the caller to every
        user, read only. This also requires `builder-templates` `publish`
        (403 without it). For the library of another user, the answer is 404.
        A publish of a collection also publishes its templates. A publish of
        an item that is already published keeps who published it and when.

        With `serverWide` false, takes the items back. The owner may do this.
        Any caller with `builder-templates` `publish` may do this for the
        library of any user (403 for all other callers).

        `failed` names an ID that the library does not hold, and the other
        items change. A publish does not need a user account. The server
        writes the changes to the security log.
      operationId: publishBuilderTemplates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderTemplatePublishUpdate"
      responses:
        "200":
          description: the items that were not changed, if any
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderTemplateResult"
        "400":
          description: >
            The request is malformed. Its body is not a single JSON value of
            the expected shape (the server refuses unknown fields). Or it has
            no `serverWide`, or it names no template or collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "403":
          $ref: "#/components/responses/BuilderForbidden"
        "404":
          description: >
            `serverWide` is true and `{owner}` is not the caller. Only its owner
            publishes an item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "409":
          $ref: "#/components/responses/BuilderTemplateDamaged"
        "413":
          description: The request body is larger than 64 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebError"
        "503":
          $ref: "#/components/responses/BuilderTemplateBusy"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
  - url: http://localhost:3000/api/v1
components:
  schemas:
    Configs:
      type: object
      properties:
        configs:
          type: array
          items:
            $ref: "#/components/schemas/Config"
    Config:
      type: object
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          type: object
          properties:
            name:
              type: string
            annotations:
              description: >
                Text values by key. `builder-doc` is the one annotation that
                is a map: the Builder document a topology references.
              type: object
              properties:
                builder-doc:
                  $ref: "#/components/schemas/BuilderDocumentReference"
              additionalProperties:
                type: string
          required:
            - name
        spec:
          type: object
          additionalProperties: true
      required:
        - apiVersion
        - kind
        - metadata
        - spec
    BuilderDocumentReference:
      description: >
        The Builder document that a topology references, in its `builder-doc`
        annotation. It holds at least one sub-key. Publish writes `digest` and
        `id`, and keeps a `path` that the topology already has. The server
        refuses a config whose reference is not valid. A renamed or copied
        topology can have an `id` that is not the one that its `digest` gives
        for the name of the topology. When a topology is created or updated
        with such an `id`, the server removes the `id`. It also removes the
        `digest`, unless `path` is set.
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        digest:
          description: >
            digest of the document's canonical JSON, `sha256:` and 64
            lowercase hex digits. It names the stored published document of
            this topology with that content, and pins the content of the
            file `path` names.
          type: string
        id:
          description: >
            ID of a stored published document (see `/builder/documents`).
            It names a document only when that document was published to
            this topology.
          type: string
        path:
          description: >
            absolute, clean path of a Builder document file on the phenix
            server, at most 1024 bytes, ending in `.json`, `.yaml` or `.yml`.
          type: string
    Experiments:
      type: object
      properties:
        experiments:
          type: array
          items:
            $ref: "#/components/schemas/Experiment"
    Experiment:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        topology:
          type: string
        apps:
          type: array
          items:
            type: string
        start_time:
          type: string
          format: date-time
        running:
          type: boolean
        vm_count:
          type: integer
        vlan_min:
          type: integer
        vlan_max:
          type: integer
        vlan_count:
          type: integer
        vlans:
          type: array
          items:
            type: object
            properties:
              vlan:
                type: integer
              alias:
                type: string
        vms:
          $ref: "#/components/schemas/VMs"
    VMs:
      type: object
      properties:
        vms:
          type: array
          items:
            $ref: "#/components/schemas/VM"
    VM:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        experiment:
          type: string
        host:
          type: string
        ipv4:
          type: array
          items:
            type: string
        cpus:
          type: integer
        ram:
          type: integer
        disk:
          type: string
        dnb:
          type: boolean
        networks:
          type: array
          items:
            type: string
        taps:
          type: array
          items:
            type: string
        captures:
          type: array
          items:
            $ref: "#/components/schemas/Capture"
        running:
          type: boolean
        uptime:
          type: number
          format: float
        screenshot:
          type: string
          format: base64
    Schedule:
      type: object
      properties:
        schedule:
          type: array
          items:
            type: object
            properties:
              vm:
                type: string
              host:
                type: string
              auto_assigned:
                type: boolean
    Captures:
      type: object
      properties:
        captures:
          type: array
          items:
            $ref: "#/components/schemas/Capture"
    Capture:
      type: object
      properties:
        vm:
          type: string
        interface:
          type: integer
        filepath:
          type: string
    Snapshots:
      type: object
      properties:
        snapshots:
          type: array
          items:
            type: string
    Files:
      type: object
      properties:
        files:
          type: array
          items:
            type: string
    Hosts:
      type: object
      properties:
        hosts:
          type: array
          items:
            $ref: "#/components/schemas/Host"
    Host:
      type: object
      properties:
        name:
          type: string
        cpus:
          type: integer
        load:
          type: string
        memused:
          type: integer
        memtotal:
          type: integer
        bandwidth:
          type: string
        vms:
          type: integer
        uptime:
          type: number
          format: float
        schedulable:
          type: boolean
    Applications:
      type: object
      properties:
        applications:
          type: array
          items:
            type: string
    Topologies:
      type: object
      properties:
        topologies:
          type: array
          items:
            type: string
    Disks:
      type: object
      properties:
        disks:
          type: array
          items:
            type: string
    Users:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
    User:
      type: object
      properties:
        username:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: object
          properties:
            name:
              type: string
            resources:
              type: array
              items:
                type: string
            resource_names:
              type: array
              items:
                type: string
            verbs:
              type: array
              items:
                type: string
    Credentials:
      type: object
      properties:
        username:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
        token:
          type: string
    WebError:
      type: object
      properties:
        message:
          type: string
        cause:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        code:
          description: >
            The stable, machine-readable code of the failure. The error of every
            Builder route has one, such as `document.invalid`,
            `publish.blocked`, `publish.topology.exists`, `request.not-found`
            or `request.stale`. Other routes leave it out. The answers about a
            draft that a client must tell apart have their own codes:
            `draft.stale` and `draft.shares.stale` (412), `draft.conflict` and
            `draft.snapshot.current` (409). A method that a Builder route does
            not take gets 405, `request.method-not-allowed`, and the methods
            that the route takes in `Allow`. A refusal about one of the
            scenarios that a draft lists (`publish.scenario.*`) names that
            scenario in `metadata.scenario`. The docs list every code at
            https://phenix.sceptre.dev/latest/builder/error-codes/.
          type: string
          pattern: "^[a-z]+(\\.[a-z0-9-]+)+$"
          example: publish.blocked
        issues:
          description: >
            Each problem of a Builder error, when the error names them one by
            one. These are the issues of a document that does not validate
            (`document.invalid`), or the interfaces, addresses and hostnames
            that only a publish refuses (`publish.blocked`).
          type: array
          items:
            $ref: "#/components/schemas/BuilderIssue"
    BuilderIssue:
      title: Builder Issue
      description: >
        One problem that the Builder found in a document, a publication or a
        request. It has the code of the rule that it breaks, its severity,
        what it says, and its location, by the parts that are known. The
        validator of the web UI reports the same codes for the same rules. A
        code never changes meaning after it is published. A new rule gets a
        new code.
      type: object
      required:
        - code
        - severity
        - message
      properties:
        code:
          title: Code
          description: >
            The rule the issue breaks, as dotted lowercase words whose first
            names what the rule is about. The docs list every code at
            https://phenix.sceptre.dev/latest/builder/error-codes/.
          type: string
          pattern: "^[a-z]+(\\.[a-z0-9-]+)+$"
          example: node.hostname.duplicate
        severity:
          title: Severity
          description: >
            `error` for an issue that refuses what was asked, `warning` for
            one that does not.
          type: string
          enum: [error, warning]
          example: error
        message:
          title: Message
          description: What the issue says, in words a person is shown.
          type: string
          example: duplicate hostname "web" (also nodes[1])
        path:
          title: Path
          description: >
            Where the issue is in the document, when it is about a part of
            it.
          type: string
          example: nodes[3].device.hostname
        nodeId:
          title: Node ID
          description: The ID of the node the issue is about, when it is about one.
          type: string
          example: 4113dfc0-f4be-57f9-8115-6cecd1f1aea3
        edgeId:
          title: Edge ID
          description: The ID of the connection the issue is about, when it is about one.
          type: string
          example: 7f010dcd-e23d-514c-9206-3609df999026
        networkId:
          title: Network ID
          description: The ID of the network the issue is about, when it is about one.
          type: string
          example: a8af611d-c68f-54e0-94a5-9176cea64e44
        field:
          title: Field
          description: >
            The JSON Forms data path of the device field the issue is about,
            when it is about one.
          type: string
          example: spec.network.interfaces.0.vlan
    BuilderDocument:
      title: Builder Document
      description: >
        A Builder document: the diagram of a topology, with its nodes,
        networks and connections, and how the canvas shows them. Under
        `metadata`, it has what the document says about itself. This
        component lists every property of the document, and gives the
        outline of the nested properties. GET /schemas/builder/v1 serves the
        complete JSON Schema that the server checks every document against.
        Each property in it has a title, a description and examples. A
        document holds no other property. The server refuses a document with
        another property, such as a metadata field at the root. `layout`,
        `iconSize`, `templates` and `icons` are for presentation only. The
        server never writes them to a config.
      type: object
      additionalProperties: false
      required:
        - "$schema"
        - revision
        - metadata
        - nodes
        - networks
        - edges
        - viewport
        - grid
      properties:
        "$schema":
          title: Schema URI
          description: >
            the Builder document schema, which a document must name exactly
          type: string
          enum:
            - https://phenix.sandia.gov/schemas/builder/v1
          example: https://phenix.sandia.gov/schemas/builder/v1
        revision:
          title: Schema Revision
          description: >
            the revision of the Builder document schema the document follows
          type: integer
          enum:
            - 1
          example: 1
        metadata:
          title: Metadata
          description: >
            what the document says of itself: its identifier, name and
            description, who made and last saved it and when, and its notes
          allOf:
            - $ref: "#/components/schemas/BuilderDocumentMetadata"
          example:
            id: 49d876d1-571a-5b5c-91b7-aadf5bb5209c
            name: Pump station
            createdBy: alice
            createdAt: "2026-10-01T15:04:05Z"
            updatedBy: bob
            updatedAt: "2026-10-02T09:30:00Z"
            notes:
              - Snapshot the PLC images before each run.
        nodes:
          title: Nodes
          description: >
            the items on the canvas: devices, switches, notes and groups, and
            the shapes, icons and lines drawn beside them
          type: array
          items:
            title: Node
            description: >
              an item on the canvas. It carries the payload its `kind` names,
              and no other.
            type: object
            required:
              - id
              - kind
              - position
            properties:
              id:
                description: >
                  identifier of the node, unique among the document's nodes
                type: string
              kind:
                description: what the node is, which names its payload
                type: string
                enum:
                  - device
                  - switch
                  - note
                  - group
                  - shape
                  - icon
                  - line
              label:
                description: text shown on the node
                type: string
              position:
                description: >
                  where the node is on the canvas: `x` and `y` in pixels,
                  relative to its parent group when it has one
                type: object
                additionalProperties: true
              size:
                description: >
                  explicit `width` and `height` of the node in pixels. Without
                  them, the editor sets the size of the node
                type: object
                additionalProperties: true
              parentId:
                description: identifier of the group node this node belongs to
                type: string
              device:
                description: >
                  payload of a device node. It has the hostname, the complete
                  phenix node spec (the canvas shows its `general.notes` under
                  the node), the interface handles, the icon, and the
                  `iconSize` of the icon in place of the size of the diagram.
                  It also has the colors, and the `purdueLevel`: the level of
                  the Purdue model that the node is at ("5", "4", "3.5", "3",
                  "2", "1" or "0"). The `purdueLevel` is never published
                type: object
                additionalProperties: true
              switch:
                description: >
                  payload of a switch node. It has the network that it stands
                  for, the colors, the `iconSize` of its icon in place of the
                  size of the diagram, and the `purdueLevel` (as for a
                  device). It also has the `notes`: at most 100 lines of text
                  that the canvas shows under the node. The `purdueLevel` and
                  the `notes` are never published.
                type: object
                additionalProperties: true
              note:
                description: payload of a note node, its text and color
                type: object
                additionalProperties: true
              group:
                description: >
                  payload of a group node: its title, description, color,
                  border style, icon, the `iconSize` of the icon in place of
                  the size of the diagram, and whether the group is collapsed
                type: object
                additionalProperties: true
              shape:
                description: >
                  payload of a shape node: `rectangle` or `circle`, its label,
                  fill and outline colors and border style. Never published
                type: object
                additionalProperties: true
              icon:
                description: >
                  payload of an icon node: exactly one of a built-in `iconKey`
                  and a custom `icon`, and its label. Never published
                type: object
                additionalProperties: true
              line:
                description: >
                  payload of a line node: its 2 to 64 `points` (relative to the
                  position of the node), its label, color and line style, and
                  its `startArrow` and `endArrow`. Never published
                type: object
                additionalProperties: true
          example:
            - id: 4113dfc0-f4be-57f9-8115-6cecd1f1aea3
              kind: device
              label: router
              position:
                x: 0
                y: 0
              device:
                hostname: router
                iconKey: router
                spec:
                  type: Router
                  general:
                    hostname: router
                  hardware:
                    os_type: vyos
                    drives:
                      - image: vyos.qc2
                  network:
                    interfaces:
                      - name: eth0
                        type: ethernet
                        proto: static
                        address: 10.0.0.1
                        mask: 24
                        vlan: EXP
                interfaces:
                  - id: 7f010dcd-e23d-514c-9206-3609df999026
                    name: eth0
                    index: 0
            - id: dee6bc70-8103-581e-8b31-6c95cda798a0
              kind: switch
              label: EXP
              position:
                x: 160
                y: 256
              switch:
                networkId: a8af611d-c68f-54e0-94a5-9176cea64e44
        networks:
          title: Networks
          description: >
            the networks (VLANs) the switches and connections of the document
            belong to
          type: array
          items:
            title: Network
            description: a phenix network (VLAN)
            type: object
            required:
              - id
              - name
            properties:
              id:
                description: identifier of the network
                type: string
              name:
                description: >
                  VLAN name, unique in the document and without white space,
                  which device interfaces name as their `vlan`
                type: string
              alias:
                description: >
                  VLAN number published to an experiment's `vlans.aliases`
                type: integer
                minimum: 1
                maximum: 4094
              description:
                description: free text describing the network
                type: string
              color:
                description: >
                  color of the network's connection lines, as CSS color text
                type: string
              lineStyle:
                description: dash pattern of the network's connection lines
                type: string
          example:
            - id: a8af611d-c68f-54e0-94a5-9176cea64e44
              name: EXP
              alias: 101
              description: Experiment network
        edges:
          title: Connections
          description: >
            the connections, each joining one device interface to one switch,
            and so to its network
          type: array
          items:
            title: Connection
            description: >
              a device interface handle attached to a switch. The server checks
              the nodes, handles and network it names.
            type: object
            required:
              - id
              - sourceNodeId
              - targetNodeId
              - networkId
            properties:
              id:
                description: identifier of the connection
                type: string
              sourceNodeId:
                description: identifier of the node the connection starts at
                type: string
              sourceHandleId:
                description: >
                  interface handle of the source node, when it is a device
                type: string
              targetNodeId:
                description: identifier of the node the connection ends at
                type: string
              targetHandleId:
                description: >
                  interface handle of the target node, when it is a device
                type: string
              networkId:
                description: >
                  identifier of the network of the switch the connection joins
                type: string
              label:
                description: text shown on the connection
                type: string
              color:
                description: >
                  line color drawn in place of the network's, as CSS color text
                type: string
              lineStyle:
                description: dash pattern drawn in place of the network's
                type: string
              route:
                description: >
                  the path that an automatic layout drew, as canvas positions
                  from the source handle to the target handle. Never published
                type: array
                items:
                  type: object
                  additionalProperties: true
          example:
            - id: 503c4f01-e7e0-5a2e-a07d-26e2776fea8f
              sourceNodeId: 4113dfc0-f4be-57f9-8115-6cecd1f1aea3
              sourceHandleId: 7f010dcd-e23d-514c-9206-3609df999026
              targetNodeId: dee6bc70-8103-581e-8b31-6c95cda798a0
              networkId: a8af611d-c68f-54e0-94a5-9176cea64e44
        viewport:
          title: Viewport
          description: >
            the pan (`x`, `y`, in screen pixels) and `zoom` of the canvas when
            the document was saved
          type: object
          additionalProperties: true
          example:
            x: 0
            y: 0
            zoom: 1
        grid:
          title: Grid
          description: >
            the grid the canvas draws and snaps nodes to: whether it is shown,
            its `size` in pixels, and whether moved nodes snap to it
          type: object
          additionalProperties: true
          example:
            enabled: true
            size: 16
            snap: true
        scenarios:
          title: Scenarios
          description: >
            the names of the Scenario configs on the server that the diagram
            is used with. At most 20. Each is a config name of at most 256
            bytes, and no name occurs twice, ignoring case. The document holds
            no scenario content. A publish adds the topology to the `topology`
            annotation of each scenario. An experiment published with the
            topology uses the scenario that the publish request names.
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 256
            pattern: "^[A-Za-z0-9_@.-]+$"
          example:
            - pump-station-ntp
            - pump-station-attack
        source:
          title: Source
          description: >
            the config the document was generated from, when it was, and the
            warnings raised while generating it
          type: object
          additionalProperties: true
          example:
            kind: topology
            name: pump-station
            apiVersion: phenix.sandia.gov/v1
            importedAt: "2026-10-01T15:04:05Z"
            digest: sha256:1f7f8940e18192505e3ec1f993db7204b6baa8d6c1d9156917a82c663656a1b4
            updatedAt: "2026-09-30T08:00:00Z"
        layout:
          title: Layout
          description: >
            the automatic layout that last set the positions of the document.
            The editor names it in its layout menu. An empty value, or an id
            that the editor does not know, means that no layout set the
            positions
          type: string
          example: elk
        iconSize:
          title: Icon Size
          description: >
            the size of the icons of devices, switches and groups on the
            canvas, unless a node names its own size: small (16 pixels), medium
            (24) or large (32). Empty is small
          type: string
          enum:
            - ""
            - small
            - medium
            - large
          example: large
        templates:
          title: Templates
          description: >
            the device templates saved with the diagram, at most 50, which the
            editor offers beside its own
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: true
          example:
            - id: 0d5f8f4e-6a57-4b53-9d0a-5c0f4e3b2a11
              name: Edge router
              description: VyOS router with one static interface
              device:
                iconKey: router
                spec:
                  type: Router
                  general:
                    hostname: router
        icons:
          title: Custom Icons
          description: >
            copies of the custom icons that the nodes and templates name, at
            most 50. Each is its base64 PNG data under its icon name. A draft
            on a server carries none (names resolve through the icon library).
            A downloaded document carries every icon that it uses.
          type: object
          maxProperties: 50
          additionalProperties:
            type: object
            additionalProperties: true
          example:
            plc:
              data: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==
    BuilderDocumentMetadata:
      title: Builder Document Metadata
      description: >
        What a Builder document says of itself: its identifier, name and
        description, who made it and who saved it last and when, and its
        notes. It is part of the document's content and digest, and none of
        it is written to a config. The server sets `createdBy`, `createdAt`,
        `updatedBy` and `updatedAt` when it stores a draft snapshot (see POST
        /builder/drafts and POST /builder/drafts/{owner}/{draft}/snapshots).
        Each is optional: a document that was never saved as a draft, such
        as a Builder file written by hand, may have none. GET
        /schemas/builder/v1 serves its complete JSON Schema.
      type: object
      additionalProperties: false
      required:
        - id
      properties:
        id:
          title: Document ID
          description: identifier of the document
          type: string
          example: 49d876d1-571a-5b5c-91b7-aadf5bb5209c
        name:
          title: Name
          description: >
            name of the diagram, which a draft takes as its title: at most 512
            bytes, without control characters
          type: string
          example: Pump station
        description:
          title: Description
          description: free text describing the diagram
          type: string
          example: Water treatment pump station with two PLCs and an HMI.
        createdBy:
          title: Created By
          description: >
            user who first made the document. The server keeps this value
            from the document of the draft create, or else uses the user who
            created the draft. Every later save writes the same value.
          type: string
          maxLength: 256
          example: alice
        createdAt:
          title: Created At
          description: >
            when the document was first made, in UTC to the second
            (`YYYY-MM-DDTHH:MM:SSZ`). Set and kept as `createdBy` is.
          type: string
          format: date-time
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
          example: "2026-10-01T15:04:05Z"
        updatedBy:
          title: Updated By
          description: >
            user whose save stored this content. The server sets it on every
            save, and replaces a value that the client sends.
          type: string
          maxLength: 256
          example: bob
        updatedAt:
          title: Updated At
          description: >
            the time of that save, in the form of `createdAt`. The server sets
            it on every save, and replaces a value that the client sends. It is
            not `source.updatedAt`, which is a time of the config that the
            document was imported from.
          type: string
          format: date-time
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
          example: "2026-10-02T09:30:00Z"
        notes:
          title: Notes
          description: >
            free text notes about the full diagram, in the order that the
            editor lists them. At most 100 notes. Each note is not only white
            space, and has at most 4096 bytes in UTF-8 (maxLength counts
            characters, so the byte limit is stricter outside ASCII). Notes
            have no control characters except newline and tab
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 4096
          example:
            - Snapshot the PLC images before each run.
            - "VLAN EXP carries the control traffic.\nKeep it isolated."
    BuilderDocumentStamp:
      description: >
        The `createdBy`, `createdAt`, `updatedBy` and `updatedAt` of the
        `metadata` of the document that a request stored. The stamp leaves
        out a field that the stored document does not have. Thus a draft
        opened unchanged from a document that names nobody has an empty
        stamp.
      type: object
      properties:
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time
    BuilderDraftCreate:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
        summary:
          description: summary of the first snapshot
          type: string
        sourceToken:
          description: >
            where the draft comes from. One of:

            - `<kind>/<name>`: the config that the draft was imported from.

            - `uploaded/<kind>/<name>`: an uploaded config. Or
            `uploaded/legacy-xml`: an uploaded legacy Builder diagram that
            came without a Topology. These two name no stored config, so they
            do not let the draft update a stored Topology or Experiment.

            - `builder-doc/<document id>`: the published document that the
            draft was opened from. The caller must be able to read it (404
            otherwise).

            - `builder-file/<topology name>/<digest>`: the Builder file of a
            topology that the draft was opened from, with the `digest` that
            GET /builder/topologies/{topology}/document returned. The caller
            must be able to read the file, and the file must still have that
            digest (409 otherwise)
          type: string
        sourceFile:
          description: >
            the name of the uploaded file that the document came from, kept
            only for display. It is a file name of at most 255 bytes without
            `/` or `\`, not `.` or `..`, with no control characters (422
            otherwise). The server never opens anything by it.
          type: string
          maxLength: 255
        forkOf:
          description: >
            a draft that the new draft forks, as `<owner>/<draft id>`. The
            caller must be able to read it (404 otherwise). The new draft takes
            its source token in place of `sourceToken`. It records the last
            publication of that draft as `forked`, so a publish of the new
            draft can update what that draft published or was opened from. It
            records no source file: not the file of that draft, and not a
            `sourceFile` sent with it.
          type: string
        owner:
          description: optional. When set, it must be the caller
          type: string
        document:
          $ref: "#/components/schemas/BuilderDocument"
      required:
        - document
    BuilderSnapshotCreate:
      type: object
      additionalProperties: false
      properties:
        summary:
          type: string
        document:
          $ref: "#/components/schemas/BuilderDocument"
        opId:
          description: >
            the client's id for this save, kept with the snapshot, so a
            client that never saw the response can tell it was stored
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
      required:
        - document
    BuilderCursorMove:
      description: exactly one of `index` and `snapshotId`
      type: object
      additionalProperties: false
      properties:
        index:
          description: index of the snapshot to move to, oldest first
          type: integer
          minimum: 0
        snapshotId:
          type: string
    BuilderDraft:
      type: object
      properties:
        id:
          type: string
        owner:
          type: string
        title:
          type: string
        sourceToken:
          type: string
        sourceFile:
          description: >
            the name of the uploaded file the draft was made from, when it
            was created with one
          type: string
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
        lastModifiedBy:
          type: string
        cursor:
          description: index of the current snapshot
          type: integer
        snapshots:
          description: number of snapshots the draft keeps
          type: integer
        snapshotId:
          description: ID of the current snapshot
          type: string
        digest:
          description: digest of the current snapshot's document
          type: string
        size:
          description: size in bytes of the current snapshot's document
          type: integer
        historyBytes:
          description: total size in bytes of the snapshots the draft keeps
          type: integer
        dirty:
          description: whether the current snapshot differs from the last publication
          type: boolean
        canUndo:
          type: boolean
        canRedo:
          type: boolean
        readOnly:
          description: >
            whether the caller may not update the draft. This is true when its
            access does not allow it, or when its role cannot update configs.
            Thus `access` `edit` with `readOnly` means an edit share that the
            role of the caller cannot use
          type: boolean
        etag:
          description: the value of the ETag header for this revision
          type: string
        document:
          $ref: "#/components/schemas/BuilderDocument"
        stamp:
          description: >
            what the stored document holds in `metadata.createdBy`,
            `createdAt`, `updatedBy` and `updatedAt` (creating a draft and saving one
            only, whose responses have no document). An editor copies it
            into its own copy of the document.
          allOf:
            - $ref: "#/components/schemas/BuilderDocumentStamp"
        history:
          description: the snapshots, oldest first (GET of one draft only)
          type: array
          items:
            $ref: "#/components/schemas/BuilderSnapshot"
        publication:
          $ref: "#/components/schemas/BuilderPublication"
        forked:
          description: >
            for a draft created with `forkOf`, what that draft had last
            published when it was forked, which this draft may update too
          type: object
          properties:
            documentId:
              type: string
            topologyTarget:
              type: string
            experimentTarget:
              type: string
        access:
          description: >
            what the caller may do with the draft (listing, GET of one draft,
            and the `draft` of a PUT of its shares only)
          type: string
          enum:
            - owner
            - edit
            - view
        via:
          description: >
            where the caller's access to another user's draft comes from: a
            share naming the caller, or its role (listing and GET of one draft
            only). A caller with both is reported as `share`.
          type: string
          enum:
            - share
            - role
        canShare:
          description: >
            present and true when the caller owns the draft, may update
            configs, and has a user account. The caller may then change who the
            draft is shared with. Only the listing, GET of one draft, and the
            `draft` of a PUT of its shares report it
          type: boolean
        shares:
          description: >
            who the draft is shared with, sorted by user, for its owner only,
            and only when it is shared with anyone. The list includes entries
            whose account is gone. GET of the shares of the draft marks them.
          type: array
          items:
            type: object
            properties:
              user:
                type: string
              access:
                type: string
                enum:
                  - view
                  - edit
        canDelete:
          description: >
            whether the caller may delete the draft: `configs` `delete`, and
            the draft is its own or it holds `builder-drafts` `delete` for it.
            Left out when false. Reported by the listing, GET of one draft,
            and the `draft` of a PUT of its shares.
          type: boolean
        experiment:
          description: >
            name of an experiment that this draft published, or that the
            published diagram that the draft was opened from published. It is
            present while the experiment exists and the caller holds
            `experiments` `get` for it. The server calculates it for each
            response. Thus it follows a renamed experiment, and is left out
            after the experiment is deleted. GET of one draft, POST
            /builder/drafts and the `draft` of a publish answer report it. The
            listing never reports it.
          type: string
    BuilderDrafts:
      type: object
      properties:
        drafts:
          description: the caller's own drafts
          type: array
          items:
            $ref: "#/components/schemas/BuilderDraft"
        shared:
          description: >
            drafts of other users shared with the caller (`via` `share`) or
            the caller's role lets it list (`via` `role`)
          type: array
          items:
            $ref: "#/components/schemas/BuilderDraft"
        damaged:
          description: >
            drafts, the caller's own or of other users the caller may list,
            whose metadata this server can no longer read
          type: array
          items:
            $ref: "#/components/schemas/BuilderDamagedDraft"
    BuilderDamagedDraft:
      description: >
        What can still be read of a draft whose metadata this server can no
        longer read. It cannot be opened, only deleted with its ETag.
      type: object
      properties:
        id:
          type: string
        owner:
          type: string
        title:
          description: present when it can still be read
          type: string
        updated:
          description: present when it can still be read
          type: string
          format: date-time
        etag:
          description: the If-Match value that deletes the draft
          type: string
        canDelete:
          description: whether the caller may delete the draft
          type: boolean
    BuilderSnapshot:
      type: object
      properties:
        id:
          type: string
        digest:
          type: string
        size:
          type: integer
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        summary:
          type: string
        opId:
          description: the client's id for the save that stored the snapshot
          type: string
        current:
          type: boolean
    BuilderSnapshots:
      type: object
      properties:
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/BuilderSnapshot"
        cursor:
          type: integer
    BuilderSnapshotDocument:
      type: object
      properties:
        snapshot:
          $ref: "#/components/schemas/BuilderSnapshot"
        document:
          $ref: "#/components/schemas/BuilderDocument"
    BuilderPublication:
      description: the draft's last publication
      type: object
      properties:
        mode:
          type: string
          enum:
            - topology
            - topology-experiment
        topologyTarget:
          type: string
        topologyAction:
          type: string
        experimentTarget:
          type: string
        scenarioTarget:
          type: string
        snapshotId:
          type: string
        digest:
          type: string
        documentId:
          type: string
        publishedAt:
          type: string
          format: date-time
        publishedBy:
          type: string
    BuilderPublishTarget:
      type: object
      additionalProperties: false
      properties:
        name:
          description: config name
          type: string
        action:
          description: create a new config or update an existing one
          type: string
          enum:
            - create
            - update
      required:
        - name
        - action
    BuilderPublishScenario:
      description: >
        the scenario the experiment of a `topology-experiment` publication is
        created or updated with: one of the scenarios the draft's document
        lists, by name
      type: object
      additionalProperties: false
      properties:
        name:
          description: Scenario config name
          type: string
      required:
        - name
    BuilderPublishRequest:
      description: >
        `topology` mode publishes only the topology. `topology-experiment`
        mode also requires an experiment target. It may name the scenario of
        the experiment, which must be one of the scenarios that the document
        lists. Without one, the experiment has no scenario. In both modes, the
        publish adds the topology to the `topology` annotation of every
        scenario that the document lists.
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
            - topology
            - topology-experiment
        topology:
          $ref: "#/components/schemas/BuilderPublishTarget"
        scenario:
          $ref: "#/components/schemas/BuilderPublishScenario"
        experiment:
          $ref: "#/components/schemas/BuilderPublishTarget"
        dryRun:
          description: >
            make every check of the publication, write nothing, and answer
            with what it would change (`BuilderPublishPreview`). A dry run
            needs no If-Match.
          type: boolean
          default: false
      required:
        - mode
        - topology
    BuilderPublishPreview:
      description: >
        the answer of a dry run of a publication: what it would change, the
        warnings it would give, and the refusal that it would get. Nothing is
        written.
      type: object
      properties:
        status:
          type: string
          enum:
            - preview
        changes:
          description: >
            what a publish would change, compared with what is stored now. Null
            when the publication would be refused
          nullable: true
          allOf:
            - $ref: "#/components/schemas/BuilderPublishChanges"
        warnings:
          description: what the publication would warn of, each with its code
          type: array
          items:
            $ref: "#/components/schemas/BuilderIssue"
        errors:
          description: >
            why the publication would be refused, each an error with its code.
            These are the refusals that a publish answers with 400 (a target
            name), 409 or 422, such as `publish.topology.exists`,
            `publish.scenario.missing`, or the issues of `publish.blocked`.
            Refusals about who may do what (403, and 404 for a draft that the
            caller may not see) keep their status.
          type: array
          items:
            $ref: "#/components/schemas/BuilderIssue"
    BuilderPublishChanges:
      description: >
        what publishing a draft to a target changes, compared with what is
        stored now. Every list is sorted by name.
      type: object
      properties:
        topology:
          $ref: "#/components/schemas/BuilderConfigChange"
        includes:
          description: the topologies the Topology config includes (`spec.includeTopologies`)
          type: array
          items:
            $ref: "#/components/schemas/BuilderIncludeChange"
        scenarios:
          description: >
            the Scenario configs the document lists, each of which gets the
            topology in its `topology` annotation unless it names it already
          type: array
          items:
            $ref: "#/components/schemas/BuilderScenarioAnnotation"
        images:
          description: >
            the disk images the devices of the stored topology use, compared
            with those the published topology's devices use
            (`hardware.drives[].image`)
          type: array
          items:
            $ref: "#/components/schemas/BuilderImageChange"
        experiment:
          description: the Experiment config, for a `topology-experiment` publication only
          allOf:
            - $ref: "#/components/schemas/BuilderConfigChange"
        vlanAliases:
          description: >
            the VLAN aliases of the experiment (`spec.vlans.aliases`), each
            added when the experiment is created. For a `topology-experiment`
            publication only. Left out when there is none
          type: array
          items:
            $ref: "#/components/schemas/BuilderVLANAliasChange"
    BuilderConfigChange:
      type: object
      properties:
        name:
          type: string
        action:
          description: >
            `create`, `update`, or `unchanged` when the config already holds
            this publication, so nothing is written to it
          type: string
          enum:
            - create
            - update
            - unchanged
    BuilderIncludeChange:
      type: object
      properties:
        name:
          description: included topology
          type: string
        change:
          type: string
          enum:
            - added
            - removed
            - kept
    BuilderScenarioAnnotation:
      type: object
      properties:
        name:
          description: Scenario config name
          type: string
        change:
          description: >
            `annotate` adds the topology to the `topology` annotation of the
            scenario. `unchanged` names a scenario that already names it
          type: string
          enum:
            - annotate
            - unchanged
    BuilderImageChange:
      type: object
      properties:
        name:
          description: the image as the drives name it
          type: string
        change:
          type: string
          enum:
            - added
            - removed
            - kept
        devices:
          description: >
            the hostnames of the devices that use the image once published,
            or, for a removed image, of those that used it
          type: array
          items:
            type: string
        onServer:
          description: >
            whether the server has a disk image of that file name, as GET
            /disks lists them. Null when unknown: the caller may not list disks
            or that file name (whether or not the server has it), or the
            listing failed or is empty (as it is without minimega)
          type: boolean
          nullable: true
    BuilderVLANAliasChange:
      type: object
      properties:
        name:
          description: network name
          type: string
        from:
          description: the experiment's alias now, null for none
          type: integer
          nullable: true
        to:
          description: the alias the publication writes, null for none
          type: integer
          nullable: true
        change:
          type: string
          enum:
            - added
            - removed
            - changed
            - kept
    BuilderPublishStage:
      type: object
      properties:
        name:
          description: document, topology, scenario, experiment or draft
          type: string
        status:
          description: created, updated, skipped, ok or failed
          type: string
        message:
          type: string
        config:
          description: >
            the config the stage wrote, as `<Kind>/<name>`. The scenario
            stage, which covers every scenario the document lists, names one
            only when the document lists one, and its message says which it
            changed.
          type: string
    BuilderPublishResult:
      type: object
      properties:
        status:
          type: string
          enum:
            - succeeded
            - partial
        stages:
          type: array
          items:
            $ref: "#/components/schemas/BuilderPublishStage"
        warnings:
          description: >
            what the caller should know of the publication, each with its
            code, such as `publish.file.unchanged` or `publish.legacy.replaced`
          type: array
          items:
            $ref: "#/components/schemas/BuilderIssue"
        errors:
          description: >
            why a stage of a partial publication failed, each with its code:
            `publish.stage.failed`, `publish.experiment.running` or
            `server.storage-full`
          type: array
          items:
            $ref: "#/components/schemas/BuilderIssue"
        topology:
          $ref: "#/components/schemas/BuilderPublishTarget"
        scenario:
          $ref: "#/components/schemas/BuilderPublishScenario"
        experiment:
          $ref: "#/components/schemas/BuilderPublishTarget"
        draft:
          $ref: "#/components/schemas/BuilderDraft"
    BuilderSource:
      type: object
      properties:
        kind:
          type: string
        name:
          type: string
        fullName:
          type: string
        apiVersion:
          type: string
        created:
          type: string
        updated:
          type: string
        digest:
          description: >
            for a Topology or an Experiment, the digest that a document
            imported from it records as its `source.digest`. The digest covers
            the apiVersion, kind, name and spec of the config, and the
            `builder-xml` diagram of a Topology that has one. Left out for a
            Scenario or an Image
          type: string
        stored:
          description: false for a config generated from uploaded content
          type: boolean
        builder:
          description: >
            the builder annotation the config carries, if any: `builder-doc`
            (Builder) or, on a Topology without it, `builder-xml` (legacy
            Builder diagram)
          type: string
        generatable:
          description: whether POST /builder/generate accepts this config
          type: boolean
        includeCount:
          description: >
            the number of topologies a Topology includes
            (`includeTopologies`). Left out when it includes none, for every
            other kind, for a caller without `configs` `get` for the config,
            and in the `source` of a generated document.
          type: integer
          minimum: 1
    BuilderSources:
      type: object
      properties:
        topologies:
          type: array
          items:
            $ref: "#/components/schemas/BuilderSource"
        experiments:
          type: array
          items:
            $ref: "#/components/schemas/BuilderSource"
        scenarios:
          type: array
          items:
            $ref: "#/components/schemas/BuilderSource"
        images:
          type: array
          items:
            $ref: "#/components/schemas/BuilderSource"
    BuilderGenerateRequest:
      description: exactly one of `source` and `content`
      type: object
      additionalProperties: false
      properties:
        source:
          description: a stored Topology or Experiment config, as `<Kind>/<name>`
          type: string
        content:
          description: a Topology or Experiment config as JSON or YAML text
          type: string
        includes:
          description: >
            what happens to the nodes of the topologies that a Topology
            includes. `keep` (the default, also when left out or empty) shows
            them read only. `combine` copies them into the document and makes
            it a new topology. `combine` is not allowed for an Experiment.
          type: string
          enum:
            - keep
            - combine
        copy:
          description: >
            make the document a copy that is not linked to the Topology that
            it is generated from. `includes` `combine` implies it. The copy gets
            the diagram note `Copied from <name>` in `metadata.notes`, where
            `<name>` is the name in the metadata of the source config. Not
            allowed for an Experiment.
          type: boolean
          default: false
        name:
          description: >
            the name of the new topology, and of the document. Only allowed
            with `copy` or `includes` `combine`. When empty, the source's
            name with `-combined` (for `combine`) or `-copy` added. It must
            not be the name of the stored Topology being imported.
          type: string
          maxLength: 512
          pattern: "^[A-Za-z0-9_@.-]*$"
    BuilderGenerateResult:
      type: object
      properties:
        document:
          $ref: "#/components/schemas/BuilderDocument"
        warnings:
          description: what the document left out or changed
          type: array
          items:
            type: string
        source:
          description: >
            the config the document was made from. Left out by POST
            /builder/legacy for a diagram that came without a Topology.
          allOf:
            - $ref: "#/components/schemas/BuilderSource"
    BuilderLegacyRequest:
      type: object
      additionalProperties: false
      required:
        - content
      properties:
        content:
          description: >
            the text of a legacy Builder diagram file: mxGraph XML, or a
            Topology config as YAML or JSON that has the `builder-xml`
            annotation. At most 5242880 bytes
          type: string
        name:
          description: >
            the name of the document of a diagram that comes without a
            Topology (`legacy-diagram` when left out or blank). At most 512
            bytes, without control characters. Ignored for a Topology, which
            uses its own name.
          type: string
    BuilderTopologyExportRequest:
      type: object
      additionalProperties: false
      properties:
        document:
          $ref: "#/components/schemas/BuilderDocument"
        name:
          description: >
            the name of the topology. When empty, the server uses the document
            name, with `-` in place of each run of characters that a config
            name may not hold (as the Publish dialog proposes it). If that
            leaves no characters, the name is `topology`
          type: string
      required:
        - document
    BuilderTopologyExport:
      type: object
      properties:
        name:
          description: the topology's name
          type: string
        yaml:
          description: >
            the Topology config, as YAML that loads back as the config. A
            string that the YAML block style would change, such as one that
            starts with a line break, is double quoted
          type: string
        warnings:
          description: what the projection left out or changed, each with its code
          type: array
          items:
            $ref: "#/components/schemas/BuilderIssue"
        publishBlockers:
          description: >
            why a publish of the topology would be refused, although the
            phenix config validation accepts it. There is one issue per check,
            in the order that a publish makes them: interfaces without a VLAN,
            then addresses that interfaces share, then hostnames that phenix
            refuses when it creates an experiment. The 422 message of a publish
            names the first. Each issue says what that message says about its
            check, and has the code of the first problem of the check. When the
            check has one problem, the issue also has its location.
          type: array
          items:
            $ref: "#/components/schemas/BuilderIssue"
    BuilderPackageRequest:
      type: object
      additionalProperties: false
      properties:
        document:
          $ref: "#/components/schemas/BuilderDocument"
        include:
          description: >
            the sections that the package carries, each at most once:
            `scenarios` (the Scenario configs that the document names),
            `topologies` (the topologies that it includes), `icons` (a copy of
            each custom icon that it names) and `images` (the disk images that
            the devices use, listed in the requirements with the hosts that use
            each image)
          type: array
          items:
            type: string
            enum:
              - scenarios
              - topologies
              - icons
              - images
      required:
        - document
    BuilderPackageResult:
      type: object
      properties:
        package:
          description: >
            the package, as `GET /schemas/builder/package/v1` describes it,
            ready to be saved as a JSON or YAML file
          type: object
          additionalProperties: true
        warnings:
          description: >
            what the package names but does not carry, or leaves out of its
            requirements, and why, each with its code
          type: array
          items:
            $ref: "#/components/schemas/BuilderIssue"
    BuilderPackageDependencies:
      type: object
      properties:
        dependencies:
          description: >
            one entry per entry of the package's requirements, by kind in the
            order scenario, topology, template, icon, image, app, file
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                  - scenario
                  - topology
                  - template
                  - icon
                  - image
                  - app
                  - file
              name:
                description: the name or path, as the requirements give it
                type: string
              status:
                type: string
                enum:
                  - present
                  - missing
                  - different
                  - unknown
              packaged:
                description: whether the package carries it
                type: boolean
              detail:
                description: >
                  why the status is what it is, such as the devices that use
                  a disk image, when that needs saying
                type: string
    BuilderPreflightCheckName:
      description: a preflight check
      type: string
      enum:
        - capacity
        - network
        - disks
        - apps
    BuilderPreflightRequest:
      type: object
      additionalProperties: false
      properties:
        checks:
          description: the checks to make, in the order of the report. Each at most once
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/BuilderPreflightCheckName"
          example:
            - disks
            - apps
        experiment:
          description: >
            the experiment whose VLAN range and default bridge the network
            check uses. Empty or left out for none
          type: string
          example: lab-exp
      required:
        - checks
    BuilderPreflightResult:
      type: object
      properties:
        name:
          $ref: "#/components/schemas/BuilderPreflightCheckName"
        status:
          description: >
            `failed` when an issue is an error. `unavailable` when nothing
            failed, but the check, or a part of it, could not be made.
            Otherwise `passed`, with any warnings among the issues
          type: string
          enum:
            - passed
            - failed
            - unavailable
        summary:
          description: what the check compared, in one line, and what it could not check
          type: string
          example: "Found: 3 of 3 drive images, among the server's 12 disk images."
        issues:
          description: >
            what the check found, each with its `preflight.` code and, when it
            is about one, the device, network and field
          type: array
          items:
            $ref: "#/components/schemas/BuilderIssue"
    BuilderPreflightReport:
      type: object
      properties:
        checks:
          description: the result of each check asked for, in the request's order
          type: array
          items:
            $ref: "#/components/schemas/BuilderPreflightResult"
        passed:
          description: the checks that passed, in the request's order
          type: array
          items:
            $ref: "#/components/schemas/BuilderPreflightCheckName"
        failed:
          description: the checks that failed, in the request's order
          type: array
          items:
            $ref: "#/components/schemas/BuilderPreflightCheckName"
        unavailable:
          description: the checks that could not be made, in the request's order
          type: array
          items:
            $ref: "#/components/schemas/BuilderPreflightCheckName"
    BuilderPublishedDocument:
      description: >
        The Builder document a config references: a stored published
        document (`source` `store`), which Publish stored, or the Builder
        file a topology's `builder-doc` annotation names (`source` `file`). A file
        has no `id`,
        `draftId`, `snapshotId`, `createdAt` or `createdBy`. In a listing a
        file also has no `digest` and no `size`, since a listing reads no
        file.
      type: object
      properties:
        source:
          description: where the document is kept
          type: string
          enum:
            - store
            - file
        id:
          description: stored documents only
          type: string
        digest:
          description: digest of the document's canonical JSON, not of a file's bytes
          type: string
        size:
          description: size of the document's canonical JSON, in bytes
          type: integer
        target:
          description: name of the config that references the document
          type: string
        kind:
          type: string
        config:
          description: the config that references the document, as `<Kind>/<name>`
          type: string
        path:
          description: files only. The path of the Builder file on the phenix server
          type: string
        draftId:
          description: >
            stored documents only. The draft that first published the
            document.
          type: string
        snapshotId:
          description: >
            stored documents only. The snapshot of that draft. Absent with
            `draftId`.
          type: string
        createdAt:
          description: stored documents only. The time of the first publish of the document
          type: string
          format: date-time
        createdBy:
          description: >
            stored documents only. The user who first published the document.
          type: string
        topologyDiffers:
          description: >
            files only, in GET /builder/topologies/{topology}/document. True
            when the stored topology is not what the document publishes. Then
            a draft opened from the file cannot update the topology
          type: boolean
        experiment:
          description: >
            name of an experiment the publication behind this document made,
            when it still exists and the caller holds `experiments` `get` for
            it. Only on rows of GET /builder/documents with `source` `store`.
          type: string
        document:
          $ref: "#/components/schemas/BuilderDocument"
      required:
        - source
        - target
        - kind
        - config
    BuilderPublishedDocuments:
      type: object
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/BuilderPublishedDocument"
    BuilderShares:
      type: object
      properties:
        shares:
          description: who the draft is shared with, sorted by user
          type: array
          items:
            type: object
            properties:
              user:
                type: string
              access:
                type: string
                enum:
                  - view
                  - edit
              grantedAt:
                type: string
                format: date-time
              stale:
                description: >
                  the account the draft was shared with was deleted, or
                  replaced by a new one under the same name, so this share
                  grants nothing
                type: boolean
        sharesEtag:
          description: the list's entity tag, the value of the ETag header
          type: string
        maxShares:
          description: the most users a draft may be shared with
          type: integer
        draft:
          description: >
            PUT only: the draft without its document and history, with its
            new `etag`
          allOf:
            - $ref: "#/components/schemas/BuilderDraft"
    BuilderShareUpdate:
      description: the complete new list
      type: object
      additionalProperties: false
      properties:
        shares:
          type: array
          maxItems: 25
          items:
            type: object
            additionalProperties: false
            properties:
              user:
                type: string
              access:
                type: string
                enum:
                  - view
                  - edit
            required:
              - user
              - access
      required:
        - shares
    BuilderShareCandidates:
      type: object
      properties:
        users:
          description: who the draft or the templates can be shared with, sorted by username
          type: array
          items:
            type: object
            properties:
              username:
                type: string
              name:
                description: the user's first and last name, or empty when unknown
                type: string
    BuilderShareErrors:
      description: a WebError with every refused entry
      type: object
      properties:
        message:
          type: string
        cause:
          type: string
        code:
          description: always `share.users.refused`
          type: string
          example: share.users.refused
        errors:
          type: array
          items:
            type: object
            properties:
              user:
                description: the entry's user, empty for `too-many`
                type: string
              reason:
                description: >
                  `owner` (the list has the owner), `duplicate` (the list has
                  a user twice), `invalid-access` (not `view` or `edit`),
                  `invalid-user` (empty, over 256 bytes, control characters or
                  `/`), `too-many` (over 25 users), `unknown-user` (no such
                  account), or `account-removed` (the account of the share is
                  gone. Remove the user, save, and add the user again)
                type: string
                enum:
                  - owner
                  - duplicate
                  - invalid-access
                  - invalid-user
                  - too-many
                  - unknown-user
                  - account-removed
    BuilderIconUpload:
      type: object
      additionalProperties: false
      required:
        - name
        - data
      properties:
        name:
          description: >
            the icon's name: 1 to 64 letters, digits, `_`, `@`, `.` and `-`,
            not `.` or `..`, which no icon and no alias has, ignoring case.
            Nodes and templates name the icon by it.
          type: string
          pattern: "^[A-Za-z0-9_@.-]{1,64}$"
        data:
          description: >
            a PNG of at most 96 by 96 pixels and 65536 bytes, in standard
            base64 with padding and without line breaks
          type: string
    BuilderIconRename:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          description: >
            the new name of the icon, by the rules for the name of a new icon.
            The old name becomes an alias
          type: string
          pattern: "^[A-Za-z0-9_@.-]{1,64}$"
    BuilderIcon:
      type: object
      properties:
        name:
          description: >
            the icon's name now. It is the key of the icon in a Builder
            document's `icons`, and what a node's or template's `icon` names.
          type: string
        id:
          description: >
            `sha256:` and the SHA-256 of the stored PNG, as 64 lowercase hex
            digits: two icons hold the same image exactly when their IDs are
            equal.
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        owner:
          description: >
            the user who uploaded the icon. Empty for an icon that phenix
            added from a template file of its template directory, which no
            user owns. Only holders of `builder-icons` can rename or delete
            such an icon
          type: string
        width:
          description: width in pixels, 1 to 96
          type: integer
        height:
          description: height in pixels, 1 to 96
          type: integer
        bytes:
          description: length of the stored PNG, at most 40960
          type: integer
        created:
          description: when the icon was uploaded
          type: string
          format: date-time
        updated:
          description: when the icon was last renamed, or uploaded
          type: string
          format: date-time
        aliases:
          description: >
            the names the icon had before its renames, oldest first, each of
            which still names it
          type: array
          items:
            type: string
        data:
          description: >
            the stored PNG in standard base64 with padding, which may differ
            from what was sent
          type: string
        canRename:
          description: >
            whether the caller may rename the icon: `configs` `update`, and
            being its uploader or holding `builder-icons` `update`
          type: boolean
        canDelete:
          description: >
            whether the caller may delete the icon: `configs` `delete`, and
            being its uploader or holding `builder-icons` `delete`
          type: boolean
    BuilderIconList:
      type: object
      properties:
        icons:
          description: every icon of the library, sorted by name without regard to case
          type: array
          items:
            $ref: "#/components/schemas/BuilderIcon"
        maxIcons:
          description: the most icons each user may upload
          type: integer
        maxBytes:
          description: the most PNG bytes the icons each user uploads may have together
          type: integer
        usedBytes:
          description: the PNG bytes of the icons the caller uploaded, together
          type: integer
        usedIcons:
          description: how many icons the caller uploaded
          type: integer
    BuilderTemplateDevice:
      description: >
        What a template fills in: every field of a device node but its
        hostname, its interface handles and where it was included from. A
        device made from the template is named after
        `spec.general.hostname`, made unique in the diagram.
      type: object
      required:
        - spec
      properties:
        iconKey:
          description: one of the Builder's icon keys
          type: string
        icon:
          description: >
            the name of a custom icon of the icon library, drawn in place of
            `iconKey` while the library has an icon of that name
          type: string
          pattern: "^[A-Za-z0-9_@.-]{1,64}$"
        iconSize:
          description: >
            the size of the icon of a device made from the template, on the
            canvas: small (16 pixels), medium (24) or large (32). Empty uses
            the `iconSize` of the diagram
          type: string
          enum:
            - ""
            - small
            - medium
            - large
        outlineColor:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        fillColor:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        purdueLevel:
          description: >
            the level of the Purdue model of a device made from the
            template. Empty is none.
          type: string
          enum:
            - ""
            - "5"
            - "4"
            - "3.5"
            - "3"
            - "2"
            - "1"
            - "0"
        spec:
          description: >
            a complete phenix node spec, as a device node holds it. At most
            16384 bytes as JSON together with the other fields. Its
            `general.hostname` is required and holds no white space. The
            server does not check it against the phenix node schema.
          type: object
          additionalProperties: true
    BuilderTemplateShare:
      description: one user a template or a collection is shared with
      type: object
      properties:
        user:
          type: string
        grantedAt:
          type: string
          format: date-time
        stale:
          description: >
            the account the item was shared with was deleted, or replaced by
            a new one under the same name, so this share grants nothing
          type: boolean
    BuilderTemplate:
      type: object
      properties:
        id:
          description: >
            unique only in the library of the owner. The built-in templates
            keep their short names in every library. All other IDs are UUIDs.
            A template that the server read from a template file has an ID
            that starts with `server-`. The ID comes from the file name and
            the template name, and is the same at every start.
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
        owner:
          description: >
            the user whose library holds the template. Empty for a template
            that the server read from a template file
          type: string
        source:
          description: >
            `own` for a template of the library of the caller. `shared` for a
            template that another user shared with the caller. `server` for a
            template published to every user. `preloaded` for a template that
            the server read from a template file
          type: string
          enum:
            - own
            - shared
            - server
            - preloaded
        name:
          type: string
        description:
          description: >
            the text of the template, shown where templates are listed. Never
            written into a node
          type: string
        device:
          $ref: "#/components/schemas/BuilderTemplateDevice"
        version:
          description: >
            starts at 1 and grows by one with every change of the name, the
            description or the device
          type: integer
        etag:
          description: the entity tag of the content, `"<version>"`, for If-Match
          type: string
        created:
          description: left out for a built-in template that was never changed
          type: string
          format: date-time
        updated:
          description: >
            when the content last changed. Left out for a built-in template
            that was never changed
          type: string
          format: date-time
        serverWide:
          description: the template itself is published to every user
          type: boolean
        publishedAt:
          description: left out unless `serverWide`
          type: string
          format: date-time
        publishedBy:
          description: left out unless `serverWide`
          type: string
        collections:
          description: >
            the IDs of the collections of the same owner that hold the
            template and that the caller sees
          type: array
          items:
            type: string
        shares:
          description: >
            who the template is shared with, sorted by user. Sent to its owner
            only, and left out of the items of other owners
          type: array
          items:
            $ref: "#/components/schemas/BuilderTemplateShare"
    BuilderTemplateCollection:
      type: object
      properties:
        id:
          description: >
            unique among the collections of the library of the owner. For a
            collection that the server read from a template file, `server-`
            and a digest of the file name
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
        owner:
          description: >
            the user whose library holds the collection. Empty for a
            collection that the server read from a template file
          type: string
        source:
          description: >
            `own` for a collection of the library of the caller. `shared` for
            a collection that another user shared with the caller. `server`
            for a collection published to every user. `preloaded` for a
            collection that the server read from a template file
          type: string
          enum:
            - own
            - shared
            - server
            - preloaded
        name:
          type: string
        description:
          type: string
        templateIds:
          description: the templates of the collection, in the order given
          type: array
          items:
            type: string
        version:
          description: >
            starts at 1. Increases by one with every change of the name, the
            description or the templates, also when a template of the
            collection is deleted
          type: integer
        etag:
          description: the entity tag of the content, `"<version>"`, for If-Match
          type: string
        created:
          type: string
          format: date-time
        updated:
          description: when the content last changed
          type: string
          format: date-time
        serverWide:
          description: the collection is published to every user
          type: boolean
        publishedAt:
          description: left out unless `serverWide`
          type: string
          format: date-time
        publishedBy:
          description: left out unless `serverWide`
          type: string
        shares:
          description: >
            who the collection is shared with, sorted by user. Sent to its
            owner only, and left out of the items of other owners
          type: array
          items:
            $ref: "#/components/schemas/BuilderTemplateShare"
    BuilderTemplateLibrary:
      type: object
      properties:
        owner:
          description: the caller, whose library the write routes change
          type: string
        templates:
          description: >
            the caller's own templates, in the order they were added, then
            the templates of other users shared with the caller or published,
            by owner
          type: array
          items:
            $ref: "#/components/schemas/BuilderTemplate"
        collections:
          description: >
            the caller's own collections, in the order they were added, then
            the collections of other users shared with the caller or
            published, by owner. Every ID in a collection's `templateIds` is
            in `templates`.
          type: array
          items:
            $ref: "#/components/schemas/BuilderTemplateCollection"
        preloaded:
          description: >
            the collections that the server read from its template files at
            start, in the order of the file names, each with its templates.
            Read only, and the same for every caller
          type: array
          items:
            type: object
            properties:
              collection:
                $ref: "#/components/schemas/BuilderTemplateCollection"
              templates:
                type: array
                items:
                  $ref: "#/components/schemas/BuilderTemplate"
        canShare:
          description: >
            the caller may share its templates and collections: it has
            `configs` `update` and a user account
          type: boolean
        canPublish:
          description: >
            the caller may publish its templates and collections to every
            user, and take any user's published item back: it has `configs`
            `update` and `builder-templates` `publish`
          type: boolean
        damaged:
          description: >
            this server cannot read the library record of the caller, so the
            response lists none of its items
          type: boolean
        limits:
          type: object
          properties:
            templates:
              description: the most templates a library holds
              type: integer
            collections:
              description: the most collections a library holds
              type: integer
            shares:
              description: the most users one template or collection is shared with
              type: integer
            nameBytes:
              description: the most bytes a template or collection name has
              type: integer
            descriptionBytes:
              description: the most bytes a description has
              type: integer
            deviceBytes:
              description: the most bytes a template's `device` takes as JSON
              type: integer
    BuilderTemplateContent:
      type: object
      additionalProperties: false
      required:
        - name
        - device
      properties:
        name:
          description: 1 to 128 bytes, not blank, without control characters
          type: string
        description:
          description: at most 1024 bytes, without control characters
          type: string
        device:
          $ref: "#/components/schemas/BuilderTemplateDevice"
    BuilderTemplateCreate:
      type: object
      additionalProperties: false
      required:
        - templates
      properties:
        templates:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required:
              - name
              - device
            properties:
              name:
                description: 1 to 128 bytes, not blank, without control characters
                type: string
              description:
                description: at most 1024 bytes, without control characters
                type: string
              device:
                $ref: "#/components/schemas/BuilderTemplateDevice"
        collection:
          description: a new collection to hold exactly the new templates
          type: object
          additionalProperties: false
          required:
            - name
          properties:
            name:
              type: string
            description:
              type: string
    BuilderTemplateCreateResult:
      type: object
      properties:
        created:
          description: the new templates, in the order of the request
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              etag:
                type: string
        collection:
          description: the new collection, when the request asked for one
          type: object
          properties:
            id:
              type: string
            etag:
              type: string
    BuilderTemplateCollectionContent:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          description: 1 to 128 bytes, not blank, without control characters
          type: string
        description:
          description: at most 1024 bytes, without control characters
          type: string
        templateIds:
          description: templates of this library, each named once
          type: array
          maxItems: 200
          items:
            type: string
    BuilderTemplateSelection:
      description: at least one ID in all
      type: object
      additionalProperties: false
      properties:
        templates:
          type: array
          items:
            type: string
        collections:
          type: array
          items:
            type: string
    BuilderTemplateDeleteResult:
      type: object
      properties:
        deleted:
          type: object
          properties:
            templates:
              type: integer
            collections:
              type: integer
    BuilderTemplateRestore:
      description: the built-in templates to restore. No list, or an empty list, means every missing one
      type: object
      additionalProperties: false
      properties:
        templates:
          description: built-in template IDs. The server ignores other IDs
          type: array
          items:
            type: string
    BuilderTemplateRestoreResult:
      type: object
      properties:
        restored:
          description: the IDs of the restored templates, in built-in order. Empty when none was missing
          type: array
          items:
            type: string
    BuilderTemplateShareUpdate:
      description: at least one template or collection, and at least one user
      type: object
      additionalProperties: false
      properties:
        templates:
          type: array
          items:
            type: string
        collections:
          type: array
          items:
            type: string
        add:
          description: users to share the items with. At most 25
          type: array
          items:
            type: string
        remove:
          description: users to stop sharing the items with
          type: array
          items:
            type: string
    BuilderTemplatePublishUpdate:
      description: at least one template or collection
      type: object
      additionalProperties: false
      required:
        - serverWide
      properties:
        templates:
          type: array
          items:
            type: string
        collections:
          type: array
          items:
            type: string
        serverWide:
          description: true to publish the items to every user, false to take them back
          type: boolean
    BuilderTemplateResult:
      type: object
      properties:
        failed:
          description: the items that did not change. Empty when every item changed
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                  - template
                  - collection
              id:
                type: string
              reason:
                description: >
                  `not-found` (the library holds no such item) or `too-many`
                  (the item would be shared with more than 25 users)
                type: string
                enum:
                  - not-found
                  - too-many
              code:
                description: >
                  the code of the reason: `template.item.not-found` or
                  `template.shares.too-many`
                type: string
                enum:
                  - template.item.not-found
                  - template.shares.too-many
    Workflow:
      type: object
      title: Workflow
      description: >-
        A phenix workflow config: what applying a workflow branch creates,
        updates or restarts one experiment from.
      additionalProperties: false
      required:
        - apiVersion
        - kind
        - spec
      properties:
        apiVersion:
          type: string
          title: API Version
          description: The config API version; a workflow config is phenix.sandia.gov/v0.
          enum:
            - phenix.sandia.gov/v0
        kind:
          type: string
          title: Kind
          description: The config kind, which is always Workflow.
          enum:
            - Workflow
        metadata:
          type: object
          title: Metadata
          description: >-
            Not read by the server; it is accepted so a workflow config has the
            same four top-level keys as every other phenix config, and so a later
            version can carry a name or annotations without a breaking change.
          nullable: true
        spec:
          type: object
          title: Workflow Spec
          description: >-
            What an apply may do and the experiment settings it sets; an empty
            spec applies every default.
          additionalProperties: false
          properties:
            auto:
              type: object
              title: Auto
              description: What an apply may do to the experiment mapped to the workflow branch without being asked.
              nullable: true
              additionalProperties: false
              properties:
                create:
                  type: string
                  title: Create
                  description: >-
                    The name of the experiment to create when none is mapped to
                    the branch; unset never creates one.
                  nullable: true
                update:
                  type: boolean
                  title: Update
                  description: >-
                    Whether an apply may update the experiment already mapped to
                    the branch; defaults to true when unset.
                  nullable: true
                restart:
                  type: boolean
                  title: Restart
                  description: >-
                    Whether an apply may start a new or updated experiment and
                    stop and restart a running one; defaults to true when unset.
                  nullable: true
            topology:
              type: string
              title: Topology
              description: >-
                The name of the topology config; required to create an
                experiment, and on an update defaults to the experiment's
                current topology.
              nullable: true
            scenario:
              type: string
              title: Scenario
              description: The name of the scenario config; on an update defaults to the experiment's current scenario.
              nullable: true
            vlans:
              type: object
              title: VLANs
              description: >-
                VLAN alias to VLAN ID; every alias used by an interface in the
                topology is set to its ID here, or left for minimega to pick
                when not listed.
              nullable: true
              additionalProperties:
                type: integer
            schedules:
              type: object
              title: Schedules
              description: >-
                VM hostname to cluster host; each listed non-external node of
                the topology is scheduled on that host.
              nullable: true
              additionalProperties:
                type: string
            deployMode:
              type: string
              title: Deploy Mode
              description: >-
                Where VMs are deployed, all, no-headnode or only-headnode in any
                letter case; unset or empty uses the server's deploy-mode
                setting.
              nullable: true
              pattern: '^(?i:all|no-headnode|only-headnode)?$'
            useGREMesh:
              type: boolean
              title: Use GRE Mesh
              description: >-
                Whether the experiment uses a GRE mesh between cluster hosts; it
                is OR-ed with the server's use-gre-mesh setting, so either turns
                it on.
              nullable: true
            vlanRange:
              type: object
              title: VLAN Range
              description: The range of VLAN IDs the experiment may allocate from; unset leaves both ends unset.
              nullable: true
              additionalProperties: false
              properties:
                min:
                  type: integer
                  title: Minimum
                  description: The lowest VLAN ID the experiment may use; 0 leaves the minimum unset.
                  nullable: true
                max:
                  type: integer
                  title: Maximum
                  description: The highest VLAN ID the experiment may use; 0 leaves the maximum unset.
                  nullable: true
            defaultBridge:
              type: string
              title: Default Bridge
              description: >-
                The bridge the experiment's VMs attach to by default; defaults to
                phenix, is at most 15 characters (the Linux interface name
                limit), and unless it is phenix no other experiment may use it.
              nullable: true
              maxLength: 15
    WorkflowResult:
      type: object
      properties:
        action:
          type: string
          enum:
            - none
            - create
            - createAndStart
            - update
            - updateAndStart
            - restart
        experiment:
          type: string
          description: experiment the action applies to (empty when no experiment is involved)
        reason:
          type: string
          description: why nothing was done, when action is none
        dryRun:
          type: boolean
          description: true when nothing was changed because dryRun was requested
    WorkflowConfigResult:
      type: object
      description: what POST /workflow/configs/{branch}?dryRun=true would do
      properties:
        action:
          type: string
          enum:
            - create
            - update
          description: whether the request would create the config or update the stored one
        kind:
          type: string
          description: the config's kind, e.g. Topology
        name:
          type: string
          description: the config's name after the server filled in its placeholders, such as ${BRANCH_NAME}
        dryRun:
          type: boolean
          description: always true
        pending:
          type: string
          description: >
            the value to pass as pending to a dry run of
            POST /workflow/apply/{branch}: Kind/name, followed for a scenario by
            ?from=...&topology=... (its fromScenario names and topology
            annotation) and for a topology that includes others by ?include=...
    Options:
      type: object
      properties:
        bridge-mode:
          type: string
        deploy-mode:
          type: string
        use-gre-mesh:
          type: boolean
        base-dir.injects:
          type: string
          description: directory phenix workflow apply stages injects into
        workflow-dry-run:
          type: boolean
          description: >
            true when POST /workflow/configs/{branch} and POST /workflow/apply/{branch}
            support dryRun, and apply supports pending and expect
    Error:
      type: object
      properties:
        message:
          type: string
          description: what went wrong; for a config validation failure, the first explained line
        cause:
          type: string
          description: the underlying error text
        metadata:
          type: object
          description: extra details, returned for some errors
          properties:
            validation:
              type: string
              description: >
                for a schema validation failure, the explained lines separated by
                newlines, each in the form <item> "<hostname|name>" (line N): <what>
                (at <sub-path>), with (line N) left out for single-line sources and
                an extra hint line for a misplaced key; an error that cannot be
                placed in the source (in a templated key, in data a config hook
                added, in a YAML merge key, or a missing or misindented
                metadata.name) keeps the validator's text; for an unparsable body
                sent to POST /configs, the parser error
            validation-raw:
              type: string
              description: for a schema validation failure, the original validator text
          additionalProperties:
            type: string
  parameters:
    BuilderDraftOwner:
      name: owner
      in: path
      description: the user that owns the draft
      required: true
      schema:
        type: string
    BuilderDraftID:
      name: draft
      in: path
      description: draft ID
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    BuilderIfMatch:
      name: If-Match
      in: header
      description: >
        The ETag of the draft revision that the change is based on: exactly
        one strong, quoted entity tag, such as `"3"`. A missing header, a
        wildcard or a weak tag gets 400. A tag that names any other revision
        gets 412.
      required: true
      schema:
        type: string
    BuilderTemplateOwner:
      name: owner
      in: path
      description: >
        the user whose template library is changed, which must be the caller
        (`owner` of GET /builder/templates)
      required: true
      schema:
        type: string
    BuilderTemplateID:
      name: template
      in: path
      description: template ID
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    BuilderTemplateCollectionID:
      name: collection
      in: path
      description: collection ID
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    BuilderTemplateIfMatch:
      name: If-Match
      in: header
      description: >
        The `etag` of the template or collection that the change is based
        on: exactly one strong, quoted entity tag, such as `"3"`. A missing
        header, a wildcard or a weak tag gets 400. A tag that does not name
        the current content gets 412.
      required: true
      schema:
        type: string
  headers:
    BuilderETag:
      description: the draft's revision as a quoted entity tag, for the next If-Match
      schema:
        type: string
    BuilderSharesETag:
      description: >
        the entity tag of the list of who a draft is shared with,
        `"shares-N"`, for the next If-Match of PUT
      schema:
        type: string
    BuilderTemplateETag:
      description: >
        the entity tag of the template's or collection's content,
        `"<version>"`, for the next If-Match
      schema:
        type: string
    BuilderWarning:
      description: >
        Set when the change succeeded, but the removal of the content that it
        replaced failed. Only the server log has the cause.
      schema:
        type: string
  responses:
    BuilderBadRequest:
      description: >
        The request is malformed. Its body is not a single JSON value of the
        expected shape (the server refuses unknown fields). Or its If-Match
        header is missing or not a single strong entity tag.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderForbidden:
      description: >
        The role of the caller does not have a permission that the operation
        requires. Or the caller can see the draft but may not do this
        operation on it. Examples: a save with a view share, a delete with
        any share, or a share change by a caller who does not own the draft.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderNotFound:
      description: >
        The resource does not exist. Or it is the draft of another user that
        the caller may not see (not shared with the caller, and no
        `builder-drafts` permission). The answer is the same as for a
        resource that does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderConflict:
      description: >
        The draft or a target config changed during the request. A draft that
        changed has the code `draft.conflict`. Read the draft again and try
        again.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderPreconditionFailed:
      description: >
        The If-Match header does not name the draft's current revision
        (`draft.stale`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderTooLarge:
      description: >
        The request body or the document is larger than the size limits of
        the server. The snapshot history never is. The server removes its
        oldest snapshots instead.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderUnprocessable:
      description: >
        The request is well formed but cannot be applied, for example a
        document that fails validation or a config that cannot be converted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderIconNotFound:
      description: >
        No icon of the icon library has the name in the path, nor keeps it
        as an alias, ignoring case. The message never repeats the path.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderTemplateNotFound:
      description: >
        `{owner}` is not the caller. Only its owner changes a library,
        whatever the role of the caller. Or the library holds no template or
        collection with the ID in the path.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderTemplateDamaged:
      description: >
        This version of phenix cannot read the library record, so it cannot
        change it. Or the request names a template or a collection that the
        server read from one of its template files (`source` `preloaded`).
        Nobody can change such an item. `message` names it and says to copy
        it to the library instead.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderTemplatePreconditionFailed:
      description: >
        The If-Match header does not name the current content of the
        template or collection. The response carries the current entity tag.
      headers:
        ETag:
          $ref: "#/components/headers/BuilderTemplateETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderTemplateTooLarge:
      description: >
        The request body is larger than the route allows (6 MiB to add
        templates, 1 MiB to replace one, 64 KiB otherwise). Or the library
        would hold more than 200 templates, 50 collections or 200 templates
        in one collection, or use more than 512 KiB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderTemplateUnprocessable:
      description: >
        The request is well formed but cannot be applied. `message` says why.
        It names a template that is not valid by its place in the request
        and the field, such as `templates[0].name: template name is
        required` or `templates[0].device.icon: icon name "a b" must be 1 to
        64 letters, digits, "_", "@", "." or "-"`. A collection is refused
        for its name, its description, or a template that the library does
        not hold or that the collection names twice.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    BuilderTemplateBusy:
      description: >
        The library kept changing during the request. Try again.
      headers:
        Retry-After:
          description: seconds to wait before trying again
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
    InsufficientStorage:
      description: >
        etcd is out of space, so nothing was saved. `message` says what an
        administrator must do. The same request succeeds after space is
        freed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebError"
