syntax = "proto3";

option go_package = "web/proto";

import "google/protobuf/struct.proto";

message VM {
  string name = 1;
  string host = 2;
  repeated string ipv4 = 3;
  uint32 cpus = 4;
  uint32 ram = 5;
  string disk = 6;
  double uptime = 7;
  repeated string networks = 8;
  repeated string taps = 9;
  repeated Capture captures = 10;
  bool do_not_boot = 11 [json_name="dnb"];
  string screenshot = 12;
  bool running = 13;
  bool busy = 14;
  string experiment = 15;
  string state = 16;
  string cd_rom = 17;
  map<string, string> tags = 18;
  bool cc_active = 19;
  bool external = 20;
  string delayed_start = 21 [json_name="delayed_start"];
  bool snapshot = 22 [json_name="snapshot"];
  uint32 inject_partition = 23 [json_name="inject_partition"];
  string description = 24;
  // the node's annotations; only a single VM's GET response, and its PATCH
  // response to a caller who may get the VM, carry them, not VM lists or
  // broadcasts
  google.protobuf.Struct annotations = 25;
  // the guest operating system its topology node gives (hardware.os_type)
  string os_type = 26 [json_name="os_type"];
}

message VMList {
  repeated VM vms = 1;
  uint32 total = 2;
  // minimega did not answer for every VM of a running experiment: VMs it did
  // not report are listed as configured, with no state
  bool runtime_unknown = 3 [json_name="runtime_unknown"];
  // when minimega was read for the VMs (RFC 3339), empty when it was not
  string observed_at = 4 [json_name="observed_at"];
  // the VMs a bulk update left unchanged, and why; only PATCH fills it
  repeated VMItemError errors = 5;
  // every distinct label on the VMs the role may list, unfiltered and unpaged,
  // ordered by key then value; only VM list reads fill it
  repeated VMLabel labels = 6;
  // every distinct cluster host running the VMs the role may list, unfiltered
  // and unpaged, sorted; only VM list reads fill it
  repeated string hosts = 7;
  // how many of the VMs the role may list are running, unfiltered and
  // unpaged; only VM list reads fill it
  uint32 running = 8;
}

// VMLabel is one key=value label a VM carries.
message VMLabel {
  string key = 1;
  string value = 2;
}

// VMItemError is one VM a bulk update left unchanged: "skipped" when the role
// may not change it, "failed" when its change did not take.
message VMItemError {
  string name = 1;
  string status = 2;
  string error = 3;
}

message Capture {
  string vm = 1;
  uint32 interface = 2;
  string filepath = 3;
}

message CaptureList {
  repeated Capture captures = 1;
}

message SnapshotList {
  repeated string snapshots = 1;
}

message VMRedeployRequest {
  string name = 1;
  uint32 cpus = 2;
  uint32 ram = 3;
  string disk = 4;
  bool injects = 5;
}

enum TagUpdateMode {
  NONE = 0;
  // sets all tags
  SET = 1;
  // adds (or replaces if already present) tags
  ADD = 2;
}

message UpdateVMRequest {
  string exp = 1;
  string name = 2;
  uint32 cpus = 3;
  uint32 ram = 4;
  string disk = 5;

  oneof boot {
    bool do_not_boot = 6 [json_name="dnb"];
  }

  VMInterface interface = 7;

  oneof cluster_host {
    string host = 8;
  }

  oneof snapshot_option {
    bool snapshot = 9 [json_name="snapshot"];
  }

  uint32 inject_partition = 10 [json_name="inject_partition"];
  TagUpdateMode tag_update_mode = 11 [json_name="tag_update_mode"];
  map<string, string> tags = 12;
  // replaces all of the node's annotations when set
  google.protobuf.Struct annotations = 13;
}

message UpdateVMRequestList {
  repeated UpdateVMRequest vms = 1;
  uint32 total = 2;
}

message VMInterface {
  uint32 index = 1;
  string vlan = 2;
}

message MemorySnapshotRequest {
	string filename = 1;
}

message MemorySnapshotResponse {
	string disk = 1;
	VM vm = 2;
}

message CaptureSubnetRequest {
  string subnet = 1;
  repeated string vms = 2;
}

message VMNameList {
  repeated string vms = 1;
}